pack:
  schema_version: 1
  slug: ai
  name: AI / ML
  version: 1.0.1
  pack_type: full
  author: Precogly
  description: |
    Vendor-neutral AI/ML threat library covering LLMs, vector databases, embedding
    services, agent orchestrators, tool executors, MCP servers, guardrails, training
    pipelines, model registries, and AI gateways. Threats sourced from OWASP GenAI
    LLM Top 10, OWASP Agentic Top 10, OWASP MCP Top 10, OWASP RAG Security Cheat
    Sheet, and MITRE ATLAS. Countermeasures mapped to OWASP AISVS and OWASP ASVS,
    informed by AIDEFEND defensive controls. Designed as a base layer that
    provider-specific packs (AWS, Azure, GCP) overlay with service-specific threats
    and controls.
  tags:
  - ai
  - ml
  - llm
  - agents
  - mcp
  - rag
  - vendor-neutral
  depends_on:
  - taxonomies/stride-taxonomy
  - taxonomies/cwe
  - taxonomies/capec
  - taxonomies/mitre-attack
  - taxonomies/mitre-atlas
  - taxonomies/owasp-llm-top-10
  - taxonomies/owasp-agentic-top-10
  - taxonomies/owasp-mcp-top-10
  - standards/owasp-aisvs
  - standards/owasp-asvs
  - standards/owasp-top-10
