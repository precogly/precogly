template:
  slug: ai-training-pipeline
  name: "AI Training Pipeline"
  description: "Model training and fine-tuning pipeline with data curation, training infrastructure, model registry, and evaluation"
  category: ai
  diagram_type: level1

canvas_data:
  nodes:
    # ---- External Actors ----
    - id: "actor-ml-engineer"
      type: "humanActor"
      position: { x: 60, y: 200 }
      data:
        label: "ML Engineer"
        actorType: "user"
        description: "ML engineer managing training jobs and model deployment"

    - id: "actor-data-source"
      type: "systemActor"
      position: { x: 60, y: 500 }
      data:
        label: "Data Sources"
        systemType: "service"
        description: "External data sources for training data collection"

    - id: "actor-serving"
      type: "systemActor"
      position: { x: 1180, y: 200 }
      data:
        label: "Model Serving"
        systemType: "service"
        description: "Production inference endpoint consuming deployed models"

    # ---- System Scope ----
    - id: "scope-system"
      type: "systemScope"
      position: { x: 250, y: 30 }
      style: { width: 880, height: 620 }
      data:
        label: "Training Pipeline"

    # ---- Trust Zones ----
    - id: "tz-data-prep"
      type: "trustZone"
      parentId: "scope-system"
      position: { x: 30, y: 45 }
      style: { width: 260, height: 540 }
      data:
        label: "Data Preparation"
        zoneType: "trust"
        trustLevel: 50

    - id: "tz-training"
      type: "trustZone"
      parentId: "scope-system"
      position: { x: 320, y: 45 }
      style: { width: 250, height: 260 }
      data:
        label: "Training Infrastructure"
        zoneType: "trust"
        trustLevel: 75

    - id: "tz-registry"
      type: "trustZone"
      parentId: "scope-system"
      position: { x: 600, y: 45 }
      style: { width: 250, height: 260 }
      data:
        label: "Model Management"
        zoneType: "trust"
        trustLevel: 75

    - id: "tz-eval"
      type: "trustZone"
      parentId: "scope-system"
      position: { x: 320, y: 335 }
      style: { width: 530, height: 250 }
      data:
        label: "Evaluation"
        zoneType: "trust"
        trustLevel: 50

    # ---- Data Preparation ----
    - id: "process-data-curation"
      type: "process"
      parentId: "tz-data-prep"
      position: { x: 50, y: 30 }
      style: { width: 160, height: 70 }
      data:
        label: "Data Curation"
        description: "Data collection, cleaning, labeling, and validation"

    - id: "process-pii-scrubbing"
      type: "process"
      parentId: "tz-data-prep"
      position: { x: 50, y: 150 }
      style: { width: 160, height: 70 }
      data:
        label: "PII Scrubbing"
        description: "Sensitive data detection and redaction"

    - id: "datastore-training-data"
      type: "datastore"
      parentId: "tz-data-prep"
      position: { x: 45, y: 290 }
      style: { width: 170, height: 90 }
      data:
        label: "Training Dataset"
        component_ref: "ai/document-store"
        description: "Curated and validated training data"
        dataSensitivity: "restricted"

    # ---- Training Infrastructure ----
    - id: "process-training"
      type: "process"
      parentId: "tz-training"
      position: { x: 45, y: 30 }
      style: { width: 160, height: 70 }
      data:
        label: "Training Pipeline"
        component_ref: "ai/training-pipeline"
        description: "Model training and fine-tuning execution"

    - id: "process-embedding-training"
      type: "process"
      parentId: "tz-training"
      position: { x: 45, y: 150 }
      style: { width: 160, height: 70 }
      data:
        label: "Embedding Training"
        component_ref: "ai/embedding-service"
        description: "Embedding model training and calibration"

    # ---- Model Management ----
    - id: "process-registry"
      type: "process"
      parentId: "tz-registry"
      position: { x: 45, y: 30 }
      style: { width: 160, height: 70 }
      data:
        label: "Model Registry"
        component_ref: "ai/model-registry"
        description: "Model versioning, signing, and deployment gating"

    - id: "datastore-model-artifacts"
      type: "datastore"
      parentId: "tz-registry"
      position: { x: 40, y: 150 }
      style: { width: 170, height: 90 }
      data:
        label: "Model Artifacts"
        component_ref: "ai/model-registry"
        description: "Trained model weights, configs, and metadata"
        dataSensitivity: "restricted"

    # ---- Evaluation ----
    - id: "process-eval"
      type: "process"
      parentId: "tz-eval"
      position: { x: 60, y: 40 }
      style: { width: 160, height: 70 }
      data:
        label: "Evaluation Harness"
        component_ref: "ai/evaluation-harness"
        description: "Automated model evaluation and safety testing"

    - id: "datastore-eval-data"
      type: "datastore"
      parentId: "tz-eval"
      position: { x: 290, y: 40 }
      style: { width: 170, height: 90 }
      data:
        label: "Evaluation Datasets"
        component_ref: "ai/evaluation-harness"
        description: "Benchmark and test datasets for model evaluation"
        dataSensitivity: "confidential"

  edges:
    - id: "edge-engineer-to-curation"
      source: "actor-ml-engineer"
      target: "process-data-curation"
      type: "dataFlow"
      data:
        label: "Data pipeline config"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-datasource-to-curation"
      source: "actor-data-source"
      target: "process-data-curation"
      type: "dataFlow"
      data:
        label: "Raw data"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-curation-to-pii"
      source: "process-data-curation"
      target: "process-pii-scrubbing"
      type: "dataFlow"
      data:
        label: "Cleaned data"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-pii-to-dataset"
      source: "process-pii-scrubbing"
      target: "datastore-training-data"
      type: "dataFlow"
      data:
        label: "Scrubbed data"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-dataset-to-training"
      source: "datastore-training-data"
      target: "process-training"
      type: "dataFlow"
      data:
        label: "Training data read"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-dataset-to-embed-training"
      source: "datastore-training-data"
      target: "process-embedding-training"
      type: "dataFlow"
      data:
        label: "Embedding training data"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-training-to-registry"
      source: "process-training"
      target: "process-registry"
      type: "dataFlow"
      data:
        label: "Trained model"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-embed-to-registry"
      source: "process-embedding-training"
      target: "process-registry"
      type: "dataFlow"
      data:
        label: "Embedding model"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-registry-to-artifacts"
      source: "process-registry"
      target: "datastore-model-artifacts"
      type: "dataFlow"
      data:
        label: "Versioned artifacts"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-registry-to-eval"
      source: "process-registry"
      target: "process-eval"
      type: "dataFlow"
      data:
        label: "Model for evaluation"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-eval-to-evaldata"
      source: "process-eval"
      target: "datastore-eval-data"
      type: "dataFlow"
      data:
        label: "Evaluation results"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-evaldata-to-eval"
      source: "datastore-eval-data"
      target: "process-eval"
      type: "dataFlow"
      data:
        label: "Test datasets"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-eval-to-registry"
      source: "process-eval"
      target: "process-registry"
      type: "dataFlow"
      data:
        label: "Evaluation gate result"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-registry-to-serving"
      source: "process-registry"
      target: "actor-serving"
      type: "dataFlow"
      data:
        label: "Approved model deployment"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-engineer-to-training"
      source: "actor-ml-engineer"
      target: "process-training"
      type: "dataFlow"
      data:
        label: "Training config"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]
