template:
  slug: ai-agentic-rag
  name: "Agentic RAG Application"
  description: "RAG application with autonomous agent orchestration, tool execution, and MCP server integration"
  category: ai
  diagram_type: level1

canvas_data:
  nodes:
    # ---- External Actors ----
    - id: "actor-user"
      type: "humanActor"
      position: { x: 60, y: 280 }
      data:
        label: "User"
        actorType: "user"
        description: "End user interacting with the agentic application"

    - id: "actor-llm-provider"
      type: "systemActor"
      position: { x: 1220, y: 100 }
      data:
        label: "LLM Provider"
        systemType: "service"
        description: "External LLM inference service"

    - id: "actor-external-api"
      type: "systemActor"
      position: { x: 1220, y: 500 }
      data:
        label: "External APIs"
        systemType: "service"
        description: "Third-party services accessed via tools and MCP"

    # ---- System Scope ----
    - id: "scope-system"
      type: "systemScope"
      position: { x: 250, y: 30 }
      style: { width: 920, height: 720 }
      data:
        label: "Agentic RAG Application"

    # ---- Trust Zones ----
    - id: "tz-edge"
      type: "trustZone"
      parentId: "scope-system"
      position: { x: 30, y: 45 }
      style: { width: 220, height: 640 }
      data:
        label: "Edge / API"
        zoneType: "trust"
        trustLevel: 0

    - id: "tz-orchestration"
      type: "trustZone"
      parentId: "scope-system"
      position: { x: 280, y: 45 }
      style: { width: 340, height: 350 }
      data:
        label: "Agent Orchestration"
        zoneType: "trust"
        trustLevel: 50

    - id: "tz-tools"
      type: "trustZone"
      parentId: "scope-system"
      position: { x: 650, y: 45 }
      style: { width: 240, height: 350 }
      data:
        label: "Tool Execution"
        zoneType: "trust"
        trustLevel: 50

    - id: "tz-data"
      type: "trustZone"
      parentId: "scope-system"
      position: { x: 280, y: 425 }
      style: { width: 610, height: 250 }
      data:
        label: "Data Tier"
        zoneType: "trust"
        trustLevel: 75

    # ---- Edge Processes ----
    - id: "process-gateway"
      type: "process"
      parentId: "tz-edge"
      position: { x: 30, y: 30 }
      style: { width: 160, height: 70 }
      data:
        label: "AI Gateway"
        component_ref: "ai/ai-gateway"
        description: "API gateway with auth, rate limiting, and logging"

    - id: "process-input-guardrail"
      type: "process"
      parentId: "tz-edge"
      position: { x: 30, y: 160 }
      style: { width: 160, height: 70 }
      data:
        label: "Input Guardrail"
        component_ref: "ai/guardrail"
        description: "Input validation and prompt injection detection"

    - id: "process-output-guardrail"
      type: "process"
      parentId: "tz-edge"
      position: { x: 30, y: 290 }
      style: { width: 160, height: 70 }
      data:
        label: "Output Guardrail"
        component_ref: "ai/guardrail"
        description: "Output filtering and safety checks"

    # ---- Agent Orchestration ----
    - id: "process-agent"
      type: "process"
      parentId: "tz-orchestration"
      position: { x: 50, y: 30 }
      style: { width: 160, height: 70 }
      data:
        label: "Agent Orchestrator"
        component_ref: "ai/agent-orchestrator"
        description: "Autonomous agent with planning and tool-use capabilities"

    - id: "process-llm"
      type: "process"
      parentId: "tz-orchestration"
      position: { x: 50, y: 150 }
      style: { width: 160, height: 70 }
      data:
        label: "LLM"
        component_ref: "ai/llm"
        description: "Large language model for reasoning and generation"

    - id: "process-embedding"
      type: "process"
      parentId: "tz-orchestration"
      position: { x: 50, y: 250 }
      style: { width: 160, height: 70 }
      data:
        label: "Embedding Service"
        component_ref: "ai/embedding-service"
        description: "Text-to-vector embedding for semantic search"

    # ---- Tool Execution ----
    - id: "process-tool-executor"
      type: "process"
      parentId: "tz-tools"
      position: { x: 40, y: 30 }
      style: { width: 160, height: 70 }
      data:
        label: "Tool Executor"
        component_ref: "ai/tool-executor"
        description: "Sandboxed execution environment for agent tool calls"

    - id: "process-mcp-server"
      type: "process"
      parentId: "tz-tools"
      position: { x: 40, y: 150 }
      style: { width: 160, height: 70 }
      data:
        label: "MCP Server"
        component_ref: "ai/mcp-server"
        description: "Model Context Protocol server for external tool access"

    # ---- Data Stores ----
    - id: "datastore-vectordb"
      type: "datastore"
      parentId: "tz-data"
      position: { x: 40, y: 40 }
      style: { width: 170, height: 90 }
      data:
        label: "Vector Database"
        component_ref: "ai/vector-database"
        description: "Stores document embeddings for RAG retrieval"
        dataSensitivity: "confidential"

    - id: "datastore-documents"
      type: "datastore"
      parentId: "tz-data"
      position: { x: 250, y: 40 }
      style: { width: 170, height: 90 }
      data:
        label: "Document Store"
        component_ref: "ai/document-store"
        description: "Source documents for the knowledge base"
        dataSensitivity: "confidential"

  edges:
    - id: "edge-user-to-gateway"
      source: "actor-user"
      target: "process-gateway"
      type: "dataFlow"
      data:
        label: "User query"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-gateway-to-input-guard"
      source: "process-gateway"
      target: "process-input-guardrail"
      type: "dataFlow"
      data:
        label: "Authenticated query"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-input-guard-to-agent"
      source: "process-input-guardrail"
      target: "process-agent"
      type: "dataFlow"
      data:
        label: "Validated query"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-agent-to-llm"
      source: "process-agent"
      target: "process-llm"
      type: "dataFlow"
      data:
        label: "Reasoning request"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-llm-to-agent"
      source: "process-llm"
      target: "process-agent"
      type: "dataFlow"
      data:
        label: "Reasoning result"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-llm-to-provider"
      source: "process-llm"
      target: "actor-llm-provider"
      type: "dataFlow"
      data:
        label: "Inference request"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["api-key"]

    - id: "edge-provider-to-llm"
      source: "actor-llm-provider"
      target: "process-llm"
      type: "dataFlow"
      data:
        label: "Model completion"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["api-key"]

    - id: "edge-agent-to-tool"
      source: "process-agent"
      target: "process-tool-executor"
      type: "dataFlow"
      data:
        label: "Tool invocation"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-tool-to-agent"
      source: "process-tool-executor"
      target: "process-agent"
      type: "dataFlow"
      data:
        label: "Tool result"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-agent-to-mcp"
      source: "process-agent"
      target: "process-mcp-server"
      type: "dataFlow"
      data:
        label: "MCP tool call"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-mcp-to-agent"
      source: "process-mcp-server"
      target: "process-agent"
      type: "dataFlow"
      data:
        label: "MCP tool result"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-mcp-to-external"
      source: "process-mcp-server"
      target: "actor-external-api"
      type: "dataFlow"
      data:
        label: "External API call"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-external-to-mcp"
      source: "actor-external-api"
      target: "process-mcp-server"
      type: "dataFlow"
      data:
        label: "API response"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-agent-to-embedding"
      source: "process-agent"
      target: "process-embedding"
      type: "dataFlow"
      data:
        label: "Retrieval request"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-embedding-to-vectordb"
      source: "process-embedding"
      target: "datastore-vectordb"
      type: "dataFlow"
      data:
        label: "Vector similarity search"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-vectordb-to-agent"
      source: "datastore-vectordb"
      target: "process-agent"
      type: "dataFlow"
      data:
        label: "Retrieved context"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-documents-to-embedding"
      source: "datastore-documents"
      target: "process-embedding"
      type: "dataFlow"
      data:
        label: "Document ingestion"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-agent-to-output-guard"
      source: "process-agent"
      target: "process-output-guardrail"
      type: "dataFlow"
      data:
        label: "Agent response"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-output-guard-to-gateway"
      source: "process-output-guardrail"
      target: "process-gateway"
      type: "dataFlow"
      data:
        label: "Validated response"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-gateway-to-user"
      source: "process-gateway"
      target: "actor-user"
      type: "dataFlow"
      data:
        label: "AI response"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]
