template:
  slug: ai-rag-basic
  name: "Basic RAG Application"
  description: "Vendor-neutral Retrieval-Augmented Generation application with LLM, vector database, and document store"
  category: ai
  diagram_type: level1

canvas_data:
  nodes:
    # ---- External Actors ----
    - id: "actor-user"
      type: "humanActor"
      position: { x: 60, y: 280 }
      data:
        label: "User"
        actorType: "user"
        description: "End user sending queries to the RAG application"

    - id: "actor-llm-provider"
      type: "systemActor"
      position: { x: 1140, y: 100 }
      data:
        label: "LLM Provider"
        systemType: "service"
        description: "External LLM inference service"

    # ---- System Scope ----
    - id: "scope-system"
      type: "systemScope"
      position: { x: 250, y: 30 }
      style: { width: 840, height: 620 }
      data:
        label: "RAG Application"

    # ---- Trust Zones ----
    - id: "tz-edge"
      type: "trustZone"
      parentId: "scope-system"
      position: { x: 30, y: 45 }
      style: { width: 220, height: 540 }
      data:
        label: "Edge / API"
        zoneType: "trust"
        trustLevel: 0

    - id: "tz-ai"
      type: "trustZone"
      parentId: "scope-system"
      position: { x: 280, y: 45 }
      style: { width: 260, height: 280 }
      data:
        label: "AI Processing"
        zoneType: "trust"
        trustLevel: 50

    - id: "tz-data"
      type: "trustZone"
      parentId: "scope-system"
      position: { x: 280, y: 355 }
      style: { width: 530, height: 230 }
      data:
        label: "Data Tier"
        zoneType: "trust"
        trustLevel: 75

    # ---- Edge Processes ----
    - id: "process-gateway"
      type: "process"
      parentId: "tz-edge"
      position: { x: 30, y: 30 }
      style: { width: 160, height: 70 }
      data:
        label: "AI Gateway"
        component_ref: "ai/ai-gateway"
        description: "API gateway with auth, rate limiting, and logging"

    - id: "process-input-guardrail"
      type: "process"
      parentId: "tz-edge"
      position: { x: 30, y: 150 }
      style: { width: 160, height: 70 }
      data:
        label: "Input Guardrail"
        component_ref: "ai/guardrail"
        description: "Input validation and prompt injection detection"

    - id: "process-output-guardrail"
      type: "process"
      parentId: "tz-edge"
      position: { x: 30, y: 270 }
      style: { width: 160, height: 70 }
      data:
        label: "Output Guardrail"
        component_ref: "ai/guardrail"
        description: "Output filtering and safety checks"

    # ---- AI Processing ----
    - id: "process-llm"
      type: "process"
      parentId: "tz-ai"
      position: { x: 50, y: 30 }
      style: { width: 160, height: 70 }
      data:
        label: "LLM"
        component_ref: "ai/llm"
        description: "Large language model for response generation"

    - id: "process-embedding"
      type: "process"
      parentId: "tz-ai"
      position: { x: 50, y: 150 }
      style: { width: 160, height: 70 }
      data:
        label: "Embedding Service"
        component_ref: "ai/embedding-service"
        description: "Text-to-vector embedding for semantic search"

    # ---- Data Stores ----
    - id: "datastore-vectordb"
      type: "datastore"
      parentId: "tz-data"
      position: { x: 40, y: 40 }
      style: { width: 170, height: 90 }
      data:
        label: "Vector Database"
        component_ref: "ai/vector-database"
        description: "Stores document embeddings for similarity search"
        dataSensitivity: "confidential"

    - id: "datastore-documents"
      type: "datastore"
      parentId: "tz-data"
      position: { x: 250, y: 40 }
      style: { width: 170, height: 90 }
      data:
        label: "Document Store"
        component_ref: "ai/document-store"
        description: "Source documents for RAG knowledge base"
        dataSensitivity: "confidential"

  edges:
    - id: "edge-user-to-gateway"
      source: "actor-user"
      target: "process-gateway"
      type: "dataFlow"
      data:
        label: "User query"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-gateway-to-input-guard"
      source: "process-gateway"
      target: "process-input-guardrail"
      type: "dataFlow"
      data:
        label: "Authenticated query"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-input-guard-to-embedding"
      source: "process-input-guardrail"
      target: "process-embedding"
      type: "dataFlow"
      data:
        label: "Validated query"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-embedding-to-vectordb"
      source: "process-embedding"
      target: "datastore-vectordb"
      type: "dataFlow"
      data:
        label: "Vector similarity search"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-vectordb-to-llm"
      source: "datastore-vectordb"
      target: "process-llm"
      type: "dataFlow"
      data:
        label: "Retrieved context"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-input-guard-to-llm"
      source: "process-input-guardrail"
      target: "process-llm"
      type: "dataFlow"
      data:
        label: "User query with context"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-llm-to-provider"
      source: "process-llm"
      target: "actor-llm-provider"
      type: "dataFlow"
      data:
        label: "Inference request"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["api-key"]

    - id: "edge-provider-to-llm"
      source: "actor-llm-provider"
      target: "process-llm"
      type: "dataFlow"
      data:
        label: "Model completion"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["api-key"]

    - id: "edge-llm-to-output-guard"
      source: "process-llm"
      target: "process-output-guardrail"
      type: "dataFlow"
      data:
        label: "Raw response"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-output-guard-to-gateway"
      source: "process-output-guardrail"
      target: "process-gateway"
      type: "dataFlow"
      data:
        label: "Validated response"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-gateway-to-user"
      source: "process-gateway"
      target: "actor-user"
      type: "dataFlow"
      data:
        label: "AI response"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-documents-to-embedding"
      source: "datastore-documents"
      target: "process-embedding"
      type: "dataFlow"
      data:
        label: "Document ingestion"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]
