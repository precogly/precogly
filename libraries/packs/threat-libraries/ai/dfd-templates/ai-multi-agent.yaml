template:
  slug: ai-multi-agent
  name: "Multi-Agent Orchestration"
  description: "Multi-agent system with inter-agent communication, shared memory, tool execution, and MCP integration"
  category: ai
  diagram_type: level1

canvas_data:
  nodes:
    # ---- External Actors ----
    - id: "actor-user"
      type: "humanActor"
      position: { x: 60, y: 300 }
      data:
        label: "User"
        actorType: "user"
        description: "End user interacting with the multi-agent system"

    - id: "actor-llm-provider"
      type: "systemActor"
      position: { x: 1220, y: 100 }
      data:
        label: "LLM Provider"
        systemType: "service"
        description: "External LLM inference service"

    - id: "actor-external-api"
      type: "systemActor"
      position: { x: 1220, y: 550 }
      data:
        label: "External APIs"
        systemType: "service"
        description: "Third-party services accessed via MCP and tools"

    # ---- System Scope ----
    - id: "scope-system"
      type: "systemScope"
      position: { x: 250, y: 30 }
      style: { width: 920, height: 740 }
      data:
        label: "Multi-Agent System"

    # ---- Trust Zones ----
    - id: "tz-edge"
      type: "trustZone"
      parentId: "scope-system"
      position: { x: 30, y: 45 }
      style: { width: 220, height: 660 }
      data:
        label: "Edge / API"
        zoneType: "trust"
        trustLevel: 0

    - id: "tz-orchestration"
      type: "trustZone"
      parentId: "scope-system"
      position: { x: 280, y: 45 }
      style: { width: 340, height: 350 }
      data:
        label: "Agent Orchestration"
        zoneType: "trust"
        trustLevel: 50

    - id: "tz-tools"
      type: "trustZone"
      parentId: "scope-system"
      position: { x: 650, y: 45 }
      style: { width: 240, height: 350 }
      data:
        label: "Tool Execution"
        zoneType: "trust"
        trustLevel: 50

    - id: "tz-data"
      type: "trustZone"
      parentId: "scope-system"
      position: { x: 280, y: 425 }
      style: { width: 610, height: 250 }
      data:
        label: "Shared State"
        zoneType: "trust"
        trustLevel: 75

    # ---- Edge Processes ----
    - id: "process-gateway"
      type: "process"
      parentId: "tz-edge"
      position: { x: 30, y: 30 }
      style: { width: 160, height: 70 }
      data:
        label: "AI Gateway"
        component_ref: "ai/ai-gateway"
        description: "API gateway with auth, rate limiting, and logging"

    - id: "process-input-guardrail"
      type: "process"
      parentId: "tz-edge"
      position: { x: 30, y: 160 }
      style: { width: 160, height: 70 }
      data:
        label: "Input Guardrail"
        component_ref: "ai/guardrail"
        description: "Input validation and prompt injection detection"

    - id: "process-output-guardrail"
      type: "process"
      parentId: "tz-edge"
      position: { x: 30, y: 290 }
      style: { width: 160, height: 70 }
      data:
        label: "Output Guardrail"
        component_ref: "ai/guardrail"
        description: "Output filtering and safety checks"

    # ---- Agent Orchestration ----
    - id: "process-supervisor"
      type: "process"
      parentId: "tz-orchestration"
      position: { x: 50, y: 30 }
      style: { width: 160, height: 70 }
      data:
        label: "Supervisor Agent"
        component_ref: "ai/agent-orchestrator"
        description: "Top-level agent that delegates tasks to specialist agents"

    - id: "process-agent-a"
      type: "process"
      parentId: "tz-orchestration"
      position: { x: 50, y: 150 }
      style: { width: 160, height: 70 }
      data:
        label: "Specialist Agent A"
        component_ref: "ai/agent-orchestrator"
        description: "Domain-specific agent for specialized tasks"

    - id: "process-agent-b"
      type: "process"
      parentId: "tz-orchestration"
      position: { x: 50, y: 250 }
      style: { width: 160, height: 70 }
      data:
        label: "Specialist Agent B"
        component_ref: "ai/agent-orchestrator"
        description: "Domain-specific agent for specialized tasks"

    # ---- Tool Execution ----
    - id: "process-tool-executor"
      type: "process"
      parentId: "tz-tools"
      position: { x: 40, y: 30 }
      style: { width: 160, height: 70 }
      data:
        label: "Tool Executor"
        component_ref: "ai/tool-executor"
        description: "Sandboxed execution environment for agent tool calls"

    - id: "process-mcp-server"
      type: "process"
      parentId: "tz-tools"
      position: { x: 40, y: 150 }
      style: { width: 160, height: 70 }
      data:
        label: "MCP Server"
        component_ref: "ai/mcp-server"
        description: "Model Context Protocol server for external integrations"

    - id: "process-llm"
      type: "process"
      parentId: "tz-tools"
      position: { x: 40, y: 250 }
      style: { width: 160, height: 70 }
      data:
        label: "LLM"
        component_ref: "ai/llm"
        description: "Shared LLM inference for all agents"

    # ---- Shared State ----
    - id: "datastore-shared-memory"
      type: "datastore"
      parentId: "tz-data"
      position: { x: 40, y: 40 }
      style: { width: 170, height: 90 }
      data:
        label: "Shared Memory"
        description: "Agent shared context, task state, and conversation history"
        dataSensitivity: "confidential"

    - id: "datastore-vectordb"
      type: "datastore"
      parentId: "tz-data"
      position: { x: 250, y: 40 }
      style: { width: 170, height: 90 }
      data:
        label: "Vector Database"
        component_ref: "ai/vector-database"
        description: "Shared knowledge base for all agents"
        dataSensitivity: "confidential"

  edges:
    - id: "edge-user-to-gateway"
      source: "actor-user"
      target: "process-gateway"
      type: "dataFlow"
      data:
        label: "User request"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-gateway-to-input-guard"
      source: "process-gateway"
      target: "process-input-guardrail"
      type: "dataFlow"
      data:
        label: "Authenticated request"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-input-guard-to-supervisor"
      source: "process-input-guardrail"
      target: "process-supervisor"
      type: "dataFlow"
      data:
        label: "Validated request"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-supervisor-to-agent-a"
      source: "process-supervisor"
      target: "process-agent-a"
      type: "dataFlow"
      data:
        label: "Delegated task"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-agent-a-to-supervisor"
      source: "process-agent-a"
      target: "process-supervisor"
      type: "dataFlow"
      data:
        label: "Task result"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-supervisor-to-agent-b"
      source: "process-supervisor"
      target: "process-agent-b"
      type: "dataFlow"
      data:
        label: "Delegated task"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-agent-b-to-supervisor"
      source: "process-agent-b"
      target: "process-supervisor"
      type: "dataFlow"
      data:
        label: "Task result"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-agents-to-llm"
      source: "process-supervisor"
      target: "process-llm"
      type: "dataFlow"
      data:
        label: "LLM inference request"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-llm-to-agents"
      source: "process-llm"
      target: "process-supervisor"
      type: "dataFlow"
      data:
        label: "Model completion"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-llm-to-provider"
      source: "process-llm"
      target: "actor-llm-provider"
      type: "dataFlow"
      data:
        label: "Inference request"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["api-key"]

    - id: "edge-provider-to-llm"
      source: "actor-llm-provider"
      target: "process-llm"
      type: "dataFlow"
      data:
        label: "Model completion"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["api-key"]

    - id: "edge-agent-a-to-tool"
      source: "process-agent-a"
      target: "process-tool-executor"
      type: "dataFlow"
      data:
        label: "Tool invocation"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-tool-to-agent-a"
      source: "process-tool-executor"
      target: "process-agent-a"
      type: "dataFlow"
      data:
        label: "Tool result"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-agent-b-to-mcp"
      source: "process-agent-b"
      target: "process-mcp-server"
      type: "dataFlow"
      data:
        label: "MCP tool call"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-mcp-to-agent-b"
      source: "process-mcp-server"
      target: "process-agent-b"
      type: "dataFlow"
      data:
        label: "MCP tool result"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-mcp-to-external"
      source: "process-mcp-server"
      target: "actor-external-api"
      type: "dataFlow"
      data:
        label: "External API call"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-external-to-mcp"
      source: "actor-external-api"
      target: "process-mcp-server"
      type: "dataFlow"
      data:
        label: "API response"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-supervisor-to-memory"
      source: "process-supervisor"
      target: "datastore-shared-memory"
      type: "dataFlow"
      data:
        label: "Write shared state"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-memory-to-agents"
      source: "datastore-shared-memory"
      target: "process-agent-a"
      type: "dataFlow"
      data:
        label: "Read shared context"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-agents-to-vectordb"
      source: "process-agent-a"
      target: "datastore-vectordb"
      type: "dataFlow"
      data:
        label: "Knowledge retrieval"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-vectordb-to-agents"
      source: "datastore-vectordb"
      target: "process-agent-a"
      type: "dataFlow"
      data:
        label: "Retrieved context"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-supervisor-to-output-guard"
      source: "process-supervisor"
      target: "process-output-guardrail"
      type: "dataFlow"
      data:
        label: "Final response"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-output-guard-to-gateway"
      source: "process-output-guardrail"
      target: "process-gateway"
      type: "dataFlow"
      data:
        label: "Validated response"
        protocol: "Internal"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-gateway-to-user"
      source: "process-gateway"
      target: "actor-user"
      type: "dataFlow"
      data:
        label: "AI response"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]
