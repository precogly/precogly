countermeasures:
- id: cm-disable-public-network-access
  name: Disable Public Network Access
  description: |
    Disable the public endpoint of PaaS resources and allow access only through
    private endpoints or trusted network paths.
    Terraform: public_network_access_enabled = false (storage, key vault, ACR,
    web apps, Cosmos DB, SQL); public_network_access = "Disabled" on AVD
    host pools.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: cm-network-default-deny
  name: PaaS Firewall Default Deny
  description: |
    Where public access must remain, set the resource firewall to deny by default
    and allow only specific IP ranges or VNet subnets. Keep the "trusted Azure
    services" bypass only where an actual dependency exists.
    Terraform: network_rules / network_acls { default_action = "Deny",
    bypass = ["None"] or minimal, ip_rules = [...], virtual_network_subnet_ids = [...] }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-private-endpoint
  name: Private Endpoint Connectivity
  description: |
    Expose PaaS resources only through Private Link endpoints in a controlled
    subnet, with matching privatelink.* Private DNS zones linked to the VNets
    that consume them.
    Terraform: azurerm_private_endpoint with private_service_connection and
    private_dns_zone_group; azurerm_private_dns_zone_virtual_network_link.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: cm-enforce-tls12
  name: Enforce HTTPS and TLS 1.2 or Higher
  description: |
    Reject plaintext HTTP and TLS versions below 1.2 on all service endpoints,
    including management/SCM endpoints.
    Terraform: storage https_traffic_only_enabled = true, min_tls_version =
    "TLS1_2"; web apps https_only = true, site_config.minimum_tls_version =
    "1.2" (or "1.3"), scm_minimum_tls_version = "1.2".
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-entra-id-authentication
  name: Entra ID Authentication for Data Plane
  description: |
    Use Entra ID (managed identities or workload identity federation) with
    data-plane RBAC instead of keys, connection strings or passwords. Every
    request is then tied to an identity and covered by Conditional Access and
    sign-in logs where applicable.
    Terraform: default_to_oauth_authentication = true on storage; provider
    storage_use_azuread = true; data-plane role assignments such as
    "Storage Blob Data Reader" instead of key distribution.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: cm-least-privilege-rbac
  name: Least-Privilege Azure RBAC Assignments
  description: |
    Grant identities only the narrowest built-in or custom role at the
    narrowest scope (resource rather than resource group or subscription).
    Avoid Owner, Contributor and User Access Administrator for workload
    identities, and separate control-plane from data-plane roles. Review
    assignments regularly.
    Terraform: azurerm_role_assignment scoped to resource IDs; deny or audit
    privileged-role assignments with Azure Policy.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-pim-privileged-access
  name: Privileged Identity Management for Admin Roles
  description: |
    Make privileged Azure and Entra roles eligible-only through Microsoft Entra
    PIM, with approval, MFA, justification and time-bound activation, so no
    human holds standing administrative access.
    Terraform: azurerm_pim_eligible_role_assignment instead of
    azurerm_role_assignment for human administrators.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: medium
  default_status: platform
- id: cm-conditional-access-mfa
  name: Conditional Access with MFA and Device Compliance
  description: |
    Require phishing-resistant MFA and compliant or hybrid-joined devices for
    user access to cloud apps and management portals. Block legacy
    authentication and high-risk sign-ins.
    Terraform: azuread_conditional_access_policy with grant_controls
    (built_in_controls = ["mfa", "compliantDevice"] or
    authentication_strength_policy_id).
  control_functions: [preventive]
  control_nature: technical
  cost: medium
  default_status: platform
- id: cm-diagnostic-logging
  name: Diagnostic Logging to Central Workspace
  description: |
    Send resource logs (data-plane, audit and security categories) and the
    subscription Activity Log to a central Log Analytics workspace or SIEM,
    with retention that meets investigation and regulatory needs.
    Terraform: azurerm_monitor_diagnostic_setting per resource (or
    category_group "audit"/"allLogs"), subscription-level Activity Log export,
    azurerm_monitor_aad_diagnostic_setting for sign-in logs.
  control_functions: [detective]
  control_nature: technical
  cost: medium
- id: cm-activity-log-alerting
  name: Alerting on Sensitive Control-Plane Operations
  description: |
    Alert on high-risk management operations such as listKeys, role assignment
    creation, access policy changes, federated credential creation, network
    rule changes, lock removal and resource deletion, using Activity Log alerts
    or SIEM analytics rules.
    Terraform: azurerm_monitor_activity_log_alert with criteria.operation_name;
    azurerm_sentinel_alert_rule_scheduled.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: cm-resource-lock
  name: Resource Locks and Destroy Protection
  description: |
    Protect critical resources against accidental or malicious deletion with
    CanNotDelete management locks and Terraform lifecycle guards.
    Terraform: azurerm_management_lock (lock_level = "CanNotDelete");
    lifecycle { prevent_destroy = true } on stateful resources.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-terraform-state-protection
  name: Terraform State and Plan Protection
  description: |
    Treat state and plan files as secrets. Store state in a dedicated storage
    account with private access, Entra ID auth (use_azuread_auth = true),
    versioning, soft delete and minimal reader access. Do not persist plan
    artifacts containing secrets in CI.
    Terraform: backend "azurerm" { use_azuread_auth = true }; state account
    with shared_access_key_enabled = false and public_network_access_enabled
    = false.
  control_functions: [preventive]
  control_nature: technical
  cost: low
  default_status: platform
- id: cm-secrets-outside-terraform-state
  name: Keep Secret Values Out of Terraform State
  description: |
    Do not pass secret values through Terraform attributes that are persisted
    to state. Generate and rotate secrets inside Key Vault or the consuming
    service. Where available, use ephemeral resources and write-only
    arguments (e.g. value_wo) so values are never written to state.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: cm-iac-security-scanning
  name: IaC Security Scanning in CI/CD
  description: |
    Scan Terraform code and plans for insecure configuration before apply
    (e.g. Checkov, Trivy, KICS, or policy-as-code with OPA/Conftest). Fail the
    pipeline on high-severity findings such as public access, disabled
    encryption or missing logging.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: low
- id: cm-azure-policy-guardrails
  name: Azure Policy Deny Guardrails
  description: |
    Assign Azure Policy (deny / deployIfNotExists) at management group scope to
    enforce secure configuration regardless of how resources are deployed.
    Examples: public network access disabled, shared key disabled, TLS 1.2,
    Key Vault purge protection, AKS without privileged containers, allowed
    locations.
    Terraform: azurerm_management_group_policy_assignment with Microsoft
    Cloud Security Benchmark or custom initiatives in Deny effect.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: low
  default_status: platform
- id: cm-secret-scanning
  name: Secret Scanning in Repositories and Pipelines
  description: |
    Scan source code, commit history, pipeline logs and artifacts for leaked
    keys, SAS tokens, publish profiles and connection strings. Block pushes
    that contain secrets and rotate any secret that is found.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: low
- id: cm-egress-filtering
  name: Egress Filtering Through Azure Firewall
  description: |
    Route outbound traffic from workload subnets through Azure Firewall or an NVA
    with FQDN allowlists, so compromised workloads cannot reach attacker
    infrastructure or exfiltrate tokens and data.
    Terraform: azurerm_route_table with 0.0.0.0/0 to firewall private IP;
    azurerm_firewall_policy_rule_collection_group application rules;
    AKS outbound_type = "userDefinedRouting".
  control_functions: [preventive]
  control_nature: technical
  cost: high
- id: cm-nsg-segmentation
  name: NSG Subnet Segmentation
  description: |
    Attach NSGs to every workload subnet (including VNet integration subnets)
    with explicit allow rules and a final deny, restricting east-west traffic
    to required flows only.
    Terraform: azurerm_network_security_group with explicit security_rule;
    azurerm_subnet_network_security_group_association.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-waf
  name: Web Application Firewall at the Edge
  description: |
    Publish web applications through Azure Front Door or Application Gateway
    with WAF in Prevention mode (managed rule sets plus rate limiting) and DDoS
    protection at the edge.
    Terraform: azurerm_cdn_frontdoor_firewall_policy or
    azurerm_web_application_firewall_policy with mode = "Prevention".
  control_functions: [preventive, detective]
  control_nature: technical
  cost: medium
- id: cm-ssrf-protection
  name: Application SSRF Protection
  description: |
    Validate and allowlist outbound URLs requested by application code, block
    link-local and metadata addresses (169.254.169.254, IDENTITY_ENDPOINT), and
    do not proxy arbitrary user-supplied URLs.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: cm-defender-for-storage
  name: Microsoft Defender for Storage
  description: |
    Enable Defender for Storage with malware scanning on upload and sensitive
    data threat detection. It detects anomalous access, data exfiltration
    patterns, access from suspicious IPs and malware uploads.
    Terraform: azurerm_security_center_subscription_pricing (resource_type =
    "StorageAccounts", subplan = "DefenderForStorageV2");
    azurerm_security_center_storage_defender for per-account settings.
  control_functions: [detective]
  control_nature: technical
  cost: medium
  default_status: platform
- id: cm-defender-for-key-vault
  name: Microsoft Defender for Key Vault
  description: |
    Enable Defender for Key Vault to detect unusual secret access volumes,
    access from suspicious IPs or Tor, and anomalous principals.
    Terraform: azurerm_security_center_subscription_pricing (resource_type =
    "KeyVaults").
  control_functions: [detective]
  control_nature: technical
  cost: low
  default_status: platform
- id: cm-defender-for-containers
  name: Microsoft Defender for Containers
  description: |
    Enable Defender for Containers for runtime threat detection, Kubernetes
    audit log analytics, image vulnerability assessment and control-plane
    hardening recommendations.
    Terraform: azurerm_security_center_subscription_pricing (resource_type =
    "Containers"); AKS microsoft_defender { log_analytics_workspace_id }.
  control_functions: [detective]
  control_nature: technical
  cost: medium
  default_status: platform
- id: cm-defender-for-app-service
  name: Microsoft Defender for App Service
  description: |
    Enable Defender for App Service to detect web shell activity, dangling DNS,
    suspicious Kudu usage and attacks against the application.
    Terraform: azurerm_security_center_subscription_pricing (resource_type =
    "AppServices").
  control_functions: [detective]
  control_nature: technical
  cost: medium
  default_status: platform
- id: cm-defender-for-servers
  name: Microsoft Defender for Servers with EDR
  description: |
    Enable Defender for Servers (Microsoft Defender for Endpoint integration)
    on VMs and session hosts for EDR, vulnerability assessment and
    credential-theft detection.
    Terraform: azurerm_security_center_subscription_pricing (resource_type =
    "VirtualMachines", subplan = "P2").
  control_functions: [detective, corrective]
  control_nature: technical
  cost: medium
  default_status: platform
- id: cm-disable-public-access
  name: Disable Anonymous Blob Access
  description: |
    Disallow anonymous public read access at account level so no container
    can be made public, regardless of container settings.
    Terraform: allow_nested_items_to_be_public = false;
    azurerm_storage_container.container_access_type = "private".
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-storage-disable-shared-key
  name: Disable Storage Shared Key Authorization
  description: |
    Disable Shared Key authorization so only Entra ID-authenticated requests
    and user delegation SAS are accepted. listKeys can then no longer be
    turned into data access.
    Terraform: shared_access_key_enabled = false;
    default_to_oauth_authentication = true; provider storage_use_azuread = true.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: cm-storage-user-delegation-sas
  name: Use User Delegation SAS Only
  description: |
    Issue SAS tokens only as user delegation SAS (signed with Entra ID
    credentials). Keep lifetimes short, permissions minimal and add IP
    restrictions. These tokens are auditable to the issuing identity and are
    revoked when the user delegation key is revoked.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-storage-sas-expiration-policy
  name: SAS Expiration Policy
  description: |
    Configure a SAS expiration policy so tokens exceeding the allowed lifetime
    are logged or blocked.
    Terraform: sas_policy { expiration_period = "00.08:00:00",
    expiration_action = "Block" }.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: low
- id: cm-storage-restrict-copy-scope
  name: Restrict Cross-Tenant Replication and Copy Scope
  description: |
    Disallow object replication to accounts in other tenants and limit
    server-side copy operations to accounts in the same Entra tenant or with
    private links to the same VNet.
    Terraform: cross_tenant_replication_enabled = false;
    allowed_copy_scope = "AAD" or "PrivateLink".
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-storage-soft-delete-versioning
  name: Blob Soft Delete, Container Soft Delete and Versioning
  description: |
    Enable blob versioning, blob soft delete and container soft delete with
    adequate retention, plus point-in-time restore where supported, so
    overwritten or deleted data can be recovered.
    Terraform: blob_properties { versioning_enabled = true,
    change_feed_enabled = true, delete_retention_policy { days = 30 },
    container_delete_retention_policy { days = 30 },
    restore_policy { days = 29 } }.
  control_functions: [recovery]
  control_nature: technical
  cost: low
- id: cm-storage-immutability
  name: Immutable Storage (WORM) for Critical Data
  description: |
    Apply time-based retention or legal hold immutability policies to backups,
    audit logs and regulated data so they cannot be modified or deleted
    during the retention period, even by account owners.
    Terraform: immutability_policy block on the account (version-level
    immutability) or azurerm_storage_container_immutability_policy.
  control_functions: [preventive, recovery]
  control_nature: technical
  cost: medium
- id: cm-key-vault-rbac-authorization
  name: Key Vault Azure RBAC Permission Model
  description: |
    Use the Azure RBAC permission model instead of access policies, so
    data-plane access can only be granted by principals with role assignment
    write permission (Owner / User Access Administrator / RBAC Administrator),
    not by any vault Contributor.
    Terraform: rbac_authorization_enabled = true (enable_rbac_authorization
    in azurerm < 4.x); no access_policy blocks.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-key-vault-purge-protection
  name: Key Vault Soft Delete and Purge Protection
  description: |
    Enable purge protection with an adequate soft delete retention so deleted
    vaults, keys and secrets can be recovered and cannot be permanently purged
    during retention.
    Terraform: purge_protection_enabled = true; soft_delete_retention_days =
    90; provider features key_vault { purge_soft_delete_on_destroy = false }.
  control_functions: [preventive, recovery]
  control_nature: technical
  cost: low
- id: cm-key-vault-expiration-rotation
  name: Key Vault Expiration and Automatic Rotation
  description: |
    Set expiration dates on all secrets, keys and certificates. Configure
    automatic key rotation policies and certificate auto-renewal, and alert
    on near-expiry objects via Event Grid.
    Terraform: expiration_date on azurerm_key_vault_secret/key;
    azurerm_key_vault_key.rotation_policy { automatic { time_before_expiry } };
    certificate_policy.lifetime_action { action_type = "AutoRenew" }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-key-vault-per-application
  name: Dedicated Key Vault per Application and Environment
  description: |
    Use separate vaults per application and per environment, and grant
    secret access at individual secret scope where feasible, to limit the
    blast radius of a compromised consumer.
    Terraform: one azurerm_key_vault per app/env; azurerm_role_assignment
    scoped to the vault or to "<vault_id>/secrets/<name>".
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-secret-caching
  name: Client-Side Secret Caching and Retry
  description: |
    Cache secrets and keys in the application (or use Key Vault references
    and CSI driver rotation intervals), and implement exponential backoff on
    HTTP 429, to stay within Key Vault service limits.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-dedicated-workload-identities
  name: Dedicated Identity per Workload
  description: |
    Prefer system-assigned identities, or one user-assigned identity per
    workload and environment. Do not share identities across environments.
    Restrict Managed Identity Operator / Contributor on identities to
    deployment principals.
    Terraform: separate azurerm_user_assigned_identity per workload; no
    cross-environment identity_ids references.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-federated-credential-scoping
  name: Scoped Federated Identity Credentials
  description: |
    Trust only organization-controlled issuers. Pin subjects to protected
    branches or deployment environments (e.g.
    repo:org/app:environment:production), avoid pull_request subjects for
    privileged identities, and alert on new federated credentials.
    Terraform: azurerm_federated_identity_credential with an exact subject
    and audience ["api://AzureADTokenExchange"].
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-aks-private-api-server
  name: AKS Private or IP-Restricted API Server
  description: |
    Use a private cluster, API Server VNet Integration, or at minimum authorized
    IP ranges limited to administration networks and CI runners.
    Terraform: private_cluster_enabled = true, or
    api_server_access_profile { authorized_ip_ranges = [...] }.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: cm-aks-entra-rbac
  name: AKS Entra ID Integration with Local Accounts Disabled
  description: |
    Integrate the cluster with Entra ID (with Azure RBAC for Kubernetes
    authorization) and disable local accounts, so every access goes through
    Entra ID with MFA, Conditional Access and revocable identities.
    Terraform: local_account_disabled = true;
    azure_active_directory_role_based_access_control { azure_rbac_enabled =
    true, tenant_id = ..., admin_group_object_ids = [small admin group] }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-aks-disable-run-command
  name: Disable AKS Run Command
  description: |
    Disable Run Command so the Azure management plane cannot be used to run
    commands inside private clusters, or restrict who holds
    Microsoft.ContainerService/managedClusters/runCommand/action.
    Terraform: run_command_enabled = false.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-aks-pod-security
  name: AKS Pod Security Enforcement
  description: |
    Enforce Pod Security Standards (restricted/baseline) through Pod Security
    Admission and the Azure Policy add-on. Deny privileged containers,
    hostPath, hostPID/hostNetwork, privilege escalation and root users.
    Terraform: azure_policy_enabled = true; policy assignment
    "Kubernetes cluster pod security restricted standards for Linux-based
    workloads" in Deny mode; namespace labels
    pod-security.kubernetes.io/enforce = restricted.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-aks-workload-identity
  name: AKS Workload Identity and Minimal Kubelet Identity
  description: |
    Give pods dedicated identities through Entra Workload ID federation instead
    of node-level identities. Limit the kubelet identity to AcrPull on the
    specific registry, and block pod access to IMDS where possible.
    Terraform: oidc_issuer_enabled = true; workload_identity_enabled = true;
    azurerm_federated_identity_credential per service account; no
    application roles on kubelet_identity.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: cm-aks-network-policy
  name: AKS Network Policies
  description: |
    Enable a network policy engine and apply default-deny ingress/egress
    policies per namespace with explicit allows, including denying egress to
    169.254.169.254 for workloads that do not need it.
    Terraform: network_profile { network_plugin = "azure", network_policy =
    "cilium" or "calico" or "azure" }; kubernetes_network_policy manifests.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-aks-trusted-registries
  name: AKS Trusted Registries and Image Verification
  description: |
    Allow images only from approved private registries (ACR), reference images
    by digest, scan images for vulnerabilities and verify signatures at
    admission (e.g. Notation with Ratify).
    Terraform: azure_policy_enabled = true with
    "Kubernetes cluster containers should only use allowed images" in Deny;
    azurerm_role_assignment AcrPull for the kubelet identity on the approved ACR.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: cm-aks-key-vault-secrets-provider
  name: AKS Key Vault Secrets Store CSI Driver
  description: |
    Mount secrets from Key Vault through the Secrets Store CSI driver with
    workload identity instead of storing them as Kubernetes Secrets or
    Terraform-managed manifests, and enable rotation.
    Terraform: key_vault_secrets_provider { secret_rotation_enabled = true }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-aks-kms-etcd-encryption
  name: AKS KMS etcd Encryption with Customer-Managed Key
  description: |
    Encrypt Kubernetes secrets in etcd with a Key Vault key through the KMS
    plugin, adding a customer-controlled encryption layer.
    Terraform: key_management_service { key_vault_key_id = ...,
    key_vault_network_access = "Private" }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-aks-resource-limits
  name: AKS Resource Quotas, Limits and Autoscaler Bounds
  description: |
    Enforce container CPU/memory limits with LimitRange and ResourceQuota per
    namespace, set realistic node pool max_count, and alert on cost and
    utilization anomalies.
    Terraform: kubernetes_resource_quota / kubernetes_limit_range;
    bounded max_count on azurerm_kubernetes_cluster_node_pool;
    azurerm_consumption_budget_resource_group.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: low
- id: cm-aks-auto-upgrade
  name: AKS Automatic Upgrades and Node Image Patching
  description: |
    Stay on a supported Kubernetes minor version and apply node image security
    patches automatically within maintenance windows.
    Terraform: automatic_upgrade_channel = "patch" or "stable";
    node_os_upgrade_channel = "NodeImage" or "SecurityPatch";
    maintenance_window_auto_upgrade / maintenance_window_node_os blocks.
  control_functions: [preventive, corrective]
  control_nature: technical
  cost: low
- id: cm-aks-kubernetes-rbac-least-privilege
  name: Kubernetes RBAC Least Privilege
  description: |
    Use namespace-scoped Roles instead of ClusterRoles, avoid wildcard verbs and
    resources, avoid cluster-admin bindings for workloads and CI, and disable
    service account token automounting where not required.
    Terraform: kubernetes_role / kubernetes_role_binding per namespace;
    automount_service_account_token = false.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-app-service-authentication
  name: App Service Authentication (Easy Auth)
  description: |
    Enable built-in App Service Authentication with Entra ID (or another IdP)
    and require authentication for all requests unless the endpoint is
    intentionally public.
    Terraform: auth_settings_v2 { auth_enabled = true, require_authentication
    = true, unauthenticated_action = "RedirectToLoginPage" or "Return401",
    active_directory_v2 { ... } }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-app-service-access-restrictions
  name: App Service Access Restrictions to Edge Only
  description: |
    Restrict inbound traffic to the WAF / Front Door path only, using service
    tag restrictions with X-Azure-FDID header validation, or private endpoints.
    Terraform: site_config { ip_restriction_default_action = "Deny",
    ip_restriction { service_tag = "AzureFrontDoor.Backend",
    headers { x_azure_fdid = [<profile resource_guid>] } } }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-app-service-disable-basic-auth
  name: Disable App Service Basic Auth Publishing and FTP
  description: |
    Disable FTP and SCM basic authentication publishing credentials and
    deploy via Entra ID-authenticated pipelines (OIDC). Disable FTP or allow
    FTPS only.
    Terraform: ftp_publish_basic_authentication_enabled = false;
    webdeploy_publish_basic_authentication_enabled = false;
    site_config.ftps_state = "Disabled".
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-app-service-scm-restrictions
  name: App Service SCM (Kudu) Access Restrictions
  description: |
    Restrict the SCM endpoint to build agents and admin networks, and limit
    Website Contributor / Contributor roles that grant Kudu access.
    Terraform: site_config.scm_ip_restriction with
    scm_ip_restriction_default_action = "Deny" (or
    scm_use_main_ip_restriction = true).
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-app-service-key-vault-references
  name: App Service Key Vault References and Managed Identity
  description: |
    Store secrets in Key Vault and reference them from app settings
    ("@Microsoft.KeyVault(SecretUri=...)") resolved by a managed identity.
    Better still, use managed identity authentication to backends so no
    secret exists.
    Terraform: app_settings values as Key Vault references;
    key_vault_reference_identity_id; identity block.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-dangling-dns-protection
  name: Dangling DNS Prevention
  description: |
    Manage custom domain DNS records in the same lifecycle as the target
    resource, use domain verification (asuid TXT records), delete DNS records
    before deprovisioning, and continuously scan for dangling CNAMEs
    (Defender for App Service dangling DNS alerts).
    Terraform: azurerm_dns_cname_record referencing default_hostname;
    azurerm_dns_txt_record "asuid.<sub>" with custom_domain_verification_id.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: low
- id: cm-app-service-runtime-hardening
  name: App Service Runtime Hardening
  description: |
    Run supported runtime versions, disable remote debugging and detailed
    error pages in production, and enable HTTP/2 and secure client
    certificate settings where applicable.
    Terraform: site_config { remote_debugging_enabled = false,
    application_stack { supported version } }; logs { detailed_error_messages
    = false }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-app-service-autoscale
  name: App Service Autoscale and Plan Isolation
  description: |
    Run production apps on dedicated plans with at least two instances,
    zone redundancy and autoscale rules, and avoid co-hosting unrelated or
    differently trusted apps on one plan.
    Terraform: azurerm_service_plan { worker_count >= 2,
    zone_balancing_enabled = true }; azurerm_monitor_autoscale_setting.
  control_functions: [preventive, corrective]
  control_nature: technical
  cost: medium
- id: cm-avd-restrict-redirection
  name: AVD Restrict Device Redirection
  description: |
    Disable drive, clipboard, USB and printer redirection for sensitive host
    pools, or allow it in one direction only, using RDP properties and
    Intune/GPO policies. Add screen capture protection and watermarking for
    highly sensitive data.
    Terraform: custom_rdp_properties = "drivestoredirect:s:;redirectclipboard:i:0;
    usbdevicestoredirect:s:;redirectprinters:i:0".
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-avd-no-inbound-access
  name: AVD Session Hosts Without Inbound Exposure
  description: |
    Deploy session hosts without public IPs and with NSGs that deny all inbound
    internet traffic, relying on AVD reverse connect. Use Azure Bastion for
    administrative access.
    Terraform: no azurerm_public_ip on session host NICs; NSG with no
    allow-inbound rules from Internet for 3389/22.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-avd-registration-token-lifetime
  name: AVD Short-Lived Registration Tokens
  description: |
    Generate host pool registration tokens just in time with the shortest
    practical expiry, pass them only through protected extension settings,
    and remove unexpected session hosts. Alert on HostRegistration events.
    Terraform: azurerm_virtual_desktop_host_pool_registration_info
    expiration_date = timeadd(timestamp(), "2h") (with
    ignore_changes); token in protected_settings of azurerm_virtual_machine_extension.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: low
- id: cm-avd-profile-isolation
  name: AVD User and Profile Isolation
  description: |
    Do not grant users local admin on session hosts. Apply FSLogix-recommended
    NTFS permissions so users can access only their own profile container,
    with Elevated Contributor restricted to admins. Enable Credential Guard
    and LSA protection on session hosts.
    Terraform: no "Virtual Machine Administrator Login" for users;
    azurerm_role_assignment "Storage File Data SMB Share Contributor" for users
    and "Storage File Data SMB Share Elevated Contributor" for admins only.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-vm-patch-management
  name: Automated OS and Image Patching
  description: |
    Patch VMs and session hosts automatically, rebuild golden images regularly
    from patched sources, and monitor patch compliance.
    Terraform: patch_mode = "AutomaticByPlatform" or
    azurerm_maintenance_configuration with
    azurerm_maintenance_assignment_virtual_machine; image version references
    updated by pipeline.
  control_functions: [preventive, corrective]
  control_nature: technical
  cost: medium
- id: cm-avd-private-link
  name: AVD Private Link
  description: |
    Use Private Link for AVD feed discovery and session connections from
    corporate networks, and disable public access for sensitive host pools
    and workspaces.
    Terraform: azurerm_private_endpoint for the workspace (feed, global) and
    host pool (connection) subresources;
    public_network_access_enabled = false on the workspace;
    host pool public_network_access = "Disabled".
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: cm-avd-scaling-plan
  name: AVD Scaling Plan and Session Limits
  description: |
    Configure scaling plans, appropriate maximum sessions per host and session
    time limits for idle and disconnected sessions, so capacity matches demand
    and stale sessions are released.
    Terraform: azurerm_virtual_desktop_scaling_plan with schedules;
    maximum_sessions_allowed sized to VM SKU.
  control_functions: [preventive, corrective]
  control_nature: technical
  cost: low
- id: cm-avd-scoped-app-group-assignments
  name: AVD Scoped Application Group Assignments
  description: |
    Assign application groups only to dedicated groups that need them,
    publish RemoteApps instead of full desktops where possible, and separate
    host pools by data sensitivity.
    Terraform: azurerm_role_assignment "Desktop Virtualization User" scoped to
    the application group for specific Entra groups; type = "RemoteApp".
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-vnet-hub-spoke-peering
  name: Hub-and-Spoke Peering Through Firewall
  description: |
    Connect spokes only to a hub and route spoke-to-spoke and environment
    crossings through the hub firewall. Do not peer environments of
    different trust levels directly. Enable forwarded traffic and gateway
    transit only where required.
    Terraform: azurerm_virtual_network_peering only between hub and spokes;
    allow_forwarded_traffic / allow_gateway_transit set explicitly; Azure
    Virtual Network Manager connectivity configurations for scale.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: cm-dns-security-policy
  name: Controlled DNS Resolution and Filtering
  description: |
    Centralize resolution through Azure DNS Private Resolver or the Azure
    Firewall DNS proxy, apply DNS security policies to block known malicious
    and unapproved domains, and log all DNS queries. Treat custom DNS servers
    as tier-0 assets.
    Terraform: azurerm_private_dns_resolver with inbound/outbound endpoints;
    azurerm_firewall_policy dns { proxy_enabled = true }; VNet dns_servers
    pointing to the firewall or resolver.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: medium
- id: cm-ddos-protection
  name: Azure DDoS Network Protection
  description: |
    Enable DDoS Network Protection (or DDoS IP Protection) for VNets hosting
    internet-facing public IPs, with alerting on mitigation events.
    Terraform: azurerm_network_ddos_protection_plan and
    ddos_protection_plan { id, enable = true } on the VNet; or
    ddos_protection_mode = "Enabled" on azurerm_public_ip.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: high
  default_status: platform
- id: cm-vnet-flow-logs
  name: VNet Flow Logs and Traffic Analytics
  description: |
    Enable VNet flow logs (the successor to NSG flow logs) with traffic
    analytics, sent to a storage account and Log Analytics workspace with
    adequate retention.
    Terraform: azurerm_network_watcher_flow_log with target_resource_id =
    VNet id, retention_policy, traffic_analytics { enabled = true }.
  control_functions: [detective]
  control_nature: technical
  cost: medium
- id: cm-subnet-disable-default-outbound
  name: Disable Default Outbound Access
  description: |
    Make subnets private so workloads need an explicit egress path (firewall
    UDR, NAT gateway) that can be controlled and logged.
    Terraform: azurerm_subnet.default_outbound_access_enabled = false.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-service-endpoint-policies
  name: Service Endpoint Policies
  description: |
    Attach service endpoint policies that allow only approved storage accounts
    through service endpoints, or replace service endpoints with private
    endpoints.
    Terraform: azurerm_subnet_service_endpoint_storage_policy with definition
    service_resources; subnet service_endpoint_policy_ids.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-subnet-capacity-planning
  name: Subnet Capacity Planning
  description: |
    Size subnets for peak scale, upgrade surge and private endpoint growth
    (e.g. AKS with Azure CNI Overlay), and monitor IP utilization.
  control_functions: [preventive]
  control_nature: administrative
  cost: low
- id: cm-nsg-least-privilege-rules
  name: NSG Least-Privilege Rules
  description: |
    Allow only specific source prefixes, application security groups and
    ports. Never allow management ports from Internet, avoid broad service
    tags such as AzureCloud, and add explicit outbound deny rules where egress
    is not routed through a firewall.
    Terraform: security_rule with explicit source_address_prefixes and
    destination_application_security_group_ids; Azure Policy denying
    Internet-sourced 22/3389 rules.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-bastion-jit-admin-access
  name: Administrative Access via Bastion or JIT
  description: |
    Remove public management ports. Administer VMs via Azure Bastion or
    Defender for Cloud just-in-time VM access, with time-limited, audited
    port openings.
    Terraform: azurerm_bastion_host; no public IPs on VM NICs; JIT policy
    (azapi_resource for Microsoft.Security/locations/jitNetworkAccessPolicies).
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: cm-iac-drift-detection
  name: Infrastructure Drift Detection
  description: |
    Run scheduled terraform plan (detailed-exitcode) against production to
    detect out-of-band changes. Do not mix inline and standalone sub-resources
    for the same parent (e.g. NSG rules, route table routes).
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: cm-firewall-least-privilege-rules
  name: Azure Firewall Least-Privilege Rules
  description: |
    Allow egress to explicit FQDNs (not wildcards on shared multi-tenant
    domains such as *.blob.core.windows.net), specific sources and ports.
    Restrict DNAT to known source IPs and avoid publishing management ports.
    Terraform: application_rule_collection with exact destination_fqdns and
    source_ip_groups; nat_rule_collection with restricted source_addresses.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-firewall-threat-protection
  name: Azure Firewall Threat Intelligence, IDPS and TLS Inspection
  description: |
    Set threat intelligence to Deny and use Firewall Premium with IDPS in
    Deny mode and TLS inspection for outbound traffic, to block known
    malicious destinations and C2 signatures.
    Terraform: azurerm_firewall_policy { sku = "Premium",
    threat_intelligence_mode = "Deny", intrusion_detection { mode = "Deny" },
    tls_certificate { ... } }.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: high
  default_status: platform
- id: cm-firewall-snat-scaling
  name: Azure Firewall SNAT Scaling
  description: |
    Associate a NAT gateway with the firewall subnet or add multiple public
    IPs for SNAT capacity, and monitor SNAT port utilization.
    Terraform: azurerm_nat_gateway with
    azurerm_subnet_nat_gateway_association on AzureFirewallSubnet.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: cm-private-endpoint-governance
  name: Private Endpoint Connection Governance
  description: |
    Use Azure Policy to deny private endpoints to resources outside approved
    subscriptions or tenants. Require manual approval for inbound connection
    requests and review them. Alert on privateEndpointConnections approvals.
    Terraform: azurerm_management_group_policy_assignment with a custom
    policy on privateLinkServiceConnections[*].privateLinkServiceId.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: low
  default_status: platform
- id: cm-private-endpoint-network-policies
  name: Enable Private Endpoint Network Policies
  description: |
    Enable network policies on private endpoint subnets so NSGs and UDRs apply
    to private endpoint traffic.
    Terraform: azurerm_subnet.private_endpoint_network_policies = "Enabled"
    (or "NetworkSecurityGroupEnabled" / "RouteTableEnabled").
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-private-dns-centralized
  name: Centralized Private DNS Zones
  description: |
    Host privatelink zones once in the connectivity hub, linked to all VNets
    and managed in platform state with locks. Use Azure Policy
    DeployIfNotExists to create private endpoint DNS records automatically.
    Terraform: azurerm_private_dns_zone in the hub with
    lifecycle { prevent_destroy = true }; azurerm_private_dns_zone_virtual_network_link
    per spoke; policy assignments for DNS zone groups.
  control_functions: [preventive]
  control_nature: technical
  cost: low
  default_status: platform
- id: cm-appgw-tls-policy
  name: Application Gateway Modern TLS Policy
  description: |
    Use a modern predefined TLS policy (TLS 1.2+ with strong ciphers).
    Terraform: ssl_policy { policy_type = "Predefined", policy_name =
    "AppGwSslPolicy20220101S" } (or CustomV2 with min_protocol_version =
    "TLSv1_2").
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-appgw-end-to-end-tls
  name: Application Gateway End-to-End TLS
  description: |
    Re-encrypt traffic to backends with HTTPS and validate backend
    certificates against trusted roots.
    Terraform: backend_http_settings { protocol = "Https",
    trusted_root_certificate_names = [...] }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-appgw-key-vault-certificates
  name: TLS Certificates from Key Vault
  description: |
    Reference TLS certificates from Key Vault through a user-assigned identity
    instead of uploading PFX data, so private keys never enter Terraform state
    and renewals happen automatically.
    Terraform: ssl_certificate { key_vault_secret_id = ... }; identity
    { type = "UserAssigned" } with Key Vault Secrets User.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-header-sanitization
  name: Forwarded Header Sanitization
  description: |
    Overwrite or strip client-supplied forwarding and identity headers at the
    edge. Configure backends to trust forwarding headers only from the gateway
    and to use the right-most trusted value.
    Terraform: rewrite_rule_set with request_header_configuration for
    X-Forwarded-For / X-Original-Host; backend framework forwarded-headers
    configuration.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-bastion-feature-hardening
  name: Bastion Feature Hardening and Session Recording
  description: |
    Disable shareable links, native client tunneling, file copy and IP connect
    unless needed. Enable session recording (Premium) for privileged
    environments.
    Terraform: shareable_link_enabled = false; tunneling_enabled = false;
    file_copy_enabled = false; ip_connect_enabled = false;
    session_recording_enabled = true.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: medium
- id: cm-vm-entra-login
  name: VM Entra ID Login and Key-Based Authentication
  description: |
    Use Entra ID login for Windows and Linux VMs (with Conditional Access and
    MFA), SSH keys instead of passwords, and Windows LAPS for unique local
    admin passwords.
    Terraform: disable_password_authentication = true; admin_ssh_key;
    azurerm_virtual_machine_extension AADLoginForWindows / AADSSHLoginForLinux;
    Virtual Machine User/Administrator Login role assignments.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-disk-access-restriction
  name: Managed Disk Export Restriction
  description: |
    Block public disk export and restrict snapshot/export SAS to private disk
    access resources. Alert on beginGetAccess and snapshot creation.
    Terraform: azurerm_managed_disk / azurerm_snapshot with
    network_access_policy = "DenyAll" (or "AllowPrivate" with disk_access_id)
    and public_network_access_enabled = false.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-vm-encryption-at-host
  name: VM Encryption at Host and Customer-Managed Keys
  description: |
    Enable encryption at host so temp disks and caches are encrypted, and use
    disk encryption sets with customer-managed keys where required.
    Terraform: encryption_at_host_enabled = true; os_disk.disk_encryption_set_id.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-vm-trusted-launch
  name: VM Trusted Launch
  description: |
    Deploy VMs as Trusted Launch with Secure Boot, vTPM and boot integrity
    monitoring.
    Terraform: secure_boot_enabled = true; vtpm_enabled = true; Guest
    Attestation extension.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: low
- id: cm-vm-backup
  name: Protected VM Backup
  description: |
    Back up VMs to a Recovery Services vault with soft delete, immutability
    and multi-user authorization (Resource Guard), so attackers cannot delete
    recovery points.
    Terraform: azurerm_backup_protected_vm; azurerm_recovery_services_vault
    { soft_delete_enabled = true, immutability = "Locked" }; resource guard.
  control_functions: [recovery]
  control_nature: technical
  cost: medium
- id: cm-vm-log-collection
  name: VM Security Event Collection
  description: |
    Collect OS security events, syslog and process telemetry with Azure
    Monitor Agent and data collection rules into the security workspace.
    Terraform: azurerm_virtual_machine_extension AzureMonitorWindowsAgent /
    AzureMonitorLinuxAgent; azurerm_monitor_data_collection_rule and
    azurerm_monitor_data_collection_rule_association.
  control_functions: [detective]
  control_nature: technical
  cost: medium
- id: cm-no-allow-all-azure-services
  name: No "Allow All Azure Services" Firewall Exception
  description: |
    Do not use the 0.0.0.0 "Allow Azure services" exception (SQL) or "Accept
    connections from within public Azure datacenters" (Cosmos DB). These
    admit any Azure customer's resources. Use private endpoints or VNet rules.
    Terraform: no azurerm_mssql_firewall_rule with 0.0.0.0; no "0.0.0.0" in
    Cosmos DB ip_range_filter.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-sql-entra-only-auth
  name: SQL Entra-Only Authentication
  description: |
    Enable Microsoft Entra-only authentication with an Entra group as
    administrator, and connect applications with managed identities.
    Terraform: azuread_administrator { azuread_authentication_only = true,
    login_username = <group>, object_id = <group id> }; no
    administrator_login_password.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-parameterized-queries
  name: Parameterized Queries
  description: |
    Use parameterized queries or ORM bindings for all database access,
    including Cosmos DB SQL API (QueryDefinition with parameters). Never
    concatenate user input into queries.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-defender-for-databases
  name: Microsoft Defender for Databases
  description: |
    Enable Defender for Azure SQL and Defender for Azure Cosmos DB to detect
    SQL injection, anomalous access, brute force and data exfiltration.
    Terraform: azurerm_security_center_subscription_pricing (resource_type =
    "SqlServers", "CosmosDbs").
  control_functions: [detective]
  control_nature: technical
  cost: medium
  default_status: platform
- id: cm-sql-auditing
  name: SQL Server Auditing
  description: |
    Enable server-level auditing to Log Analytics and/or immutable storage,
    capturing logins, queries on sensitive tables and permission changes.
    Terraform: azurerm_mssql_server_extended_auditing_policy
    { log_monitoring_enabled = true }; diagnostic setting with
    SQLSecurityAuditEvents.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: cm-sql-outbound-restriction
  name: SQL Outbound Network Restriction
  description: |
    Restrict outbound connections from the logical server to an allowlist of
    FQDNs, and limit export rights to dedicated identities.
    Terraform: outbound_network_restriction_enabled = true;
    azurerm_mssql_outbound_firewall_rule for approved destinations.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-sql-backup-retention
  name: SQL Long-Term Backup Retention
  description: |
    Configure long-term retention (and appropriate PITR retention) so backups
    survive database or server deletion. Protect servers with locks.
    Terraform: long_term_retention_policy { weekly_retention, monthly_retention };
    short_term_retention_policy { retention_days = 35 }.
  control_functions: [recovery]
  control_nature: technical
  cost: medium
- id: cm-sql-least-privilege-db-roles
  name: SQL Least-Privilege Database Roles
  description: |
    Grant application identities only the database roles or object
    permissions they need (no db_owner). Use an Entra group as server admin,
    and separate DDL rights for migrations.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-sql-always-encrypted
  name: Always Encrypted and Data Masking
  description: |
    Protect highly sensitive columns with Always Encrypted (keys in Key Vault)
    and apply dynamic data masking for non-privileged users.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: cm-cosmosdb-disable-local-auth
  name: Cosmos DB Disable Key-Based Authentication
  description: |
    Disable local (key-based) authentication and metadata writes via keys.
    Use Entra ID with Cosmos DB data-plane RBAC.
    Terraform: local_authentication_enabled = false;
    access_key_metadata_writes_enabled = false;
    azurerm_cosmosdb_sql_role_assignment.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: cm-cosmosdb-continuous-backup
  name: Cosmos DB Continuous Backup
  description: |
    Enable continuous backup for point-in-time restore of accounts,
    databases and containers.
    Terraform: backup { type = "Continuous", tier = "Continuous30Days" }.
  control_functions: [recovery]
  control_nature: technical
  cost: medium
- id: cm-cosmosdb-throughput-limits
  name: Cosmos DB Throughput Limits and Query Governance
  description: |
    Cap account throughput, design partition keys to avoid hot partitions,
    rate-limit expensive API calls, and alert on 429 rates and RU spikes.
    Terraform: capacity { total_throughput_limit = ... }; bounded
    autoscale_settings.max_throughput.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: low
- id: cm-workload-identity-federation
  name: Workload Identity Federation Instead of Secrets
  description: |
    Use managed identities or federated identity credentials (OIDC from
    GitHub, Azure DevOps, Kubernetes) instead of client secrets. Where
    credentials are unavoidable, use certificates stored in Key Vault.
    Terraform: azuread_application_federated_identity_credential; provider
    "azurerm" { use_oidc = true }; no azuread_application_password.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-app-credential-management
  name: Application Credential Lifetime Policy and Monitoring
  description: |
    Enforce maximum secret and certificate lifetimes with app management
    policies, rotate credentials automatically, and alert before expiry.
    Terraform: time_rotating with azuread_application_password rotate_when_changed;
    tenant app management policy (via azapi / Graph).
  control_functions: [preventive, detective]
  control_nature: technical
  cost: low
- id: cm-app-owner-restrictions
  name: Restrict Application Owners and App Admin Roles
  description: |
    Limit app owners to dedicated admin accounts, make Application
    Administrator and Cloud Application Administrator PIM-eligible only, and
    avoid user ownership of privileged apps.
    Terraform: azuread_application.owners limited; azuread_directory_role_eligibility_schedule_request
    for app admin roles.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-entra-audit-alerting
  name: Entra ID Audit Log Alerting
  description: |
    Export Entra audit and sign-in logs (including service principal and
    managed identity sign-ins) to a SIEM. Alert on credential additions to
    apps and service principals, consent grants, privileged app role
    assignments, federated credential creation and risky workload identities.
    Terraform: azurerm_monitor_aad_diagnostic_setting; Sentinel analytics
    rules (azurerm_sentinel_alert_rule_scheduled).
  control_functions: [detective]
  control_nature: technical
  cost: medium
  default_status: platform
- id: cm-graph-permission-least-privilege
  name: Least-Privilege Graph and Directory Permissions
  description: |
    Grant applications the narrowest delegated or application permissions,
    prefer resource-specific consent (e.g. Sites.Selected), and never grant
    directory roles or role-management permissions to workload identities
    without a reviewed exception.
    Terraform: required_resource_access limited; avoid
    azuread_directory_role_assignment for service principals.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-restrict-user-consent
  name: Restrict User Consent and Use Admin Consent Workflow
  description: |
    Allow user consent only for verified publishers and low-risk permissions
    (or disable it), and enable the admin consent workflow.
  control_functions: [preventive]
  control_nature: technical
  cost: low
  default_status: platform
- id: cm-redirect-uri-hygiene
  name: Redirect URI Hygiene
  description: |
    Use only HTTPS redirect URIs on domains you control and manage in the same
    lifecycle as the app. No wildcards. Remove URIs of decommissioned
    resources.
    Terraform: web.redirect_uris referencing managed resource hostnames
    (e.g. azurerm_linux_web_app.default_hostname).
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-app-tenant-restriction
  name: Single-Tenant Apps and Assignment Required
  description: |
    Register internal apps as single-tenant. Require user assignment on the
    service principal, and validate issuer/tid and immutable identifiers
    (oid, sub) in multi-tenant apps instead of email.
    Terraform: sign_in_audience = "AzureADMyOrg";
    azuread_service_principal.app_role_assignment_required = true.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-oauth-secure-flows
  name: Secure OAuth Flows
  description: |
    Use authorization code flow with PKCE, disable implicit grant, and disable
    public client fallback unless a native client requires it.
    Terraform: web.implicit_grant { access_token_issuance_enabled = false,
    id_token_issuance_enabled = false }; fallback_public_client_enabled = false.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-pipeline-identity-separation
  name: Separated and Constrained Pipeline Identities
  description: |
    Use separate deployment identities per environment and for plan
    (read-only) versus apply. Replace Owner with Contributor plus Role Based
    Access Control Administrator constrained by ABAC conditions to allowed
    roles and principal types. Protect apply with environment approvals.
    Terraform: azurerm_role_assignment with condition / condition_version for
    delegated role assignment.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: cm-conditional-access-workload-identities
  name: Conditional Access for Workload Identities
  description: |
    Apply Conditional Access to single-tenant service principals to block
    sign-ins from outside known locations and on high service principal risk
    (requires Workload Identities Premium).
    Terraform: azuread_conditional_access_policy with
    client_applications { included_service_principals = [...] }.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
  default_status: platform
- id: cm-identity-lifecycle-reviews
  name: Workload Identity Lifecycle and Access Reviews
  description: |
    Assign owners to every workload identity. Review permissions and
    credentials periodically and remove unused service principals,
    credentials and role assignments. Review third-party app permissions.
  control_functions: [detective, corrective]
  control_nature: administrative
  cost: low
- id: cm-function-app-entra-auth
  name: Function App Entra ID Authentication
  description: |
    Protect HTTP triggers with App Service Authentication or API Management
    using Entra ID tokens. Do not rely on function keys as the only control,
    and never use anonymous triggers for non-public functions.
    Terraform: auth_settings_v2 { require_authentication = true };
    azurerm_api_management_api in front.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-function-app-storage-identity
  name: Function App Dedicated Storage With Managed Identity
  description: |
    Use a dedicated storage account per function app with identity-based
    AzureWebJobsStorage connections and shared key disabled. Store function
    keys in Key Vault.
    Terraform: storage_uses_managed_identity = true; app_settings
    AzureWebJobsSecretStorageType = "keyvault" with
    AzureWebJobsSecretStorageKeyVaultUri; storage account
    shared_access_key_enabled = false.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-input-validation
  name: Schema Validation of Untrusted Input
  description: |
    Validate all inputs, including messages from queues and events, against
    strict schemas. Use safe deserializers without polymorphic type handling,
    and reject unexpected fields.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-function-app-scale-limits
  name: Function App Scale Limits
  description: |
    Cap maximum instances and protect HTTP triggers with throttling (API
    Management, Front Door rate limits). Set budget alerts.
    Terraform: site_config.app_scale_limit / function_app_scale_limit, or
    maximum_instance_count on Flex Consumption.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-acr-disable-admin-user
  name: Disable ACR Admin User
  description: |
    Disable the admin account and use Entra identities (managed identity,
    workload identity federation) or scoped repository tokens.
    Terraform: admin_enabled = false.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-acr-disable-anonymous-pull
  name: Disable ACR Anonymous Pull
  description: |
    Require authentication for all pulls.
    Terraform: anonymous_pull_enabled = false.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-acr-image-signing-and-locking
  name: ACR Image Signing, Tag Locking and Retention
  description: |
    Sign images (Notation) in CI and verify signatures at deployment. Lock
    release tags and digests against overwrite and deletion, and
    geo-replicate critical registries.
    Terraform: az acr repository update --write-enabled false --delete-enabled
    false (via pipeline); georeplications blocks; AKS admission verification
    (Ratify).
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: cm-log-analytics-access-control
  name: Log Analytics Access Control and Local Auth Disabled
  description: |
    Use resource-context access and table-level RBAC so users see only logs
    of resources they can access. Disable workspace shared keys. Restrict
    workspace-wide readers to the SOC.
    Terraform: allow_resource_only_permissions = true;
    local_authentication_enabled = false; role assignments on
    "<workspace_id>/tables/<table>".
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-log-data-minimization
  name: Log Data Minimization and Secret Redaction
  description: |
    Do not log secrets, tokens or unnecessary personal data. Use redaction
    in logging libraries and data collection rule transformations to drop or
    mask sensitive fields.
    Terraform: azurerm_monitor_data_collection_rule data_flow
    transform_kql removing sensitive columns.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-log-immutability
  name: Tamper-Resistant Log Archive
  description: |
    Continuously export security tables to immutable storage, restrict the
    Data Purger role, lock the workspace against deletion, and alert on
    purge, retention and table changes.
    Terraform: azurerm_log_analytics_data_export_rule to a storage account
    with immutability policy; azurerm_management_lock on the workspace.
  control_functions: [preventive, recovery]
  control_nature: technical
  cost: medium
- id: cm-log-analytics-private-link
  name: Azure Monitor Private Link Scope
  description: |
    Use AMPLS with private endpoints and disable public ingestion and query
    for security workspaces.
    Terraform: azurerm_monitor_private_link_scope and
    azurerm_monitor_private_link_scoped_service; internet_ingestion_enabled =
    false; internet_query_enabled = false.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: cm-log-analytics-capacity-alerting
  name: No Hard Ingestion Cap on Security Workspaces
  description: |
    Avoid daily caps on security workspaces, or alert well before reaching
    them. Use commitment tiers and ingestion-time filtering to control cost.
    Terraform: daily_quota_gb = -1 for security workspaces;
    azurerm_monitor_scheduled_query_rules_alert_v2 on _LogOperation cap events.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: medium
- id: cm-log-retention
  name: Log Retention Aligned to Investigation Needs
  description: |
    Retain security logs interactively for at least 90 days and in archive
    or long-term retention for at least one year, or longer where
    regulations require.
    Terraform: retention_in_days >= 90; azurerm_log_analytics_workspace_table
    total_retention_in_days.
  control_functions: [detective]
  control_nature: technical
  cost: medium
- id: cm-defender-plan-coverage
  name: Defender for Cloud Plan Coverage via Policy
  description: |
    Enable required Defender plans on all subscriptions, including new ones,
    through management-group policy assignments (e.g. "Configure Microsoft
    Defender for ... to be enabled"), and monitor coverage.
    Terraform: azurerm_security_center_subscription_pricing per subscription
    and resource_type, or azurerm_management_group_policy_assignment with
    DeployIfNotExists.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: medium
  default_status: platform
- id: cm-defender-alert-routing
  name: Defender for Cloud Alert Routing
  description: |
    Configure security contacts, continuous export to Log Analytics / Event
    Hubs and the Defender XDR / Sentinel connector so alerts create tracked
    incidents.
    Terraform: azurerm_security_center_contact;
    azurerm_security_center_automation with action { type = "loganalytics" }.
  control_functions: [detective]
  control_nature: technical
  cost: low
  default_status: platform
- id: aci-keyvault-secrets
  name: Secrets From Key Vault via Managed Identity
  description: |
    Do not pass credentials through the CLI or plain environment variables. Read them from Key Vault with the managed identity of the container group, or use secure environment variables.
    Terraform: azurerm_container_group { identity { type = "UserAssigned" }, container { secure_environment_variables = {...} } }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: aci-least-privilege-runtime
  name: Run Containers Without Unnecessary Privileges
  description: |
    Do not run containers as root or privileged, remove unneeded processes and files and allow only the capabilities the application requires.
    Terraform: azurerm_container_group.container.security { privilege_enabled = false }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: aci-private-registry-scan
  name: Private Registry and Image Scanning
  description: |
    Pull images from a private registry such as Azure Container Registry and scan them for vulnerabilities before deployment.
    Terraform: azurerm_container_group.image_registry_credential or managed identity pull from azurerm_container_registry; Defender for Containers enabled.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: low
- id: aci-vnet-nsg
  name: Container Groups in a Virtual Network With NSG
  description: |
    Deploy container groups into a virtual network, apply NSG rules to the delegated subnet and use a NAT gateway for controlled outbound traffic.
    Terraform: azurerm_container_group.subnet_ids with ip_address_type = "Private"; azurerm_network_security_group on the subnet; azurerm_nat_gateway.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: acr-disable-admin-user
  name: Disable the Container Registry Admin Account
  description: |
    Disable the admin account and use Microsoft Entra identities with role-based permissions such as AcrPull and AcrPush.
    Terraform: azurerm_container_registry.admin_enabled = false; azurerm_role_assignment { role_definition_name = "AcrPull" }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: acr-disable-anonymous-pull
  name: Disable Anonymous Pull on Container Registries
  description: |
    Enable anonymous pull only for registries that are explicitly public.
    Terraform: azurerm_container_registry.anonymous_pull_enabled = false.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: acr-private-endpoint
  name: Private Endpoint and Disabled Public Access for Container Registry
  description: |
    Create a private endpoint and disable public network access, which requires the Premium SKU.
    Terraform: azurerm_private_endpoint { subresource_names = ["registry"] }; azurerm_container_registry.public_network_access_enabled = false.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: adls-disable-anonymous-read
  name: Disable Anonymous Read Access on Data Lake
  description: |
    Disable anonymous access to containers and require authorization for every request, because anonymous read makes ACLs ineffective for reads.
    Terraform: azurerm_storage_account.allow_nested_items_to_be_public = false.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: adls-group-based-acls
  name: Group-Based ACLs With RBAC for Coarse Access
  description: |
    Use Entra security groups as ACL principals, set default ACLs on directories and keep RBAC for coarse-grained access, so membership changes take effect everywhere without editing individual entries.
    Terraform: azurerm_storage_data_lake_gen2_path.ace { type = "group", id = <group object id> }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: adls-private-endpoints-blob-dfs
  name: Private Endpoints for Both blob and dfs
  description: |
    Create one private endpoint for the blob sub-resource and one for the dfs sub-resource of every Data Lake Storage account.
    Terraform: azurerm_private_endpoint { subresource_names = ["blob"] } and azurerm_private_endpoint { subresource_names = ["dfs"] }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: afs-ad-ds-identity
  name: AD DS Identity for Azure Files Shares
  description: |
    Domain-join the storage account or use Entra Kerberos so that AD DS permissions also apply to cloud shares.
    Terraform: azurerm_storage_account.azure_files_authentication { directory_type = "AD" or "AADKERB" }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: afs-azure-files-backup
  name: Azure Files Backup for Synced Shares
  description: |
    Protect shares with Azure Files backup using snapshots and vaulted backups.
    Terraform: azurerm_backup_policy_file_share and azurerm_backup_protected_file_share.
  control_functions: [recovery]
  control_nature: technical
  cost: low
- id: afs-private-endpoints
  name: Private Endpoints for Azure Files and Azure File Sync
  description: |
    Create private endpoints for the storage account and the Storage Sync Service and disable the public endpoints.
    Terraform: azurerm_private_endpoint { subresource_names = ["afs"] } and { subresource_names = ["file"] }; azurerm_storage_sync.incoming_traffic_policy = "AllowVirtualNetworksOnly".
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: agw-end-to-end-tls
  name: End-to-End TLS to the Application Gateway Backend
  description: |
    Set the backend HTTP settings to HTTPS and register the backend certificate or its root CA.
    Terraform: azurerm_application_gateway.backend_http_settings { protocol = "Https", trusted_root_certificate_names = [...] }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: agw-least-privilege-rbac
  name: Least-Privilege Roles for Application Gateway
  description: |
    Limit management rights to the resource group or the gateway, require Conditional Access for administrators and review access regularly.
    Terraform: azurerm_role_assignment scoped to azurerm_application_gateway.<name>.id for a named network operations group.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: agw-tls-policy
  name: Current TLS Policy on Application Gateway
  description: |
    Set the latest predefined TLS policy that enforces TLS 1.2 and stronger ciphers.
    Terraform: azurerm_application_gateway.ssl_policy { policy_type = "Predefined", policy_name = "AppGwSslPolicy20220101S" }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: agw-waf-v2-prevention
  name: WAF v2 in Prevention Mode
  description: |
    Enable WAF v2, use the default rule set (DRS 2.2) and switch to Prevention mode after tuning.
    Terraform: azurerm_web_application_firewall_policy { policy_settings { mode = "Prevention" }, managed_rules { managed_rule_set { type = "Microsoft_DefaultRuleSet", version = "2.2" } } }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: ai-content-filtering
  name: Layered Content Filtering and Safety Meta-Prompts
  description: |
    Screen inputs with Prompt Shields and Azure AI Content Safety, filter outputs, harden the system prompt with safety meta-prompts and treat retrieved documents as untrusted input.
    Terraform: azurerm_cognitive_deployment.rai_policy_name referencing a strict content filter policy.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: ai-managed-identity-auth
  name: Managed Identity Instead of API Keys for AI Services
  description: |
    Authenticate applications with a Microsoft Entra managed identity and the Cognitive Services OpenAI User or Cognitive Services User role, then disable key authentication so keys cannot be used.
    Terraform: azurerm_cognitive_account { local_auth_enabled = false, identity { type = "SystemAssigned" } }; azurerm_role_assignment { role_definition_name = "Cognitive Services OpenAI User" }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: ai-private-endpoint
  name: Private Endpoints for AI Platform Services
  description: |
    Create private endpoints for every AI platform service and restrict or disable the public endpoint so models and data are reached only from approved networks.
    Terraform: azurerm_private_endpoint { subresource_names = ["account"] }; azurerm_cognitive_account.public_network_access_enabled = false.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: anf-cmk-encryption
  name: Customer-Managed Keys for ANF Volumes
  description: |
    Use customer-managed keys in Azure Key Vault for encryption of Azure NetApp Files volumes, with purge protection and key rotation. Monitor key vault access logs for unexpected key use. Source: MCSB v2 DP-5.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: anf-diagnostic-logging
  name: ANF and Network Flow Logging
  description: |
    Enable diagnostic settings for ANF accounts and NSG flow logs for the delegated subnet. Detection: alert on export policy changes and on mount activity from hosts outside the approved client list. Source: MCSB v2 LT-4.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: anf-export-policy-kerberos
  name: NFS Export Policy Restriction and Kerberos
  description: |
    Restrict ANF export policy rules to specific client hosts or subnets with read-only default and no root access where possible. Use NFSv4.1 with Kerberos (krb5p) for authentication and encryption instead of AUTH_SYS, which trusts client-supplied UIDs. Source: MCSB v2 NS-2, IM-7.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: anf-immutable-backup-lock
  name: Backup Vault Immutability and Resource Locks
  description: |
    Use an ANF backup vault with immutability or vault locks, cross-region backup copies, and CanNotDelete resource locks on capacity pools and volumes. Separate backup administration from storage administration so one Contributor cannot remove all recovery points. Source: MCSB v2 BR-2.
  control_functions: [preventive, recovery]
  control_nature: technical
  cost: medium
- id: anf-permission-model-review
  name: Single Security Style and ACL Validation
  description: |
    Choose one security style per dual-protocol volume (NTFS or UNIX) and document the mapping. After permission changes, validate effective access from both SMB and NFS clients. Review periodically with a script that compares ACLs and mode bits. Source: MCSB v2 IM-7, PA-7.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: anf-snapshot-delete-alert
  name: Snapshot and Volume Deletion Alerts
  description: |
    Create Activity Log alerts for delete operations on ANF volumes, snapshots, and backup vaults. Detection: any delete outside a change window, or more than three deletes by one principal within 15 minutes. Source: MCSB v2 LT-1.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: apic-least-privilege-keyvault
  name: Key Vault Secrets User Only for the API Center Identity
  description: |
    Give the API Center managed identity only the Key Vault Secrets User role on the specific vault that holds API credentials, using Azure RBAC rather than access policies.
    Terraform: azurerm_role_assignment { role_definition_name = "Key Vault Secrets User", scope = azurerm_key_vault.<name>.id }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: apic-register-all-apis
  name: Register All APIs in the API Center Inventory
  description: |
    Maintain an inventory of every API, including unmanaged and in-development ones, link gateway environments and apply governance rules so shadow APIs are found and reviewed.
  control_functions: [preventive]
  control_nature: administrative
  cost: low
- id: apic-scope-credential-access
  name: Scope API Center Credential Access per User or Group
  description: |
    Grant the credential access reader role per authentication configuration to specific users or groups instead of all portal users, and prefer OAuth 2.0 with PKCE so no shared secret is stored.
    Terraform: azurerm_role_assignment.role_definition_name = "Azure API Center Data Reader" scoped to individual APIs rather than the service.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: appi-entra-authentication
  name: Entra ID Authentication for Application Insights Ingestion
  description: |
    Authenticate telemetry ingestion with Microsoft Entra ID using the Monitoring Metrics Publisher role and disable local authentication so the instrumentation key alone no longer works.
    Terraform: azurerm_application_insights.local_authentication_enabled = false; azurerm_role_assignment { role_definition_name = "Monitoring Metrics Publisher" }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: appi-scrub-sensitive-telemetry
  name: Scrub Sensitive Values From Telemetry
  description: |
    Remove or mask personal data and secrets with telemetry initializers or workspace transformations, avoid logging request bodies and query strings, and purge data when sensitive values are found.
    Terraform: azurerm_application_insights.ip_masking_enabled = true; azurerm_monitor_data_collection_rule with transformKql for sensitive columns.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: appi-secret-references
  name: Connection String via Environment Variable or Key Vault Reference
  description: |
    Supply the connection string through the APPLICATIONINSIGHTS_CONNECTION_STRING environment variable or a Key Vault reference, never in source code or committed configuration.
    Terraform: azurerm_linux_web_app.app_settings { APPLICATIONINSIGHTS_CONNECTION_STRING = "@Microsoft.KeyVault(SecretUri=...)" }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: appservice-app-settings-keyvault
  name: Key Vault References for App Settings
  description: |
    Store connection strings and secrets in Key Vault and reference them from app settings with Key Vault references. Rotate secrets and remove plaintext values from configuration and deployment templates. Source: MCSB v2 IM-8.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: appservice-diagnostic-logging
  name: App Service HTTP and Application Logging
  description: |
    Enable HTTP logs, application logs, and audit logs for App Service and send them to Log Analytics. Detection: alert on bursts of requests to internal or metadata addresses in application logs and on SCM access events. Source: MCSB v2 LT-3.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: appservice-disable-scm-public
  name: Disable Public SCM and Basic Publishing Credentials
  description: |
    Disable basic authentication for FTP and SCM publishing (basicPublishingCredentialsPolicies), restrict the scm site with access restrictions or a private endpoint, and rotate publish profiles after any exposure. Use Entra ID deployment identities instead. Source: MCSB v2 NS-2, IM-4.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: appservice-imds-egress-control
  name: SSRF Defense and Metadata Endpoint Blocking
  description: |
    Validate and allowlist outbound destinations in application code (scheme, host, resolved IP). Block 169.254.169.254 and other metadata addresses at the app level and through VNet integration with egress firewall rules. The Metadata: true header required by IMDS is not a defense, because SSRF that can set headers can add it. Source: MCSB v2 IM-3, NS-2.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: appservice-managed-identity-least-privilege
  name: Per-Application Managed Identity with Scoped RBAC
  description: |
    Use a dedicated user-assigned managed identity per application and assign RBAC roles at resource scope (for example, Key Vault Secrets User on one vault). Never assign Owner or Contributor at subscription scope to application identities. Source: MCSB v2 IM-3, PA-7.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: appservice-rce-sast
  name: Secure SDLC for App Service Workloads
  description: |
    Run SAST and dependency scanning in CI (Microsoft Defender for DevOps or equivalent), enforce input validation and parameterized queries, avoid dynamic code evaluation, and deploy only signed artifacts through deployment slots with approval gates. Source: MCSB v2 PV-6.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: appservice-secure-runtime
  name: App Service Runtime Hardening
  description: |
    Enforce HTTPS only, minimum TLS 1.2, disable remote debugging, keep the runtime stack on a supported version, and place a WAF (Azure Front Door or Application Gateway) in front of the app. Follow CIS Azure Foundations App Service recommendations. Source: MCSB v2 DP-3, PV-3.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: appservice-waf
  name: Web Application Firewall in Front of App Service
  description: |
    Place Azure Front Door or Application Gateway with WAF in front of the app, use managed rule sets in prevention mode, and allow inbound traffic to the app only through the WAF (access restrictions). Source: MCSB v2 NS-2.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: arc-full-disk-encryption
  name: Volume Encryption on Arc-Enabled Servers
  description: |
    Enable full disk encryption such as BitLocker or dm-crypt on the operating system volume so the managed identity credential cannot be read offline.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: arc-least-privilege-roles
  name: Least-Privilege Roles for Arc-Enabled Servers
  description: |
    Do not grant Contributor or Owner for Arc server access. Use the Azure Connected Machine Onboarding role for registration and the Azure Connected Machine Resource Administrator role for management, assigned through PIM.
    Terraform: azurerm_role_assignment { role_definition_name = "Azure Connected Machine Resource Administrator" }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: arc-onboarding-certificate-sp
  name: Certificate-Based Arc Onboarding Service Principal
  description: |
    Onboard servers with a service principal that uses a certificate, scoped to a single resource group and holding only the onboarding role, and avoid long-lived client secrets.
    Terraform: azuread_application_certificate; azurerm_role_assignment { role_definition_name = "Azure Connected Machine Onboarding", scope = azurerm_resource_group.<name>.id }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: arc-restrict-himds-group
  name: Restrict Arc Agent Local Groups
  description: |
    Limit membership of the Hybrid Agent Extension Applications group on Windows, the himds group on Linux and the local administrators to the minimum number of administrators, because members can request managed identity tokens.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: asr-customer-managed-keys
  name: Customer-Managed Keys for Replicated Disks
  description: |
    Encrypt replicated disks with customer-managed keys from Key Vault where compliance requires it.
    Terraform: azurerm_site_recovery_replicated_vm.managed_disk.target_disk_encryption_set_id = azurerm_disk_encryption_set.<name>.id.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: asr-least-privilege-roles
  name: Least-Privilege Site Recovery Roles
  description: |
    Assign Site Recovery Operator, Contributor and Reader by task and avoid Contributor at subscription scope.
    Terraform: azurerm_role_assignment { role_definition_name = "Site Recovery Operator", scope = azurerm_recovery_services_vault.<name>.id }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: asr-private-replication
  name: Replication Over Private Endpoints
  description: |
    Route Site Recovery replication through private endpoints instead of public endpoints.
    Terraform: azurerm_private_endpoint for the cache storage account and the Recovery Services vault; azurerm_recovery_services_vault.public_network_access_enabled = false.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: avd-appgroup-preferred-type
  name: RemoteApp as Preferred Application Group Type Where Possible
  description: |
    Set the preferred application group type to RemoteApp where users need only specific applications, and remove the automatically registered desktop group when it is not needed. Verification: Confirm each workspace registers only the application groups that are needed, and no desktop-type group is assigned to broad groups without a documented reason. Source: Deploy Azure Virtual Desktop: preferred application group type and default desktop application group.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: avd-appgroup-role-review
  name: Application Group Roles Restricted and Reviewed
  description: |
    Restrict Owner, User Access Administrator and Desktop Virtualization Contributor on application groups to named administrators, and review assigned users and groups regularly. Verification: Export role assignments and application group assignments; no unexpected Owner or User Access Administrator entries, and assigned groups match the documented access model. Source: Deploy Azure Virtual Desktop, Prerequisites; Built-in Azure RBAC roles for AVD.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: low
- id: avd-conditional-access-mfa
  name: Conditional Access With MFA for Azure Virtual Desktop
  description: |
    Require Entra MFA through a Conditional Access policy for the Azure Virtual Desktop and Windows Cloud Login apps, and review MFA policies for Entra-joined session hosts. Verification: Check the Conditional Access policy targeting the Azure Virtual Desktop and Windows Cloud Login apps: grant control requires MFA and the policy is enabled. Source: Enforce Microsoft Entra MFA for AVD using Conditional Access; Microsoft Entra joined session hosts.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: avd-domain-join-delegation
  name: Domain Join Account With Only the Required OU Permissions
  description: |
    Use a dedicated domain join account and delegate only the permissions listed for computer objects in the session host OU, and apply the computer account re-use policy where the account is not the creator. Verification: Review the effective permissions of the join account on the session host OU; no Full Control, no rights on other OUs, and the account is used only for joins. Source: Deploy Azure Virtual Desktop, Prerequisites: AD DS permissions and KB5020276 computer account re-use.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: avd-fslogix-av-exclusions-scoped
  name: Antivirus Exclusions Limited to Profile Containers
  description: |
    Exclude only the FSLogix profile container files and folders from real-time scanning, and scan profile containers on mount with a scheduled or on-access scan. Verification: Compare the antivirus exclusion list with the FSLogix guidance: only the profile container paths and extensions are excluded, and no exclusion covers other user folders. Source: FSLogix prerequisites: configure antivirus file and folder exclusions; Security recommendations for AVD: endpoint protection.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: medium
- id: avd-hostpool-diagnostics
  name: Host Pool Diagnostic Settings Enabled
  description: |
    Enable diagnostic settings on the host pool and send logs to a Log Analytics workspace, so that host pool changes and session activity are retained. Verification: Confirm a diagnostic setting exists for the host pool with a Log Analytics destination and that the workspace receives host pool entries. Source: Deploy Azure Virtual Desktop, Management tab: enable diagnostic settings.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: avd-hostpool-mi-secret-scope
  name: Host Pool Identity Limited to the Required Secrets
  description: |
    Grant the host pool managed identity Key Vault Secrets User on the two secrets for the local administrator and the domain join account only, not on the whole vault. Verification: Inspect the role assignment of the host pool managed identity on the Key Vault: scope must be the individual secrets, and no other secrets are readable. Source: Deploy Azure Virtual Desktop, Prerequisites: Key Vault RBAC for the host pool managed identity.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: avd-hostpool-token-role-review
  name: Registration Token Access Limited to Named Administrators
  description: |
    Limit roles that can retrieve the host pool registration token to named administrators, use Host Pool Reader or Session Host Operator for other staff, and rotate the token after session host deployments. Verification: List role assignments containing hostpools/retrieveRegistrationToken on the host pool and its parent scopes; only named deployment administrators are listed. Source: Built-in Azure RBAC roles for AVD: role definitions with hostpools/retrieveRegistrationToken.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: low
- id: avd-scaling-plan-max-sessions
  name: Max Session Limit Configured for Each Scaled Host Pool
  description: |
    Set a custom MaxSessionLimit for every pooled host pool that uses autoscale, sized to the session host capacity, and review it when the session host SKU changes. Verification: Confirm the host pool's max session limit is not the default value and matches the session host capacity used in the scaling plan. Source: Create and assign an autoscale scaling plan for AVD, Prerequisites: MaxSessionLimit.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: avd-scaling-plan-scope
  name: Scaling Plan Roles Limited to the Required Scope
  description: |
    Assign the Azure Virtual Desktop service principal or the host pool managed identity only the roles the scaling plan needs, and limit the assignable subscriptions to those that contain the scaled host pools. Verification: Check the role assignments of the service principal and of the host pool managed identity for scope and role names, and confirm only the subscriptions with scaled host pools are assignable. Source: Create and assign an autoscale scaling plan for AVD: assign roles at subscription scope; service principal permissions.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: avd-sh-edr
  name: Endpoint Protection and EDR on Session Hosts
  description: |
    Enable endpoint protection on all session hosts and onboard them to an EDR product, such as Microsoft Defender for Endpoint, with exclusions limited to required paths. Verification: Confirm each session host is onboarded to the EDR product and reports health; check the AV exclusion list against the FSLogix guidance. Source: Security recommendations for AVD: enable endpoint protection and install an EDR product.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: medium
- id: avd-sh-egress-control
  name: Session Host Egress Limited by Firewall, NVA or Proxy
  description: |
    Route session host outbound traffic through Azure Firewall, a network virtual appliance or a proxy, and allow only the required AVD endpoints and business destinations. Verification: Check the subnet route table and firewall rules: outbound internet traffic from session host subnets goes through the firewall and only required FQDNs are allowed. Source: Security recommendations for AVD: limit internet traffic with Azure Firewall, NVAs or proxies; Security and governance (CAF): networking.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: avd-sh-idle-lock
  name: Idle Timeout and Screen Lock for Sessions
  description: |
    Configure maximum inactive time, disconnect and log-off policies, and screen lock for idle sessions through Group Policy or Intune. Verification: Check the applied session timeout and idle lock settings on a session host with gpresult or the Intune policy report. Source: Security recommendations for AVD: establish maximum inactive time and disconnection policies; set up screen locks for idle sessions.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: avd-sh-jit-no-direct-rdp
  name: Just-in-Time Access Instead of Direct RDP
  description: |
    Administer session hosts through just-in-time access and the AVD reverse connect path, and remove permanent RDP access from session hosts. Verification: Confirm no inbound RDP rule allows broad sources on session host NSGs, and that administrative access is granted only through a time-limited just-in-time request. Source: Security and governance (CAF) for AVD: just-in-time access; avoid direct RDP.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: avd-sh-laps-rotation
  name: Local Administrator Passwords Rotated by LAPS
  description: |
    Use Microsoft LAPS on session hosts so that local administrator passwords are unique per machine and rotated automatically. Verification: On a session host, confirm the LAPS password attributes are populated and the policy's rotation interval is set. Source: Identity and access management recommendations for AVD: secure local admin accounts (LAPS).
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: avd-sh-no-user-admin
  name: No Local Administrator Rights for Users
  description: |
    Do not add users to the local Administrators group on session hosts. Deliver software through configuration management such as Intune. Verification: Review the local Administrators group on a sample of session hosts; only approved administrator groups are members. Source: Security recommendations for AVD: establish tiered admin access.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: avd-sh-patch-image
  name: Monthly Patching of Session Host Base Images
  description: |
    Patch the base image every month and redeploy session hosts from the patched image, and track vulnerabilities on session hosts with a vulnerability assessment. Verification: Compare the image build date and patch level with the current monthly release; confirm the vulnerability assessment reports no critical findings on session hosts. Source: Security recommendations for AVD: patch base images monthly; threat and vulnerability management.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: medium
- id: avd-workspace-role-review
  name: Workspace Role Assignments Restricted and Reviewed
  description: |
    Assign Desktop Virtualization Contributor on the workspace only to named administrators and review assignments above the workspace scope. Verification: List the role assignments on the workspace and its parent scopes; no broad Desktop Virtualization Contributor assignments for users or groups that do not administer AVD. Source: Built-in Azure RBAC roles for Azure Virtual Desktop.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: low
- id: azure-files-backup-soft-delete
  name: Azure Files Backup and Soft Delete
  description: |
    Protect file shares with Azure Backup in a Recovery Services vault with soft delete and a retention lock. Restrict backup deletion to a separate administrative role and require MFA for backup deletion. Source: MCSB v2 BR-1, BR-2.
  control_functions: [recovery]
  control_nature: technical
  cost: medium
- id: azure-files-diagnostic-monitoring
  name: Azure Files Diagnostic Logging and Alerts
  description: |
    Send StorageFileLogs and storage metrics to Log Analytics. Detection: alert on ListKeys/RegenerateKey operations, on SAS generation outside the approved pipeline identity, and on share access by principals not in the expected group. Query example: StorageFileLogs | where OperationName has_any ("ListKeys","RegenerateKey"). Source: MCSB v2 LT-3, DP-2.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: azure-files-disable-shared-key
  name: Disable Shared Key Access on Storage Accounts
  description: |
    Set allowSharedKeyAccess to false on storage accounts hosting Azure Files and authenticate with Entra ID (identity-based SMB access) instead. Removes account keys as a bypass for RBAC and NTFS ACLs. Aligns with CIS Azure Foundations storage hardening. Source: MCSB v2 IM-8.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: azure-files-identity-rbac-with-ntfs
  name: Least-Privilege RBAC with NTFS ACLs
  description: |
    Grant only the Storage File Data SMB roles needed at share scope, avoid Elevated Contributor for broad groups, and enforce directory-level NTFS ACLs for the actual access model. Never grant share roles to Everyone or Authenticated Users. Review role assignments quarterly. Source: MCSB v2 IM-7, PA-7.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: azure-files-private-endpoint
  name: Private Endpoint and Public Access Disabled
  description: |
    Expose the file service only through a private endpoint, set publicNetworkAccess to Disabled, and set the storage firewall default action to Deny. Resolve privatelink DNS only inside approved networks. Source: MCSB v2 NS-2, NS-9.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: azure-files-short-lived-sas
  name: Short-Lived Scoped SAS Tokens
  description: |
    Issue user-delegation SAS tokens (Entra ID backed) with minimal permissions, short expiry, and IP restrictions. Rotate account keys on a schedule and after any suspected exposure. Keep secrets in Key Vault, never in code or tickets. Source: MCSB v2 IM-8.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: azure-files-smb-encryption
  name: SMB 3.x Encryption and Minimum Protocol Version
  description: |
    Require SMB 3.1.1 with encryption in transit for Azure Files shares, and disable SMB 2.x and unencrypted access. Verify client support before enforcement. Source: MCSB v2 DP-3.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: b2c-enable-mfa
  name: Enable MFA in B2C User Flows
  description: |
    Add Microsoft Entra multifactor authentication to sign-up and sign-in flows and add further protection for sensitive applications.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: b2c-smart-lockout
  name: Password Complexity and Smart Lockout in B2C
  description: |
    Configure password complexity, keep smart lockout enabled and force a password reset when compromise is suspected.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: b2c-user-risk-policy
  name: Conditional Access on User Risk in B2C
  description: |
    Create a policy for medium and high user risk that requires MFA and a password change. B2C tenants need the license for Identity Protection.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: low
- id: bastion-entra-id-auth
  name: Entra ID Authentication for Bastion Sessions
  description: |
    Enable Microsoft Entra ID sign-in for SSH and RDP so that MFA and Conditional Access apply.
    Terraform: azurerm_role_assignment { role_definition_name = "Virtual Machine User Login" }; AADSSHLoginForLinux extension via azurerm_virtual_machine_extension.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: bastion-no-public-ip
  name: Remove Public IP Addresses From VMs Behind Bastion
  description: |
    Remove public IP addresses from VMs that are meant to be reached only through Bastion.
    Terraform: azurerm_network_interface.ip_configuration.public_ip_address_id unset.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: bastion-nsg-required-rules
  name: Implement Required Bastion NSG Rules Exactly
  description: |
    Set the required inbound and outbound rules for AzureBastionSubnet and allow RDP and SSH on target subnets only from AzureBastionSubnet.
    Terraform: azurerm_network_security_rule with source_address_prefix set to the AzureBastionSubnet range on ports 3389 and 22.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: bkp-immutable-vault-lock
  name: Locked Immutable Backup Vault
  description: |
    Enable immutability and lock it so recovery points cannot be deleted or shortened before expiry, even by administrators holding vault rights.
    Terraform: azurerm_recovery_services_vault.immutability = "Locked"; azurerm_data_protection_backup_vault.immutability = "Locked".
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: bkp-mua-resource-guard
  name: Multi-User Authorization With Resource Guard
  description: |
    Enable multi-user authorization on backup vaults and place the Resource Guard in a separate subscription or tenant, so no single person holds all permissions needed to disable protection or delete backups.
    Terraform: azurerm_data_protection_resource_guard in a separate subscription; associate it with the vault (azapi_resource where the provider has no property).
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: bkp-private-endpoint
  name: Private Endpoint and Disabled Public Access for Azure Backup
  description: |
    Create private endpoints for the Recovery Services vault and disable public network access so backup and restore traffic stays on private networks.
    Terraform: azurerm_private_endpoint { subresource_names = ["AzureBackup"] }; azurerm_recovery_services_vault.public_network_access_enabled = false.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: bkp-soft-delete-always-on
  name: Always-On Soft Delete for Backup Vaults
  description: |
    Enable soft delete and set it to always-on with a retention beyond the policy retention (at least 14 days) so deleted backups remain recoverable and the setting cannot be reverted.
    Terraform: azurerm_data_protection_backup_vault { soft_delete = "AlwaysOn", retention_duration_in_days = 30 }.
  control_functions: [recovery]
  control_nature: technical
  cost: low
- id: ddos-monitoring-telemetry
  name: DDoS Telemetry and Mitigation Logs in Azure Monitor
  description: |
    Enable diagnostic settings for DDoS metrics and mitigation logs and alert on the under-DDoS-attack metric.
    Terraform: azurerm_monitor_diagnostic_setting on azurerm_public_ip with DDoSProtectionNotifications, DDoSMitigationFlowLogs and DDoSMitigationReports; azurerm_monitor_metric_alert.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: ddos-protect-every-public-ip
  name: DDoS Protection for Every Supported Public IP
  description: |
    Enable DDoS Network Protection on virtual networks or DDoS IP Protection on individual public IP addresses so each supported public endpoint is covered.
    Terraform: azurerm_virtual_network.ddos_protection_plan { id = azurerm_network_ddos_protection_plan.<name>.id, enable = true }; azurerm_public_ip.ddos_protection_mode = "Enabled".
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: ddos-validate-supported-deployment
  name: Validate Supported Deployment Models Before Relying on DDoS Protection
  description: |
    Check whether each public resource is supported before relying on the plan, document exceptions and add application-layer protection for unsupported endpoints.
  control_functions: [preventive]
  control_nature: administrative
  cost: low
- id: dds-disable-ntlm-password-sync
  name: Disable NTLM Password Synchronization
  description: |
    Disable NTLM password hash synchronization when no application needs NTLM or LDAP simple bind, then run a full password hash sync in Entra Connect so old hashes are removed.
    Terraform: azurerm_active_directory_domain_service.security { sync_ntlm_passwords = false }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: dds-disable-weak-protocols
  name: Disable Weak Protocols in Domain Services
  description: |
    Disable NTLMv1, TLS 1.0 and Kerberos RC4 and enable Kerberos armoring.
    Terraform: azurerm_active_directory_domain_service.security { ntlm_v1_enabled = false, tls_v1_enabled = false, kerberos_rc4_encryption_enabled = false, kerberos_armoring_enabled = true }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: dds-ldap-signing-channel-binding
  name: LDAP Signing and Channel Binding in Domain Services
  description: |
    Enable LDAP signing and LDAP channel binding on the managed domain to prevent NTLM credential relay.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: defender-containers-plan
  name: Enable the Defender for Containers Plan
  description: |
    Enable the Defender for Containers plan with registry scanning and control plane threat protection.
    Terraform: azurerm_security_center_subscription_pricing { resource_type = "Containers", tier = "Standard" }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: defender-enable-on-all-subscriptions
  name: Enable Defender for Cloud on All Subscriptions
  description: |
    Enable foundational CSPM on every subscription and connect multicloud accounts so all resources are assessed.
    Terraform: azurerm_security_center_subscription_pricing { tier = "Standard", resource_type = "CloudPosture" } per subscription.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: defender-review-recommendations
  name: Remediate Recommendations by Severity
  description: |
    Prioritize recommendations by risk, assign owners and track progress in the secure score with governance rules and due dates.
  control_functions: [detective, preventive]
  control_nature: administrative
  cost: low
- id: dhsm-change-default-credentials
  name: Change Default Credentials Immediately After Provisioning
  description: |
    Change the default tenant administrator password straight after provisioning, store the new secret securely and restrict management access to a dedicated subnet.
  control_functions: [preventive]
  control_nature: administrative
  cost: low
- id: dhsm-ha-pairs-backup
  name: HSM Pairs and Regular Key Backup
  description: |
    Run at least two HSMs per region as an HA pair, back up keys regularly to a second location and test the restore procedure.
  control_functions: [recovery]
  control_nature: administrative
  cost: low
- id: dhsm-operational-procedures
  name: Operational Procedures Against Role Destruction
  description: |
    Define sign-in procedures, roles and automation behaviour so that failed attempts cannot destroy the HSM roles, and never script retries against the management interface.
  control_functions: [preventive]
  control_nature: administrative
  cost: low
- id: dns-review-zone-links
  name: Review Private DNS Zone Links and Auto-Registration
  description: |
    Review virtual network links and auto-registration per zone on a schedule and enable them only for VNets that need them.
    Terraform: azurerm_private_dns_zone_virtual_network_link.registration_enabled = false except for designated registration zones.
  control_functions: [preventive]
  control_nature: administrative
  cost: low
- id: dns-security-policy
  name: DNS Security Policy With Threat Intelligence
  description: |
    Enable a DNS security policy so resolution of known malicious domains is blocked and logged.
    Terraform: azurerm_firewall_policy.dns { proxy_enabled = true } with threat intelligence mode set to Deny.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: dns-validating-resolver
  name: Validating DNS Resolver Where DNSSEC Is Required
  description: |
    Where DNSSEC validation is required, use a resolver that validates or let the application verify identity itself through TLS.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: entra-block-legacy-auth
  name: Block Legacy Authentication and Device Code Flow
  description: |
    Block legacy authentication protocols (IMAP, POP, SMTP AUTH, basic-auth EWS) with a Conditional Access policy for all users. Block the device code authentication flow unless a documented scenario requires it. Source: MCSB v2 IM-6, IM-7.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: entra-break-glass-accounts
  name: Monitored Emergency Access Accounts
  description: |
    Maintain two cloud-only emergency access accounts with phishing-resistant credentials, excluded from Conditional Access only where required. Detection: alert on any sign-in by these accounts, with an out-of-band notification to the security team. Source: MCSB v2 PA-5.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: low
- id: entra-ca-gap-review
  name: Conditional Access Baseline and Exclusion Review
  description: |
    Maintain a Conditional Access baseline with explicit targeting for all cloud apps and all users. Limit exclusions to two monitored break-glass accounts, keep named locations narrow, and require compliant or hybrid-joined devices for admin portals. Review policy changes through Entra audit logs. Source: MCSB v2 IM-7.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: entra-customer-lockbox
  name: Customer Lockbox for Azure
  description: |
    Enable Customer Lockbox so Microsoft engineers need explicit approval before accessing customer data for support. Include the approval workflow in the provider access process. Source: MCSB v2 PA-8.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: entra-password-protection
  name: Entra Password Protection and Smart Lockout
  description: |
    Enable Microsoft Entra Password Protection with a global and custom banned-password list and smart lockout thresholds. Detection: alert on sign-in failure bursts across many accounts from one source (password spray pattern) in Entra sign-in logs. Source: MCSB v2 IM-6.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: low
- id: entra-phishing-resistant-mfa
  name: Phishing-Resistant MFA for Privileged and Remote Access
  description: |
    Require phishing-resistant authentication (FIDO2 security keys, Windows Hello for Business, or certificate-based authentication) for administrator roles and all remote access. Authentication strengths in Conditional Access enforce this. Push-based MFA does not stop adversary-in-the-middle phishing. Source: MCSB v2 IM-6.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: entra-pim-just-in-time
  name: Privileged Identity Management with Approval and Access Reviews
  description: |
    Make all Entra and Azure privileged roles eligible-only through Privileged Identity Management, with time-bound activation, justification, and approval. Run access reviews for privileged roles at least quarterly. Source: MCSB v2 PA-2, PA-4, PA-6.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: entra-risk-detection
  name: Identity Protection Risk Policies and AiTM Detection
  description: |
    Enable Identity Protection sign-in and user risk policies. Sentinel analytics: sign-ins with reused session tokens, unfamiliar sign-in properties, impossible travel, and inbox rule creation within minutes of a risky sign-in (correlate SigninLogs with OfficeActivity). Source: MCSB v2 LT-2.
  control_functions: [detective]
  control_nature: technical
  cost: medium
- id: entra-sp-credential-hygiene
  name: Workload Identity Credential Hygiene
  description: |
    Replace client secrets with managed identities or federated workload credentials where supported. For remaining secrets, cap lifetime at 6 to 12 months and store them in Key Vault. Restrict user consent to verified publishers and route app requests through the admin consent workflow. Source: MCSB v2 IM-3, IM-8.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: entra-sp-least-privilege-monitor
  name: Service Principal Privilege and Credential Monitoring
  description: |
    Review high-privilege Microsoft Graph application permissions and app role assignments quarterly. Detection: alert on AuditLogs events 'Add service principal credentials' and 'Update application - Certificates and secrets management', and on new grants of Directory.ReadWrite.All or RoleManagement.ReadWrite.Directory. Source: MCSB v2 IM-3, LT-2.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: entra-token-protection-cae
  name: Token Protection and Continuous Access Evaluation
  description: |
    Enable Continuous Access Evaluation for supported workloads so revoked or risky sessions end quickly. Use token protection (sender-constrained tokens) in Conditional Access for supported clients so stolen cookies or refresh tokens cannot be replayed from another device. Source: MCSB v2 IM-6, IM-7.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: entra-user-consent-restriction
  name: Restricted User Consent and Admin Consent Workflow
  description: |
    Disable end-user consent for applications, or limit it to verified publishers with low-risk permissions, and enable the admin consent request workflow. Review enterprise applications with new consent grants weekly. Source: MCSB v2 IM-5.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: er-ipsec-over-er
  name: IPsec Over ExpressRoute Private Peering
  description: |
    Establish an IPsec VPN tunnel over the private peering, or use MACsec on ExpressRoute Direct ports, so traffic is encrypted end to end.
    Terraform: azurerm_virtual_network_gateway_connection { type = "IPsec" } through the ExpressRoute path; azurerm_express_route_port link macsec_cipher.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: er-md5-bgp
  name: MD5 Authentication for BGP Sessions
  description: |
    Configure an MD5 hash for BGP sessions on private and Microsoft peering.
    Terraform: azurerm_express_route_circuit_peering.shared_key.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: er-rbac-circuits
  name: RBAC for ExpressRoute Resources
  description: |
    Assign rights on circuits and gateways by role and limit management rights to network administrators.
    Terraform: azurerm_role_assignment { role_definition_name = "Network Contributor" } scoped to the circuit resource group; azurerm_management_lock on the circuit.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: esan-disable-public-access
  name: Disable Public Network Access for Elastic SAN
  description: |
    Disable public network access when only private endpoints are used and allow only named subnets in volume group network rules.
    Terraform: azurerm_elastic_san_volume_group.network_rule { subnet_id = ..., action = "Allow" } for approved subnets only.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: esan-private-endpoint-network-policies
  name: Network Policies for Elastic SAN Private Endpoints
  description: |
    Enable network policies on the private endpoint subnet so NSGs and user-defined routes apply to the endpoint.
    Terraform: azurerm_subnet.private_endpoint_network_policies = "Enabled".
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: esan-snapshot-recovery
  name: Snapshots as the Recovery Path for Elastic SAN
  description: |
    Because soft delete is not available, take regular snapshots or use Azure Backup for volumes and test restores. Encryption in transit is not available, so add protection at the application or network layer.
  control_functions: [recovery]
  control_nature: technical
  cost: low
- id: flow-private-connectivity
  name: Private Connectivity for Data Flows
  description: |
    Reach each service over a Private Endpoint and resolve its name through a private DNS zone, and disable the public network path where the service supports it. Verify that clients validate the service certificate. Verification: check that the service's publicNetworkAccess is Disabled, that a private endpoint exists, and that the DNS zone resolves the service name to a private address. Source: Learn: Azure Private Link and private endpoints; MCSB v2 NS-2.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: fw-diagnostic-logs
  name: Forward Azure Firewall Diagnostic Logs
  description: |
    Send all firewall log categories to Log Analytics and monitor them.
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_firewall.<name>.id, log_analytics_destination_type = "Dedicated" } with enabled_log category_group = "allLogs".
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: fw-idps-deny
  name: IDPS in Alert and Deny Mode
  description: |
    Run IDPS (Premium) in alert and deny mode and adjust signature actions after tuning.
    Terraform: azurerm_firewall_policy.intrusion_detection { mode = "Deny" }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: fw-threat-intel-deny
  name: Threat Intelligence in Alert and Deny Mode
  description: |
    Run threat intelligence on the Standard or Premium tier in alert and deny mode.
    Terraform: azurerm_firewall_policy.threat_intelligence_mode = "Deny".
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: fw-tls-inspection
  name: TLS Inspection for Outbound Traffic
  description: |
    Enable TLS inspection with an intermediate CA certificate stored in Key Vault and distribute trust to clients.
    Terraform: azurerm_firewall_policy.tls_certificate { key_vault_secret_id, name }; azurerm_firewall_policy.sku = "Premium".
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: fwm-dns-proxy-clients
  name: Consistent DNS Proxy and Client DNS Configuration
  description: |
    Configure clients to use the firewall as DNS server whenever FQDN rules apply and define several upstream DNS servers.
    Terraform: azurerm_firewall_policy.dns { proxy_enabled = true, servers = [...] }; azurerm_virtual_network.dns_servers = [azurerm_firewall.<name>.ip_configuration[0].private_ip_address].
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: fwm-policy-hierarchy
  name: Policy Hierarchy With Parent Rules and Change Control
  description: |
    Keep global rules in the parent policy and regional exceptions in child policies, and allow changes to the parent policy only after review.
    Terraform: azurerm_firewall_policy.base_policy_id on child policies; azurerm_role_assignment on the base policy limited to a network administration group; azurerm_management_lock on the policy.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: fwm-routing-intent
  name: Routing Intent So Private Traffic Passes the Firewall
  description: |
    Route private traffic through the firewall, list additional private prefixes explicitly and enable routing intent in secured hubs.
    Terraform: azurerm_virtual_hub_routing_intent { routing_policy { name = "PrivateTraffic", destinations = ["PrivateTraffic"], next_hop = azurerm_firewall.<name>.id } }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: hdi-encryption-in-transit
  name: Encrypt HDInsight Cluster Communication
  description: |
    Enable encryption in transit with IPsec between cluster nodes and use TLS at the gateway.
    Terraform: azurerm_hdinsight_hadoop_cluster.tls_min_version = "1.2".
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: hdi-esp-cluster
  name: Enterprise Security Package for HDInsight
  description: |
    Run clusters with Enterprise Security Package so Kerberos authentication and Apache Ranger authorization are enabled by default.
    Terraform: azurerm_hdinsight_hadoop_cluster.security_profile { domain_name, domain_username, ldaps_urls, cluster_users_group_dns }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: hdi-keytab-protection
  name: Protect and Rotate Keytab Files
  description: |
    Store keytab files only on the authorized host with restrictive permissions and renew keys regularly.
  control_functions: [preventive]
  control_nature: administrative
  cost: low
- id: kv-backup
  name: Native Key Vault Backup of Keys and Secrets
  description: |
    Back up keys, secrets and certificates with the native backup feature to a location that is protected by its own access controls. Verification: backup run recorded and restore tested for each vault. Source: MCSB v2 BR-1; learn.microsoft.com/azure/key-vault/general/backup.
  control_functions: [recovery]
  control_nature: technical
  cost: low
- id: kv-cmk-for-regulated-data
  name: Customer-Managed Keys for Regulated Data Stores
  description: |
    For regulated workloads, store the encryption key in Key Vault or Managed HSM and use it as the customer-managed key of the dependent service. Verification: each dependent resource (storage account, disk, SQL) reports a customer-managed key whose key id points to this vault. Source: MCSB v2 DP-5; learn.microsoft.com/azure/security/fundamentals/encryption-models.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: kv-conditional-access
  name: Conditional Access for Vault Data Plane Sign-In
  description: |
    Apply Microsoft Entra conditional access policies that require compliant devices, trusted locations and risk-based controls for sign-ins that reach the vault. Verification: conditional access policy targets the Key Vault resource or the users with vault roles. Source: MCSB v2 IM-7; learn.microsoft.com/azure/key-vault/general/security-features#conditional-access.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: kv-defender-plan
  name: Microsoft Defender for Key Vault Enabled
  description: |
    Enable Microsoft Defender for Key Vault on the subscription and act on its alerts. Verification: Azure Defender for Key Vault should be enabled. Source: MCSB v2 LT-1; learn.microsoft.com/azure/defender-for-cloud/defender-for-key-vault-introduction.
  control_functions: [detective]
  control_nature: technical
  cost: medium
- id: kv-firewall-disable-public-access
  name: Key Vault Firewall Enabled and Public Network Access Disabled
  description: |
    Enable the Key Vault firewall and disable public network access. Allow only trusted networks or private endpoints. Verification: Azure Key Vault should have firewall enabled (55615ac9-af46-4a59-874e-391cc3dfb490). Source: MCSB v2 NS-2; learn.microsoft.com/azure/key-vault/general/how-to-azure-key-vault-network-security.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: kv-key-autorotation
  name: Key Autorotation Configured
  description: |
    Configure autorotation for keys and certificates on a defined schedule, with the rotation timer set to a period shorter than the key lifetime. Verification: autorotation policy present on each key with a rotation interval. Source: MCSB v2 DP-6; learn.microsoft.com/azure/key-vault/general/autorotation.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: kv-key-expiration-policy
  name: Key Expiration Date Enforced
  description: |
    Require an expiration date on all keys through Azure Policy so that no key is valid indefinitely. Verification: Key Vault keys should have an expiration date (152b15f7-8e1f-4c1f-ab71-8c010ba5dbc0). Source: MCSB v2 DP-6; learn.microsoft.com/azure/key-vault/keys/about-keys-details.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: kv-least-privilege-rbac
  name: Azure RBAC With Object-Scoped Least-Privilege Roles
  description: |
    Use the Azure RBAC permission model and assign data plane roles at the narrowest scope possible. Use JIT eligible assignments via PIM for administrative roles. Verification: Azure Key Vault should use RBAC permission model. Source: MCSB v2 PA-7; learn.microsoft.com/azure/key-vault/general/rbac-guide.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: kv-managed-identity
  name: Managed Identity for Applications Accessing Key Vault
  description: |
    Use a managed identity for each application instead of a service principal secret, so that no credential is stored or rotated by hand. Verification: no service principal client secrets used for vault access in sign-in logs. Source: MCSB v2 IM-3; learn.microsoft.com/azure/key-vault/general/authentication.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: kv-private-endpoint
  name: Private Endpoint for Key Vault
  description: |
    Create a private endpoint so that clients reach the vault only through a private IP in the virtual network. Verification: Azure Key Vaults should use private link. Source: MCSB v2 NS-2; learn.microsoft.com/azure/key-vault/general/private-link-service.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: kv-references-not-copies
  name: Key Vault References Instead of Copied Secrets
  description: |
    Reference secrets from app settings or pipelines with Key Vault references and pipeline secret variables. Do not copy the secret value into code, templates or configuration. Verification: secret scanning in repositories finds no vault secret values. Source: MCSB v2 IM-8; learn.microsoft.com/azure/key-vault/secrets/about-secrets.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: kv-resource-logs-to-sentinel
  name: Vault Resource Logs Sent to Workspace and Sentinel
  description: |
    Enable resource logs for AuditEvent and send them to a Log Analytics workspace that is connected to Microsoft Sentinel. Detection example: alert on SecretGet or KeyDecrypt by a principal not on the allowlist. Verification: Resource logs in Key Vault should be enabled. Source: MCSB v2 LT-4; learn.microsoft.com/azure/key-vault/general/logging.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: kv-soft-delete-purge-protection
  name: Soft Delete and Purge Protection Enabled
  description: |
    Enable soft delete and purge protection on the vault. Purge protection cannot be disabled once enabled and blocks permanent deletion during the retention period. Verification: properties.enableSoftDelete and properties.enablePurgeProtection are true on every vault (az keyvault show). Source: MCSB v2 BR-1; learn.microsoft.com/azure/key-vault/general/soft-delete-overview.
  control_functions: [recovery, preventive]
  control_nature: technical
  cost: low
- id: la-aad-trigger-auth
  name: Microsoft Entra Authorization for Request Triggers
  description: |
    Protect request triggers with Microsoft Entra OAuth, restrict caller IP ranges or place API Management with authentication in front.
    Terraform: azurerm_logic_app_workflow.access_control.trigger.open_authentication_policy { claim { name = "iss" value = "..." } }; allowed_caller_ip_address_range.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: la-access-control-mode
  name: Resource or Workspace Permissions Access Mode
  description: |
    Use resource-context or workspace-context access control and apply table-level RBAC and protected tables for sensitive data.
    Terraform: azurerm_log_analytics_workspace.allow_resource_only_permissions = true; azurerm_role_assignment with table-scoped custom roles.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: la-immutable-export
  name: Export Logs to Immutable Storage
  description: |
    Export logs through data export to a storage account that has an immutability policy.
    Terraform: azurerm_log_analytics_data_export_rule with destination_resource_id of a storage account that has azurerm_storage_container immutability policy.
  control_functions: [recovery]
  control_nature: technical
  cost: low
- id: la-keyvault-app-settings
  name: Secrets From Key Vault via App Settings
  description: |
    Store credentials in Key Vault and reference them through app settings or workflow parameters instead of embedding them in the workflow.
    Terraform: azurerm_logic_app_standard.app_settings { MY_SECRET = "@Microsoft.KeyVault(SecretUri=...)" } with key_vault_reference_identity_id.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: la-managed-identity
  name: Managed Identity for Logic Apps
  description: |
    Enable a system-assigned or user-assigned managed identity and grant only the rights each workflow needs.
    Terraform: azurerm_logic_app_workflow.identity { type = "SystemAssigned" }; azurerm_role_assignment scoped to the target resource.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: la-private-link
  name: Private Link for the Log Analytics Workspace
  description: |
    Configure Private Link for the workspace and block public access.
    Terraform: azurerm_monitor_private_link_scope; azurerm_log_analytics_workspace { internet_ingestion_access_type = "Disabled", internet_query_access_type = "Disabled" }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: lb-protect-backend
  name: Operate Backends Behind a Firewall or WAF
  description: |
    Run backend resources in a virtual network without direct internet exposure. Use Application Gateway or Front Door for HTTP and an internal load balancer with Azure Firewall for other protocols.
    Terraform: azurerm_lb with private frontend_ip_configuration.subnet_id; azurerm_firewall in the path.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: lb-standard-sku
  name: Standard Load Balancer Instead of Basic
  description: |
    Use Standard Load Balancer and Standard public IP addresses for production workloads, because Basic was retired on 30 September 2025.
    Terraform: azurerm_lb.sku = "Standard"; azurerm_public_ip.sku = "Standard".
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: lb-tls-backend
  name: End-to-End TLS for Load Balancer Backends
  description: |
    Configure TLS on the backend itself or move TLS termination to Application Gateway or Front Door.
    Terraform: azurerm_application_gateway with ssl_certificate and backend_http_settings protocol = "Https".
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: managed-identity-review
  name: Managed Identity Role Assignment Monitoring
  description: |
    Detection: Activity Log alert on Microsoft.Authorization/roleAssignments/write at subscription or management-group scope for Owner, Contributor, or User Access Administrator. Review managed identity role assignments in an access review every quarter. Source: MCSB v2 PA-4, LT-1.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: mg-disable-api-keys
  name: Disable API Keys and Service Accounts in Managed Grafana
  description: |
    Enable API keys and service accounts only where there is a proven need, with an expiry date and a minimal role.
    Terraform: azurerm_dashboard_grafana.api_key_enabled = false.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: mg-managed-identity-datasource
  name: Managed Identity and Current-User Authentication for Data Sources
  description: |
    Connect data sources through managed identity or current-user authentication and keep remaining secrets in Key Vault.
    Terraform: azurerm_dashboard_grafana.identity { type = "SystemAssigned" }; azurerm_role_assignment { role_definition_name = "Monitoring Reader" } at the narrowest scope.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: mg-private-endpoint
  name: Private Endpoint and Disabled Public Access for Managed Grafana
  description: |
    Create a private endpoint and block public access.
    Terraform: azurerm_private_endpoint { subresource_names = ["grafana"] }; azurerm_dashboard_grafana.public_network_access_enabled = false.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: mhsm-key-autorotation
  name: Automatic Key Rotation in Managed HSM
  description: |
    Configure automatic rotation with an interval of at least 28 days and set expiration dates on keys.
    Terraform: azurerm_key_vault_managed_hardware_security_module_key.expiration_date.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: mhsm-purge-protection
  name: Enable Purge Protection for Managed HSM
  description: |
    Enable purge protection at creation because it cannot be disabled afterwards, and set a soft delete retention suited to recovery needs.
    Terraform: azurerm_key_vault_managed_hardware_security_module { purge_protection_enabled = true, soft_delete_retention_days = 90 }.
  control_functions: [recovery]
  control_nature: technical
  cost: low
- id: mhsm-security-domain-quorum
  name: Security Domain With a Quorum of at Least Three Key Holders
  description: |
    Protect the security domain with at least three RSA key pairs and a quorum of two or more, and store the keys offline and separately.
    Terraform: azurerm_key_vault_managed_hardware_security_module { security_domain_key_vault_certificate_ids = [three certificates], security_domain_quorum = 2 }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: mon-managed-identity-auth
  name: Managed Identity for Container Insights
  description: |
    Switch clusters to managed identity authentication for monitoring and turn off certificate-based local authentication.
    Terraform: azurerm_kubernetes_cluster.oms_agent.msi_auth_for_monitoring_enabled = true.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: mon-private-link-agents
  name: Monitoring Agents Over Private Link
  description: |
    Connect VMs to Azure Monitor through private endpoints and Azure Private Link.
    Terraform: azurerm_monitor_private_link_scope with azurerm_monitor_private_link_scoped_service; azurerm_private_endpoint { subresource_names = ["azuremonitor"] }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: mon-security-monitoring-defender
  name: Security Monitoring With Defender for Cloud and Sentinel
  description: |
    Evaluate security events with Defender for Cloud and Microsoft Sentinel instead of relying on Azure Monitor collection alone.
    Terraform: azurerm_sentinel_log_analytics_workspace_onboarding; azurerm_sentinel_alert_rule_scheduled.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: nat-anomaly-alerts
  name: Alerts for Unusual Outbound Traffic
  description: |
    Review connection counts and flow logs for unusual destinations and use the Network Insights dashboard.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: nat-flow-logs
  name: Enable NAT Gateway Flow Logs
  description: |
    Enable the NatGatewayFlowlogsV1 resource log category through diagnostic settings and send it to Log Analytics.
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_nat_gateway.<name>.id, enabled_log { category = "NatGatewayFlowlogsV1" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: nat-snat-alerts
  name: Alerts for SNAT Exhaustion and Datapath Availability
  description: |
    Alert on failed SNAT connections above zero and on datapath availability below 90 percent.
    Terraform: azurerm_monitor_metric_alert on the NAT gateway SNAT connection count and datapath availability metrics.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: nw-least-privilege-rbac
  name: Least-Privilege Roles for Network Watcher
  description: |
    Give packet capture rights only to security and operations teams and create custom roles for special tasks.
    Terraform: azurerm_role_definition with Microsoft.Network/networkWatchers/packetCaptures/* limited to named actions.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: nw-migrate-vnet-flow-logs
  name: Migrate to Virtual Network Flow Logs
  description: |
    Replace NSG flow logs with virtual network flow logs before the NSG flow log retirement on 30 September 2027 and disable the old logs after verifying the new data.
    Terraform: azurerm_network_watcher_flow_log { target_resource_id = azurerm_virtual_network.<name>.id, version = 2 }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: nw-storage-private-endpoints
  name: Private Endpoints for Flow Log Storage Accounts
  description: |
    Create private endpoints for storage accounts that hold flow logs and packet captures and restrict their firewall.
    Terraform: azurerm_private_endpoint { subresource_names = ["blob"] }; azurerm_storage_account.public_network_access = "Disabled".
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: policy-a-custom-ipsec-ike-policy-must-be-applied-to-all-azure-virtual-network-gateway-connections
  name: A custom IPsec/IKE policy must be applied to all Azure virtual network gateway connections
  description: 'Assign the built-in Azure Policy definition "A custom IPsec/IKE policy must be applied
    to all Azure virtual network gateway connections" (effects: Audit, Disabled) at management group or
    subscription scope so that non-compliant resources are reported. Source: MCSB v2 DP-3.'
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: policy-a-microsoft-entra-administrator-should-be-provisioned-for-mysql-servers
  name: A Microsoft Entra administrator should be provisioned for MySQL servers
  description: 'Assign the built-in Azure Policy definition "A Microsoft Entra administrator should be
    provisioned for MySQL servers" (effects: AuditIfNotExists, Disabled) at management group or subscription
    scope so that non-compliant resources are reported. Source: MCSB v2 DP-4.'
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: policy-a-microsoft-entra-administrator-should-be-provisioned-for-postgresql-servers
  name: A Microsoft Entra administrator should be provisioned for PostgreSQL servers
  description: 'Assign the built-in Azure Policy definition "A Microsoft Entra administrator should be
    provisioned for PostgreSQL servers" (effects: AuditIfNotExists, Disabled) at management group or subscription
    scope so that non-compliant resources are reported. Source: MCSB v2 IM-1.'
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: policy-all-flow-log-resources-should-be-in-enabled-state
  name: All flow log resources should be in enabled state
  description: 'Assign the built-in Azure Policy definition "All flow log resources should be in enabled
    state" (effects: Audit, Disabled) at management group or subscription scope so that non-compliant
    resources are reported. Source: MCSB v2 LT-4.'
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: policy-api-management-apis-should-use-only-encrypted-protocols
  name: API Management APIs should use only encrypted protocols
  description: 'Assign the built-in Azure Policy definition "API Management APIs should use only encrypted
    protocols" (effects: Audit, Disabled, Deny) at management group or subscription scope so that non-compliant
    resources are reported or blocked. Source: MCSB v2 DP-3.'
  control_functions: [preventive, detective]
