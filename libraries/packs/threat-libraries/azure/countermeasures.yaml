- id: queue-entra-rbac
  name: Entra ID Authorization for Queue Access
  description: |
    Assign managed identities the Storage Queue Data Message Sender, Processor or Reader roles per queue and disable shared key authorization.
    Terraform: azurerm_role_assignment { role_definition_name = "Storage Queue Data Message Processor", scope = azurerm_storage_queue.<name>.id }; azurerm_storage_account.shared_access_key_enabled = false.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: queue-network-restriction
  name: Restrict Network Access to Queue Accounts
  description: |
    Set firewall rules, use private endpoints and service tags.
    Terraform: azurerm_private_endpoint { subresource_names = ["queue"] }; azurerm_storage_account_network_rules.default_action = "Deny".
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: queue-sas-least-privilege
  name: Limit SAS to One Queue and Minimal Operations
  description: |
    Issue SAS tokens only with the required operations (add, update, process, read), over HTTPS and with a lifetime of at most one hour or with a stored access policy.
    Terraform: azurerm_storage_account.shared_access_key_enabled = false so only user-delegation SAS remains possible.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: sa-customer-managed-key
  name: Customer-Managed Key for Storage Encryption at Rest
  description: |
    Use a key in Azure Key Vault or Managed HSM as the account encryption key, with rotation and access audit owned by the organization. Verification: Storage accounts should use customer-managed key for encryption. Source: MCSB v2 DP-5; Secure your Azure Storage account, „Data protection“ / „Configure customer-managed keys (CMK) for encryption at rest“.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: sa-defender-for-storage
  name: Microsoft Defender for Storage Enabled
  description: |
    Enable Defender for Storage with malware scanning on blob uploads where untrusted content is accepted and sensitive data discovery. Verification: Azure Defender for Storage should be enabled. Source: MCSB v2 LT-1, LT-4; Secure your Azure Storage account, „Logging and monitoring“ / „Enable Microsoft Defender for Storage“.
  control_functions: [detective]
  control_nature: technical
  cost: medium
- id: sa-diagnostic-settings
  name: Storage Diagnostic Settings to Log Analytics
  description: |
    Configure diagnostic settings on the account and each data service to send StorageRead, StorageWrite and StorageDelete logs and metrics to Log Analytics. Detection example: alert on Shared Key or anonymous requests on accounts where those are disallowed. Verification: diagnostic setting with StorageRead, StorageWrite and StorageDelete present on the account and each data service (az monitor diagnostic-settings list). Source: MCSB v2 LT-1, LT-4; Secure your Azure Storage account, „Logging and monitoring“ / „Send diagnostic settings to a Log Analytics workspace“.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: sa-disable-public-access
  name: Storage Account Public Network Access Disabled
  description: |
    Set public network access to Disabled and use private endpoints, or restrict the firewall default action to Deny with explicit IP and subnet rules. Verification: Storage accounts should disable public network access. Source: MCSB v2 NS-2; Secure your Azure Storage account, „Network security“ / „Disable public network access to the storage account“.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: sa-disallow-shared-key
  name: Shared Key Authorization Disallowed
  description: |
    Set allowSharedKeyAccess to false so that only Microsoft Entra ID and user-delegation SAS requests are accepted. Verification: Storage accounts should prevent shared key access. Source: MCSB v2 IM-7, PA-7; Secure your Azure Storage account, „Identity and access management“ / „Disallow Shared Key authorization“.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: sa-immutability-and-soft-delete
  name: Immutability and Soft Delete for Data Services
  description: |
    Use the data-service recovery features (blob soft delete, versioning, immutability policies, file share soft delete) because geo-redundancy replicates deletions and corruption. Verification: soft delete and versioning enabled on blob and file services; immutability policy on regulated containers. Source: MCSB v2 BR-2; Secure your Azure Storage account, „Backup and recovery“ / „Don't rely on geo-redundancy for ransomware protection“.
  control_functions: [recovery]
  control_nature: technical
  cost: medium
- id: sa-least-privilege-rbac
  name: Storage Data Roles at the Smallest Scope
  description: |
    Assign built-in data-plane roles at container, share, queue or table scope and add ABAC conditions where path or tag restrictions are needed. Verification: no data-plane role assignment at account or subscription scope except for documented administrators. Source: MCSB v2 IM-7, PA-7; Secure your Azure Storage account, „Identity and access management“ / „Assign RBAC roles at the smallest reasonable scope“.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: sa-resource-lock
  name: Resource Lock on the Storage Account
  description: |
    Apply a CanNotDelete or ReadOnly lock to the account. The lock protects the account resource, not the data inside it. Verification: resource lock present on each production storage account (az lock list). Source: MCSB v2 DP-5; Secure your Azure Storage account, „Data protection“ / „Protect the storage account with a resource lock“.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: sa-restrict-copy-scope
  name: Copy and Object Replication Limited to Allowed Tenants
  description: |
    Restrict copy and object replication to source accounts in the same tenant or on an allow list, and prevent object replication across tenants. Verification: permitted copy scope set to same tenant or allow list on every account. Source: MCSB v2 NS-2; Secure your Azure Storage account, „Network security“ / „Restrict cross-tenant object replication and copy operations“.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: sa-sas-expiration-policy
  name: SAS Expiration Policy on the Account
  description: |
    Configure an SAS expiration policy on the account so that violations are logged and long-lived SAS tokens are found and fixed. Verification: sasExpirationPolicy set on the account; violations present in storage logs. Source: MCSB v2 IM-7, PA-7; Secure your Azure Storage account, „Identity and access management“ / „Configure a SAS expiration policy on the account“.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: sa-secure-transfer-tls12
  name: Secure Transfer Required and Minimum TLS 1.2
  description: |
    Enable secure transfer required and set the minimum TLS version to 1.2 so that the account rejects HTTP and older TLS versions. Verification: Secure transfer to storage accounts should be enabled. Source: MCSB v2 NS-2; Secure your Azure Storage account, „Network security“ / „Require secure transfer (HTTPS)“.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: sa-user-delegation-sas
  name: User-Delegation SAS Instead of Account-Key SAS
  description: |
    Issue SAS tokens signed with a Microsoft Entra user delegation key, scoped to minimum permissions and an expiry of one hour or less for service SAS without a stored access policy. Verification: no SAS in logs with signature type account-key; SAS lifetime within the defined maximum. Source: MCSB v2 IM-7, PA-7; Secure your Azure Storage account, „Identity and access management“ / „Use user-delegation SAS instead of service or account SAS when SAS is required“.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: sentinel-connector-coverage
  name: Enable Data Connectors for Security-Relevant Sources
  description: |
    Enable connectors for identity, endpoint, network and cloud platform sources. Filter only where necessary because filtering limits UEBA and Fusion.
    Terraform: azurerm_sentinel_data_connector_azure_active_directory; azurerm_sentinel_data_connector_azure_security_center; azurerm_sentinel_data_connector_office_365.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: sentinel-rule-change-control
  name: Version and Monitor Changes to Analytics Rules
  description: |
    Deploy analytics rules from code, export them as ARM templates, version them and track changes and disablement through audit logs.
    Terraform: azurerm_sentinel_alert_rule_scheduled managed in a pipeline; azurerm_monitor_activity_log_alert for rule writes.
  control_functions: [detective, preventive]
  control_nature: technical
  cost: low
- id: sentinel-watchlist-hygiene
  name: Delete Watchlists After the Investigation
  description: |
    Create watchlists with sensitive data only for the duration of the investigation and delete them afterwards.
    Terraform: azurerm_sentinel_watchlist.default_duration set to a short period.
  control_functions: [preventive]
  control_nature: administrative
  cost: low
- id: sf-cert-expiry-monitoring
  name: Monitor Client Certificate Expiry
  description: |
    Monitor certificate expiry dates, do not share client certificates and renew them regularly.
    Terraform: azurerm_key_vault_certificate with azurerm_monitor_activity_log_alert or Key Vault expiry events.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: sf-network-isolation
  name: Network Isolation for Service Fabric Clusters
  description: |
    Use NSGs and jump servers for management access and create perimeter networks.
    Terraform: azurerm_network_security_group with deny rules for TCP 19000 and 19080 from Internet; azurerm_bastion_host.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: sf-secure-cluster-x509-entra
  name: Secure Service Fabric Clusters With Certificates and Entra ID
  description: |
    Configure security at creation with X.509 certificates and authenticate client access with Microsoft Entra ID.
    Terraform: azurerm_service_fabric_cluster { certificate { thumbprint = ... }, azure_active_directory { tenant_id, cluster_application_id, client_application_id } }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: sm-least-privilege-target
  name: Limit Agent Roles on Targets to the Minimum
  description: |
    Give agents only the roles on the specific container or share that the job needs, and use Owner rights only for the assignment at job start.
    Terraform: azurerm_role_assignment scoped to azurerm_storage_container.<name>.resource_manager_id.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: sm-private-control-plane
  name: Private Network Path for Storage Mover
  description: |
    Route publicly reachable dependencies over ExpressRoute Microsoft peering and use Private Link for data paths.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: sm-remove-agent-access
  name: Remove Agent Access After Completion
  description: |
    After each job remove the agent's role assignments on targets, or unregister the agent and delete its Azure Arc resource.
  control_functions: [preventive]
  control_nature: administrative
  cost: low
- id: subnet-flow-logs
  name: Virtual Network Flow Logs Covering Every Subnet
  description: |
    Enable virtual network flow logs for each virtual network (NSG flow logs retire on 30 September 2027) and analyze them in Log Analytics with traffic analytics.
    Terraform: azurerm_network_watcher_flow_log { target_resource_id = azurerm_virtual_network.<name>.id, version = 2, traffic_analytics { enabled = true } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: subnet-nsg-deny-default
  name: NSG on Every Subnet With Deny by Default
  description: |
    Associate an NSG with every subnet, allow only the rules required by the subnet's role and deny everything else.
    Terraform: azurerm_subnet_network_security_group_association; azurerm_network_security_rule { access = "Deny", priority = 4096 } as the final rule.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: subnet-restrict-allow-rules
  name: Narrow Allow Rules and Use Application Security Groups
  description: |
    Avoid allow rules with wide ranges, and use service tags and application security groups to express intent.
    Terraform: azurerm_network_security_rule with source_application_security_group_ids and destination_application_security_group_ids instead of address prefixes.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: tm-alias-records
  name: Alias Records for Traffic Manager Endpoints
  description: |
    Use Azure DNS alias records whose lifecycle is tied to the Azure resource so records cannot dangle.
    Terraform: azurerm_dns_a_record.target_resource_id = azurerm_traffic_manager_profile.<name>.id.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: tm-https-monitoring
  name: HTTPS for Endpoint Monitoring
  description: |
    Use HTTPS as the protocol for health probes of web endpoints.
    Terraform: azurerm_traffic_manager_profile.monitor_config { protocol = "HTTPS", port = 443 }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: tm-rbac-profiles
  name: Restrict RBAC on Traffic Manager Profiles
  description: |
    Give write rights on profiles and endpoints only to authorized identities.
    Terraform: azurerm_role_assignment { role_definition_name = "Traffic Manager Contributor" } scoped to the profile resource group.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: vm-backup-immutable
  name: Immutable Azure Backup for VMs
  description: |
    Protect VMs with Azure Backup in a vault with immutability and soft delete, multi-user authorization for backup deletion, and cross-region restore. Test restores on a schedule. Source: MCSB v2 BR-1, BR-2.
  control_functions: [recovery]
  control_nature: technical
  cost: medium
- id: vm-brute-force-detection
  name: Failed Logon Detection for VM Management Ports
  description: |
    Collect Windows Security events (4625, 4624) and Linux auth logs into Sentinel or Log Analytics. Detection: more than 20 failed logons from one source IP within 10 minutes, or a successful logon from an IP that had recent failures. Enforce account lockout policy. Source: MCSB v2 LT-1, NS-8.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: vm-disk-export-control
  name: Disk Encryption and Snapshot Export Control
  description: |
    Enable encryption at host or Azure Disk Encryption with customer-managed keys. Set publicNetworkAccess to Disabled on disks and snapshots, use Disk Access with private endpoints, and restrict or alert on snapshot SAS export operations (Microsoft.Compute/snapshots/beginGetAccess). Source: MCSB v2 DP-4, DP-5.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: vm-edr-antimalware
  name: Microsoft Defender for Servers with EDR and Antimalware
  description: |
    Deploy Microsoft Defender for Servers (Plan 2) with Defender for Endpoint EDR and Defender Antivirus on all VMs. Enable tamper protection and attack surface reduction rules. Detection: alert when a sensor reports as offline or tamper protection is disabled. Source: MCSB v2 ES-1, ES-2.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: medium
- id: vm-extension-allowlist
  name: VM Extension Allowlist and Extension Monitoring
  description: |
    Restrict VM extensions with an Azure Policy allowlist, and deny Custom Script Extension for untrusted sources. Detection: Activity Log events Microsoft.Compute/virtualMachines/extensions/write from identities outside the deployment pipeline. Source: MCSB v2 PV-4, AM-5.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: low
- id: vm-patch-management
  name: Patch Management and Vulnerability Assessment
  description: |
    Use Azure Update Manager or an equivalent patch service with a defined SLA per severity (for example, critical within 14 days). Enable Defender vulnerability assessment and Trusted Launch (Secure Boot, vTPM) on supported images. Use hardened gallery images with CIS benchmarks. Source: MCSB v2 PV-5, PV-6.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: vm-restrict-management-ports
  name: No Public RDP or SSH; Bastion and Just-in-Time Access
  description: |
    Remove public IPs or NSG rules that expose TCP 3389 and 22 to the internet. Use Azure Bastion or Microsoft Defender for Servers just-in-time access for administration, and require Entra ID login for Windows and Linux VMs where supported. Source: MCSB v2 NS-8, NS-1.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: vm-secure-baseline
  name: Guest Configuration Secure Baseline
  description: |
    Assign Azure Policy guest configuration (machine configuration) baselines for Windows and Linux VMs, based on CIS benchmarks. Detection: non-compliant guest configuration assignments are reported in Defender for Cloud and alerted. Source: MCSB v2 PV-3, PV-4.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: medium
- id: vmss-application-health
  name: Application Health for Scale Sets
  description: |
    Configure the Application Health extension or a health probe so unhealthy instances are detected and replaced.
    Terraform: azurerm_linux_virtual_machine_scale_set.health_probe_id; automatic_instance_repair { enabled = true }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: vmss-automatic-os-upgrade
  name: Automatic OS Image Upgrades for Scale Sets
  description: |
    Enable automatic OS image upgrades or rolling upgrades together with application health monitoring.
    Terraform: azurerm_linux_virtual_machine_scale_set { upgrade_mode = "Rolling", automatic_os_upgrade_policy { automatic_os_upgrade_enabled = true }, rolling_upgrade_policy { ... }, health_probe_id }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: vmss-instance-protection
  name: Instance Protection for Special Scale Set Instances
  description: |
    Set protectFromScaleIn and protectFromScaleSetActions on instances that must not be changed.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: vnet-ddos-protection
  name: DDoS Network Protection on VNets With Public IPs
  description: |
    Associate the DDoS protection plan with every VNet that carries public IP addresses.
    Terraform: azurerm_virtual_network.ddos_protection_plan { id = azurerm_network_ddos_protection_plan.<name>.id, enable = true }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: vnet-private-endpoints
  name: Connect PaaS Through Private Endpoints Instead of Public IPs
  description: |
    Connect PaaS services to the VNet through private endpoints and disable the public access.
    Terraform: azurerm_private_endpoint with a matching private_dns_zone_group block.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: vnet-service-endpoint-scope
  name: Enable Service Endpoints Selectively
  description: |
    Do not enable service endpoints on all subnets. Use them only where private endpoints are not possible, together with service endpoint policies.
    Terraform: service endpoints on azurerm_subnet restricted by azurerm_subnet_service_endpoint_storage_policy.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: vwan-custom-route-tables
  name: Custom Route Tables for Segmentation
  description: |
    Create route tables per security zone, set associations and propagations and associate with None where full isolation is needed.
    Terraform: azurerm_virtual_hub_route_table; azurerm_virtual_hub_connection.routing.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: vwan-p2s-entra-auth
  name: Point-to-Site With Entra ID Authentication and Conditional Access
  description: |
    Authenticate P2S VPN users with Microsoft Entra ID and enforce Conditional Access, MFA and device compliance.
    Terraform: azurerm_vpn_server_configuration.azure_active_directory_authentication { tenant, audience, issuer }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: vwan-restrict-udr-permissions
  name: Limit UDR Assignment Rights to Network Administrators
  description: |
    Allow assigning route tables (routeTables/join) only to central network administrators, not to landing zone owners.
    Terraform: azurerm_role_definition without Microsoft.Network/routeTables/join for application teams.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: waf-diagnostic-logs
  name: WAF Diagnostic Logs to Sentinel or SIEM
  description: |
    Send WAF logs and metrics to Log Analytics and connect the workspace to Microsoft Sentinel.
    Terraform: azurerm_monitor_diagnostic_setting for the Application Gateway or Front Door profile.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: waf-prevention-mode
  name: Run the WAF in Prevention Mode
  description: |
    Switch to Prevention mode after tuning in Detection mode.
    Terraform: azurerm_web_application_firewall_policy.policy_settings.mode = "Prevention"; azurerm_cdn_frontdoor_firewall_policy.mode = "Prevention".
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: waf-rate-limit-bot
  name: Rate Limiting and Bot Protection for the WAF
  description: |
    Enable rate limit rules per client IP and the Bot Manager rule set.
    Terraform: azurerm_web_application_firewall_policy.custom_rules { rule_type = "RateLimitRule" }; managed_rule_set { type = "Microsoft_BotManagerRuleSet" }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-ai-search-security-trimming
  name: Document-Level Security Trimming in AI Search
  description: |
    Add a group or user identifier field to every indexed document and filter every query by the caller's entitlements, or use native document-level access control, so retrieval honours the source system's permissions. Query with the end user's identity where possible instead of a single application identity.
    Terraform: azurerm_role_assignment with role_definition_name = "Search Index Data Reader" for the calling identity; keep index schemas in code so filter fields cannot be dropped.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: cm-ai-services-quota-limits
  name: AI Services Quota Limits and Spend Alerts
  description: |
    Cap tokens per minute on each deployment, deploy one account per workload and alert on abnormal consumption so a leaked key cannot produce unbounded cost.
    Terraform: azurerm_cognitive_deployment.sku { capacity = <low value> }; azurerm_consumption_budget_resource_group with notification rules.
  control_functions: [preventive, detective]
  control_nature: technical
  cost: low
- id: cm-apim-validate-jwt
  name: Validate Tokens at the API Gateway
  description: |
    Require subscription keys and validate Entra ID access tokens in an inbound policy (validate-jwt or validate-azure-ad-token) for every API, restrict operations by claims and reject calls that bypass the gateway at the backend.
    Terraform: azurerm_api_management_api.subscription_required = true; azurerm_api_management_api_policy.xml_content containing <validate-jwt> with required claims.
  control_functions: [preventive]
  control_nature: technical
  cost: medium
- id: cm-app-configuration-purge-protection
  name: App Configuration Purge Protection and Retention
  description: |
    Enable purge protection and a soft delete retention of at least seven days on production stores so deleted stores and keys can be recovered.
    Terraform: azurerm_app_configuration { sku = "standard", purge_protection_enabled = true, soft_delete_retention_days = 7 }.
  control_functions: [preventive, recovery]
  control_nature: technical
  cost: low
- id: cm-key-vault-secret-references
  name: Key Vault Secret References With Managed Identity
  description: |
    Reference secrets from Key Vault through the platform's secret reference feature and a managed identity instead of storing values inline in app definitions, so values are not visible in configuration or exports.
    Terraform: azurerm_container_app.secret { name = "...", key_vault_secret_id = azurerm_key_vault_secret.<name>.versionless_id, identity = "System" }.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: cm-trusted-registry-only
  name: Pull Images Only From a Trusted Private Registry
  description: |
    Allow workloads to pull only from an organization-owned registry, reference images by digest, scan them and block public registries by policy.
    Terraform: azurerm_container_registry with azurerm_role_assignment "AcrPull" for the workload identity; azurerm_policy_assignment denying images from other registries.
  control_functions: [preventive]
  control_nature: technical
  cost: low
- id: det-rbac-assignment-alert
  name: Alert on Role Assignment Changes at High-Privilege Scope
  description: |
    Alert when Azure RBAC role assignments are created or deleted at subscription, resource group or sensitive resource scope outside the approved pipeline identity. Review the caller, the role and the principal, and escalate Owner, User Access Administrator and data-plane roles.
    Query: AzureActivity | where OperationNameValue =~ "MICROSOFT.AUTHORIZATION/ROLEASSIGNMENTS/WRITE" and ActivityStatusValue == "Success" and Caller !in (approved_pipeline_identities).
    Terraform: azurerm_monitor_activity_log_alert { scopes = [data.azurerm_subscription.current.id], criteria { category = "Administrative", operation_name = "Microsoft.Authorization/roleAssignments/write" }, action { action_group_id = azurerm_monitor_action_group.<name>.id } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-network-change-alert
  name: Alert on Network Security and Routing Changes
  description: |
    Alert on writes and deletes of NSG rules, route table routes, virtual network peerings, private DNS zone links, firewall policies and Virtual WAN route tables. These changes open paths or bypass inspection and rarely happen outside planned deployments.
    Create one rule per operation, for example Microsoft.Network/networkSecurityGroups/securityRules/write, Microsoft.Network/routeTables/routes/write, Microsoft.Network/virtualNetworks/virtualNetworkPeerings/write, Microsoft.Network/privateDnsZones/virtualNetworkLinks/write and Microsoft.Network/firewallPolicies/write. Compare the caller with the deployment identity.
    Terraform: azurerm_monitor_activity_log_alert { criteria { category = "Administrative", operation_name = "Microsoft.Network/networkSecurityGroups/securityRules/write" } } per operation, targeting azurerm_monitor_action_group.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-critical-delete-alert
  name: Alert on Deletion of Critical Resources and Data Containers
  description: |
    Alert on delete operations for resources whose loss stops a workload or destroys recoverability: Cosmos DB accounts and containers, App Configuration stores, file shares, private DNS zones, scale sets, backup items and vaults. Route to the on-call channel and check whether the caller is the deployment identity.
    Query: AzureActivity | where OperationNameValue endswith "/DELETE" and ActivityStatusValue == "Success" and ResourceProviderValue in~ ("MICROSOFT.DOCUMENTDB", "MICROSOFT.APPCONFIGURATION", "MICROSOFT.STORAGE", "MICROSOFT.NETWORK", "MICROSOFT.COMPUTE").
    Terraform: azurerm_monitor_activity_log_alert { criteria { category = "Administrative", operation_name = "Microsoft.DocumentDB/databaseAccounts/delete" } } per operation.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-policy-compliance-alerts
  name: Continuous Compliance Monitoring With Azure Policy and Defender Recommendations
  description: |
    Assign audit-effect built-in or custom Azure Policy definitions for the configuration that closes the threat (minimum TLS version, public network access, customer-managed keys, private endpoints, disabled local authentication, DDoS coverage) and export non-compliant assessments to the SIEM or an action group, so a resource that drifts out of the secure state raises an alert instead of waiting for the next review.
    Terraform: azurerm_subscription_policy_assignment { policy_definition_id = "<definition id>", enforce = false }; azurerm_security_center_automation { source { event_source = "Assessments" }, action { type = "LogicApp" } } for continuous export.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-retired-sku-service-health-alert
  name: Service Health and Resource Graph Alerts for Retiring SKUs
  description: |
    Subscribe to Service Health planned maintenance and action-required events and run a scheduled Azure Resource Graph query for retired or retiring SKUs (for example Basic Load Balancer and Basic public IP addresses, retired on 30 September 2025) so remaining instances are listed and owned.
    Query: resources | where type =~ "microsoft.network/loadbalancers" and sku.name =~ "Basic".
    Terraform: azurerm_monitor_activity_log_alert { criteria { category = "ServiceHealth", service_health { events = ["ActionRequired", "Incident"] } } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-credential-bearing-config-change-alert
  name: Alert on Writes and Secret Listing for Credential-Bearing Configuration
  description: |
    Alert on changes to, and secret listing of, resources that hold credentials in their configuration: Batch pools and tasks, container groups, API Center authentication settings, Machine Learning datastores, API Management named values, NetApp Active Directory connections, Logic Apps connections, Automation credentials and variables, Data Factory linked services and Stream Analytics inputs. Operations such as Microsoft.MachineLearningServices/workspaces/datastores/listSecrets/action and Microsoft.ApiManagement/service/namedValues/listValue/action show who read the secret.
    Terraform: azurerm_monitor_activity_log_alert { criteria { category = "Administrative", operation_name = "Microsoft.MachineLearningServices/workspaces/datastores/listSecrets/action" } } per operation.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-orphaned-role-assignment-scan
  name: Scheduled Scan for Orphaned and Unknown Role Assignments
  description: |
    Run a scheduled Azure Resource Graph query for role assignments whose principal no longer exists (unknown principals, for example after an agent or identity was removed) and open a ticket for each. Orphaned assignments can be reused if the identity is recreated with the same object name.
    Query: authorizationresources | where type =~ "microsoft.authorization/roleassignments" | where isempty(tostring(properties.principalType)) or properties.principalType == "".
    Terraform: azurerm_monitor_scheduled_query_rules_alert_v2 over a workspace that receives the Resource Graph export, or a pipeline job that calls the query and files findings.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-keyvault-access-anomaly-alert
  name: Alert on Anomalous Key Vault Secret and Key Access
  description: |
    Alert on bursts of SecretGet, SecretList, KeyGet and CertificateGet, on 403 results and on access from unexpected IP addresses or identities. Compare the caller with the identities that legitimately read each vault.
    Query: AzureDiagnostics | where ResourceProvider == "MICROSOFT.KEYVAULT" and OperationName in ("SecretGet", "SecretList", "CertificateGet") | summarize reads = count() by CallerIPAddress, identity_claim_oid_g, bin(TimeGenerated, 15m) | where reads > 50.
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_key_vault.<name>.id, enabled_log { category = "AuditEvent" } }; azurerm_monitor_scheduled_query_rules_alert_v2 on the query.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-keyvault-throttling-metric-alert
  name: Alert on Key Vault Throttling and Saturation
  description: |
    Alert on HTTP 429 results and high saturation of the vault so throttling caused by missing caching, load or attacker-generated traffic is seen before dependent applications fail.
    Terraform: azurerm_monitor_metric_alert { scopes = [azurerm_key_vault.<name>.id], criteria { metric_namespace = "Microsoft.KeyVault/vaults", metric_name = "ServiceApiResult", aggregation = "Count", operator = "GreaterThan", threshold = 50, dimension { name = "StatusCode", operator = "Include", values = ["429"] } } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-terraform-state-access-monitoring
  name: Monitor Access to the Terraform State Backend
  description: |
    Terraform state holds secret values in plaintext and reads of it produce no Key Vault audit event, so monitor the state backend itself: enable blob read and write logs on the state storage account and alert on GetBlob or ListBlobs by identities other than the pipeline, and on access from outside the build network.
    Query: StorageBlobLogs | where Uri has "tfstate" and OperationName == "GetBlob" and AuthenticationType != "OAuth" or RequesterObjectId !in (pipeline_object_ids).
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = "${azurerm_storage_account.<name>.id}/blobServices/default", enabled_log { category = "StorageRead" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-key-expiry-event-alert
  name: Key Near-Expiry and New-Version Events From Key Vault and Managed HSM
  description: |
    Subscribe to Event Grid events Microsoft.KeyVault.KeyNearExpiry, KeyExpired and KeyNewVersionCreated and route them to the owning team, so keys without rotation or expiry are noticed and unexpected new key versions are investigated.
    Terraform: azurerm_eventgrid_system_topic { topic_type = "Microsoft.KeyVault.Vaults", source_arm_resource_id = azurerm_key_vault.<name>.id }; azurerm_eventgrid_system_topic_event_subscription { included_event_types = ["Microsoft.KeyVault.KeyNearExpiry", "Microsoft.KeyVault.KeyNewVersionCreated"] }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-managed-hsm-audit-alerts
  name: Managed HSM Audit Log Alerts
  description: |
    Send the AuditEvent log of the Managed HSM to the workspace and alert on role assignment changes, security domain download and restore operations, key export and release, and requests from addresses outside the approved ranges.
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_key_vault_managed_hardware_security_module.<name>.id, enabled_log { category = "AuditEvent" } }; azurerm_monitor_scheduled_query_rules_alert_v2 on AzureDiagnostics where ResourceType == "MANAGEDHSMS".
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-dedicated-hsm-audit-forwarding
  name: Dedicated HSM Audit and Syslog Forwarding With Lockout Alerts
  description: |
    Forward the audit log and syslog of each HSM appliance to the SIEM and alert on failed Security Officer and Partition Security Officer logins before the lockout counters are reached (three and ten attempts), on administrative logins from unexpected hosts, on HA group member loss and on backup job failures.
    Terraform: azurerm_dedicated_hardware_security_module for the appliance; forward logs with a syslog collector VM and azurerm_monitor_data_collection_rule using a syslog data source.
  control_functions: [detective]
  control_nature: technical
  cost: medium
- id: det-managed-identity-sign-in-anomaly
  name: Detect Managed Identity Token Use From Unexpected Locations
  description: |
    Export managed identity sign-in logs and alert when a managed identity authenticates from an IP address or resource that is not its host, requests a new resource audience, or is used at unusual volume. Token theft from a compromised workload shows as use from addresses outside the Azure range of the host.
    Query: AADManagedIdentitySignInLogs | summarize ips = make_set(IPAddress) by ServicePrincipalId, ResourceDisplayName | where array_length(ips) > 3.
    Terraform: azurerm_monitor_aad_diagnostic_setting { log_analytics_workspace_id = azurerm_log_analytics_workspace.<name>.id, enabled_log { category = "ManagedIdentitySignInLogs" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-signin-ca-gap-detection
  name: Detect Sign-Ins That Bypass or Escape Conditional Access
  description: |
    Query sign-in logs for successful sign-ins where Conditional Access was not applied, legacy authentication or the device code flow was used, or a resource such as Azure Virtual Desktop, Key Vault or the Azure portal was accessed with single-factor authentication. Each hit points at an excluded user, a trusted location that is too wide or an application outside the policy scope.
    Query: SigninLogs | where ResultType == 0 and (ConditionalAccessStatus == "notApplied" or AuthenticationProtocol == "deviceCode" or ClientAppUsed in ("Other clients", "IMAP4", "POP3", "SMTP") or AuthenticationRequirement == "singleFactorAuthentication").
    Terraform: azurerm_monitor_aad_diagnostic_setting { enabled_log { category = "SignInLogs" }, enabled_log { category = "NonInteractiveUserSignInLogs" } }; azurerm_sentinel_alert_rule_scheduled { query = "...", query_frequency = "PT1H" }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-entra-privileged-role-alerts
  name: Alert on Privileged Role Activation and Assignments Outside PIM
  description: |
    Alert on permanent assignments of Global Administrator, Privileged Role Administrator and other privileged roles, assignments made outside Privileged Identity Management, and PIM activations without an approved ticket. Use the built-in PIM alerts and an AuditLogs query.
    Query: AuditLogs | where OperationName in ("Add member to role", "Add eligible member to role") and Result == "success" and tostring(InitiatedBy) !has "MS-PIM".
    Terraform: azurerm_monitor_aad_diagnostic_setting { enabled_log { category = "AuditLogs" } }; azurerm_sentinel_alert_rule_scheduled for the query.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-lockbox-request-alerts
  name: Alert on Customer Lockbox Requests and Approvals
  description: |
    Customer Lockbox has no built-in alert option, so route its audit records to the workspace and alert on every Create, Approve, Deny and Expiry event, with the service request number in the notification. Subscription-scoped requests are written to the Activity Log, tenant-scoped requests to the Entra audit log under Access Reviews.
    Query: AzureActivity | where OperationNameValue has "LOCKBOX".
    Terraform: azurerm_monitor_scheduled_query_rules_alert_v2 on the query; azurerm_monitor_aad_diagnostic_setting { enabled_log { category = "AuditLogs" } } for tenant-scoped requests.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-b2c-spray-and-mfa-monitoring
  name: Detect Password Spraying and Single-Factor Sign-Ins in B2C
  description: |
    Send the sign-in and audit logs of the B2C tenant to a workspace and alert on one source address or user agent failing against many accounts, on successful sign-ins following many failures, and on sign-ins that completed without a second factor on flows that require one.
    Query: SigninLogs | where ResultType != 0 | summarize accounts = dcount(UserPrincipalName), failures = count() by IPAddress, bin(TimeGenerated, 15m) | where accounts > 10.
    Terraform: azurerm_monitor_aad_diagnostic_setting in the B2C tenant { enabled_log { category = "SignInLogs" }, enabled_log { category = "AuditLogs" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-egress-anomaly-detection
  name: Detect Unusual Outbound Destinations and Volumes
  description: |
    Baseline outbound destinations and volume per subnet or workload from firewall logs and virtual network flow logs, and alert on new external destinations, uploads to storage accounts outside the organization, large transfers and traffic to destinations on threat intelligence lists.
    Query: AzureDiagnostics | where Category == "AZFWApplicationRule" | summarize bytes = count() by Fqdn_s, SourceIp | where Fqdn_s !in (known_destinations).
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_firewall.<name>.id, enabled_log { category_group = "allLogs" } }; azurerm_network_watcher_flow_log { traffic_analytics { enabled = true } }.
  control_functions: [detective]
  control_nature: technical
  cost: medium
- id: det-firewall-health-metric-alerts
  name: Azure Firewall SNAT, Health and Throughput Alerts
  description: |
    Alert when SNAT port utilization or throughput nears capacity and when the firewall health state drops, so exhaustion by a compromised spoke or a misrouted workload is caught before outbound connections fail for every spoke.
    Terraform: azurerm_monitor_metric_alert { scopes = [azurerm_firewall.<name>.id], criteria { metric_namespace = "Microsoft.Network/azureFirewalls", metric_name = "SNATPortUtilization", aggregation = "Average", operator = "GreaterThan", threshold = 80 } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-waf-log-analysis
  name: Application Gateway and WAF Log Analysis
  description: |
    Analyze access and firewall logs for requests negotiating TLS 1.0 or 1.1, spoofed X-Forwarded-For or Host headers, matches in Detection mode that were not blocked, missing rate-limit or bot rule hits, and repeated blocks from one client. The access log records the TLS protocol and cipher of every request.
    Query: AzureDiagnostics | where Category == "ApplicationGatewayAccessLog" and sslProtocol_s in ("TLSv1", "TLSv1.1"); AzureDiagnostics | where Category == "ApplicationGatewayFirewallLog" and action_s == "Detected".
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_application_gateway.<name>.id, enabled_log { category_group = "allLogs" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-agw-backend-health-alert
  name: Application Gateway Backend Health and Certificate Error Alerts
  description: |
    Alert when backend hosts turn unhealthy or health probes fail certificate validation. A sudden change after a backend certificate or HTTP settings change signals broken end-to-end TLS or a tampered backend.
    Terraform: azurerm_monitor_metric_alert { scopes = [azurerm_application_gateway.<name>.id], criteria { metric_namespace = "Microsoft.Network/applicationGateways", metric_name = "UnhealthyHostCount", aggregation = "Average", operator = "GreaterThan", threshold = 0 } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-origin-direct-access-detection
  name: Detect Requests That Reach the Origin Without Passing the Edge
  description: |
    Compare origin access logs with Front Door or Application Gateway logs and alert on requests to the origin whose source address is not in the AzureFrontDoor.Backend service tag or the gateway subnet, and on origin requests with no matching edge request ID.
    Query: AppServiceHTTPLogs | where CIp !in (frontdoor_backend_ranges) | summarize hits = count() by CIp, CsHost.
    Terraform: azurerm_monitor_diagnostic_setting for the origin { enabled_log { category = "AppServiceHTTPLogs" } } and for azurerm_cdn_frontdoor_profile { enabled_log { category = "FrontDoorAccessLog" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-public-name-resolution-detection
  name: Detect Service Names That Resolve to Public Addresses
  description: |
    Log DNS queries from virtual networks and alert when a PaaS name that has a private endpoint (privatelink zones) resolves to a public address, or when workloads connect to public service addresses. This shows traffic that bypasses private connectivity and is open to interception on the network path.
    Query: DnsQueryLogs | where QueryName has_any (".blob.core.windows.net", ".vault.azure.net", ".database.windows.net") and not(ipv4_is_private(tostring(ResponseData))).
    Terraform: azurerm_private_dns_resolver_dns_forwarding_ruleset with azurerm_monitor_diagnostic_setting on azurerm_virtual_network.<name>.id { enabled_log { category = "DnsQueryLogs" } }.
  control_functions: [detective]
  control_nature: technical
  cost: medium
- id: det-aks-audit-log-alerts
  name: AKS Control Plane Audit Log Alerts
  description: |
    Send the kube-audit-admin log to the workspace and alert on reads and lists of Secret objects by non-system identities, creation of privileged pods and host-path mounts, and exec into pods.
    Query: AKSAuditAdmin | where ObjectRef.resource == "secrets" and Verb in ("get", "list") and not(User.username startswith "system:").
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_kubernetes_cluster.<name>.id, enabled_log { category = "kube-audit-admin" } }.
  control_functions: [detective]
  control_nature: technical
  cost: medium
- id: det-aks-network-observability
  name: AKS Pod Network Flow Visibility
  description: |
    Enable container network observability to record pod-to-pod and pod-to-external flows, and alert on flows between namespaces that should be separate and on new external destinations from pods. This shows where policies are missing before they are enforced.
    Terraform: azurerm_kubernetes_cluster { network_profile { advanced_networking { observability_enabled = true } } }.
  control_functions: [detective]
  control_nature: technical
  cost: medium
- id: det-packet-capture-alert
  name: Alert on Network Watcher Packet Captures
  description: |
    Alert on creation of packet captures and on installation of the Network Watcher agent extension on virtual machines, because a capture records payload data and the extension runs code on the VM.
    Terraform: azurerm_monitor_activity_log_alert { criteria { category = "Administrative", operation_name = "Microsoft.Network/networkWatchers/packetCaptures/write" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-vpn-tunnel-diagnostics
  name: VPN Gateway Tunnel and Point-to-Site Diagnostics
  description: |
    Collect tunnel diagnostic, IKE, route and point-to-site logs and alert on tunnels that come up from unexpected peer addresses, repeated IKE failures, new point-to-site users and sessions from unusual locations. Alert on listing of shared keys through Microsoft.Network/connections/sharedKey operations.
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_virtual_network_gateway.<name>.id, enabled_log { category = "TunnelDiagnosticLog" }, enabled_log { category = "IKEDiagnosticLog" }, enabled_log { category = "P2SDiagnosticLog" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-expressroute-bgp-monitoring
  name: ExpressRoute BGP and Route Change Monitoring
  description: |
    Alert on BGP availability drops and on unexpected changes in the number of routes advertised to or learned from peers, which shows route injection or a changed provider configuration. Also record whether MACsec or IPsec protects the circuit.
    Terraform: azurerm_monitor_metric_alert { scopes = [azurerm_express_route_circuit.<name>.id], criteria { metric_namespace = "Microsoft.Network/expressRouteCircuits", metric_name = "BgpAvailability", aggregation = "Average", operator = "LessThan", threshold = 100 } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-traffic-manager-endpoint-alert
  name: Traffic Manager Endpoint State Change Alerts
  description: |
    Alert on endpoints that change state without a deployment, for example flapping caused by forged probe responses, and on profile changes through the Activity Log.
    Terraform: azurerm_monitor_metric_alert { scopes = [azurerm_traffic_manager_profile.<name>.id], criteria { metric_namespace = "Microsoft.Network/trafficManagerProfiles", metric_name = "ProbeAgentCurrentEndpointStateByProfileResourceId", aggregation = "Maximum", operator = "LessThan", threshold = 1 } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-event-grid-failure-alert
  name: Event Grid Publish and Delivery Failure Alerts
  description: |
    Alert on failed publishes, failed delivery attempts and dropped events, and log delivery failures so forged events sent directly to a webhook and unexpected publishers are visible. Compare webhook request logs with Event Grid delivery logs and flag requests that have no matching delivery.
    Terraform: azurerm_monitor_metric_alert { scopes = [azurerm_eventgrid_topic.<name>.id], criteria { metric_namespace = "Microsoft.EventGrid/topics", metric_name = "DeliveryAttemptFailCount", aggregation = "Total", operator = "GreaterThan", threshold = 10 } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-appservice-config-read-alert
  name: Alert on Reads of App Service Configuration and Publishing Profiles
  description: |
    Alert on listing of site configuration, application settings publishing profiles and function keys through the Activity Log (operations Microsoft.Web/sites/config/list/action, Microsoft.Web/sites/publishxml/action and Microsoft.Web/sites/host/listkeys/action), because these reveal plaintext settings, deployment credentials and keys that grant access to function code.
    Terraform: azurerm_monitor_activity_log_alert { criteria { category = "Administrative", operation_name = "Microsoft.Web/sites/config/list/action" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-appservice-basic-auth-login-alert
  name: Alert on FTP and SCM Basic Authentication Logins
  description: |
    Enable the AppServiceAuditLogs category, which records FTP and Kudu login activity, and alert on any successful basic-authentication login to an app where deployment is meant to use Entra ID, and on logins from outside the build network.
    Query: AppServiceAuditLogs | where Protocol in ("FTP", "SCM", "Kudu") and Result == "Success".
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_linux_web_app.<name>.id, enabled_log { category = "AppServiceAuditLogs" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-function-storage-write-audit
  name: Audit Writes to the Function Package and Key Storage
  description: |
    Log blob writes and deletes on the account that holds the function package and keys, and alert on writes to the content share, deployment containers or azure-webjobs-secrets by any identity other than the deployment pipeline.
    Query: StorageBlobLogs | where OperationName in ("PutBlob", "DeleteBlob") and Uri has_any ("azure-webjobs-secrets", "scm-releases") and RequesterObjectId !in (pipeline_object_ids).
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = "${azurerm_storage_account.<name>.id}/blobServices/default", enabled_log { category = "StorageWrite" }, enabled_log { category = "StorageDelete" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-acr-push-delete-audit
  name: Audit Image Pushes and Deletes in the Registry
  description: |
    Collect repository events and alert on pushes to an existing tag (tag overwrite), pushes by an identity other than the build pipeline, and deletes of images or repositories. Pair with content trust or signature verification at deployment.
    Query: ContainerRegistryRepositoryEvents | where OperationName in ("Push", "Delete", "Untag") and Identity !in (pipeline_identities).
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_container_registry.<name>.id, enabled_log { category = "ContainerRegistryRepositoryEvents" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-container-apps-log-alerts
  name: Container Apps System and Console Log Alerts
  description: |
    Send system and console logs to the workspace and alert on image pulls from registries outside the allow list, revisions deployed outside the pipeline, and requests that reach external ingress without an authenticated principal.
    Query: ContainerAppSystemLogs_CL | where Log_s has "Pulling image" and Log_s !has "<approved registry>.azurecr.io".
    Terraform: azurerm_container_app_environment { log_analytics_workspace_id = azurerm_log_analytics_workspace.<name>.id }; azurerm_monitor_scheduled_query_rules_alert_v2 on the query.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-redis-client-anomaly-alert
  name: Detect Unexpected Redis Clients and Write Patterns
  description: |
    Enable the connected client list log and alert on client addresses that are not application hosts, and on abnormal write volume or key patterns, which indicate a stranger or a tampering attempt against cache content.
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_redis_cache.<name>.id, enabled_log { category = "ConnectedClientList" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-update-compliance-alerts
  name: Patch Compliance Assessment and Alerts for Scale Sets and VMs
  description: |
    Enable periodic assessment with Azure Update Manager and alert on instances with critical or security updates pending beyond the allowed window, or on scale sets running an outdated image version.
    Query: patchassessmentresources | where type =~ "microsoft.compute/virtualmachines/patchassessmentresults" and properties.availablePatchCountByClassification.critical > 0.
    Terraform: azurerm_orchestrated_virtual_machine_scale_set { automatic_instance_repair { enabled = true } }; azurerm_maintenance_configuration { scope = "InGuestPatch" }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-windows-security-event-monitoring
  name: Windows Security Event Monitoring for Domain Join and Local Admin Abuse
  description: |
    Collect Windows security events and alert on password resets and account changes made with the domain join account (4724, 4742), computers added to the domain outside the pipeline (4741), additions to the local Administrators group (4732) and network or remote interactive logons with local accounts on many hosts (4624 types 3 and 10 with the same account name).
    Terraform: azurerm_monitor_data_collection_rule { data_sources { windows_event_log { streams = ["Microsoft-Event"], x_path_queries = ["Security!*[System[(EventID=4624 or EventID=4732 or EventID=4724 or EventID=4742)]]"] } } }.
  control_functions: [detective]
  control_nature: technical
  cost: medium
- id: det-avd-connection-anomaly-alert
  name: AVD Connection and Session Anomaly Alerts
  description: |
    Send connection, error and management logs to the workspace and alert on sign-ins from unusual locations or client types, bursts of connections from one account, host pools nearing their session limit and sessions that stay disconnected for long periods.
    Query: WVDConnections | where State == "Connected" | summarize sessions = dcount(CorrelationId), ips = dcount(ClientIPAddress) by UserName, bin(TimeGenerated, 1h) | where ips > 3 or sessions > 10.
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_virtual_desktop_host_pool.<name>.id, enabled_log { category = "Connection" }, enabled_log { category = "Error" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-ml-job-and-egress-audit
  name: Machine Learning Job, Environment and Egress Audit
  description: |
    Log compute job events and alert on jobs using environments or models that are not registered, on package installs from external indexes and on outbound connections from compute to addresses outside the allow list. Pair with the egress detection of the compute subnet.
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_machine_learning_workspace.<name>.id, enabled_log { category = "AmlComputeJobEvent" }, enabled_log { category = "AmlRunStatusChangedEvent" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-hdinsight-security-log-monitoring
  name: HDInsight Security and Ranger Audit Monitoring
  description: |
    Enable Azure Monitor logs integration and alert on failed and anonymous authentications, Ranger policy denials, access to keytab paths and SSH logins from unexpected addresses.
    Query: HDInsightSecurityLogs | where Result == "Failed" or Message has "keytab".
    Terraform: azurerm_hdinsight_hadoop_cluster { monitor { log_analytics_workspace_id = azurerm_log_analytics_workspace.<name>.id, primary_key = "<key>" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-service-fabric-endpoint-monitoring
  name: Service Fabric Management Endpoint and Security Monitoring
  description: |
    Alert on connections to client port 19000 and gateway port 19080 from outside the management network using virtual network flow logs, audit cluster security settings with Azure Policy, and collect operational events so anonymous management operations are visible.
    Terraform: azurerm_network_watcher_flow_log { target_resource_id = azurerm_virtual_network.<name>.id, version = 2 }; azurerm_subscription_policy_assignment for the Service Fabric authentication policy.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-sql-privilege-and-classification-audit
  name: SQL Privilege Change Audit and Data Classification
  description: |
    Audit role membership and permission changes (DATABASE_ROLE_MEMBER_CHANGE_GROUP, SERVER_ROLE_MEMBER_CHANGE_GROUP, DATABASE_PERMISSION_CHANGE_GROUP), logins with the server admin account, and reads of classified columns. Run vulnerability assessment to flag excessive privileges and enable data discovery and classification so queries on sensitive columns are visible in the audit record.
    Terraform: azurerm_mssql_server_extended_auditing_policy { server_id = azurerm_mssql_server.<name>.id, log_monitoring_enabled = true }; azurerm_mssql_server_vulnerability_assessment.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-cosmosdb-control-plane-alerts
  name: Cosmos DB Control Plane and Data Operation Alerts
  description: |
    Collect control plane request logs and alert on deletes and changes of databases, containers, keys and backup policy, and on key regeneration.
    Query: CDBControlPlaneRequests | where OperationName has_any ("Delete", "Update", "Regenerate").
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_cosmosdb_account.<name>.id, enabled_log { category = "ControlPlaneRequests" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-backup-critical-operation-alerts
  name: Backup Vault Critical Operation Alerts
  description: |
    Alert on stop-protection with delete, disabling of soft delete, reduced retention, immutability or network setting changes on the vault, and on restores from unusual identities. Use built-in Azure Backup alerts and Activity Log alerts, and report unprotected resources.
    Terraform: azurerm_monitor_activity_log_alert { criteria { category = "Administrative", operation_name = "Microsoft.RecoveryServices/vaults/backupFabrics/protectionContainers/protectedItems/delete" } }; azurerm_data_protection_backup_vault { soft_delete = "AlwaysOn" }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-adx-command-audit
  name: Data Explorer Command and Principal Change Audit
  description: |
    Enable command and query logs and alert on principal assignment changes, purge and drop commands, policy changes and queries that export data or reach external tenants.
    Query: AzureDiagnostics | where Category == "Command" and CommandText_s has_any (".add database", ".purge", ".drop", ".alter-merge database policy").
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_kusto_cluster.<name>.id, enabled_log { category = "Command" }, enabled_log { category = "Query" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-adls-acl-change-audit
  name: Data Lake ACL Change Audit
  description: |
    Log directory operations and alert on SetAccessControl and recursive ACL changes, and on ACL entries that name individual users or service principals.
    Query: StorageBlobLogs | where OperationName in ("SetAccessControl", "SetAccessControlRecursive").
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = "${azurerm_storage_account.<name>.id}/blobServices/default", enabled_log { category = "StorageWrite" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-queue-write-audit
  name: Audit Queue Message Writes
  description: |
    Log queue operations and alert on PutMessage and ClearMessages by identities or addresses outside the producers of that queue, and on sudden changes in queue depth.
    Query: StorageQueueLogs | where OperationName in ("PutMessage", "ClearMessages") and RequesterObjectId !in (producer_object_ids).
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = "${azurerm_storage_account.<name>.id}/queueServices/default", enabled_log { category = "StorageWrite" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-files-auth-type-detection
  name: Detect Account-Key and Unsigned SMB Access to Azure Files
  description: |
    Log file service operations and alert on requests authenticated with the account key or a SAS where identity-based access is expected, on SMB sessions without encryption, and on mass delete or rename operations that look like ransomware.
    Query: StorageFileLogs | where AuthenticationType == "AccountKey" or OperationName in ("Delete", "DeleteShare").
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = "${azurerm_storage_account.<name>.id}/fileServices/default", enabled_log { category = "StorageWrite" }, enabled_log { category = "StorageDelete" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-domain-services-security-audit
  name: Entra Domain Services Security Auditing
  description: |
    Enable security audit categories of the managed domain and alert on NTLMv1 logons (event 4624 with package name NTLM V1), Kerberos tickets with RC4 encryption (4768 and 4769 with ticket encryption type 0x17), bursts of failed logons (4625, 4771) and external traffic to port 636 in virtual network flow logs.
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_active_directory_domain_service.<name>.id, enabled_log { category = "AccountLogon" }, enabled_log { category = "LogonLogoff" }, enabled_log { category = "AccountManagement" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-iot-hub-connection-anomaly
  name: IoT Hub Device Connection Anomaly Detection
  description: |
    Log device connections and alert when one device identity connects from several addresses, reconnects at an abnormal rate or connects from an address outside its expected network, which indicates a cloned or stolen device credential. Enable Defender for IoT where it applies.
    Query: AzureDiagnostics | where Category == "Connections" and OperationName == "deviceConnect" | summarize ips = dcount(callerIpAddress_s) by deviceId_s, bin(TimeGenerated, 1h) | where ips > 1.
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_iothub.<name>.id, enabled_log { category = "Connections" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-asr-event-alerts
  name: Site Recovery Event and Failover Alerts
  description: |
    Alert on failover, test failover, replication pause and configuration changes made by Site Recovery operators, and on changes to replica or target network settings. Compare the caller with the planned DR exercise.
    Terraform: azurerm_monitor_activity_log_alert { criteria { category = "Administrative", resource_provider = "Microsoft.RecoveryServices" } }; azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_recovery_services_vault.<name>.id, enabled_log { category = "AzureSiteRecoveryEvents" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-synapse-rbac-audit
  name: Synapse RBAC and Workspace Activity Audit
  description: |
    Collect Synapse RBAC operation and integration pipeline logs and alert on role assignments for Synapse Administrator, linked service credential reads and pipelines created outside the deployment process.
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_synapse_workspace.<name>.id, enabled_log { category = "SynapseRbacOperations" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-workspace-ingestion-anomaly
  name: Detect Forged or Flooded Log Ingestion and Workspace Key Use
  description: |
    Alert on ingestion volume spikes by data type, new custom tables, records arriving through the legacy HTTP data collector, and listing or regeneration of the workspace shared keys (Microsoft.OperationalInsights/workspaces/sharedKeys/action). Disable local authentication so only Entra ID based ingestion remains.
    Query: Usage | where IsBillable and Quantity > 2 * avg_quantity_by_type | summarize by DataType.
    Terraform: azurerm_monitor_activity_log_alert { criteria { category = "Administrative", operation_name = "Microsoft.OperationalInsights/workspaces/sharedKeys/action" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-workspace-query-audit
  name: Query Auditing and Sentinel Audit for Security Workspaces
  description: |
    Enable query auditing and Sentinel auditing, then alert on queries of sensitive tables by identities outside the SOC, large exports, and creation, change or deletion of watchlists, analytics rules and data connectors.
    Query: LAQueryLogs | where QueryText has_any ("SigninLogs", "SecurityEvent") and AADEmail !in (soc_members); SentinelAudit | where SentinelResourceType == "Watchlist".
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_log_analytics_workspace.<name>.id, enabled_log { category = "Audit" } }; azurerm_sentinel_log_analytics_workspace_onboarding.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-app-insights-ingestion-anomaly
  name: Detect Rogue Telemetry in Application Insights
  description: |
    Baseline telemetry by role name, client address and SDK version and alert on new role names, unfamiliar ingestion sources and volume spikes, which indicate use of a leaked instrumentation key or connection string. Disable local authentication so only identity-based ingestion is accepted.
    Query: AppRequests | summarize count() by AppRoleName, ClientIP, SDKVersion, bin(TimeGenerated, 1h) | where AppRoleName !in (known_roles).
    Terraform: azurerm_application_insights { local_authentication_disabled = true }; azurerm_monitor_scheduled_query_rules_alert_v2 on the query.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-sensitive-data-in-logs-scan
  name: Scan Telemetry for Secrets and Personal Data
  description: |
    Run scheduled queries over request URLs, trace messages and exception text for token patterns, SAS signatures, connection strings and personal identifiers, and alert on hits so the source can be fixed and the data purged.
    Query: AppRequests | where Url matches regex @"(sig=|access_token=|password=|AccountKey=)".
    Terraform: azurerm_monitor_scheduled_query_rules_alert_v2 { criteria { query = "...", time_aggregation_method = "Count", operator = "GreaterThan", threshold = 0 } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-ai-services-request-audit
  name: AI Services Request Audit and Threat Protection
  description: |
    Enable audit and request logs for the account and Defender for AI services threat protection. Alert on requests from addresses outside the allow list, on prompt injection and jailbreak detections, on credential theft and on unusual token usage per caller.
    Terraform: azurerm_security_center_subscription_pricing { resource_type = "AI", tier = "Standard" }; azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_cognitive_account.<name>.id, enabled_log { category = "Audit" }, enabled_log { category = "RequestResponse" } }.
  control_functions: [detective]
  control_nature: technical
  cost: medium
- id: det-ai-search-query-audit
  name: AI Search Query Auditing by Caller
  description: |
    Log search operations and alert on callers that query without the security trimming filter, retrieve unusually many documents, or request fields that are meant for restricted audiences.
    Query: AzureDiagnostics | where ResourceProvider == "MICROSOFT.SEARCH" and OperationName == "Query.Search" | summarize queries = count(), avg_docs = avg(Documents_d) by IndexName_s, bin(TimeGenerated, 1h).
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_search_service.<name>.id, enabled_log { category = "OperationLogs" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-apim-subscription-key-anomaly
  name: API Management Subscription Key Use Anomaly Detection
  description: |
    Analyze gateway logs per subscription and alert when one key is used from many addresses, outside business hours or against APIs it should not reach, which indicates a leaked key. Alert on trace being enabled on products and on named value listing.
    Query: ApiManagementGatewayLogs | summarize ips = dcount(CallerIpAddress), calls = count() by ApimSubscriptionId, bin(TimeGenerated, 1h) | where ips > 5.
    Terraform: azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_api_management.<name>.id, enabled_log { category = "GatewayLogs" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
- id: det-logic-app-trigger-and-run-alerts
  name: Logic Apps Trigger URL Listing, Trigger Source and Run Content Alerts
  description: |
    Alert on listing of workflow callback URLs (Microsoft.Logic/workflows/triggers/listCallbackUrl/action), on workflow definition writes outside the pipeline, on trigger runs that originate from addresses outside the allowed caller ranges, and on reads of run history inputs and outputs by identities outside the owning team.
    Query: AzureActivity | where OperationNameValue has "LISTCALLBACKURL" or OperationNameValue =~ "MICROSOFT.LOGIC/WORKFLOWS/WRITE".
    Terraform: azurerm_monitor_activity_log_alert { criteria { category = "Administrative", operation_name = "Microsoft.Logic/workflows/triggers/listCallbackUrl/action" } }; azurerm_monitor_diagnostic_setting { target_resource_id = azurerm_logic_app_workflow.<name>.id, enabled_log { category = "WorkflowRuntime" } }.
  control_functions: [detective]
  control_nature: technical
  cost: low
