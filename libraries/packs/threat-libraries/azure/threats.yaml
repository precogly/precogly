threats:
- id: azure-storage-account-public-access
  name: Storage Account Anonymous Blob Access
  description: |
    Blob containers can be read anonymously because the account allows public
    nested items and a container uses "blob" or "container" access level.
    No credential is required and anonymous reads are not tied to any identity.

    Attack scenario: An attacker enumerates <account>.blob.core.windows.net
    names (or finds URLs in source code, HTML or search engines), lists a
    container with access type "container" and downloads every blob.

    Impact: Mass disclosure of business data, backups or PII; regulatory
    breach notification.

    Severity: High

    Terraform indicators: allow_nested_items_to_be_public = true (default true
    in azurerm < 3.0); azurerm_storage_container.container_access_type = "blob"
    or "container".

    References: MCSB v2 NS-2, PV-1, PV-2, DS-6; NIST SP 800-53 Rev. 5 SC-7, AC-4, CM-2, CM-6, CM-3, CM-7; BSI IT-Grundschutz NET.1.1, NET.3.2, OPS.2.2, OPS.1.1.3; NIS2 Art. 21(2) (a), (e), (d); MITRE ATT&CK T1530, T1619.
- id: azure-storage-account-shared-key-abuse
  name: Storage Account Shared Key Abuse
  description: |
    Shared Key authorization is enabled, so anyone holding an account access
    key gets full data-plane control over all services in the account. Entra ID
    RBAC, Conditional Access and per-identity auditing are all bypassed.
    Keys never expire and are long-lived by default.

    Attack scenario: An account key leaks through a connection string in an app
    setting, a CI log, a developer workstation or Terraform state
    (primary_access_key / primary_connection_string). The attacker uses it from
    any network location permitted by the firewall to read, overwrite or delete
    data.

    Impact: Full compromise of data confidentiality and integrity in the
    account. Actions appear only as "key" access with no user identity.

    Severity: High

    Terraform indicators: shared_access_key_enabled = true (default);
    default_to_oauth_authentication = false; outputs or app_settings
    referencing primary_access_key or primary_connection_string.

    References: MCSB v2 IM-1, IM-8, IM-3, DS-6; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, CON.1, OPS.2.2; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1552.001, T1530.
- id: azure-storage-account-sas-token-abuse
  name: Storage Account SAS Token Abuse
  description: |
    Account or service SAS tokens signed with the account key are issued with
    broad permissions, long expiry or no IP restriction. They cannot be revoked
    individually; only rotating the signing key invalidates them.

    Attack scenario: A SAS URL with sp=racwdl and an expiry years in the future
    is embedded in a mobile app, script or support ticket. An attacker reuses
    it to exfiltrate or overwrite data until someone rotates the key.

    Impact: Persistent unauthorized data access that survives credential
    rotation of users and identities.

    Severity: Medium

    Terraform indicators: data "azurerm_storage_account_sas" or
    "azurerm_storage_account_blob_container_sas" with long expiry; no sas_policy
    block on the account; shared_access_key_enabled = true.

    References: MCSB v2 IM-8, IM-1; NIST SP 800-53 Rev. 5 IA-5, SI-4, RA-5, SC-12, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (h), (i), (j); MITRE ATT&CK T1550.001, T1530.
- id: azure-storage-account-public-network-exposure
  name: Storage Account Public Network Exposure
  description: |
    Storage endpoints are reachable from the whole internet because public
    network access is enabled and the firewall default action is Allow.
    Any leaked credential, SAS or misconfigured RBAC becomes exploitable from
    anywhere, including other Azure tenants.

    Attack scenario: An attacker who obtained a token or SAS for the account
    connects directly from attacker infrastructure. No network control stops
    the request because there is no IP or VNet restriction and no private
    endpoint.

    Impact: Removes network as a defense layer; enables data exfiltration from
    outside the corporate perimeter.

    Severity: High

    Terraform indicators: public_network_access = "Enabled" (default);
    network_rules.default_action = "Allow" or network_rules absent;
    bypass including "AzureServices" without need.

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1530.
- id: azure-storage-account-data-exfiltration
  name: Storage Account Cross-Tenant Data Exfiltration
  description: |
    An identity with data-plane read access copies data server-side to a
    storage account controlled by the attacker, for example via AzCopy
    copy-from-URL or object replication to another tenant. The copy happens
    inside the Azure backbone and does not traverse customer egress controls.

    Attack scenario: A compromised workload identity with
    Storage Blob Data Reader starts a server-side copy of all containers to an
    attacker-owned account in a different Entra tenant, or an insider
    configures object replication to an external account.

    Impact: Bulk data theft that bypasses network DLP and egress firewalls.

    Severity: High

    Terraform indicators: cross_tenant_replication_enabled = true (default in
    older azurerm versions); allowed_copy_scope not set; broad
    Storage Blob Data Reader/Contributor assignments at subscription scope.

    References: MCSB v2 NS-2, PA-7; NIST SP 800-53 Rev. 5 SC-7, AC-4, AC-2, AC-3, AC-5, AC-6; BSI IT-Grundschutz NET.1.1, NET.3.2, ORP.4; NIS2 Art. 21(2) (a), (i); MITRE ATT&CK T1537, T1530.
- id: azure-storage-account-insecure-transport
  name: Storage Account Insecure Transport
  description: |
    The account accepts plain HTTP requests or TLS versions below 1.2, exposing
    credentials, SAS tokens and data in transit to interception or downgrade.

    Attack scenario: A client on an untrusted network sends requests over HTTP
    or negotiates TLS 1.0. An on-path attacker captures the SAS token or
    Shared Key-signed request and replays it.

    Impact: Credential and data disclosure; tampering with data in transit.

    Severity: Medium

    Terraform indicators: https_traffic_only_enabled = false
    (enable_https_traffic_only in azurerm < 4.x); min_tls_version = "TLS1_0" or
    "TLS1_1".

    References: MCSB v2 DP-3, NS-8, PV-1, PV-2; NIST SP 800-53 Rev. 5 SC-8, SC-13, IA-5, CM-2, CM-6, CM-3; BSI IT-Grundschutz CON.1, NET.1.1, NET.3.2, OPS.2.2; NIS2 Art. 21(2) (h), (a), (e); MITRE ATT&CK T1557, T1040.
- id: azure-storage-account-malicious-content-upload
  name: Storage Account Malicious Content Upload
  description: |
    Users or integrations can upload arbitrary files that downstream systems,
    static websites or other users later consume. Stored malware or tampered
    artifacts then spread to every consumer.

    Attack scenario: An attacker uploads a weaponized document to a container
    used by an internal document-processing pipeline, or replaces a JavaScript
    file served by the static website ($web) feature.

    Impact: Malware distribution, compromise of downstream processes,
    defacement.

    Severity: Medium

    Terraform indicators: static_website block present; upload SAS or
    Storage Blob Data Contributor granted to external-facing apps;
    Defender for Storage malware scanning not enabled
    (azurerm_security_center_storage_defender absent).

    References: MCSB v2 DP-2, LT-1, PA-7, IM-8; NIST SP 800-53 Rev. 5 AC-4, SI-4, AU-6, AC-2, AC-3, AC-5; BSI IT-Grundschutz CON.1, OPS.1.1.5, DER.1, ORP.4; NIS2 Art. 21(2) (h), (b), (i); MITRE ATT&CK T1080.
- id: azure-storage-account-data-destruction
  name: Storage Account Data Destruction or Ransomware
  description: |
    Without soft delete, versioning, immutability and resource locks, an
    attacker or faulty automation can permanently delete or encrypt blobs,
    containers or the whole account.

    Attack scenario: An attacker with Storage Blob Data Contributor overwrites
    every blob with encrypted content and deletes previous data, or an
    identity with Contributor deletes the storage account. A Terraform
    refactor that changes a ForceNew attribute (e.g. account_kind or
    location) destroys and recreates the account.

    Impact: Permanent data loss, business outage, ransom demand.

    Severity: High

    Terraform indicators: blob_properties without versioning_enabled,
    delete_retention_policy or container_delete_retention_policy;
    no azurerm_management_lock; no lifecycle { prevent_destroy = true }.

    References: MCSB v2 BR-1, BR-2, AM-3; NIST SP 800-53 Rev. 5 CP-9, CP-10, SC-12, SC-13, SC-28, CM-3; BSI IT-Grundschutz CON.3, OPS.2.2; NIS2 Art. 21(2) (c), (a); MITRE ATT&CK T1485, T1486, T1490.
- id: azure-storage-account-cmk-revocation
  name: Storage Account Customer-Managed Key Revocation
  description: |
    The account is encrypted with a customer-managed key from Key Vault.
    Disabling or deleting that key, or removing the account identity's access
    to it, makes all data unreadable.

    Attack scenario: An attacker with Key Vault Crypto Officer on the key vault
    disables the key version and demands ransom. Alternatively the key vault
    has no purge protection and the key is purged permanently.

    Impact: Complete loss of availability for all data in the account,
    potentially permanent.

    Severity: High

    Terraform indicators: customer_managed_key block referencing a key vault
    with purge_protection_enabled = false; broad Key Vault Crypto roles.

    References: MCSB v2 DP-8, BR-2, PA-7, AM-3; NIST SP 800-53 Rev. 5 IA-5, SC-12, SC-17, CP-9, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1, CON.3, OPS.2.2; NIS2 Art. 21(2) (h), (i), (c); MITRE ATT&CK T1486.
- id: azure-storage-account-missing-audit-logging
  name: Storage Account Missing Data-Plane Audit Logging
  description: |
    Data-plane operations (read, write, delete, list) are not sent to a log
    destination, so data access cannot be reconstructed during an
    investigation. Shared Key and SAS requests carry no user identity, which
    makes attribution worse.

    Attack scenario: After a suspected leak the incident team cannot tell which
    blobs were read, by which principal or from which IP, because no
    StorageRead / StorageWrite / StorageDelete logs exist.

    Impact: Inability to prove or bound a breach; non-repudiation failure.

    Severity: Medium

    Terraform indicators: no azurerm_monitor_diagnostic_setting targeting
    "<account_id>/blobServices/default" (and file/queue/table services).

    References: MCSB v2 LT-3, LT-5, LT-6, IM-1; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4, AU-7; BSI IT-Grundschutz OPS.1.1.5, DER.1, ORP.4; NIS2 Art. 21(2) (b), (i), (j).
- id: azure-storage-account-control-plane-key-listing
  name: Storage Account Key Listing via Control-Plane Role
  description: |
    Control-plane roles such as Contributor, Storage Account Contributor or
    custom roles with Microsoft.Storage/storageAccounts/listKeys/action can
    retrieve account keys. That turns management permissions into full data
    access and bypasses data-plane RBAC entirely.

    Attack scenario: A CI/CD service principal with Contributor on the
    subscription (common in Terraform pipelines) is compromised. The attacker
    calls listKeys on every storage account and reads all data, including other
    Terraform state files.

    Impact: Escalation from infrastructure management rights to unrestricted
    data access across many accounts.

    Severity: High

    Terraform indicators: azurerm_role_assignment granting Contributor/Owner at
    subscription or resource-group scope; shared_access_key_enabled = true;
    provider configured with storage_use_azuread = false.

    References: MCSB v2 IM-1, IM-8, PA-7, PA-1; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1078.004, T1530.
- id: azure-key-vault-public-network-exposure
  name: Key Vault Public Network Exposure
  description: |
    The vault endpoint accepts requests from any internet address. Any stolen
    Entra ID token for an identity with secret permissions is directly usable
    from attacker infrastructure.

    Attack scenario: An attacker phishes a developer who holds
    Key Vault Secrets User and calls the vault's data-plane API from a VPS.
    No IP or VNet restriction blocks the request.

    Impact: Disclosure of secrets, keys and certificates from outside the
    corporate network.

    Severity: High

    Terraform indicators: public_network_access_enabled = true (default);
    network_acls absent or default_action = "Allow".

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1555.006.
- id: azure-key-vault-access-policy-escalation
  name: Key Vault Access Policy Privilege Escalation
  description: |
    With the legacy access-policy permission model, any principal that can
    write the vault resource (e.g. Contributor, Key Vault Contributor) can add
    an access policy granting itself full secret, key and certificate
    permissions.

    Attack scenario: A compromised service principal with Contributor on the
    resource group adds an access policy for itself with "Get, List" on
    secrets and then dumps every secret.

    Impact: Escalation from management-plane rights to full data-plane access.

    Severity: High

    Terraform indicators: rbac_authorization_enabled = false
    (enable_rbac_authorization in azurerm < 4.x) or omitted; access_policy
    blocks or azurerm_key_vault_access_policy resources; Contributor granted
    at vault, resource-group or subscription scope.

    References: MCSB v2 DP-8, PA-7, PA-1, PA-2; NIST SP 800-53 Rev. 5 IA-5, SC-12, SC-17, AC-2, AC-3, AC-5; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (h), (i); MITRE ATT&CK T1098.003, T1555.006.
- id: azure-key-vault-overprivileged-secret-access
  name: Key Vault Over-Privileged Secret Access
  description: |
    Workloads or users hold secret-read roles at vault scope or higher, or
    many applications share one vault. Compromising any single consumer
    exposes every secret in the vault.

    Attack scenario: An attacker gets code execution in one App Service,
    requests a Key Vault token via its managed identity, lists all secrets and
    retrieves database passwords for unrelated applications.

    Impact: Lateral movement across applications and environments; large
    blast radius from a single workload compromise.

    Severity: High

    Terraform indicators: azurerm_role_assignment with
    "Key Vault Secrets User"/"Key Vault Administrator" at resource-group or
    subscription scope; a single shared vault referenced by many apps;
    access policies with secret_permissions including "List".

    References: MCSB v2 DP-8, PA-7, LT-1; NIST SP 800-53 Rev. 5 IA-5, SC-12, SC-17, AC-2, AC-3, AC-5; BSI IT-Grundschutz ORP.4, CON.1, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (h), (i), (b); MITRE ATT&CK T1555.006.
- id: azure-key-vault-secret-tampering
  name: Key Vault Secret or Key Tampering
  description: |
    A principal with write permissions on secrets, keys or certificates
    replaces values consumed by applications. Examples are a connection string
    pointing to an attacker database, an imported key, or a substituted TLS
    certificate.

    Attack scenario: An attacker with Key Vault Secrets Officer sets a new
    version of the "PaymentApiUrl" secret pointing to an attacker proxy.
    Applications that resolve the latest version start sending data there.

    Impact: Integrity compromise of dependent applications, credential
    interception, traffic redirection.

    Severity: High

    Terraform indicators: broad "Key Vault Secrets Officer",
    "Key Vault Crypto Officer" or "Key Vault Certificates Officer"
    assignments; apps referencing secrets without a pinned version where
    integrity matters.

    References: MCSB v2 PA-7, PA-1, PA-2, LT-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, AC-16, AU-2; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (i), (b); MITRE ATT&CK T1565.
- id: azure-key-vault-stale-credentials
  name: Key Vault Non-Expiring and Unrotated Credentials
  description: |
    Secrets, keys and certificates have no expiration date and no rotation
    policy, so a leaked value stays valid indefinitely.

    Attack scenario: A storage key stored as a secret was copied by a former
    contractor two years ago. It is still valid because it never expired and
    was never rotated.

    Impact: Long-term unauthorized access with leaked credentials.

    Severity: Medium

    Terraform indicators: azurerm_key_vault_secret / azurerm_key_vault_key
    without expiration_date; azurerm_key_vault_key without rotation_policy;
    certificates without lifetime_action auto-renew.

    References: MCSB v2 DP-6, DP-7, IM-1, IM-3; NIST SP 800-53 Rev. 5 IA-5, SC-12, SC-28, SC-17, AC-2, AC-3; BSI IT-Grundschutz CON.1, ORP.4; NIS2 Art. 21(2) (h), (i), (j); MITRE ATT&CK T1078.004.
- id: azure-key-vault-secrets-in-terraform-state
  name: Key Vault Secret Values Exposed in Terraform State
  description: |
    Secret values managed through Terraform are stored in plaintext in state
    and plan files. Anyone with read access to the state backend gets every
    secret without touching Key Vault, and no Key Vault audit event is produced.

    Attack scenario: A developer with Storage Blob Data Reader on the
    Terraform state container downloads terraform.tfstate and extracts
    azurerm_key_vault_secret values and generated passwords.

    Impact: Disclosure of production secrets outside Key Vault access control
    and auditing.

    Severity: High

    Terraform indicators: azurerm_key_vault_secret.value set from
    random_password or variables; state backend storage account without
    private access and strict RBAC; plan artifacts kept in CI.

    References: MCSB v2 IM-8, DS-3, DP-6, DP-7; NIST SP 800-53 Rev. 5 IA-5, SI-4, RA-5, SC-12, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1, OPS.2.2; NIS2 Art. 21(2) (h), (i), (d); MITRE ATT&CK T1552.001.
- id: azure-key-vault-secret-deletion
  name: Key Vault Secret, Key or Vault Deletion
  description: |
    Without soft delete retention and purge protection, an attacker or a
    Terraform destroy can permanently remove keys and secrets. Every dependent
    service breaks, and data encrypted with customer-managed keys becomes
    unrecoverable.

    Attack scenario: An attacker with Key Vault Administrator deletes and
    purges the CMK used by SQL TDE and storage encryption. Alternatively a
    pipeline runs terraform destroy on the wrong workspace.

    Impact: Prolonged outage and potentially irreversible data loss.

    Severity: Critical

    Terraform indicators: purge_protection_enabled = false (default);
    soft_delete_retention_days at minimum (7); provider features block with
    key_vault { purge_soft_delete_on_destroy = true }; no
    azurerm_management_lock.

    References: MCSB v2 DP-8, BR-2, AM-3, PA-7; NIST SP 800-53 Rev. 5 IA-5, SC-12, SC-17, CP-9, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1, CON.3, OPS.2.2; NIS2 Art. 21(2) (h), (i), (c); MITRE ATT&CK T1485, T1490.
- id: azure-key-vault-throttling
  name: Key Vault Service Throttling
  description: |
    Applications call Key Vault on every request instead of caching. Under load,
    or under attacker-generated traffic against the application, vault service
    limits are exceeded and requests are throttled (HTTP 429). Applications
    then fail to obtain credentials.

    Attack scenario: An attacker floods an API endpoint that fetches a secret
    per request. Key Vault throttles the shared vault, and every application
    using it starts failing.

    Impact: Cascading outage across all applications sharing the vault.

    Severity: Medium

    Terraform indicators: many applications referencing one vault; no app-level
    caching configuration; no alerting on ServiceApiResult 429.

    References: MCSB v2 DP-8, PA-7; NIST SP 800-53 Rev. 5 IA-5, SC-12, SC-17, AC-2, AC-3, AC-5; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (h), (i); MITRE ATT&CK T1499.003.
- id: azure-key-vault-missing-audit-logging
  name: Key Vault Missing Audit Logging
  description: |
    AuditEvent logs are not collected, so secret reads, key operations and
    permission changes cannot be attributed or alerted on.

    Attack scenario: An attacker slowly reads secrets over weeks. Without
    AuditEvent logs there is no evidence of which secrets were accessed or by
    which identity.

    Impact: Undetected credential theft; inability to scope secret rotation
    after an incident.

    Severity: Medium

    Terraform indicators: no azurerm_monitor_diagnostic_setting for the vault
    with category "AuditEvent" (or category group "audit").

    References: MCSB v2 LT-3, LT-5, LT-6, LT-1; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4, AU-7; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b).
- id: azure-managed-identity-token-theft
  name: Managed Identity Token Theft via Metadata Endpoint
  description: |
    Any code running on a resource can request access tokens for its managed
    identity from the local token endpoint: IMDS at 169.254.169.254, or
    IDENTITY_ENDPOINT with IDENTITY_HEADER on App Service and Functions.
    Tokens are bearer tokens that work from any location.

    Attack scenario: An attacker exploits SSRF or command injection in a web
    app, requests a token for https://management.azure.com/ or
    https://vault.azure.net, exfiltrates it and uses it from their own
    infrastructure.

    Impact: Attacker acts as the workload identity with all of its RBAC
    permissions.

    Severity: High

    Terraform indicators: identity block on internet-facing compute;
    role assignments on that identity beyond the application's needs;
    no egress filtering on the hosting subnet.

    References: MCSB v2 DS-6, PA-7, NS-1, NS-3; NIST SP 800-53 Rev. 5 CM-2, CM-3, SI-2, SI-7, RA-5, AC-2; BSI IT-Grundschutz OPS.2.2, ORP.4, NET.1.1, NET.3.2; NIS2 Art. 21(2) (d), (i), (a); MITRE ATT&CK T1552.005, T1528.
- id: azure-managed-identity-token-replay
  name: Managed Identity Token Replay After Revocation
  description: |
    Managed identity access tokens are cached and stay valid until they expire,
    which can take up to about 24 hours. They cannot be revoked. Removing a role
    assignment or disabling the identity does not immediately stop a stolen
    token from being used.

    Attack scenario: The SOC detects a compromised workload and removes the
    identity's role assignments. The attacker keeps using an already-issued
    token against data-plane services that evaluate cached authorization.

    Impact: Extended attacker access window during incident response.

    Severity: Medium

    Terraform indicators: data-plane resources reachable on public endpoints
    (public_network_access_enabled = true) so stolen tokens are usable
    off-network.

    References: MCSB v2 NS-2, PA-7; NIST SP 800-53 Rev. 5 SC-7, AC-4, AC-2, AC-3, AC-5, AC-6; BSI IT-Grundschutz NET.1.1, NET.3.2, ORP.4; NIS2 Art. 21(2) (a), (i); MITRE ATT&CK T1550.001.
- id: azure-managed-identity-overprivileged-role
  name: Managed Identity Over-Privileged Role Assignment
  description: |
    The identity is granted broad built-in roles (Owner, Contributor,
    User Access Administrator) or roles at subscription or management-group
    scope. Compromise of the workload then gives control of the whole
    environment.

    Attack scenario: A VM's system-assigned identity has Contributor on the
    subscription "to make deployments easier". An attacker with code execution
    on the VM uses it to run commands on other VMs, read storage keys and
    deploy crypto-mining resources.

    Impact: Full subscription compromise from a single workload.

    Severity: Critical

    Terraform indicators: azurerm_role_assignment with role_definition_name in
    ("Owner", "Contributor", "User Access Administrator",
    "Role Based Access Control Administrator") and scope =
    subscription / management group, principal_id = identity principal.

    References: MCSB v2 PA-7, PV-1, PV-2, DS-6; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, CM-2, CM-6; BSI IT-Grundschutz ORP.4, OPS.2.2, OPS.1.1.3; NIS2 Art. 21(2) (i), (a), (e); MITRE ATT&CK T1078.004.
- id: azure-managed-identity-shared-identity-abuse
  name: Shared User-Assigned Identity Abuse
  description: |
    One user-assigned identity is attached to many resources, or principals
    hold Managed Identity Operator on it. The weakest workload or the operator
    can then use the combined permissions of all consumers.

    Attack scenario: A user with Contributor on a dev resource group and
    Managed Identity Operator on a production identity attaches that identity
    to their own VM and obtains production tokens.

    Impact: Privilege escalation and lateral movement between workloads and
    environments.

    Severity: High

    Terraform indicators: the same azurerm_user_assigned_identity.id
    referenced in identity_ids of many resources across environments;
    "Managed Identity Operator" or "Managed Identity Contributor" assignments.

    References: MCSB v2 IM-3, PA-7, LT-1, IR-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-4, IA-5, IA-9; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1, DER.2.1; NIS2 Art. 21(2) (i), (b); MITRE ATT&CK T1078.004.
- id: azure-managed-identity-federated-credential-abuse
  name: Managed Identity Federated Credential Abuse
  description: |
    A federated identity credential lets an external OIDC issuer (GitHub
    Actions, Kubernetes, another cloud) exchange tokens for the managed
    identity. Overly broad subjects, untrusted issuers or an attacker-added
    credential give persistent passwordless access.

    Attack scenario: An attacker with Managed Identity Contributor adds a
    federated credential trusting their own GitHub repository. Alternatively
    a subject such as "repo:org/app:pull_request" lets any fork pull request
    workflow obtain production tokens.

    Impact: Persistent, credential-less backdoor into Azure; CI/CD supply
    chain compromise.

    Severity: High

    Terraform indicators: azurerm_federated_identity_credential with subject
    not pinned to a protected branch or environment, or with an issuer
    outside the organization's control.

    References: MCSB v2 IM-3, PA-7, LT-1, IR-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-4, IA-5, IA-9; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1, DER.2.1; NIS2 Art. 21(2) (i), (b); MITRE ATT&CK T1098.001.
- id: azure-managed-identity-deletion-outage
  name: Managed Identity or Role Assignment Removal Outage
  description: |
    Deleting a user-assigned identity, detaching it, or removing its role
    assignments breaks dependent workloads. Examples are storage or SQL
    encryption with customer-managed keys, Key Vault references and ACR pulls.

    Attack scenario: An attacker or a Terraform refactor that renames the
    identity resource deletes and recreates it. The new principal ID has no
    role assignments and no Key Vault access, so production fails.

    Impact: Service outage; loss of access to CMK-encrypted data until
    permissions are restored.

    Severity: Medium

    Terraform indicators: azurerm_user_assigned_identity without
    lifecycle { prevent_destroy = true }; resource address changes in plans;
    no azurerm_management_lock.

    References: MCSB v2 AM-3, DS-6, PV-2, LT-1; NIST SP 800-53 Rev. 5 CM-3, CM-4, SA-3, SA-4, CM-2, SI-2; BSI IT-Grundschutz OPS.2.2, OPS.1.1.3, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (a), (d), (e); MITRE ATT&CK T1531.
- id: azure-managed-identity-unattributed-actions
  name: Managed Identity Unattributed Actions
  description: |
    Actions performed with a managed identity show only the identity's
    principal in logs. If managed identity sign-in logs and Activity Logs are
    not retained centrally, malicious use cannot be traced back to the
    compromised workload, source IP or time window.

    Attack scenario: Resources are modified by a user-assigned identity shared
    by five services. Without sign-in logs it is impossible to determine which
    host requested the token.

    Impact: Failed incident investigation; repudiation of malicious actions.

    Severity: Medium

    Terraform indicators: no azurerm_monitor_aad_diagnostic_setting including
    ManagedIdentitySignInLogs; no subscription-level
    azurerm_monitor_diagnostic_setting exporting the Activity Log.

    References: MCSB v2 LT-3, LT-5, LT-6, IM-3; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4, AU-7; BSI IT-Grundschutz OPS.1.1.5, DER.1, ORP.4; NIS2 Art. 21(2) (b), (i).
- id: azure-aks-public-api-server
  name: AKS Public API Server Exposure
  description: |
    The Kubernetes API server is reachable from the internet without
    authorized IP ranges or a private cluster. It is exposed to credential
    attacks, unauthenticated vulnerability exploitation and use of leaked
    kubeconfigs from anywhere.

    Attack scenario: A kubeconfig leaks from a developer laptop. The attacker
    connects to the public API endpoint from their own network and deploys
    privileged workloads.

    Impact: Cluster compromise from outside the corporate network.

    Severity: High

    Terraform indicators: private_cluster_enabled = false and
    api_server_access_profile.authorized_ip_ranges empty or absent.

    References: MCSB v2 NS-2, IM-1, PA-7, IM-6; NIST SP 800-53 Rev. 5 SC-7, AC-4, AC-2, AC-3, AC-6, SC-2; BSI IT-Grundschutz NET.1.1, NET.3.2, ORP.4; NIS2 Art. 21(2) (a), (i), (j); MITRE ATT&CK T1078, T1609.
- id: azure-aks-local-account-abuse
  name: AKS Local Admin Account Abuse
  description: |
    Local Kubernetes accounts are enabled, so the static clusterAdmin
    certificate-based kubeconfig can be downloaded. That bypasses Entra ID,
    MFA and Conditional Access, and it cannot be revoked without rotating
    cluster certificates.

    Attack scenario: A principal with
    Microsoft.ContainerService/managedClusters/listClusterAdminCredential/action
    (e.g. Contributor) runs "az aks get-credentials --admin" and receives a
    non-expiring cluster-admin credential that keeps working after the account
    is disabled.

    Impact: Persistent, unauditable cluster-admin access.

    Severity: High

    Terraform indicators: local_account_disabled = false (default);
    azure_active_directory_role_based_access_control block absent.

    References: MCSB v2 IM-1, PA-7, LT-1, IR-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1, DER.2.1; NIS2 Art. 21(2) (i), (j), (b); MITRE ATT&CK T1078.001.
- id: azure-aks-run-command-abuse
  name: AKS Run Command Abuse via Azure RBAC
  description: |
    AKS Run Command executes kubectl or helm commands inside the cluster
    through the Azure management plane. Principals with Azure-level rights on
    the cluster resource can run commands even when the API server is private.

    Attack scenario: An attacker with Contributor on the resource group runs
    "az aks command invoke" to deploy a pod that mounts the node file system,
    bypassing private-cluster network isolation.

    Impact: Cluster compromise through the management plane; bypass of
    network controls.

    Severity: High

    Terraform indicators: run_command_enabled = true (default); broad
    Contributor assignments on the cluster or resource group.

    References: MCSB v2 PA-7, LT-1, IR-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, SI-4, AU-6; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1, DER.2.1; NIS2 Art. 21(2) (i), (b); MITRE ATT&CK T1651, T1609.
- id: azure-aks-container-escape
  name: AKS Container Escape to Node
  description: |
    Pods run privileged, with hostPath, hostPID/hostNetwork or dangerous
    capabilities, or a kernel/runtime vulnerability exists. An attacker who
    controls a container can break out to the node and access every pod on
    it plus the node's identity.

    Attack scenario: An attacker exploits an RCE in a web container that runs
    privileged, mounts the host filesystem, reads kubelet credentials and
    other pods' service account tokens.

    Impact: Node and potentially cluster compromise; access to kubelet
    identity permissions (e.g. AcrPull on registries).

    Severity: Critical

    Terraform indicators: azure_policy_enabled = false; no Pod Security
    Admission or policy baseline deployed (e.g. via helm_release /
    kubernetes_manifest); microsoft_defender block absent.

    References: MCSB v2 PV-3, PV-4, LT-1, PV-5; NIST SP 800-53 Rev. 5 CM-2, CM-6, SC-28, CM-3, SI-2, SI-4; BSI IT-Grundschutz OPS.2.2, OPS.1.1.3, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (a), (e), (b); MITRE ATT&CK T1611, T1610.
- id: azure-aks-node-identity-abuse
  name: AKS Node and Kubelet Identity Abuse from Pods
  description: |
    Pods can reach the node's IMDS endpoint and obtain tokens for the kubelet
    identity or any identity assigned to the node pool VMSS. This exposes
    cloud permissions intended for the node to every workload.

    Attack scenario: A compromised pod calls
    http://169.254.169.254/metadata/identity/oauth2/token and receives a
    token for the kubelet identity. The identity was given Contributor on the
    node resource group, so the attacker modifies VMSS instances.

    Impact: Escalation from a single pod to Azure resources.

    Severity: High

    Terraform indicators: workload_identity_enabled = false with application
    identities assigned to the node pool; kubelet_identity with roles beyond
    AcrPull; no network policy blocking 169.254.169.254 egress.

    References: MCSB v2 IM-3, NS-1, PA-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-4, IA-5, IA-9; BSI IT-Grundschutz ORP.4, NET.1.1, NET.3.2; NIS2 Art. 21(2) (i), (a); MITRE ATT&CK T1552.005.
- id: azure-aks-kubernetes-rbac-overprivilege
  name: AKS Kubernetes RBAC Over-Privilege
  description: |
    ClusterRoleBindings grant cluster-admin or wildcard verbs, default service
    accounts automount tokens, or Entra admin groups are too broad. A
    compromised pod or user then gets cluster-wide control.

    Attack scenario: A CI service account bound to cluster-admin is used by an
    attacker to create a DaemonSet that runs on every node and harvests
    secrets.

    Impact: Full cluster compromise and access to all Kubernetes secrets.

    Severity: High

    Terraform indicators: admin_group_object_ids containing broad groups;
    kubernetes_cluster_role_binding to "cluster-admin";
    azurerm_role_assignment "Azure Kubernetes Service RBAC Cluster Admin"
    at cluster or higher scope.

    References: MCSB v2 PA-7, IM-1, PA-1, PA-2; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, AC-4, SC-2; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i), (j); MITRE ATT&CK T1098.006, T1078.
- id: azure-aks-flat-pod-network
  name: AKS Unrestricted Pod-to-Pod and Egress Traffic
  description: |
    No network policy engine or policies are configured, so every pod can
    reach every other pod, internal Azure services and the internet. This
    enables lateral movement and exfiltration.

    Attack scenario: A compromised frontend pod connects directly to the
    database pod and internal admin services in other namespaces, then
    exfiltrates data to an external host.

    Impact: Lateral movement across namespaces; data exfiltration.

    Severity: High

    Terraform indicators: network_profile.network_policy absent or "none";
    outbound_type = "loadBalancer" without Azure Firewall / NAT egress
    control.

    References: MCSB v2 NS-1, NS-3; NIST SP 800-53 Rev. 5 SC-7, SC-32, AC-4, CM-7, SI-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1046.
- id: azure-aks-untrusted-image
  name: AKS Untrusted or Malicious Container Image
  description: |
    The cluster pulls images from public or untrusted registries, uses mutable
    tags, or does not verify signatures, so poisoned or vulnerable images
    run in production.

    Attack scenario: A typosquatted public image or a compromised upstream base
    image containing a cryptominer or backdoor is deployed through a Helm
    chart that references docker.io.

    Impact: Malicious code execution in the cluster; supply chain compromise.

    Severity: High

    Terraform indicators: azure_policy_enabled = false; no
    "allowed container registries" policy assignment; images referenced by
    tag rather than digest in kubernetes_* or helm_release resources.

    References: MCSB v2 DS-2, DS-6, LT-1, PV-5; NIST SP 800-53 Rev. 5 SR-3, SR-4, SR-6, SA-12, SA-15, RA-5; BSI IT-Grundschutz OPS.2.2, OPS.1.1.5, DER.1, OPS.1.1.3; NIS2 Art. 21(2) (d), (b), (e); MITRE ATT&CK T1525, T1204.003, T1195.
- id: azure-aks-secrets-exposure
  name: AKS Kubernetes Secrets Exposure
  description: |
    Application credentials are stored as Kubernetes Secrets (base64 in
    etcd), injected as environment variables or committed in manifests.
    Anyone with get/list on secrets, or access to etcd backups, can read them.

    Attack scenario: A user with read access to a namespace runs
    "kubectl get secret -o yaml" and decodes database credentials.

    Impact: Credential disclosure leading to data-store compromise.

    Severity: High

    Terraform indicators: kubernetes_secret resources with literal values in
    Terraform (also stored in state); key_vault_secrets_provider absent;
    key_management_service block absent.

    References: MCSB v2 IM-8, DP-5, PA-7; NIST SP 800-53 Rev. 5 IA-5, SI-4, RA-5, SC-12, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (h), (i); MITRE ATT&CK T1552.007, T1552.001.
- id: azure-aks-missing-audit-logging
  name: AKS Missing Control-Plane Audit Logging
  description: |
    kube-audit / kube-audit-admin and guard logs are not exported, so
    Kubernetes API actions (secret reads, exec into pods, RBAC changes)
    cannot be investigated.

    Attack scenario: An attacker execs into pods and reads secrets. Without
    audit logs the incident team cannot identify affected secrets or the
    initial access vector.

    Impact: Undetected cluster compromise; failed investigation.

    Severity: Medium

    Terraform indicators: no azurerm_monitor_diagnostic_setting on the
    cluster with kube-audit-admin and guard categories; oms_agent and
    microsoft_defender blocks absent.

    References: MCSB v2 LT-3, LT-5, LT-6, LT-1; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4, AU-7; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b).
- id: azure-aks-resource-exhaustion
  name: AKS Resource Exhaustion and Cryptojacking
  description: |
    Without resource requests/limits, namespace quotas and autoscaler bounds,
    one workload can starve the cluster. An attacker who can schedule pods can
    run cryptominers that the autoscaler pays for.

    Attack scenario: An attacker deploys mining pods without limits. The
    cluster autoscaler scales the node pool to max_count, legitimate pods are
    evicted and cloud costs spike.

    Impact: Availability loss, financial damage.

    Severity: Medium

    Terraform indicators: high max_count on node pools with
    auto_scaling_enabled = true; no LimitRange/ResourceQuota manifests;
    no cost or anomaly alerts.

    References: MCSB v2 LT-1, PV-5; NIST SP 800-53 Rev. 5 SI-4, AU-6, RA-3, RA-5; BSI IT-Grundschutz OPS.1.1.5, DER.1, OPS.1.1.3; NIS2 Art. 21(2) (b), (e); MITRE ATT&CK T1496.001.
- id: azure-aks-outdated-components
  name: AKS Outdated Kubernetes Version and Node Images
  description: |
    The cluster runs an unsupported Kubernetes version or unpatched node
    images, exposing known container runtime, kubelet and kernel
    vulnerabilities.

    Attack scenario: An attacker in a pod exploits a public kernel privilege
    escalation that is patched in newer node images, which were never applied.

    Impact: Container escape and node compromise through known CVEs.

    Severity: High

    Terraform indicators: kubernetes_version pinned to an old minor version;
    automatic_upgrade_channel absent or "none"; node_os_upgrade_channel =
    "None" or "Unmanaged"; no maintenance_window.

    References: MCSB v2 PV-6, LT-1, PV-5; NIST SP 800-53 Rev. 5 SI-2, RA-5, SI-4, AU-6, RA-3; BSI IT-Grundschutz OPS.1.1.3, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (e), (b); MITRE ATT&CK T1068.
- id: azure-app-service-missing-authentication
  name: App Service Missing Authentication
  description: |
    The application or its admin/API endpoints are reachable without
    authentication. Built-in App Service Authentication is disabled or set to
    allow anonymous requests, and the app itself does not enforce auth.

    Attack scenario: An internal line-of-business app is deployed with a
    public *.azurewebsites.net hostname and no auth. Anyone who finds the URL
    can use it.

    Impact: Unauthorized access to application functions and data.

    Severity: High

    Terraform indicators: auth_settings_v2 absent or auth_enabled = false;
    unauthenticated_action = "AllowAnonymous" where authentication is
    required.

    References: MCSB v2 IM-1, IM-5, NS-2, IM-6; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, NET.1.1, NET.3.2; NIS2 Art. 21(2) (i), (j), (a); MITRE ATT&CK T1190.
- id: azure-app-service-direct-origin-access
  name: App Service Direct Access Bypassing WAF
  description: |
    The app is published behind Front Door or Application Gateway with WAF, but
    its default hostname stays publicly reachable. Attackers can bypass WAF,
    rate limiting and geo-filtering by calling the origin directly.

    Attack scenario: An attacker resolves the backend
    <app>.azurewebsites.net from TLS certificates or DNS history and sends
    injection payloads directly, bypassing WAF rules.

    Impact: Exploitation of application vulnerabilities that WAF would block;
    loss of edge DDoS protection.

    Severity: High

    Terraform indicators: public_network_access_enabled = true;
    site_config.ip_restriction absent or ip_restriction_default_action =
    "Allow"; no restriction on service tag AzureFrontDoor.Backend with
    X-Azure-FDID header; no private endpoint.

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1190.
- id: azure-app-service-insecure-transport
  name: App Service Insecure Transport
  description: |
    The app accepts HTTP, allows TLS below 1.2, or permits plain FTP.
    Session cookies, credentials and deployment content can be intercepted.

    Attack scenario: Users on public Wi-Fi reach http:// URLs that are not
    redirected. An on-path attacker steals session cookies. FTP deployment
    credentials are captured in cleartext.

    Impact: Session hijacking, credential theft, content tampering.

    Severity: Medium

    Terraform indicators: https_only = false (default); site_config.
    minimum_tls_version / scm_minimum_tls_version < "1.2"; ftps_state =
    "AllAllowed" (default).

    References: MCSB v2 DP-3, NS-8, IM-1, PV-1; NIST SP 800-53 Rev. 5 SC-8, SC-13, IA-5, AC-2, AC-3, AC-4; BSI IT-Grundschutz CON.1, NET.1.1, NET.3.2, ORP.4; NIS2 Art. 21(2) (h), (a), (i); MITRE ATT&CK T1557, T1040.
- id: azure-app-service-publishing-credential-abuse
  name: App Service Basic Auth Publishing Credential Abuse
  description: |
    FTP and WebDeploy/SCM basic authentication publishing credentials are
    enabled. These static credentials (publish profile) bypass Entra ID, MFA
    and Conditional Access and allow code deployment.

    Attack scenario: A publish profile committed to a repository or stored in
    a CI variable leaks. The attacker deploys a web shell through Kudu ZipDeploy
    or FTP.

    Impact: Arbitrary code execution in the app with access to its secrets and
    managed identity.

    Severity: High

    Terraform indicators: ftp_publish_basic_authentication_enabled = true and
    webdeploy_publish_basic_authentication_enabled = true (defaults).

    References: MCSB v2 IM-1, NS-8, IM-8, DS-6; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, NET.1.1, NET.3.2, CON.1; NIS2 Art. 21(2) (i), (j), (a); MITRE ATT&CK T1552.001, T1078.
- id: azure-app-service-kudu-abuse
  name: App Service Kudu (SCM) Console Abuse
  description: |
    The SCM/Kudu site exposes a console, file browser, process explorer and
    environment variables. Principals with Website Contributor or Contributor,
    or anyone who can reach an unrestricted SCM endpoint with valid
    credentials, can run commands as the app.

    Attack scenario: An attacker with Contributor on the resource group opens
    the Kudu debug console, reads environment variables (connection strings,
    IDENTITY_HEADER) and requests managed identity tokens.

    Impact: Code execution and secret disclosure through the management plane.

    Severity: High

    Terraform indicators: site_config.scm_ip_restriction absent with
    scm_use_main_ip_restriction = false; broad Contributor assignments;
    public_network_access_enabled = true.

    References: MCSB v2 NS-2, PA-7, PA-1, PA-2; NIST SP 800-53 Rev. 5 SC-7, AC-4, AC-2, AC-3, AC-5, AC-6; BSI IT-Grundschutz NET.1.1, NET.3.2, ORP.4; NIS2 Art. 21(2) (a), (i); MITRE ATT&CK T1651, T1059.
- id: azure-app-service-secrets-in-app-settings
  name: App Service Plaintext Secrets in App Settings
  description: |
    Database passwords, API keys and storage connection strings are stored as
    plaintext app settings or connection strings. They are visible to anyone
    who can list the site configuration, appear in Terraform state, and are
    exposed to all code in the app.

    Attack scenario: A user with Website Contributor reads the configuration
    in the portal, or a pipeline log prints the Terraform plan containing the
    SQL admin password.

    Impact: Credential disclosure leading to backend data compromise.

    Severity: High

    Terraform indicators: app_settings or connection_string values set from
    variables/random_password instead of "@Microsoft.KeyVault(...)"
    references; key_vault_reference_identity_id not set.

    References: MCSB v2 IM-8, IM-1, IM-3, DS-3; NIST SP 800-53 Rev. 5 IA-5, SI-4, RA-5, SC-12, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1, OPS.2.2; NIS2 Art. 21(2) (h), (i), (j); MITRE ATT&CK T1552.
- id: azure-app-service-subdomain-takeover
  name: App Service Dangling DNS Subdomain Takeover
  description: |
    A custom domain CNAME still points to an App Service default hostname
    after the app is deleted. An attacker can create an app with the same
    name and serve content on the organization's domain.

    Attack scenario: Terraform destroys a marketing app but the DNS record in
    another zone remains. An attacker registers the freed app name, binds the
    domain and hosts a phishing page that can read parent-domain cookies.

    Impact: Phishing on a trusted domain, session cookie theft, reputational
    damage.

    Severity: Medium

    Terraform indicators: azurerm_dns_cname_record managed in a different
    state or pipeline than the web app; record value hard-coded instead of
    referencing the app's default_hostname; no asuid TXT verification record.

    References: MCSB v2 NS-10, LT-1; NIST SP 800-53 Rev. 5 SC-7, SI-4, AU-6; BSI IT-Grundschutz NET.1.1, NET.3.2, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (a), (b).
- id: azure-app-service-insecure-configuration
  name: App Service Outdated Runtime and Debug Features
  description: |
    The app runs an end-of-life language runtime, has remote debugging or
    detailed error pages enabled, or uses outdated frameworks. That increases
    exploitability and leaks internal details.

    Attack scenario: An attacker exploits a known deserialization
    vulnerability in an EOL runtime version, or uses stack traces from
    detailed errors to map internals.

    Impact: Remote code execution or information disclosure.

    Severity: Medium

    Terraform indicators: site_config.remote_debugging_enabled = true;
    application_stack pinned to an EOL version; detailed_error_messages = true
    in logs block.

    References: MCSB v2 PV-1, LT-1, DS-6, PV-2; NIST SP 800-53 Rev. 5 CM-2, CM-6, SI-4, AU-6, CM-3, SI-2; BSI IT-Grundschutz OPS.2.2, OPS.1.1.3, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (a), (e), (b); MITRE ATT&CK T1190.
- id: azure-app-service-vnet-pivot
  name: App Service VNet Integration Lateral Movement
  description: |
    With regional VNet integration and route-all enabled, a compromised app
    can reach internal networks, peered VNets and on-premises systems unless
    egress is filtered.

    Attack scenario: An attacker with code execution in the app scans the
    integration subnet's address space and connects to internal SQL servers
    and management interfaces.

    Impact: Lateral movement from a public-facing app into internal networks.

    Severity: High

    Terraform indicators: virtual_network_subnet_id set with
    vnet_route_all_enabled = true; integration subnet without NSG or
    route table to Azure Firewall.

    References: MCSB v2 NS-1, NS-3; NIST SP 800-53 Rev. 5 SC-7, SC-32, AC-4, CM-7, SI-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1021, T1046.
- id: azure-app-service-denial-of-service
  name: App Service Application Denial of Service
  description: |
    The app runs on a small, non-autoscaling plan without an edge WAF/DDoS
    layer, or shares an App Service Plan with other apps. Application-layer
    floods exhaust workers and affect every app on the plan.

    Attack scenario: An attacker sends HTTP floods against an expensive search
    endpoint. The single-instance plan saturates CPU and co-hosted apps on
    the same plan also go down.

    Impact: Service unavailability for one or several applications.

    Severity: Medium

    Terraform indicators: azurerm_service_plan with worker_count = 1 and no
    azurerm_monitor_autoscale_setting; many web apps referencing one
    service_plan_id; no Front Door / Application Gateway WAF in front.

    References: MCSB v2 NS-6, NS-5, NS-2; NIST SP 800-53 Rev. 5 SC-7, SI-10, SI-11, SC-5, SI-4, AC-4; BSI IT-Grundschutz APP.3.1, NET.1.1, NET.3.2; NIS2 Art. 21(2) (e), (a), (c); MITRE ATT&CK T1499.002, T1499.003.
- id: azure-app-service-missing-logging
  name: App Service Missing Audit and HTTP Logging
  description: |
    HTTP, audit, console and IP security logs are not exported, so
    deployments, Kudu logins and attacks against the app cannot be
    reconstructed.

    Attack scenario: A web shell is deployed and used for weeks. Without
    AppServiceAuditLogs and AppServiceHTTPLogs there is no record of the
    publishing login or of the requests to the shell.

    Impact: Undetected compromise; inability to attribute actions.

    Severity: Medium

    Terraform indicators: no azurerm_monitor_diagnostic_setting on the web app
    with AppServiceHTTPLogs, AppServiceAuditLogs, AppServiceConsoleLogs and
    AppServiceIPSecAuditLogs.

    References: MCSB v2 LT-3, LT-5, LT-6, LT-1; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4, AU-7; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b).
- id: azure-virtual-desktop-weak-user-authentication
  name: AVD Weak User Authentication
  description: |
    Users can sign in to AVD without MFA or device compliance requirements.
    Password spraying or phishing then yields an interactive desktop inside
    the corporate network.

    Attack scenario: An attacker sprays common passwords against Entra ID,
    finds a valid account and launches a full desktop from an unmanaged
    device anywhere in the world.

    Impact: Interactive foothold inside the internal network with user
    privileges and data access.

    Severity: High

    Terraform indicators: no azuread_conditional_access_policy targeting the
    Azure Virtual Desktop / Windows Cloud Login applications with MFA and
    compliant device grant controls.

    References: MCSB v2 IM-6, IM-7, NS-2; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-5, IA-8, IA-11; BSI IT-Grundschutz ORP.4, NET.1.1, NET.3.2; NIS2 Art. 21(2) (i), (j), (a); MITRE ATT&CK T1110.003, T1078.004, T1566.
- id: azure-virtual-desktop-rogue-session-host
  name: AVD Rogue Session Host Registration
  description: |
    Anyone holding a valid host pool registration token can register a VM as
    a session host. Long-lived tokens, tokens in Terraform state or tokens in
    VM extension settings let an attacker add an attacker-controlled host
    that users then connect to.

    Attack scenario: An attacker reads the registration token from Terraform
    state, registers their own VM into the pooled host pool, and captures
    credentials, keystrokes and data of users assigned to it.

    Impact: Credential theft and data interception of AVD users.

    Severity: High

    Terraform indicators:
    azurerm_virtual_desktop_host_pool_registration_info.expiration_date set
    far in the future; token passed in plaintext extension settings rather
    than protected_settings; state backend with broad read access.

    References: MCSB v2 IM-8, DS-3, LT-3, LT-5; NIST SP 800-53 Rev. 5 IA-5, SI-4, RA-5, SC-12, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1, OPS.2.2, OPS.1.1.5; NIS2 Art. 21(2) (h), (i), (d).
- id: azure-virtual-desktop-session-host-exposure
  name: AVD Session Host Direct Network Exposure
  description: |
    AVD uses reverse-connect transport and needs no inbound ports. Session
    hosts with public IPs or NSG rules allowing inbound RDP/SSH are exposed
    to brute force and RDP vulnerability exploitation, bypassing AVD gateway
    authentication and Conditional Access.

    Attack scenario: Session hosts are deployed with public IPs for
    "troubleshooting". Internet scanners find port 3389 and brute force the
    local administrator account.

    Impact: Direct compromise of session hosts and access to all user sessions.

    Severity: High

    Terraform indicators: azurerm_public_ip associated with session host NICs;
    NSG security_rule allowing 3389/22 from "*" or "Internet".

    References: MCSB v2 NS-1, ES-1, LT-1, PV-5; NIST SP 800-53 Rev. 5 SC-7, SC-32, AC-4, CM-7, SI-4, IR-4; BSI IT-Grundschutz NET.1.1, NET.3.2, OPS.1.1.4, OPS.1.1.5; NIS2 Art. 21(2) (a), (g), (b); MITRE ATT&CK T1021, T1110.
- id: azure-virtual-desktop-data-exfiltration-redirection
  name: AVD Data Exfiltration via Device Redirection
  description: |
    RDP properties allow drive, clipboard, printer and USB redirection. Users
    or attackers with session access can move sensitive data from the
    protected environment to unmanaged endpoints, bypassing DLP.

    Attack scenario: An attacker who hijacked a user account maps their local
    drive into the session and copies sensitive files out over the RDP
    channel.

    Impact: Data exfiltration that bypasses network egress controls.

    Severity: Medium

    Terraform indicators: custom_rdp_properties absent (default redirection
    enabled) or containing "drivestoredirect:s:*", "redirectclipboard:i:1",
    "usbdevicestoredirect:s:*".

    References: MCSB v2 IM-6, IM-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-5, IA-8, IA-11; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i), (j); MITRE ATT&CK T1048.
- id: azure-virtual-desktop-profile-and-session-isolation
  name: AVD Cross-User Access on Pooled Hosts
  description: |
    On multi-session pooled hosts, a user who gains local administrator rights
    can access other users' sessions, processes and credentials. Overly broad
    FSLogix share permissions let users read other users' profile containers,
    including browser cookies and tokens.

    Attack scenario: A user escalates to local admin via a vulnerable driver,
    dumps LSASS on the shared host and steals cached credentials of other
    users. Alternatively a user mounts another user's FSLogix VHDX from the
    profile share.

    Impact: Credential theft and lateral movement between users.

    Severity: High

    Terraform indicators: users granted "Virtual Machine Administrator Login"
    on session hosts; FSLogix azurerm_storage_share without per-user NTFS
    ACLs; Storage File Data SMB Share Elevated Contributor granted to all
    users.

    References: MCSB v2 PA-7, ES-1, LT-1, PV-5; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, SI-4, IR-4; BSI IT-Grundschutz ORP.4, OPS.1.1.4, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (i), (g), (b); MITRE ATT&CK T1539.
- id: azure-virtual-desktop-unpatched-session-hosts
  name: AVD Unpatched Session Hosts and Stale Images
  description: |
    Session hosts are built from stale golden images and are not patched
    regularly. Users and attackers can exploit known OS and application
    vulnerabilities on hosts shared by many users.

    Attack scenario: A user opens a malicious document that exploits an
    unpatched Office vulnerability on a pooled host, compromising every
    session on it.

    Impact: Host compromise affecting all concurrent users.

    Severity: High

    Terraform indicators: source_image_reference version pinned to an old
    image; no azurerm_maintenance_configuration or patch_mode =
    "AutomaticByPlatform"; no endpoint protection extension.

    References: MCSB v2 PV-6, ES-1, LT-1, PV-5; NIST SP 800-53 Rev. 5 SI-2, RA-5, SI-4, IR-4, AU-6, RA-3; BSI IT-Grundschutz OPS.1.1.3, OPS.1.1.4, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (e), (g), (b); MITRE ATT&CK T1068, T1204.
- id: azure-virtual-desktop-public-workspace-access
  name: AVD Workspace and Host Pool Public Network Access
  description: |
    Workspace feed discovery and session connections are allowed from any
    public network. Stolen credentials are usable from any location, and
    private-only access cannot be enforced for sensitive environments.

    Attack scenario: An attacker with a phished account (and MFA fatigue
    bypass) subscribes to the workspace feed from abroad and connects to the
    desktop.

    Impact: Increased exposure of desktops to credential-based attacks.

    Severity: Medium

    Terraform indicators: azurerm_virtual_desktop_workspace.
    public_network_access_enabled = true and azurerm_virtual_desktop_host_pool.
    public_network_access = "Enabled" for environments that should be private;
    no azurerm_private_endpoint for the workspace/host pool.

    References: MCSB v2 NS-2, IM-6, IM-7; NIST SP 800-53 Rev. 5 SC-7, AC-4, AC-2, AC-3, IA-2, IA-5; BSI IT-Grundschutz NET.1.1, NET.3.2, ORP.4; NIS2 Art. 21(2) (a), (i), (j); MITRE ATT&CK T1078.004.
- id: azure-virtual-desktop-overprivileged-assignments
  name: AVD Over-Privileged Application Group and Host Assignments
  description: |
    Application groups are assigned to broad groups, users get full desktops
    where RemoteApps would suffice, and users receive local admin rights on
    session hosts.

    Attack scenario: "All Users" is assigned to a desktop application group on
    a host pool that has finance applications installed. Any compromised
    account can launch a desktop with access to finance data.

    Impact: Unnecessary access to sensitive applications and hosts;
    privilege escalation on hosts.

    Severity: Medium

    Terraform indicators: azurerm_role_assignment "Desktop Virtualization User"
    to large groups; type = "Desktop" application groups where "RemoteApp"
    suffices; "Virtual Machine Administrator Login" granted broadly.

    References: MCSB v2 PA-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1078.004.
- id: azure-virtual-desktop-capacity-exhaustion
  name: AVD Session Capacity Exhaustion
  description: |
    Host pools without scaling plans or with low session limits can be
    exhausted by a compromised account or a burst of logons, blocking
    legitimate users. Start VM on Connect with high limits can also be
    abused to drive up cost.

    Attack scenario: An attacker using several compromised accounts opens
    sessions on every host in a small pool, denying service during business
    hours.

    Impact: Users cannot work; productivity loss.

    Severity: Low

    Terraform indicators: no azurerm_virtual_desktop_scaling_plan;
    maximum_sessions_allowed unsuitable for host size; no session time limits.

    References: MCSB v2 IM-6, IM-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-5, IA-8, IA-11; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i), (j); MITRE ATT&CK T1499.
- id: azure-virtual-desktop-missing-diagnostics
  name: AVD Missing Connection and Management Diagnostics
  description: |
    Connection, checkpoint, error and management events are not exported, so
    it cannot be determined who connected from where and when, or who changed
    host pool configuration.

    Attack scenario: After a data leak, investigators need the client IPs and
    times of AVD sessions for a user, but no WVDConnections logs exist.

    Impact: Failed investigation; repudiation of user and admin actions.

    Severity: Medium

    Terraform indicators: no azurerm_monitor_diagnostic_setting on host pool
    and workspace with Checkpoint, Error, Management, Connection,
    HostRegistration and AgentHealthStatus categories.

    References: MCSB v2 LT-3, LT-5, LT-6; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4, AU-7; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b).
- id: azure-vnet-peering-lateral-movement
  name: VNet Peering Lateral Movement
  description: |
    VNet peerings connect networks of different trust levels (dev to prod,
    partner or other-tenant VNets) without traffic passing through a firewall.
    Peering is non-transitive, but gateway transit and forwarded traffic
    settings can extend reach.

    Attack scenario: An attacker compromises a VM in a development spoke that
    is directly peered with the production spoke. They reach production
    databases because peering creates direct routes and NSGs allow the
    VirtualNetwork service tag.

    Impact: Lateral movement across environments; breach of segmentation.

    Severity: High

    Terraform indicators: azurerm_virtual_network_peering between spokes
    (spoke-to-spoke) instead of via hub firewall; allow_forwarded_traffic =
    true and allow_gateway_transit = true without need; remote_virtual_network_id
    in another subscription or tenant.

    References: MCSB v2 NS-1, NS-3; NIST SP 800-53 Rev. 5 SC-7, SC-32, AC-4, CM-7, SI-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1021.
- id: azure-vnet-unauthorized-network-modification
  name: VNet Unauthorized Network Modification
  description: |
    Principals with Network Contributor or Contributor can add peerings,
    subnets, gateways or address spaces, creating unmonitored paths into or
    out of the network.

    Attack scenario: An attacker holding Network Contributor on the production
    VNet creates a peering to a VNet in their own tenant. With matching
    permissions on both sides, they get direct private connectivity to
    production workloads.

    Impact: Persistent covert network access; bypass of perimeter controls.

    Severity: High

    Terraform indicators: Network Contributor / Contributor assigned broadly;
    no azurerm_management_lock on hub networks; network changes made outside
    Terraform (drift) not detected.

    References: MCSB v2 PA-7, LT-1, IR-3, AM-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, SI-4, AU-6; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1, DER.2.1; NIS2 Art. 21(2) (i), (b), (a); MITRE ATT&CK T1078.004.
- id: azure-vnet-dns-exfiltration
  name: VNet DNS Tunneling Exfiltration
  description: |
    Workloads in otherwise isolated VNets can resolve arbitrary public domains
    through Azure-provided DNS (168.63.129.16) or custom DNS forwarders. DNS
    queries to attacker-controlled domains carry encoded data out of the
    network even when all other egress is blocked.

    Attack scenario: Malware on a VM in a no-internet subnet encodes database
    records into subdomain labels of an attacker domain. The queries are
    resolved recursively and the attacker reads them on their authoritative
    server.

    Impact: Covert data exfiltration and command-and-control from isolated
    networks.

    Severity: Medium

    Terraform indicators: no azurerm_dns_resolver_* / DNS security policy;
    Azure Firewall DNS proxy not enforced (dns_servers on the VNet not pointing
    to the firewall); no DNS query logging.

    References: MCSB v2 NS-10, NS-1, NS-3; NIST SP 800-53 Rev. 5 SC-7, SI-4, SC-32, AC-4, CM-7; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1048, T1071.
- id: azure-vnet-custom-dns-hijack
  name: VNet Custom DNS Server Hijack
  description: |
    The VNet uses custom DNS servers (domain controllers or DNS VMs). Anyone
    who compromises those servers, or changes the VNet dns_servers setting,
    controls name resolution for all workloads. That includes privatelink
    names for PaaS services.

    Attack scenario: An attacker who gained admin on a DNS VM adds a record
    for the storage account's privatelink name pointing to an attacker host,
    intercepting traffic and credentials.

    Impact: Man-in-the-middle of internal and PaaS traffic; credential theft.

    Severity: High

    Terraform indicators: azurerm_virtual_network.dns_servers pointing to
    IaaS DNS VMs; broad rights to modify the VNet; DNS VMs not in a tier-0
    management zone.

    References: MCSB v2 NS-10, PA-7, LT-1, IR-3; NIST SP 800-53 Rev. 5 SC-7, SI-4, AC-2, AC-3, AC-5, AC-6; BSI IT-Grundschutz NET.1.1, NET.3.2, ORP.4, OPS.1.1.5; NIS2 Art. 21(2) (a), (i), (b); MITRE ATT&CK T1557.
- id: azure-vnet-ddos
  name: VNet Public Endpoint Volumetric DDoS
  description: |
    Public IPs in the VNet (load balancers, gateways, VMs) are covered only by
    basic infrastructure DDoS protection, with no adaptive tuning, telemetry or
    cost protection.

    Attack scenario: A volumetric UDP reflection attack saturates the public
    IP of the internet-facing load balancer, making the application
    unavailable.

    Impact: Service outage; scale-out cost spikes.

    Severity: Medium

    Terraform indicators: azurerm_virtual_network without ddos_protection_plan
    (or public IPs without DDoS IP Protection) for internet-facing workloads.

    References: MCSB v2 NS-5, NS-6; NIST SP 800-53 Rev. 5 SC-5, SI-4, SC-7, SI-10, SI-11; BSI IT-Grundschutz NET.1.1, NET.3.2, APP.3.1; NIS2 Art. 21(2) (c), (a), (e); MITRE ATT&CK T1498.
- id: azure-vnet-missing-flow-logs
  name: VNet and NSG Missing Flow Logs
  description: |
    VNet flow logs (or legacy NSG flow logs) and traffic analytics are not
    enabled, so network connections cannot be reconstructed after an
    incident.

    Attack scenario: After a compromise, investigators cannot determine which
    internal hosts the attacker connected to or how much data left the
    network.

    Impact: Failed scoping of incidents; repudiation of network activity.

    Severity: Medium

    Terraform indicators: no azurerm_network_watcher_flow_log targeting the
    VNet (target_resource_id) or NSGs; traffic_analytics block absent.

    References: MCSB v2 LT-4, LT-3, LT-5, LT-6; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4, AU-7; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b).
- id: azure-subnet-missing-nsg
  name: Subnet Without Network Security Group
  description: |
    The subnet has no NSG association, so all traffic from the VNet, peered
    VNets and on-premises reaches every host in it on any port.

    Attack scenario: An attacker on a compromised workstation connected via
    VPN scans the subnet and reaches unprotected management ports and
    databases.

    Impact: Unrestricted lateral movement; exposure of internal services.

    Severity: High

    Terraform indicators: azurerm_subnet without a corresponding
    azurerm_subnet_network_security_group_association.

    References: MCSB v2 NS-1, PV-1, PV-2, DS-6; NIST SP 800-53 Rev. 5 SC-7, SC-32, AC-4, CM-7, CM-2, CM-6; BSI IT-Grundschutz NET.1.1, NET.3.2, OPS.2.2, OPS.1.1.3; NIS2 Art. 21(2) (a), (e), (d); MITRE ATT&CK T1046, T1021.
- id: azure-subnet-default-outbound-access
  name: Subnet Default Outbound Internet Access
  description: |
    VMs without an explicit outbound method use implicit default outbound
    access with Microsoft-owned public IPs. Traffic leaves without passing
    through firewall inspection.

    Attack scenario: Malware on a VM in a subnet assumed to be private
    connects to attacker infrastructure through default outbound access,
    bypassing the hub firewall.

    Impact: Data exfiltration and C2 bypassing egress controls.

    Severity: Medium

    Terraform indicators: default_outbound_access_enabled = true (default in
    older API versions); no route table with 0.0.0.0/0 to the firewall and no
    NAT gateway.

    References: MCSB v2 NS-1, NS-3; NIST SP 800-53 Rev. 5 SC-7, SC-32, AC-4, CM-7, SI-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1048, T1567.
- id: azure-subnet-route-manipulation
  name: Subnet Route Manipulation and Firewall Bypass
  description: |
    Missing or incorrect user-defined routes, BGP route propagation, or
    attacker-modified routes let traffic bypass the firewall or send it
    through an attacker-controlled appliance.

    Attack scenario: An attacker with Network Contributor adds a route sending
    database subnet traffic to a VM they control, capturing credentials in
    transit. Alternatively a missing UDR leaves a new subnet routing directly
    to the internet.

    Impact: Traffic interception, uninspected egress, data exfiltration.

    Severity: High

    Terraform indicators: azurerm_subnet without
    azurerm_subnet_route_table_association; bgp_route_propagation_enabled =
    true on spoke route tables; next_hop_in_ip_address pointing to unmanaged
    VMs.

    References: MCSB v2 NS-1, NS-3, PA-7, LT-1; NIST SP 800-53 Rev. 5 SC-7, SC-32, AC-4, CM-7, SI-4, AC-2; BSI IT-Grundschutz NET.1.1, NET.3.2, ORP.4, OPS.1.1.5; NIS2 Art. 21(2) (a), (i), (b); MITRE ATT&CK T1557.
- id: azure-subnet-service-endpoint-exfiltration
  name: Subnet Service Endpoint Data Exfiltration
  description: |
    Service endpoints (e.g. Microsoft.Storage) send traffic to the service
    over the Azure backbone with the subnet identity. Without service endpoint
    policies, workloads can reach any storage account in Azure, including
    attacker-owned accounts in other tenants, bypassing firewall FQDN filtering.

    Attack scenario: Compromised code uploads data to
    attackeraccount.blob.core.windows.net. The firewall never sees the traffic
    because the service endpoint route takes precedence.

    Impact: Data exfiltration to foreign tenants.

    Severity: Medium

    Terraform indicators: service_endpoints = ["Microsoft.Storage", ...] on
    the subnet without service_endpoint_policy_ids.

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1537.
- id: azure-subnet-address-exhaustion
  name: Subnet IP Address Exhaustion
  description: |
    Undersized subnets prevent scale-out of AKS nodes and pods, App Service
    integration instances, private endpoints or VMSS. Azure also reserves five
    addresses per subnet.

    Attack scenario: During a traffic spike the AKS cluster autoscaler cannot
    add nodes because the subnet has no free IPs, and the application
    degrades.

    Impact: Availability loss under load or during upgrades.

    Severity: Low

    Terraform indicators: small address_prefixes (e.g. /27) for AKS with Azure
    CNI, VMSS or VNet integration subnets.

    References: .
- id: azure-nsg-permissive-inbound
  name: NSG Overly Permissive Inbound Rules
  description: |
    Inbound rules allow management or data ports (22, 3389, 1433, 3306, 5432,
    6379, 9200) from Any or Internet, or allow broad port ranges.

    Attack scenario: Internet scanners discover RDP on a VM within minutes and
    start password spraying. Another rule exposes Redis without
    authentication.

    Impact: Brute-force compromise, exploitation of exposed services.

    Severity: High

    Terraform indicators: security_rule with direction = "Inbound", access =
    "Allow", source_address_prefix = "*" / "Internet" / "0.0.0.0/0" and
    destination_port_range = "*" / "22" / "3389".

    References: MCSB v2 NS-1, PA-2, PA-6, PV-1; NIST SP 800-53 Rev. 5 SC-7, SC-32, AC-4, CM-7, AC-2, AC-5; BSI IT-Grundschutz NET.1.1, NET.3.2, ORP.4, OPS.2.2; NIS2 Art. 21(2) (a), (i), (e); MITRE ATT&CK T1190, T1021, T1110.
- id: azure-nsg-broad-service-tag
  name: NSG Broad Service Tag Trust
  description: |
    Rules trust service tags such as AzureCloud or large regional tags. These
    cover IP ranges used by all Azure customers, so any tenant's resources
    can connect.

    Attack scenario: An NSG allows AzureCloud on port 443 to an internal API
    "for Azure services". An attacker deploys a free VM in Azure and reaches
    the API directly.

    Impact: Exposure to the multi-tenant Azure address space; false sense of
    restriction.

    Severity: Medium

    Terraform indicators: source_address_prefix = "AzureCloud" (or
    "AzureCloud.<region>") in allow rules.

    References: MCSB v2 NS-1, NS-2, DS-6, PV-2; NIST SP 800-53 Rev. 5 SC-7, SC-32, AC-4, CM-7, CM-2, CM-3; BSI IT-Grundschutz NET.1.1, NET.3.2, OPS.2.2, OPS.1.1.3; NIS2 Art. 21(2) (a), (d), (e); MITRE ATT&CK T1190.
- id: azure-nsg-unrestricted-outbound
  name: NSG Unrestricted Outbound Traffic
  description: |
    The default AllowInternetOutBound rule is not overridden, so every host can
    initiate connections to any internet destination.

    Attack scenario: A compromised VM downloads tooling and exfiltrates data
    over HTTPS to attacker infrastructure.

    Impact: Exfiltration and C2 channels.

    Severity: Medium

    Terraform indicators: no outbound Deny rule for Internet at low priority;
    no UDR to a firewall.

    References: MCSB v2 NS-1, NS-3; NIST SP 800-53 Rev. 5 SC-7, SC-32, AC-4, CM-7, SI-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1048, T1567.
- id: azure-nsg-rule-tampering
  name: NSG Rule Tampering
  description: |
    Principals with network write permissions insert high-priority allow rules
    or delete deny rules to open access paths for an attack.

    Attack scenario: An attacker with Network Contributor adds a priority 100
    rule allowing 3389 from their IP to a jump host, then removes it after use.

    Impact: Temporary or persistent exposure; defense evasion.

    Severity: High

    Terraform indicators: broad Network Contributor assignments; no
    Activity Log alert on securityRules/write; NSG changes outside Terraform.

    References: MCSB v2 PA-7, LT-1, IR-3, PV-1; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, SI-4, AU-6; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1, DER.2.1; NIS2 Art. 21(2) (i), (b), (a); MITRE ATT&CK T1686.001.
- id: azure-nsg-terraform-rule-drift
  name: NSG Terraform Rule Conflicts and Drift
  description: |
    Mixing inline security_rule blocks with standalone
    azurerm_network_security_rule resources makes Terraform remove or re-add
    rules on each apply. Manual hotfixes in the portal go unnoticed until
    overwritten, or persist unreviewed.

    Attack scenario: A temporary portal rule allowing 0.0.0.0/0 to SSH is never
    reflected in code and stays open. Alternatively a deny rule silently
    disappears on the next apply because of the inline/standalone conflict.

    Impact: Unintended exposure or loss of intended restrictions.

    Severity: Medium

    Terraform indicators: azurerm_network_security_group with inline
    security_rule plus azurerm_network_security_rule targeting the same NSG;
    no drift detection in pipelines.

    References: MCSB v2 PV-2, DS-6; NIST SP 800-53 Rev. 5 CM-2, CM-3, CM-6, CM-7, SI-2, SI-7; BSI IT-Grundschutz OPS.2.2, OPS.1.1.3; NIS2 Art. 21(2) (a), (e), (d).
- id: azure-firewall-permissive-rules
  name: Azure Firewall Overly Permissive Rules
  description: |
    Application rules allow wildcard FQDNs (e.g. *.blob.core.windows.net,
    *.azurewebsites.net) or network rules allow any destination. Attackers
    can then exfiltrate to resources they own under the same shared domains.

    Attack scenario: Egress allows *.blob.core.windows.net for backups. Malware
    uploads data to attackerstorage.blob.core.windows.net, which matches the
    rule.

    Impact: Exfiltration through shared multi-tenant cloud domains.

    Severity: High

    Terraform indicators: destination_fqdns with "*" or
    "*.blob.core.windows.net"; network rules with destination_addresses = ["*"];
    source_addresses = ["*"].

    References: MCSB v2 NS-3, NS-4; NIST SP 800-53 Rev. 5 SC-7, AC-4, SI-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1567.002, T1537.
- id: azure-firewall-threat-detection-disabled
  name: Azure Firewall Threat Intelligence and IDPS Disabled
  description: |
    Threat intelligence filtering is off or alert-only, and IDPS and TLS
    inspection are not used, so known malicious destinations and C2 patterns
    are not blocked.

    Attack scenario: Malware beacons to a known C2 domain listed in the
    Microsoft threat intelligence feed. Because the mode is Off, the traffic
    is allowed.

    Impact: Undetected command-and-control and malware delivery.

    Severity: Medium

    Terraform indicators: threat_intelligence_mode = "Off" or "Alert"; sku_tier
    = "Standard" (no IDPS) or intrusion_detection.mode = "Off".

    References: MCSB v2 NS-4; NIST SP 800-53 Rev. 5 SI-4, SC-7; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1071.
- id: azure-firewall-dnat-exposure
  name: Azure Firewall DNAT Exposure of Internal Services
  description: |
    DNAT rules publish internal RDP, SSH or database ports to the internet
    through the firewall's public IP.

    Attack scenario: A DNAT rule maps public port 50000 to an internal server
    on 3389 for a vendor. Attackers scan it and brute-force the account.

    Impact: Direct compromise of internal hosts.

    Severity: High

    Terraform indicators: nat_rule_collection with source_addresses = ["*"]
    and translated_port 22/3389/1433.

    References: MCSB v2 NS-3, PA-2, PA-6; NIST SP 800-53 Rev. 5 SC-7, AC-4, SI-4, AC-2, AC-5, AC-6; BSI IT-Grundschutz NET.1.1, NET.3.2, ORP.4; NIS2 Art. 21(2) (a), (i); MITRE ATT&CK T1021, T1110.
- id: azure-firewall-policy-tampering
  name: Azure Firewall Policy Tampering
  description: |
    Principals with write access to the firewall policy add allow rules,
    disable threat intelligence or remove the firewall to open egress for
    exfiltration.

    Attack scenario: An attacker with Contributor on the hub resource group
    adds an application rule allowing their domain and exfiltrates data.

    Impact: Removal of central egress control.

    Severity: High

    Terraform indicators: Contributor / Network Contributor on the hub;
    no azurerm_management_lock on the firewall and policy; no alerts on
    firewallPolicies/ruleCollectionGroups/write.

    References: MCSB v2 PA-7, LT-1, IR-3, AM-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, SI-4, AU-6; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1, DER.2.1; NIS2 Art. 21(2) (i), (b), (a); MITRE ATT&CK T1686.001.
- id: azure-firewall-snat-exhaustion
  name: Azure Firewall SNAT Port Exhaustion
  description: |
    Too few public IPs for outbound SNAT, or no NAT gateway, cause SNAT port
    exhaustion under high outbound connection counts. Outbound connections
    then fail for all spokes.

    Attack scenario: A compromised workload opens massive numbers of outbound
    connections, exhausting SNAT ports and breaking egress for every other
    workload.

    Impact: Hub-wide outbound connectivity outage.

    Severity: Medium

    Terraform indicators: a single ip_configuration / public IP on the
    firewall; no azurerm_nat_gateway associated with AzureFirewallSubnet.

    References: MITRE ATT&CK T1499.
- id: azure-firewall-missing-logs
  name: Azure Firewall Missing Logs
  description: |
    Network, application, DNS, threat intelligence and IDPS logs are not
    collected, so blocked and allowed connections cannot be investigated.

    Attack scenario: After data theft, the team cannot prove which
    destination received data because firewall logs were never enabled.

    Impact: Failed investigation; no egress audit trail.

    Severity: Medium

    Terraform indicators: no azurerm_monitor_diagnostic_setting on the
    firewall with log_analytics_destination_type = "Dedicated" and
    AZFWNetworkRule, AZFWApplicationRule, AZFWThreatIntel, AZFWIdpsSignature,
    AZFWDnsQuery categories.

    References: MCSB v2 LT-3, LT-5, LT-6; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4, AU-7; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b).
- id: azure-application-gateway-waf-ineffective
  name: Application Gateway WAF Disabled or Detection Only
  description: |
    WAF is not enabled, runs in Detection mode, uses an outdated rule set or
    has broad exclusions. Injection and other OWASP attacks then reach the
    backend.

    Attack scenario: An attacker sends SQL injection payloads. The WAF logs
    them in Detection mode but forwards them, and the backend is exploited.

    Impact: Application compromise through common web attacks.

    Severity: High

    Terraform indicators: sku tier "Standard_v2" instead of "WAF_v2";
    waf_configuration.firewall_mode or policy_settings.mode = "Detection";
    old rule_set_version; broad exclusions.

    References: MCSB v2 NS-6, NS-5, PV-1, PV-2; NIST SP 800-53 Rev. 5 SC-7, SI-10, SI-11, SC-5, SI-4, CM-2; BSI IT-Grundschutz APP.3.1, NET.1.1, NET.3.2, OPS.2.2; NIS2 Art. 21(2) (e), (a), (c); MITRE ATT&CK T1190.
- id: azure-application-gateway-weak-tls
  name: Application Gateway Weak TLS Policy
  description: |
    The listener uses a predefined TLS policy that allows TLS 1.0/1.1 or weak
    cipher suites.

    Attack scenario: Clients are downgraded to TLS 1.0 with CBC ciphers,
    enabling known protocol attacks against session cookies.

    Impact: Disclosure or tampering of traffic in transit.

    Severity: Medium

    Terraform indicators: ssl_policy absent (older default) or policy_name =
    "AppGwSslPolicy20150501"/"AppGwSslPolicy20170401";
    min_protocol_version below "TLSv1_2".

    References: MCSB v2 DP-3, NS-8; NIST SP 800-53 Rev. 5 SC-8, SC-13, IA-5; BSI IT-Grundschutz CON.1, NET.1.1, NET.3.2; NIS2 Art. 21(2) (h), (a); MITRE ATT&CK T1557.
- id: azure-application-gateway-unencrypted-backend
  name: Application Gateway Unencrypted Backend Traffic
  description: |
    TLS terminates at the gateway and traffic to backends is plain HTTP, or
    HTTPS without certificate validation. Data travels unprotected inside the
    network.

    Attack scenario: An attacker with a foothold in the backend subnet
    captures HTTP traffic, including session tokens and PII.

    Impact: Disclosure of sensitive data and credentials inside the VNet.

    Severity: Medium

    Terraform indicators: backend_http_settings.protocol = "Http"; no
    trusted_root_certificate_names for private CAs.

    References: MCSB v2 DP-3; NIST SP 800-53 Rev. 5 SC-8; BSI IT-Grundschutz CON.1; NIS2 Art. 21(2) (h); MITRE ATT&CK T1040.
- id: azure-application-gateway-certificate-exposure
  name: Application Gateway TLS Private Key Exposure
  description: |
    TLS certificates are uploaded as PFX data with a password in Terraform.
    The private key and password then sit in state, variables and CI logs.

    Attack scenario: An attacker with read access to the Terraform state
    extracts the wildcard certificate and impersonates the company's domains.

    Impact: Domain impersonation and traffic interception.

    Severity: High

    Terraform indicators: ssl_certificate { data = filebase64(...),
    password = var... } instead of key_vault_secret_id.

    References: MCSB v2 DP-7, DS-3, IM-8; NIST SP 800-53 Rev. 5 IA-5, SC-12, SC-17, AC-2, AC-3, AC-6; BSI IT-Grundschutz CON.1, OPS.2.2, ORP.4; NIS2 Art. 21(2) (h), (d), (i); MITRE ATT&CK T1552.001, T1649.
- id: azure-application-gateway-header-spoofing
  name: Application Gateway Client Header Spoofing
  description: |
    Backends trust client-supplied headers such as X-Forwarded-For,
    X-Original-Host or custom identity headers for IP allowlisting, auditing
    or authentication. The gateway appends to these headers rather than
    sanitizing them.

    Attack scenario: An attacker sends "X-Forwarded-For: 10.0.0.5". The
    backend uses the first value as the client IP and grants admin access
    reserved for internal addresses.

    Impact: Authorization bypass; falsified audit trails.

    Severity: Medium

    Terraform indicators: no rewrite_rule_set overwriting forwarded headers;
    backend app settings relying on X-Forwarded-For for authorization.

    References: .
- id: azure-application-gateway-ddos
  name: Application Gateway Layer 7 and Volumetric DoS
  description: |
    Without rate limiting rules, autoscale headroom and DDoS protection on its
    public IP, the gateway or its backends can be overwhelmed by HTTP floods.

    Attack scenario: A botnet floods an expensive endpoint. The gateway
    reaches max_capacity and legitimate requests time out.

    Impact: Application unavailability.

    Severity: Medium

    Terraform indicators: no custom_rules of rule_type "RateLimitRule";
    autoscale_configuration.max_capacity low; public IP without DDoS
    protection.

    References: MCSB v2 NS-6, NS-5; NIST SP 800-53 Rev. 5 SC-7, SI-10, SI-11, SC-5, SI-4; BSI IT-Grundschutz APP.3.1, NET.1.1, NET.3.2; NIS2 Art. 21(2) (e), (a), (c); MITRE ATT&CK T1498, T1499.002.
- id: azure-application-gateway-missing-logs
  name: Application Gateway Missing Access and WAF Logs
  description: |
    Access, performance and firewall logs are not collected, so attacks and
    WAF decisions cannot be analyzed.

    Attack scenario: A WAF false negative lets an exploit through. Without
    access logs the request cannot be found.

    Impact: Failed detection and investigation.

    Severity: Medium

    Terraform indicators: no azurerm_monitor_diagnostic_setting with
    ApplicationGatewayAccessLog and ApplicationGatewayFirewallLog.

    References: MCSB v2 LT-3, LT-5, LT-6; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4, AU-7; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b).
- id: azure-private-endpoint-exfiltration-to-foreign-resource
  name: Private Endpoint to Foreign Tenant Resource
  description: |
    Users with rights to create private endpoints in a corporate VNet can
    connect to PaaS resources in any tenant, including an attacker's storage
    account. Traffic goes over Private Link and bypasses firewall FQDN rules.

    Attack scenario: An insider creates a private endpoint in the data subnet
    to their personal storage account (approving it on their side) and copies
    data over the private path.

    Impact: Data exfiltration invisible to egress controls.

    Severity: High

    Terraform indicators: azurerm_private_endpoint with
    private_connection_resource_id outside the organization's subscriptions;
    no Azure Policy restricting private endpoint targets.

    References: MCSB v2 NS-2, PA-7; NIST SP 800-53 Rev. 5 SC-7, AC-4, AC-2, AC-3, AC-5, AC-6; BSI IT-Grundschutz NET.1.1, NET.3.2, ORP.4; NIS2 Art. 21(2) (a), (i); MITRE ATT&CK T1537.
- id: azure-private-endpoint-unreviewed-inbound-connection
  name: Private Endpoint Unreviewed Inbound Connection Approval
  description: |
    Connection requests from other tenants to your PaaS resources are
    auto-approved or approved without review. External networks then get a
    private path to your resource.

    Attack scenario: An attacker creates a private endpoint in their own
    tenant targeting your storage account. An operator approves the pending
    request believing it is internal, and the attacker can then use leaked
    credentials over a path that bypasses your firewall restrictions.

    Impact: Unexpected private exposure of resources to foreign networks.

    Severity: Medium

    Terraform indicators: no process or alert for
    privateEndpointConnections/approve operations; resource firewall rules
    relying only on private endpoint presence.

    References: MCSB v2 NS-2, LT-1, IR-3; NIST SP 800-53 Rev. 5 SC-7, AC-4, SI-4, AU-6, IR-4, IR-5; BSI IT-Grundschutz NET.1.1, NET.3.2, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (a), (b).
- id: azure-private-endpoint-network-policies-disabled
  name: Private Endpoint Network Policies Disabled
  description: |
    With private endpoint network policies disabled on the subnet, NSGs and
    UDRs do not apply to private endpoint traffic. Any host in the VNet, or in
    peered VNets, can reach the endpoint.

    Attack scenario: A compromised VM in an unrelated spoke reaches the SQL
    private endpoint directly because the NSG intended to restrict access is
    not evaluated.

    Impact: Loss of segmentation for PaaS data stores.

    Severity: Medium

    Terraform indicators: azurerm_subnet.private_endpoint_network_policies =
    "Disabled" (default).

    References: MCSB v2 NS-1; NIST SP 800-53 Rev. 5 SC-7, SC-32, AC-4, CM-7; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a).
- id: azure-private-endpoint-public-access-retained
  name: Private Endpoint With Public Access Still Enabled
  description: |
    A private endpoint is added but the target resource keeps its public
    endpoint enabled. That gives a false sense of isolation, and the resource
    stays reachable from the internet.

    Attack scenario: A Key Vault has a private endpoint but
    public_network_access_enabled remains true, so a stolen token works from
    anywhere.

    Impact: Exposure that architecture diagrams and reviews do not show.

    Severity: High

    Terraform indicators: azurerm_private_endpoint present while the target
    resource has public_network_access_enabled = true.

    References: MCSB v2 NS-2, PV-1, PV-2, DS-6; NIST SP 800-53 Rev. 5 SC-7, AC-4, CM-2, CM-6, CM-3, CM-7; BSI IT-Grundschutz NET.1.1, NET.3.2, OPS.2.2, OPS.1.1.3; NIS2 Art. 21(2) (a), (e), (d).
- id: azure-private-endpoint-dns-misconfiguration
  name: Private Endpoint DNS Misconfiguration
  description: |
    The privatelink DNS zone is missing, not linked to the consuming VNet, or
    duplicated across spokes. Clients resolve the public IP and either fail
    (when public access is disabled) or silently traverse the public
    endpoint.

    Attack scenario: A new spoke is deployed without a link to the hub
    privatelink.vaultcore.azure.net zone. Applications fail to reach Key Vault
    and an engineer "fixes" it by enabling public access.

    Impact: Outages and erosion of private-only access.

    Severity: Medium

    Terraform indicators: azurerm_private_endpoint without
    private_dns_zone_group; azurerm_private_dns_zone duplicated per spoke;
    missing azurerm_private_dns_zone_virtual_network_link.

    References: MCSB v2 NS-10, DS-6, PV-2; NIST SP 800-53 Rev. 5 SC-7, SI-4, CM-2, CM-3, SI-2, SI-7; BSI IT-Grundschutz NET.1.1, NET.3.2, OPS.2.2, OPS.1.1.3; NIS2 Art. 21(2) (a), (d), (e).
- id: azure-private-dns-zone-record-tampering
  name: Private DNS Zone Record Tampering
  description: |
    Principals with Private DNS Zone Contributor or Contributor modify A or
    CNAME records in privatelink or internal zones, redirecting clients to
    attacker-controlled IPs.

    Attack scenario: An attacker changes the A record for
    mydb.privatelink.database.windows.net to a VM they control, which proxies
    connections and captures SQL logins.

    Impact: Man-in-the-middle of internal and PaaS traffic.

    Severity: High

    Terraform indicators: broad Private DNS Zone Contributor / Network
    Contributor assignments on hub DNS zones; no management lock; no alerts
    on privateDnsZones/*/write.

    References: MCSB v2 PA-7, LT-1, IR-3, AM-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, SI-4, AU-6; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1, DER.2.1; NIS2 Art. 21(2) (i), (b), (a); MITRE ATT&CK T1557.
- id: azure-private-dns-zone-resolution-failure
  name: Private DNS Zone Deletion or Link Removal
  description: |
    Deleting a central privatelink zone or its VNet links breaks name
    resolution for every private endpoint of that service type in all
    linked VNets.

    Attack scenario: A Terraform refactor moves zones between modules,
    destroying and recreating them. During the window, all spokes lose
    resolution for storage and SQL.

    Impact: Widespread outage across workloads.

    Severity: High

    Terraform indicators: privatelink zones managed in application state
    instead of a platform state; no lifecycle { prevent_destroy = true } or
    management lock on zones and links.

    References: MCSB v2 NS-10, AM-3; NIST SP 800-53 Rev. 5 SC-7, SI-4, CM-3, CM-4, SA-3, SA-4; BSI IT-Grundschutz NET.1.1, NET.3.2, OPS.2.2; NIS2 Art. 21(2) (a).
- id: azure-private-dns-zone-missing-logging
  name: Private DNS Missing Query and Change Logging
  description: |
    DNS queries and zone changes are not logged, so DNS-based attacks
    (record hijack, tunneling, resolution of malicious domains) cannot be
    detected or investigated.

    Attack scenario: An A record is modified for two hours and then reverted.
    Without Activity Log export and DNS query logs, the interception goes
    unnoticed.

    Impact: Undetected traffic redirection.

    Severity: Medium

    Terraform indicators: no subscription Activity Log export; no DNS
    security policy / resolver with diagnostic settings.

    References: MCSB v2 NS-10, LT-3, LT-5, LT-6; NIST SP 800-53 Rev. 5 SC-7, SI-4, AU-2, AU-3, AU-6, AU-12; BSI IT-Grundschutz NET.1.1, NET.3.2, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (a), (b).
- id: azure-bastion-overprivileged-access
  name: Bastion Overly Broad Connection Rights
  description: |
    Users who hold Reader on the Bastion, the target VM and its NIC can open
    sessions. Bastion Standard/Premium can reach VMs in peered VNets, so broad
    Reader assignments grant access to many hosts.

    Attack scenario: A contractor with subscription Reader uses Bastion to
    connect to production VMs in peered spokes and tries local credentials.

    Impact: Unintended administrative reach; lateral movement.

    Severity: Medium

    Terraform indicators: Reader assigned at subscription scope to large
    groups; Bastion in the hub with peerings to all spokes.

    References: MCSB v2 PA-7, IM-6, IM-7, IM-1; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, IA-2, IA-5; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i), (j); MITRE ATT&CK T1021.
- id: azure-bastion-feature-abuse
  name: Bastion Shareable Links, Tunneling and File Transfer Abuse
  description: |
    Native client tunneling, file copy, IP-based connect and shareable links
    widen the attack surface. Shareable links let people without Azure
    portal access reach a VM's login screen. Tunneling and file copy enable
    data transfer.

    Attack scenario: A shareable link created for a vendor is forwarded
    externally. An attacker uses it to reach the VM's login screen and brute
    force local credentials, then copies files out via native client
    tunneling.

    Impact: Unauthorized access and data exfiltration.

    Severity: Medium

    Terraform indicators: shareable_link_enabled = true;
    tunneling_enabled = true; file_copy_enabled = true; ip_connect_enabled =
    true without need.

    References: MCSB v2 PA-6; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-6, IA-2, IA-5, IA-8; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1048.
- id: azure-bastion-vm-credential-spoofing
  name: Bastion Sessions Using Local VM Credentials
  description: |
    Sessions authenticate to VMs with shared local administrator passwords or
    SSH keys rather than Entra ID. Actions on the VM cannot be tied to a person
    and stolen credentials keep working.

    Attack scenario: A shared local admin password is used by several
    engineers. A departed employee who still knows it connects via Bastion
    using another person's Azure access.

    Impact: Unattributable privileged access.

    Severity: Medium

    Terraform indicators: VMs without AADLoginForWindows /
    AADSSHLoginForLinux extensions; shared admin_password variables.

    References: MCSB v2 IM-1, IM-6, IM-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i), (j); MITRE ATT&CK T1078.003.
- id: azure-bastion-subnet-nsg-misconfiguration
  name: Bastion Subnet NSG Misconfiguration
  description: |
    The AzureBastionSubnet NSG allows inbound 443 from any source or lacks the
    required rules. That exposes the Bastion portal surface broadly, or breaks
    the service.

    Attack scenario: Bastion inbound is open to the internet. A credential
    stuffing campaign against Entra ID accounts leads to Bastion sessions from
    unexpected countries.

    Impact: Broader exposure of administrative access, or loss of
    administrative access.

    Severity: Low

    Terraform indicators: NSG on AzureBastionSubnet with inbound 443 from
    "Internet" where corporate IP restriction is feasible; missing
    GatewayManager / AzureLoadBalancer rules.

    References: MCSB v2 NS-1, IM-6, IM-7; NIST SP 800-53 Rev. 5 SC-7, SC-32, AC-4, CM-7, AC-2, AC-3; BSI IT-Grundschutz NET.1.1, NET.3.2, ORP.4; NIS2 Art. 21(2) (a), (i), (j).
- id: azure-bastion-missing-audit
  name: Bastion Missing Session Audit
  description: |
    BastionAuditLogs and session recording are not enabled, so administrative
    sessions cannot be reviewed or attributed.

    Attack scenario: Data is deleted on a production VM. Without Bastion audit
    logs it is unknown who connected at that time.

    Impact: Repudiation of privileged actions.

    Severity: Medium

    Terraform indicators: no azurerm_monitor_diagnostic_setting with
    BastionAuditLogs; session_recording_enabled = false for Premium.

    References: MCSB v2 LT-3, LT-5, LT-6, PA-6; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4, AU-7; BSI IT-Grundschutz OPS.1.1.5, DER.1, ORP.4; NIS2 Art. 21(2) (b), (i).
- id: azure-sql-database-public-network-exposure
  name: SQL Database Public Network and Allow-Azure-Services Exposure
  description: |
    The logical server accepts public connections, often through firewall
    rules 0.0.0.0-255.255.255.255 or the 0.0.0.0 "Allow Azure services" rule.
    The latter admits connections from any Azure subscription of any customer.

    Attack scenario: An attacker deploys a VM in their own Azure subscription
    and passes the "Allow Azure services" rule. They then brute-force the SQL
    admin login.

    Impact: Direct exposure of the database to credential and exploit
    attacks.

    Severity: High

    Terraform indicators: public_network_access_enabled = true;
    azurerm_mssql_firewall_rule with start_ip_address = "0.0.0.0" and
    end_ip_address = "0.0.0.0" or "255.255.255.255".

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1190, T1110.
- id: azure-sql-database-sql-authentication
  name: SQL Database SQL Authentication and Admin Password Exposure
  description: |
    SQL authentication is enabled with a server admin login and password. The
    password is set through Terraform and stored in state, and SQL logins
    bypass Entra MFA and Conditional Access.

    Attack scenario: The admin password is read from Terraform state or an
    app setting and used to connect as the server admin with full control of
    every database.

    Impact: Complete database compromise with unattributable access.

    Severity: High

    Terraform indicators: administrator_login_password set;
    azuread_administrator absent or azuread_authentication_only = false;
    connection strings with "User ID=" in app_settings.

    References: MCSB v2 IM-1, IM-8, DS-3, LT-1; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, CON.1, OPS.2.2, OPS.1.1.5; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1110, T1078.
- id: azure-sql-database-sql-injection
  name: SQL Database Injection via Application
  description: |
    Applications build queries from untrusted input. Attackers read or modify
    data with the privileges of the application's database principal.

    Attack scenario: An attacker injects a UNION SELECT through a search
    parameter and dumps customer tables. With db_owner rights they also drop
    tables.

    Impact: Data disclosure and tampering.

    Severity: High

    Terraform indicators: Microsoft Defender for SQL not enabled
    (azurerm_mssql_server_security_alert_policy absent / pricing tier Free);
    application identity granted db_owner.

    References: MCSB v2 LT-1, DP-2, NS-6, NS-5; NIST SP 800-53 Rev. 5 SI-4, AU-6, AC-4, SC-7, SI-10, SI-11; BSI IT-Grundschutz OPS.1.1.5, DER.1, CON.1, APP.3.1; NIS2 Art. 21(2) (b), (h), (e); MITRE ATT&CK T1190.
- id: azure-sql-database-excessive-privileges
  name: SQL Database Excessive Database Privileges
  description: |
    Applications connect as the server admin or as db_owner, and the Entra
    admin is a single user rather than a group. A compromised application or
    user gets full control.

    Attack scenario: An app compromised via RCE uses its db_owner identity
    to create a backdoor login and disable auditing at the database level.

    Impact: Full data compromise and persistence in the database.

    Severity: High

    Terraform indicators: azuread_administrator.login_username set to an
    individual user; app connection strings using the admin login; no
    contained-user role scripts.

    References: MCSB v2 PA-7, IM-1; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, AC-4, SC-2; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i), (j); MITRE ATT&CK T1078.
- id: azure-sql-database-data-exfiltration
  name: SQL Database Data Exfiltration via Export or Outbound Access
  description: |
    Principals with SQL Server Contributor can export databases as BACPAC to
    any storage account. Server-side outbound features can push data to
    external endpoints when outbound restrictions are not configured.

    Attack scenario: A compromised automation identity exports the
    production database to a storage account in an attacker tenant.

    Impact: Bulk data theft.

    Severity: High

    Terraform indicators: outbound_network_restriction_enabled = false;
    broad SQL Server Contributor / Contributor assignments.

    References: MCSB v2 NS-2, PA-7, LT-1, DP-2; NIST SP 800-53 Rev. 5 SC-7, AC-4, AC-2, AC-3, AC-5, AC-6; BSI IT-Grundschutz NET.1.1, NET.3.2, ORP.4, OPS.1.1.5; NIS2 Art. 21(2) (a), (i), (b); MITRE ATT&CK T1537, T1213.006.
- id: azure-sql-database-insecure-transport
  name: SQL Database Weak TLS
  description: |
    The server allows TLS versions below 1.2, exposing logins and data in
    transit to downgrade attacks.

    Attack scenario: A legacy client negotiates TLS 1.0. An on-path attacker
    downgrades and intercepts the session.

    Impact: Credential and data disclosure.

    Severity: Medium

    Terraform indicators: minimum_tls_version = "1.0" / "1.1" or "Disabled".

    References: MCSB v2 DP-3, NS-8, PV-1, PV-2; NIST SP 800-53 Rev. 5 SC-8, SC-13, IA-5, CM-2, CM-6, CM-3; BSI IT-Grundschutz CON.1, NET.1.1, NET.3.2, OPS.2.2; NIS2 Art. 21(2) (h), (a), (e); MITRE ATT&CK T1557.
- id: azure-sql-database-sensitive-data-plaintext
  name: SQL Database Sensitive Columns Readable by Operators
  description: |
    Highly sensitive columns (national IDs, card numbers, health data) are
    stored without Always Encrypted or masking. DBAs, support staff and
    compromised admin accounts can read them in plaintext.

    Attack scenario: An attacker with a DBA's credentials queries the patient
    table and exports diagnoses and identifiers.

    Impact: Disclosure of regulated data.

    Severity: Medium

    Terraform indicators: no data classification; no
    Always Encrypted column master key in Key Vault; dynamic data masking not
    configured.

    References: MCSB v2 DP-4, DP-5, PA-7; NIST SP 800-53 Rev. 5 SC-28, SC-12, AC-2, AC-3, AC-5, AC-6; BSI IT-Grundschutz CON.1, ORP.4; NIS2 Art. 21(2) (h), (i); MITRE ATT&CK T1213.006.
- id: azure-sql-database-destruction
  name: SQL Database or Server Deletion
  description: |
    Deleting a logical server deletes its databases and their point-in-time
    backups. Dropping databases or tables destroys data unless backups are
    retained elsewhere.

    Attack scenario: An attacker with Contributor deletes the logical server.
    Only long-term retention backups, if configured, survive.

    Impact: Data loss and prolonged outage.

    Severity: Critical

    Terraform indicators: no azurerm_management_lock on the server;
    long_term_retention_policy absent; short_term_retention_policy at
    minimum; no lifecycle { prevent_destroy = true }.

    References: MCSB v2 BR-1, BR-2, AM-3, PA-7; NIST SP 800-53 Rev. 5 CP-9, CP-10, SC-12, SC-13, SC-28, CM-3; BSI IT-Grundschutz CON.3, OPS.2.2, ORP.4; NIS2 Art. 21(2) (c), (a), (i); MITRE ATT&CK T1485, T1490.
- id: azure-sql-database-missing-auditing
  name: SQL Database Missing Auditing
  description: |
    SQL auditing is not enabled at server level, so queries, logins and
    permission changes are not recorded.

    Attack scenario: An insider queries salary tables. Without auditing there
    is no evidence of which rows were accessed.

    Impact: Inability to detect or prove data access; compliance failure.

    Severity: Medium

    Terraform indicators: no azurerm_mssql_server_extended_auditing_policy
    (or log_monitoring_enabled = false) and no diagnostic setting with
    SQLSecurityAuditEvents.

    References: MCSB v2 LT-3, PV-1, PV-2; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4, CM-2; BSI IT-Grundschutz OPS.1.1.5, DER.1, OPS.2.2, OPS.1.1.3; NIS2 Art. 21(2) (b), (a), (e).
- id: azure-cosmosdb-account-key-abuse
  name: Cosmos DB Account Key Abuse
  description: |
    Primary/secondary keys grant full data-plane access, and with metadata
    writes enabled they can also change containers and throughput. Keys do
    not expire and bypass Entra ID auditing.

    Attack scenario: A Cosmos DB key leaks from a client application config.
    The attacker reads and modifies all documents from the internet.

    Impact: Full data compromise without identity attribution.

    Severity: High

    Terraform indicators: local_authentication_enabled = true (default);
    access_key_metadata_writes_enabled = true; primary_key referenced in
    outputs or app_settings.

    References: MCSB v2 IM-1, IM-3, IM-8, DS-6; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, CON.1, OPS.2.2; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1552.001, T1213.006.
- id: azure-cosmosdb-control-plane-key-listing
  name: Cosmos DB Key Listing via Control-Plane Role
  description: |
    Contributor or DocumentDB Account Contributor can call listKeys and turn
    management rights into full data access.

    Attack scenario: A CI service principal with Contributor is compromised.
    The attacker lists keys for every Cosmos DB account and dumps data.

    Impact: Escalation from management to data access across accounts.

    Severity: High

    Terraform indicators: broad Contributor assignments;
    local_authentication_enabled = true.

    References: MCSB v2 IM-1, PA-7, LT-1, IR-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1, DER.2.1; NIS2 Art. 21(2) (i), (j), (b); MITRE ATT&CK T1078.004, T1213.006.
- id: azure-cosmosdb-public-network-exposure
  name: Cosmos DB Public Network Exposure
  description: |
    The account accepts connections from any network, or from all Azure
    datacenters via the 0.0.0.0 IP filter. That includes other customers'
    resources.

    Attack scenario: A leaked key is used from attacker infrastructure because
    no IP or VNet filter exists.

    Impact: Data access from anywhere with leaked credentials.

    Severity: High

    Terraform indicators: public_network_access_enabled = true;
    ip_range_filter empty or containing "0.0.0.0";
    is_virtual_network_filter_enabled = false.

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1213.006.
- id: azure-cosmosdb-query-injection
  name: Cosmos DB Query Injection
  description: |
    Applications concatenate user input into Cosmos DB SQL API queries,
    allowing attackers to alter query logic and read other tenants' or users'
    documents.

    Attack scenario: An attacker supplies ' OR 1=1 -- in a filter parameter
    and retrieves all documents in the container.

    Impact: Unauthorized data access across partitions or tenants.

    Severity: High

    Terraform indicators: not visible in Terraform; review application query
    construction.

    References: MCSB v2 LT-1, DP-2; NIST SP 800-53 Rev. 5 SI-4, AU-6, AC-4; BSI IT-Grundschutz OPS.1.1.5, DER.1, CON.1; NIS2 Art. 21(2) (b), (h); MITRE ATT&CK T1190.
- id: azure-cosmosdb-data-deletion
  name: Cosmos DB Data or Account Deletion
  description: |
    Containers, databases or the account are deleted, maliciously or by a
    Terraform change. With periodic backup only, recovery requires a support
    request and may lose data.

    Attack scenario: An attacker with a key deletes all containers.
    Continuous backup is not enabled, so point-in-time restore is
    unavailable.

    Impact: Data loss and outage.

    Severity: High

    Terraform indicators: backup { type = "Periodic" } with long intervals;
    no azurerm_management_lock; access_key_metadata_writes_enabled = true.

    References: MCSB v2 BR-1, AM-3, IM-1; NIST SP 800-53 Rev. 5 CP-9, CP-10, CM-3, CM-4, SA-3, SA-4; BSI IT-Grundschutz CON.3, OPS.2.2, ORP.4; NIS2 Art. 21(2) (c), (a), (i); MITRE ATT&CK T1485.
- id: azure-cosmosdb-throughput-exhaustion
  name: Cosmos DB Request Unit Exhaustion
  description: |
    Expensive queries, hot partitions or attacker-driven request floods
    consume provisioned RU/s, causing 429 throttling. With high autoscale
    maximums, they cause runaway cost instead.

    Attack scenario: An attacker repeatedly calls an API that runs
    cross-partition queries. All RU/s are consumed and legitimate writes fail.

    Impact: Availability loss or cost spike.

    Severity: Medium

    Terraform indicators: no capacity.total_throughput_limit; high
    autoscale_settings.max_throughput; no API rate limiting.

    References: MCSB v2 NS-6, NS-5; NIST SP 800-53 Rev. 5 SC-7, SI-10, SI-11, SC-5, SI-4; BSI IT-Grundschutz APP.3.1, NET.1.1, NET.3.2; NIS2 Art. 21(2) (e), (a), (c); MITRE ATT&CK T1499.003.
- id: azure-cosmosdb-missing-logging
  name: Cosmos DB Missing Data-Plane Logging
  description: |
    DataPlaneRequests, QueryRuntimeStatistics and ControlPlaneRequests logs are
    not collected, so data access and key usage cannot be investigated.

    Attack scenario: Data appears on a leak site. Without data-plane logs,
    it is unknown whether keys or which identities read it.

    Impact: Failed investigation.

    Severity: Medium

    Terraform indicators: no azurerm_monitor_diagnostic_setting for the
    account with the relevant categories.

    References: MCSB v2 LT-3, LT-5, LT-6, LT-1; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4, AU-7; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b).
- id: azure-ad-application-client-secret-leak
  name: Entra Application Long-Lived Client Secret Leak
  description: |
    Applications authenticate with client secrets valid for years. The secrets
    are stored in Terraform state, pipeline variables and config files, and a
    leaked secret works from anywhere.

    Attack scenario: An azuread_application_password value is read from
    Terraform state. The attacker requests Graph tokens as the app.

    Impact: Impersonation of the application with all its permissions.

    Severity: High

    Terraform indicators: azuread_application_password with end_date far in
    the future or end_date_relative long; secrets output from modules; no
    app management policy restricting secret lifetime.

    References: MCSB v2 IM-3, IM-8, DS-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-4, IA-5, IA-9; BSI IT-Grundschutz ORP.4, CON.1, OPS.2.2; NIS2 Art. 21(2) (i), (h), (d); MITRE ATT&CK T1552.001, T1078.004.
- id: azure-ad-application-credential-backdoor
  name: Entra Application Credential Backdoor
  description: |
    Owners of an application and holders of Application Administrator or
    Cloud Application Administrator can add new secrets or certificates to
    existing privileged apps, gaining persistent access as that app.

    Attack scenario: An attacker who compromised an Application Administrator
    adds a certificate to an app holding Mail.Read application permissions
    and reads all mailboxes (the Solorigate technique).

    Impact: Stealthy persistence and tenant-wide data access.

    Severity: Critical

    Terraform indicators: azuread_application owners including regular users;
    many principals with Application Administrator; no alerting on
    "Update application – Certificates and secrets management".

    References: MCSB v2 PA-1, LT-2, PA-2; NIST SP 800-53 Rev. 5 AC-2, AC-5, AC-6, AU-2, AU-6, IA-4; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (i), (b); MITRE ATT&CK T1098.001.
- id: azure-ad-application-excessive-api-permissions
  name: Entra Application Excessive API Permissions
  description: |
    The app holds high-impact application permissions such as
    RoleManagement.ReadWrite.Directory, AppRoleAssignment.ReadWrite.All,
    Application.ReadWrite.All or Directory.ReadWrite.All. These permissions
    allow escalation to Global Administrator.

    Attack scenario: An attacker compromises an automation app with
    AppRoleAssignment.ReadWrite.All. They grant themselves
    RoleManagement.ReadWrite.Directory and assign Global Administrator.

    Impact: Full tenant takeover.

    Severity: Critical

    Terraform indicators: required_resource_access with type = "Role" for
    high-privilege Graph app roles; azuread_app_role_assignment granting them.

    References: MCSB v2 PA-7, LT-2; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, AU-2, AU-6; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (i), (b); MITRE ATT&CK T1098.003.
- id: azure-ad-application-illicit-consent
  name: Entra Illicit Consent Grant
  description: |
    Users can consent to multi-tenant apps requesting access to their data.
    Attackers register malicious apps and phish users into granting consent,
    obtaining refresh tokens without stealing passwords.

    Attack scenario: Users receive a "document shared with you" link to an
    attacker app requesting Mail.Read and offline_access. Consenting gives
    the attacker persistent mailbox access that survives password resets.

    Impact: Persistent data access, bypassing MFA.

    Severity: High

    Terraform indicators: tenant authorization policy allowing user consent
    for all apps (azuread_* / Graph authorizationPolicy not restricted);
    no admin consent workflow.

    References: MCSB v2 IM-2, LT-2; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-4, IA-5, IA-8; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (i), (b); MITRE ATT&CK T1528, T1566.002.
- id: azure-ad-application-redirect-uri-hijack
  name: Entra Application Redirect URI Hijack
  description: |
    Redirect URIs point to wildcard, http, localhost or decommissioned domains
    (e.g. deleted *.azurewebsites.net apps). An attacker who controls such a
    URI receives authorization codes or tokens.

    Attack scenario: An app registration still lists a redirect URI to a
    deleted App Service. An attacker claims the hostname and sends victims a
    crafted login link that delivers their authorization codes to the
    attacker.

    Impact: Account takeover of application users.

    Severity: High

    Terraform indicators: web.redirect_uris with http://, wildcard or
    hostnames of resources not managed in the same configuration.

    References: MCSB v2 NS-10; NIST SP 800-53 Rev. 5 SC-7, SI-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1528.
- id: azure-ad-application-multitenant-misuse
  name: Entra Multi-Tenant App Without Tenant Validation
  description: |
    The app is registered as multi-tenant but the application does not
    restrict or validate the issuing tenant. Users from any Entra tenant,
    including attacker-created ones, can sign in, and authorization is
    sometimes mapped by mutable claims such as email.

    Attack scenario: An attacker creates a free tenant with a user whose
    email claim matches a victim and signs in to the SaaS app, which maps
    users by email (the nOAuth class of issue).

    Impact: Account takeover and cross-tenant data access.

    Severity: High

    Terraform indicators: sign_in_audience = "AzureADMultipleOrgs" or
    "AzureADandPersonalMicrosoftAccount" for internal-only apps;
    app_role_assignment_required = false on the service principal.

    References: MCSB v2 IM-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-6, AC-16; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1078.004.
- id: azure-ad-application-insecure-oauth-flows
  name: Entra Application Insecure OAuth Flows
  description: |
    The implicit grant or public client flows (ROPC, device code) are enabled
    without need. Tokens are exposed in URLs and browser history, and MFA
    can be bypassed with password-based flows.

    Attack scenario: Access tokens issued via implicit grant leak through
    browser history and Referer headers to third-party scripts.

    Impact: Token disclosure and account compromise.

    Severity: Medium

    Terraform indicators: web.implicit_grant.access_token_issuance_enabled =
    true; fallback_public_client_enabled = true.

    References: MCSB v2 IM-6, IM-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-5, IA-8, IA-11; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i), (j); MITRE ATT&CK T1528.
- id: azure-ad-application-credential-expiry-outage
  name: Entra Application Credential Expiry Outage
  description: |
    Secrets and certificates expire without monitoring or automated rotation,
    or an attacker removes them. Dependent integrations then fail.

    Attack scenario: A certificate used by a payroll integration expires on a
    weekend and payroll processing stops.

    Impact: Service outage.

    Severity: Medium

    Terraform indicators: fixed end_date on credentials without rotation
    (e.g. no time_rotating resource); no expiry alerting.

    References: MCSB v2 IM-3, IM-8; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-4, IA-5, IA-9; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (h); MITRE ATT&CK T1531.
- id: azure-ad-application-missing-audit
  name: Entra Application and Service Principal Missing Audit Trail
  description: |
    Entra audit logs and service principal sign-in logs are not exported or
    are retained for only the default 30 days. Credential additions, consent
    grants and app sign-ins cannot be investigated.

    Attack scenario: A backdoor credential was added four months ago. The
    audit logs that would show it have already aged out.

    Impact: Undetected persistence; repudiation of identity changes.

    Severity: High

    Terraform indicators: no azurerm_monitor_aad_diagnostic_setting with
    AuditLogs, ServicePrincipalSignInLogs and ManagedIdentitySignInLogs.

    References: MCSB v2 LT-2, LT-3, LT-5, LT-6; NIST SP 800-53 Rev. 5 AU-2, AU-6, IA-4, SI-4, AU-3, AU-12; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b).
- id: azure-service-principal-overprivileged-rbac
  name: Service Principal Over-Privileged Azure RBAC
  description: |
    CI/CD and Terraform service principals hold Owner or Contributor plus
    User Access Administrator at subscription or management group scope.
    Compromise of the pipeline then means full control of the environment.

    Attack scenario: A malicious pull request runs in a pipeline that uses
    the Terraform service principal with Owner. The attacker creates their
    own role assignments and deploys resources.

    Impact: Subscription or management group compromise.

    Severity: Critical

    Terraform indicators: azurerm_role_assignment with Owner / User Access
    Administrator for the deployment principal at subscription or
    management-group scope; the same principal for plan and apply and for all
    environments.

    References: MCSB v2 DS-3, PA-7, PV-1, PV-2; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-6, SC-12, SC-13, AU-2; BSI IT-Grundschutz OPS.2.2, ORP.4, OPS.1.1.3; NIS2 Art. 21(2) (d), (i), (a); MITRE ATT&CK T1078.004, T1098.003.
- id: azure-service-principal-credential-theft
  name: Service Principal Credential Theft
  description: |
    Service principal secrets or certificates are stored in pipeline variables,
    environment variables (ARM_CLIENT_SECRET), developer machines or
    Terraform provider configs, and stolen from there.

    Attack scenario: An attacker compromises a self-hosted build agent, reads
    ARM_CLIENT_SECRET from the environment, and authenticates from their own
    infrastructure.

    Impact: Impersonation of the deployment identity.

    Severity: High

    Terraform indicators: provider "azurerm" with client_secret variables;
    azuread_service_principal_password resources; no OIDC (use_oidc).

    References: MCSB v2 IM-3, IM-8, IM-7, DS-6; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-4, IA-5, IA-9; BSI IT-Grundschutz ORP.4, CON.1, OPS.2.2; NIS2 Art. 21(2) (i), (h), (d); MITRE ATT&CK T1552.001, T1078.004.
- id: azure-service-principal-directory-role-escalation
  name: Service Principal Privileged Directory Roles
  description: |
    Service principals hold privileged Entra directory roles (Global
    Administrator, Privileged Role Administrator, Application Administrator)
    or Graph app roles that allow role assignment.

    Attack scenario: An automation SP with Privileged Role Administrator is
    compromised and used to make an attacker account Global Administrator.

    Impact: Tenant takeover.

    Severity: Critical

    Terraform indicators: azuread_directory_role_assignment for service
    principals; azuread_app_role_assignment for RoleManagement.ReadWrite.Directory
    or AppRoleAssignment.ReadWrite.All.

    References: MCSB v2 PA-7, LT-2, PA-3, PA-4; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, AU-2, AU-6; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (i), (b); MITRE ATT&CK T1098.003.
- id: azure-service-principal-credential-backdoor
  name: Service Principal Hidden Credential Backdoor
  description: |
    Credentials can be added directly to a service principal object rather
    than the application registration. They do not appear in the app
    registration blade and are often overlooked in reviews.

    Attack scenario: An attacker with Application Administrator adds a password
    credential to the service principal of a privileged first-party or
    enterprise app and uses it for persistent access.

    Impact: Stealthy persistence.

    Severity: High

    Terraform indicators: azuread_service_principal_password resources; no
    alerting on "Add service principal credentials" audit events.

    References: MCSB v2 LT-2, PA-1, PA-3, PA-4; NIST SP 800-53 Rev. 5 AU-2, AU-6, IA-4, SI-4, AC-2, AC-5; BSI IT-Grundschutz OPS.1.1.5, DER.1, ORP.4; NIS2 Art. 21(2) (b), (i); MITRE ATT&CK T1098.001.
- id: azure-service-principal-stale
  name: Stale Service Principals With Active Access
  description: |
    Service principals from decommissioned projects keep valid credentials and
    role assignments, increasing the attack surface without an owner to
    notice misuse.

    Attack scenario: An attacker finds an old pipeline secret in a repository
    archive. The service principal still has Contributor because nobody
    removed it.

    Impact: Unmonitored privileged access.

    Severity: Medium

    Terraform indicators: service principals and role assignments managed
    outside Terraform or in abandoned states; no access reviews.

    References: MCSB v2 PA-3, PA-4, IM-3, IM-8; NIST SP 800-53 Rev. 5 AC-2, IA-4, AC-6, AC-3, IA-2, IA-5; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (h); MITRE ATT&CK T1078.004.
- id: azure-service-principal-third-party-app-abuse
  name: Third-Party Multi-Tenant Application Abuse
  description: |
    Enterprise applications from vendors hold broad tenant permissions.
    Compromise of the vendor or its app credentials gives the attacker access
    to your tenant through a trusted relationship.

    Attack scenario: A SaaS vendor's app secret is stolen. The attacker uses
    the app's Mail.Read and Files.Read.All consent in your tenant to collect
    data.

    Impact: Data theft through a supply-chain trust path.

    Severity: High

    Terraform indicators: third-party service principals with application
    permissions; no Conditional Access for workload identities or
    periodic permission review.

    References: MCSB v2 PA-7, PA-3, PA-4, IM-2; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, IA-4, IA-2; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1199.
- id: azure-function-app-function-key-abuse
  name: Function App Key-Based or Anonymous Access Abuse
  description: |
    HTTP triggers use authLevel anonymous or rely only on function, host or
    master keys. Keys are shared secrets that leak via URLs (?code=) and logs,
    and the master key grants admin API access.

    Attack scenario: A function URL with ?code= appears in browser history and
    a support ticket. An attacker replays it to invoke a data-export function.

    Impact: Unauthorized function execution and data access.

    Severity: High

    Terraform indicators: auth_settings_v2 absent; azurerm_function_app_function
    or code with authLevel "anonymous"/"function"; host keys in outputs.

    References: MCSB v2 IM-1, IM-3, IM-8, NS-2; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, CON.1, NET.1.1, NET.3.2; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1552.001, T1648.
- id: azure-function-app-storage-takeover
  name: Function App Backing Storage Code and Key Takeover
  description: |
    The AzureWebJobsStorage account holds the function package
    (WEBSITE_RUN_FROM_PACKAGE / content share) and, by default, the function
    keys (azure-webjobs-secrets). Write access to that storage gives code
    execution in the function and its identity.

    Attack scenario: An attacker with access to the storage account key
    replaces the deployment package blob with a backdoored version. On
    restart, the function runs it with its managed identity.

    Impact: Code execution, managed identity takeover, key theft.

    Severity: Critical

    Terraform indicators: storage_account_access_key set (shared key) instead
    of storage_uses_managed_identity = true; storage account shared with
    other apps; AzureWebJobsSecretStorageType not set to "keyvault".

    References: MCSB v2 IM-3, IM-8, IM-1, PA-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-4, IA-5, IA-9; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (h), (j); MITRE ATT&CK T1648, T1552.001.
- id: azure-function-app-trigger-input-injection
  name: Function App Untrusted Trigger Payload Injection
  description: |
    Functions process messages from queues, Event Grid, Service Bus or HTTP
    without validation, trusting payloads because they came from an
    "internal" source. Injection or unsafe deserialization follows.

    Attack scenario: An attacker who can write to a storage queue injects a
    message that the function deserializes into a dangerous type, achieving
    code execution.

    Impact: Code execution or data tampering in downstream systems.

    Severity: High

    Terraform indicators: broad Storage Queue Data Contributor / Service Bus
    Data Sender assignments to producers; not visible otherwise.

    References: MCSB v2 PA-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i).
- id: azure-function-app-scale-cost-dos
  name: Function App Uncontrolled Scale-Out
  description: |
    Consumption and Flex plans scale out on demand. Floods of events or
    requests can drive unbounded cost and exhaust downstream databases.

    Attack scenario: An attacker floods an HTTP-triggered function. It scales
    to hundreds of instances, exhausts SQL connection limits and generates a
    large bill.

    Impact: Downstream outage and financial damage.

    Severity: Medium

    Terraform indicators: no app_scale_limit / function_app_scale_limit /
    maximum_instance_count; no API Management or WAF throttling in front.

    References: MCSB v2 NS-6, NS-5; NIST SP 800-53 Rev. 5 SC-7, SI-10, SI-11, SC-5, SI-4; BSI IT-Grundschutz APP.3.1, NET.1.1, NET.3.2; NIS2 Art. 21(2) (e), (a), (c); MITRE ATT&CK T1499.003, T1496.
- id: azure-container-registry-admin-user
  name: Container Registry Admin User Credentials
  description: |
    The admin user provides a shared username/password with push and pull
    rights. It is not tied to an identity and is frequently copied into
    pipelines and clusters.

    Attack scenario: The admin password leaks from a docker config on a build
    agent. The attacker pushes a backdoored image under an existing tag.

    Impact: Supply-chain compromise of all consumers.

    Severity: High

    Terraform indicators: admin_enabled = true; admin_password referenced
    in outputs or app_settings.

    References: MCSB v2 IM-1, IM-3, PV-1, PV-2; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, OPS.2.2, OPS.1.1.3; NIS2 Art. 21(2) (i), (j), (a); MITRE ATT&CK T1078.001.
- id: azure-container-registry-anonymous-pull
  name: Container Registry Anonymous Pull
  description: |
    Anonymous pull lets anyone download images. Images often contain
    proprietary code, internal endpoints and sometimes embedded secrets.

    Attack scenario: An attacker pulls all repositories and extracts API keys
    from image layers and environment defaults.

    Impact: Source and secret disclosure.

    Severity: High

    Terraform indicators: anonymous_pull_enabled = true.

    References: MCSB v2 PV-1, PV-2; NIST SP 800-53 Rev. 5 CM-2, CM-6, CM-3, CM-7; BSI IT-Grundschutz OPS.2.2, OPS.1.1.3; NIS2 Art. 21(2) (a), (e); MITRE ATT&CK T1530.
- id: azure-container-registry-public-network-exposure
  name: Container Registry Public Network Exposure
  description: |
    The registry accepts connections from any network, so leaked tokens or
    credentials can push and pull from anywhere.

    Attack scenario: A stolen AcrPush token is used from attacker
    infrastructure to overwrite images.

    Impact: Image tampering and disclosure from outside the perimeter.

    Severity: Medium

    Terraform indicators: public_network_access_enabled = true;
    network_rule_set absent or default_action = "Allow"; sku not Premium
    (no private endpoint support).

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a).
- id: azure-container-registry-image-poisoning
  name: Container Registry Image Poisoning
  description: |
    Identities with AcrPush overwrite mutable tags (e.g. :latest, :1.2).
    Without signing and verification, clusters deploy the tampered image.

    Attack scenario: A compromised CI job pushes a malicious image as
    app:1.4.2. AKS nodes pull it on the next restart.

    Impact: Malicious code running in production.

    Severity: Critical

    Terraform indicators: no tag locking (az acr repository update --write-enabled false; not exposed by azurerm) for release
    tags; trust/signature policy not enforced; AcrPush granted to many
    principals.

    References: MCSB v2 DS-2, DS-6, PA-7; NIST SP 800-53 Rev. 5 SR-3, SR-4, SR-6, SA-12, SA-15, RA-5; BSI IT-Grundschutz OPS.2.2, ORP.4; NIS2 Art. 21(2) (d), (i); MITRE ATT&CK T1525, T1195.
- id: azure-container-registry-vulnerable-images
  name: Container Registry Vulnerable or Secret-Laden Images
  description: |
    Images with critical CVEs or embedded credentials are stored and deployed
    because no vulnerability scanning or secret scanning gates exist.

    Attack scenario: An attacker exploits a known RCE in an outdated base image
    running in production.

    Impact: Workload compromise; credential disclosure.

    Severity: High

    Terraform indicators: Defender for Containers not enabled; no
    quarantine_policy_enabled / pipeline scanning.

    References: MCSB v2 LT-1, PV-5, IM-8, DS-6; NIST SP 800-53 Rev. 5 SI-4, AU-6, RA-3, RA-5, IA-5, SC-12; BSI IT-Grundschutz OPS.1.1.5, DER.1, OPS.1.1.3, ORP.4; NIS2 Art. 21(2) (b), (e), (h); MITRE ATT&CK T1552.001.
- id: azure-container-registry-tasks-abuse
  name: Container Registry Tasks Identity Abuse
  description: |
    ACR Tasks run build steps with the task's or registry's managed identity.
    Principals who can create or run tasks can execute arbitrary build steps,
    obtain that identity's tokens and push images.

    Attack scenario: An attacker with Contributor on the registry runs a quick
    task that dumps the task identity's token and uses its Key Vault
    permissions.

    Impact: Privilege escalation via build infrastructure.

    Severity: Medium

    Terraform indicators: azurerm_container_registry_task with identity holding
    roles beyond the registry; broad Contributor on the registry.

    References: MCSB v2 PA-7, LT-1, IR-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, SI-4, AU-6; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1, DER.2.1; NIS2 Art. 21(2) (i), (b); MITRE ATT&CK T1612, T1528.
- id: azure-container-registry-image-deletion
  name: Container Registry Image Deletion
  description: |
    Images and repositories are deleted, maliciously or by aggressive
    retention, so deployments and scale-out fail.

    Attack scenario: An attacker with AcrDelete removes all production image
    digests. New AKS nodes cannot pull images.

    Impact: Deployment and scaling outage.

    Severity: Medium

    Terraform indicators: no image locking (az acr repository update --delete-enabled false; not exposed by azurerm); no
    geo-replication or soft-delete; broad AcrDelete / Contributor.

    References: MCSB v2 DS-2, AM-3, PA-7; NIST SP 800-53 Rev. 5 SR-3, SR-4, SR-6, SA-12, SA-15, RA-5; BSI IT-Grundschutz OPS.2.2, ORP.4; NIS2 Art. 21(2) (d), (a), (i); MITRE ATT&CK T1485.
- id: azure-container-registry-missing-logs
  name: Container Registry Missing Login and Repository Logs
  description: |
    ContainerRegistryLoginEvents and ContainerRegistryRepositoryEvents are not
    collected, so pushes, pulls and logins cannot be investigated.

    Attack scenario: A poisoned image is found. Without repository events
    the pushing identity and time cannot be determined.

    Impact: Failed supply-chain incident response.

    Severity: Medium

    Terraform indicators: no azurerm_monitor_diagnostic_setting on the
    registry.

    References: MCSB v2 LT-3, LT-5, LT-6; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4, AU-7; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b).
- id: azure-virtual-machine-public-management-exposure
  name: VM Public RDP/SSH Exposure
  description: |
    VMs have public IPs with RDP or SSH reachable from the internet, exposing
    them to brute force and protocol exploits.

    Attack scenario: A VM with a public IP and port 3389 open is compromised
    by password spraying within days of deployment.

    Impact: Host compromise and lateral movement.

    Severity: High

    Terraform indicators: azurerm_public_ip attached to the NIC; NSG allows
    22/3389 from Internet.

    References: MCSB v2 PA-2, PA-6, NS-1, PV-1; NIST SP 800-53 Rev. 5 AC-2, AC-5, AC-6, AC-16, AC-3, IA-2; BSI IT-Grundschutz ORP.4, NET.1.1, NET.3.2, OPS.2.2; NIS2 Art. 21(2) (i), (a), (e); MITRE ATT&CK T1110, T1021.
- id: azure-virtual-machine-password-authentication
  name: VM Password Authentication and Shared Local Admin
  description: |
    VMs use password authentication with admin passwords set in Terraform
    (stored in state) and shared across machines, instead of SSH keys or
    Entra ID login.

    Attack scenario: The admin_password is read from state and used to log in
    to every VM deployed by the module.

    Impact: Fleet-wide compromise via one credential.

    Severity: High

    Terraform indicators: disable_password_authentication = false;
    admin_password from variables or random_password reused across VMs.

    References: MCSB v2 IM-1, IM-6, IM-8, DS-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, CON.1, OPS.2.2; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1078.003, T1110.
- id: azure-virtual-machine-run-command-abuse
  name: VM Run Command and Extension Abuse
  description: |
    Principals with Virtual Machine Contributor or Contributor can execute
    code as SYSTEM/root via Run Command or Custom Script extensions without
    network access or OS credentials.

    Attack scenario: An attacker with Contributor runs a Run Command on a
    domain controller VM to dump credentials.

    Impact: Full OS compromise via the management plane.

    Severity: High

    Terraform indicators: broad Contributor / Virtual Machine Contributor;
    no alerts on virtualMachines/runCommand/action or extensions/write.

    References: MCSB v2 PA-7, LT-1, IR-3, PA-1; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, SI-4, AU-6; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1, DER.2.1; NIS2 Art. 21(2) (i), (b); MITRE ATT&CK T1651.
- id: azure-virtual-machine-disk-exfiltration
  name: VM Disk Snapshot and Export Exfiltration
  description: |
    Managed disks and snapshots can be exported via SAS URLs or copied to
    another subscription. The whole file system, including credentials, then
    leaves without touching the OS.

    Attack scenario: An attacker with Disk Snapshot Contributor creates a
    snapshot of a database VM's disk, generates a SAS download URL and pulls
    the VHD from the internet.

    Impact: Complete data and credential theft.

    Severity: High

    Terraform indicators: managed disks with network_access_policy =
    "AllowAll" and public_network_access_enabled = true; no disk access
    resource; broad snapshot rights.

    References: MCSB v2 NS-2, PA-7, LT-1, IR-3; NIST SP 800-53 Rev. 5 SC-7, AC-4, AC-2, AC-3, AC-5, AC-6; BSI IT-Grundschutz NET.1.1, NET.3.2, ORP.4, OPS.1.1.5; NIS2 Art. 21(2) (a), (i), (b); MITRE ATT&CK T1578.001, T1537.
- id: azure-virtual-machine-disk-encryption-gaps
  name: VM Disk Encryption Gaps
  description: |
    Temp disks and caches are not encrypted end-to-end and no
    customer-managed key is used where required, leaving data recoverable from
    underlying storage or exports.

    Attack scenario: A VM handling card data writes swap and temp files to an
    unencrypted temp disk, violating PCI requirements.

    Impact: Data-at-rest exposure and compliance failure.

    Severity: Medium

    Terraform indicators: encryption_at_host_enabled = false; no
    disk_encryption_set_id where CMK is required.

    References: MCSB v2 DP-4, PV-1, PV-2; NIST SP 800-53 Rev. 5 SC-28, CM-2, CM-6, CM-3, CM-7; BSI IT-Grundschutz CON.1, OPS.2.2, OPS.1.1.3; NIS2 Art. 21(2) (h), (a), (e).
- id: azure-virtual-machine-boot-tampering
  name: VM Boot Chain Tampering
  description: |
    Without Trusted Launch (Secure Boot and vTPM), bootkits and rootkits can
    persist below the OS and evade endpoint security.

    Attack scenario: An attacker with admin rights installs a bootkit on a VM
    that persists across reimaging of the OS layer.

    Impact: Persistent stealthy compromise.

    Severity: Medium

    Terraform indicators: security_type not "TrustedLaunch";
    secure_boot_enabled = false; vtpm_enabled = false.

    References: MCSB v2 PV-3, ES-1, LT-1, PV-5; NIST SP 800-53 Rev. 5 CM-2, CM-6, SC-28, SI-4, IR-4, AU-6; BSI IT-Grundschutz OPS.2.2, OPS.1.1.3, OPS.1.1.4, OPS.1.1.5; NIS2 Art. 21(2) (a), (e), (g); MITRE ATT&CK T1542.
- id: azure-virtual-machine-unpatched
  name: VM Missing OS Patches
  description: |
    VMs miss security updates because patching is manual or unmonitored,
    leaving known vulnerabilities exploitable.

    Attack scenario: An internet-facing VM running an unpatched web server is
    exploited with a public exploit.

    Impact: Host compromise.

    Severity: High

    Terraform indicators: patch_mode = "Manual" / "ImageDefault";
    patch_assessment_mode not "AutomaticByPlatform"; no maintenance
    configuration.

    References: MCSB v2 PV-6, ES-1, LT-1, PV-5; NIST SP 800-53 Rev. 5 SI-2, RA-5, SI-4, IR-4, AU-6, RA-3; BSI IT-Grundschutz OPS.1.1.3, OPS.1.1.4, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (e), (g), (b); MITRE ATT&CK T1190, T1068.
- id: azure-virtual-machine-ransomware
  name: VM Ransomware and Backup Destruction
  description: |
    Attackers encrypt VM disks and delete backups. Without protected backups
    (soft delete, immutability, multi-user authorization), recovery is
    impossible.

    Attack scenario: An attacker with Backup Contributor disables protection
    and deletes recovery points, then deploys ransomware via Run Command.

    Impact: Prolonged outage and data loss.

    Severity: Critical

    Terraform indicators: no azurerm_backup_protected_vm;
    azurerm_recovery_services_vault without immutability and enforced soft delete;
    no resource guard.

    References: MCSB v2 BR-1, BR-2, AM-3, ES-1; NIST SP 800-53 Rev. 5 CP-9, CP-10, SC-12, SC-13, SC-28, CM-3; BSI IT-Grundschutz CON.3, OPS.2.2, OPS.1.1.4; NIS2 Art. 21(2) (c), (a), (g); MITRE ATT&CK T1486, T1490.
- id: azure-virtual-machine-missing-security-logging
  name: VM Missing Security Event Collection
  description: |
    OS security events, process creation and authentication logs are not
    collected, and no EDR is present, so host compromise goes unnoticed.

    Attack scenario: An attacker logs in with stolen credentials and creates
    a local admin account. No Windows Security events are collected.

    Impact: Undetected compromise; repudiation.

    Severity: Medium

    Terraform indicators: no AzureMonitorWindowsAgent / AzureMonitorLinuxAgent
    extension and azurerm_monitor_data_collection_rule_association;
    Defender for Servers not enabled.

    References: MCSB v2 LT-3, LT-5, ES-1, LT-1; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4, AU-7; BSI IT-Grundschutz OPS.1.1.5, DER.1, OPS.1.1.4; NIS2 Art. 21(2) (b), (g).
- id: azure-log-analytics-sensitive-data-exposure
  name: Log Analytics Sensitive Data Exposure
  description: |
    Logs contain secrets, tokens and personal data, and many users hold
    workspace-wide read access. Anyone with Log Analytics Reader can query
    every table.

    Attack scenario: A developer with workspace Reader queries AppTraces and
    finds bearer tokens and connection strings logged by a debug statement.

    Impact: Credential and personal data disclosure.

    Severity: High

    Terraform indicators: Log Analytics Reader at workspace or resource group
    scope for broad groups; allow_resource_only_permissions = false; no
    table-level RBAC.

    References: MCSB v2 PA-7, DP-1; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, RA-2, SC-28; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (h); MITRE ATT&CK T1654.
- id: azure-log-analytics-local-auth-log-injection
  name: Log Analytics Shared Key Log Injection
  description: |
    Workspace shared keys (local authentication) allow sending arbitrary log
    records through legacy ingestion APIs. Attackers can forge or flood
    entries to mislead investigations.

    Attack scenario: An attacker who obtained the workspace key injects fake
    sign-in events attributing their activity to another user.

    Impact: Integrity loss of security evidence.

    Severity: Medium

    Terraform indicators: local_authentication_enabled = true (or
    local_authentication_enabled = true); primary_shared_key in outputs or
    agent configs.

    References: MCSB v2 PA-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1565.
- id: azure-log-analytics-log-tampering
  name: Log Analytics Log Deletion and Tampering
  description: |
    Principals with Data Purger, Log Analytics Contributor or Contributor can
    purge records, lower retention, delete tables or delete the workspace,
    destroying evidence.

    Attack scenario: After an intrusion, the attacker reduces retention to the
    minimum and purges records containing their IP.

    Impact: Loss of forensic evidence.

    Severity: High

    Terraform indicators: Data Purger role assignments; no
    azurerm_management_lock on the workspace; no data export to immutable
    storage.

    References: MCSB v2 LT-6, PA-7, LT-1, IR-3; NIST SP 800-53 Rev. 5 AU-11, SI-12, AC-2, AC-3, AC-5, AC-6; BSI IT-Grundschutz OPS.1.1.5, DER.1, ORP.4, DER.2.1; NIS2 Art. 21(2) (b), (i); MITRE ATT&CK T1070.
- id: azure-log-analytics-collection-disabled
  name: Log Collection Disabled by Attacker
  description: |
    Attackers delete diagnostic settings, data collection rules or agents to
    stop log flow before acting.

    Attack scenario: An attacker deletes the Key Vault diagnostic setting,
    then reads all secrets without generating AuditEvent records.

    Impact: Blind spots during an attack.

    Severity: High

    Terraform indicators: diagnostic settings deployed only by Terraform
    without Azure Policy DeployIfNotExists remediation; no alert on
    diagnosticSettings/delete.

    References: MCSB v2 PV-1, PV-2, LT-1, IR-3; NIST SP 800-53 Rev. 5 CM-2, CM-6, CM-3, CM-7, SI-4, AU-6; BSI IT-Grundschutz OPS.2.2, OPS.1.1.3, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (a), (e), (b); MITRE ATT&CK T1685.002.
- id: azure-log-analytics-public-access
  name: Log Analytics Public Ingestion and Query
  description: |
    The workspace accepts ingestion and queries from public networks, so
    leaked credentials or tokens can query logs from anywhere and agents
    send data over the internet.

    Attack scenario: An attacker with a stolen token queries security logs from
    outside the network to learn which detections exist.

    Impact: Disclosure of logs and of detection coverage.

    Severity: Medium

    Terraform indicators: internet_query_enabled = true;
    internet_ingestion_enabled = true; no azurerm_monitor_private_link_scope.

    References: MCSB v2 NS-2, PA-7; NIST SP 800-53 Rev. 5 SC-7, AC-4, AC-2, AC-3, AC-5, AC-6; BSI IT-Grundschutz NET.1.1, NET.3.2, ORP.4; NIS2 Art. 21(2) (a), (i); MITRE ATT&CK T1654.
- id: azure-log-analytics-daily-cap-blinding
  name: Log Analytics Daily Cap Exhaustion
  description: |
    A daily ingestion cap stops collection once reached. Attackers or noisy
    sources can exhaust it deliberately, blinding security monitoring for the
    rest of the day.

    Attack scenario: An attacker generates massive volumes of benign log
    noise in the morning. Ingestion stops at the cap and the actual
    intrusion is never logged.

    Impact: Loss of security telemetry.

    Severity: Medium

    Terraform indicators: daily_quota_gb set on the security workspace; no
    alert on the cap being reached.

    References: MCSB v2 LT-5; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-7, AU-12, SI-4; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b).
- id: azure-log-analytics-insufficient-retention
  name: Log Analytics Insufficient Retention
  description: |
    Retention is left at the default (30 days for most tables), shorter than
    typical attacker dwell time or regulatory requirements.

    Attack scenario: A breach is discovered 90 days after initial access.
    Logs covering the initial access are gone.

    Impact: Inability to reconstruct incidents; compliance gaps.

    Severity: Medium

    Terraform indicators: retention_in_days = 30; no
    azurerm_log_analytics_workspace_table total_retention_in_days for
    security tables; no archive or export.

    References: MCSB v2 LT-6; NIST SP 800-53 Rev. 5 AU-11, SI-12; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b).
- id: azure-defender-plans-disabled
  name: Defender for Cloud Plans Not Enabled
  description: |
    Workload protection plans are not enabled on all subscriptions or resource
    types, especially on newly created subscriptions. Attacks against those
    resources produce no alerts.

    Attack scenario: An attacker targets storage accounts in a new
    subscription where Defender for Storage was never enabled. Mass data
    exfiltration produces no alert.

    Impact: Undetected attacks.

    Severity: High

    Terraform indicators: azurerm_security_center_subscription_pricing with
    tier = "Free" or missing for resource types in use; no management-group
    policy enforcing plans.

    References: MCSB v2 LT-1, PV-1, PV-2; NIST SP 800-53 Rev. 5 SI-4, AU-6, CM-2, CM-6, CM-3, CM-7; BSI IT-Grundschutz OPS.1.1.5, DER.1, OPS.2.2, OPS.1.1.3; NIS2 Art. 21(2) (b), (a), (e).
- id: azure-defender-alert-suppression-tampering
  name: Defender for Cloud Suppression and Plan Tampering
  description: |
    Principals with Security Admin or Owner can disable plans, create
    suppression rules or exempt resources, silencing detection before an
    attack.

    Attack scenario: An attacker who gained Security Admin adds a suppression
    rule for "Unusual data extraction" alerts and then exfiltrates data.

    Impact: Disabled detection.

    Severity: High

    Terraform indicators: Security Admin granted broadly or permanently; no
    alert on pricings/write, alertsSuppressionRules/write or
    policy exemptions.

    References: MCSB v2 PA-7, PA-1, PA-2, LT-1; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, AC-16, SI-4; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (i), (b); MITRE ATT&CK T1685.
- id: azure-defender-alerts-unrouted
  name: Defender for Cloud Alerts Not Routed
  description: |
    Security alerts are generated but there are no security contacts,
    continuous export or SIEM connection, so nobody acts on them.

    Attack scenario: Defender raises a high-severity alert for a web shell.
    It sits in the portal unread for weeks.

    Impact: Delayed or no incident response.

    Severity: High

    Terraform indicators: no azurerm_security_center_contact; no
    azurerm_security_center_automation (continuous export) or Sentinel
    data connector.

    References: MCSB v2 IR-2, IR-3; NIST SP 800-53 Rev. 5 IR-2, IR-4, IR-6, SI-4, IR-5; BSI IT-Grundschutz DER.1, DER.2.1; NIS2 Art. 21(2) (b).
- id: azure-defender-posture-data-exposure
  name: Defender for Cloud Vulnerability Data Exposure
  description: |
    Recommendations, attack paths and vulnerability findings are readable by
    anyone with Security Reader or Reader. That gives attackers a ready-made
    map of exploitable weaknesses.

    Attack scenario: A compromised account with subscription Reader exports
    Defender attack path analysis and vulnerability findings to choose
    targets.

    Impact: Accelerated reconnaissance.

    Severity: Low

    Terraform indicators: Reader / Security Reader assigned to large groups at
    management group or subscription scope.

    References: MCSB v2 PA-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1526, T1580.
- id: azure-ai-search-public-exposure
  name: AI Search Service Public Network Exposure
  description: |
    The search service endpoint is reachable from the public internet because public network access is left enabled and neither an IP firewall nor a private endpoint restricts it. Anyone holding a leaked query or admin key can call the service from any location.

    Attack scenario: An attacker extracts a query key from a client-side JavaScript bundle, calls <service>.search.windows.net and pages through indexes that mirror internal documents; with an admin key the attacker overwrites or deletes indexes.

    Impact: Disclosure of indexed business content, including RAG corpora and embeddings, and tampering with or deletion of search indexes.

    Severity: High

    Terraform indicators: azurerm_search_service.public_network_access_enabled = true (default); azurerm_search_service.allowed_ips empty or containing broad ranges; no azurerm_private_endpoint with subresource_names = ["searchService"].

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1530; Microsoft Learn: Azure AI Search security overview, Configure network access.
- id: azure-ai-search-key-authentication
  name: AI Search Shared API Key Authentication
  description: |
    Admin and query API keys are the only credential type in use, so callers are anonymous shared-secret holders. Keys carry no identity or expiry, are copied into application settings and cannot be limited per caller or audited per user.

    Attack scenario: A developer commits the admin key in a configuration file; an attacker who finds it deletes an index or exports every document and the activity is attributed only to "key".

    Impact: Full data-plane control of the service, undetectable attribution and long-lived access that survives employee turnover.

    Severity: High

    Terraform indicators: azurerm_search_service.local_authentication_enabled = true (default); azurerm_search_service.authentication_failure_mode unset; primary_key or query_keys referenced in outputs or app_settings; no azurerm_role_assignment with Search Index Data Reader or Search Index Data Contributor.

    References: MCSB v2 IM-1, IM-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1078.004, T1552.001; Microsoft Learn: Connect to Azure AI Search using role-based access controls.
- id: azure-ai-search-index-data-overexposure
  name: AI Search Index Returns Documents Beyond Caller Entitlement
  description: |
    A shared index holds documents from several sensitivity levels but queries are not trimmed to the caller's entitlements. Any application identity with query rights can retrieve content its end users must not see.

    Attack scenario: A RAG chatbot queries one index with a single service identity; a low-privileged user phrases a question that retrieves HR or finance chunks, which the language model then summarizes.

    Impact: Unauthorized disclosure of confidential documents through retrieval, bypassing the access controls of the source systems.

    Severity: High

    Terraform indicators: azurerm_role_assignment.role_definition_name = "Search Index Data Reader" granted to one application identity at service scope; single index covering multiple sensitivity groups; no per-document group filter field defined in the index schema.

    References: MCSB v2 IM-7, DP-2; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-6, AC-16, AC-4, SI-4; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (h); MITRE ATT&CK T1213; Microsoft Learn: Document-level access control in Azure AI Search.
- id: azure-ai-search-platform-key-encryption
  name: AI Search Data Encrypted Only With Platform Keys
  description: |
    Index content is encrypted at rest only with Microsoft-managed keys. The organization cannot revoke access to the data by disabling a key and cannot meet policies that require customer-managed keys.

    Attack scenario: During an incident the organization needs to cut off a compromised tenant's data immediately but has no key to disable; an auditor flags the missing customer control.

    Impact: Missing key-level kill switch and non-compliance with data sovereignty or sector requirements.

    Severity: Medium

    Terraform indicators: azurerm_search_service.customer_managed_key_enforcement_enabled = false (default); no customer-managed key configured on indexes; azurerm_key_vault_key not referenced by the search workload.

    References: MCSB v2 DP-5; NIST SP 800-53 Rev. 5 SC-12, SC-28; BSI IT-Grundschutz CON.1; NIS2 Art. 21(2) (h); MITRE ATT&CK T1530; Microsoft Learn: Configure customer-managed keys for data encryption in Azure AI Search.
- id: azure-ai-search-missing-logging
  name: AI Search Operations Not Logged
  description: |
    Operation and query logs are not sent to a central workspace, so index changes, key usage and bulk queries cannot be investigated.

    Attack scenario: An attacker runs thousands of queries with a stolen key and deletes an index; no log records exist to establish scope or time.

    Impact: Inability to detect or reconstruct data exfiltration and tampering.

    Severity: Medium

    Terraform indicators: azurerm_monitor_diagnostic_setting for the search service missing, or enabled_log { category = "OperationLogs" } absent.

    References: MCSB v2 LT-3; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b); MITRE ATT&CK T1070; Microsoft Learn: Monitor Azure AI Search.
- id: azure-ai-services-public-endpoint
  name: AI Services Account Public Endpoint Exposure
  description: |
    The account endpoint accepts requests from any network because public network access is enabled and network ACLs default to Allow. Models, fine-tuned assets and stored data are reachable with nothing but a key.

    Attack scenario: A leaked key is used from an attacker-controlled host to call the deployment, upload data or enumerate fine-tuning files; no network rule blocks the source.

    Impact: Data disclosure, unauthorized inference at the organization's cost and abuse of the deployment for harmful content.

    Severity: High

    Terraform indicators: azurerm_cognitive_account.public_network_access_enabled = true (default); azurerm_cognitive_account.network_acls.default_action = "Allow"; no azurerm_private_endpoint with subresource_names = ["account"]; azurerm_cognitive_account.custom_subdomain_name unset.

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1530; Microsoft Learn: Configure Azure AI Services virtual networks.
- id: azure-ai-services-api-key-exposure
  name: AI Services API Key Exposure and Key-Only Authentication
  description: |
    Applications authenticate with account keys that live in code, pipelines or logs while local authentication stays enabled. A key grants every operation on the account and carries no caller identity.

    Attack scenario: A key from a CI log is used to run bulk generation requests; the organization sees a cost spike and no attributable principal.

    Impact: Cost abuse (denial of wallet), data access through deployments and files, and no per-caller audit trail.

    Severity: High

    Terraform indicators: azurerm_cognitive_account.local_auth_enabled = true (default); azurerm_cognitive_account.identity missing; primary_access_key in outputs or app_settings; no azurerm_role_assignment with Cognitive Services OpenAI User.

    References: MCSB v2 IM-1, IM-3, IM-8; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1552.001, T1496.004; Microsoft Learn: Authenticate requests to Azure AI services, Azure OpenAI role-based access control.
- id: azure-ai-services-prompt-injection
  name: AI Services Prompt Injection and Content Safety Bypass
  description: |
    Untrusted user or document content is passed to the model without layered filtering, so instructions embedded in input override system prompts, extract confidential context or trigger unintended tool calls.

    Attack scenario: A support ticket stored in the knowledge base contains hidden instructions; when the assistant retrieves it, the model reveals the system prompt and sends internal data to an attacker-controlled URL through a tool.

    Impact: Disclosure of confidential context, policy bypass and unauthorized actions performed by the application on the model's behalf.

    Severity: High

    Terraform indicators: azurerm_cognitive_deployment.rai_policy_name unset or set to a permissive custom policy; content filter configured with annotate-only actions; azurerm_cognitive_account.outbound_network_access_restricted = false.

    References: MCSB v2 AI-2, AI-3; NIST SP 800-53 Rev. 5 SI-3, SI-4, AC-2, SA-8, SI-16; BSI IT-Grundschutz APP.3.1; NIS2 Art. 21(2) (e); MITRE ATT&CK T1190; Microsoft Learn: Prompt Shields in Azure AI Content Safety, Azure OpenAI content filtering.
- id: azure-ai-services-missing-logging
  name: AI Services Requests Not Logged
  description: |
    Audit and request logs are not exported, so misuse of keys, quota abuse and harmful content incidents cannot be reconstructed.

    Attack scenario: A tenant notices unexpected token consumption but cannot identify caller, deployment or time window.

    Impact: Delayed detection of abuse and weak evidence for incident response and regulatory inquiries.

    Severity: Medium

    Terraform indicators: azurerm_monitor_diagnostic_setting for the cognitive account missing, or enabled_log categories Audit, RequestResponse and AzureOpenAIRequestUsage absent.

    References: MCSB v2 LT-3; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b); MITRE ATT&CK T1070; Microsoft Learn: Monitor Azure OpenAI, Diagnostic settings for Azure AI services.
- id: azure-ai-services-unrestricted-outbound
  name: AI Services Unrestricted Outbound Access
  description: |
    The account may call arbitrary outbound destinations because outbound network access is not restricted to an allow list, for example when connecting data sources or processing URLs supplied by users.

    Attack scenario: An attacker supplies a URL or data source pointing at an internal or attacker-controlled endpoint; the service fetches it, and results or tokens flow out of the intended boundary.

    Impact: Server-side request forgery style abuse and exfiltration of data through the service's egress path.

    Severity: Medium

    Terraform indicators: azurerm_cognitive_account.outbound_network_access_restricted = false (default); azurerm_cognitive_account.fqdns empty.

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1567; Microsoft Learn: Configure Azure AI Services virtual networks, outbound access.
- id: azure-api-center-test-console-credential-exposure
  name: API Center Test Console Exposes Stored API Credentials
  description: |
    When API keys or OAuth 2.0 client secrets are stored in the API Center authentication configuration, every portal user with access to the API can invoke it with those credentials in the test console. Credentials become shared among all portal viewers.

    Attack scenario: A contractor with portal access invokes an internal API through the test console using the stored production key and then calls the gateway directly with the same key obtained from a captured request.

    Impact: Unauthorized API use and credential leakage to a broad audience.

    Severity: Medium

    Terraform indicators: azapi_resource Microsoft.ApiCenter/services authentication configuration with a stored key or secret; azurerm_role_assignment.role_definition_name = "Azure API Center Data Reader" granted to broad groups.

    References: MCSB v2 IM-8, IM-7; NIST SP 800-53 Rev. 5 IA-5, SI-4, RA-5, SC-12, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (h), (i); MITRE ATT&CK T1078.004; Microsoft Learn: Authorize access to APIs in Azure API Center.
- id: azure-api-center-broad-key-vault-access
  name: API Center Identity Has Excessive Key Vault Rights
  description: |
    The managed identity of the API Center holds more than the Key Vault Secrets User role or an access policy with broad permissions. Compromise of the identity exposes every secret in the vault.

    Attack scenario: An attacker with Contributor on the API Center adds an authentication configuration that references arbitrary secrets and reads them through the portal.

    Impact: Disclosure of secrets that are unrelated to API Center.

    Severity: High

    Terraform indicators: azurerm_role_assignment.role_definition_name = "Key Vault Administrator" or "Key Vault Secrets Officer" on the vault for the API Center identity; azurerm_key_vault_access_policy with secret_permissions containing "Set" or "Delete".

    References: MCSB v2 PA-7, IM-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, AC-16; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1078.004, T1555; Microsoft Learn: Authorize access to APIs in Azure API Center.
- id: azure-api-center-unregistered-api
  name: APIs Operated Outside the API Center Inventory
  description: |
    APIs that are not registered in the inventory run without governance review. Their authentication, versions and deprecation status are unknown to the security team.

    Attack scenario: A team publishes a beta API on App Service without authentication; because it is absent from the inventory, no scanner or review ever covers it.

    Impact: Shadow APIs with weak controls become entry points for data exposure and injection.

    Severity: Medium

    Terraform indicators: azurerm_api_management_api or azurerm_linux_web_app exposing HTTP endpoints without a matching API Center API registration; no linked environment for the gateway.

    References: MCSB v2 AM-2; NIST SP 800-53 Rev. 5 CM-7, SA-3, SA-8; BSI IT-Grundschutz OPS.2.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1190; Microsoft Learn: Azure API Center overview.
- id: azure-api-management-public-exposure
  name: API Management Gateway and Management Endpoints Publicly Reachable
  description: |
    The instance is not injected into a virtual network and public network access stays enabled, so the gateway, management API, developer portal and SCM endpoints are reachable from the internet without perimeter filtering.

    Attack scenario: An attacker probes <service>.management.azure-api.net and the developer portal for weak credentials or exposed APIs and reaches backends that were meant to be internal-only.

    Impact: Direct access to backend APIs, brute force on management interfaces and missing edge protection.

    Severity: High

    Terraform indicators: azurerm_api_management.virtual_network_type = "None" (default); azurerm_api_management.public_network_access_enabled = true; azurerm_api_management.virtual_network_configuration absent; no azurerm_application_gateway or Front Door in front.

    References: MCSB v2 NS-2, NS-1; NIST SP 800-53 Rev. 5 SC-7, AC-4, SC-32, CM-7; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1190, T1530; Microsoft Learn: Azure API Management virtual network concepts, Security baseline for API Management.
- id: azure-api-management-weak-tls-protocols
  name: API Management Legacy Protocols and Ciphers Enabled
  description: |
    Legacy TLS and SSL versions or weak ciphers are enabled on the frontend or toward backends, and APIs allow plain HTTP. Traffic and subscription keys can be downgraded and captured.

    Attack scenario: A client on an untrusted network is forced down to TLS 1.0 and a CBC cipher; an adversary-in-the-middle records the Ocp-Apim-Subscription-Key header.

    Impact: Disclosure of API payloads and subscription keys and weakened integrity of backend calls.

    Severity: High

    Terraform indicators: azurerm_api_management.security.frontend_tls10_enabled = true; backend_tls10_enabled = true; triple_des_ciphers_enabled = true; azurerm_api_management_api.protocols containing "http".

    References: MCSB v2 DP-3, NS-8; NIST SP 800-53 Rev. 5 SC-8, SC-13, IA-5; BSI IT-Grundschutz CON.1, NET.1.1, NET.3.2; NIS2 Art. 21(2) (h), (a); MITRE ATT&CK T1040, T1557; Microsoft Learn: Manage protocols and ciphers in Azure API Management.
- id: azure-api-management-legacy-platform-config
  name: API Management Legacy Platform and Control-Plane Settings
  description: |
    The instance runs on an older compute platform or accepts outdated management API versions, and client certificate or gateway restrictions are left at defaults. Known weaknesses in legacy components stay exploitable.

    Attack scenario: An attacker uses a deprecated control-plane API version that lacks newer authorization checks to alter policies on a production gateway.

    Impact: Exploitation of known weaknesses, unauthorized policy changes and loss of vendor support.

    Severity: Medium

    Terraform indicators: azurerm_api_management.min_api_version unset; azurerm_api_management.sku_name = "Developer_1" used in production; azurerm_api_management.client_certificate_enabled = false where mutual TLS is required.

    References: MCSB v2 PV-2, AM-2; NIST SP 800-53 Rev. 5 CM-2, CM-3, CM-6, CM-7, SA-3, SA-8; BSI IT-Grundschutz OPS.2.2, OPS.1.1.3; NIS2 Art. 21(2) (a), (e); MITRE ATT&CK T1190; Microsoft Learn: API Management stv2 platform migration.
- id: azure-api-management-missing-api-authentication
  name: API Management APIs Without Authentication or Authorization Policy
  description: |
    APIs are published without a subscription requirement and without validate-jwt or equivalent policy, so the gateway forwards anonymous calls to backends that assume the gateway authenticated callers.

    Attack scenario: An attacker calls a published operation without any key; the gateway forwards the request, and the backend, trusting the gateway, returns customer records.

    Impact: Unauthenticated access to backend data and functions.

    Severity: Critical

    Terraform indicators: azurerm_api_management_api.subscription_required = false; azurerm_api_management_policy.xml_content or azurerm_api_management_api_policy without validate-jwt, validate-azure-ad-token or ip-filter elements.

    References: MCSB v2 IM-1, NS-6; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, APP.3.1, NET.1.1, NET.3.2; NIS2 Art. 21(2) (i), (j), (e); MITRE ATT&CK T1190; Microsoft Learn: Protect APIs with validate-jwt policy, Security baseline for API Management.
- id: azure-api-management-subscription-key-and-secret-leakage
  name: API Management Subscription Keys and Named Value Secrets Leaked
  description: |
    Subscription keys are issued at all-APIs scope, tracing is enabled, and secrets are stored as plain named values instead of Key Vault references. Keys can appear in trace output, Terraform state and portal exports.

    Attack scenario: A tester enables allow_tracing on a subscription and shares a trace; the trace exposes the key and backend credentials, which an attacker reuses against production.

    Impact: Credential leakage enabling unauthorized API use and backend access.

    Severity: High

    Terraform indicators: azurerm_api_management_subscription.allow_tracing = true; azurerm_api_management_subscription.api_id null (all APIs); azurerm_api_management_named_value.secret = true with inline value instead of value_from_key_vault.

    References: MCSB v2 IM-8; NIST SP 800-53 Rev. 5 IA-5, SI-4, RA-5, SC-12, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (h), (i); MITRE ATT&CK T1552.001; Microsoft Learn: Secure API Management named values with Key Vault, Subscriptions in API Management.
- id: azure-app-configuration-public-exposure
  name: App Configuration Store Public Network Exposure
  description: |
    The store is reachable from the internet and has no private endpoint. Access keys or a stolen token are enough to read endpoints, feature flags and Key Vault references from any location.

    Attack scenario: An attacker with a leaked connection string reads every key-value including internal service URLs and writes a feature flag that disables an authorization check.

    Impact: Disclosure of internal topology and secrets and tampering with runtime behaviour.

    Severity: High

    Terraform indicators: azurerm_app_configuration.public_network_access = "Enabled"; no azurerm_private_endpoint with subresource_names = ["configurationStores"]; azurerm_app_configuration.sku = "free" which does not support private link.

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1530; Microsoft Learn: Use private endpoints for Azure App Configuration.
- id: azure-app-configuration-access-key-authentication
  name: App Configuration Access Keys and Connection Strings
  description: |
    Local authentication with access keys remains enabled. Read-write connection strings give full control over settings, bypass Entra ID conditional access and are copied into pipelines and app settings.

    Attack scenario: A read-write connection string from a pipeline variable is used to change a feature flag in production, appearing as "key" access only.

    Impact: Unauthorized configuration changes with no identity attribution.

    Severity: High

    Terraform indicators: azurerm_app_configuration.local_auth_enabled = true (default); primary_read_key, primary_write_key or connection_string referenced in outputs or app_settings.

    References: MCSB v2 IM-1, IM-8; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1552.001, T1078.004; Microsoft Learn: Disable access key authentication in Azure App Configuration.
- id: azure-app-configuration-platform-key-encryption
  name: App Configuration Data Encrypted Only With Platform Keys
  description: |
    Configuration values are encrypted with Microsoft-managed keys only, so the organization cannot revoke data access via its own key or satisfy customer-managed key requirements.

    Attack scenario: A regulator requires customer-managed keys for configuration that holds personal data references; the store cannot comply.

    Impact: Non-compliance and missing key-level control over stored settings.

    Severity: Low

    Terraform indicators: azurerm_app_configuration.encryption block absent; azurerm_app_configuration.sku = "free" (customer-managed keys need Standard or higher); no identity block with key access.

    References: MCSB v2 DP-5; NIST SP 800-53 Rev. 5 SC-12, SC-28; BSI IT-Grundschutz CON.1; NIS2 Art. 21(2) (h); MITRE ATT&CK T1530; Microsoft Learn: Use customer-managed keys to encrypt App Configuration data.
- id: azure-app-configuration-deletion-without-recovery
  name: App Configuration Store Deleted Without Recovery
  description: |
    Soft delete retention is short and purge protection is disabled, so deleting or purging a store removes settings and feature flags permanently and takes dependent applications down.

    Attack scenario: An operator with Owner rights, or ransomware using stolen credentials, deletes and purges the store; all applications that read configuration fail on restart.

    Impact: Application outage and permanent loss of configuration and feature flag history.

    Severity: Medium

    Terraform indicators: azurerm_app_configuration.purge_protection_enabled = false (default); azurerm_app_configuration.soft_delete_retention_days = 1; no azurerm_management_lock on the store.

    References: MCSB v2 BR-2; NIST SP 800-53 Rev. 5 CP-9, SC-12, SC-13, SC-28; BSI IT-Grundschutz CON.3; NIS2 Art. 21(2) (c); MITRE ATT&CK T1485; Microsoft Learn: App Configuration soft delete and purge protection.
- id: azure-app-insights-key-and-connection-string-misuse
  name: Application Insights Instrumentation Key Treated as Credential
  description: |
    The instrumentation key and connection string are treated as secrets but are only identifiers, and local authentication is enabled. Anyone who can read the app setting or client-side code can send arbitrary telemetry.

    Attack scenario: An attacker copies the connection string from a browser bundle and floods the resource with forged telemetry that masks real events or inflates cost.

    Impact: Poisoned monitoring data, hidden malicious activity and cost spikes.

    Severity: Medium

    Terraform indicators: azurerm_application_insights.local_authentication_enabled = true (default); connection_string or instrumentation_key in azurerm_linux_web_app.app_settings, outputs or client code.

    References: MCSB v2 IM-1; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i), (j); MITRE ATT&CK T1078.004, T1565; Microsoft Learn: Microsoft Entra authentication for Application Insights, Connection strings in Application Insights.
- id: azure-app-insights-sensitive-telemetry
  name: Application Insights Captures Sensitive Data in Telemetry
  description: |
    Telemetry includes URLs with tokens, request bodies, user identifiers and exception messages that contain personal or secret data. Everyone with workspace read access can see it, and retention keeps it long after the incident.

    Attack scenario: A query string with a password reset token is logged as a request URL; a reader with Log Analytics Reader copies it and takes over the account.

    Impact: Disclosure of personal data and secrets and compliance violations under data protection rules.

    Severity: Medium

    Terraform indicators: azurerm_application_insights.ip_masking_enabled = false; azurerm_application_insights.sampling_percentage = 100 with verbose collection; azurerm_application_insights.retention_in_days = 730.

    References: MCSB v2 DP-2, DP-1; NIST SP 800-53 Rev. 5 AC-4, SI-4, RA-2, SC-28; BSI IT-Grundschutz CON.1, ORP.4; NIS2 Art. 21(2) (h), (i); MITRE ATT&CK T1530; Microsoft Learn: Data collection, retention and storage in Application Insights.
- id: azure-app-insights-public-ingestion-and-query
  name: Application Insights Public Ingestion and Query Endpoints
  description: |
    Ingestion and query are allowed from public networks and the resource is not linked to a protected Log Analytics workspace. Telemetry can be injected or read from outside the corporate network.

    Attack scenario: An attacker queries the API with a leaked API key from the internet to read exception traces, or injects forged events.

    Impact: Disclosure of operational data and manipulation of monitoring signals.

    Severity: Medium

    Terraform indicators: azurerm_application_insights.internet_ingestion_enabled = true (default); azurerm_application_insights.internet_query_enabled = true (default); azurerm_application_insights.workspace_id missing for a classic resource.

    References: MCSB v2 NS-2, LT-3; NIST SP 800-53 Rev. 5 SC-7, AC-4, AU-2, AU-3, AU-6, AU-12; BSI IT-Grundschutz NET.1.1, NET.3.2, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (a), (b); MITRE ATT&CK T1530; Microsoft Learn: Use Azure Private Link to connect networks to Azure Monitor.
- id: azure-app-insights-ingestion-flooding
  name: Application Insights Ingestion Flooding Hides Activity
  description: |
    Excess telemetry exhausts the daily cap or sampling budget, after which genuine events are dropped, or the cost grows without bound when no cap exists.

    Attack scenario: An attacker with the connection string sends millions of synthetic events; the daily cap is reached by noon and real exceptions after that point are not stored.

    Impact: Loss of monitoring for the rest of the day or an unexpected bill.

    Severity: Low

    Terraform indicators: azurerm_application_insights.daily_data_cap_in_gb at default 100 or set too low; azurerm_application_insights.daily_data_cap_notifications_enabled = false.

    References: MCSB v2 LT-5; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-7, AU-12, SI-4; BSI IT-Grundschutz OPS.1.1.5, DER.1, NET.1.1; NIS2 Art. 21(2) (b), (c); MITRE ATT&CK T1499; Microsoft Learn: Manage usage and costs for Application Insights.
- id: azure-arc-managed-identity-key-theft
  name: Arc-Enabled Server Managed Identity Credential Theft
  description: |
    The system-assigned managed identity of an Arc-enabled server authenticates with a certificate stored on the server disk. Anyone with local administrator rights or offline access to the volume can obtain tokens and act as the server in Azure.

    Attack scenario: An attacker with administrator rights on a branch-office server requests tokens from the local himds endpoint or copies the identity certificate and uses it from another host.

    Impact: Impersonation of the server against every Azure resource it has been granted access to.

    Severity: High

    Terraform indicators: azurerm_arc_machine.identity { type = "SystemAssigned" }; azurerm_role_assignment granting broad roles to the machine principal_id; volume encryption not enforced by policy.

    References: MCSB v2 IM-3, DP-4; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-4, IA-5, IA-9; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (h); MITRE ATT&CK T1078.004, T1552; Microsoft Learn: Azure Arc-enabled servers security overview, Identity and access management for Arc-enabled servers.
- id: azure-arc-extension-code-execution
  name: Arc Extension Deployment Yields Root Access
  description: |
    Principals with Contributor, Owner or the Connected Machine Resource Administrator role can deploy extensions such as Custom Script, which run as SYSTEM or root on the server.

    Attack scenario: A cloud contributor deploys a custom script extension on a domain-joined Arc server and obtains domain admin credentials from memory.

    Impact: Privilege escalation from Azure RBAC to full control of on-premises or multicloud servers.

    Severity: High

    Terraform indicators: azurerm_role_assignment.role_definition_name = "Contributor" or "Owner" scoped to Arc machines; azurerm_arc_machine_extension with type = "CustomScriptExtension" or "CustomScript".

    References: MCSB v2 PA-7, PA-1; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1651, T1078.004; Microsoft Learn: Identity and access management for Azure Arc-enabled servers.
- id: azure-arc-onboarding-credential-abuse
  name: Arc Onboarding Service Principal With Long-Lived Secret
  description: |
    Servers are onboarded with a service principal that authenticates with a long-lived or shared client secret and that is not limited to the target resource group.

    Attack scenario: A secret embedded in an installation script is read from a file share and used to register rogue machines under the production subscription.

    Impact: Rogue server registration, a foothold in the subscription and policy or extension exposure on attacker-controlled machines.

    Severity: Medium

    Terraform indicators: azuread_service_principal_password.end_date far in the future; azurerm_role_assignment of "Azure Connected Machine Onboarding" at subscription scope; no azuread_application_certificate.

    References: MCSB v2 IM-8, PA-7; NIST SP 800-53 Rev. 5 IA-5, SI-4, RA-5, SC-12, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (h), (i); MITRE ATT&CK T1078.004, T1136.003; Microsoft Learn: Connect hosts at scale using a service principal.
- id: azure-automation-public-exposure
  name: Automation Account Public Network Exposure
  description: |
    The account's webhook and agent service endpoints are reachable from the internet because public access is enabled and no private link restricts them. Stolen credentials or webhook URLs work from any network.

    Attack scenario: An attacker holding a webhook URL calls it from the internet to start a privileged runbook.

    Impact: Remote triggering of privileged automation and exposure of job data.

    Severity: High

    Terraform indicators: azurerm_automation_account.public_network_access_enabled = true (default); no azurerm_private_endpoint with subresource_names = ["Webhook"] or ["DSCAndHybridWorker"].

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1530, T1190; Microsoft Learn: Secure Azure Automation with private endpoints.
- id: azure-automation-plaintext-credentials-and-variables
  name: Automation Credentials and Variables Stored Unencrypted
  description: |
    Variables are stored with encrypted = false and credentials are kept as account assets with usernames and passwords. Anyone with account read rights or runbook authoring rights can read them, and keys remain platform-managed.

    Attack scenario: A user with Automation Contributor writes a runbook that outputs every stored credential and variable and reads the job output.

    Impact: Disclosure of passwords and API keys used by automation and lateral movement to the systems they protect.

    Severity: High

    Terraform indicators: azurerm_automation_variable_string.encrypted = false; azurerm_automation_credential.password in Terraform state; azurerm_automation_account.encryption block absent.

    References: MCSB v2 DP-4, DP-5, IM-8; NIST SP 800-53 Rev. 5 SC-28, SC-12, IA-5, SI-4, RA-5, SC-13; BSI IT-Grundschutz CON.1, ORP.4; NIS2 Art. 21(2) (h), (i); MITRE ATT&CK T1552.001; Microsoft Learn: Manage credentials in Azure Automation, Encryption of secure assets in Azure Automation.
- id: azure-automation-local-authentication
  name: Automation Account Local Authentication and Run As Credentials
  description: |
    Local authentication stays enabled and runbooks authenticate with stored credentials or legacy Run As accounts instead of a managed identity. Secrets must be rotated manually and bypass Entra ID controls.

    Attack scenario: A legacy Run As certificate with Contributor on the subscription is exported by an administrator and used outside Azure for years.

    Impact: Long-lived credential exposure and no conditional access over automation identities.

    Severity: Medium

    Terraform indicators: azurerm_automation_account.local_authentication_enabled = true (default); azurerm_automation_account.identity absent; azurerm_automation_certificate or azurerm_automation_connection_service_principal in use.

    References: MCSB v2 IM-1, IM-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i), (j); MITRE ATT&CK T1078.004; Microsoft Learn: Using a system-assigned managed identity for an Azure Automation account.
- id: azure-automation-runbook-privilege-escalation
  name: Automation Runbook Authoring Escalates to Identity Rights
  description: |
    The account's managed identity holds Contributor or Owner on a subscription, and users with Automation Contributor can edit runbooks. Editing a runbook lets them act with the identity's rights without holding those rights themselves.

    Attack scenario: A user with only Automation Contributor publishes a runbook that assigns Owner to their account and starts it as a job.

    Impact: Privilege escalation across subscriptions and full control of the resources the identity can manage.

    Severity: High

    Terraform indicators: azurerm_role_assignment { principal_id = azurerm_automation_account.<name>.identity[0].principal_id, role_definition_name = "Contributor" or "Owner" }; azurerm_role_assignment of "Automation Contributor" to broad groups; azurerm_automation_runbook.content changed outside CI/CD.

    References: MCSB v2 PA-7, PA-1; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1078.004, T1098; Microsoft Learn: Azure Automation security guidelines.
- id: azure-automation-webhook-url-exposure
  name: Automation Webhook URL Used as Bearer Secret
  description: |
    A webhook URL contains its own security token and is the only protection of the endpoint. Anyone who reads the URL from a script, log or chat can start the runbook with their own parameters.

    Attack scenario: A webhook URL pasted into a ticket is replayed to trigger a runbook that creates users, with attacker-chosen parameters.

    Impact: Unauthorized execution of privileged automation and parameter injection into runbooks.

    Severity: Medium

    Terraform indicators: azurerm_automation_webhook.uri output or logged; azurerm_automation_webhook.expiry_time far in the future; azurerm_automation_webhook.enabled = true on runbooks that run with privileged identities.

    References: MCSB v2 IM-8; NIST SP 800-53 Rev. 5 IA-5, SI-4, RA-5, SC-12, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (h), (i); MITRE ATT&CK T1552.001, T1651; Microsoft Learn: Start an Azure Automation runbook from a webhook.
- id: azure-avd-desktop-group-overexposure
  name: AVD Full Desktop Published Where RemoteApp Suffices
  description: |
    A Desktop-type application group, often the default one created by the portal, is registered to the workspace and assigned to a large group, although users only need a few applications. Each user receives a full desktop on the shared host and can reach its data, tools and network.

    Attack scenario: A user in an all-staff group launches the published desktop, opens a command shell, scans the subnet and reads files left by other users on the pooled host.

    Impact: Larger attack surface and access to data and tools outside the job role.

    Severity: Medium

    Terraform indicators: azurerm_virtual_desktop_application_group.type = "Desktop" assigned through azurerm_role_assignment (Desktop Virtualization User) to broad groups; azurerm_virtual_desktop_host_pool.preferred_app_group_type = "Desktop" (default).

    References: MCSB v2 IM-7, PA-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-6, AC-16, AC-5; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1078; Microsoft Learn: Deploy Azure Virtual Desktop, Azure Virtual Desktop security recommendations.
- id: azure-avd-host-pool-identity-overprivileged
  name: AVD Host Pool Identity Reads More Secrets Than Needed
  description: |
    The host pool managed identity holds Key Vault Secrets User on the whole vault or an access policy with Get on all secrets, although it only needs the local administrator and domain join secrets.

    Attack scenario: An attacker who compromises the deployment workload uses the identity to list and read every secret in the vault, including unrelated application credentials.

    Impact: Exposure of domain-join and local administrator credentials and of unrelated secrets stored in the same vault.

    Severity: High

    Terraform indicators: azurerm_role_assignment { role_definition_name = "Key Vault Secrets User", scope = azurerm_key_vault.<name>.id }; azurerm_key_vault_access_policy.secret_permissions containing "Get" and "List".

    References: MCSB v2 PA-7, IM-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, AC-16; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (h); MITRE ATT&CK T1552.001, T1555; Microsoft Learn: Deploy Azure Virtual Desktop prerequisites, Azure RBAC for Key Vault.
- id: azure-avd-domain-join-account-overprivileged
  name: AVD Domain Join Account With Extended Rights on the Session Host OU
  description: |
    The domain join account holds reset-password, validated-write and account-restriction rights on all computer objects in the session host OU, and the password sits in extension settings or Terraform state. The account can take over existing computer accounts.

    Attack scenario: An attacker reads the join password from Terraform state, resets the password of a session host computer object and impersonates the host to read user sessions.

    Impact: Lateral movement across the session host OU and takeover of existing host identities.

    Severity: High

    Terraform indicators: azurerm_virtual_machine_extension { type = "JsonADDomainExtension" } with protected_settings containing the password and settings.ou_path pointing at a broad OU; password passed from azurerm_key_vault_secret without ephemeral handling.

    References: MCSB v2 PA-7, IM-8; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, IA-5, SI-4; BSI IT-Grundschutz ORP.4, CON.1, APP.2.2; NIS2 Art. 21(2) (i), (h); MITRE ATT&CK T1078.002; Microsoft Learn: Deploy Azure Virtual Desktop prerequisites, KB5020276 computer account reuse.
- id: azure-avd-scaling-plan-excessive-rights
  name: AVD Scaling Plan Principal With Destructive VM Rights
  description: |
    Power On Off Contributor and Virtual Machine Contributor are assigned to the Azure Virtual Desktop service principal at subscription scope, and the power role itself can sign out users and write host pool settings. Compromise of the principal or a mistaken plan can stop or delete VMs far beyond the host pool.

    Attack scenario: An attacker who holds the Power On Off Contributor role schedules a ramp-down that deallocates every session host during business hours and force-logs users off.

    Impact: Loss of desktop availability, lost unsaved user work and destruction of unrelated VMs in the same subscription.

    Severity: High

    Terraform indicators: azurerm_role_assignment { role_definition_name = "Desktop Virtualization Power On Off Contributor" or "Virtual Machine Contributor", scope = "/subscriptions/<id>" }; azurerm_virtual_desktop_scaling_plan.schedule.ramp_down_force_logoff_users = true; no exclusion_tag.

    References: MCSB v2 PA-7, IM-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, AC-16; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1489, T1078.004; Microsoft Learn: Create and assign an autoscale scaling plan for Azure Virtual Desktop.
- id: azure-avd-session-host-unrestricted-egress
  name: AVD Session Hosts With Unrestricted Internet Egress
  description: |
    Session hosts can reach any internet destination because no firewall, NVA or proxy controls outbound traffic and default outbound access is on. Malware in a user session can download payloads and upload stolen data.

    Attack scenario: A user opens a phishing attachment; the payload contacts a command-and-control server and uploads profile data to an external storage account without any block.

    Impact: Data exfiltration and persistent remote control of shared session hosts.

    Severity: High

    Terraform indicators: azurerm_subnet.default_outbound_access_enabled = true (default); azurerm_subnet_route_table_association missing or azurerm_route_table with no 0.0.0.0/0 route to a firewall; azurerm_network_security_rule allowing Internet destination on all ports.

    References: MCSB v2 NS-3, NS-1; NIST SP 800-53 Rev. 5 SC-7, AC-4, SI-4, SC-32, CM-7; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1071, T1567; Microsoft Learn: Azure Virtual Desktop security recommendations, Default outbound access in Azure.
- id: azure-avd-session-host-shared-local-admin
  name: AVD Session Hosts Share a Static Local Administrator Password
  description: |
    Every session host is built with the same local administrator password and no LAPS rotation. Compromise of one host yields credentials that work on all others.

    Attack scenario: An attacker with SYSTEM on one pooled host dumps the local account hash and replays it against the other hosts in the pool.

    Impact: Administrative control of every session host and access to all user sessions.

    Severity: High

    Terraform indicators: azurerm_windows_virtual_machine.admin_password taken from one variable for all hosts; no azurerm_virtual_machine_extension or Intune policy that enables Windows LAPS.

    References: MCSB v2 IM-8, PA-7; NIST SP 800-53 Rev. 5 IA-5, SI-4, RA-5, SC-12, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (h), (i); MITRE ATT&CK T1078.003; Microsoft Learn: Azure Virtual Desktop identity and access management recommendations, Windows LAPS.
- id: azure-avd-session-host-user-admin-rights
  name: AVD Users Hold Administrator Rights on Session Hosts
  description: |
    Users are members of the local Administrators group or hold the Virtual Machine Administrator Login role, so they can install software, disable controls and read other users' data on shared hosts.

    Attack scenario: A user installs a credential-harvesting tool, disables Defender and reads the profile of another user on the same pooled host.

    Impact: Malware persistence, tampering with endpoint protection and access to other users' data.

    Severity: High

    Terraform indicators: azurerm_role_assignment { role_definition_name = "Virtual Machine Administrator Login" } for user groups on session hosts; azurerm_virtual_machine_extension adding users to the Administrators group.

    References: MCSB v2 PA-1, PA-7; NIST SP 800-53 Rev. 5 AC-2, AC-5, AC-6, AC-3; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1078.003, T1548; Microsoft Learn: Azure Virtual Desktop security recommendations.
- id: azure-avd-session-host-no-endpoint-protection
  name: AVD Session Hosts Without Endpoint Protection or EDR
  description: |
    Session hosts run without endpoint protection or an EDR agent, so executed payloads and movement between sessions are not detected on multi-session machines.

    Attack scenario: A malicious download runs in one user's session and injects into a second user's process; no agent raises an alert.

    Impact: Compromise of shared hosts and of every user on them.

    Severity: High

    Terraform indicators: no azurerm_virtual_machine_extension of type "MDE.Windows" on the session host; azurerm_security_center_subscription_pricing { resource_type = "VirtualMachines", tier = "Free" }.

    References: MCSB v2 ES-1, ES-2; NIST SP 800-53 Rev. 5 SI-4, IR-4, SI-3; BSI IT-Grundschutz OPS.1.1.4, SYS.1.5, SYS.1.1; NIS2 Art. 21(2) (g), (e); MITRE ATT&CK T1204; Microsoft Learn: Azure Virtual Desktop security recommendations, Defender for Endpoint on AVD.
- id: azure-avd-fslogix-av-exclusion-malware
  name: AVD Antivirus Exclusions for Profile Containers Hide Malware
  description: |
    Antivirus excludes whole FSLogix profile folders or all VHD extensions without scoping, so files placed in a mounted profile container are never scanned.

    Attack scenario: A user stores a payload in their profile container; it persists across sessions and executes on any host that mounts the container, bypassing real-time scanning.

    Impact: Persistent malware that survives reimaging of session hosts and bypasses endpoint protection.

    Severity: Medium

    Terraform indicators: azurerm_virtual_machine_extension.settings with Add-MpPreference -ExclusionPath covering the profile share path or all *.vhd and *.vhdx extensions.

    References: MCSB v2 ES-2, ES-3; NIST SP 800-53 Rev. 5 SI-3, SI-2; BSI IT-Grundschutz OPS.1.1.4; NIS2 Art. 21(2) (g); MITRE ATT&CK T1204; Microsoft Learn: FSLogix prerequisites and antivirus exclusions.
- id: azure-avd-idle-session-unlocked
  name: AVD Idle Sessions Not Locked or Disconnected
  description: |
    No idle timeout, disconnect or logoff policy and no screen lock is configured, so unattended sessions stay signed in and remain usable by anyone with access to the client device.

    Attack scenario: A user leaves a shared kiosk device; the next person resumes the still-connected session and reads open documents and mail.

    Impact: Unauthorized access to open applications, files and data of the previous user.

    Severity: Low

    Terraform indicators: azurerm_virtual_desktop_host_pool.custom_rdp_properties without session timeout settings; no Intune or Group Policy setting for MaxIdleTime and MaxDisconnectionTime.

    References: MCSB v2 PV-3; NIST SP 800-53 Rev. 5 CM-2, CM-6, SC-28; BSI IT-Grundschutz OPS.2.2, OPS.1.1.3; NIS2 Art. 21(2) (a), (e); MITRE ATT&CK T1078; Microsoft Learn: Azure Virtual Desktop security recommendations, Configure session timeouts.
- id: azure-backup-vault-single-admin-destruction
  name: Backup Vault Destruction by a Single Administrator
  description: |
    Critical operations such as disabling soft delete, reducing retention or stopping protection require no second approval. One administrator or one stolen identity with vault rights can destroy all recovery points.

    Attack scenario: An attacker obtains a Backup Contributor identity, stops protection and deletes recovery points before encrypting production data.

    Impact: Loss of all backups and inability to recover from ransomware or sabotage.

    Severity: Critical

    Terraform indicators: azurerm_data_protection_resource_guard missing or not associated with the vault; azurerm_role_assignment { role_definition_name = "Backup Contributor" or "Owner" } granted to the same administrators that manage the workload.

    References: MCSB v2 BR-2, PA-1; NIST SP 800-53 Rev. 5 CP-9, SC-12, SC-13, SC-28, AC-2, AC-5; BSI IT-Grundschutz CON.3, ORP.4; NIS2 Art. 21(2) (c), (i); MITRE ATT&CK T1485, T1490; Microsoft Learn: Multi-user authorization using Resource Guard, Azure Backup security best practices.
- id: azure-backup-vault-soft-delete-disabled
  name: Backup Soft Delete Disabled or Retention Too Short
  description: |
    Soft delete protects deleted backup data for a retention window, but it can still be switched off for Backup vaults in regions where secure-by-default enforcement is not yet generally available, and the default 14 days can expire before a slow or delayed attack is noticed.

    Attack scenario: An attacker with delete rights waits for the 14-day window to pass, or disables soft delete where it is still configurable, then removes the backup items of every VM.

    Impact: Permanent loss of recovery points.

    Severity: High

    Terraform indicators: azurerm_data_protection_backup_vault.soft_delete = "Off"; azurerm_data_protection_backup_vault.retention_duration_in_days = 14 (default) for critical data; soft delete state of the Recovery Services vault not set to always-on.

    References: MCSB v2 BR-2; NIST SP 800-53 Rev. 5 CP-9, SC-12, SC-13, SC-28; BSI IT-Grundschutz CON.3; NIS2 Art. 21(2) (c); MITRE ATT&CK T1485; Microsoft Learn: Secure by default with soft delete for Azure Backup, Soft delete for Azure Backup.
- id: azure-backup-vault-mutable-recovery-points
  name: Backup Recovery Points Can Be Deleted Before Expiry
  description: |
    Immutability is not enabled or not locked, so recovery points can be deleted or their retention shortened before expiry by anyone with sufficient rights.

    Attack scenario: Ransomware operators who hold compromised credentials shorten retention to one day and let the backup service expire every recovery point.

    Impact: Backups destroyed by credentials that were already compromised.

    Severity: High

    Terraform indicators: azurerm_recovery_services_vault.immutability = "Disabled" (default) or "Unlocked"; azurerm_data_protection_backup_vault.immutability = "Disabled" or "Unlocked".

    References: MCSB v2 BR-2; NIST SP 800-53 Rev. 5 CP-9, SC-12, SC-13, SC-28; BSI IT-Grundschutz CON.3; NIS2 Art. 21(2) (c); MITRE ATT&CK T1490, T1485; Microsoft Learn: Immutable vault for Azure Backup.
- id: azure-backup-vault-public-network-access
  name: Backup Vault Reachable From Public Networks
  description: |
    The vault accepts requests from the public internet although Azure Backup supports private endpoints, so stolen credentials can be used from any location to browse or restore backup data.

    Attack scenario: An attacker with a stolen token restores a database backup to an attacker-controlled storage account from the internet.

    Impact: Disclosure of full copies of production data.

    Severity: Medium

    Terraform indicators: azurerm_recovery_services_vault.public_network_access_enabled = true (default); no azurerm_private_endpoint with subresource_names = ["AzureBackup"].

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1530; Microsoft Learn: Private endpoints for Azure Backup.
- id: azure-backup-vault-restore-exfiltration
  name: Backup Data Exfiltrated Through Restore Operations
  description: |
    Backup roles allow restoring data to arbitrary targets, including storage accounts or regions chosen by the caller. Backups hold full copies of production data and often bypass the access controls that protect the source.

    Attack scenario: A user holding Backup Operator restores a production SQL backup to a storage account in another subscription that the user controls and downloads it.

    Impact: Mass disclosure of sensitive data without touching the production resource.

    Severity: High

    Terraform indicators: azurerm_role_assignment { role_definition_name = "Backup Operator" or "Backup Contributor" } at subscription scope; azurerm_recovery_services_vault.cross_region_restore_enabled = true without restricted target scope.

    References: MCSB v2 DP-2, PA-7; NIST SP 800-53 Rev. 5 AC-4, SI-4, AC-2, AC-3, AC-5, AC-6; BSI IT-Grundschutz CON.1, ORP.4, CON.3; NIS2 Art. 21(2) (h), (i), (c); MITRE ATT&CK T1530, T1537; Microsoft Learn: Azure Backup security best practices, Azure Backup roles.
- id: azure-backup-vault-unmonitored-failures
  name: Backup Failures and Critical Operations Unmonitored
  description: |
    Backup job failures, deleted items and policy changes raise no alerts, so protection can silently lapse or be dismantled.

    Attack scenario: A policy change sets retention to zero and jobs begin failing; nobody notices until a restore is needed.

    Impact: Undetected loss of recoverability.

    Severity: Medium

    Terraform indicators: azurerm_recovery_services_vault.monitoring { alerts_for_all_job_failures_enabled = false, alerts_for_critical_operation_failures_enabled = false }; no azurerm_monitor_activity_log_alert for backup operations.

    References: MCSB v2 BR-3, LT-3; NIST SP 800-53 Rev. 5 CP-9, SI-4, AU-6, AU-7, AU-2, AU-3; BSI IT-Grundschutz CON.3, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (c), (b); MITRE ATT&CK T1490; Microsoft Learn: Monitor Azure Backup with built-in alerts.
- id: azure-batch-public-exposure
  name: Batch Account Public Network Exposure
  description: |
    The account endpoint and node management endpoint accept connections from the internet because public network access is enabled and the network profile default action is Allow.

    Attack scenario: An attacker with a leaked shared key submits jobs and pools through the public account endpoint from any location.

    Impact: Unauthorized job submission, data access and compute theft.

    Severity: High

    Terraform indicators: azurerm_batch_account.public_network_access_enabled = true (default); azurerm_batch_account.network_profile.account_access.default_action = "Allow"; no azurerm_private_endpoint with subresource_names = ["batchAccount"].

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1530, T1190; Microsoft Learn: Configure public network access for Azure Batch accounts.
- id: azure-batch-shared-key-authentication
  name: Batch Account Shared Key Authentication
  description: |
    The account allows shared key authentication, and applications use the account access keys. Keys provide full control of pools, jobs and tasks and cannot be scoped or attributed.

    Attack scenario: An account key stored in a pipeline variable is used to create a large pool and run arbitrary tasks on managed nodes.

    Impact: Full control of compute and data reachable from nodes.

    Severity: High

    Terraform indicators: azurerm_batch_account.allowed_authentication_modes containing "SharedKey"; azurerm_batch_account.primary_access_key in outputs or app_settings; azurerm_batch_account.identity absent.

    References: MCSB v2 IM-1, IM-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1078.004, T1552.001; Microsoft Learn: Authenticate Azure Batch services with Microsoft Entra ID.
- id: azure-batch-unencrypted-data
  name: Batch Pool Disks and Account Data Without Customer-Controlled Encryption
  description: |
    Node OS and data disks are not encrypted with disk encryption or customer-managed keys, and account data uses platform keys only. Snapshots or detached disks expose job data.

    Attack scenario: A disk from a decommissioned node is attached to another VM; job input and output data are readable.

    Impact: Disclosure of job data at rest.

    Severity: Medium

    Terraform indicators: azurerm_batch_pool.disk_encryption block absent; azurerm_batch_account.encryption.key_vault_key_id unset.

    References: MCSB v2 DP-4, DP-5; NIST SP 800-53 Rev. 5 SC-28, SC-12; BSI IT-Grundschutz CON.1; NIS2 Art. 21(2) (h); MITRE ATT&CK T1530; Microsoft Learn: Configure customer-managed keys for Azure Batch accounts, Create a pool with disk encryption.
- id: azure-batch-task-privilege-and-secret-exposure
  name: Batch Tasks Run as Administrator With Embedded Secrets
  description: |
    Pool start tasks and tasks run with elevated rights and carry registry passwords, storage keys or SAS URLs in their definitions or resource files. Anyone who can read the pool or job definition obtains them.

    Attack scenario: A user with Reader on the batch account lists the pool start task and copies the container registry password and a long-lived SAS URL.

    Impact: Credential disclosure and privileged code execution on every node.

    Severity: High

    Terraform indicators: azurerm_batch_pool.user_accounts.elevation_level = "Admin"; azurerm_batch_pool.container_configuration.container_registries.password set inline; azurerm_batch_pool.start_task.resource_file.http_url containing a SAS token.

    References: MCSB v2 IM-8, PA-7; NIST SP 800-53 Rev. 5 IA-5, SI-4, RA-5, SC-12, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (h), (i); MITRE ATT&CK T1552.001; Microsoft Learn: Azure Batch security best practices.
- id: azure-batch-compute-hijacking
  name: Batch Compute Hijacked for Mining or Cost Abuse
  description: |
    Anyone able to create pools and jobs can consume large amounts of compute. Batch quotas are generous and cost accrues quickly.

    Attack scenario: An attacker with a stolen key creates a pool of high-core VMs and runs a miner until the quota is exhausted.

    Impact: Large unexpected cost and exhaustion of regional core quota for legitimate workloads.

    Severity: Medium

    Terraform indicators: azurerm_batch_pool.fixed_scale.target_dedicated_nodes or auto_scale.formula with high maximum; azurerm_batch_pool.vm_size set to large SKUs without policy limits.

    References: MCSB v2 PV-1; NIST SP 800-53 Rev. 5 CM-2, CM-6; BSI IT-Grundschutz OPS.2.2, OPS.1.1.3, NET.1.1; NIS2 Art. 21(2) (a), (e), (c); MITRE ATT&CK T1496.001; Microsoft Learn: Azure Batch quotas and limits.
- id: azure-batch-missing-logging
  name: Batch Service Activity Not Logged
  description: |
    Batch service logs for pool, job and task operations are not sent to a workspace, so misuse and changes cannot be attributed.

    Attack scenario: A pool is resized to thousands of nodes overnight; no log shows who requested it.

    Impact: No evidence for investigation of abuse or cost anomalies.

    Severity: Medium

    Terraform indicators: azurerm_monitor_diagnostic_setting for the batch account missing or without enabled_log entries.

    References: MCSB v2 LT-3; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b); MITRE ATT&CK T1070; Microsoft Learn: Azure Batch diagnostic logging.
- id: azure-redis-public-exposure
  name: Redis Cache Public Network Exposure
  description: |
    The cache accepts connections from the internet because public network access is enabled, it is not injected into a virtual network and firewall rules allow wide ranges. Redis then depends only on its access key.

    Attack scenario: An attacker scans for <name>.redis.cache.windows.net and connects with a leaked key to read session data and flush the cache.

    Impact: Disclosure of cached sessions and data and cache manipulation.

    Severity: High

    Terraform indicators: azurerm_redis_cache.public_network_access_enabled = true (default); azurerm_redis_cache.subnet_id unset; azurerm_redis_firewall_rule with start_ip = "0.0.0.0" and end_ip = "255.255.255.255"; no azurerm_private_endpoint with subresource_names = ["redisCache"].

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1530, T1021; Microsoft Learn: Azure Cache for Redis with Azure Private Link, Security baseline for Azure Cache for Redis.
- id: azure-redis-insecure-transport
  name: Redis Non-TLS Port and Legacy TLS Enabled
  description: |
    The non-TLS port 6379 is enabled or the minimum TLS version is below 1.2, so Redis commands and AUTH secrets cross the network unencrypted.

    Attack scenario: An attacker on the VNet path captures the AUTH command and session data from an application connecting on port 6379.

    Impact: Disclosure of cached data and credentials and in-path modification of cache content.

    Severity: High

    Terraform indicators: azurerm_redis_cache.non_ssl_port_enabled = true; azurerm_redis_cache.minimum_tls_version = "1.0" or "1.1".

    References: MCSB v2 DP-3; NIST SP 800-53 Rev. 5 SC-8; BSI IT-Grundschutz CON.1; NIS2 Art. 21(2) (h); MITRE ATT&CK T1040, T1557; Microsoft Learn: Azure Cache for Redis security baseline, Configure Azure Cache for Redis.
- id: azure-redis-access-key-authentication
  name: Redis Access Keys Only or Authentication Disabled
  description: |
    Applications authenticate with shared access keys, Entra authentication is not enabled and in some configurations authentication is disabled entirely, so any network-reachable client can run commands.

    Attack scenario: A key committed to a repository is used to run CONFIG and FLUSHALL, or an unauthenticated client on the VNet reads the keyspace.

    Impact: Unauthorized read, write and deletion of cached data.

    Severity: High

    Terraform indicators: azurerm_redis_cache.access_keys_authentication_enabled = true; azurerm_redis_cache.redis_configuration.authentication_enabled = false; azurerm_redis_cache.redis_configuration.active_directory_authentication_enabled = false; primary_access_key in outputs.

    References: MCSB v2 IM-1, IM-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1078.004, T1552.001; Microsoft Learn: Use Microsoft Entra for cache authentication.
- id: azure-redis-persistence-and-key-exposure
  name: Redis Persistence Storage and Platform-Only Encryption
  description: |
    RDB or AOF persistence writes cache contents to a storage account authenticated with a connection string, and disk data uses platform keys only. The connection string lands in Terraform state and the persisted data is readable by anyone with storage access.

    Attack scenario: A reader of Terraform state copies the persistence storage connection string and downloads the RDB snapshot containing session tokens.

    Impact: Disclosure of cached sensitive data through its persistence copy.

    Severity: Medium

    Terraform indicators: azurerm_redis_cache.redis_configuration.rdb_backup_enabled = true with rdb_storage_connection_string or aof_storage_connection_string_0 set; azurerm_redis_cache.redis_configuration.data_persistence_authentication_method = "SAS"; no customer-managed key on Enterprise tiers.

    References: MCSB v2 DP-5, IM-8; NIST SP 800-53 Rev. 5 SC-12, SC-28, IA-5, SI-4, RA-5, SC-13; BSI IT-Grundschutz CON.1, ORP.4; NIS2 Art. 21(2) (h), (i); MITRE ATT&CK T1530, T1552.001; Microsoft Learn: Configure data persistence for Azure Cache for Redis.
- id: azure-redis-cache-poisoning
  name: Redis Cache Poisoning Leading to Application Compromise
  description: |
    Cached entries such as serialized objects, authorization decisions or rendered fragments are trusted by applications. An attacker who can write to the cache can alter application behaviour without touching the database.

    Attack scenario: An attacker with a cache key writes a crafted serialized object to a session key; the application deserializes it and executes attacker-controlled code.

    Impact: Privilege escalation, code execution and data integrity loss in applications that trust the cache.

    Severity: High

    Terraform indicators: azurerm_redis_cache with access_keys_authentication_enabled = true and shared across applications; azurerm_redis_cache.redis_configuration.maxmemory_policy allowing eviction of security-relevant keys.

    References: MCSB v2 NS-2, IM-7; NIST SP 800-53 Rev. 5 SC-7, AC-4, AC-2, AC-3, AC-6, AC-16; BSI IT-Grundschutz NET.1.1, NET.3.2, ORP.4, APP.4.3; NIS2 Art. 21(2) (a), (i), (e); MITRE ATT&CK T1565; Microsoft Learn: Security baseline for Azure Cache for Redis.
- id: azure-container-apps-public-exposure
  name: Container Apps Environment Publicly Exposed
  description: |
    The environment is not network-injected and exposes apps through a public endpoint, or individual apps enable external ingress, so internal services are reachable from the internet.

    Attack scenario: An internal API deployed with external ingress is discovered through its default <name>.<env>.<region>.azurecontainerapps.io hostname and called without any perimeter control.

    Impact: Exposure of internal services and bypass of WAF and network segmentation.

    Severity: High

    Terraform indicators: azurerm_container_app_environment.public_network_access = "Enabled"; azurerm_container_app_environment.internal_load_balancer_enabled = false; azurerm_container_app_environment.infrastructure_subnet_id unset; azurerm_container_app.ingress.external_enabled = true.

    References: MCSB v2 NS-2, NS-1; NIST SP 800-53 Rev. 5 SC-7, AC-4, SC-32, CM-7; BSI IT-Grundschutz NET.1.1, NET.3.2, SYS.1.6, APP.4.4; NIS2 Art. 21(2) (a), (e); MITRE ATT&CK T1190; Microsoft Learn: Networking in Azure Container Apps, Security baseline for Azure Container Apps.
- id: azure-container-apps-insecure-ingress
  name: Container Apps Plain HTTP Ingress and Missing Peer Encryption
  description: |
    Ingress allows insecure HTTP connections and peer-to-peer mutual TLS is not enabled, so traffic between clients, the ingress and other apps in the environment can be read or altered on the network path.

    Attack scenario: A client request over plain HTTP is intercepted on a shared network and the session cookie is captured.

    Impact: Disclosure and tampering of application traffic.

    Severity: Medium

    Terraform indicators: azurerm_container_app.ingress.allow_insecure_connections = true; azurerm_container_app_environment.mutual_tls_enabled = false.

    References: MCSB v2 DP-3; NIST SP 800-53 Rev. 5 SC-8; BSI IT-Grundschutz CON.1; NIS2 Art. 21(2) (h); MITRE ATT&CK T1040, T1557; Microsoft Learn: Ingress in Azure Container Apps, Peer-to-peer encryption in Azure Container Apps.
- id: azure-container-apps-plaintext-secrets
  name: Container Apps Secrets Stored Inline or in Environment Variables
  description: |
    Secret values are written inline in the app definition or passed as plain environment variables instead of Key Vault references with a managed identity. They are visible to everyone who can read the app configuration and appear in Terraform state.

    Attack scenario: A user with Reader on the app lists secrets metadata and revisions and reads database passwords from environment settings exported to a ticket.

    Impact: Credential disclosure and lateral access to backing services.

    Severity: High

    Terraform indicators: azurerm_container_app.secret.value set inline; azurerm_container_app.template.container.env.value holding credentials; azurerm_container_app.secret.key_vault_secret_id and identity not used.

    References: MCSB v2 IM-8; NIST SP 800-53 Rev. 5 IA-5, SI-4, RA-5, SC-12, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1, SYS.1.6, APP.4.4; NIS2 Art. 21(2) (h), (i), (e); MITRE ATT&CK T1552.001, T1552.007; Microsoft Learn: Manage secrets in Azure Container Apps.
- id: azure-container-apps-unauthenticated-ingress
  name: Container Apps Externally Exposed Without Authentication
  description: |
    An app with external ingress does not use built-in authentication, validate tokens or restrict source IP ranges, so anonymous callers reach application logic.

    Attack scenario: An administrative endpoint of an app with external ingress is called by an anonymous user who enumerates API paths.

    Impact: Unauthenticated access to application functions and data.

    Severity: High

    Terraform indicators: azurerm_container_app.ingress.external_enabled = true with no azurerm_container_app.ingress.ip_security_restriction; no authentication configuration (azapi_resource type Microsoft.App/containerApps/authConfigs).

    References: MCSB v2 IM-1, NS-6; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, APP.3.1, NET.1.1, NET.3.2; NIS2 Art. 21(2) (i), (j), (e); MITRE ATT&CK T1190; Microsoft Learn: Authentication and authorization in Azure Container Apps.
- id: azure-container-apps-untrusted-image
  name: Container Apps Run Unverified Images
  description: |
    Images are pulled from public registries or by mutable tags with registry credentials stored as app secrets. A compromised or typo-squatted image runs with the app's identity.

    Attack scenario: A base image tag is overwritten upstream with a backdoored build that exfiltrates the app's managed identity token.

    Impact: Code execution in the environment and theft of identity and data.

    Severity: High

    Terraform indicators: azurerm_container_app.template.container.image from docker.io or with tag latest; azurerm_container_app.registry.username and password_secret_name instead of identity.

    References: MCSB v2 DS-6, PV-6; NIST SP 800-53 Rev. 5 CM-2, CM-3, SI-2, SI-7, RA-5; BSI IT-Grundschutz OPS.2.2, OPS.1.1.3, SYS.1.6, APP.4.4; NIS2 Art. 21(2) (d), (e); MITRE ATT&CK T1195, T1525; Microsoft Learn: Containers in Azure Container Apps.
- id: azure-container-apps-missing-logging
  name: Container Apps Logs Not Collected
  description: |
    The environment sends logs nowhere or only to console, so application, system and ingress events cannot be investigated.

    Attack scenario: A compromised revision runs for days; no system or console log is retained.

    Impact: No evidence for incident response and no detection of abuse.

    Severity: Medium

    Terraform indicators: azurerm_container_app_environment.logs_destination = "none" or log_analytics_workspace_id unset.

    References: MCSB v2 LT-3; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b); MITRE ATT&CK T1070; Microsoft Learn: Log storage and monitoring options in Azure Container Apps.
- id: azure-aci-plaintext-credentials
  name: Container Instances Credentials in Plain Environment Variables or CLI Arguments
  description: |
    Credentials passed as ordinary environment variables or command-line arguments are stored in plain text in the container group definition and visible to anyone with read access.

    Attack scenario: A user with Reader lists the container group and copies the database password from its environment.

    Impact: Disclosure of credentials used by the workload.

    Severity: High

    Terraform indicators: azurerm_container_group.container.environment_variables holding secrets instead of secure_environment_variables; azurerm_container_group.image_registry_credential.password inline; azurerm_container_group.container.commands containing secrets.

    References: MCSB v2 IM-8; NIST SP 800-53 Rev. 5 IA-5, SI-4, RA-5, SC-12, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1, SYS.1.6, APP.4.4; NIS2 Art. 21(2) (h), (i), (e); MITRE ATT&CK T1552.001, T1552.007; Microsoft Learn: Security considerations for Azure Container Instances.
- id: azure-aci-untrusted-images
  name: Container Instances Run Images From Public Registries
  description: |
    Images are pulled from public registries without verification or scanning, so any layer may contain vulnerable components or malicious code.

    Attack scenario: A public image is replaced upstream by a trojanized build that runs in the group with the group's managed identity.

    Impact: Code execution in the subnet and theft of the identity's access.

    Severity: High

    Terraform indicators: azurerm_container_group.container.image from docker.io or without digest; no azurerm_container_registry with scanning.

    References: MCSB v2 DS-6, PV-6; NIST SP 800-53 Rev. 5 CM-2, CM-3, SI-2, SI-7, RA-5; BSI IT-Grundschutz OPS.2.2, OPS.1.1.3, SYS.1.6, APP.4.4; NIS2 Art. 21(2) (d), (e); MITRE ATT&CK T1195, T1525; Microsoft Learn: Security considerations for Azure Container Instances.
- id: azure-aci-no-network-segmentation
  name: Container Instances Without Virtual Network or NSG Isolation
  description: |
    Container groups have a public IP address or run outside a virtual network, so they are not separated from other workloads and cannot be filtered by NSG or firewall.

    Attack scenario: A container group with a public IP and an exposed admin port is found by scanning and used as a foothold.

    Impact: Direct internet exposure and lateral movement.

    Severity: High

    Terraform indicators: azurerm_container_group.ip_address_type = "Public"; azurerm_container_group.subnet_ids unset; no NSG on the delegated subnet.

    References: MCSB v2 NS-1, NS-2; NIST SP 800-53 Rev. 5 SC-7, SC-32, AC-4, CM-7; BSI IT-Grundschutz NET.1.1, NET.3.2, SYS.1.6, APP.4.4; NIS2 Art. 21(2) (a), (e); MITRE ATT&CK T1021, T1190; Microsoft Learn: Deploy container instances into an Azure virtual network.
- id: azure-aci-privileged-runtime
  name: Container Instances Privileged or Root Container Runtime
  description: |
    Containers run as root or with privileged settings and unnecessary processes, so an escape or an exploited application yields broad rights on the underlying sandbox and its mounted data.

    Attack scenario: An RCE in the application is used to read mounted Azure Files shares and the managed identity endpoint as root.

    Impact: Greater blast radius after a container compromise.

    Severity: Medium

    Terraform indicators: azurerm_container_group.container.security.privilege_enabled = true; image runs as user root without securityContext restrictions.

    References: MCSB v2 PV-3; NIST SP 800-53 Rev. 5 CM-2, CM-6, SC-28; BSI IT-Grundschutz OPS.2.2, OPS.1.1.3, SYS.1.6, APP.4.4; NIS2 Art. 21(2) (a), (e); MITRE ATT&CK T1068, T1611; Microsoft Learn: Security considerations for Azure Container Instances.
- id: azure-aci-platform-key-encryption
  name: Container Instances Data Encrypted Only With Platform Keys
  description: |
    Container group data is encrypted with Microsoft-managed keys only, so customer-managed key requirements cannot be met.

    Attack scenario: A compliance audit requires customer-managed keys for workloads handling regulated data; the group cannot comply.

    Impact: Non-compliance and missing key-level control.

    Severity: Low

    Terraform indicators: azurerm_container_group.key_vault_key_id unset; azurerm_container_group.key_vault_user_assigned_identity_id unset.

    References: MCSB v2 DP-5; NIST SP 800-53 Rev. 5 SC-12, SC-28; BSI IT-Grundschutz CON.1; NIS2 Art. 21(2) (h); MITRE ATT&CK T1530; Microsoft Learn: Encrypt deployment data for Azure Container Instances.
- id: azure-data-explorer-public-exposure
  name: Data Explorer Cluster Public Network Exposure
  description: |
    The cluster query and ingestion endpoints are reachable from the internet because public network access is enabled, no IP allow list is set and no private endpoint is used.

    Attack scenario: An attacker with a stolen token runs Kusto queries from the internet against tables that hold security and business telemetry.

    Impact: Disclosure of aggregated log and telemetry data.

    Severity: High

    Terraform indicators: azurerm_kusto_cluster.public_network_access_enabled = true (default); azurerm_kusto_cluster.allowed_ip_ranges empty; no azurerm_private_endpoint with subresource_names = ["cluster"].

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1530, T1190; Microsoft Learn: Private endpoints for Azure Data Explorer, Security baseline for Azure Data Explorer.
- id: azure-data-explorer-encryption-gaps
  name: Data Explorer Disk and Customer-Key Encryption Not Enforced
  description: |
    Disk encryption and double encryption are not enabled and no customer-managed key protects the cluster data at rest.

    Attack scenario: A compromised storage layer or exported snapshot exposes data encrypted only with platform-managed keys under a single layer.

    Impact: Weaker at-rest protection and non-compliance with key-control requirements.

    Severity: Medium

    Terraform indicators: azurerm_kusto_cluster.disk_encryption_enabled = false; azurerm_kusto_cluster.double_encryption_enabled = false; no azurerm_kusto_cluster_customer_managed_key.

    References: MCSB v2 DP-4, DP-5; NIST SP 800-53 Rev. 5 SC-28, SC-12; BSI IT-Grundschutz CON.1; NIS2 Art. 21(2) (h); MITRE ATT&CK T1530; Microsoft Learn: Secure Azure Data Explorer clusters.
- id: azure-data-explorer-overbroad-roles
  name: Data Explorer Principals With Admin Rights on All Databases
  description: |
    Principal assignments grant AllDatabasesAdmin or database Admin to broad groups or pipelines. Admins can query, ingest, purge and change policies across databases.

    Attack scenario: A compromised ingestion pipeline identity with database admin rights drops retention policies and purges tables to hide activity.

    Impact: Unauthorized access to all data and tampering with retention and security tables.

    Severity: High

    Terraform indicators: azurerm_kusto_cluster_principal_assignment.role = "AllDatabasesAdmin"; azurerm_kusto_database_principal_assignment.role = "Admin" for broad groups or application identities.

    References: MCSB v2 PA-7, IM-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, AC-16; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1078.004, T1485; Microsoft Learn: Kusto role-based access control.
- id: azure-data-explorer-trusted-tenants-and-egress
  name: Data Explorer Trusts External Tenants and Unrestricted Outbound
  description: |
    The cluster trusts all external tenants for cross-tenant principals by default and does not restrict outbound access, so external identities can be authorized and data can be sent to arbitrary destinations.

    Attack scenario: A principal from an attacker's tenant is added to a database; the attacker queries data and uses external-table commands to push results to attacker storage.

    Impact: Cross-tenant data access and exfiltration.

    Severity: Medium

    Terraform indicators: azurerm_kusto_cluster.trusted_external_tenants = ["*"] (default); azurerm_kusto_cluster.outbound_network_access_restricted = false; azurerm_kusto_cluster.allowed_fqdns empty.

    References: MCSB v2 NS-2, DP-2; NIST SP 800-53 Rev. 5 SC-7, AC-4, SI-4; BSI IT-Grundschutz NET.1.1, NET.3.2, CON.1, ORP.4; NIS2 Art. 21(2) (a), (h), (i); MITRE ATT&CK T1567, T1537; Microsoft Learn: Restrict outbound access from Azure Data Explorer.
- id: azure-data-factory-public-exposure
  name: Data Factory Public Network Exposure
  description: |
    The factory is reachable from the internet and integration runtimes run outside a managed virtual network, so authoring and pipeline execution depend on identity alone and traffic to data stores crosses public paths.

    Attack scenario: An attacker with a stolen Entra token opens the factory from the internet, edits a pipeline and copies tables to an external store.

    Impact: Data exfiltration and unauthorized pipeline changes from any network.

    Severity: High

    Terraform indicators: azurerm_data_factory.public_network_enabled = true (default); azurerm_data_factory.managed_virtual_network_enabled = false; no azurerm_private_endpoint with subresource_names = ["dataFactory"].

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1530, T1190; Microsoft Learn: Azure Private Link for Azure Data Factory, Managed virtual network in Azure Data Factory.
- id: azure-data-factory-linked-service-credentials
  name: Data Factory Linked Services Use Stored Keys and Passwords
  description: |
    Linked services hold connection strings, account keys or SQL passwords inline instead of using the factory's managed identity or Key Vault references. Anyone with factory read access or access to ARM templates and Terraform state can obtain them.

    Attack scenario: A reader exports the factory ARM template and extracts storage account keys and SQL passwords of every linked service.

    Impact: Credential disclosure and direct access to every connected data store.

    Severity: High

    Terraform indicators: azurerm_data_factory_linked_service_azure_blob_storage.connection_string set with an account key and use_managed_identity = false; azurerm_data_factory_linked_service_sql_server.connection_string with a password and key_vault_password unused; azurerm_data_factory.identity absent.

    References: MCSB v2 IM-3, IM-8; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-4, IA-5, IA-9; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (h), (j); MITRE ATT&CK T1552.001, T1078.004; Microsoft Learn: Store credentials in Azure Key Vault for Data Factory, Managed identity for Data Factory.
- id: azure-data-factory-self-hosted-runtime-compromise
  name: Data Factory Self-Hosted Integration Runtime Compromise
  description: |
    The self-hosted integration runtime runs on a machine inside the network and holds decrypted credentials for on-premises sources. Its authorization key registers new nodes, and a compromised node becomes a bridge between Azure and the internal network.

    Attack scenario: An attacker with the runtime authorization key registers a rogue node, receives pipeline jobs with credentials and uses it to reach internal databases.

    Impact: Credential theft and lateral movement into internal networks.

    Severity: High

    Terraform indicators: azurerm_data_factory_integration_runtime_self_hosted.primary_authorization_key in outputs or state; azurerm_data_factory_integration_runtime_self_hosted.rbac_authorization absent for shared runtimes.

    References: MCSB v2 IM-8, NS-1; NIST SP 800-53 Rev. 5 IA-5, SI-4, RA-5, SC-12, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1, NET.1.1, NET.3.2; NIS2 Art. 21(2) (h), (i), (a); MITRE ATT&CK T1078.004, T1199; Microsoft Learn: Self-hosted integration runtime security considerations.
- id: azure-data-factory-pipeline-tampering
  name: Data Factory Pipelines Modified Without Review
  description: |
    Pipelines are edited directly in live mode without Git integration, review or protected branches. A malicious change can redirect data or run arbitrary activities with the factory's identity.

    Attack scenario: An insider with Data Factory Contributor changes a copy activity sink to an external storage account and publishes it; no review or history exists.

    Impact: Data exfiltration and execution of unreviewed code with the factory's permissions.

    Severity: High

    Terraform indicators: azurerm_data_factory.github_configuration and vsts_configuration absent; azurerm_role_assignment { role_definition_name = "Data Factory Contributor" } granted to broad groups.

    References: MCSB v2 DS-3, PA-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-6, SC-12, SC-13, AU-2; BSI IT-Grundschutz OPS.2.2, ORP.4; NIS2 Art. 21(2) (d), (i); MITRE ATT&CK T1677, T1537; Microsoft Learn: Source control in Azure Data Factory, CI/CD in Azure Data Factory.
- id: azure-data-lake-acl-overgrant
  name: Data Lake Storage ACLs Granted to Individuals Instead of Groups
  description: |
    POSIX-style ACL entries are assigned to individual users and service principals instead of Entra security groups. Entries accumulate in directories over time and leavers retain access until each entry is removed individually.

    Attack scenario: A former contractor still appears in an inherited ACL on a raw data directory and keeps read access after the account was removed from all groups.

    Impact: Lingering unauthorized access to data lake content and unreviewable permission sprawl.

    Severity: Medium

    Terraform indicators: azurerm_storage_data_lake_gen2_path.ace and azurerm_storage_data_lake_gen2_filesystem.ace with type = "user" for named object ids; azurerm_role_assignment { role_definition_name = "Storage Blob Data Contributor" } at account scope that overrides ACL restrictions.

    References: MCSB v2 PA-4, IM-7; NIST SP 800-53 Rev. 5 AC-2, AC-6, IA-4, AC-3, AC-16; BSI IT-Grundschutz ORP.4, SYS.1.8; NIS2 Art. 21(2) (i), (c); MITRE ATT&CK T1078.004; Microsoft Learn: Access control lists in Azure Data Lake Storage, Access control model in Azure Data Lake Storage.
- id: azure-data-lake-missing-dfs-private-endpoint
  name: Data Lake Storage Without a Private Endpoint for the DFS Endpoint
  description: |
    Only the blob private endpoint exists while the dfs endpoint is still public or unreachable. Directory operations and ACL management then use the public path or fail, and teams re-enable public access to make them work.

    Attack scenario: A pipeline fails on rename operations after public access is disabled; an operator re-enables public network access to unblock it and leaves it open.

    Impact: The data lake is exposed on its public dfs endpoint or operations break, which pushes teams towards weaker network settings.

    Severity: Medium

    Terraform indicators: azurerm_storage_account.is_hns_enabled = true with azurerm_private_endpoint { subresource_names = ["blob"] } but none for ["dfs"]; azurerm_storage_account.public_network_access = "Enabled".

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2, SYS.1.8; NIS2 Art. 21(2) (a), (c); MITRE ATT&CK T1530; Microsoft Learn: Known issues with Azure Data Lake Storage, Use private endpoints for Azure Storage.
- id: azure-databricks-public-exposure
  name: Databricks Workspace and Compute Publicly Reachable
  description: |
    The workspace UI and API are reachable from the internet, cluster nodes have public IP addresses and the compute plane is not injected into a customer-managed virtual network. Only workspace authentication stands between the internet and notebooks that run code against production data.

    Attack scenario: An attacker with a stolen token reaches the workspace URL from the internet and runs a notebook that mounts the data lake and copies tables out.

    Impact: Data exfiltration, code execution on cluster nodes and use of cluster-attached cloud credentials.

    Severity: High

    Terraform indicators: azurerm_databricks_workspace.public_network_access_enabled = true (default); azurerm_databricks_workspace.custom_parameters.no_public_ip = false; azurerm_databricks_workspace.custom_parameters.virtual_network_id unset; azurerm_databricks_workspace.network_security_group_rules_required = "AllRules"; no azurerm_private_endpoint with subresource_names = ["databricks_ui_api"].

    References: MCSB v2 NS-2, NS-1; NIST SP 800-53 Rev. 5 SC-7, AC-4, SC-32, CM-7; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1190, T1530; Microsoft Learn: Deploy Azure Databricks in your Azure virtual network, Configure Azure Private Link for Azure Databricks.
- id: azure-databricks-platform-key-encryption
  name: Databricks Workspace Data Without Customer-Managed Keys
  description: |
    Notebook and control plane data and managed disks use Microsoft-managed keys because the workspace is not on the Premium tier or no customer-managed key is configured, so key-level revocation and compliance requirements cannot be met.

    Attack scenario: A regulator demands customer control of keys for analytics data; the workspace cannot meet it without migration.

    Impact: No key-level kill switch and non-compliance with key-control requirements.

    Severity: Medium

    Terraform indicators: azurerm_databricks_workspace.sku = "standard"; azurerm_databricks_workspace.customer_managed_key_enabled = false; azurerm_databricks_workspace.managed_services_cmk_key_vault_key_id and managed_disk_cmk_key_vault_key_id unset; azurerm_databricks_workspace.infrastructure_encryption_enabled = false.

    References: MCSB v2 DP-5, DP-4; NIST SP 800-53 Rev. 5 SC-12, SC-28; BSI IT-Grundschutz CON.1; NIS2 Art. 21(2) (h); MITRE ATT&CK T1530; Microsoft Learn: Customer-managed keys for Azure Databricks.
- id: azure-databricks-storage-credential-exposure
  name: Databricks Notebooks Hold Storage Keys, SAS Tokens and Personal Access Tokens
  description: |
    Data access is configured with storage account keys, SAS tokens or personal access tokens that sit in notebooks, cluster Spark configuration, repos or job parameters instead of using Unity Catalog, an access connector or Entra authentication. Any user who can read the notebook obtains the credential.

    Attack scenario: A data scientist commits a notebook with an account key to a shared repo; another user mounts the same storage with full rights, and the key stays valid until someone rotates it.

    Impact: Lasting credential exposure and data access outside Unity Catalog governance.

    Severity: High

    Terraform indicators: azurerm_databricks_workspace.access_connector_id unset; azurerm_storage_account.shared_access_key_enabled = true for the data lake; azurerm_databricks_access_connector.identity missing; keys passed from Terraform variables into secret scopes or cluster configuration.

    References: MCSB v2 IM-8, IM-3; NIST SP 800-53 Rev. 5 IA-5, SI-4, RA-5, SC-12, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (h), (i), (j); MITRE ATT&CK T1552.001; Microsoft Learn: Connect to Azure Data Lake Storage from Azure Databricks, Unity Catalog storage credentials.
- id: azure-databricks-code-execution-privilege-escalation
  name: Databricks Cluster Creators and Workspace Admins Escalate Through Compute
  description: |
    Users who can create or attach to clusters run arbitrary code with the cluster's identity and library access, and workspace admins can read secrets and change permissions. Broad cluster policies and admin rights turn analyst access into data and cloud access.

    Attack scenario: An analyst attaches a notebook to an unrestricted cluster, reads secret scope values through code and calls cloud APIs with the cluster identity.

    Impact: Privilege escalation to the rights of the compute identity and access to data beyond the user's entitlement.

    Severity: High

    Terraform indicators: azurerm_databricks_workspace without enhanced_security_compliance or compliance_security_profile_enabled; azurerm_role_assignment of "Owner" or "Contributor" on the workspace to analyst groups; no cluster policy enforcement outside Terraform.

    References: MCSB v2 PA-1, PA-7; NIST SP 800-53 Rev. 5 AC-2, AC-5, AC-6, AC-3; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1078.004, T1059; Microsoft Learn: Azure Databricks security best practices, Cluster policies.
- id: azure-databricks-missing-logging
  name: Databricks Audit and Diagnostic Logs Not Collected
  description: |
    Workspace diagnostic logs for accounts, clusters, jobs, notebooks, secrets and SQL permissions are not exported, so access to data and credential use cannot be investigated.

    Attack scenario: A user reads a secret scope and exports tables; with no audit log the activity cannot be reconstructed.

    Impact: No evidence for investigation of data access and permission changes.

    Severity: Medium

    Terraform indicators: azurerm_monitor_diagnostic_setting for the workspace missing, or enabled_log entries for accounts, clusters, jobs, notebook and secrets absent.

    References: MCSB v2 LT-3; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b); MITRE ATT&CK T1070; Microsoft Learn: Monitor Azure Databricks, Diagnostic logging in Azure Databricks.
- id: azure-ddos-protection-public-ip-unprotected
  name: Public IP Addresses Not Covered by DDoS Protection
  description: |
    Public IP addresses are not covered by DDoS Network Protection or DDoS IP Protection, so only basic infrastructure protection applies. Volumetric and protocol attacks reach workloads without adaptive tuning or rapid response support.

    Attack scenario: A short UDP flood against a public IP of an internet-facing service saturates the application's capacity; no adaptive mitigation or cost protection is available.

    Impact: Service outage and unrecoverable cost during an attack.

    Severity: Medium

    Terraform indicators: azurerm_virtual_network.ddos_protection_plan absent; azurerm_public_ip.ddos_protection_mode = "Disabled" or left at VirtualNetworkInherited without a protected VNet; azurerm_network_ddos_protection_plan.virtual_network_ids missing the hosting VNet.

    References: MCSB v2 NS-5; NIST SP 800-53 Rev. 5 SC-5, SI-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (c), (a); MITRE ATT&CK T1498, T1499; Microsoft Learn: Azure DDoS Protection overview, Secure Azure DDoS Protection.
- id: azure-ddos-protection-unsupported-resources
  name: DDoS Protection Gap on Unsupported Deployments
  description: |
    Some deployment types are not covered by DDoS Protection, for example multi-tenant PaaS endpoints and Virtual WAN. Enabling the plan gives a false sense of coverage for them.

    Attack scenario: A team assumes a plan-protected VNet covers a public endpoint that is outside the plan's scope and skips an application-layer fallback; an attack takes it down.

    Impact: Unprotected exposure and unmet availability expectations.

    Severity: Low

    Terraform indicators: azurerm_network_ddos_protection_plan assigned to a VNet while public workloads use resources that the plan does not support.

    References: MCSB v2 NS-5; NIST SP 800-53 Rev. 5 SC-5, SI-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (c), (a); MITRE ATT&CK T1498; Microsoft Learn: Azure DDoS Protection tier comparison limitations.
- id: azure-ddos-protection-no-attack-telemetry
  name: DDoS Attacks Without Telemetry or Logs
  description: |
    Diagnostic settings for DDoS metrics and mitigation logs are not configured, so attacks go unnoticed and no evidence exists for analysis or for claiming cost protection.

    Attack scenario: A multi-hour attack runs below the availability alert threshold; no mitigation flow logs exist to understand what traffic was dropped.

    Impact: Late detection, no forensic data and no basis for cost credit requests.

    Severity: Low

    Terraform indicators: azurerm_monitor_diagnostic_setting for azurerm_public_ip missing DDoSProtectionNotifications, DDoSMitigationFlowLogs and DDoSMitigationReports; no azurerm_monitor_metric_alert on under-DDoS-attack.

    References: MCSB v2 LT-4; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b); MITRE ATT&CK T1498; Microsoft Learn: Configure Azure DDoS Protection diagnostic logging.
- id: azure-dedicated-hsm-default-credentials
  name: Dedicated HSM Default Administrator Credentials
  description: |
    The default administrator password set during provisioning is not changed, so anyone with network access to the HSM management interface who knows the default can take over administration.

    Attack scenario: An attacker on the HSM subnet logs in with the vendor default administrator password and exports or reconfigures partitions.

    Impact: Full control of the HSM and of keys it protects.

    Severity: High

    Terraform indicators: azurerm_dedicated_hardware_security_module provisioned into a subnet reachable from broad VNets (azurerm_dedicated_hardware_security_module.network_profile.subnet_id); no process that rotates initial credentials after provisioning.

    References: MCSB v2 IM-8, PA-1; NIST SP 800-53 Rev. 5 IA-5, SI-4, RA-5, SC-12, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (h), (i); MITRE ATT&CK T1078.001; Microsoft Learn: Azure Dedicated HSM security.
- id: azure-dedicated-hsm-role-lockout
  name: Dedicated HSM Role Destroyed by Failed Sign-In Attempts
  description: |
    Failed sign-ins destroy the HSM Security Officer role after three attempts and the Partition Security Officer role after ten, which can zeroize key material. A mistaken script or a deliberate attacker can make the HSM permanently unusable.

    Attack scenario: An attacker with network access to the management interface submits wrong credentials until the SO role is destroyed.

    Impact: Loss of key access and of dependent services.

    Severity: High

    Terraform indicators: azurerm_dedicated_hardware_security_module reachable from automation hosts that retry authentication; no restriction of management access in NSGs on the HSM subnet.

    References: MCSB v2 IM-1, NS-1; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, NET.1.1, NET.3.2, CON.3; NIS2 Art. 21(2) (i), (j), (a); MITRE ATT&CK T1110, T1485; Microsoft Learn: Azure Dedicated HSM security.
- id: azure-dedicated-hsm-no-ha-backup
  name: Dedicated HSM Without High Availability or Key Backup
  description: |
    A single HSM with no HA partner and no tested key backup loses all key material if it fails or is zeroized, and every service depending on those keys stops.

    Attack scenario: A hardware fault or administrative zeroization removes the only copy of the root key; databases protected by it cannot be decrypted.

    Impact: Permanent key loss and prolonged outage.

    Severity: High

    Terraform indicators: only one azurerm_dedicated_hardware_security_module per region; no second HSM in a paired region; azurerm_dedicated_hardware_security_module.zones unset.

    References: MCSB v2 BR-1, DP-6; NIST SP 800-53 Rev. 5 CP-9, CP-10, IA-5, SC-12, SC-28; BSI IT-Grundschutz CON.3, CON.1; NIS2 Art. 21(2) (c), (h); MITRE ATT&CK T1485; Microsoft Learn: Azure Dedicated HSM high availability, Backup and recovery.
- id: azure-defender-unremediated-recommendations
  name: Defender for Cloud Recommendations Not Remediated
  description: |
    Recommendations about critical misconfigurations are generated but nobody owns remediation, so the secure score stays low and known attack paths remain open.

    Attack scenario: A recommendation reports a storage account with public network access for months; an attacker exploits the exposure the finding already described.

    Impact: Known exposure persists although the platform detected it.

    Severity: Medium

    Terraform indicators: azurerm_security_center_subscription_pricing { tier = "Standard" } enabled without azurerm_security_center_automation or governance rules that route findings; no azurerm_security_center_assessment_policy ownership.

    References: MCSB v2 PV-5, PV-6; NIST SP 800-53 Rev. 5 RA-3, RA-5, SI-2; BSI IT-Grundschutz OPS.1.1.3; NIS2 Art. 21(2) (e); MITRE ATT&CK T1190; Microsoft Learn: Security recommendations in Defender for Cloud, Secure score.
- id: azure-dns-private-zone-link-misconfiguration
  name: Private DNS Zones Linked to Unintended VNets or With Auto-Registration
  description: |
    A private DNS zone is linked to virtual networks that do not need it, or auto-registration writes records that overwrite or shadow other names. Resources then resolve names to unintended targets.

    Attack scenario: A workload in a linked dev VNet registers a record that collides with a production service name and traffic from other VNets is answered with the dev address.

    Impact: Misdirected traffic, interception and outages caused by incorrect name resolution.

    Severity: Medium

    Terraform indicators: azurerm_private_dns_zone_virtual_network_link.registration_enabled = true on shared zones; azurerm_private_dns_zone_virtual_network_link.virtual_network_id for VNets that do not need the zone.

    References: MCSB v2 NS-10; NIST SP 800-53 Rev. 5 SC-7, SI-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1584.003; Microsoft Learn: Azure DNS security design guide, Private DNS zone concepts.
- id: azure-dns-no-dnssec-validation
  name: Private Resolution Without DNSSEC Validation
  description: |
    Recursive resolution inside Azure virtual networks does not validate DNSSEC, and private zones are not signed, so forged answers are accepted.

    Attack scenario: An attacker on a path to a forwarding resolver returns a forged answer for an internal API name and redirects traffic.

    Impact: Redirection and interception of internal traffic.

    Severity: Low

    Terraform indicators: azurerm_private_dns_zone without validating resolver in the path; azurerm_virtual_network.dns_servers pointing at resolvers that do not validate.

    References: MCSB v2 NS-10; NIST SP 800-53 Rev. 5 SC-7, SI-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1557; Microsoft Learn: Azure DNS security design guide, DNSSEC limitations.
- id: azure-dns-malicious-domain-resolution
  name: Workloads Resolve Malicious Domains
  description: |
    Workloads can resolve command-and-control, phishing and malware distribution domains because no DNS security policy or filtering applies to the VNet resolver.

    Attack scenario: A compromised VM resolves a domain generation algorithm domain and downloads a second stage.

    Impact: Command-and-control communication and malware delivery.

    Severity: Medium

    Terraform indicators: azurerm_virtual_network.dns_servers unset with no DNS security policy; azurerm_firewall_policy.dns { proxy_enabled = false }.

    References: MCSB v2 NS-10, NS-4; NIST SP 800-53 Rev. 5 SC-7, SI-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1071; Microsoft Learn: Azure DNS security policy.
- id: azure-dns-dangling-record-takeover
  name: Public DNS Records Pointing to Deleted Resources
  description: |
    CNAME or A records in public zones keep pointing at deleted Azure resources such as App Service, Traffic Manager or public IPs. An attacker registers a resource with the same name or address and serves content on the organization's domain.

    Attack scenario: A decommissioned web app leaves www.example.com pointing at example.azurewebsites.net; an attacker creates an app with that name and hosts a phishing page with a valid-looking domain.

    Impact: Phishing, cookie theft and reputation damage on the organization's own domain.

    Severity: High

    Terraform indicators: azurerm_dns_cname_record.record = "<app>.azurewebsites.net" whose azurerm_linux_web_app was destroyed; azurerm_dns_a_record.target_resource_id missing for removed public IPs.

    References: MCSB v2 NS-10, AM-2; NIST SP 800-53 Rev. 5 SC-7, SI-4, CM-7, SA-3, SA-8; BSI IT-Grundschutz NET.1.1, NET.3.2, OPS.2.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1584.003, T1583.003; Microsoft Learn: Prevent dangling DNS entries and avoid subdomain takeover.
- id: azure-dns-zone-record-tampering
  name: Unauthorized Changes to DNS Zone Records
  description: |
    Broad DNS Zone Contributor or Contributor rights allow unreviewed changes to records. Redirecting a name affects every client that resolves it.

    Attack scenario: An attacker with DNS Zone Contributor changes the mail exchanger and the login host record to attacker infrastructure.

    Impact: Traffic interception, credential theft and mail interception.

    Severity: High

    Terraform indicators: azurerm_role_assignment { role_definition_name = "DNS Zone Contributor" or "Contributor" } at subscription scope; no azurerm_management_lock on azurerm_dns_zone.

    References: MCSB v2 PA-7, LT-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, AU-2, AU-3; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1, NET.1.1; NIS2 Art. 21(2) (i), (b), (a); MITRE ATT&CK T1584.003, T1565; Microsoft Learn: Protect DNS zones and records.
- id: azure-domain-services-ntlm-hash-sync
  name: Entra Domain Services Synchronizes NTLM Password Hashes
  description: |
    NTLM and Kerberos legacy password hashes are synchronized into the managed domain. An attacker with directory read access or a compromised domain-joined host can extract and crack them offline.

    Attack scenario: An attacker with a Domain Services admin path dumps NTLM hashes from the managed domain and cracks weak passwords offline.

    Impact: Account takeover of synchronized users.

    Severity: Medium

    Terraform indicators: azurerm_active_directory_domain_service.security.sync_ntlm_passwords = true; azurerm_active_directory_domain_service.security.sync_on_prem_passwords = true.

    References: MCSB v2 IM-6, DP-4; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-5, IA-8, IA-11; BSI IT-Grundschutz ORP.4, CON.1, APP.2.2; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1110.002; Microsoft Learn: Harden an Entra Domain Services managed domain, Password hash synchronization for Domain Services.
- id: azure-domain-services-weak-protocols
  name: Entra Domain Services Legacy Protocols Enabled
  description: |
    NTLMv1, TLS 1.0 and Kerberos RC4 stay enabled although they use weak cryptography, so clients and attackers can force a downgrade and capture crackable material.

    Attack scenario: An attacker on the VNet path forces NTLMv1 authentication and captures a challenge-response that can be cracked quickly.

    Impact: Credential disclosure and weakened authentication.

    Severity: Medium

    Terraform indicators: azurerm_active_directory_domain_service.security.ntlm_v1_enabled = true; security.tls_v1_enabled = true; security.kerberos_rc4_encryption_enabled = true; security.kerberos_armoring_enabled = false.

    References: MCSB v2 NS-8, DP-3; NIST SP 800-53 Rev. 5 SC-8, SC-13, IA-5; BSI IT-Grundschutz NET.1.1, NET.3.2, CON.1, OPS.2.2; NIS2 Art. 21(2) (a), (h), (i); MITRE ATT&CK T1040; Microsoft Learn: Harden an Entra Domain Services managed domain.
- id: azure-domain-services-ldap-relay
  name: Entra Domain Services LDAP Relay Without Signing and Channel Binding
  description: |
    LDAP signing and channel binding are not enforced, so an NTLM authentication can be relayed to the directory and used to bind as the victim.

    Attack scenario: An attacker coerces a server to authenticate to an attacker host and relays the authentication to LDAP on the managed domain to create a privileged object.

    Impact: Account takeover and privilege escalation within the managed domain.

    Severity: High

    Terraform indicators: LDAP signing and channel binding are not exposed by azurerm_active_directory_domain_service and must be set through the domainSecuritySettings resource property (azapi_update_resource); security.ntlm_v1_enabled = true increases relay exposure.

    References: MCSB v2 IM-6, NS-8; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-5, IA-8, IA-11; BSI IT-Grundschutz ORP.4, NET.1.1, NET.3.2, APP.2.2; NIS2 Art. 21(2) (i), (j), (a); MITRE ATT&CK T1557; Microsoft Learn: Harden an Entra Domain Services managed domain, LDAP channel binding.
- id: azure-domain-services-ldaps-internet-exposure
  name: Entra Domain Services Secure LDAP Exposed to the Internet
  description: |
    Secure LDAP over port 636 is reachable from the internet, so password spraying and brute force against directory accounts run from anywhere.

    Attack scenario: An attacker sprays common passwords against ldaps endpoints of the managed domain and finds valid accounts.

    Impact: Account compromise and directory enumeration from outside the network.

    Severity: High

    Terraform indicators: azurerm_active_directory_domain_service.secure_ldap.external_access_enabled = true; azurerm_network_security_rule allowing TCP 636 from Internet on the domain services subnet.

    References: MCSB v2 NS-2, NS-1; NIST SP 800-53 Rev. 5 SC-7, AC-4, SC-32, CM-7; BSI IT-Grundschutz NET.1.1, NET.3.2, APP.2.2; NIS2 Art. 21(2) (a), (i); MITRE ATT&CK T1110, T1190; Microsoft Learn: Configure secure LDAP for Microsoft Entra Domain Services.
- id: azure-elastic-san-public-network-access
  name: Elastic SAN Reachable From Public Networks
  description: |
    Public network access is enabled on the SAN although only private endpoints are intended, so volume groups can be reached from the internet with a stolen identity.

    Attack scenario: An attacker with a stolen token connects to the volume group's public iSCSI endpoint and mounts a database volume.

    Impact: Disclosure and tampering of block data.

    Severity: High

    Terraform indicators: azurerm_elastic_san_volume_group.network_rule with action = "Allow" for broad subnets and no azurerm_private_endpoint with subresource_names = ["volumegroup"]; public network access not restricted.

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2, SYS.1.8; NIS2 Art. 21(2) (a), (c); MITRE ATT&CK T1530; Microsoft Learn: Configure Azure Elastic SAN networking.
- id: azure-elastic-san-implicit-subnet-access
  name: Elastic SAN Private Endpoint Grants Implicit Access to the Whole Subnet
  description: |
    Approving a private endpoint implicitly allows all traffic from the connecting subnet. Without private endpoint network policies, NSG rules do not apply to the endpoint, so access cannot be narrowed to specific hosts.

    Attack scenario: Any VM placed in the subnet can mount the volume group because the endpoint allows the whole subnet and no NSG applies.

    Impact: Lateral access to block storage from unrelated workloads in the subnet.

    Severity: Medium

    Terraform indicators: azurerm_subnet.private_endpoint_network_policies = "Disabled"; azurerm_elastic_san_volume_group.network_rule.subnet_id covering shared subnets.

    References: MCSB v2 NS-1, NS-2; NIST SP 800-53 Rev. 5 SC-7, SC-32, AC-4, CM-7; BSI IT-Grundschutz NET.1.1, NET.3.2, SYS.1.8; NIS2 Art. 21(2) (a), (c); MITRE ATT&CK T1021; Microsoft Learn: Configure private endpoints for Azure Elastic SAN.
- id: azure-elastic-san-no-transit-encryption-or-soft-delete
  name: Elastic SAN Lacks Encryption in Transit and Soft Delete
  description: |
    Elastic SAN does not provide encryption in transit for iSCSI traffic and has no soft delete, so block traffic on the network path can be read and a deleted volume cannot be recovered from the service.

    Attack scenario: A volume is deleted by an operator with volume group owner rights and no recovery point exists; separately, iSCSI traffic is captured between the host and the SAN.

    Impact: Disclosure of block traffic on shared network paths and permanent loss of deleted volumes.

    Severity: Medium

    Terraform indicators: azurerm_elastic_san_volume_group.encryption_type = "EncryptionAtRestWithPlatformKey" without azurerm_data_protection_backup_instance_disk or snapshots; no azurerm_management_lock on azurerm_elastic_san.

    References: MCSB v2 DP-3, BR-1; NIST SP 800-53 Rev. 5 SC-8, CP-9, CP-10; BSI IT-Grundschutz CON.1, CON.3, SYS.1.8; NIS2 Art. 21(2) (h), (c); MITRE ATT&CK T1040, T1485; Microsoft Learn: What is Azure Elastic SAN, Elastic SAN volume operational backup.
- id: azure-elastic-san-platform-key-encryption
  name: Elastic SAN Volume Groups Use Platform-Managed Keys
  description: |
    Volume groups use platform-managed keys, so the organization cannot revoke access to stored data through its own key or meet customer-managed key requirements.

    Attack scenario: A compliance requirement demands that data become unreadable on key revocation; platform-managed keys offer no such control.

    Impact: No key-level revocation and non-compliance with key-control requirements.

    Severity: Low

    Terraform indicators: azurerm_elastic_san_volume_group.encryption_type = "EncryptionAtRestWithPlatformKey"; azurerm_elastic_san_volume_group.encryption.key_vault_key_id unset.

    References: MCSB v2 DP-5; NIST SP 800-53 Rev. 5 SC-12, SC-28; BSI IT-Grundschutz CON.1; NIS2 Art. 21(2) (h); MITRE ATT&CK T1530; Microsoft Learn: Encryption options for Azure Elastic SAN.
- id: azure-entra-token-theft
  name: Entra Session Cookie and Refresh Token Theft
  description: |
    Adversary-in-the-middle phishing kits and infostealer malware capture session cookies and refresh tokens after the user completes MFA. Replaying the token from another device bypasses MFA and impersonates the user, including administrators.

    Attack scenario: A user signs in through a phishing proxy; the kit steals the session cookie and the attacker opens the Azure portal as an administrator from another country without any new MFA prompt.

    Impact: Account takeover with tenant-wide impact when the victim holds privileged roles.

    Severity: Critical

    Terraform indicators: azuread_conditional_access_policy.grant_controls.authentication_strength_policy_id unset for administrators and remote access; azuread_conditional_access_policy.session_controls.sign_in_frequency unset for administrator portals; azuread_authentication_strength_policy not defined.

    References: MCSB v2 IM-6, LT-2; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-5, IA-8, IA-11; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1, DER.2.1; NIS2 Art. 21(2) (i), (j), (b); MITRE ATT&CK T1539, T1528; Microsoft Learn: Token theft playbook, Conditional Access authentication strengths, Token protection in Conditional Access.
- id: azure-entra-password-spraying
  name: Entra Password Spraying and Credential Stuffing
  description: |
    Low-and-slow attempts with common or leaked passwords across many accounts stay below per-account lockout thresholds. Accounts without MFA or with weak passwords are then signed in from attacker infrastructure.

    Attack scenario: An attacker tries "Spring2026!" against every mailbox in the tenant from rotating residential IPs and signs in to the accounts that use it.

    Impact: Account compromise, mailbox access and a foothold for phishing and privilege escalation.

    Severity: High

    Terraform indicators: azuread_conditional_access_policy.state = "disabled" or "enabledForReportingButNotEnforced" for MFA policies; azuread_conditional_access_policy.grant_controls.built_in_controls missing "mfa"; password protection and smart lockout settings not managed in code.

    References: MCSB v2 IM-6, LT-2; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-5, IA-8, IA-11; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1, DER.2.1; NIS2 Art. 21(2) (i), (j), (b); MITRE ATT&CK T1110.003, T1110.004; Microsoft Learn: Microsoft Entra Password Protection, Smart lockout.
- id: azure-entra-conditional-access-bypass
  name: Conditional Access Bypass Through Gaps and Exclusions
  description: |
    Conditional Access is circumvented through legacy authentication, the device code flow, accounts excluded from policies, broad trusted named locations or unmanaged clients. Policies that cover only some apps or users leave gaps an attacker can enumerate.

    Attack scenario: An attacker finds that IMAP is not blocked, signs in with a stolen password over legacy authentication and never meets the MFA requirement.

    Impact: Access controls are bypassed and stolen credentials work without MFA or device checks.

    Severity: High

    Terraform indicators: azuread_conditional_access_policy.conditions.client_app_types = ["browser", "mobileAppsAndDesktopClients"] without a policy blocking "exchangeActiveSync" and "other"; azuread_conditional_access_policy.conditions.users.excluded_users or excluded_groups with many members; azuread_named_location.ip.trusted = true for broad ranges.

    References: MCSB v2 IM-7, IM-6; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-6, AC-16, IA-2, IA-5; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i), (j); MITRE ATT&CK T1078.004, T1550; Microsoft Learn: Block legacy authentication with Conditional Access, Block authentication flows.
- id: azure-entra-standing-admin-access
  name: Permanent Privileged Role Assignments in Entra ID
  description: |
    Administrators hold permanent active role assignments such as Global Administrator or Privileged Role Administrator. A single compromised session grants unrestricted standing control without approval or time limit.

    Attack scenario: A help-desk administrator with a permanent Privileged Role Administrator assignment is phished; the attacker grants themselves Global Administrator and creates persistent backdoor credentials.

    Impact: Tenant takeover from one compromised account.

    Severity: Critical

    Terraform indicators: azuread_directory_role_assignment for human users instead of azuread_directory_role_eligibility_schedule_request or azuread_privileged_access_group_eligibility_schedule; azuread_group.assignable_to_role = false for privileged groups that bypass role-assignable protections.

    References: MCSB v2 PA-2, PA-1; NIST SP 800-53 Rev. 5 AC-2, AC-5, AC-6, AC-16; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1078.004, T1098; Microsoft Learn: Privileged Identity Management, Securing privileged access.
- id: azure-entra-break-glass-misuse
  name: Emergency Access Accounts Weakly Protected or Unmonitored
  description: |
    Emergency access accounts have weak credentials or their use is not monitored. They are usually excluded from Conditional Access and hold Global Administrator, so an attacker who finds them has an unmonitored path to tenant-wide rights.

    Attack scenario: An attacker discovers a break-glass account name in documentation, sprays its password and signs in without MFA; no alert is raised.

    Impact: Silent tenant-wide administrative access.

    Severity: High

    Terraform indicators: azuread_user for emergency accounts with a short password and no FIDO2 key registered; azuread_conditional_access_policy.conditions.users.excluded_users containing more than the two emergency accounts; no azurerm_monitor_scheduled_query_rules_alert_v2 for their sign-ins.

    References: MCSB v2 PA-5, LT-2; NIST SP 800-53 Rev. 5 AC-2, CP-2, CP-9, IR-4, IA-4, AU-2; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1, DER.2.1; NIS2 Art. 21(2) (i), (b); MITRE ATT&CK T1078.004; Microsoft Learn: Manage emergency access accounts in Microsoft Entra ID.
- id: azure-entra-provider-support-access
  name: Cloud Provider Support Access Without Customer Approval
  description: |
    Provider support staff may reach customer data or tenant configuration during support cases without explicit customer approval when Customer Lockbox is not enabled. The access path is outside the organization's approval and logging.

    Attack scenario: A support engineer accesses a storage account during a case without the customer ever approving the request, and the organization cannot show who authorized it.

    Impact: Unreviewed access to sensitive data and weakened evidence for regulators and data owners.

    Severity: Medium

    Terraform indicators: Customer Lockbox is a tenant-level setting that azurerm does not manage; no Terraform resource or policy enforces it (verify through azapi_resource type Microsoft.CustomerLockbox/enablement or the portal).

    References: MCSB v2 PA-8; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-6, AU-6, CA-3; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1078.004; Microsoft Learn: Customer Lockbox for Microsoft Azure.
- id: azure-entra-guest-and-external-collaboration-overexposure
  name: Guest and External Identities With Excessive Access
  description: |
    B2B guest accounts are invited freely, remain in privileged or broad groups, and are not reviewed. External identities from weak tenants then reach internal applications and data.

    Attack scenario: A guest invited for a project stays in an all-staff group for years; the guest's account at a partner is phished and the attacker reads internal Teams and SharePoint content.

    Impact: Unauthorized access through external identities that the organization does not control.

    Severity: Medium

    Terraform indicators: azuread_user.user_type = "Guest" as member of azuread_group with application assignments; azuread_conditional_access_policy.conditions.users.included_guests_or_external_users unset so guests bypass MFA policies.

    References: MCSB v2 IM-1, PA-4; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i), (j); MITRE ATT&CK T1078.004, T1199; Microsoft Learn: Secure external access with Microsoft Entra External ID, Access reviews.
- id: azure-entra-hybrid-identity-compromise
  name: Hybrid Identity Sync Account Compromise
  description: |
    The on-premises directory synchronization account and server (Entra Connect) can write to the cloud tenant. Compromising the server or its account allows creating, modifying and resetting cloud users, and exposes synchronized password hashes.

    Attack scenario: An attacker with administrative rights on the Entra Connect server extracts the sync account credential and uses it to reset the password of a cloud administrator.

    Impact: Tenant compromise originating from the on-premises environment.

    Severity: High

    Terraform indicators: azuread_user.onpremises_sync_enabled = true for privileged accounts that should be cloud-only; azuread_directory_role_assignment for synced accounts; Entra Connect server not treated as Tier 0.

    References: MCSB v2 PA-1, IM-2; NIST SP 800-53 Rev. 5 AC-2, AC-5, AC-6, AC-3, IA-2, IA-4; BSI IT-Grundschutz ORP.4, APP.2.2; NIS2 Art. 21(2) (i); MITRE ATT&CK T1078.004, T1098; Microsoft Learn: Secure Microsoft Entra Connect, Protect Microsoft 365 from on-premises attacks.
- id: azure-event-grid-public-exposure
  name: Event Grid Topics, Domains and Namespaces Publicly Reachable
  description: |
    Event Grid topics, domains and namespaces accept publishes and management calls from the public internet because public network access is enabled and no IP rules or private endpoints apply.

    Attack scenario: An attacker with a leaked topic key publishes forged events from the internet; downstream functions treat them as genuine business events.

    Impact: Event injection, triggering of downstream processing and disclosure of event metadata.

    Severity: High

    Terraform indicators: azurerm_eventgrid_topic.public_network_access_enabled = true (default); azurerm_eventgrid_domain.public_network_access_enabled = true; azurerm_eventgrid_namespace.public_network_access = "Enabled"; azurerm_eventgrid_topic.inbound_ip_rule empty; no azurerm_private_endpoint with subresource_names = ["topic"] or ["domain"].

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1530, T1190; Microsoft Learn: Configure private endpoints for Azure Event Grid topics or domains.
- id: azure-event-grid-key-authentication
  name: Event Grid Access Keys and SAS Tokens Used for Publishing
  description: |
    Publishers authenticate with topic access keys or SAS tokens because local authentication is enabled. Keys are shared secrets without identity and give full publish rights.

    Attack scenario: A key stored in a build variable is used to publish thousands of forged events that trigger paid downstream actions.

    Impact: Event forgery and no attribution of publishers.

    Severity: High

    Terraform indicators: azurerm_eventgrid_topic.local_auth_enabled = true (default); azurerm_eventgrid_domain.local_auth_enabled = true; primary_access_key referenced in outputs or app_settings.

    References: MCSB v2 IM-1, IM-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1078.004, T1552.001; Microsoft Learn: Authenticate Event Grid publishing clients using Microsoft Entra ID.
- id: azure-event-grid-unauthenticated-webhook-delivery
  name: Event Grid Webhook Subscriptions Without Entra Authentication
  description: |
    Event subscriptions deliver events to webhook endpoints that rely only on a shared secret in the URL or accept any caller. An attacker who learns the endpoint URL can post forged events directly, bypassing Event Grid.

    Attack scenario: A function endpoint secured only by a function key in its URL receives forged "BlobCreated" events and processes attacker-chosen blob URLs.

    Impact: Forged events trigger processing of attacker-controlled data.

    Severity: Medium

    Terraform indicators: azurerm_eventgrid_event_subscription.webhook_endpoint without active_directory_tenant_id and active_directory_app_id_or_uri; azurerm_eventgrid_event_subscription.delivery_identity unset.

    References: MCSB v2 IM-1, DP-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, CON.1, APP.3.1; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1190; Microsoft Learn: Secure WebHook delivery with Microsoft Entra ID in Azure Event Grid.
- id: azure-event-grid-subscription-exfiltration
  name: Event Subscription Created to Siphon Events
  description: |
    Anyone with EventGrid EventSubscription Contributor on a topic or system topic can add a subscription that sends all events to an endpoint they control, silently copying business events and resource metadata.

    Attack scenario: A compromised contributor adds a webhook subscription to a storage system topic and receives blob names and URLs of every new object.

    Impact: Continuous disclosure of event data and resource inventory.

    Severity: Medium

    Terraform indicators: azurerm_role_assignment { role_definition_name = "EventGrid Contributor" } on subscriptions or resource groups; azurerm_eventgrid_event_subscription resources created outside CI/CD.

    References: MCSB v2 PA-7, LT-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, AU-2, AU-3; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (i), (b); MITRE ATT&CK T1537, T1567; Microsoft Learn: Authorizing access to Event Grid resources.
- id: azure-event-hubs-public-exposure
  name: Event Hubs Namespace Public Network Exposure
  description: |
    The namespace accepts connections from the internet because public network access is enabled and the network rule set default action is Allow. SAS keys or tokens then work from anywhere.

    Attack scenario: An attacker with a leaked connection string consumes a telemetry hub from the internet and reads customer events.

    Impact: Disclosure of streamed data and injection of forged events.

    Severity: High

    Terraform indicators: azurerm_eventhub_namespace.public_network_access_enabled = true (default); azurerm_eventhub_namespace.network_rulesets.default_action = "Allow"; no azurerm_private_endpoint with subresource_names = ["namespace"].

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1530, T1190; Microsoft Learn: Allow access to Azure Event Hubs namespaces via private endpoints.
- id: azure-event-hubs-sas-key-authentication
  name: Event Hubs Shared Access Keys With Manage Rights
  description: |
    Namespaces keep local authentication enabled and applications use the RootManageSharedAccessKey or manage-level policies. These keys cannot be scoped to a caller and allow reading, sending and managing everything in the namespace.

    Attack scenario: A producer app's connection string with manage rights leaks; an attacker creates a consumer group, reads all events and deletes event hubs.

    Impact: Full data-plane and management control of the namespace.

    Severity: High

    Terraform indicators: azurerm_eventhub_namespace.local_authentication_enabled = true (default); azurerm_eventhub_authorization_rule { manage = true, listen = true, send = true }; default_primary_connection_string in outputs.

    References: MCSB v2 IM-1, IM-8; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1078.004, T1552.001; Microsoft Learn: Authorize access to Event Hubs resources using Microsoft Entra ID.
- id: azure-event-hubs-weak-tls
  name: Event Hubs Accepts Legacy TLS Versions
  description: |
    The namespace allows TLS versions below 1.2, so clients can be downgraded and captured on the network path.

    Attack scenario: An attacker on the path forces a legacy TLS handshake and records the SAS token from a client connection.

    Impact: Disclosure of credentials and event data in transit.

    Severity: Medium

    Terraform indicators: azurerm_eventhub_namespace.minimum_tls_version = "1.0" or "1.1".

    References: MCSB v2 DP-3; NIST SP 800-53 Rev. 5 SC-8; BSI IT-Grundschutz CON.1; NIS2 Art. 21(2) (h); MITRE ATT&CK T1040, T1557; Microsoft Learn: Security baseline for Azure Event Hubs.
- id: azure-event-hubs-platform-key-encryption
  name: Event Hubs Data Without Customer-Managed Keys or Double Encryption
  description: |
    Captured and retained event data uses platform keys only, so the organization cannot revoke access through its own key or add an infrastructure encryption layer.

    Attack scenario: A regulator requires customer-controlled keys for event data that contains personal information; the namespace cannot comply.

    Impact: No key-level revocation and non-compliance with key-control requirements.

    Severity: Low

    Terraform indicators: azurerm_eventhub_namespace_customer_managed_key missing for the namespace; azurerm_eventhub_namespace_customer_managed_key.infrastructure_encryption_enabled = false; azurerm_eventhub_namespace.sku = "Basic".

    References: MCSB v2 DP-5, DP-4; NIST SP 800-53 Rev. 5 SC-12, SC-28; BSI IT-Grundschutz CON.1; NIS2 Art. 21(2) (h); MITRE ATT&CK T1530; Microsoft Learn: Configure customer-managed keys for Azure Event Hubs.
- id: azure-expressroute-unencrypted-private-peering
  name: ExpressRoute Private Peering Carries Unencrypted Traffic
  description: |
    ExpressRoute does not encrypt traffic on private peering by default. Data between the site and Azure crosses the provider network in clear unless MACsec on ExpressRoute Direct or IPsec over private peering is configured.

    Attack scenario: A provider employee or an attacker at the exchange point taps the circuit and reads database traffic between the data centre and Azure.

    Impact: Disclosure and tampering of hybrid traffic.

    Severity: Medium

    Terraform indicators: azurerm_express_route_port link1 or link2 without macsec_cipher and macsec_cak_keyvault_secret_id; no azurerm_virtual_network_gateway with azurerm_virtual_network_gateway_connection of type "IPsec" over the private peering.

    References: MCSB v2 DP-3, NS-9; NIST SP 800-53 Rev. 5 SC-8, SC-7; BSI IT-Grundschutz CON.1, NET.1.1, NET.3.2; NIS2 Art. 21(2) (h), (a); MITRE ATT&CK T1040, T1557; Microsoft Learn: About encryption for ExpressRoute, VPN over ExpressRoute private peering.
- id: azure-expressroute-unauthenticated-bgp
  name: ExpressRoute BGP Sessions Without MD5 Authentication
  description: |
    BGP sessions on the peering are not protected with an MD5 shared key. A party on the transport path can inject forged routes and redirect traffic.

    Attack scenario: An attacker on the exchange network injects a more specific route for an internal prefix and pulls traffic through an attacker router.

    Impact: Traffic redirection and interception or blackholing of hybrid traffic.

    Severity: Medium

    Terraform indicators: azurerm_express_route_circuit_peering.shared_key unset.

    References: MCSB v2 NS-8, NS-9; NIST SP 800-53 Rev. 5 SC-8, SC-13, IA-5, SC-7; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1557; Microsoft Learn: Secure Azure ExpressRoute deployment, ExpressRoute routing requirements.
- id: azure-expressroute-broad-circuit-rbac
  name: ExpressRoute Circuits Managed With Broad Rights
  description: |
    Broad Contributor or Network Contributor rights allow changes to circuits, gateways and routing. A mistake or compromised account can disconnect the site or redirect traffic.

    Attack scenario: A compromised account with Network Contributor deletes the circuit peering; production connectivity to the data centre drops.

    Impact: Loss of hybrid connectivity and traffic redirection.

    Severity: High

    Terraform indicators: azurerm_role_assignment { role_definition_name = "Contributor" or "Network Contributor" } at subscription scope for non-network teams; no azurerm_management_lock on azurerm_express_route_circuit.

    References: MCSB v2 PA-7, PA-1; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1078.004, T1489; Microsoft Learn: ExpressRoute architecture best practices, Azure RBAC for networking.
- id: azure-expressroute-authorization-key-abuse
  name: ExpressRoute Authorization Keys Used to Link Foreign Networks
  description: |
    Circuit authorization keys let other subscriptions connect their VNet gateways to the circuit. Leaked or unused keys allow unauthorized networks to attach and consume bandwidth or reach on-premises ranges.

    Attack scenario: An attacker with a leaked authorization key creates a connection from a VNet in their own subscription to the organization's circuit.

    Impact: Unauthorized network attachment to the hybrid backbone.

    Severity: Medium

    Terraform indicators: azurerm_express_route_circuit_authorization resources left in place after use; azurerm_express_route_circuit.authorization_key referenced in outputs.

    References: MCSB v2 NS-9, IM-8; NIST SP 800-53 Rev. 5 SC-7, SC-8, IA-5, SI-4, RA-5, SC-12; BSI IT-Grundschutz NET.1.1, NET.3.2, ORP.4, CON.1; NIS2 Art. 21(2) (a), (h), (i); MITRE ATT&CK T1199; Microsoft Learn: Connect a virtual network to an ExpressRoute circuit.
- id: azure-expressroute-missing-logging
  name: ExpressRoute Circuit Activity Not Logged
  description: |
    Circuit and peering logs and metrics are not exported, so route changes and connectivity incidents cannot be investigated.

    Attack scenario: A peering is reconfigured and traffic shifts to another path; no log shows who changed it or when.

    Impact: No evidence for outage and routing incident analysis.

    Severity: Low

    Terraform indicators: azurerm_monitor_diagnostic_setting for azurerm_express_route_circuit missing.

    References: MCSB v2 LT-4; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b); MITRE ATT&CK T1070; Microsoft Learn: Monitor ExpressRoute.
- id: azure-file-sync-public-endpoint-exposure
  name: Storage Sync Service Public Endpoint Exposure
  description: |
    The Storage Sync Service accepts traffic from the public internet, and agents and clients connect over public endpoints although private endpoints are available.

    Attack scenario: A stolen server registration is used from the internet to enumerate sync groups and cloud endpoints.

    Impact: Exposure of sync metadata and data paths to external actors.

    Severity: Medium

    Terraform indicators: azurerm_storage_sync.incoming_traffic_policy = "AllowAllTraffic" (default); no azurerm_private_endpoint with subresource_names = ["afs"]; storage account public network access enabled.

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1530, T1190; Microsoft Learn: Azure File Sync networking considerations.
- id: azure-file-sync-identity-misconfiguration
  name: File Share Access Without Domain Authentication
  description: |
    Shares are reached only with storage account keys or without domain-based authentication, so NTFS permissions from the file server do not apply in the cloud share.

    Attack scenario: A user with the account key mounts the cloud share directly and reads folders that the on-premises ACLs would have denied.

    Impact: Access control bypass for cloud copies of file data.

    Severity: High

    Terraform indicators: azurerm_storage_account.azure_files_authentication missing or directory_type = "AADKERB" without default_share_level_permission restrictions; azurerm_storage_account.shared_access_key_enabled = true.

    References: MCSB v2 IM-1, IM-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i), (j); MITRE ATT&CK T1078.004; Microsoft Learn: Hybrid file services considerations, Identity-based authentication for Azure Files.
- id: azure-file-sync-no-backup
  name: File Sync Cloud Shares Without Backup
  description: |
    Cloud shares are not protected with Azure Files backup. Sync replicates deletions and encryption, so ransomware on a server propagates to the cloud copy.

    Attack scenario: Ransomware encrypts files on a registered server; sync uploads the encrypted versions and overwrites the cloud copy with no recovery point.

    Impact: Loss of both on-premises and cloud copies.

    Severity: High

    Terraform indicators: azurerm_backup_protected_file_share missing for the cloud share; azurerm_backup_policy_file_share not assigned.

    References: MCSB v2 BR-1, BR-2; NIST SP 800-53 Rev. 5 CP-9, CP-10, SC-12, SC-13, SC-28; BSI IT-Grundschutz CON.3; NIS2 Art. 21(2) (c); MITRE ATT&CK T1486, T1490; Microsoft Learn: Hybrid file services considerations, Back up Azure file shares.
- id: azure-file-sync-registered-server-compromise
  name: File Sync Registered Server Compromise Spreads to Cloud Data
  description: |
    Registered servers hold a server identity with access to the sync group. Compromising a server gives access to the cloud endpoint data and lets an attacker modify files that sync to every other server.

    Attack scenario: An attacker with administrator rights on one branch server modifies a template file; sync distributes it to all servers and the cloud share.

    Impact: Lateral spread of tampered or malicious files across all endpoints.

    Severity: Medium

    Terraform indicators: azurerm_storage_sync_group with many azurerm_storage_sync_server_endpoint entries and no per-site sync groups; registered server not onboarded to Defender for Servers.

    References: MCSB v2 ES-1, NS-1; NIST SP 800-53 Rev. 5 SI-4, IR-4, SC-7, SC-32, AC-4, CM-7; BSI IT-Grundschutz OPS.1.1.4, NET.1.1, NET.3.2, SYS.1.8; NIS2 Art. 21(2) (g), (a), (c); MITRE ATT&CK T1080, T1565; Microsoft Learn: Azure File Sync deployment guide.
- id: azure-files-rbac-acl-misalignment
  name: Azure Files RBAC and NTFS ACL Misalignment
  description: |
    Share-level roles such as Storage File Data SMB Share Elevated Contributor are granted to broad groups or combined with permissive NTFS ACLs. Users receive write or ACL-change rights beyond their duties.

    Attack scenario: A broad group holds Elevated Contributor on the finance share and changes ACLs to expose payroll folders.

    Impact: Unauthorized read, write and permission changes on shared data.

    Severity: Medium

    Terraform indicators: azurerm_role_assignment { role_definition_name = "Storage File Data SMB Share Elevated Contributor" } to broad groups at account scope; azurerm_storage_share.acl or NTFS ACLs granting Everyone or Authenticated Users.

    References: MCSB v2 IM-7, PA-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-6, AC-16, AC-5; BSI IT-Grundschutz ORP.4, SYS.1.8; NIS2 Art. 21(2) (i), (c); MITRE ATT&CK T1078.004; Microsoft Learn: Assign share-level permissions for Azure Files.
- id: azure-files-default-share-permission-overgrant
  name: Azure Files Default Share-Level Permission Applies to All Authenticated Users
  description: |
    A default share-level permission is configured for all authenticated identities, so any user in the synced directory gets access to every share unless NTFS ACLs deny it.

    Attack scenario: A user from an unrelated department mounts the HR share because the storage account default permission is set to Contributor for all authenticated users.

    Impact: Broad unintended access to shared data.

    Severity: Medium

    Terraform indicators: azurerm_storage_account.azure_files_authentication.default_share_level_permission = "StorageFileDataSmbShareContributor" or "StorageFileDataSmbShareElevatedContributor".

    References: MCSB v2 IM-7, PA-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-6, AC-16, AC-5; BSI IT-Grundschutz ORP.4, SYS.1.8; NIS2 Art. 21(2) (i), (c); MITRE ATT&CK T1078.004; Microsoft Learn: Identity-based authentication for Azure Files.
- id: azure-files-smb-unencrypted-transfer
  name: Azure Files SMB Without Encryption or With Legacy Protocol Versions
  description: |
    Clients connect with SMB 2.x or without encryption in transit, so file contents and credential exchanges can be read or captured by anyone on the network path.

    Attack scenario: A client on an untrusted network mounts a share over SMB 3.0 without encryption; an attacker on the path records file contents and the NTLM exchange.

    Impact: Disclosure and tampering of file data in transit.

    Severity: High

    Terraform indicators: azurerm_storage_account.share_properties.smb.versions including "SMB2.1" or "SMB3.0"; azurerm_storage_account.share_properties.smb.channel_encryption_type without "AES-256-GCM"; azurerm_storage_account.https_traffic_only_enabled = false.

    References: MCSB v2 DP-3; NIST SP 800-53 Rev. 5 SC-8; BSI IT-Grundschutz CON.1, SYS.1.8; NIS2 Art. 21(2) (h), (c); MITRE ATT&CK T1040; Microsoft Learn: Azure Files SMB security settings, Azure Files security baseline.
- id: azure-files-share-destruction
  name: Azure Files Shares Deleted Without a Recovery Point
  description: |
    Attackers with delete rights remove shares or files without a recovery point, or disable share soft delete. Ransomware that encrypts share contents then has no restore path.

    Attack scenario: A stolen contributor identity deletes all shares after turning off soft delete; no snapshot or backup exists.

    Impact: Permanent loss of file data.

    Severity: High

    Terraform indicators: azurerm_storage_account.share_properties.retention_policy.days = 0 or unset; azurerm_backup_protected_file_share missing; no azurerm_management_lock on the storage account.

    References: MCSB v2 BR-1, BR-2; NIST SP 800-53 Rev. 5 CP-9, CP-10, SC-12, SC-13, SC-28; BSI IT-Grundschutz CON.3, SYS.1.8; NIS2 Art. 21(2) (c); MITRE ATT&CK T1485, T1486; Microsoft Learn: Prevent accidental deletion of Azure file shares, Back up Azure file shares.
- id: azure-firewall-manager-global-policy-change
  name: Firewall Manager Parent Policy Change Affects Every Firewall
  description: |
    A change to a parent policy applies to all associated firewalls across regions and subscriptions, and parent rules take precedence over child rules. A compromised account with policy rights can open the whole perimeter in one change.

    Attack scenario: An attacker with Network Contributor on the base policy adds an allow-any rule at high priority; every secured hub and VNet firewall in all regions now passes traffic.

    Impact: Perimeter-wide loss of filtering from a single change.

    Severity: High

    Terraform indicators: azurerm_firewall_policy.base_policy_id shared by all child policies; azurerm_role_assignment { role_definition_name = "Network Contributor" } on the base policy for broad groups; azurerm_firewall_policy_rule_collection_group.priority lower than baseline groups.

    References: MCSB v2 PA-7, NS-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, SC-7, AC-4; BSI IT-Grundschutz ORP.4, NET.1.1, NET.3.2; NIS2 Art. 21(2) (i), (a); MITRE ATT&CK T1078.004, T1686.001; Microsoft Learn: Azure Firewall Manager policy overview, Azure Firewall policy hierarchy.
- id: azure-firewall-manager-traffic-bypasses-firewall
  name: Traffic Bypasses the Secured Virtual Hub Firewall
  description: |
    Private traffic destinations or public ranges used privately are not sent through the firewall because routing intent or the private traffic prefixes are incomplete. Traffic then flows unfiltered between networks.

    Attack scenario: A spoke VNet peered to the hub uses a public range internally that is not listed in the private traffic prefixes; its traffic to another spoke never reaches the firewall.

    Impact: Missing inspection and segmentation between connected networks.

    Severity: High

    Terraform indicators: azurerm_virtual_hub_routing_intent.routing_policy missing a PrivateTraffic entry; additional private prefixes not configured on the secured hub; spokes with azurerm_virtual_network_peering bypassing the hub.

    References: MCSB v2 NS-1, NS-3; NIST SP 800-53 Rev. 5 SC-7, SC-32, AC-4, CM-7, SI-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1021; Microsoft Learn: Secure traffic between virtual networks with routing intent, Secure your virtual hub using Azure Firewall Manager.
- id: azure-firewall-manager-fqdn-filter-dns-mismatch
  name: Firewall FQDN Filtering Bypassed Through DNS Mismatch
  description: |
    Clients resolve names through a DNS server other than the firewall's DNS proxy, so the IP addresses the firewall resolved for FQDN rules differ from those the client uses. Rules then do not match or allow unintended destinations.

    Attack scenario: A client resolves a hostname through a public resolver and reaches an address that the FQDN rule on the firewall did not resolve; the rule neither allows nor blocks consistently.

    Impact: Inconsistent enforcement and bypass of FQDN-based policy.

    Severity: Medium

    Terraform indicators: azurerm_firewall_policy.dns.proxy_enabled = false while FQDN rules are used; azurerm_virtual_network.dns_servers not pointing at the firewall private IP.

    References: MCSB v2 NS-3, NS-10; NIST SP 800-53 Rev. 5 SC-7, AC-4, SI-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1071; Microsoft Learn: Azure Firewall DNS settings, Azure Firewall design guide.
- id: azure-front-door-weak-tls
  name: Front Door Custom Domains Accept Legacy TLS
  description: |
    Custom domains allow TLS versions below 1.2, or the origin connection uses plain HTTP, so clients can be downgraded and traffic read on the network path.

    Attack scenario: A client on a hostile network is forced to a legacy TLS version and its session cookie is captured.

    Impact: Disclosure of session data and credentials in transit.

    Severity: Medium

    Terraform indicators: azurerm_cdn_frontdoor_custom_domain.tls.minimum_version = "TLS10" or "TLS11"; azurerm_cdn_frontdoor_route.forwarding_protocol = "HttpOnly" or https_redirect_enabled = false.

    References: MCSB v2 DP-3; NIST SP 800-53 Rev. 5 SC-8; BSI IT-Grundschutz CON.1; NIS2 Art. 21(2) (h); MITRE ATT&CK T1040, T1557; Microsoft Learn: Configure HTTPS on an Azure Front Door custom domain, Front Door TLS policy.
- id: azure-front-door-origin-bypass
  name: Front Door Origins Reachable Directly Without the Edge
  description: |
    Origins accept requests from the internet in addition to Front Door, so attackers call the origin address directly and skip WAF rules, rate limits and geo filters. Origins that do not validate the Front Door identifier cannot tell the difference.

    Attack scenario: An attacker finds the origin hostname in certificate transparency logs and sends SQL injection payloads straight to the origin, bypassing the Front Door WAF.

    Impact: WAF and edge controls are ineffective for the protected application.

    Severity: High

    Terraform indicators: azurerm_cdn_frontdoor_origin.private_link block missing for Premium origins; origin access restrictions without the AzureFrontDoor.Backend service tag and X-Azure-FDID header check (azurerm_linux_web_app.site_config.ip_restriction); origin public network access enabled.

    References: MCSB v2 NS-2, NS-6; NIST SP 800-53 Rev. 5 SC-7, AC-4, SI-10, SI-11; BSI IT-Grundschutz NET.1.1, NET.3.2, APP.3.1; NIS2 Art. 21(2) (a), (e); MITRE ATT&CK T1190; Microsoft Learn: Secure traffic to Azure Front Door origins, Private Link origins.
- id: azure-front-door-waf-ineffective
  name: Front Door WAF Missing, in Detection Mode or Without Managed Rules
  description: |
    The profile uses the Standard tier that lacks managed WAF rule sets and private link, or the WAF policy runs in Detection mode or is not associated with the domains, so attacks pass the edge unblocked.

    Attack scenario: A WAF policy in Detection mode logs a SQL injection against the public site but never blocks it.

    Impact: Application attacks reach the origin without edge protection.

    Severity: High

    Terraform indicators: azurerm_cdn_frontdoor_profile.sku_name = "Standard_AzureFrontDoor"; azurerm_cdn_frontdoor_firewall_policy.mode = "Detection"; azurerm_cdn_frontdoor_security_policy missing for the custom domain.

    References: MCSB v2 NS-6, PV-1; NIST SP 800-53 Rev. 5 SC-7, SI-10, SI-11, CM-2, CM-6; BSI IT-Grundschutz APP.3.1, NET.1.1, NET.3.2, OPS.2.2; NIS2 Art. 21(2) (e), (a); MITRE ATT&CK T1190; Microsoft Learn: Azure Web Application Firewall on Azure Front Door, Front Door tier comparison.
- id: azure-front-door-missing-logging
  name: Front Door Access and WAF Logs Not Collected
  description: |
    Access, WAF and health probe logs are not exported to a workspace, so attacks and bypass attempts are invisible.

    Attack scenario: Attackers probe for origin bypass for weeks; with no WAF or access logs the probes are never seen.

    Impact: No detection or evidence for web attacks.

    Severity: Medium

    Terraform indicators: azurerm_monitor_diagnostic_setting for azurerm_cdn_frontdoor_profile missing FrontDoorAccessLog, FrontDoorWebApplicationFirewallLog and FrontDoorHealthProbeLog.

    References: MCSB v2 LT-3, LT-4, NS-6; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4, SC-7; BSI IT-Grundschutz OPS.1.1.5, DER.1, APP.3.1, NET.1.1; NIS2 Art. 21(2) (b), (e), (a); MITRE ATT&CK T1070; Microsoft Learn: Monitor metrics and logs in Azure Front Door.
- id: azure-front-door-dangling-custom-domain
  name: Front Door Custom Domain Takeover
  description: |
    DNS records for custom domains keep pointing at a Front Door endpoint after the domain was removed from the profile. Another tenant can add the same domain and serve content on the organization's name.

    Attack scenario: A decommissioned campaign site leaves www.example.com as a CNAME to an azurefd.net endpoint; an attacker adds the domain to their own profile and hosts phishing content.

    Impact: Phishing, cookie theft and brand damage on the organization's domain.

    Severity: High

    Terraform indicators: azurerm_dns_cname_record.record = "<endpoint>.z01.azurefd.net" without a matching azurerm_cdn_frontdoor_custom_domain; azurerm_cdn_frontdoor_custom_domain removed while DNS records remain.

    References: MCSB v2 NS-10; NIST SP 800-53 Rev. 5 SC-7, SI-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1584.003; Microsoft Learn: Prevent dangling DNS entries and avoid subdomain takeover.
- id: azure-hdinsight-no-esp-authentication
  name: HDInsight Standard Cluster Without Authentication or Ranger Authorization
  description: |
    Standard clusters run without Kerberos authentication for services such as HiveServer2, and fine-grained authorization with Apache Ranger is unavailable. Anyone who can reach the cluster can run queries and read data.

    Attack scenario: An attacker on the VNet connects to HiveServer2 without credentials and selects from every table.

    Impact: Unauthorized data access and no per-user audit trail.

    Severity: High

    Terraform indicators: azurerm_hdinsight_hadoop_cluster.security_profile block absent; azurerm_hdinsight_hadoop_cluster.gateway shared admin credentials used by all users.

    References: MCSB v2 IM-1, IM-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i), (j); MITRE ATT&CK T1078.004, T1190; Microsoft Learn: Security options for Apache Hive in HDInsight, Enterprise Security Package.
- id: azure-hdinsight-insecure-transport
  name: HDInsight Cluster Communication Not Encrypted
  description: |
    Traffic between cluster nodes is not encrypted with IPsec and gateway connections accept legacy TLS, so intercepted data and credentials are readable on the virtual network.

    Attack scenario: An attacker on the cluster subnet captures node-to-node traffic that includes data shuffles and service tokens.

    Impact: Disclosure of data and tokens in transit.

    Severity: Medium

    Terraform indicators: azurerm_hdinsight_hadoop_cluster.tls_min_version = "1.0" or "1.1"; encryption in transit between nodes not enabled.

    References: MCSB v2 DP-3; NIST SP 800-53 Rev. 5 SC-8; BSI IT-Grundschutz CON.1; NIS2 Art. 21(2) (h); MITRE ATT&CK T1040; Microsoft Learn: Encryption in transit for Azure HDInsight.
- id: azure-hdinsight-keytab-exposure
  name: HDInsight Kerberos Keytabs Left Unprotected
  description: |
    Keytab files for domain users sit on cluster nodes or in scripts with loose permissions. Anyone who copies a keytab can authenticate as that user without a password.

    Attack scenario: A keytab generated for a service account is left in a shared home directory; another user copies it and authenticates to Hive as the service account.

    Impact: Impersonation of domain users and service accounts.

    Severity: High

    Terraform indicators: azurerm_hdinsight_hadoop_cluster.script_actions with uri that writes keytabs to world-readable paths; azurerm_hdinsight_hadoop_cluster.security_profile with broad cluster_users_group_dns.

    References: MCSB v2 IM-8, PA-7; NIST SP 800-53 Rev. 5 IA-5, SI-4, RA-5, SC-12, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (h), (i), (j); MITRE ATT&CK T1552; Microsoft Learn: Enterprise Security Package guidelines in HDInsight, Create keytab files.
- id: azure-hdinsight-public-gateway-and-ssh
  name: HDInsight Gateway and SSH Reachable From Public Networks
  description: |
    The cluster gateway and SSH endpoints are reachable from the internet because the cluster is not deployed with private link or restrictive NSG rules, exposing Ambari and service UIs to credential attacks.

    Attack scenario: An attacker sprays the shared gateway admin password against the public Ambari endpoint.

    Impact: Cluster takeover through exposed management interfaces.

    Severity: High

    Terraform indicators: azurerm_hdinsight_hadoop_cluster.network.private_link_enabled = false; azurerm_hdinsight_hadoop_cluster.subnet_id in a subnet with NSG rules allowing HDInsight management ports from Internet.

    References: MCSB v2 NS-2, NS-1; NIST SP 800-53 Rev. 5 SC-7, AC-4, SC-32, CM-7; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1190, T1021; Microsoft Learn: Enable Private Link on an HDInsight cluster.
- id: azure-hdinsight-encryption-gaps
  name: HDInsight Disks Without Encryption at Host or Customer-Managed Keys
  description: |
    Cluster disks and temporary data are encrypted with platform keys only and encryption at host is not enabled, so the organization cannot revoke access and temporary disks are not covered.

    Attack scenario: A detached node disk is attached to another VM; temporary data on the host disk is readable.

    Impact: Disclosure of data at rest and non-compliance with key-control requirements.

    Severity: Medium

    Terraform indicators: azurerm_hdinsight_hadoop_cluster.disk_encryption.encryption_at_host_enabled = false; azurerm_hdinsight_hadoop_cluster.disk_encryption.key_vault_key_id unset.

    References: MCSB v2 DP-4, DP-5; NIST SP 800-53 Rev. 5 SC-28, SC-12; BSI IT-Grundschutz CON.1; NIS2 Art. 21(2) (h); MITRE ATT&CK T1530; Microsoft Learn: Customer-managed key disk encryption in Azure HDInsight.
- id: azure-iot-hub-public-exposure
  name: IoT Hub and Provisioning Service Publicly Reachable
  description: |
    The hub, the Device Provisioning Service and Device Update accounts accept connections from any network. Devices and operators need nothing more than a credential to reach the control plane.

    Attack scenario: An attacker with a stolen service connection string sends cloud-to-device commands and reads telemetry from the internet.

    Impact: Control of devices, disclosure of telemetry and abuse of the provisioning service.

    Severity: High

    Terraform indicators: azurerm_iothub.public_network_access_enabled = true (default); azurerm_iothub.network_rule_set.default_action = "Allow"; azurerm_iothub_dps.public_network_access_enabled = true; azurerm_iothub_dps.ip_filter_rule empty.

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1530, T1190; Microsoft Learn: IoT Hub security best practices, Private endpoints for IoT Hub.
- id: azure-iot-hub-shared-access-policy-abuse
  name: IoT Hub Shared Access Policies With Service Connect and Registry Write
  description: |
    Service applications use the iothubowner or other broad shared access policies with registry write, service connect and device connect permissions. A leaked key can create devices, invoke direct methods and read all telemetry.

    Attack scenario: A back-end connection string for iothubowner is committed to a repository; an attacker registers rogue devices and sends direct methods to the existing fleet.

    Impact: Control of the device fleet and disclosure of all telemetry.

    Severity: Critical

    Terraform indicators: azurerm_iothub.shared_access_policy with permissions containing "RegistryWrite" and "ServiceConnect"; azurerm_iothub.local_authentication_enabled = true (default); primary_key outputs.

    References: MCSB v2 IM-1, IM-8, PA-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1078.004, T1552.001; Microsoft Learn: Control access to IoT Hub using shared access signatures, Microsoft Entra authentication for IoT Hub.
- id: azure-iot-hub-device-credential-theft
  name: IoT Device Symmetric Keys Extracted From Devices
  description: |
    Devices authenticate with symmetric keys stored in flash or firmware, which can be read from a stolen or physically accessed device. One key lets an attacker impersonate that device indefinitely.

    Attack scenario: A field device is stolen; its connection string is dumped from the firmware and used to send forged telemetry and receive that device's commands.

    Impact: Device impersonation and injection of false data.

    Severity: High

    Terraform indicators: azurerm_iothub_dps enrollment with symmetric key attestation instead of X.509; IoT Hub device identities created with authentication_type "sas" for devices without a secure element.

    References: MCSB v2 IM-3, DP-8; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-4, IA-5, IA-9; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (h), (j); MITRE ATT&CK T1078, T1552; Microsoft Learn: IoT Hub security best practices, X.509 certificate attestation.
- id: azure-iot-hub-weak-tls
  name: IoT Hub Accepts Legacy TLS Versions
  description: |
    The hub allows TLS versions below 1.2 for device and service connections, so connections can be downgraded and captured.

    Attack scenario: An attacker on a cellular path forces a legacy TLS handshake with a device and captures its SAS token.

    Impact: Disclosure of credentials and telemetry in transit.

    Severity: Medium

    Terraform indicators: azurerm_iothub.min_tls_version unset or "1.0".

    References: MCSB v2 DP-3; NIST SP 800-53 Rev. 5 SC-8; BSI IT-Grundschutz CON.1; NIS2 Art. 21(2) (h); MITRE ATT&CK T1040; Microsoft Learn: IoT Hub TLS support.
- id: azure-iot-hub-routing-key-credentials
  name: IoT Hub Routing Endpoints Authenticated With Keys
  description: |
    Message routing to Event Hubs, Service Bus or Storage uses connection strings with embedded keys instead of managed identity. Keys appear in Terraform state and routing configuration.

    Attack scenario: A reader of the IoT Hub configuration copies the routing endpoint key and reads the downstream Event Hub.

    Impact: Disclosure of downstream endpoints and their data.

    Severity: Medium

    Terraform indicators: azurerm_iothub.endpoint.authentication_type = "keyBased" with connection_string set; azurerm_iothub.endpoint.identity_id unset.

    References: MCSB v2 IM-3, IM-8; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-4, IA-5, IA-9; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (h), (j); MITRE ATT&CK T1552.001; Microsoft Learn: Managed identities for IoT Hub message routing.
- id: azure-iot-hub-missing-logging
  name: IoT Hub Operations and Connections Not Logged
  description: |
    Connection, device identity and routing logs are not exported, so device impersonation and fleet changes cannot be investigated.

    Attack scenario: A rogue device registers and connects repeatedly; with no connections or device identity logs the activity goes unseen.

    Impact: No evidence for fleet-level incidents.

    Severity: Medium

    Terraform indicators: azurerm_monitor_diagnostic_setting for azurerm_iothub missing enabled_log entries for Connections and DeviceIdentityOperations.

    References: MCSB v2 LT-3; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b); MITRE ATT&CK T1070; Microsoft Learn: Monitor IoT Hub.
- id: azure-load-balancer-backend-directly-exposed
  name: Load Balancer Backends Directly Exposed to the Internet
  description: |
    A public load balancer forwards traffic straight to backend instances with no firewall or WAF in between, and permissive NSG rules or public IPs on instances make the backends attackable directly.

    Attack scenario: An attacker scans the load balancer frontend and exploits an unpatched service on a backend VM through an NSG rule that allows all ports.

    Impact: Direct exploitation of backend instances.

    Severity: High

    Terraform indicators: azurerm_lb.frontend_ip_configuration.public_ip_address_id with azurerm_lb_rule forwarding broad ports; azurerm_network_security_rule allowing Internet inbound on backend subnets; azurerm_network_interface with public IP.

    References: MCSB v2 NS-1, NS-3; NIST SP 800-53 Rev. 5 SC-7, SC-32, AC-4, CM-7, SI-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1190; Microsoft Learn: Azure Load Balancer architecture best practices, Secure Azure Load Balancer.
- id: azure-load-balancer-retired-basic-sku
  name: Retired Basic Load Balancer Still in Use
  description: |
    Basic Load Balancer and Basic public IP SKUs were retired on 30 September 2025. Remaining instances have no SLA or support, lack zone redundancy and secure-by-default behaviour, and may be removed by the platform.

    Attack scenario: A Basic load balancer in front of a legacy application stops working after platform removal; incident responders cannot get support.

    Impact: Unsupported infrastructure, outage risk and open-by-default inbound behaviour.

    Severity: Medium

    Terraform indicators: azurerm_lb.sku = "Basic"; azurerm_public_ip.sku = "Basic".

    References: MCSB v2 PV-1, AM-2; NIST SP 800-53 Rev. 5 CM-2, CM-6, CM-7, SA-3, SA-8; BSI IT-Grundschutz OPS.2.2, OPS.1.1.3, NET.1.1; NIS2 Art. 21(2) (a), (e), (c); MITRE ATT&CK T1499; Microsoft Learn: Azure Load Balancer SKUs, Upgrade from Basic Load Balancer.
- id: azure-load-balancer-unencrypted-application-traffic
  name: Load Balancer Passes Unencrypted Application Traffic
  description: |
    The load balancer works at layer 4 and does not terminate or enforce TLS. If the application does not encrypt itself, traffic crosses the network in clear.

    Attack scenario: Clients connect over HTTP to a service behind a load balancer; an attacker on the path reads session cookies.

    Impact: Disclosure and tampering of application traffic.

    Severity: Medium

    Terraform indicators: azurerm_lb_rule { protocol = "Tcp", frontend_port = 80 } to backends that serve plain HTTP; no azurerm_application_gateway or azurerm_cdn_frontdoor_profile terminating TLS.

    References: MCSB v2 DP-3; NIST SP 800-53 Rev. 5 SC-8; BSI IT-Grundschutz CON.1; NIS2 Art. 21(2) (h); MITRE ATT&CK T1040; Microsoft Learn: Secure Azure Load Balancer, Data protection.
- id: azure-load-balancer-open-inbound-rules
  name: Standard Load Balancer Inbound Rules Combined With Any-Source NSG Allow
  description: |
    Standard Load Balancer is closed by default and only passes traffic that NSGs allow. Teams add any-source allow rules to make the rules work and leave management ports open.

    Attack scenario: A team adds an NSG rule allowing TCP 3389 from Internet to make remote access work through a load balancer inbound NAT rule.

    Impact: Direct exposure of management and application ports.

    Severity: High

    Terraform indicators: azurerm_lb_nat_rule with frontend_port 3389 or 22; azurerm_network_security_rule { source_address_prefix = "*" or "Internet", access = "Allow" } on the backend subnet.

    References: MCSB v2 NS-1, NS-3; NIST SP 800-53 Rev. 5 SC-7, SC-32, AC-4, CM-7, SI-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1021, T1190; Microsoft Learn: Secure Azure Load Balancer.
- id: azure-logic-apps-secrets-in-workflow
  name: Logic Apps Secrets Embedded in Workflow Definitions
  description: |
    Credentials are written directly into workflow definitions, parameters or connections instead of Key Vault references and managed identities. Anyone who can read the definition or the run history obtains them.

    Attack scenario: A reader opens the code view of a workflow and copies a bearer token and a database password.

    Impact: Credential disclosure and access to connected systems.

    Severity: High

    Terraform indicators: azurerm_logic_app_workflow.parameters or workflow_parameters containing credentials; azurerm_logic_app_standard.app_settings with plaintext secrets; azurerm_logic_app_standard.key_vault_reference_identity_id unset.

    References: MCSB v2 IM-8; NIST SP 800-53 Rev. 5 IA-5, SI-4, RA-5, SC-12, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (h), (i); MITRE ATT&CK T1552.001; Microsoft Learn: Logic Apps security baseline, Best practices for protecting secrets.
- id: azure-logic-apps-connection-credentials
  name: Logic Apps Connectors Use Stored Credentials Instead of Managed Identity
  description: |
    Connectors authenticate with service principal secrets, passwords or keys stored in API connections. Credentials must be rotated manually, are readable by contributors and are reused across workflows.

    Attack scenario: A contributor creates a new workflow that reuses an existing API connection to Office 365 and reads a shared mailbox.

    Impact: Connector credential abuse and uncontrolled access to connected services.

    Severity: High

    Terraform indicators: azurerm_api_connection.parameter_values containing passwords or client secrets; azurerm_logic_app_workflow.identity absent; azurerm_role_assignment { role_definition_name = "Logic App Contributor" } at subscription scope.

    References: MCSB v2 IM-3, IM-8; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-4, IA-5, IA-9; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (h), (j); MITRE ATT&CK T1552.001, T1078.004; Microsoft Learn: Authenticate access with managed identities in Azure Logic Apps.
- id: azure-logic-apps-anonymous-request-trigger
  name: Logic Apps Request Trigger Callable Without Authentication
  description: |
    An HTTP request trigger accepts calls authenticated only by the SAS token embedded in the callback URL, with no caller IP restriction or Entra authorization. Anyone who learns the URL can start the workflow and inject data.

    Attack scenario: A trigger URL pasted into a chat is replayed by an attacker to create tickets and send mail through the workflow.

    Impact: Unauthorized workflow execution and data injection.

    Severity: High

    Terraform indicators: azurerm_logic_app_workflow.access_control.trigger.allowed_caller_ip_address_range empty; azurerm_logic_app_workflow.access_control.trigger.open_authentication_policy absent; azurerm_logic_app_trigger_http_request used with the callback_url shared externally.

    References: MCSB v2 IM-1, NS-2; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, NET.1.1, NET.3.2, APP.3.1; NIS2 Art. 21(2) (i), (j), (a); MITRE ATT&CK T1190; Microsoft Learn: Secure access and data in Azure Logic Apps, Request trigger authorization.
- id: azure-logic-apps-run-history-data-exposure
  name: Logic Apps Run History Exposes Inputs and Outputs
  description: |
    Run history stores the inputs and outputs of every action, including tokens, personal data and API responses. Users with Reader or Logic App Operator access can view them unless secure inputs and outputs and content access restrictions are configured.

    Attack scenario: A support user with read access opens run history and reads a customer's identity document returned by an HTTP action.

    Impact: Disclosure of personal and secret data through run history.

    Severity: Medium

    Terraform indicators: azurerm_logic_app_workflow.access_control.content.allowed_caller_ip_address_range empty; no secure inputs or outputs configured on sensitive actions; azurerm_role_assignment { role_definition_name = "Logic App Operator" } granted broadly.

    References: MCSB v2 DP-2, IM-7; NIST SP 800-53 Rev. 5 AC-4, SI-4, AC-2, AC-3, AC-6, AC-16; BSI IT-Grundschutz CON.1, ORP.4; NIS2 Art. 21(2) (h), (i); MITRE ATT&CK T1530; Microsoft Learn: Secure access and data in Azure Logic Apps, Mask inputs and outputs in run history.
- id: azure-logic-apps-missing-logging
  name: Logic Apps Diagnostics Not Collected
  description: |
    Run and trigger events are not exported to a workspace, so failed runs, unexpected triggers and workflow changes cannot be investigated. Legacy ISE-based deployments are retired and no longer receive customer-managed key guidance.

    Attack scenario: A workflow is edited to forward data to an external endpoint; no diagnostic log shows when or by whom.

    Impact: No evidence for workflow tampering or data forwarding.

    Severity: Medium

    Terraform indicators: azurerm_monitor_diagnostic_setting for azurerm_logic_app_workflow or azurerm_logic_app_standard missing; azurerm_logic_app_workflow.integration_service_environment_id still referenced.

    References: MCSB v2 LT-3, DP-5; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4, SC-12; BSI IT-Grundschutz OPS.1.1.5, DER.1, CON.1; NIS2 Art. 21(2) (b), (h); MITRE ATT&CK T1070; Microsoft Learn: Monitor Logic Apps, Set up Azure Monitor logs.
- id: azure-logic-apps-standard-public-and-basic-auth
  name: Logic Apps Standard With Public Access and Basic Publishing Credentials
  description: |
    Standard logic apps run on App Service infrastructure. Public network access, FTP and SCM basic publishing credentials and old TLS settings stay enabled, exposing the site management plane.

    Attack scenario: An attacker uses leaked publishing credentials to push a modified workflow through the SCM endpoint.

    Impact: Workflow tampering and credential exposure through the management endpoints.

    Severity: High

    Terraform indicators: azurerm_logic_app_standard.public_network_access = "Enabled"; azurerm_logic_app_standard.scm_publish_basic_authentication_enabled = true; azurerm_logic_app_standard.ftp_publish_basic_authentication_enabled = true; azurerm_logic_app_standard.https_only = false; azurerm_logic_app_standard.site_config.min_tls_version = "1.0".

    References: MCSB v2 NS-2, IM-1; NIST SP 800-53 Rev. 5 SC-7, AC-4, AC-2, AC-3, AC-6, SC-2; BSI IT-Grundschutz NET.1.1, NET.3.2, ORP.4; NIS2 Art. 21(2) (a), (i), (j); MITRE ATT&CK T1190, T1078; Microsoft Learn: Secure Azure Logic Apps Standard, Logic Apps security baseline.
- id: azure-ml-public-exposure
  name: Machine Learning Workspace and Compute Publicly Reachable
  description: |
    The workspace accepts connections from the internet, compute instances and clusters have public IP addresses and no managed network or virtual network isolation applies. Studio, notebooks and endpoints depend only on identity.

    Attack scenario: An attacker with a stolen token opens the workspace from the internet, starts a notebook on a public compute instance and reads datastore contents.

    Impact: Exposure of training data and models and code execution on managed compute.

    Severity: High

    Terraform indicators: azurerm_machine_learning_workspace.public_network_access_enabled = true; azurerm_machine_learning_workspace.managed_network.isolation_mode = "Disabled"; azurerm_machine_learning_workspace.v1_legacy_mode_enabled = true; azurerm_machine_learning_compute_instance.node_public_ip_enabled = true; azurerm_machine_learning_compute_instance.subnet_resource_id unset; no azurerm_private_endpoint with subresource_names = ["amlworkspace"].

    References: MCSB v2 NS-2, NS-1, PV-2; NIST SP 800-53 Rev. 5 SC-7, AC-4, SC-32, CM-7, CM-2, CM-3; BSI IT-Grundschutz NET.1.1, NET.3.2, OPS.2.2, OPS.1.1.3; NIS2 Art. 21(2) (a), (e); MITRE ATT&CK T1530, T1190; Microsoft Learn: Secure Azure Machine Learning workspace resources using virtual networks, Managed virtual network isolation.
- id: azure-ml-compute-local-auth-and-ssh
  name: Machine Learning Compute With Local Authentication and Public SSH
  description: |
    Compute instances and clusters allow local authentication and SSH with password or key access, and workspaces use system identities with broad rights. Users and attackers reach nodes outside the workspace's access control.

    Attack scenario: An attacker with a leaked SSH key logs in to a compute cluster node with a public IP and reads credentials mounted from the workspace.

    Impact: Node compromise and access to workspace storage and key vault.

    Severity: High

    Terraform indicators: azurerm_machine_learning_compute_instance.local_auth_enabled = true; azurerm_machine_learning_compute_instance.ssh.public_key set; azurerm_machine_learning_compute_cluster.ssh_public_access_enabled = true; azurerm_machine_learning_compute_cluster.admin_password set; azurerm_machine_learning_workspace.identity { type = "SystemAssigned" } with Contributor on the resource group.

    References: MCSB v2 IM-1, IM-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i), (j); MITRE ATT&CK T1078.004, T1021; Microsoft Learn: Set up authentication for Azure Machine Learning resources.
- id: azure-ml-platform-key-encryption
  name: Machine Learning Data Encrypted Only With Platform Keys
  description: |
    Workspace metadata and associated resources use Microsoft-managed keys and high business impact mode is off, so key-level revocation and reduced telemetry for sensitive workspaces are unavailable.

    Attack scenario: A regulator requires customer-managed keys for models trained on personal data; the workspace was created without them and cannot be switched.

    Impact: No key-level control and non-compliance for sensitive workloads.

    Severity: Medium

    Terraform indicators: azurerm_machine_learning_workspace.encryption.key_id unset; azurerm_machine_learning_workspace.high_business_impact = false.

    References: MCSB v2 DP-5; NIST SP 800-53 Rev. 5 SC-12, SC-28; BSI IT-Grundschutz CON.1; NIS2 Art. 21(2) (h); MITRE ATT&CK T1530; Microsoft Learn: Customer-managed keys for Azure Machine Learning.
- id: azure-ml-datastore-credential-exposure
  name: Machine Learning Datastores Hold Account Keys and SAS Tokens
  description: |
    Datastores are registered with storage account keys or SAS tokens instead of identity-based access. Anyone who can read the datastore definition or access the workspace secrets obtains long-lived credentials.

    Attack scenario: A data scientist lists workspace secrets and copies the blob datastore account key to access production data outside the workspace.

    Impact: Persistent access to storage beyond workspace controls.

    Severity: High

    Terraform indicators: azurerm_machine_learning_datastore_blobstorage.account_key or shared_access_signature set; azurerm_machine_learning_datastore_blobstorage.service_data_auth_identity unset.

    References: MCSB v2 IM-3, IM-8; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-4, IA-5, IA-9; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (h), (j); MITRE ATT&CK T1552.001; Microsoft Learn: Create and manage datastores, Credential-less data access.
- id: azure-ml-untrusted-model-and-environment
  name: Untrusted Models, Packages and Environments Executed in Machine Learning
  description: |
    Models, notebooks and environments from external sources are loaded and executed on managed compute. Serialized model formats and package dependencies can execute arbitrary code at load time with the compute's identity.

    Attack scenario: A pickled model downloaded from a public hub executes a payload when loaded and exfiltrates the workspace managed identity token.

    Impact: Code execution on compute, credential theft and training data exfiltration.

    Severity: High

    Terraform indicators: azurerm_machine_learning_workspace.container_registry_id pointing to a registry that accepts unscanned images; azurerm_machine_learning_compute_cluster with outbound internet access and identity with broad rights.

    References: MCSB v2 DS-6, PV-6; NIST SP 800-53 Rev. 5 CM-2, CM-3, SI-2, SI-7, RA-5; BSI IT-Grundschutz OPS.2.2, OPS.1.1.3; NIS2 Art. 21(2) (d), (e); MITRE ATT&CK T1195, T1059; Microsoft Learn: Azure Machine Learning security baseline, Secure code best practices.
- id: azure-ml-outdated-compute-instances
  name: Machine Learning Compute Instances Not Patched
  description: |
    Long-lived compute instances run old images and unpatched packages because they are never recreated. Known vulnerabilities remain exploitable from notebooks and the network.

    Attack scenario: An attacker exploits a known vulnerability in an old Jupyter or kernel package on a long-running instance.

    Impact: Code execution on compute and access to workspace data.

    Severity: Medium

    Terraform indicators: azurerm_machine_learning_compute_instance created once with no recreation schedule; azurerm_machine_learning_compute_instance.node_public_ip_enabled = true.

    References: MCSB v2 PV-2, PV-6; NIST SP 800-53 Rev. 5 CM-2, CM-3, CM-6, CM-7, SI-2, RA-5; BSI IT-Grundschutz OPS.2.2, OPS.1.1.3; NIS2 Art. 21(2) (a), (e); MITRE ATT&CK T1190; Microsoft Learn: Azure Machine Learning compute instances, Vulnerability management in Azure Machine Learning.
- id: azure-ml-missing-logging
  name: Machine Learning Workspace Activity Not Logged
  description: |
    Workspace resource logs for compute, jobs and model operations are not exported, so misuse of compute and data access cannot be reconstructed.

    Attack scenario: A user runs a large job that copies a dataset to external storage; no log shows the job or its output target.

    Impact: No evidence for investigation of data and compute misuse.

    Severity: Medium

    Terraform indicators: azurerm_monitor_diagnostic_setting for azurerm_machine_learning_workspace missing.

    References: MCSB v2 LT-3; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b); MITRE ATT&CK T1070; Microsoft Learn: Monitor Azure Machine Learning.
- id: azure-managed-grafana-public-exposure
  name: Managed Grafana Publicly Reachable
  description: |
    The Grafana instance is reachable from the internet with no private endpoint, so dashboards, data source proxies and the API are exposed to credential attacks and token replay.

    Attack scenario: A stolen Entra token or API key opens the instance from the internet and queries connected Azure Monitor and SQL data sources.

    Impact: Disclosure of operational and business telemetry and abuse of data source access.

    Severity: High

    Terraform indicators: azurerm_dashboard_grafana.public_network_access_enabled = true (default); no azurerm_private_endpoint with subresource_names = ["grafana"].

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1530, T1190; Microsoft Learn: Set up private access to Azure Managed Grafana, Secure Azure Managed Grafana.
- id: azure-managed-grafana-api-keys-and-service-accounts
  name: Managed Grafana API Keys and Service Accounts Bypass Entra Sign-In
  description: |
    API keys and service accounts are enabled and often created without expiry, so tokens bypass Entra ID sign-in, Conditional Access and MFA and stay valid for long periods.

    Attack scenario: A non-expiring service account token lands in a CI pipeline log; an attacker uses it to export dashboards and data source configuration.

    Impact: Long-lived credential exposure and access outside Entra controls.

    Severity: Medium

    Terraform indicators: azurerm_dashboard_grafana.api_key_enabled = true; service account tokens managed outside Terraform without expiry.

    References: MCSB v2 IM-1, IM-8; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1078.004, T1552.001; Microsoft Learn: Secure Azure Managed Grafana.
- id: azure-managed-grafana-datasource-credentials
  name: Managed Grafana Data Source Credentials Stored in Grafana
  description: |
    Data sources are configured with stored passwords or tokens instead of managed identity or current-user authentication. Grafana administrators and anyone who reaches the data source proxy can use or read these secrets.

    Attack scenario: A Grafana editor uses the data source proxy to run queries with the stored database credential against tables the editor is not entitled to.

    Impact: Data access beyond the user's entitlement and disclosure of data source secrets.

    Severity: High

    Terraform indicators: azurerm_dashboard_grafana.identity missing for data source access; azurerm_dashboard_grafana.azure_monitor_workspace_integrations granting broad read; azurerm_role_assignment { role_definition_name = "Monitoring Reader" } at subscription scope for the Grafana identity.

    References: MCSB v2 IM-3, DP-8; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-4, IA-5, IA-9; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (h), (j); MITRE ATT&CK T1552.001, T1213; Microsoft Learn: Secure Azure Managed Grafana data sources.
- id: azure-managed-grafana-admin-role-overgrant
  name: Managed Grafana Admin Role Granted Broadly
  description: |
    Grafana Admin and Editor roles are assigned to large groups. Admins can change data sources, users and permissions, and editors can build queries that read everything the data sources allow.

    Attack scenario: A user with Grafana Editor adds a new panel with a query against a sensitive workspace using the shared data source identity.

    Impact: Unauthorized data access through shared data source identity.

    Severity: Medium

    Terraform indicators: azurerm_role_assignment { role_definition_name = "Grafana Admin" or "Grafana Editor" } granted to broad groups or at subscription scope.

    References: MCSB v2 PA-7, IM-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, AC-16; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1078.004; Microsoft Learn: Azure Managed Grafana roles.
- id: azure-managed-hsm-public-exposure
  name: Managed HSM Reachable From Public Networks
  description: |
    The Managed HSM data plane accepts requests from public networks and network ACLs default to Allow, so identities with key permissions can use the HSM from anywhere.

    Attack scenario: An attacker with a compromised crypto user identity signs and decrypts data from the internet.

    Impact: Misuse of root keys from untrusted networks.

    Severity: High

    Terraform indicators: azurerm_key_vault_managed_hardware_security_module.public_network_access_enabled = true (default); azurerm_key_vault_managed_hardware_security_module.network_acls.default_action = "Allow"; no azurerm_private_endpoint with subresource_names = ["managedhsm"].

    References: MCSB v2 NS-2, DP-8; NIST SP 800-53 Rev. 5 SC-7, AC-4, IA-5, SC-12, SC-17; BSI IT-Grundschutz NET.1.1, NET.3.2, ORP.4, CON.1; NIS2 Art. 21(2) (a), (h), (i); MITRE ATT&CK T1552, T1530; Microsoft Learn: Secure your Azure Managed HSM deployment, Network security for Managed HSM.
- id: azure-managed-hsm-purge-protection-disabled
  name: Managed HSM Without Purge Protection
  description: |
    Without purge protection, an administrator can permanently delete the HSM or individual keys before the retention period ends. Data encrypted with those keys becomes unrecoverable.

    Attack scenario: A malicious insider deletes and purges the HSM that holds the root keys of the database encryption chain.

    Impact: Permanent loss of cryptographic material and of all data protected by it.

    Severity: Critical

    Terraform indicators: azurerm_key_vault_managed_hardware_security_module.purge_protection_enabled = false (default); azurerm_key_vault_managed_hardware_security_module.soft_delete_retention_days = 7.

    References: MCSB v2 DP-6, BR-2; NIST SP 800-53 Rev. 5 IA-5, SC-12, SC-28, CP-9, SC-13; BSI IT-Grundschutz CON.1, CON.3; NIS2 Art. 21(2) (h), (c); MITRE ATT&CK T1485; Microsoft Learn: Managed HSM soft delete and purge protection.
- id: azure-managed-hsm-single-custodian-security-domain
  name: Managed HSM Security Domain Held by a Single Custodian
  description: |
    The security domain is protected by too few key holders or by keys stored together. A single person can recover or control the HSM without a second authorizer.

    Attack scenario: One administrator holding all security domain keys restores the HSM into a new instance to extract the key material.

    Impact: Loss of dual control over the HSM and a path to copy key hierarchy.

    Severity: High

    Terraform indicators: azurerm_key_vault_managed_hardware_security_module.security_domain_quorum = 2 with security_domain_key_vault_certificate_ids holding the minimum of three certificates stored in one vault; azurerm_key_vault_managed_hardware_security_module.admin_object_ids listing one person.

    References: MCSB v2 PA-1, DP-6; NIST SP 800-53 Rev. 5 AC-2, AC-5, AC-6, IA-5, SC-12, SC-28; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (h); MITRE ATT&CK T1078.004; Microsoft Learn: Managed HSM security domain overview.
- id: azure-managed-hsm-no-key-autorotation
  name: Managed HSM Keys Without Rotation or Expiry
  description: |
    Keys are never rotated and have no expiration date. A leaked key stays valid for years and old versions continue to protect new data.

    Attack scenario: A key version copied during an incident years ago still decrypts current data because no rotation ever took place.

    Impact: Long exposure window after key compromise.

    Severity: Medium

    Terraform indicators: azurerm_key_vault_managed_hardware_security_module_key.expiration_date unset; no rotation policy on the key; azurerm_key_vault_managed_hardware_security_module_key.not_before_date unset.

    References: MCSB v2 DP-6; NIST SP 800-53 Rev. 5 IA-5, SC-12, SC-28; BSI IT-Grundschutz CON.1, ORP.4; NIS2 Art. 21(2) (h), (i); MITRE ATT&CK T1552; Microsoft Learn: Configure key auto-rotation in Managed HSM.
- id: azure-managed-hsm-missing-logging
  name: Managed HSM Operations Not Logged
  description: |
    Audit logs for key operations are not exported, so key use, role changes and exports cannot be investigated.

    Attack scenario: A key is used to decrypt a data key outside normal workflows; no audit entry exists to show the caller.

    Impact: No evidence of key misuse.

    Severity: High

    Terraform indicators: azurerm_monitor_diagnostic_setting for the Managed HSM missing the AuditEvent category.

    References: MCSB v2 LT-3, DP-8; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4, IA-5; BSI IT-Grundschutz OPS.1.1.5, DER.1, ORP.4, CON.1; NIS2 Art. 21(2) (b), (h), (i); MITRE ATT&CK T1070; Microsoft Learn: Enable Managed HSM logging.
- id: azure-managed-hsm-overbroad-local-rbac
  name: Managed HSM Local RBAC Roles Granted Broadly
  description: |
    Managed HSM Administrator, Crypto Officer or Crypto User roles are assigned broadly or at all-keys scope. Holders can create, delete, wrap and unwrap any key.

    Attack scenario: An application identity with Crypto User at all-keys scope unwraps data keys belonging to other applications.

    Impact: Cross-application key access and uncontrolled administrative changes.

    Severity: High

    Terraform indicators: azurerm_key_vault_managed_hardware_security_module.admin_object_ids with many entries; role assignments to applications at scope "/" instead of a single key.

    References: MCSB v2 PA-7, DP-8; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, IA-5, SC-12; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (h); MITRE ATT&CK T1078.004, T1552; Microsoft Learn: Managed HSM local RBAC built-in roles.
- id: azure-monitor-public-ingestion-and-query
  name: Azure Monitor Agents and Queries Use Public Channels
  description: |
    VM agents, workspaces and Application Insights ingest and query over public endpoints because no Azure Monitor Private Link Scope restricts access modes. Telemetry crosses public paths and can be injected or read from outside.

    Attack scenario: An attacker with a workspace key sends forged events from the internet, or reads logs through the public query endpoint with a stolen token.

    Impact: Disclosure of telemetry and poisoning of monitoring data.

    Severity: Medium

    Terraform indicators: azurerm_monitor_private_link_scope.ingestion_access_mode = "Open"; azurerm_monitor_private_link_scope.query_access_mode = "Open"; azurerm_monitor_data_collection_endpoint.public_network_access_enabled = true.

    References: MCSB v2 NS-2, LT-5; NIST SP 800-53 Rev. 5 SC-7, AC-4, AU-2, AU-3, AU-6, AU-7; BSI IT-Grundschutz NET.1.1, NET.3.2, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (a), (b); MITRE ATT&CK T1530, T1040; Microsoft Learn: Use Azure Private Link to connect networks to Azure Monitor, Secure your Azure Monitor deployment.
- id: azure-monitor-platform-key-encryption
  name: Azure Monitor Logs Without Customer-Managed Keys or Double Encryption
  description: |
    Logs and saved queries are encrypted with platform keys only and not stored in customer-owned storage, so access cannot be revoked with an organization-controlled key.

    Attack scenario: Regulated security logs are retained in a shared workspace with no customer key; an audit requires key custody.

    Impact: No key-level revocation and non-compliance for regulated log data.

    Severity: Low

    Terraform indicators: azurerm_log_analytics_cluster without azurerm_log_analytics_cluster_customer_managed_key; azurerm_log_analytics_cluster.identity missing; saved queries not stored in a customer storage account.

    References: MCSB v2 DP-5, LT-5; NIST SP 800-53 Rev. 5 SC-12, SC-28, AU-2, AU-3, AU-6, AU-7; BSI IT-Grundschutz CON.1, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (h), (b); MITRE ATT&CK T1530; Microsoft Learn: Azure Monitor customer-managed keys.
- id: azure-monitor-not-security-monitoring
  name: Azure Monitor Used in Place of Security Monitoring
  description: |
    Azure Monitor collects platform and security data but is not a security monitoring solution. Without analytics rules, correlation and response, attacks go unseen despite complete data collection.

    Attack scenario: Failed sign-ins and privilege changes are logged for months; nobody sees the pattern because no detection rules run on the data.

    Impact: Missed detection of attacks that the collected data would have revealed.

    Severity: Medium

    Terraform indicators: azurerm_monitor_diagnostic_setting enabled without azurerm_sentinel_alert_rule_scheduled or azurerm_security_center_subscription_pricing { tier = "Standard" }.

    References: MCSB v2 LT-1, LT-2; NIST SP 800-53 Rev. 5 SI-4, AU-6, AU-2, IA-4; BSI IT-Grundschutz OPS.1.1.5, DER.1, DER.2.1; NIS2 Art. 21(2) (b); MITRE ATT&CK T1070; Microsoft Learn: Secure your Azure Monitor deployment, Microsoft Sentinel overview.
- id: azure-monitor-container-insights-legacy-auth
  name: Container Insights Connected With Legacy Certificate Authentication
  description: |
    Kubernetes clusters connect to Container Insights with local certificate-based authentication rather than managed identity. Certificates are distributed to nodes and rotate less often.

    Attack scenario: A certificate copied from a node is used to send forged metrics or read cluster monitoring configuration.

    Impact: Credential exposure and poisoned cluster telemetry.

    Severity: Low

    Terraform indicators: azurerm_kubernetes_cluster.oms_agent.msi_auth_for_monitoring_enabled = false; azurerm_kubernetes_cluster.oms_agent without a user-assigned identity.

    References: MCSB v2 IM-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-4, IA-5, IA-9; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i), (j); MITRE ATT&CK T1552; Microsoft Learn: Best practices for monitoring Kubernetes with Azure Monitor.
- id: azure-monitor-alert-suppression
  name: Alert Rules Disabled or Suppressed
  description: |
    Alert rules, action groups or alert processing rules can be disabled or set to suppress notifications by anyone with Monitoring Contributor, hiding an attack from the responders.

    Attack scenario: Before encrypting data, an attacker creates an alert processing rule that suppresses all notifications for the production subscription.

    Impact: Security and availability alerts never reach responders.

    Severity: High

    Terraform indicators: azurerm_monitor_alert_processing_rule_suppression created outside CI/CD; azurerm_role_assignment { role_definition_name = "Monitoring Contributor" } granted broadly; azurerm_monitor_activity_log_alert missing for alert rule changes.

    References: MCSB v2 LT-3, PA-7; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4, AC-2; BSI IT-Grundschutz OPS.1.1.5, DER.1, ORP.4, DER.2.1; NIS2 Art. 21(2) (b), (i); MITRE ATT&CK T1685, T1070; Microsoft Learn: Alert processing rules, Azure Monitor security baseline.
- id: azure-mysql-public-exposure
  name: MySQL Flexible Server Publicly Reachable
  description: |
    The server accepts connections from the internet because public access is enabled and firewall rules allow wide ranges instead of private access through a delegated subnet.

    Attack scenario: An attacker scans for the server FQDN and brute-forces administrator credentials from the internet.

    Impact: Data disclosure and database takeover.

    Severity: High

    Terraform indicators: azurerm_mysql_flexible_server.public_network_access = "Enabled"; azurerm_mysql_flexible_server.delegated_subnet_id unset; azurerm_mysql_flexible_server_firewall_rule with start_ip_address = "0.0.0.0" and end_ip_address = "255.255.255.255".

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2, APP.4.3; NIS2 Art. 21(2) (a), (e); MITRE ATT&CK T1530, T1190; Microsoft Learn: Networking overview for Azure Database for MySQL flexible server.
- id: azure-mysql-insecure-transport
  name: MySQL Connections Without Enforced TLS
  description: |
    Secure transport is not required or legacy TLS versions are allowed, so credentials and query results can be read or modified on the network path.

    Attack scenario: An application connects without TLS over a peered network; an attacker on the path records the password hash exchange and query results.

    Impact: Disclosure and tampering of database traffic.

    Severity: High

    Terraform indicators: azurerm_mysql_flexible_server_configuration { name = "require_secure_transport", value = "OFF" }; azurerm_mysql_flexible_server_configuration { name = "tls_version", value = "TLSv1,TLSv1.1" }.

    References: MCSB v2 DP-3; NIST SP 800-53 Rev. 5 SC-8; BSI IT-Grundschutz CON.1, APP.4.3; NIS2 Art. 21(2) (h), (e); MITRE ATT&CK T1040, T1557; Microsoft Learn: Connect with encrypted connections to Azure Database for MySQL.
- id: azure-mysql-password-authentication
  name: MySQL Local Password Authentication Without Entra Administrator
  description: |
    Applications connect with the local administrator password and no Microsoft Entra administrator is configured, so access depends on a shared secret without identity, MFA or per-user audit.

    Attack scenario: The administrator password from a deployment script is used from an unknown host; logs show only the shared account.

    Impact: Unattributable full database access.

    Severity: High

    Terraform indicators: azurerm_mysql_flexible_server.administrator_login and administrator_password set; azurerm_mysql_flexible_server_active_directory_administrator missing; password in Terraform state.

    References: MCSB v2 IM-1, DP-8; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, CON.1, APP.4.3; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1078.004, T1552.001; Microsoft Learn: Use Microsoft Entra ID for authentication with Azure Database for MySQL.
- id: azure-mysql-platform-key-encryption
  name: MySQL Data Encrypted Only With Platform Keys
  description: |
    Server data and backups use service-managed keys only and no customer-managed key protects them, so access cannot be revoked at key level.

    Attack scenario: A regulator requires customer-managed keys for personal data; the server cannot comply without recreation.

    Impact: No key-level revocation and non-compliance.

    Severity: Low

    Terraform indicators: azurerm_mysql_flexible_server.customer_managed_key unset; azurerm_mysql_flexible_server.identity missing for key access.

    References: MCSB v2 DP-4, DP-5; NIST SP 800-53 Rev. 5 SC-28, SC-12; BSI IT-Grundschutz CON.1, APP.4.3; NIS2 Art. 21(2) (h), (e); MITRE ATT&CK T1530; Microsoft Learn: Data encryption for Azure Database for MySQL flexible server.
- id: azure-mysql-insufficient-backup
  name: MySQL Backups Short-Lived or Not Geo-Redundant
  description: |
    Backup retention is short and backups are not geo-redundant, so a regional outage or a destructive change can leave no usable recovery point.

    Attack scenario: A destructive DELETE is discovered after the seven-day retention window; no backup contains the old data.

    Impact: Permanent data loss and long recovery.

    Severity: Medium

    Terraform indicators: azurerm_mysql_flexible_server.backup_retention_days = 7 (default); azurerm_mysql_flexible_server.geo_redundant_backup_enabled = false; no azurerm_management_lock on the server.

    References: MCSB v2 BR-1, BR-2; NIST SP 800-53 Rev. 5 CP-9, CP-10, SC-12, SC-13, SC-28; BSI IT-Grundschutz CON.3, APP.4.3; NIS2 Art. 21(2) (c), (e); MITRE ATT&CK T1485; Microsoft Learn: Backup and restore in Azure Database for MySQL flexible server.
- id: azure-mysql-no-threat-detection
  name: MySQL Threat Detection and Audit Logging Disabled
  description: |
    Defender for open-source relational databases is not enabled and audit logging is off, so brute force, anomalous access and administrative changes are not detected or recorded.

    Attack scenario: An attacker runs a slow brute-force attack and exports tables; with no Defender plan and no audit logs nothing alerts.

    Impact: Undetected compromise and no forensic data.

    Severity: Medium

    Terraform indicators: azurerm_security_center_subscription_pricing { resource_type = "OpenSourceRelationalDatabases", tier = "Free" }; azurerm_mysql_flexible_server_configuration { name = "audit_log_enabled", value = "OFF" }; azurerm_monitor_diagnostic_setting for the server missing.

    References: MCSB v2 LT-1, LT-3, IR-3; NIST SP 800-53 Rev. 5 SI-4, AU-6, AU-2, AU-3, AU-12, IR-4; BSI IT-Grundschutz OPS.1.1.5, DER.1, DER.2.1, APP.4.3; NIS2 Art. 21(2) (b), (e); MITRE ATT&CK T1070, T1110; Microsoft Learn: Audit logs in Azure Database for MySQL flexible server, Defender for open-source relational databases.
- id: azure-postgresql-public-exposure
  name: PostgreSQL Flexible Server Publicly Reachable
  description: |
    The server accepts connections from the internet because public access is enabled and firewall rules allow wide ranges instead of private access through a delegated subnet or private endpoint.

    Attack scenario: An attacker finds the server FQDN and attacks administrator credentials from the internet.

    Impact: Data disclosure and database takeover.

    Severity: High

    Terraform indicators: azurerm_postgresql_flexible_server.public_network_access_enabled = true; azurerm_postgresql_flexible_server.delegated_subnet_id unset; azurerm_postgresql_flexible_server_firewall_rule with start_ip_address = "0.0.0.0" and end_ip_address = "255.255.255.255".

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2, APP.4.3; NIS2 Art. 21(2) (a), (e); MITRE ATT&CK T1530, T1190; Microsoft Learn: Networking overview for Azure Database for PostgreSQL flexible server.
- id: azure-postgresql-insecure-transport
  name: PostgreSQL Connections Without Enforced TLS
  description: |
    Secure transport is not required or legacy TLS versions are allowed, so credentials and query results can be read or modified on the network path.

    Attack scenario: A legacy client connects without TLS; an attacker on the path captures the authentication exchange and data.

    Impact: Disclosure and tampering of database traffic.

    Severity: High

    Terraform indicators: azurerm_postgresql_flexible_server_configuration { name = "require_secure_transport", value = "OFF" }; azurerm_postgresql_flexible_server_configuration { name = "ssl_min_protocol_version", value = "TLSv1" }.

    References: MCSB v2 DP-3; NIST SP 800-53 Rev. 5 SC-8; BSI IT-Grundschutz CON.1, APP.4.3; NIS2 Art. 21(2) (h), (e); MITRE ATT&CK T1040, T1557; Microsoft Learn: Security in Azure Database for PostgreSQL flexible server, Networking with SSL and TLS.
- id: azure-postgresql-password-authentication
  name: PostgreSQL Password Authentication Without Entra Administrator
  description: |
    Password authentication stays enabled and no Entra administrator is configured, so access relies on shared secrets without identity, MFA or per-user audit.

    Attack scenario: A superuser password from a pipeline variable is used from an unknown host; logs show only the shared role.

    Impact: Unattributable full database access.

    Severity: High

    Terraform indicators: azurerm_postgresql_flexible_server.authentication.password_auth_enabled = true; azurerm_postgresql_flexible_server.authentication.active_directory_auth_enabled = false; azurerm_postgresql_flexible_server.administrator_password in Terraform state.

    References: MCSB v2 IM-1, DP-8; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, CON.1, APP.4.3; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1078.004, T1552.001; Microsoft Learn: Use Microsoft Entra ID for authentication with Azure Database for PostgreSQL.
- id: azure-postgresql-platform-key-encryption
  name: PostgreSQL Data Encrypted Only With Platform Keys
  description: |
    Server data and backups use service-managed keys only and no customer-managed key protects them, so access cannot be revoked at key level.

    Attack scenario: A compliance review requires customer-managed keys for regulated data; the server was created without them.

    Impact: No key-level revocation and non-compliance.

    Severity: Low

    Terraform indicators: azurerm_postgresql_flexible_server.customer_managed_key unset; azurerm_postgresql_flexible_server.identity missing for key access.

    References: MCSB v2 DP-4, DP-5; NIST SP 800-53 Rev. 5 SC-28, SC-12; BSI IT-Grundschutz CON.1, APP.4.3; NIS2 Art. 21(2) (h), (e); MITRE ATT&CK T1530; Microsoft Learn: Data encryption in Azure Database for PostgreSQL flexible server.
- id: azure-postgresql-insufficient-backup
  name: PostgreSQL Backups Short-Lived or Not Geo-Redundant
  description: |
    Backup retention is short and backups are not geo-redundant, so a regional outage or a destructive change can leave no usable recovery point.

    Attack scenario: A table is dropped and noticed after the retention window has passed; no backup contains it.

    Impact: Permanent data loss and long recovery.

    Severity: Medium

    Terraform indicators: azurerm_postgresql_flexible_server.backup_retention_days = 7 (default); azurerm_postgresql_flexible_server.geo_redundant_backup_enabled = false; no azurerm_management_lock on the server.

    References: MCSB v2 BR-1, BR-2; NIST SP 800-53 Rev. 5 CP-9, CP-10, SC-12, SC-13, SC-28; BSI IT-Grundschutz CON.3, APP.4.3; NIS2 Art. 21(2) (c), (e); MITRE ATT&CK T1485; Microsoft Learn: Backup and restore in Azure Database for PostgreSQL flexible server.
- id: azure-postgresql-no-threat-detection
  name: PostgreSQL Threat Detection and pgAudit Logging Disabled
  description: |
    Defender for open-source relational databases is not enabled and pgAudit and connection logging are off, so brute force, anomalous queries and role changes are neither detected nor recorded.

    Attack scenario: An attacker with a stolen role copies tables and creates a new superuser; no alert or audit record exists.

    Impact: Undetected compromise and no forensic data.

    Severity: Medium

    Terraform indicators: azurerm_security_center_subscription_pricing { resource_type = "OpenSourceRelationalDatabases", tier = "Free" }; azurerm_postgresql_flexible_server_configuration { name = "pgaudit.log" } unset; azurerm_postgresql_flexible_server_configuration { name = "log_connections", value = "off" }.

    References: MCSB v2 LT-1, LT-3, IR-3; NIST SP 800-53 Rev. 5 SI-4, AU-6, AU-2, AU-3, AU-12, IR-4; BSI IT-Grundschutz OPS.1.1.5, DER.1, DER.2.1, APP.4.3; NIS2 Art. 21(2) (b), (e); MITRE ATT&CK T1070, T1110; Microsoft Learn: Audit logging in Azure Database for PostgreSQL flexible server, Defender for open-source relational databases.
- id: azure-nat-gateway-outbound-unlogged
  name: NAT Gateway Outbound Connections Not Logged
  description: |
    NAT gateway flow logs are not enabled, so the destinations reached through the shared public IP are not recorded and unexpected outbound connections go unnoticed.

    Attack scenario: A compromised host beacons to a command-and-control server every minute; with no flow logs the destination is never visible.

    Impact: Undetected exfiltration and command-and-control traffic.

    Severity: Medium

    Terraform indicators: azurerm_monitor_diagnostic_setting for azurerm_nat_gateway missing the NatGatewayFlowlogsV1 category; azurerm_nat_gateway_public_ip_association present without logging.

    References: MCSB v2 LT-4; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4; BSI IT-Grundschutz OPS.1.1.5, DER.1, NET.1.1, NET.3.2; NIS2 Art. 21(2) (b), (a); MITRE ATT&CK T1070, T1048; Microsoft Learn: Manage NAT gateway flow logs, Secure your Azure NAT Gateway deployment.
- id: azure-nat-gateway-snat-exhaustion
  name: NAT Gateway SNAT Port Exhaustion
  description: |
    SNAT ports run out when workloads open many outbound connections to the same destination, and new outbound connections fail. Attackers can trigger this and no alert exists to show it.

    Attack scenario: A compromised workload opens thousands of connections to one endpoint; legitimate workloads in the same subnet cannot reach the internet.

    Impact: Outbound connectivity loss for all workloads using the gateway.

    Severity: Low

    Terraform indicators: azurerm_nat_gateway with a single public IP and no azurerm_monitor_metric_alert on SNAT connection failures; azurerm_nat_gateway.idle_timeout_in_minutes at a high value.

    References: MCSB v2 NS-5, LT-1; NIST SP 800-53 Rev. 5 SC-5, SI-4, AU-6; BSI IT-Grundschutz NET.1.1, NET.3.2, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (c), (a), (b); MITRE ATT&CK T1499; Microsoft Learn: Troubleshoot NAT gateway connectivity, Secure your Azure NAT Gateway deployment.
- id: azure-nat-gateway-unrestricted-egress
  name: NAT Gateway Allows Unrestricted Egress for Exfiltration
  description: |
    Every associated subnet can send traffic to any internet destination through the gateway with no filtering. Data exfiltration to external targets is not blocked, and connection counts alone do not reveal it.

    Attack scenario: An attacker with code execution uploads a database dump to an external storage account through the NAT gateway.

    Impact: Data exfiltration through an unfiltered outbound path.

    Severity: High

    Terraform indicators: azurerm_subnet_nat_gateway_association without azurerm_route_table forcing 0.0.0.0/0 to azurerm_firewall; azurerm_network_security_rule allowing outbound Internet on all ports.

    References: MCSB v2 NS-3, DP-2; NIST SP 800-53 Rev. 5 SC-7, AC-4, SI-4; BSI IT-Grundschutz NET.1.1, NET.3.2, CON.1; NIS2 Art. 21(2) (a), (h); MITRE ATT&CK T1048, T1567; Microsoft Learn: Secure your Azure NAT Gateway deployment.
- id: azure-netapp-files-nfs-export-overexposure
  name: NetApp Files NFS Export Open to Broad Clients With AUTH_SYS
  description: |
    Export policy rules allow wide CIDR ranges or any host and rely on AUTH_SYS, which trusts client-supplied user IDs. Any host that can reach the delegated subnet can mount the volume and impersonate any user.

    Attack scenario: A compromised VM in a peered network mounts the volume with root access enabled and reads and modifies all files as uid 0.

    Impact: Unauthorized read, write and ownership change of volume data.

    Severity: High

    Terraform indicators: azurerm_netapp_volume.export_policy_rule.allowed_clients = ["0.0.0.0/0"]; azurerm_netapp_volume.export_policy_rule.root_access_enabled = true; azurerm_netapp_volume.export_policy_rule.unix_read_write = true; azurerm_netapp_volume.kerberos_enabled = false.

    References: MCSB v2 NS-2, IM-7; NIST SP 800-53 Rev. 5 SC-7, AC-4, AC-2, AC-3, AC-6, AC-16; BSI IT-Grundschutz NET.1.1, NET.3.2, ORP.4, SYS.1.8; NIS2 Art. 21(2) (a), (i), (c); MITRE ATT&CK T1021; Microsoft Learn: Configure export policy for NFS volumes, NFSv4.1 Kerberos encryption for Azure NetApp Files.
- id: azure-netapp-files-dual-protocol-permission-mismatch
  name: NetApp Files Dual-Protocol Permission Mismatch
  description: |
    Dual-protocol volumes with mixed security styles allow NTFS ACLs and UNIX mode bits to conflict. A user can gain write access through the less restrictive protocol, creating silent privilege escalation.

    Attack scenario: A file protected by an NTFS ACL is writable by a UNIX user because the mode bits permit it; the user modifies a shared file through NFS.

    Impact: Unintended write access and policy bypass between protocols.

    Severity: Medium

    Terraform indicators: azurerm_netapp_volume.protocols = ["NFSv3", "CIFS"] with azurerm_netapp_volume.security_style = "unix" while SMB clients rely on NTFS ACLs; azurerm_netapp_volume.unix_permissions = "0777".

    References: MCSB v2 IM-7, PA-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-6, AC-16, AC-5; BSI IT-Grundschutz ORP.4, SYS.1.8; NIS2 Art. 21(2) (i), (c); MITRE ATT&CK T1078.004; Microsoft Learn: Configure dual-protocol volumes, Understand NAS permissions.
- id: azure-netapp-files-snapshot-and-backup-destruction
  name: NetApp Files Snapshots and Backups Deleted
  description: |
    Ransomware or an operator with Contributor rights deletes volumes, snapshots and backup vault copies, removing recovery points. Snapshot policies alone do not protect against principals that hold delete rights.

    Attack scenario: A compromised Contributor deletes the snapshot policy and all snapshots, then encrypts the volume contents.

    Impact: Loss of all recovery points for the volume.

    Severity: High

    Terraform indicators: azurerm_netapp_volume.data_protection_snapshot_policy only; no azurerm_netapp_backup_vault with an immutable policy; no azurerm_management_lock on azurerm_netapp_pool and azurerm_netapp_volume.

    References: MCSB v2 BR-2, LT-1; NIST SP 800-53 Rev. 5 CP-9, SC-12, SC-13, SC-28, SI-4, AU-6; BSI IT-Grundschutz CON.3, OPS.1.1.5, DER.1, SYS.1.8; NIS2 Art. 21(2) (c), (b); MITRE ATT&CK T1490, T1485; Microsoft Learn: Azure NetApp Files backup, Snapshots and ransomware protection.
- id: azure-netapp-files-platform-only-keys
  name: NetApp Files Volumes Use Platform-Managed Keys Only
  description: |
    Volumes use platform-managed keys, so the organization cannot revoke access to data at rest or demonstrate key custody for regulated workloads.

    Attack scenario: An auditor requests evidence of customer key custody for a regulated workload; the volumes cannot provide it.

    Impact: No key-level control and non-compliance.

    Severity: Low

    Terraform indicators: azurerm_netapp_volume.encryption_key_source = "Microsoft.NetApp"; azurerm_netapp_volume.key_vault_private_endpoint_id unset.

    References: MCSB v2 DP-4, DP-5; NIST SP 800-53 Rev. 5 SC-28, SC-12; BSI IT-Grundschutz CON.1, SYS.1.8; NIS2 Art. 21(2) (h), (c); MITRE ATT&CK T1530; Microsoft Learn: Configure customer-managed keys for Azure NetApp Files volume encryption.
- id: azure-netapp-files-network-activity-unlogged
  name: NetApp Files Mounts and Network Activity Not Logged
  description: |
    Mounts and traffic to the delegated subnet are not logged and account-level diagnostics are off, so unauthorized mounts and data access leave no trace.

    Attack scenario: A rogue host mounts a volume repeatedly over two days and no log records the source.

    Impact: No evidence for unauthorized volume access.

    Severity: Medium

    Terraform indicators: azurerm_monitor_diagnostic_setting for azurerm_netapp_account missing; azurerm_network_watcher_flow_log not covering the delegated subnet.

    References: MCSB v2 LT-4, LT-3; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4; BSI IT-Grundschutz OPS.1.1.5, DER.1, SYS.1.8; NIS2 Art. 21(2) (b), (c); MITRE ATT&CK T1070; Microsoft Learn: Azure NetApp Files security baseline, Monitor Azure NetApp Files.
- id: azure-netapp-files-directory-credential-exposure
  name: NetApp Files Active Directory Credentials and LDAP Without Signing
  description: |
    The NetApp account stores Active Directory join credentials in its configuration, and LDAP signing and TLS are disabled. Account configuration and Terraform state expose the join password, and unsigned LDAP can be relayed.

    Attack scenario: A reader of Terraform state copies the AD join account password and uses it to create computer objects in the domain.

    Impact: Directory credential exposure and weaker authentication for SMB and NFS clients.

    Severity: High

    Terraform indicators: azurerm_netapp_account.active_directory.password in state; azurerm_netapp_account.active_directory.ldap_signing_enabled = false; azurerm_netapp_account.active_directory.ldap_over_tls_enabled = false; azurerm_netapp_account.active_directory.aes_encryption_enabled = false.

    References: MCSB v2 IM-8, DP-3; NIST SP 800-53 Rev. 5 IA-5, SI-4, RA-5, SC-12, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1, APP.2.2, SYS.1.8; NIS2 Art. 21(2) (h), (i), (c); MITRE ATT&CK T1552.001, T1078.002; Microsoft Learn: Create Active Directory connections for Azure NetApp Files.
- id: azure-network-watcher-overbroad-packet-capture
  name: Network Watcher Packet Capture Rights Granted Broadly
  description: |
    Broad Contributor or Network Contributor rights allow starting packet captures on VMs. Captures include payload data and installing the capture extension runs code on the VM.

    Attack scenario: A user with Network Contributor starts a capture on a database VM and downloads the file from the storage account, including unencrypted queries.

    Impact: Disclosure of network payloads and credentials.

    Severity: Medium

    Terraform indicators: azurerm_role_assignment { role_definition_name = "Network Contributor" or "Contributor" } at subscription scope for non-network teams; packet capture files written to a broadly readable storage account (azurerm has no packet capture resource; captures are started through the portal, CLI or API).

    References: MCSB v2 PA-7, IM-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, AC-16; BSI IT-Grundschutz ORP.4, NET.1.1, NET.3.2; NIS2 Art. 21(2) (i), (a); MITRE ATT&CK T1040; Microsoft Learn: Secure your Azure Network Watcher deployment, Network Watcher RBAC permissions.
- id: azure-network-watcher-flow-log-storage-exposure
  name: Flow Log and Packet Capture Storage Exposed
  description: |
    Storage accounts that hold flow logs and packet captures are reachable from public networks. Connection metadata and payload data can be retrieved and reveal network topology and traffic patterns.

    Attack scenario: A leaked storage key is used to download months of flow logs to map the internal network.

    Impact: Disclosure of network topology and payload data.

    Severity: Medium

    Terraform indicators: azurerm_network_watcher_flow_log.storage_account_id referencing a storage account with public_network_access = "Enabled"; azurerm_storage_account.shared_access_key_enabled = true; no azurerm_private_endpoint for the log storage.

    References: MCSB v2 NS-2, DP-2; NIST SP 800-53 Rev. 5 SC-7, AC-4, SI-4; BSI IT-Grundschutz NET.1.1, NET.3.2, CON.1, SYS.1.8; NIS2 Art. 21(2) (a), (h), (c); MITRE ATT&CK T1530, T1580; Microsoft Learn: Secure your Azure Network Watcher deployment.
- id: azure-network-watcher-nsg-flow-log-retirement-gap
  name: NSG Flow Log Retirement Leaves a Logging Gap
  description: |
    NSG flow logs cannot be created since 30 June 2025 and retire on 30 September 2027, when existing NSG flow log resources are deleted. Without migration to virtual network flow logs, network logging silently ends, and flow logs that are disabled or without traffic analytics reduce visibility.

    Attack scenario: After the retirement date NSG flow log resources are removed; detection rules that depend on them stop producing data and nobody notices.

    Impact: Loss of network forensics and detection coverage.

    Severity: Medium

    Terraform indicators: azurerm_network_watcher_flow_log.target_resource_id pointing at a network security group; azurerm_network_watcher_flow_log.version = 1; azurerm_network_watcher_flow_log.traffic_analytics.enabled = false; azurerm_network_watcher_flow_log.enabled = false.

    References: MCSB v2 LT-4; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4; BSI IT-Grundschutz OPS.1.1.5, DER.1, NET.1.1, NET.3.2; NIS2 Art. 21(2) (b), (a); MITRE ATT&CK T1070; Microsoft Learn: Migrate from NSG flow logs to virtual network flow logs, Flow logging for network security groups.
- id: azure-queue-storage-platform-key-encryption
  name: Queue Storage Data Encrypted Only With Platform Keys
  description: |
    Queue messages are encrypted with Microsoft-managed keys and the queue service is not configured for a customer-managed key, so the organization cannot revoke access to queued data through its own key.

    Attack scenario: A regulator requires customer-managed keys for messages that carry personal data; the storage account's queue service uses account-level platform keys.

    Impact: No key-level control for queued business data.

    Severity: Low

    Terraform indicators: azurerm_storage_account.queue_encryption_key_type = "Service"; azurerm_storage_account_customer_managed_key missing for the account.

    References: MCSB v2 DP-5; NIST SP 800-53 Rev. 5 SC-12, SC-28; BSI IT-Grundschutz CON.1, SYS.1.8; NIS2 Art. 21(2) (h), (c); MITRE ATT&CK T1530; Microsoft Learn: Security recommendations for Queue Storage, Customer-managed keys for Azure Storage encryption.
- id: azure-queue-storage-message-injection
  name: Queue Messages Injected or Tampered by Untrusted Writers
  description: |
    Consumers trust queue messages as work instructions, but any identity with write rights can enqueue messages. Poisoned messages can reference attacker-controlled blobs or URLs and trigger unintended processing.

    Attack scenario: An attacker with a leaked SAS adds messages that point to a malicious file; a worker downloads and processes it with its own identity.

    Impact: Unauthorized processing, code execution in consumers and corrupted business data.

    Severity: High

    Terraform indicators: azurerm_role_assignment { role_definition_name = "Storage Queue Data Contributor" } on whole accounts for application identities; azurerm_storage_account.shared_access_key_enabled = true; azurerm_storage_queue consumed by functions without message schema validation.

    References: MCSB v2 IM-7, NS-2; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-6, AC-16, SC-7, AC-4; BSI IT-Grundschutz ORP.4, NET.1.1, NET.3.2, APP.3.1; NIS2 Art. 21(2) (i), (a), (e); MITRE ATT&CK T1190, T1565; Microsoft Learn: Security recommendations for Queue Storage.
- id: azure-queue-storage-overbroad-queue-roles
  name: Queue Data Roles Assigned at Account Scope
  description: |
    Roles such as Storage Queue Data Contributor are assigned at account scope for broad groups or applications. Holders can read, delete and clear every queue, including those of other applications.

    Attack scenario: A compromised worker identity with account-scope queue rights clears a billing queue and reads messages from a queue that carries customer data.

    Impact: Cross-application message disclosure and loss.

    Severity: Medium

    Terraform indicators: azurerm_role_assignment { role_definition_name = "Storage Queue Data Contributor" or "Storage Queue Data Message Processor", scope = azurerm_storage_account.<name>.id }.

    References: MCSB v2 PA-7, IM-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, AC-16; BSI IT-Grundschutz ORP.4, SYS.1.8; NIS2 Art. 21(2) (i), (c); MITRE ATT&CK T1078.004, T1485; Microsoft Learn: Authorize access to queues using Microsoft Entra ID.
- id: azure-sentinel-security-logs-not-ingested
  name: Sentinel Without Security-Relevant Data Sources
  description: |
    Data connectors for identity, endpoint, network and cloud platform logs are not enabled, or ingestion filters drop too much. Detections cannot fire and features such as UEBA and Fusion lack data.

    Attack scenario: An attacker signs in from an anomalous location with a stolen token; the sign-in logs are not connected to Sentinel and no incident is created.

    Impact: Attacks stay undetected despite a SIEM being deployed.

    Severity: High

    Terraform indicators: azurerm_sentinel_log_analytics_workspace_onboarding present without azurerm_sentinel_data_connector_azure_active_directory, azurerm_sentinel_data_connector_azure_security_center or azurerm_sentinel_data_connector_office_365; transformation rules dropping security tables.

    References: MCSB v2 LT-1, LT-5; NIST SP 800-53 Rev. 5 SI-4, AU-6, AU-2, AU-3, AU-7, AU-12; BSI IT-Grundschutz OPS.1.1.5, DER.1, DER.2.1; NIS2 Art. 21(2) (b); MITRE ATT&CK T1070; Microsoft Learn: Microsoft Sentinel data connectors, Best practices for Microsoft Sentinel.
- id: azure-sentinel-analytics-rule-tampering
  name: Sentinel Analytics Rules Disabled or Modified
  description: |
    Analytics rules are disabled, edited to exclude attacker activity or stop running because the access token of their creator is lost. Rules tied to a departed user's permissions are automatically disabled.

    Attack scenario: An attacker with Microsoft Sentinel Contributor disables the rule that detects impossible travel and creates an exclusion for their own account.

    Impact: Detection coverage is removed without an alert.

    Severity: High

    Terraform indicators: azurerm_sentinel_alert_rule_scheduled.enabled = false; azurerm_sentinel_alert_rule_scheduled.suppression_enabled = true; azurerm_role_assignment { role_definition_name = "Microsoft Sentinel Contributor" } granted broadly; rules edited in the portal instead of Terraform.

    References: MCSB v2 LT-1, PA-7; NIST SP 800-53 Rev. 5 SI-4, AU-6, AC-2, AC-3, AC-5, AC-6; BSI IT-Grundschutz OPS.1.1.5, DER.1, ORP.4, DER.2.1; NIS2 Art. 21(2) (b), (i); MITRE ATT&CK T1685, T1070; Microsoft Learn: Threat detection in Microsoft Sentinel, Microsoft Sentinel roles and permissions.
- id: azure-sentinel-watchlist-data-exposure
  name: Sentinel Watchlists Hold Sensitive Data for Too Long
  description: |
    Watchlists with sensitive entries such as departing employees or internal ranges remain after the investigation and are visible to everyone who can read the workspace.

    Attack scenario: A watchlist of employees under investigation stays in the workspace; a reader with workspace access sees it.

    Impact: Disclosure of sensitive investigation and personnel data.

    Severity: Low

    Terraform indicators: azurerm_sentinel_watchlist.default_duration unset; azurerm_sentinel_watchlist items imported from sensitive CSV files committed to the repository.

    References: MCSB v2 DP-2, IM-7; NIST SP 800-53 Rev. 5 AC-4, SI-4, AC-2, AC-3, AC-6, AC-16; BSI IT-Grundschutz CON.1, ORP.4; NIS2 Art. 21(2) (h), (i); MITRE ATT&CK T1530; Microsoft Learn: Best practices for Microsoft Sentinel incident management.
- id: azure-sentinel-workspace-access-overbroad
  name: Sentinel Workspace and Table Access Granted Broadly
  description: |
    Workspace-level Reader or Contributor roles expose all security logs, including sign-ins, personal data and incident details, to large groups. Table-level restrictions are not used.

    Attack scenario: A developer with workspace Reader queries sign-in logs of executives and reads incident comments.

    Impact: Disclosure of sensitive security and personal data.

    Severity: Medium

    Terraform indicators: azurerm_role_assignment { role_definition_name = "Microsoft Sentinel Reader" or "Log Analytics Reader" } to broad groups at workspace scope.

    References: MCSB v2 IM-7, PA-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-6, AC-16, AC-5; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1530; Microsoft Learn: Manage access to Microsoft Sentinel data by resource.
- id: azure-sentinel-automation-privilege-abuse
  name: Sentinel Playbooks and Automation Rules Run With Excessive Rights
  description: |
    Playbooks (Logic Apps) and automation rules run with managed identities that hold broad rights such as disabling users or isolating machines. An attacker who can edit automation can use these rights or close incidents automatically.

    Attack scenario: An attacker with Automation Contributor adds an automation rule that closes every incident from a compromised host, and extends a playbook to reset a victim's password.

    Impact: Suppressed incidents and abuse of response rights.

    Severity: High

    Terraform indicators: azurerm_sentinel_automation_rule creating actions that close incidents without review; azurerm_role_assignment of "User Administrator" or "Contributor" to the playbook identity; azurerm_role_assignment { role_definition_name = "Microsoft Sentinel Automation Contributor" } granted broadly.

    References: MCSB v2 PA-7, IR-4; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, IR-4, AU-6; BSI IT-Grundschutz ORP.4, DER.1, DER.2.1; NIS2 Art. 21(2) (i), (b); MITRE ATT&CK T1685, T1098; Microsoft Learn: Authenticate playbooks to Microsoft Sentinel, Automation rules in Sentinel.
- id: azure-service-bus-public-exposure
  name: Service Bus Namespace Public Network Exposure
  description: |
    The namespace accepts connections from the internet because public network access is enabled and the network rule set allows all networks. Only a SAS token or identity protects queues and topics.

    Attack scenario: An attacker with a leaked connection string reads a payments queue and enqueues forged messages from the internet.

    Impact: Message disclosure and injection.

    Severity: High

    Terraform indicators: azurerm_servicebus_namespace.public_network_access_enabled = true (default); azurerm_servicebus_namespace.network_rule_set.default_action = "Allow"; no azurerm_private_endpoint with subresource_names = ["namespace"].

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1530, T1190; Microsoft Learn: Network security for Azure Service Bus, Private endpoints for Service Bus.
- id: azure-service-bus-sas-key-authentication
  name: Service Bus Shared Access Keys With Manage Rights
  description: |
    Local authentication stays enabled and applications use RootManageSharedAccessKey or manage-level authorization rules. Keys cannot be scoped to a caller and allow reading, sending and administering all entities.

    Attack scenario: A producer app's connection string with manage rights is committed; an attacker deletes queues and reads dead-letter messages.

    Impact: Full data-plane and management control of the namespace.

    Severity: High

    Terraform indicators: azurerm_servicebus_namespace.local_auth_enabled = true (default); azurerm_servicebus_namespace_authorization_rule { manage = true }; default_primary_connection_string in outputs.

    References: MCSB v2 IM-1, IM-8; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1078.004, T1552.001; Microsoft Learn: Authenticate and authorize an application with Microsoft Entra ID to access Service Bus entities.
- id: azure-service-bus-weak-tls
  name: Service Bus Accepts Legacy TLS Versions
  description: |
    The namespace accepts TLS versions below 1.2, so clients can be downgraded and captured on the network path.

    Attack scenario: An attacker on the path forces a legacy handshake and records a SAS token.

    Impact: Disclosure of credentials and messages in transit.

    Severity: Medium

    Terraform indicators: azurerm_servicebus_namespace.minimum_tls_version = "1.0" or "1.1".

    References: MCSB v2 DP-3; NIST SP 800-53 Rev. 5 SC-8; BSI IT-Grundschutz CON.1; NIS2 Art. 21(2) (h); MITRE ATT&CK T1040, T1557; Microsoft Learn: Security baseline for Azure Service Bus.
- id: azure-service-bus-platform-key-encryption
  name: Service Bus Data Without Customer-Managed Keys or Double Encryption
  description: |
    Messages at rest use platform keys only. Premium namespaces can use customer-managed keys and infrastructure encryption but they are not configured.

    Attack scenario: A compliance audit requires customer-managed keys for message data; the namespace uses platform keys.

    Impact: No key-level revocation and non-compliance.

    Severity: Low

    Terraform indicators: azurerm_servicebus_namespace.customer_managed_key unset; azurerm_servicebus_namespace.customer_managed_key.infrastructure_encryption_enabled = false; azurerm_servicebus_namespace.sku = "Standard".

    References: MCSB v2 DP-4, DP-5; NIST SP 800-53 Rev. 5 SC-28, SC-12; BSI IT-Grundschutz CON.1; NIS2 Art. 21(2) (h); MITRE ATT&CK T1530; Microsoft Learn: Configure customer-managed keys for encrypting Azure Service Bus data at rest.
- id: azure-service-bus-missing-logging
  name: Service Bus Operations Not Logged
  description: |
    Operational and runtime audit logs are not exported, so entity changes, key use and access failures cannot be investigated.

    Attack scenario: A queue is deleted and recreated with a different forwarding target; no log shows who made the change.

    Impact: No evidence for tampering and misuse.

    Severity: Medium

    Terraform indicators: azurerm_monitor_diagnostic_setting for azurerm_servicebus_namespace missing enabled_log for OperationalLogs and RuntimeAuditLogs.

    References: MCSB v2 LT-3; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b); MITRE ATT&CK T1070; Microsoft Learn: Monitor Azure Service Bus.
- id: azure-service-fabric-unsecured-cluster
  name: Service Fabric Cluster Running Without Security
  description: |
    The cluster was created without certificate or Windows security, so anonymous clients can run management operations. Security can only be configured when the cluster is created.

    Attack scenario: An attacker connects to the open management endpoint on port 19000 and deploys a service that runs on every node.

    Impact: Full compromise of the cluster and every service on it.

    Severity: Critical

    Terraform indicators: azurerm_service_fabric_cluster.certificate block absent; azurerm_service_fabric_cluster.client_certificate_thumbprint and azure_active_directory missing; azurerm_service_fabric_cluster.management_endpoint reachable from Internet.

    References: MCSB v2 IM-1, NS-2; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, NET.1.1, NET.3.2, SYS.1.6; NIS2 Art. 21(2) (i), (j), (a); MITRE ATT&CK T1190; Microsoft Learn: Best practices for Azure Service Fabric security, Service Fabric cluster security scenarios.
- id: azure-service-fabric-weak-client-authentication
  name: Service Fabric Clients Not Using Entra ID Authentication
  description: |
    Clients authenticate with shared client certificates instead of Microsoft Entra ID, so access cannot be tied to named users, revoked per user or protected by Conditional Access.

    Attack scenario: A shared administrator certificate is copied by a departed engineer and continues to work for months.

    Impact: Unattributable administrative access and long-lived credentials.

    Severity: High

    Terraform indicators: azurerm_service_fabric_cluster.azure_active_directory block absent; azurerm_service_fabric_cluster.client_certificate_thumbprint { is_admin = true } used by several people.

    References: MCSB v2 IM-1, IM-6; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i), (j); MITRE ATT&CK T1078.004; Microsoft Learn: Set up Microsoft Entra ID for client authentication on Service Fabric.
- id: azure-service-fabric-shared-client-certificate
  name: Service Fabric Client Certificates Shared and Expiry Not Monitored
  description: |
    Client certificates are shared among Service Fabric Explorer users and their expiry is not monitored. A stolen certificate gives full cluster access and expiry can lock out administrators.

    Attack scenario: A certificate with private key is stored on a shared drive; an attacker copies it and connects to the cluster as administrator.

    Impact: Full cluster access from a stolen file, or an outage when the certificate expires.

    Severity: High

    Terraform indicators: azurerm_service_fabric_cluster.client_certificate_thumbprint with is_admin = true; azurerm_service_fabric_cluster.certificate.thumbprint_secondary unset; certificate stored in azurerm_key_vault_certificate without expiry alert.

    References: MCSB v2 IM-8, DP-7; NIST SP 800-53 Rev. 5 IA-5, SI-4, RA-5, SC-12, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (h), (i), (j); MITRE ATT&CK T1552; Microsoft Learn: Service Fabric cluster security scenarios, Service Fabric architecture best practices.
- id: azure-service-fabric-public-management-endpoints
  name: Service Fabric Management Endpoints Publicly Reachable
  description: |
    Management endpoints such as the client connection port 19000 and the HTTP gateway 19080 are reachable from the internet instead of through jump servers and restrictive NSGs, which enlarges the attack surface of the cluster.

    Attack scenario: An attacker scans for Service Fabric Explorer and brute-forces the endpoint credentials from the internet.

    Impact: Cluster takeover through exposed management ports.

    Severity: High

    Terraform indicators: azurerm_network_security_rule allowing TCP 19000 and 19080 from Internet; azurerm_service_fabric_cluster.management_endpoint on a public load balancer.

    References: MCSB v2 NS-1, NS-2; NIST SP 800-53 Rev. 5 SC-7, SC-32, AC-4, CM-7; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1190; Microsoft Learn: Best practices for Azure Service Fabric security, Network isolation for Service Fabric.
- id: azure-service-fabric-reverse-proxy-exposure
  name: Service Fabric Reverse Proxy Exposes Internal Services
  description: |
    The built-in reverse proxy forwards requests to any service in the cluster over HTTP without authentication. Exposing the proxy port outside the cluster lets callers reach internal services.

    Attack scenario: An attacker calls the reverse proxy port from the internet with a service name and reaches an internal admin API.

    Impact: Unauthenticated access to internal services.

    Severity: High

    Terraform indicators: azurerm_service_fabric_cluster.reverse_proxy_certificate unset while the proxy port is open on the load balancer; azurerm_lb_rule for port 19081 on a public frontend.

    References: MCSB v2 NS-2, IM-1; NIST SP 800-53 Rev. 5 SC-7, AC-4, AC-2, AC-3, AC-6, SC-2; BSI IT-Grundschutz NET.1.1, NET.3.2, ORP.4; NIS2 Art. 21(2) (a), (i), (j); MITRE ATT&CK T1190; Microsoft Learn: Reverse proxy in Azure Service Fabric.
- id: azure-site-recovery-replication-over-public-endpoint
  name: Site Recovery Replication Over Public Endpoints
  description: |
    Replication traffic and cache storage access use public endpoints unless private endpoints are configured. Replicated disk data crosses public paths and the cache storage account is reachable from the internet.

    Attack scenario: An attacker with a stolen storage key reads replication cache blobs that contain disk blocks of production VMs.

    Impact: Disclosure of replicated disk content.

    Severity: Medium

    Terraform indicators: azurerm_recovery_services_vault.public_network_access_enabled = true; azurerm_site_recovery_replicated_vm.staging_storage_account_id referencing a storage account with public_network_access = "Enabled"; no azurerm_private_endpoint for site recovery.

    References: MCSB v2 NS-2, DP-3; NIST SP 800-53 Rev. 5 SC-7, AC-4, SC-8; BSI IT-Grundschutz NET.1.1, NET.3.2, CON.1; NIS2 Art. 21(2) (a), (h); MITRE ATT&CK T1040, T1530; Microsoft Learn: Site Recovery security baseline, Azure to Azure networking.
- id: azure-site-recovery-over-privileged-operator
  name: Site Recovery Operators With Broad Rights
  description: |
    Operators hold Contributor instead of the Site Recovery roles. A compromised account can change replicas, trigger failover and modify target networks.

    Attack scenario: An attacker with Contributor on the vault fails over production VMs into an attacker-controlled network configuration.

    Impact: Disruption of production, redirection of workloads and exposure of replicas.

    Severity: High

    Terraform indicators: azurerm_role_assignment { role_definition_name = "Contributor" } on the vault or subscription for operations teams; Site Recovery Operator, Contributor and Reader roles not used.

    References: MCSB v2 PA-7, PA-1; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1078.004, T1489; Microsoft Learn: Azure role-based access control in Site Recovery.
- id: azure-site-recovery-replica-platform-keys
  name: Site Recovery Replicas With Platform-Managed Keys
  description: |
    Replicated disks use Microsoft-managed keys only, so access cannot be revoked through an organization-controlled key and regulatory requirements for customer keys are not met.

    Attack scenario: A regulator requires customer-managed keys on every copy of regulated data; the DR replicas use platform keys.

    Impact: Non-compliance and missing key-level control for replicas.

    Severity: Low

    Terraform indicators: azurerm_site_recovery_replicated_vm.managed_disk.target_disk_encryption_set_id unset.

    References: MCSB v2 DP-5; NIST SP 800-53 Rev. 5 SC-12, SC-28; BSI IT-Grundschutz CON.1; NIS2 Art. 21(2) (h); MITRE ATT&CK T1530; Microsoft Learn: Replicate machines with customer-managed keys enabled disks.
- id: azure-site-recovery-cache-storage-exposure
  name: Site Recovery Cache Storage Account Exposed
  description: |
    The cache storage account that holds replication data allows shared key access and sits behind a permissive firewall, so replication data can be read with a key.

    Attack scenario: A storage key shared for troubleshooting is used to copy replication blobs.

    Impact: Disclosure of disk replication data.

    Severity: Medium

    Terraform indicators: azurerm_site_recovery_replicated_vm.staging_storage_account_id referencing a storage account with shared_access_key_enabled = true.

    References: MCSB v2 NS-2, IM-8; NIST SP 800-53 Rev. 5 SC-7, AC-4, IA-5, SI-4, RA-5, SC-12; BSI IT-Grundschutz NET.1.1, NET.3.2, ORP.4, CON.1; NIS2 Art. 21(2) (a), (h), (i); MITRE ATT&CK T1530; Microsoft Learn: Azure to Azure replication architecture.
- id: azure-sql-managed-instance-public-data-endpoint
  name: SQL Managed Instance Public Data Endpoint Enabled
  description: |
    The public data endpoint on port 3342 is enabled, so the instance is reachable from the internet with only SQL or Entra credentials and an NSG rule between it and attackers.

    Attack scenario: An attacker scans for the instance FQDN on port 3342 and sprays administrator passwords.

    Impact: Database takeover and data disclosure.

    Severity: High

    Terraform indicators: azurerm_mssql_managed_instance.public_data_endpoint_enabled = true; azurerm_network_security_rule allowing TCP 3342 from Internet on the delegated subnet.

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2, APP.4.3; NIS2 Art. 21(2) (a), (e); MITRE ATT&CK T1530, T1190; Microsoft Learn: Configure public endpoint in Azure SQL Managed Instance.
- id: azure-sql-managed-instance-sql-authentication
  name: SQL Managed Instance With SQL Authentication Enabled
  description: |
    SQL logins and the administrator password remain enabled and Entra-only authentication is not enforced, so shared secrets bypass identity controls and per-user audit.

    Attack scenario: The administrator login password from a pipeline variable is used against the instance from an unknown host.

    Impact: Unattributable administrative access.

    Severity: High

    Terraform indicators: azurerm_mssql_managed_instance.azure_active_directory_administrator.azuread_authentication_only_enabled = false; azurerm_mssql_managed_instance.administrator_login_password in Terraform state.

    References: MCSB v2 IM-1, DP-8; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, CON.1, APP.4.3; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1078.004, T1552.001; Microsoft Learn: Microsoft Entra-only authentication with Azure SQL.
- id: azure-sql-managed-instance-weak-tls
  name: SQL Managed Instance Accepts Legacy TLS
  description: |
    The instance accepts TLS versions below 1.2, so connections can be downgraded and traffic read on the network path.

    Attack scenario: A legacy client negotiates TLS 1.0 and an attacker on the path records credentials and result sets.

    Impact: Disclosure and tampering of database traffic.

    Severity: Medium

    Terraform indicators: azurerm_mssql_managed_instance.minimum_tls_version = "1.0" or "1.1".

    References: MCSB v2 DP-3; NIST SP 800-53 Rev. 5 SC-8; BSI IT-Grundschutz CON.1, APP.4.3; NIS2 Art. 21(2) (h), (e); MITRE ATT&CK T1040, T1557; Microsoft Learn: Azure SQL Managed Instance connectivity and TLS.
- id: azure-sql-managed-instance-platform-key-encryption
  name: SQL Managed Instance TDE With Platform Keys Only
  description: |
    Transparent data encryption uses service-managed keys, so the organization cannot revoke access to database files through its own key.

    Attack scenario: A compliance review requires customer-managed TDE protectors; the instance uses a service-managed protector.

    Impact: No key-level revocation and non-compliance.

    Severity: Low

    Terraform indicators: azurerm_mssql_managed_instance_transparent_data_encryption missing or key_vault_key_id unset; azurerm_mssql_managed_instance.identity missing for key access.

    References: MCSB v2 DP-5; NIST SP 800-53 Rev. 5 SC-12, SC-28; BSI IT-Grundschutz CON.1, APP.4.3; NIS2 Art. 21(2) (h), (e); MITRE ATT&CK T1530; Microsoft Learn: Transparent data encryption with customer-managed key for Azure SQL.
- id: azure-sql-managed-instance-no-threat-detection
  name: SQL Managed Instance Threat Detection Disabled
  description: |
    Defender for SQL and the security alert policy are not enabled, so SQL injection, anomalous access and brute force are neither detected nor alerted.

    Attack scenario: An attacker runs a slow brute-force attack and exports tables; no alert is raised.

    Impact: Undetected compromise.

    Severity: Medium

    Terraform indicators: azurerm_mssql_managed_instance_security_alert_policy.enabled = false; azurerm_security_center_subscription_pricing { resource_type = "SqlServers", tier = "Free" }.

    References: MCSB v2 LT-1, LT-2, IR-3; NIST SP 800-53 Rev. 5 SI-4, AU-6, AU-2, IA-4, IR-4, IR-5; BSI IT-Grundschutz OPS.1.1.5, DER.1, DER.2.1, APP.4.3; NIS2 Art. 21(2) (b), (e); MITRE ATT&CK T1110, T1190; Microsoft Learn: Microsoft Defender for SQL, SQL Managed Instance vulnerability assessment.
- id: azure-storage-mover-broad-target-rbac
  name: Storage Mover Agent With Broad Rights on Migration Targets
  description: |
    The agent identity receives roles such as Storage Blob Data Contributor or Storage File Data Privileged Contributor on whole accounts. A compromised agent can overwrite or delete target data.

    Attack scenario: An attacker on the agent host uses its identity to delete all containers of the destination account.

    Impact: Destruction or tampering of migrated data.

    Severity: High

    Terraform indicators: azurerm_role_assignment { role_definition_name = "Storage Blob Data Contributor" or "Storage File Data Privileged Contributor", scope = azurerm_storage_account.<name>.id } for the agent identity.

    References: MCSB v2 PA-7, IM-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, AC-16; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1078.004, T1485; Microsoft Learn: Register a Storage Mover agent.
- id: azure-storage-mover-orphaned-agent-roles
  name: Storage Mover Role Assignments Left After Agent Removal
  description: |
    When an agent is unregistered, its role assignments on targets remain and show as unknown principals. The authorization is not removed automatically and can be reused if the identity is recreated.

    Attack scenario: A stale assignment for a decommissioned agent remains on a production container; a later identity with the same object id regains access.

    Impact: Lingering privileged access to migration targets.

    Severity: Medium

    Terraform indicators: azurerm_role_assignment.principal_id of a removed azurerm_storage_mover_agent remaining in state or Azure; no cleanup in the migration pipeline.

    References: MCSB v2 PA-4, PA-3; NIST SP 800-53 Rev. 5 AC-2, AC-6, IA-4; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1078.004; Microsoft Learn: Decommission a Storage Mover agent.
- id: azure-storage-mover-public-control-plane
  name: Storage Mover Control Traffic on Public Endpoints
  description: |
    Control messages, progress telemetry and copy logs use public endpoints even when Private Link is used for data paths. Migration metadata and file paths are reachable on public networks.

    Attack scenario: Copy logs sent to a public endpoint reveal file paths and sizes of sensitive shares.

    Impact: Disclosure of migration metadata.

    Severity: Low

    Terraform indicators: azurerm_storage_mover_agent connected through public networks; no ExpressRoute Microsoft peering or private endpoints for dependent endpoints.

    References: MCSB v2 NS-2, DP-3; NIST SP 800-53 Rev. 5 SC-7, AC-4, SC-8; BSI IT-Grundschutz NET.1.1, NET.3.2, CON.1; NIS2 Art. 21(2) (a), (h); MITRE ATT&CK T1040; Microsoft Learn: Storage Mover networking prerequisites.
- id: azure-stream-analytics-platform-key-encryption
  name: Stream Analytics Job Data Encrypted Only With Platform Keys
  description: |
    Job metadata and private data assets use platform keys, and customer data stored by the job is not placed in a customer-owned, customer-key-protected storage account.

    Attack scenario: A compliance review requires customer key control for job data; the job stores data in system storage.

    Impact: No key-level revocation and non-compliance.

    Severity: Low

    Terraform indicators: azurerm_stream_analytics_job.content_storage_policy = "SystemAccount"; azurerm_stream_analytics_job.job_storage_account unset.

    References: MCSB v2 DP-5; NIST SP 800-53 Rev. 5 SC-12, SC-28; BSI IT-Grundschutz CON.1; NIS2 Art. 21(2) (h); MITRE ATT&CK T1530; Microsoft Learn: Stream Analytics customer-managed keys.
- id: azure-stream-analytics-connection-string-authentication
  name: Stream Analytics Inputs and Outputs Use Keys Instead of Managed Identity
  description: |
    Inputs and outputs authenticate with connection strings and shared access keys stored in the job definition. Keys are visible to anyone with job read access and appear in Terraform state.

    Attack scenario: A reader of the job configuration copies the event hub shared access key and reads the upstream stream.

    Impact: Credential disclosure and access to connected streaming services.

    Severity: High

    Terraform indicators: azurerm_stream_analytics_stream_input_eventhub.authentication_mode = "ConnectionString" with shared_access_policy_key; azurerm_stream_analytics_job.identity absent.

    References: MCSB v2 IM-3, IM-8; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-4, IA-5, IA-9; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (h), (j); MITRE ATT&CK T1552.001; Microsoft Learn: Use managed identities to authenticate Stream Analytics jobs.
- id: azure-stream-analytics-missing-logging
  name: Stream Analytics Diagnostics Not Collected
  description: |
    Execution and authoring logs are not exported, so job changes, errors and data loss cannot be investigated.

    Attack scenario: A job output is redirected to another sink; no authoring log shows who changed it.

    Impact: No evidence for job tampering and data diversion.

    Severity: Medium

    Terraform indicators: azurerm_monitor_diagnostic_setting for azurerm_stream_analytics_job missing enabled_log for Authoring and Execution.

    References: MCSB v2 LT-3; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b); MITRE ATT&CK T1070; Microsoft Learn: Monitor Stream Analytics jobs with diagnostics logs.
- id: azure-stream-analytics-output-redirection
  name: Stream Analytics Output Redirected to an Untrusted Sink
  description: |
    Anyone who can edit a job can add or change outputs. A new output can send the processed stream to an attacker-controlled storage account or endpoint.

    Attack scenario: An attacker with Stream Analytics Contributor adds a blob output pointing at an external storage account.

    Impact: Continuous exfiltration of streamed business data.

    Severity: Medium

    Terraform indicators: azurerm_stream_analytics_output_blob created outside CI/CD; azurerm_role_assignment { role_definition_name = "Stream Analytics Contributor" } granted broadly.

    References: MCSB v2 PA-7, DP-2; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, AC-4, SI-4; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (h); MITRE ATT&CK T1537, T1567; Microsoft Learn: Stream Analytics security baseline.
- id: azure-synapse-public-exposure
  name: Synapse Workspace Publicly Reachable Without Network Isolation
  description: |
    The workspace endpoints for SQL, development and Spark are reachable from the internet, IP firewall rules allow wide ranges and no managed virtual network or data exfiltration protection limits outbound connections.

    Attack scenario: An attacker with a stolen token connects to the workspace SQL endpoint from the internet and runs queries; a notebook then copies data to an external storage account.

    Impact: Data disclosure and exfiltration from the analytics platform.

    Severity: High

    Terraform indicators: azurerm_synapse_workspace.public_network_access_enabled = true (default); azurerm_synapse_workspace.managed_virtual_network_enabled = false; azurerm_synapse_workspace.data_exfiltration_protection_enabled = false; azurerm_synapse_firewall_rule with start_ip_address = "0.0.0.0" and end_ip_address = "255.255.255.255"; no azurerm_private_endpoint with subresource_names = ["Sql"], ["SqlOnDemand"] or ["Dev"].

    References: MCSB v2 NS-2, DP-2; NIST SP 800-53 Rev. 5 SC-7, AC-4, SI-4; BSI IT-Grundschutz NET.1.1, NET.3.2, CON.1, APP.4.3; NIS2 Art. 21(2) (a), (h), (e); MITRE ATT&CK T1530, T1567; Microsoft Learn: Synapse workspace managed virtual network, Synapse Analytics private endpoints, Data exfiltration protection.
- id: azure-synapse-sql-authentication
  name: Synapse SQL Authentication Without Entra-Only Mode
  description: |
    SQL administrator login and password authentication remain enabled and Entra-only authentication is not enforced, so shared credentials bypass identity controls and per-user audit.

    Attack scenario: The SQL administrator password from a deployment variable is used from an unknown host.

    Impact: Unattributable administrative access to pools and data.

    Severity: High

    Terraform indicators: azurerm_synapse_workspace.azuread_authentication_only = false; azurerm_synapse_workspace.sql_administrator_login_password set and in Terraform state; azurerm_synapse_workspace_aad_admin missing.

    References: MCSB v2 IM-1, DP-8; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, CON.1, APP.4.3; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1078.004, T1552.001; Microsoft Learn: Microsoft Entra-only authentication with Azure Synapse.
- id: azure-synapse-platform-key-encryption
  name: Synapse Data Without Customer-Managed Keys or Pool Encryption
  description: |
    Workspace data uses platform keys and dedicated SQL pools may have transparent data encryption disabled, so access cannot be revoked through an organization key and plaintext files can appear in storage.

    Attack scenario: A dedicated SQL pool without transparent data encryption has its backing storage exported; the content is readable.

    Impact: Weak at-rest protection and non-compliance.

    Severity: Medium

    Terraform indicators: azurerm_synapse_workspace.customer_managed_key unset; azurerm_synapse_sql_pool.data_encrypted = false.

    References: MCSB v2 DP-4, DP-5; NIST SP 800-53 Rev. 5 SC-28, SC-12; BSI IT-Grundschutz CON.1, APP.4.3; NIS2 Art. 21(2) (h), (e); MITRE ATT&CK T1530; Microsoft Learn: Encryption for Azure Synapse Analytics workspaces.
- id: azure-synapse-weak-tls
  name: Synapse SQL Endpoints Accept Legacy TLS
  description: |
    The workspace SQL server accepts TLS versions below 1.2, so connections can be downgraded and traffic read on the network path.

    Attack scenario: A legacy client negotiates TLS 1.0 and an attacker on the path records query results.

    Impact: Disclosure of credentials and data in transit.

    Severity: Medium

    Terraform indicators: Minimum TLS version of the workspace SQL endpoint is not set to 1.2 (not exposed by azurerm_synapse_workspace; verify through azapi_update_resource on the workspace SQL settings).

    References: MCSB v2 DP-3; NIST SP 800-53 Rev. 5 SC-8; BSI IT-Grundschutz CON.1, APP.4.3; NIS2 Art. 21(2) (h), (e); MITRE ATT&CK T1040, T1557; Microsoft Learn: Azure Synapse Analytics security white paper.
- id: azure-synapse-no-threat-detection
  name: Synapse Threat Detection and Vulnerability Assessment Disabled
  description: |
    Defender for SQL, the security alert policy and vulnerability assessment are not enabled for the workspace and its pools, so SQL injection, brute force and misconfigurations are neither alerted nor reported.

    Attack scenario: A slow brute-force attack against the workspace SQL endpoint succeeds; no alert is generated.

    Impact: Undetected compromise and unmanaged misconfigurations.

    Severity: Medium

    Terraform indicators: azurerm_synapse_workspace_security_alert_policy.policy_state = "Disabled" or missing; azurerm_synapse_workspace_vulnerability_assessment missing; azurerm_security_center_subscription_pricing { resource_type = "SqlServers", tier = "Free" }.

    References: MCSB v2 LT-1, LT-2, IR-3; NIST SP 800-53 Rev. 5 SI-4, AU-6, AU-2, IA-4, IR-4, IR-5; BSI IT-Grundschutz OPS.1.1.5, DER.1, DER.2.1, APP.4.3; NIS2 Art. 21(2) (b), (e); MITRE ATT&CK T1110, T1190; Microsoft Learn: SQL Advanced Threat Protection in Azure Synapse.
- id: azure-synapse-overbroad-roles
  name: Synapse Administrator and Linked Service Rights Granted Broadly
  description: |
    The Synapse Administrator role and workspace managed identity permissions are granted to many users. Administrators can run code, read linked service credentials and use the workspace identity on storage and databases.

    Attack scenario: A user with Synapse Administrator creates a notebook that uses the workspace managed identity to read every container of the data lake.

    Impact: Access to all data reachable by the workspace identity.

    Severity: High

    Terraform indicators: azurerm_synapse_role_assignment { role_name = "Synapse Administrator" } for broad groups; azurerm_role_assignment { role_definition_name = "Storage Blob Data Contributor" } for the workspace identity at account scope.

    References: MCSB v2 PA-7, PA-1; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1078.004, T1530; Microsoft Learn: Synapse role-based access control, Synapse workspace managed identity.
- id: azure-traffic-manager-unauthorized-profile-change
  name: Traffic Manager Profile Changed to Redirect Users
  description: |
    Anyone with write rights on a profile can change endpoints or routing and send users to malicious destinations. DNS-based redirection affects every client that resolves the profile.

    Attack scenario: An attacker with Traffic Manager Contributor changes the priority endpoint to an attacker-controlled host.

    Impact: Traffic redirection, credential theft and service outage.

    Severity: High

    Terraform indicators: azurerm_role_assignment { role_definition_name = "Traffic Manager Contributor" or "Contributor" } at subscription scope; no azurerm_management_lock on azurerm_traffic_manager_profile.

    References: MCSB v2 PA-7, LT-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, AU-2, AU-3; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1, NET.1.1; NIS2 Art. 21(2) (i), (b), (a); MITRE ATT&CK T1565, T1584.003; Microsoft Learn: Azure Traffic Manager architecture best practices.
- id: azure-traffic-manager-dangling-dns-takeover
  name: Traffic Manager Dangling DNS Subdomain Takeover
  description: |
    A DNS record points at a deleted Traffic Manager profile or at endpoints whose Azure resources were deleted. An attacker recreates the same name and serves content on the organization's domain.

    Attack scenario: A CNAME for app.example.com still points to a removed *.trafficmanager.net profile; an attacker creates a profile with that name.

    Impact: Phishing and cookie theft on a legitimate domain.

    Severity: High

    Terraform indicators: azurerm_dns_cname_record.record = "<profile>.trafficmanager.net" for a removed azurerm_traffic_manager_profile; azurerm_dns_a_record without target_resource_id alias.

    References: MCSB v2 NS-10; NIST SP 800-53 Rev. 5 SC-7, SI-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1584.003; Microsoft Learn: Prevent dangling DNS entries and avoid subdomain takeover.
- id: azure-traffic-manager-http-health-probes
  name: Traffic Manager Health Probes Over HTTP
  description: |
    Endpoints are monitored over HTTP and probes do not validate certificates. Forged responses can mark an endpoint healthy or unhealthy and steer traffic.

    Attack scenario: An attacker on the path to an endpoint returns healthy probe responses for a compromised node so it keeps receiving traffic.

    Impact: Manipulated endpoint selection and traffic steering.

    Severity: Low

    Terraform indicators: azurerm_traffic_manager_profile.monitor_config.protocol = "HTTP"; azurerm_traffic_manager_profile.monitor_config.port = 80.

    References: MCSB v2 DP-3, NS-2; NIST SP 800-53 Rev. 5 SC-8, SC-7, AC-4; BSI IT-Grundschutz CON.1, NET.1.1, NET.3.2; NIS2 Art. 21(2) (h), (a); MITRE ATT&CK T1557; Microsoft Learn: Secure your Azure Traffic Manager deployment.
- id: azure-traffic-manager-missing-logging
  name: Traffic Manager Probe Health and Configuration Not Logged
  description: |
    Diagnostic logs for probe health events are not exported, so endpoint health changes and manipulation cannot be investigated.

    Attack scenario: An endpoint is repeatedly marked degraded and traffic shifts to another region; no log shows the probe results.

    Impact: No evidence for routing manipulation or availability incidents.

    Severity: Low

    Terraform indicators: azurerm_monitor_diagnostic_setting for azurerm_traffic_manager_profile missing enabled_log for ProbeHealthStatusEvents.

    References: MCSB v2 LT-4; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b); MITRE ATT&CK T1070; Microsoft Learn: Traffic Manager metrics and alerts.
- id: azure-virtual-wan-route-override-bypasses-hub-firewall
  name: Virtual WAN User-Defined Routes Bypass the Hub Firewall
  description: |
    Users with rights to assign route tables can attach a user-defined route to a spoke and override Virtual WAN routes, so traffic skips the hub firewall.

    Attack scenario: A landing zone owner with Network Contributor attaches a route table that sends traffic directly to a peer spoke and avoids inspection.

    Impact: Loss of inspection and segmentation between connected networks.

    Severity: High

    Terraform indicators: azurerm_role_assignment { role_definition_name = "Network Contributor" } for landing zone owners on spoke VNets; azurerm_subnet_route_table_association created by application teams; azurerm_virtual_hub_connection with static routes.

    References: MCSB v2 NS-1, PA-7; NIST SP 800-53 Rev. 5 SC-7, SC-32, AC-4, CM-7, AC-2, AC-3; BSI IT-Grundschutz NET.1.1, NET.3.2, ORP.4; NIS2 Art. 21(2) (a), (i); MITRE ATT&CK T1078.004, T1686.001; Microsoft Learn: Zero Trust for Azure Virtual WAN, Virtual WAN architecture best practices.
- id: azure-virtual-wan-flat-spoke-transit
  name: Virtual WAN Spokes and Branches Communicate Without Segmentation
  description: |
    Without custom route tables, spoke VNets and branches can reach each other even when they should be separate zones. A compromised spoke reaches other zones, and branch-to-branch traffic is allowed by default.

    Attack scenario: A compromised development spoke scans and connects to a production spoke through the hub because both share the default route table.

    Impact: Lateral movement between environments.

    Severity: High

    Terraform indicators: azurerm_virtual_hub_route_table not used; azurerm_virtual_hub_connection.routing.associated_route_table_id = default; azurerm_virtual_wan.allow_branch_to_branch_traffic = true; azurerm_virtual_hub.branch_to_branch_traffic_enabled = true.

    References: MCSB v2 NS-1; NIST SP 800-53 Rev. 5 SC-7, SC-32, AC-4, CM-7; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1021; Microsoft Learn: Virtual WAN custom route tables, Secure virtual hub.
- id: azure-virtual-wan-p2s-weak-authentication
  name: Virtual WAN Point-to-Site VPN With Weak Authentication
  description: |
    Point-to-site users authenticate with certificates or RADIUS without Conditional Access, MFA or device compliance. A stolen credential is enough to enter the network.

    Attack scenario: A leaked VPN client certificate is used from an attacker's machine to join the corporate network.

    Impact: Network access with stolen credentials.

    Severity: High

    Terraform indicators: azurerm_point_to_site_vpn_gateway with vpn_server_configuration using certificate authentication only; azurerm_vpn_server_configuration.azure_active_directory_authentication unset.

    References: MCSB v2 IM-6, IM-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-5, IA-8, IA-11; BSI IT-Grundschutz ORP.4, NET.1.1, NET.3.2; NIS2 Art. 21(2) (i), (j), (a); MITRE ATT&CK T1078.004, T1021; Microsoft Learn: Configure Microsoft Entra authentication for P2S VPN in Virtual WAN.
- id: azure-vmss-unpatched-instances
  name: Scale Set Instances Not Patched
  description: |
    The upgrade mode is manual and automatic OS image upgrades are off, so instances stay on old images for months and known vulnerabilities remain exploitable.

    Attack scenario: An attacker exploits a vulnerability patched three months ago on every instance of the web tier.

    Impact: Remote code execution across the whole scale set.

    Severity: High

    Terraform indicators: azurerm_linux_virtual_machine_scale_set.upgrade_mode = "Manual"; azurerm_linux_virtual_machine_scale_set.automatic_os_upgrade_policy unset; azurerm_linux_virtual_machine_scale_set.source_image_reference.version pinned to an old version.

    References: MCSB v2 PV-6, PV-3; NIST SP 800-53 Rev. 5 SI-2, RA-5, CM-2, CM-6, SC-28; BSI IT-Grundschutz OPS.1.1.3, OPS.2.2, SYS.1.5, SYS.1.1; NIS2 Art. 21(2) (e), (a); MITRE ATT&CK T1068, T1190; Microsoft Learn: Automatic OS image upgrades for scale sets, VMSS security baseline.
- id: azure-vmss-instance-protection-gaps
  name: Special Scale Set Instances Removed or Modified by Scale Actions
  description: |
    Instances that serve special duties are not protected from scale-in and scale set actions, so autoscale or an operator can remove or overwrite them and their data.

    Attack scenario: An autoscale rule removes the instance that holds a one-off configuration and state; the data is lost.

    Impact: Loss or overwriting of special instances and their data.

    Severity: Low

    Terraform indicators: azurerm_linux_virtual_machine_scale_set.scale_in without protection; protect_from_scale_in and protect_from_scale_set_actions not set on special instances.

    References: MCSB v2 BR-1; NIST SP 800-53 Rev. 5 CP-9, CP-10; BSI IT-Grundschutz CON.3, SYS.1.5, SYS.1.1; NIS2 Art. 21(2) (c), (e); MITRE ATT&CK T1565; Microsoft Learn: Instance protection for Azure virtual machine scale set instances.
- id: azure-vmss-no-application-health
  name: Scale Set Without Application Health Monitoring
  description: |
    No Application Health extension or load balancer health probe is configured, so unhealthy or compromised instances are not detected, and rolling upgrades and automatic repairs cannot run safely.

    Attack scenario: A compromised instance keeps serving traffic because no health signal removes it; rolling upgrades stall.

    Impact: Compromised or broken instances stay in service and upgrades are blocked.

    Severity: Medium

    Terraform indicators: azurerm_linux_virtual_machine_scale_set.health_probe_id unset; azurerm_linux_virtual_machine_scale_set.automatic_instance_repair.enabled = false; azurerm_linux_virtual_machine_scale_set.rolling_upgrade_policy unset.

    References: MCSB v2 PV-4, LT-1; NIST SP 800-53 Rev. 5 CM-3, CM-6, SI-2, SI-4, AU-6; BSI IT-Grundschutz OPS.2.2, OPS.1.1.3, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (a), (e), (b); MITRE ATT&CK T1499; Microsoft Learn: Application Health extension for scale sets.
- id: azure-vmss-encryption-and-logging-gaps
  name: Scale Set Disks and Hosts Without Encryption at Host or Monitoring Agent
  description: |
    Encryption at host is not enabled, so temporary disks and caches are not encrypted, and instances run without the Azure Monitor Agent, so host and security events are not collected.

    Attack scenario: A detached instance disk is attached elsewhere and temporary data is readable; a compromise leaves no host logs.

    Impact: Disclosure of data at rest and missing forensic data.

    Severity: Medium

    Terraform indicators: azurerm_linux_virtual_machine_scale_set.encryption_at_host_enabled = false; azurerm_linux_virtual_machine_scale_set.extension without type "AzureMonitorLinuxAgent".

    References: MCSB v2 DP-4, LT-5; NIST SP 800-53 Rev. 5 SC-28, AU-2, AU-3, AU-6, AU-7, AU-12; BSI IT-Grundschutz CON.1, OPS.1.1.5, DER.1, SYS.1.5; NIS2 Art. 21(2) (h), (b), (e); MITRE ATT&CK T1530, T1070; Microsoft Learn: Encryption at host for Azure VMs and scale sets.
- id: azure-vnet-public-paas-path
  name: Virtual Network Workloads Reach PaaS Over Public Endpoints
  description: |
    Workloads in the virtual network reach PaaS services through their public IP addresses instead of private endpoints, and services are not injected into the VNet. The attack surface includes public endpoints although the network itself is private.

    Attack scenario: A storage account used only by a VNet application remains reachable from the internet; a stolen key is used from outside.

    Impact: Data exposure through public PaaS endpoints.

    Severity: High

    Terraform indicators: azurerm_private_endpoint missing for PaaS dependencies of the VNet; PaaS resources with public network access enabled; subnets with service endpoints enabled (azurerm_subnet) used instead of private endpoints.

    References: MCSB v2 NS-2, NS-1; NIST SP 800-53 Rev. 5 SC-7, AC-4, SC-32, CM-7; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1190, T1530; Microsoft Learn: Azure Virtual Network architecture best practices, Integrate Azure services with virtual networks.
- id: azure-vpn-gateway-weak-p2s-authentication
  name: VPN Gateway Point-to-Site Without Entra-Only Authentication
  description: |
    Point-to-site users authenticate with certificates or RADIUS instead of Microsoft Entra ID, so there is no Conditional Access, MFA or per-user revocation.

    Attack scenario: A client certificate exported from a laptop is used from another machine to join the network.

    Impact: Network access through stolen credentials.

    Severity: High

    Terraform indicators: azurerm_virtual_network_gateway.vpn_client_configuration.vpn_auth_types containing "Certificate" or "Radius"; azurerm_virtual_network_gateway.vpn_client_configuration.aad_tenant unset.

    References: MCSB v2 IM-1, IM-6; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, NET.3.3; NIS2 Art. 21(2) (i), (j); MITRE ATT&CK T1078.004, T1021; Microsoft Learn: Configure P2S VPN gateway for Microsoft Entra ID authentication.
- id: azure-vpn-gateway-weak-ipsec-policy
  name: VPN Connections Use Default or Weak IPsec Policies
  description: |
    Site-to-site connections use default IPsec/IKE proposals that can negotiate weak algorithms, so tunnels can be downgraded or are weaker than the policy requires.

    Attack scenario: A peer proposes a weak cipher suite and the connection accepts it; recorded traffic is later decrypted.

    Impact: Weakened confidentiality of site-to-site traffic.

    Severity: Medium

    Terraform indicators: azurerm_virtual_network_gateway_connection.ipsec_policy missing; azurerm_virtual_network_gateway_connection.ipsec_policy with ike_encryption = "DES3" or dh_group = "DHGroup1".

    References: MCSB v2 DP-3, NS-1; NIST SP 800-53 Rev. 5 SC-8, SC-7, SC-32, AC-4, CM-7; BSI IT-Grundschutz CON.1, NET.1.1, NET.3.2, NET.3.3; NIS2 Art. 21(2) (h), (a), (j); MITRE ATT&CK T1040; Microsoft Learn: Configure custom IPsec/IKE connection policies.
- id: azure-vpn-gateway-shared-key-exposure
  name: VPN Pre-Shared Keys Stored in Terraform State or Weak
  description: |
    Site-to-site connections use pre-shared keys that are short, reused or kept in Terraform state and variables. Anyone who reads them can establish a tunnel from a peer address or decrypt captured traffic.

    Attack scenario: A shared key is read from Terraform state; an attacker sets up a tunnel from a controlled peer address and reaches the on-premises network.

    Impact: Unauthorized network access and loss of confidentiality of tunnels.

    Severity: High

    Terraform indicators: azurerm_virtual_network_gateway_connection.shared_key as a plain variable or short value; azurerm_virtual_network_gateway_connection.shared_key shared across several connections.

    References: MCSB v2 IM-8, NS-9; NIST SP 800-53 Rev. 5 IA-5, SI-4, RA-5, SC-12, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1, NET.1.1, NET.3.2; NIS2 Art. 21(2) (h), (i), (a); MITRE ATT&CK T1552.001, T1021; Microsoft Learn: About VPN Gateway cryptographic requirements.
- id: azure-vpn-gateway-missing-logging
  name: VPN Gateway Diagnostics Not Collected
  description: |
    Gateway, tunnel, route and IKE diagnostic logs are not exported, so unauthorized connection attempts and tunnel changes cannot be investigated.

    Attack scenario: Repeated IKE failures from an unknown peer precede a successful connection; no log retains them.

    Impact: No evidence for unauthorized VPN access.

    Severity: Medium

    Terraform indicators: azurerm_monitor_diagnostic_setting for azurerm_virtual_network_gateway missing GatewayDiagnosticLog, TunnelDiagnosticLog, RouteDiagnosticLog, IKEDiagnosticLog and P2SDiagnosticLog.

    References: MCSB v2 LT-4, LT-3; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4; BSI IT-Grundschutz OPS.1.1.5, DER.1, NET.3.3; NIS2 Art. 21(2) (b), (j); MITRE ATT&CK T1070; Microsoft Learn: Monitor Azure VPN Gateway, VPN Gateway diagnostic logs.
- id: azure-waf-detection-mode-in-production
  name: Web Application Firewall in Detection Mode in Production
  description: |
    The WAF policy runs in Detection mode although applications are live. Attacks are logged but not blocked.

    Attack scenario: A SQL injection attack is logged by the WAF but reaches the application.

    Impact: No protection from the WAF for production applications.

    Severity: High

    Terraform indicators: azurerm_web_application_firewall_policy.policy_settings.mode = "Detection"; azurerm_cdn_frontdoor_firewall_policy.mode = "Detection".

    References: MCSB v2 NS-6; NIST SP 800-53 Rev. 5 SC-7, SI-10, SI-11; BSI IT-Grundschutz APP.3.1, NET.1.1, NET.3.2; NIS2 Art. 21(2) (e), (a); MITRE ATT&CK T1190; Microsoft Learn: Best practices for Azure Web Application Firewall on Front Door.
- id: azure-waf-no-rate-limit-or-bot-protection
  name: WAF Without Rate Limiting or Bot Protection
  description: |
    No rate limit rules and no bot manager rule set are configured, so request floods, scraping and credential stuffing reach the application unchecked.

    Attack scenario: A botnet tests stolen credentials against the login endpoint at high volume and nothing throttles it.

    Impact: Account takeover and application overload.

    Severity: Medium

    Terraform indicators: azurerm_web_application_firewall_policy.custom_rules with rule_type = "RateLimitRule" missing; azurerm_web_application_firewall_policy.managed_rules.managed_rule_set without type "Microsoft_BotManagerRuleSet".

    References: MCSB v2 NS-6, NS-5; NIST SP 800-53 Rev. 5 SC-7, SI-10, SI-11, SC-5, SI-4; BSI IT-Grundschutz APP.3.1, NET.1.1, NET.3.2; NIS2 Art. 21(2) (e), (a), (c); MITRE ATT&CK T1499, T1110.004; Microsoft Learn: Rate limiting with Azure WAF, Bot protection with Azure WAF.
- id: azure-waf-missing-logging
  name: WAF Diagnostic Logs Not Collected
  description: |
    WAF diagnostic logs are not sent to a destination, so blocked attacks and rule triggers cannot be reconstructed and tuning is impossible.

    Attack scenario: Attack waves against a login page leave no record; the team cannot tell which rules fired.

    Impact: No visibility into attacks and false positives.

    Severity: Medium

    Terraform indicators: azurerm_monitor_diagnostic_setting for azurerm_application_gateway or azurerm_cdn_frontdoor_profile missing WAF log categories.

    References: MCSB v2 LT-3, NS-6; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4, SC-7; BSI IT-Grundschutz OPS.1.1.5, DER.1, APP.3.1, NET.1.1; NIS2 Art. 21(2) (b), (e), (a); MITRE ATT&CK T1070; Microsoft Learn: Azure WAF monitoring and logging.
- id: azure-waf-exclusions-and-stale-rule-sets
  name: WAF Exclusions Too Broad or Rule Sets Outdated
  description: |
    Broad exclusions added to silence false positives, disabled rules and old managed rule set versions leave parts of the application uninspected.

    Attack scenario: An exclusion for the whole request body of an API path lets injection payloads through.

    Impact: Blind spots in WAF coverage.

    Severity: Medium

    Terraform indicators: azurerm_web_application_firewall_policy.managed_rules.exclusion with match_variable = "RequestArgNames" and a wildcard selector; azurerm_web_application_firewall_policy.managed_rules.managed_rule_set.version at an old version; many managed_rule_set.rule_group_override entries disabled.

    References: MCSB v2 NS-6, PV-1; NIST SP 800-53 Rev. 5 SC-7, SI-10, SI-11, CM-2, CM-6; BSI IT-Grundschutz APP.3.1, NET.1.1, NET.3.2, OPS.2.2; NIS2 Art. 21(2) (e), (a); MITRE ATT&CK T1190; Microsoft Learn: Web application firewall exclusion lists, Azure WAF DRS rule groups.
- id: azure-app-service-remote-code-execution
  name: App Service and Function App Remote Code Execution
  description: |
    Injection flaws, unsafe deserialization, file upload handling or vulnerable dependencies in the workload allow code execution in the worker process. From there the attacker reaches managed identity tokens, app settings and connected data stores.

    Attack scenario: A deserialization flaw in an outdated framework version lets an attacker run commands in the worker, read the app settings with connection strings and request a managed identity token.

    Impact: Compromise of the application, its identity and connected data stores.

    Severity: Critical

    Terraform indicators: azurerm_linux_web_app.site_config.application_stack with end-of-life runtime versions; azurerm_linux_web_app.site_config.remote_debugging_enabled = true; azurerm_linux_web_app.identity with broad azurerm_role_assignment; azurerm_security_center_subscription_pricing { resource_type = "AppServices", tier = "Free" }.

    References: MCSB v2 PV-6, PV-3; NIST SP 800-53 Rev. 5 SI-2, RA-5, CM-2, CM-6, SC-28; BSI IT-Grundschutz OPS.1.1.3, OPS.2.2, APP.3.1; NIS2 Art. 21(2) (e), (a); MITRE ATT&CK T1190, T1059; Microsoft Learn: Security baseline for App Service, Secure coding for Azure App Service.
- id: azure-app-service-public-network-exposure
  name: App Service and Function App Reachable From Public Networks
  description: |
    The app's public endpoint accepts traffic from the internet because public network access is enabled and no access restrictions or private endpoint limit it. Internal APIs and function endpoints are exposed without perimeter controls.

    Attack scenario: An internal function app is discovered on <name>.azurewebsites.net and called without passing the WAF that fronts the main site.

    Impact: Exposure of internal endpoints and bypass of perimeter controls.

    Severity: High

    Terraform indicators: azurerm_linux_web_app.public_network_access_enabled = true (default); azurerm_linux_function_app.public_network_access_enabled = true; azurerm_linux_web_app.site_config.ip_restriction empty; no azurerm_private_endpoint with subresource_names = ["sites"].

    References: MCSB v2 NS-2; NIST SP 800-53 Rev. 5 SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2, APP.3.1; NIS2 Art. 21(2) (a), (e); MITRE ATT&CK T1190, T1530; Microsoft Learn: Set up Azure App Service access restrictions, Private endpoints for Azure App Service.
- id: azure-managed-identity-role-changes-unmonitored
  name: Managed Identity Role Assignment Changes Not Monitored
  description: |
    Role assignments for managed identities can be created or changed without alerts. Attackers add rights to an identity they control through a compromised workload and use them later.

    Attack scenario: An attacker with a compromised workload grants Owner to its managed identity through a pipeline identity; no alert is generated.

    Impact: Silent privilege escalation through identities.

    Severity: Medium

    Terraform indicators: azurerm_monitor_activity_log_alert with criteria.operation_name = "Microsoft.Authorization/roleAssignments/write" missing; azurerm_role_assignment created outside CI/CD.

    References: MCSB v2 LT-3, PA-4; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4, AC-2; BSI IT-Grundschutz OPS.1.1.5, DER.1, ORP.4, DER.2.1; NIS2 Art. 21(2) (b), (i); MITRE ATT&CK T1098, T1070; Microsoft Learn: Monitor role assignments with Azure Activity Log alerts.
- id: azure-managed-identity-not-used
  name: Services Authenticate With Keys or Secrets Instead of Managed Identity
  description: |
    App Service, AKS, Data Factory, Stream Analytics, Machine Learning and other resources authenticate to dependencies with keys, passwords or service principal secrets although they support managed identities. Secrets must be stored, rotated and protected.

    Attack scenario: A function authenticates to a database with a password from an app setting; the password leaks through a log and is used for months.

    Impact: Long-lived credential exposure and unattributable access.

    Severity: Medium

    Terraform indicators: azurerm_linux_web_app.identity missing; azurerm_kubernetes_cluster.identity { type = "SystemAssigned" } not used; connection strings with passwords in app_settings.

    References: MCSB v2 IM-3, IM-8; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-4, IA-5, IA-9; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (h), (j); MITRE ATT&CK T1552.001, T1078.004; Microsoft Learn: Managed identities for Azure resources, Services that support managed identities.
- id: azure-virtual-machine-configuration-drift
  name: VM Configuration Drifts From the Hardened Baseline
  description: |
    Running VMs change over time in services, firewall settings and audit policy, and drift from the hardened baseline is not reported or corrected. Weaknesses accumulate unnoticed.

    Attack scenario: An administrator disables the host firewall for troubleshooting and never re-enables it; no baseline check flags it.

    Impact: Unmonitored weaknesses in the operating system configuration.

    Severity: Medium

    Terraform indicators: azurerm_policy_virtual_machine_configuration_assignment missing for baseline configurations; azurerm_windows_virtual_machine.patch_mode and secure_boot_enabled changed outside Terraform.

    References: MCSB v2 PV-3, PV-4; NIST SP 800-53 Rev. 5 CM-2, CM-6, SC-28, CM-3, SI-2; BSI IT-Grundschutz OPS.2.2, OPS.1.1.3, SYS.1.5, SYS.1.1; NIS2 Art. 21(2) (a), (e); MITRE ATT&CK T1059; Microsoft Learn: Azure Policy guest configuration, Azure Automanage machine configuration.
- id: azure-virtual-machine-no-endpoint-protection
  name: VM Without EDR or Antimalware
  description: |
    VMs run without EDR or antimalware, or with tamper protection off, so malware and living-off-the-land activity run without detection.

    Attack scenario: An attacker runs credential dumping tools on an unprotected VM; no alert is raised.

    Impact: Undetected compromise and lateral movement.

    Severity: High

    Terraform indicators: azurerm_security_center_subscription_pricing { resource_type = "VirtualMachines", tier = "Free" }; no azurerm_virtual_machine_extension for MDE.Windows or MDE.Linux.

    References: MCSB v2 ES-1, ES-2; NIST SP 800-53 Rev. 5 SI-4, IR-4, SI-3; BSI IT-Grundschutz OPS.1.1.4, SYS.1.5, SYS.1.1; NIS2 Art. 21(2) (g), (e); MITRE ATT&CK T1059, T1685; Microsoft Learn: Defender for Servers, Defender for Endpoint on Azure VMs.
- id: azure-sql-database-insufficient-backup
  name: SQL Database Backups Short-Lived or Not Geo-Redundant
  description: |
    Short-term retention is minimal, long-term retention is not configured and backup storage is locally redundant, so a regional outage or a delayed discovery of data loss leaves no usable recovery point.

    Attack scenario: A destructive update is noticed after 14 days; no long-term backup contains the previous state.

    Impact: Permanent data loss and long recovery.

    Severity: Medium

    Terraform indicators: azurerm_mssql_database.short_term_retention_policy.retention_days = 7; azurerm_mssql_database.long_term_retention_policy unset; azurerm_mssql_database.storage_account_type = "Local".

    References: MCSB v2 BR-1, BR-2; NIST SP 800-53 Rev. 5 CP-9, CP-10, SC-12, SC-13, SC-28; BSI IT-Grundschutz CON.3, APP.4.3; NIS2 Art. 21(2) (c), (e); MITRE ATT&CK T1485; Microsoft Learn: Automated backups in Azure SQL Database, Long-term retention.
- id: azure-sql-database-no-threat-detection
  name: SQL Database Defender and Vulnerability Findings Unaddressed
  description: |
    Defender for SQL is not enabled and vulnerability assessment findings are not resolved, so injection, brute force and known misconfigurations are neither alerted nor tracked.

    Attack scenario: A brute-force attack against a SQL login succeeds; no Defender alert exists and the open vulnerability findings are never reviewed.

    Impact: Undetected compromise and persistent misconfigurations.

    Severity: Medium

    Terraform indicators: azurerm_mssql_server_security_alert_policy.state = "Disabled"; azurerm_mssql_server_vulnerability_assessment missing; azurerm_security_center_subscription_pricing { resource_type = "SqlServers", tier = "Free" }.

    References: MCSB v2 LT-1, LT-2, IR-3, PV-6; NIST SP 800-53 Rev. 5 SI-4, AU-6, AU-2, IA-4, IR-4, IR-5; BSI IT-Grundschutz OPS.1.1.5, DER.1, DER.2.1, OPS.1.1.3; NIS2 Art. 21(2) (b), (e); MITRE ATT&CK T1110, T1190; Microsoft Learn: Microsoft Defender for SQL, SQL vulnerability assessment.
- id: azure-cosmosdb-platform-key-encryption
  name: Cosmos DB Data Encrypted Only With Platform Keys
  description: |
    Account data uses service-managed keys, so the organization cannot revoke access through its own key or meet customer-managed key requirements. Customer-managed keys can only be set at account creation for some configurations.

    Attack scenario: A regulator requires customer-managed keys; the account must be migrated because the setting cannot be added later.

    Impact: No key-level revocation and non-compliance.

    Severity: Low

    Terraform indicators: azurerm_cosmosdb_account.key_vault_key_id unset; azurerm_cosmosdb_account.identity.type missing for key access.

    References: MCSB v2 DP-5; NIST SP 800-53 Rev. 5 SC-12, SC-28; BSI IT-Grundschutz CON.1, APP.4.3; NIS2 Art. 21(2) (h), (e); MITRE ATT&CK T1530; Microsoft Learn: Configure customer-managed keys for your Azure Cosmos DB account.
- id: azure-cosmosdb-no-threat-detection
  name: Cosmos DB Threat Detection Disabled
  description: |
    Defender for Azure Cosmos DB is not enabled, so SQL injection attempts, anomalous access and key extraction are not detected.

    Attack scenario: An attacker extracts data with a stolen key from an unusual location; no alert is raised.

    Impact: Undetected data theft.

    Severity: Medium

    Terraform indicators: azurerm_security_center_subscription_pricing { resource_type = "CosmosDbs", tier = "Free" }.

    References: MCSB v2 LT-1, LT-2; NIST SP 800-53 Rev. 5 SI-4, AU-6, AU-2, IA-4; BSI IT-Grundschutz OPS.1.1.5, DER.1, DER.2.1, APP.4.3; NIS2 Art. 21(2) (b), (e); MITRE ATT&CK T1530, T1190; Microsoft Learn: Microsoft Defender for Azure Cosmos DB.
- id: azure-aks-insecure-ingress-transport
  name: AKS Services Reachable Over Plain HTTP
  description: |
    Ingress and services in the cluster accept plain HTTP and no TLS policy is enforced, so session data and credentials cross the network in clear.

    Attack scenario: An ingress rule without TLS forwards login requests over HTTP; an attacker on the network captures session cookies.

    Impact: Disclosure and tampering of traffic to workloads.

    Severity: Medium

    Terraform indicators: azurerm_kubernetes_cluster.azure_policy_enabled = false so no policy enforces HTTPS-only ingress; azurerm_kubernetes_cluster.web_app_routing without TLS certificates from Key Vault.

    References: MCSB v2 DP-3; NIST SP 800-53 Rev. 5 SC-8; BSI IT-Grundschutz CON.1, SYS.1.6, APP.4.4; NIS2 Art. 21(2) (h), (e); MITRE ATT&CK T1040, T1557; Microsoft Learn: Secure your Azure Kubernetes Service cluster, Ingress TLS.
- id: azure-aks-insecure-cluster-configuration
  name: AKS Outdated Version and Missing Defender Profile
  description: |
    The cluster runs an unsupported Kubernetes version and has no Defender profile or Azure Policy add-on, so known vulnerabilities and risky workload settings remain unnoticed.

    Attack scenario: A cluster on an unsupported version is exploited through a known API server vulnerability; no Defender alert exists.

    Impact: Cluster compromise through known vulnerabilities without detection.

    Severity: High

    Terraform indicators: azurerm_kubernetes_cluster.automatic_upgrade_channel unset; azurerm_kubernetes_cluster.microsoft_defender block absent; azurerm_kubernetes_cluster.azure_policy_enabled = false; azurerm_kubernetes_cluster.kubernetes_version pinned to an old minor version.

    References: MCSB v2 PV-6, LT-1, LT-2; NIST SP 800-53 Rev. 5 SI-2, RA-5, SI-4, AU-6, AU-2, IA-4; BSI IT-Grundschutz OPS.1.1.3, OPS.1.1.5, DER.1, DER.2.1; NIS2 Art. 21(2) (e), (b); MITRE ATT&CK T1190, T1611; Microsoft Learn: Upgrade an AKS cluster, Microsoft Defender for Containers.
- id: azure-aks-platform-key-encryption
  name: AKS Node Disks Without Encryption at Host or Customer-Managed Keys
  description: |
    Node OS and data disks use platform keys and temporary disks and caches are not encrypted at host, so data on nodes is exposed when disks are detached or snapshotted.

    Attack scenario: A node disk snapshot is exported and mounted elsewhere; temporary data and caches are readable.

    Impact: Disclosure of data at rest on nodes and non-compliance.

    Severity: Medium

    Terraform indicators: azurerm_kubernetes_cluster.default_node_pool.host_encryption_enabled = false; azurerm_kubernetes_cluster.disk_encryption_set_id unset.

    References: MCSB v2 DP-4, DP-5; NIST SP 800-53 Rev. 5 SC-28, SC-12; BSI IT-Grundschutz CON.1, SYS.1.6, APP.4.4; NIS2 Art. 21(2) (h), (e); MITRE ATT&CK T1530; Microsoft Learn: Host-based encryption on AKS, Bring your own keys with AKS.
- id: azure-application-gateway-broad-management-rbac
  name: Application Gateway Managed With Broad Network Rights
  description: |
    Administrators hold broad network rights on the gateway, WAF policy, virtual network and Key Vault certificates. A compromised account can change routing and replace certificates.

    Attack scenario: An attacker with Network Contributor adds a listener and backend that proxy traffic to an attacker host and swaps the TLS certificate.

    Impact: Traffic redirection and interception.

    Severity: High

    Terraform indicators: azurerm_role_assignment { role_definition_name = "Network Contributor" or "Contributor" } at resource group or subscription scope for broad groups; azurerm_application_gateway.identity with broad Key Vault access.

    References: MCSB v2 PA-7, IM-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-5, AC-6, AC-16; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i); MITRE ATT&CK T1078.004, T1557; Microsoft Learn: Secure Azure Application Gateway.
- id: azure-firewall-no-tls-inspection
  name: Azure Firewall Outbound TLS Inspection Disabled
  description: |
    Outbound encrypted traffic is not decrypted, so IDPS and URL filtering see only metadata and malware or exfiltration over HTTPS stays invisible.

    Attack scenario: Malware downloads a payload over HTTPS from a compromised site; the firewall sees only the SNI and allows it.

    Impact: Undetected command-and-control and exfiltration over HTTPS.

    Severity: Medium

    Terraform indicators: azurerm_firewall_policy.tls_certificate unset; azurerm_firewall_policy.sku = "Standard"; azurerm_firewall_policy_rule_collection_group application rules without terminate_tls = true.

    References: MCSB v2 NS-4, NS-3; NIST SP 800-53 Rev. 5 SI-4, SC-7, AC-4; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1071, T1567; Microsoft Learn: Azure Firewall Premium TLS inspection.
- id: azure-bastion-target-subnet-open-management-ports
  name: Bastion Target Subnets Allow RDP and SSH From the Internet
  description: |
    The NSG of the target VM subnet allows RDP or SSH from the internet although Bastion provides access. The direct path bypasses Bastion protections and session auditing.

    Attack scenario: An attacker scans the public IP of a target VM and brute-forces SSH directly.

    Impact: Direct compromise of VMs without Bastion controls.

    Severity: High

    Terraform indicators: azurerm_network_security_rule { destination_port_range = "3389" or "22", source_address_prefix = "*" or "Internet", access = "Allow" } on target subnets; ingress not limited to the AzureBastionSubnet range.

    References: MCSB v2 NS-1, NS-2; NIST SP 800-53 Rev. 5 SC-7, SC-32, AC-4, CM-7; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1021, T1110; Microsoft Learn: Working with NSG access and Azure Bastion.
- id: azure-bastion-vm-public-ip-bypass
  name: VMs Behind Bastion Still Have Public IP Addresses
  description: |
    VMs that should be reached only through Bastion keep public IP addresses, so the attack surface remains although a secure access path exists.

    Attack scenario: A VM with a public IP and an exposed service is exploited directly instead of through Bastion.

    Impact: Direct internet exposure of VMs.

    Severity: High

    Terraform indicators: azurerm_network_interface.ip_configuration.public_ip_address_id set on VMs that use Bastion; azurerm_public_ip associated with azurerm_linux_virtual_machine network interfaces.

    References: MCSB v2 NS-1, NS-2; NIST SP 800-53 Rev. 5 SC-7, SC-32, AC-4, CM-7; BSI IT-Grundschutz NET.1.1, NET.3.2; NIS2 Art. 21(2) (a); MITRE ATT&CK T1190, T1021; Microsoft Learn: Developer and admin access to Azure VMs.
- id: azure-b2c-password-spraying
  name: Azure AD B2C Password Spraying
  description: |
    Attackers try a few passwords against many local customer accounts to stay below lockout thresholds. Weak password rules and missing lockout let sprays succeed.

    Attack scenario: A botnet tries a leaked password list against all customer sign-ins of an e-commerce app, and accounts with reused passwords are taken over.

    Impact: Customer account takeover and fraud.

    Severity: High

    Terraform indicators: azurerm_aadb2c_directory deployed without custom user flow settings for smart lockout and password complexity (user flows are not managed by azurerm); sign-in policies without MFA.

    References: MCSB v2 IM-6, LT-2; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-5, IA-8, IA-11; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1, DER.2.1; NIS2 Art. 21(2) (i), (j), (b); MITRE ATT&CK T1110.003, T1110.004; Microsoft Learn: Azure AD B2C technical overview, Mitigate credential attacks in Azure AD B2C.
- id: azure-b2c-account-takeover-without-risk-policy
  name: Azure AD B2C Compromised Accounts Without Risk-Based Controls
  description: |
    Without a Conditional Access policy on user risk, risky sign-ins proceed and a compromised account is not forced to change its password. Note that Azure AD B2C is no longer available to new customers since 1 May 2025.

    Attack scenario: A credential from a breach is used from a new country; the sign-in succeeds without challenge.

    Impact: Account takeover that persists after compromise.

    Severity: Medium

    Terraform indicators: Conditional Access for B2C is configured through Microsoft Graph or the portal; no azuread_conditional_access_policy equivalent manages B2C tenants.

    References: MCSB v2 IM-7, LT-2; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-6, AC-16, AU-2, AU-6; BSI IT-Grundschutz ORP.4, OPS.1.1.5, DER.1; NIS2 Art. 21(2) (i), (b), (j); MITRE ATT&CK T1078.004; Microsoft Learn: Add Conditional Access to user flows in Azure AD B2C.
- id: azure-b2c-single-factor-sign-in
  name: Azure AD B2C User Flows Require Only a Password
  description: |
    User flows require only a password for sign-up and sign-in. An intercepted or guessed password is enough to access every connected application.

    Attack scenario: A phished customer password grants access to account data and payment methods.

    Impact: Customer account takeover.

    Severity: High

    Terraform indicators: B2C user flows and custom policies are not managed by azurerm; sign-in policies without multi-factor authentication step.

    References: MCSB v2 IM-6; NIST SP 800-53 Rev. 5 AC-2, AC-3, IA-2, IA-5, IA-8, IA-11; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i), (j); MITRE ATT&CK T1078.004, T1110; Microsoft Learn: Enable multifactor authentication in Azure AD B2C.
- id: azure-key-vault-platform-key-encryption-gap
  name: Regulated Data Stored With Platform Keys Only Where Customer Keys Are Required
  description: |
    Regulated workloads store data encrypted only with Microsoft-managed keys, so the organization cannot rotate, audit or revoke the key itself or demonstrate custody to auditors.

    Attack scenario: An auditor asks how access to a regulated data store can be cut off by the organization; with platform keys there is no such control.

    Impact: Compliance gap and no customer-side revocation of data access.

    Severity: Low

    Terraform indicators: azurerm_key_vault_key not referenced by regulated storage, database or disk encryption resources; azurerm_key_vault.purge_protection_enabled = false for vaults that hold keys.

    References: MCSB v2 DP-5, DP-6; NIST SP 800-53 Rev. 5 SC-12, SC-28, IA-5; BSI IT-Grundschutz CON.1, ORP.4; NIS2 Art. 21(2) (h), (i); MITRE ATT&CK T1530; Microsoft Learn: Customer-managed keys in Azure Key Vault, Azure Key Vault security baseline.
- id: azure-key-vault-secrets-copied-into-code
  name: Vault Secrets Copied Into Code, Pipelines or Configuration
  description: |
    Secrets are copied out of the vault into source code, pipeline variables or app settings. Anyone with read access there sees the plaintext, and rotation in the vault does not update the copies.

    Attack scenario: A database password copied into a pipeline variable is exposed in a build log and remains valid after the vault rotation.

    Impact: Secret exposure outside vault controls and lasting use of stale credentials.

    Severity: High

    Terraform indicators: azurerm_key_vault_secret.value used as an input to azurerm_linux_web_app.app_settings or pipeline variables instead of a Key Vault reference; azurerm_key_vault_secret.value in Terraform state.

    References: MCSB v2 IM-8; NIST SP 800-53 Rev. 5 IA-5, SI-4, RA-5, SC-12, SC-13, SC-28; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (h), (i); MITRE ATT&CK T1552.001; Microsoft Learn: Azure Key Vault security baseline, Use Key Vault references for App Service.
- id: azure-key-vault-no-conditional-access
  name: Vault Data Plane Access Without Conditional Access Conditions
  description: |
    No Conditional Access policy restricts sign-ins that reach the vault data plane, so tokens obtained from risky locations or unmanaged devices are accepted.

    Attack scenario: A stolen user token is used from an untrusted country to read secrets from a vault.

    Impact: Secret access without location, device or risk checks.

    Severity: Medium

    Terraform indicators: azuread_conditional_access_policy.conditions.applications.included_applications without the Azure Key Vault application; azuread_conditional_access_policy.conditions.locations unset.

    References: MCSB v2 IM-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-6, AC-16; BSI IT-Grundschutz ORP.4; NIS2 Art. 21(2) (i), (j); MITRE ATT&CK T1078.004, T1528; Microsoft Learn: Conditional Access for Azure Key Vault, Azure Key Vault security baseline.
- id: azure-key-vault-no-threat-detection
  name: Key Vault Threat Detection Not Enabled
  description: |
    Microsoft Defender for Key Vault is not enabled, so unusual access patterns and abuse of vault operations raise no alert.

    Attack scenario: An attacker with a stolen credential lists and reads every secret in a vault; no alert is raised.

    Impact: Misuse of the vault continues until discovered elsewhere.

    Severity: Medium

    Terraform indicators: azurerm_security_center_subscription_pricing { resource_type = "KeyVaults", tier = "Free" }.

    References: MCSB v2 LT-1; NIST SP 800-53 Rev. 5 SI-4, AU-6; BSI IT-Grundschutz OPS.1.1.5, DER.1, DER.2.1; NIS2 Art. 21(2) (b); MITRE ATT&CK T1555, T1552; Microsoft Learn: Microsoft Defender for Key Vault.
- id: azure-storage-account-broad-data-plane-role
  name: Storage Data Roles Assigned at Account or Subscription Scope
  description: |
    Data-plane roles such as Storage Blob Data Owner are assigned at account or subscription scope. Holders read, overwrite or delete data in every container and share, far beyond the workload's need.

    Attack scenario: A compromised pipeline identity with Storage Blob Data Owner at subscription scope deletes the blobs of every storage account.

    Impact: Broad data access and destruction through one identity.

    Severity: High

    Terraform indicators: azurerm_role_assignment { role_definition_name = "Storage Blob Data Owner" or "Storage Blob Data Contributor", scope = "/subscriptions/<id>" or azurerm_storage_account.<name>.id }.

    References: MCSB v2 IM-7, PA-7; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-6, AC-16, AC-5; BSI IT-Grundschutz ORP.4, SYS.1.8; NIS2 Art. 21(2) (i), (c); MITRE ATT&CK T1078.004, T1485; Microsoft Learn: Secure your Azure Storage account, Assign RBAC roles at the smallest scope.
- id: azure-storage-account-platform-key-encryption
  name: Storage Account Encrypted Only With Microsoft-Managed Keys
  description: |
    Regulated data is stored with platform-managed keys only, so the organization cannot rotate, audit or revoke the encryption key and cannot cut off access at the key level.

    Attack scenario: An incident requires immediate cut-off of data access; with platform keys there is no revocation mechanism.

    Impact: Compliance gap and no customer-side revocation.

    Severity: Low

    Terraform indicators: azurerm_storage_account_customer_managed_key missing; azurerm_storage_account.identity missing; azurerm_storage_account.infrastructure_encryption_enabled = false.

    References: MCSB v2 DP-5; NIST SP 800-53 Rev. 5 SC-12, SC-28; BSI IT-Grundschutz CON.1, SYS.1.8; NIS2 Art. 21(2) (h), (c); MITRE ATT&CK T1530; Microsoft Learn: Customer-managed keys for Azure Storage encryption.
- id: azure-storage-account-no-threat-detection
  name: Storage Account Threats Not Detected
  description: |
    Microsoft Defender for Storage is not enabled on the subscription or account, so credential misuse, malware upload and data exfiltration run without alert.

    Attack scenario: An attacker with a stolen key downloads terabytes from an account; no anomaly alert and no malware scan result exists.

    Impact: Misuse continues undetected and malware is served to downstream consumers.

    Severity: Medium

    Terraform indicators: azurerm_security_center_subscription_pricing { resource_type = "StorageAccounts", tier = "Free" }.

    References: MCSB v2 LT-1, LT-4; NIST SP 800-53 Rev. 5 SI-4, AU-6, AU-2, AU-3, AU-12; BSI IT-Grundschutz OPS.1.1.5, DER.1, DER.2.1, SYS.1.8; NIS2 Art. 21(2) (b), (c); MITRE ATT&CK T1530, T1567; Microsoft Learn: Microsoft Defender for Storage.
- id: azure-flow-plaintext-transport
  name: Data Flow Sent Without Encryption or With Legacy TLS
  description: |
    A data flow uses plain protocols, secure transfer is turned off or the minimum TLS version is below 1.2, so an observer on the network path can read data and credentials.

    Attack scenario: An attacker on a shared network segment captures an application's connection to a database and reads the credentials and query results.

    Impact: Disclosure of data and credentials in transit.

    Severity: High

    Terraform indicators: azurerm_storage_account.https_traffic_only_enabled = false; azurerm_storage_account.min_tls_version = "TLS1_0"; azurerm_mssql_server.minimum_tls_version = "1.0"; azurerm_redis_cache.non_ssl_port_enabled = true; azurerm_linux_web_app.https_only = false.

    References: MCSB v2 DP-3, NS-2; NIST SP 800-53 Rev. 5 SC-8, SC-7, AC-4; BSI IT-Grundschutz CON.1, NET.1.1, NET.3.2; NIS2 Art. 21(2) (h), (a); MITRE ATT&CK T1040; Microsoft Learn: Azure encryption overview, Encryption in transit.
- id: azure-flow-mitm-network-path
  name: Data Flow Intercepted on the Network Path
  description: |
    A flow reaches a service over a public endpoint or an unverified route without private connectivity, so an attacker on a segment between the endpoints can intercept the connection and present a forged endpoint or certificate.

    Attack scenario: A client that does not validate certificates connects to a service through an attacker-controlled network and sends its credentials to the attacker.

    Impact: Credentials and data are sent to the attacker.

    Severity: High

    Terraform indicators: PaaS resources with public network access enabled and no azurerm_private_endpoint; azurerm_private_dns_zone not linked so clients resolve public addresses.

    References: MCSB v2 NS-2, DP-3; NIST SP 800-53 Rev. 5 SC-7, AC-4, SC-8; BSI IT-Grundschutz NET.1.1, NET.3.2, CON.1; NIS2 Art. 21(2) (a), (h); MITRE ATT&CK T1557; Microsoft Learn: Azure Private Link overview, Secure network connectivity.
- id: azure-flow-token-replay
  name: Authentication Token Replayed Over a Data Flow
  description: |
    A bearer token, SAS token or refresh token captured from a log, a proxy or the network is replayed to call the service as the original identity. Tokens with long lifetimes and no client binding make replay easy.

    Attack scenario: A SAS URL from an application log is reused by an attacker for the remaining weeks of its validity.

    Impact: Unauthorized access under a valid identity.

    Severity: High

    Terraform indicators: azurerm_storage_account_sas.expiry far in the future; azuread_conditional_access_policy.session_controls.sign_in_frequency unset; shared access signatures issued without stored access policies.

    References: MCSB v2 IM-7, IM-1; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-6, AC-16, AC-4, SC-2; BSI IT-Grundschutz ORP.4, CON.1; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1528, T1550; Microsoft Learn: Continuous access evaluation, Token protection in Conditional Access.
- id: azure-flow-message-tampering
  name: Messages Tampered With or Replayed on a Messaging Flow
  description: |
    An attacker with a shared access key or stolen local credential for a messaging namespace publishes, reads or alters messages, or replays old ones. Downstream services act on forged or duplicated work items.

    Attack scenario: An attacker with a leaked key replays an old payment instruction message; the consumer processes it twice.

    Impact: Forged or duplicate work items and wrongful processing.

    Severity: High

    Terraform indicators: azurerm_servicebus_namespace.local_auth_enabled = true; azurerm_eventhub_namespace.local_authentication_enabled = true; azurerm_eventgrid_topic.local_auth_enabled = true.

    References: MCSB v2 IM-1, DP-3; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-4, AC-6, SC-2, SC-7; BSI IT-Grundschutz ORP.4, CON.1, APP.3.1; NIS2 Art. 21(2) (i), (j), (h); MITRE ATT&CK T1565, T1078.004; Microsoft Learn: Authenticate messaging clients with Microsoft Entra ID.
- id: azure-flow-input-injection
  name: Malicious Input Sent Over an Entry Flow
  description: |
    An external attacker sends crafted requests to an entry point that forwards them without inspection or validation. SQL, script and header payloads reach the backend, which executes or stores them.

    Attack scenario: An attacker submits a SQL injection payload through a public API; the gateway forwards it and the backend executes it.

    Impact: Backend execution or storage of malicious input.

    Severity: High

    Terraform indicators: azurerm_application_gateway.waf_configuration missing or azurerm_web_application_firewall_policy.policy_settings.mode = "Detection"; azurerm_api_management_policy without validation policies.

    References: MCSB v2 NS-6, PV-2; NIST SP 800-53 Rev. 5 SC-7, SI-10, SI-11, CM-2, CM-3, CM-6; BSI IT-Grundschutz APP.3.1, NET.1.1, NET.3.2, OPS.2.2; NIS2 Art. 21(2) (e), (a); MITRE ATT&CK T1190; Microsoft Learn: Azure Web Application Firewall overview, Validate content policy in API Management.
- id: azure-flow-smb-relay
  name: SMB or Kerberos Session Relayed Over a File Flow
  description: |
    An attacker who can coerce authentication from a client relays it to another server or share. SMB signing is not required or the share accepts unauthenticated or NTLM sessions, so the relay succeeds.

    Attack scenario: An attacker coerces a file server to authenticate and relays the session to a second share, gaining access as the file server.

    Impact: Access to shares or services with the victim's identity.

    Severity: High

    Terraform indicators: azurerm_storage_account.share_properties.smb.authentication_types including "NTLMv2"; azurerm_netapp_volume.smb3_protocol_encryption_enabled = false; azurerm_netapp_account.active_directory.ldap_signing_enabled = false.

    References: MCSB v2 IM-7, NS-2; NIST SP 800-53 Rev. 5 AC-2, AC-3, AC-6, AC-16, SC-7, AC-4; BSI IT-Grundschutz ORP.4, NET.1.1, NET.3.2, SYS.1.8; NIS2 Art. 21(2) (i), (a), (j); MITRE ATT&CK T1557; Microsoft Learn: Azure Files identity-based authentication and SMB security.
- id: azure-event-hubs-missing-logging
  name: Event Hubs Operations Not Logged
  description: |
    Operational, runtime audit and application metric logs of the namespace are not exported, so access with SAS keys, changes to event hubs and consumer groups and failed authentications cannot be investigated.

    Attack scenario: An attacker reads a hub through a leaked key and creates a consumer group; no log shows the access or the new consumer.

    Impact: No evidence for data access and tampering with streaming data.

    Severity: Medium

    Terraform indicators: azurerm_monitor_diagnostic_setting for azurerm_eventhub_namespace missing enabled_log entries for OperationalLogs, RuntimeAuditLogs and ApplicationMetricsLogs.

    References: MCSB v2 LT-3; NIST SP 800-53 Rev. 5 AU-2, AU-3, AU-6, AU-12, SI-4; BSI IT-Grundschutz OPS.1.1.5, DER.1; NIS2 Art. 21(2) (b); MITRE ATT&CK T1070; Microsoft Learn: Monitor Azure Event Hubs.
