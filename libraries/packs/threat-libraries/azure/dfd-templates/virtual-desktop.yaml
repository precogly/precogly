template:
  slug: azure-virtual-desktop
  name: "Azure Virtual Desktop (Pooled Host Pool)"
  description: "Pooled AVD host pool in a hub-and-spoke landing zone with FSLogix profiles, private endpoints, Bastion admin access, firewall egress and Terraform deployment"
  category: cloudInfrastructure
  diagram_type: level1

canvas_data:
  nodes:
    # External actors (outside all boundaries)
    - id: "actor-user"
      type: "humanActor"
      position: { x: 40, y: 150 }
      data:
        label: "Remote Worker"
        actorType: "user"
        description: "Employee connecting from a managed or unmanaged device via Windows App / web client"

    - id: "actor-admin"
      type: "humanActor"
      position: { x: 40, y: 450 }
      data:
        label: "Desktop Admin"
        actorType: "admin"
        description: "Platform administrator managing session hosts"

    - id: "system-internet"
      type: "systemActor"
      position: { x: 1500, y: 60 }
      data:
        label: "Internet / SaaS"
        systemType: "service"
        description: "Websites and SaaS applications reached by users from their desktops"

    # Trust boundary - Microsoft-managed AVD control plane (outside the customer subscription)
    - id: "tb-avd-control-plane"
      type: "trustZone"
      position: { x: 220, y: 40 }
      style: { width: 300, height: 320 }
      data:
        label: "Microsoft-Managed Control Plane"
        zoneType: "trust"
        trustLevel: 25
        trustLevel: 40
        zoneColor: "#f59e0b"
        technology: "Azure Virtual Desktop service"
        description: "Multi-tenant AVD gateway, broker, web feed and Entra ID"

    - id: "process-entra"
      type: "process"
      parentId: "tb-avd-control-plane"
      position: { x: 50, y: 60 }
      data:
        label: "Microsoft Entra ID"
        component_ref: "active-directory"
        technology: "Microsoft Entra ID"
        description: "User authentication with MFA and Conditional Access"

    - id: "process-avd"
      type: "process"
      parentId: "tb-avd-control-plane"
      position: { x: 50, y: 190 }
      data:
        label: "AVD Gateway & Broker"
        component_ref: "virtual-desktop"
        technology: "Azure Virtual Desktop"
        description: "Workspace feed, connection broker and reverse-connect gateway for the host pool"
        dataSensitivity: "confidential"

    # System boundary - customer Azure landing zone
    - id: "sb-azure"
      type: "systemScope"
      position: { x: 580, y: 40 }
      style: { width: 880, height: 720 }
      data:
        label: "Azure Landing Zone - AVD"
        owner: "End User Computing Team"
        classification: "Production"

    # Trust boundary - Hub VNet (inside sb-azure)
    - id: "tb-hub"
      type: "trustZone"
      parentId: "sb-azure"
      position: { x: 30, y: 50 }
      style: { width: 260, height: 400 }
      data:
        label: "Hub VNet (Connectivity)"
        zoneType: "trust"
        trustLevel: 50
        trustLevel: 60
        zoneColor: "#3b82f6"
        technology: "Azure VNet (hub)"
        description: "Shared connectivity services: firewall, Bastion and central private DNS"

    - id: "process-firewall"
      type: "process"
      parentId: "tb-hub"
      position: { x: 50, y: 60 }
      data:
        label: "Azure Firewall"
        component_ref: "firewall"
        technology: "Azure Firewall Premium"
        description: "Egress filtering and threat intelligence for session host traffic"

    - id: "process-bastion"
      type: "process"
      parentId: "tb-hub"
      position: { x: 50, y: 170 }
      data:
        label: "Azure Bastion"
        component_ref: "bastion"
        technology: "Azure Bastion"
        description: "Administrative RDP access to session hosts without public IPs"

    - id: "process-private-dns"
      type: "process"
      parentId: "tb-hub"
      position: { x: 50, y: 280 }
      data:
        label: "Private DNS Zones"
        component_ref: "private-dns-zone"
        technology: "Azure Private DNS (privatelink.*)"
        description: "Resolves private endpoint names for storage, SQL and Key Vault"

    # Trust boundary - AVD spoke session host subnet (inside sb-azure)
    - id: "tb-session-hosts"
      type: "trustZone"
      parentId: "sb-azure"
      position: { x: 320, y: 50 }
      style: { width: 260, height: 250 }
      data:
        label: "AVD Spoke - Session Host Subnet"
        zoneType: "trust"
        trustLevel: 50
        trustLevel: 75
        zoneColor: "#22c55e"
        technology: "Azure VNet (spoke) + NSG"
        description: "Pooled multi-session hosts, no public IPs, egress via hub firewall"

    - id: "process-session-hosts"
      type: "process"
      parentId: "tb-session-hosts"
      position: { x: 50, y: 90 }
      data:
        label: "Pooled Session Hosts"
        component_ref: "virtual-machines"
        technology: "Windows 11 Enterprise multi-session (Entra joined)"
        description: "Multi-user desktops running line-of-business apps, FSLogix and the AVD agent"
        dataSensitivity: "confidential"

    # Trust boundary - Private endpoint data subnet (inside sb-azure)
    - id: "tb-data"
      type: "trustZone"
      parentId: "sb-azure"
      position: { x: 610, y: 50 }
      style: { width: 240, height: 430 }
      data:
        label: "Private Endpoint Subnet (Data)"
        zoneType: "trust"
        trustLevel: 75
        trustLevel: 90
        zoneColor: "#8b5cf6"
        technology: "Azure Private Link"
        description: "PaaS data services reachable only through private endpoints"

    - id: "datastore-fslogix"
      type: "datastore"
      parentId: "tb-data"
      position: { x: 50, y: 60 }
      data:
        label: "FSLogix Profile Storage"
        component_ref: "storage-account"
        technology: "Azure Files Premium (Entra Kerberos)"
        description: "User profile containers including browser data, tokens and cached credentials"
        dataSensitivity: "confidential"

    - id: "datastore-sql"
      type: "datastore"
      parentId: "tb-data"
      position: { x: 50, y: 180 }
      data:
        label: "LOB Database"
        component_ref: "sql-database"
        technology: "Azure SQL Database"
        description: "Line-of-business application data accessed from the desktops"
        dataSensitivity: "confidential"

    - id: "datastore-keyvault"
      type: "datastore"
      parentId: "tb-data"
      position: { x: 50, y: 300 }
      data:
        label: "Key Vault"
        component_ref: "key-vault"
        technology: "Azure Key Vault"
        description: "Host pool registration token and deployment secrets"
        dataSensitivity: "confidential"

    # Trust boundary - Management and monitoring (inside sb-azure)
    - id: "tb-management"
      type: "trustZone"
      parentId: "sb-azure"
      position: { x: 320, y: 330 }
      style: { width: 260, height: 150 }
      data:
        label: "Management & Monitoring"
        zoneType: "trust"
        trustLevel: 75
        trustLevel: 85
        zoneColor: "#14b8a6"
        technology: "Azure Monitor"
        description: "Central security logging for AVD and session hosts"

    - id: "process-log-analytics"
      type: "process"
      parentId: "tb-management"
      position: { x: 50, y: 50 }
      data:
        label: "Log Analytics Workspace"
        component_ref: "log-analytics"
        technology: "Azure Log Analytics + Microsoft Sentinel"
        description: "WVD diagnostics, session host security events and firewall logs"
        dataSensitivity: "confidential"

    # Trust boundary - Deployment pipeline (inside sb-azure)
    - id: "tb-devops"
      type: "trustZone"
      parentId: "sb-azure"
      position: { x: 30, y: 500 }
      style: { width: 550, height: 190 }
      data:
        label: "Deployment Pipeline"
        zoneType: "trust"
        trustLevel: 50
        trustLevel: 50
        zoneColor: "#f97316"
        technology: "CI/CD runners"
        description: "Terraform pipeline that provisions the host pool and session hosts"

    - id: "process-pipeline"
      type: "process"
      parentId: "tb-devops"
      position: { x: 50, y: 60 }
      data:
        label: "Terraform Pipeline"
        component_ref: "service-principal"
        technology: "Terraform (azurerm) with workload identity federation"
        description: "Deploys host pool, golden image session hosts and registration tokens"

  edges:
    # User sign-in and connection
    - id: "edge-user-entra"
      source: "actor-user"
      target: "process-entra"
      type: "dataFlow"
      data:
        label: "Sign-in (MFA / Conditional Access)"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["oidc"]
        dataClassification: ["PII"]

    - id: "edge-user-avd"
      source: "actor-user"
      target: "process-avd"
      type: "dataFlow"
      data:
        label: "Feed discovery & RDP session (clipboard, drive redirection)"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]
        dataClassification: ["Confidential"]

    - id: "edge-avd-entra"
      source: "process-avd"
      target: "process-entra"
      type: "dataFlow"
      data:
        label: "Token validation"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["oauth2"]

    - id: "edge-avd-session-hosts"
      source: "process-avd"
      target: "process-session-hosts"
      type: "dataFlow"
      data:
        label: "Brokered RDP session"
        protocol: "Custom"
        encrypted: true
        authentication: ["unspecified"]
        dataClassification: ["Confidential"]
        description: "Carried over the outbound reverse-connect channel; no inbound ports required"

    - id: "edge-session-hosts-avd"
      source: "process-session-hosts"
      target: "process-avd"
      type: "dataFlow"
      data:
        label: "Reverse connect & agent heartbeat (443)"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]

    # Session host data access
    - id: "edge-session-hosts-fslogix"
      source: "process-session-hosts"
      target: "datastore-fslogix"
      type: "dataFlow"
      data:
        label: "Profile container mount"
        protocol: "SMB 3.1.1"
        encrypted: true
        authentication: ["unspecified"]
        dataClassification: ["PII", "Confidential"]

    - id: "edge-session-hosts-sql"
      source: "process-session-hosts"
      target: "datastore-sql"
      type: "dataFlow"
      data:
        label: "LOB app queries"
        protocol: "SQL"
        encrypted: true
        authentication: ["unspecified"]
        dataClassification: ["Customer Data"]

    - id: "edge-session-hosts-dns"
      source: "process-session-hosts"
      target: "process-private-dns"
      type: "dataFlow"
      data:
        label: "Resolve privatelink names"
        protocol: "UDP"
        encrypted: false

    - id: "edge-session-hosts-firewall"
      source: "process-session-hosts"
      target: "process-firewall"
      type: "dataFlow"
      data:
        label: "Internet egress (UDR 0.0.0.0/0)"
        protocol: "HTTPS"
        encrypted: true

    - id: "edge-firewall-internet"
      source: "process-firewall"
      target: "system-internet"
      type: "dataFlow"
      data:
        label: "Filtered web & SaaS traffic"
        protocol: "HTTPS"
        encrypted: true

    # Administration
    - id: "edge-admin-bastion"
      source: "actor-admin"
      target: "process-bastion"
      type: "dataFlow"
      data:
        label: "Admin session via Azure portal"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-bastion-session-hosts"
      source: "process-bastion"
      target: "process-session-hosts"
      type: "dataFlow"
      data:
        label: "RDP to session host"
        protocol: "TCP"
        encrypted: true
        authentication: ["unspecified"]

    # Deployment
    - id: "edge-pipeline-avd"
      source: "process-pipeline"
      target: "process-avd"
      type: "dataFlow"
      data:
        label: "Provision host pool, app groups & registration token"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-pipeline-keyvault"
      source: "process-pipeline"
      target: "datastore-keyvault"
      type: "dataFlow"
      data:
        label: "Store registration token"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]
        dataClassification: ["Confidential"]

    - id: "edge-pipeline-session-hosts"
      source: "process-pipeline"
      target: "process-session-hosts"
      type: "dataFlow"
      data:
        label: "Deploy VMs from golden image & register agent"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-session-hosts-keyvault"
      source: "process-session-hosts"
      target: "datastore-keyvault"
      type: "dataFlow"
      data:
        label: "Fetch registration token at provisioning"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]

    # Monitoring
    - id: "edge-session-hosts-logs"
      source: "process-session-hosts"
      target: "process-log-analytics"
      type: "dataFlow"
      data:
        label: "Security events (Azure Monitor Agent)"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-avd-logs"
      source: "process-avd"
      target: "process-log-analytics"
      type: "dataFlow"
      data:
        label: "WVD connection & management diagnostics"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]

    - id: "edge-firewall-logs"
      source: "process-firewall"
      target: "process-log-analytics"
      type: "dataFlow"
      data:
        label: "Firewall & DNS logs"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]
