template:
  slug: remote-operations-center
  name: "Remote Operations Center"
  description: "Data flow diagram for a centralized remote operations center monitoring multiple distributed energy sites via RTUs and SCADA, with secure remote access for field engineers"
  category: industrialControl
  diagram_type: level1

canvas_data:
  nodes:
    # Human Actors
    - id: "actor-roc-operator"
      type: "humanActor"
      position: { x: 90, y: 200 }
      data:
        label: "ROC Operator"
        actorType: "user"
        component_ref: "control-operator"
        description: "Remote operations center operator monitoring multiple sites"

    - id: "actor-field-eng"
      type: "humanActor"
      position: { x: 90, y: 530 }
      data:
        label: "Field Engineer"
        actorType: "user"
        component_ref: "remote-engineer"
        description: "Mobile field engineer with site access"

    # System Scope
    - id: "scope-roc"
      type: "systemScope"
      position: { x: 300, y: 30 }
      style: { width: 1100, height: 850 }
      data:
        label: "Remote Operations Center Architecture"

    # Trust Zones
    - id: "zone-roc-center"
      type: "trustZone"
      parentId: "scope-roc"
      position: { x: 30, y: 45 }
      style: { width: 500, height: 340 }
      data:
        label: "Central Operations (Level 2-3)"
        zoneType: "network"
        trustLevel: 70

    - id: "zone-wan"
      type: "trustZone"
      parentId: "scope-roc"
      position: { x: 30, y: 420 }
      style: { width: 500, height: 180 }
      data:
        label: "WAN / Satellite Link"
        zoneType: "network"
        trustLevel: 10

    - id: "zone-site-a"
      type: "trustZone"
      parentId: "scope-roc"
      position: { x: 560, y: 45 }
      style: { width: 500, height: 260 }
      data:
        label: "Remote Site A - Pipeline Station"
        zoneType: "network"
        trustLevel: 80

    - id: "zone-site-b"
      type: "trustZone"
      parentId: "scope-roc"
      position: { x: 560, y: 340 }
      style: { width: 500, height: 260 }
      data:
        label: "Remote Site B - Compressor Station"
        zoneType: "network"
        trustLevel: 80

    - id: "zone-remote-access"
      type: "trustZone"
      parentId: "scope-roc"
      position: { x: 560, y: 635 }
      style: { width: 500, height: 175 }
      data:
        label: "Secure Remote Access Zone"
        zoneType: "network"
        trustLevel: 40

    # Central Operations Components
    - id: "process-central-scada"
      type: "process"
      parentId: "zone-roc-center"
      position: { x: 60, y: 45 }
      data:
        label: "Central SCADA"
        component_ref: "scada-server"
        technology: "SCADA Server"
        dataSensitivity: "confidential"

    - id: "process-roc-hmi"
      type: "process"
      parentId: "zone-roc-center"
      position: { x: 280, y: 45 }
      data:
        label: "Operations HMI"
        component_ref: "hmi"
        technology: "Human-Machine Interface (HMI)"

    - id: "datastore-central-historian"
      type: "datastore"
      parentId: "zone-roc-center"
      position: { x: 60, y: 195 }
      data:
        label: "Central Historian"
        component_ref: "historian"
        technology: "Process Data Historian"
        dataSensitivity: "confidential"

    # WAN Components
    - id: "process-wan-firewall"
      type: "process"
      parentId: "zone-wan"
      position: { x: 60, y: 45 }
      data:
        label: "WAN Firewall"
        component_ref: "industrial-firewall"
        technology: "Industrial Firewall / DMZ"

    - id: "process-opc-broker"
      type: "process"
      parentId: "zone-wan"
      position: { x: 280, y: 45 }
      data:
        label: "OPC UA Broker"
        component_ref: "opc-ua-gateway"
        technology: "OPC UA Gateway"

    # Site A Components
    - id: "process-rtu-pipeline"
      type: "process"
      parentId: "zone-site-a"
      position: { x: 60, y: 45 }
      data:
        label: "Pipeline RTU"
        component_ref: "rtu"
        technology: "Remote Terminal Unit (RTU)"
        dataSensitivity: "confidential"

    - id: "actor-pipeline-sensors"
      type: "systemActor"
      parentId: "zone-site-a"
      position: { x: 280, y: 45 }
      data:
        label: "Pipeline Sensors"
        component_ref: "field-sensor"
        kind: "device"
        description: "Pressure, flow, and leak detection sensors along the pipeline"

    - id: "actor-pipeline-valves"
      type: "systemActor"
      parentId: "zone-site-a"
      position: { x: 280, y: 130 }
      data:
        label: "Isolation Valves"
        component_ref: "actuator"
        kind: "device"
        description: "Pipeline emergency isolation valves"

    # Site B Components
    - id: "process-plc-compressor"
      type: "process"
      parentId: "zone-site-b"
      position: { x: 60, y: 45 }
      data:
        label: "Compressor PLC"
        component_ref: "plc"
        technology: "Programmable Logic Controller (PLC)"
        dataSensitivity: "confidential"

    - id: "process-site-b-sis"
      type: "process"
      parentId: "zone-site-b"
      position: { x: 280, y: 45 }
      data:
        label: "Compressor SIS"
        component_ref: "sis"
        technology: "Safety Instrumented System (SIS)"
        dataSensitivity: "confidential"

    - id: "actor-compressor-sensors"
      type: "systemActor"
      parentId: "zone-site-b"
      position: { x: 60, y: 145 }
      data:
        label: "Compressor Sensors"
        component_ref: "field-sensor"
        kind: "device"
        description: "Vibration, temperature, pressure, and surge detection"

    # Remote Access Zone
    - id: "process-jump-server"
      type: "process"
      parentId: "zone-remote-access"
      position: { x: 60, y: 45 }
      data:
        label: "Jump Server"
        component_ref: "engineering-workstation"
        technology: "Engineering Workstation"

  edges:
    # Operator -> HMI
    - id: "edge-roc-op-hmi"
      source: "actor-roc-operator"
      target: "process-roc-hmi"
      type: "dataFlow"
      data:
        label: "Monitoring and commands"
        encrypted: false
        authentication: ["unspecified"]

    # HMI -> SCADA
    - id: "edge-hmi-scada-roc"
      source: "process-roc-hmi"
      target: "process-central-scada"
      type: "dataFlow"
      data:
        label: "Operator commands"
        encrypted: false
        authentication: ["unspecified"]

    # SCADA -> HMI
    - id: "edge-scada-hmi-roc"
      source: "process-central-scada"
      target: "process-roc-hmi"
      type: "dataFlow"
      data:
        label: "Multi-site overview"
        encrypted: false

    # SCADA -> Historian
    - id: "edge-scada-hist-roc"
      source: "process-central-scada"
      target: "datastore-central-historian"
      type: "dataFlow"
      data:
        label: "Aggregated site data"
        encrypted: false

    # SCADA -> WAN Firewall
    - id: "edge-scada-wan"
      source: "process-central-scada"
      target: "process-wan-firewall"
      type: "dataFlow"
      data:
        label: "Remote commands"
        encrypted: true
        authentication: ["unspecified"]

    # WAN Firewall -> OPC Broker
    - id: "edge-wan-opc"
      source: "process-wan-firewall"
      target: "process-opc-broker"
      type: "dataFlow"
      data:
        label: "Filtered site traffic"
        encrypted: true
        authentication: ["unspecified"]

    # OPC Broker -> SCADA (return path)
    - id: "edge-opc-scada"
      source: "process-opc-broker"
      target: "process-central-scada"
      type: "dataFlow"
      data:
        label: "Aggregated site data"
        encrypted: true
        authentication: ["certificate"]
        protocol: "OPC UA"

    # OPC Broker -> RTU (Site A)
    - id: "edge-opc-rtu"
      source: "process-opc-broker"
      target: "process-rtu-pipeline"
      type: "dataFlow"
      data:
        label: "Pipeline commands"
        encrypted: false
        protocol: "DNP3"

    # RTU -> OPC Broker
    - id: "edge-rtu-opc"
      source: "process-rtu-pipeline"
      target: "process-opc-broker"
      type: "dataFlow"
      data:
        label: "Pipeline telemetry"
        encrypted: false
        protocol: "DNP3"

    # Pipeline Sensors -> RTU
    - id: "edge-sensors-rtu"
      source: "actor-pipeline-sensors"
      target: "process-rtu-pipeline"
      type: "dataFlow"
      data:
        label: "Pipeline measurements"
        flowType: "signal"
        encrypted: false

    # RTU -> Pipeline Valves
    - id: "edge-rtu-valves"
      source: "process-rtu-pipeline"
      target: "actor-pipeline-valves"
      type: "dataFlow"
      data:
        label: "Valve commands"
        flowType: "control"
        encrypted: false

    # OPC Broker -> PLC (Site B)
    - id: "edge-opc-plc"
      source: "process-opc-broker"
      target: "process-plc-compressor"
      type: "dataFlow"
      data:
        label: "Compressor setpoints"
        encrypted: false
        protocol: "EtherNet/IP"

    # PLC -> OPC Broker
    - id: "edge-plc-opc"
      source: "process-plc-compressor"
      target: "process-opc-broker"
      type: "dataFlow"
      data:
        label: "Compressor telemetry"
        encrypted: false
        protocol: "EtherNet/IP"

    # Compressor Sensors -> PLC
    - id: "edge-comp-sensors-plc"
      source: "actor-compressor-sensors"
      target: "process-plc-compressor"
      type: "dataFlow"
      data:
        label: "Vibration and pressure"
        flowType: "signal"
        encrypted: false

    # Compressor Sensors -> SIS
    - id: "edge-comp-sensors-sis"
      source: "actor-compressor-sensors"
      target: "process-site-b-sis"
      type: "dataFlow"
      data:
        label: "Safety-critical values"
        flowType: "signal"
        encrypted: false

    # Field Engineer -> Jump Server
    - id: "edge-eng-jump"
      source: "actor-field-eng"
      target: "process-jump-server"
      type: "dataFlow"
      data:
        label: "Authenticated remote session"
        encrypted: true
        authentication: ["unspecified"]
        protocol: "VPN + MFA"

    # Jump Server -> WAN Firewall
    - id: "edge-jump-wan"
      source: "process-jump-server"
      target: "process-wan-firewall"
      type: "dataFlow"
      data:
        label: "Engineering access"
        encrypted: true
        authentication: ["unspecified"]

    # Conduit between the operations center and the WAN link to the sites
    - id: "boundary-roc-wan"
      source: "zone-roc-center"
      target: "zone-wan"
      type: "trustBoundary"
      data:
        label: "WAN conduit"
        boundaryType: "network"
        authenticationMethods: ["certificate"]
        accessControlMethods: ["acl"]
        dataValidation: true
        logging: true
        monitoring: true
