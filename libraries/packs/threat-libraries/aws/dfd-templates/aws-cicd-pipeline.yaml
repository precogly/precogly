template:
  slug: aws-cicd-pipeline
  name: "CI/CD Pipeline"
  description: "CI/CD pipeline using CodePipeline, CodeBuild, ECR, and CloudFormation for infrastructure-as-code deployments"
  category: cloudInfrastructure
  diagram_type: level1

canvas_data:
  nodes:
    # ---- External Actors ----
    - id: "actor-developer"
      type: "humanActor"
      position: { x: 60, y: 150 }
      data:
        label: "Developer"
        actorType: "developer"
        description: "Developer pushing code changes"

    - id: "actor-source-repo"
      type: "systemActor"
      position: { x: 60, y: 380 }
      data:
        label: "Source Repository"
        systemType: "service"
        description: "External code repository (GitHub, CodeCommit)"

    # ---- System Scope ----
    - id: "scope-aws"
      type: "systemScope"
      position: { x: 270, y: 30 }
      style: { width: 1000, height: 780 }
      data:
        label: "AWS Cloud"

    # ---- Trust Zones ----
    - id: "tz-build"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 30, y: 45 }
      style: { width: 610, height: 350 }
      data:
        label: "Build Tier"
        zoneType: "trust"
        trustLevel: 50

    - id: "tz-staging"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 670, y: 45 }
      style: { width: 300, height: 280 }
      data:
        label: "Staging"
        zoneType: "trust"
        trustLevel: 75

    - id: "tz-production"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 670, y: 355 }
      style: { width: 300, height: 380 }
      data:
        label: "Production"
        zoneType: "trust"
        trustLevel: 75

    - id: "tz-security"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 30, y: 425 }
      style: { width: 610, height: 310 }
      data:
        label: "Security"
        zoneType: "trust"
        trustLevel: 75

    # ---- Processes: Build Tier ----
    - id: "process-codepipeline"
      type: "process"
      parentId: "tz-build"
      position: { x: 40, y: 50 }
      style: { width: 160, height: 70 }
      data:
        label: "CodePipeline / CodeBuild"
        component_ref: "codepipeline"
        technology: "AWS CodePipeline"
        description: "CI/CD orchestration, build, and test"

    - id: "process-lambda"
      type: "process"
      parentId: "tz-build"
      position: { x: 40, y: 180 }
      style: { width: 160, height: 70 }
      data:
        label: "Lambda"
        component_ref: "lambda"
        technology: "AWS Lambda"
        description: "Custom pipeline actions"

    - id: "process-sns"
      type: "process"
      parentId: "tz-build"
      position: { x: 240, y: 180 }
      style: { width: 160, height: 70 }
      data:
        label: "SNS"
        component_ref: "sns"
        technology: "Amazon SNS"
        description: "Pipeline notifications"

    - id: "datastore-ecr"
      type: "datastore"
      parentId: "tz-build"
      position: { x: 240, y: 40 }
      style: { width: 170, height: 90 }
      data:
        label: "ECR"
        component_ref: "ecr"
        technology: "Amazon ECR"
        description: "Container image registry"
        dataSensitivity: "internal"

    - id: "datastore-s3-artifacts"
      type: "datastore"
      parentId: "tz-build"
      position: { x: 430, y: 40 }
      style: { width: 170, height: 90 }
      data:
        label: "S3 Artifacts"
        component_ref: "s3"
        technology: "Amazon S3"
        description: "Build artifact storage"
        dataSensitivity: "internal"

    # ---- Processes: Staging ----
    - id: "process-cfn-staging"
      type: "process"
      parentId: "tz-staging"
      position: { x: 70, y: 85 }
      style: { width: 160, height: 70 }
      data:
        label: "CloudFormation (Staging)"
        component_ref: "cloudformation"
        technology: "AWS CloudFormation"
        description: "Infrastructure deployment to staging"

    # ---- Processes: Production ----
    - id: "process-cfn-production"
      type: "process"
      parentId: "tz-production"
      position: { x: 70, y: 130 }
      style: { width: 160, height: 70 }
      data:
        label: "CloudFormation (Production)"
        component_ref: "cloudformation"
        technology: "AWS CloudFormation"
        description: "Infrastructure deployment to production"

    # ---- Processes: Security ----
    - id: "process-iam"
      type: "process"
      parentId: "tz-security"
      position: { x: 40, y: 50 }
      style: { width: 160, height: 70 }
      data:
        label: "IAM"
        component_ref: "iam"
        technology: "AWS IAM"
        description: "Pipeline and deployment roles"

    - id: "process-kms"
      type: "process"
      parentId: "tz-security"
      position: { x: 240, y: 50 }
      style: { width: 160, height: 70 }
      data:
        label: "KMS"
        component_ref: "kms"
        technology: "AWS KMS"
        description: "Artifact encryption keys"

    - id: "process-cloudtrail"
      type: "process"
      parentId: "tz-security"
      position: { x: 40, y: 180 }
      style: { width: 160, height: 70 }
      data:
        label: "CloudTrail"
        component_ref: "cloudtrail"
        technology: "AWS CloudTrail"
        description: "API call audit trail"

  edges:
    # Developer → Source Repo
    - id: "edge-developer-to-repo"
      source: "actor-developer"
      target: "actor-source-repo"
      type: "dataFlow"
      data:
        label: "Code push"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["unspecified"]

    # Source Repo → CodePipeline (webhook)
    - id: "edge-repo-to-codepipeline"
      source: "actor-source-repo"
      target: "process-codepipeline"
      type: "dataFlow"
      data:
        label: "Webhook trigger"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]

    # CodePipeline → ECR (push image)
    - id: "edge-codepipeline-to-ecr"
      source: "process-codepipeline"
      target: "datastore-ecr"
      type: "dataFlow"
      data:
        label: "Push container image"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]

    # CodePipeline → S3 (store artifacts)
    - id: "edge-codepipeline-to-s3"
      source: "process-codepipeline"
      target: "datastore-s3-artifacts"
      type: "dataFlow"
      data:
        label: "Store build artifacts"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]

    # CodePipeline → Lambda (custom action)
    - id: "edge-codepipeline-to-lambda"
      source: "process-codepipeline"
      target: "process-lambda"
      type: "dataFlow"
      data:
        label: "Custom pipeline action"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # CodePipeline → CloudFormation Staging (deploy)
    - id: "edge-codepipeline-to-cfn-staging"
      source: "process-codepipeline"
      target: "process-cfn-staging"
      type: "dataFlow"
      data:
        label: "Deploy to staging"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # CloudFormation Staging → CloudFormation Production (promotion)
    - id: "edge-cfn-staging-to-cfn-production"
      source: "process-cfn-staging"
      target: "process-cfn-production"
      type: "dataFlow"
      data:
        label: "Promote (manual approval gate)"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]
        description: "Manual approval required before production deployment"

    # CodePipeline → CloudFormation Production (deploy)
    - id: "edge-codepipeline-to-cfn-production"
      source: "process-codepipeline"
      target: "process-cfn-production"
      type: "dataFlow"
      data:
        label: "Deploy to production"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # CodePipeline → SNS (notifications)
    - id: "edge-codepipeline-to-sns"
      source: "process-codepipeline"
      target: "process-sns"
      type: "dataFlow"
      data:
        label: "Pipeline notifications"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # SNS → Developer (notification)
    - id: "edge-sns-to-developer"
      source: "process-sns"
      target: "actor-developer"
      type: "dataFlow"
      data:
        label: "Build/deploy notification"
        protocol: "HTTPS"
        encrypted: true

    # CodePipeline → IAM (role assumption)
    - id: "edge-codepipeline-to-iam"
      source: "process-codepipeline"
      target: "process-iam"
      type: "dataFlow"
      data:
        label: "Pipeline role assumption"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # KMS → S3 Artifacts (encryption)
    - id: "edge-kms-to-s3"
      source: "process-kms"
      target: "datastore-s3-artifacts"
      type: "dataFlow"
      data:
        label: "Artifact encryption"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # CloudTrail audit (from CodePipeline)
    - id: "edge-codepipeline-to-cloudtrail"
      source: "process-codepipeline"
      target: "process-cloudtrail"
      type: "dataFlow"
      data:
        label: "API call audit"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]
