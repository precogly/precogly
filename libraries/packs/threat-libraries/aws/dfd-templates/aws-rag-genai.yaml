template:
  slug: aws-rag-genai
  name: "RAG / Generative AI Application"
  description: "Retrieval-Augmented Generation application using Bedrock Agents, Knowledge Bases, and vector search via OpenSearch Serverless"
  category: ai
  diagram_type: level1

canvas_data:
  nodes:
    # ---- External Actors ----
    - id: "actor-user"
      type: "humanActor"
      position: { x: 60, y: 280 }
      data:
        label: "User"
        actorType: "user"
        description: "End user interacting with the AI application"

    - id: "actor-bedrock"
      type: "systemActor"
      position: { x: 1220, y: 180 }
      data:
        label: "Amazon Bedrock"
        systemType: "service"
        component_ref: "bedrock"
        description: "Foundation model service for LLM inference"

    # ---- System Scope ----
    - id: "scope-aws"
      type: "systemScope"
      position: { x: 270, y: 30 }
      style: { width: 920, height: 810 }
      data:
        label: "AWS Cloud"

    # ---- Trust Zones ----
    - id: "tz-public-edge"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 30, y: 45 }
      style: { width: 250, height: 350 }
      data:
        label: "Public Edge"
        zoneType: "trust"
        trustLevel: 0

    - id: "tz-app"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 310, y: 45 }
      style: { width: 280, height: 350 }
      data:
        label: "Application Tier"
        zoneType: "trust"
        trustLevel: 50

    - id: "tz-ai"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 620, y: 45 }
      style: { width: 270, height: 350 }
      data:
        label: "AI Tier"
        zoneType: "trust"
        trustLevel: 50

    - id: "tz-data"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 30, y: 425 }
      style: { width: 860, height: 340 }
      data:
        label: "Data Tier"
        zoneType: "trust"
        trustLevel: 75

    # ---- Processes: Public Edge ----
    - id: "process-waf"
      type: "process"
      parentId: "tz-public-edge"
      position: { x: 45, y: 30 }
      style: { width: 160, height: 70 }
      data:
        label: "AWS WAF"
        component_ref: "waf"
        technology: "AWS WAF"
        description: "Web application firewall"

    - id: "process-apigw"
      type: "process"
      parentId: "tz-public-edge"
      position: { x: 45, y: 140 }
      style: { width: 160, height: 70 }
      data:
        label: "API Gateway"
        component_ref: "api-gateway"
        technology: "Amazon API Gateway"
        description: "REST API with Cognito authorizer"

    - id: "process-cognito"
      type: "process"
      parentId: "tz-public-edge"
      position: { x: 45, y: 250 }
      style: { width: 160, height: 70 }
      data:
        label: "Cognito"
        component_ref: "cognito"
        technology: "Amazon Cognito"
        description: "User authentication and token issuance"

    # ---- Processes: Application Tier ----
    - id: "process-lambda"
      type: "process"
      parentId: "tz-app"
      position: { x: 60, y: 120 }
      style: { width: 160, height: 70 }
      data:
        label: "Lambda Orchestrator"
        component_ref: "lambda"
        technology: "AWS Lambda"
        description: "Application orchestration logic"

    # ---- Processes: AI Tier ----
    - id: "process-bedrock-agents"
      type: "process"
      parentId: "tz-ai"
      position: { x: 55, y: 30 }
      style: { width: 160, height: 70 }
      data:
        label: "Bedrock Agents"
        component_ref: "bedrock-agents"
        technology: "Amazon Bedrock Agents"
        description: "Autonomous AI agents with tool use"

    - id: "process-knowledge-bases"
      type: "process"
      parentId: "tz-ai"
      position: { x: 55, y: 140 }
      style: { width: 160, height: 70 }
      data:
        label: "Knowledge Bases"
        component_ref: "bedrock-knowledge-bases"
        technology: "Amazon Bedrock Knowledge Bases"
        description: "Managed RAG retrieval service"

    - id: "process-sagemaker"
      type: "process"
      parentId: "tz-ai"
      position: { x: 55, y: 250 }
      style: { width: 160, height: 70 }
      data:
        label: "SageMaker"
        component_ref: "sagemaker"
        technology: "Amazon SageMaker"
        description: "Model evaluation and fine-tuning"

    # ---- Processes: Observability ----
    - id: "process-cloudwatch"
      type: "process"
      parentId: "tz-data"
      position: { x: 620, y: 120 }
      style: { width: 160, height: 70 }
      data:
        label: "CloudWatch"
        component_ref: "cloudwatch"
        technology: "Amazon CloudWatch"
        description: "Audit logs and traces"

    # ---- Data Stores: Data Tier ----
    - id: "datastore-opensearch"
      type: "datastore"
      parentId: "tz-data"
      position: { x: 40, y: 40 }
      style: { width: 170, height: 90 }
      data:
        label: "Vector Store"
        component_ref: "opensearch-serverless"
        technology: "Amazon OpenSearch Serverless"
        description: "Vector embeddings for semantic search"
        dataSensitivity: "confidential"

    - id: "datastore-s3"
      type: "datastore"
      parentId: "tz-data"
      position: { x: 240, y: 40 }
      style: { width: 170, height: 90 }
      data:
        label: "Document Corpus"
        component_ref: "s3"
        technology: "Amazon S3"
        description: "Source documents for RAG ingestion"
        dataSensitivity: "confidential"

    - id: "datastore-dynamodb"
      type: "datastore"
      parentId: "tz-data"
      position: { x: 440, y: 40 }
      style: { width: 170, height: 90 }
      data:
        label: "Session Store"
        component_ref: "dynamodb"
        technology: "Amazon DynamoDB"
        description: "Chat session history and metadata"
        dataSensitivity: "confidential"

  edges:
    # User → WAF
    - id: "edge-user-to-waf"
      source: "actor-user"
      target: "process-waf"
      type: "dataFlow"
      data:
        label: "HTTPS request"
        protocol: "HTTPS"
        encrypted: true

    # WAF → API Gateway
    - id: "edge-waf-to-apigw"
      source: "process-waf"
      target: "process-apigw"
      type: "dataFlow"
      data:
        label: "Filtered request"
        protocol: "HTTPS"
        encrypted: true

    # API Gateway → Cognito (auth)
    - id: "edge-apigw-to-cognito"
      source: "process-apigw"
      target: "process-cognito"
      type: "dataFlow"
      data:
        label: "Token validation"
        protocol: "HTTPS"
        encrypted: true

    # Cognito → API Gateway (auth result)
    - id: "edge-cognito-to-apigw"
      source: "process-cognito"
      target: "process-apigw"
      type: "dataFlow"
      data:
        label: "Auth result"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["jwt"]

    # User → Cognito (login)
    - id: "edge-user-to-cognito"
      source: "actor-user"
      target: "process-cognito"
      type: "dataFlow"
      data:
        label: "Login / sign-up"
        protocol: "HTTPS"
        encrypted: true

    # API Gateway → Lambda
    - id: "edge-apigw-to-lambda"
      source: "process-apigw"
      target: "process-lambda"
      type: "dataFlow"
      data:
        label: "Authorized request"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # Lambda → API Gateway (response)
    - id: "edge-lambda-to-apigw"
      source: "process-lambda"
      target: "process-apigw"
      type: "dataFlow"
      data:
        label: "Generated response"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # API Gateway → User (response)
    - id: "edge-apigw-to-user"
      source: "process-apigw"
      target: "actor-user"
      type: "dataFlow"
      data:
        label: "AI response"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["jwt"]

    # Lambda → Bedrock Agents
    - id: "edge-lambda-to-agents"
      source: "process-lambda"
      target: "process-bedrock-agents"
      type: "dataFlow"
      data:
        label: "Agent invocation"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # Bedrock Agents → Lambda (tool call)
    - id: "edge-agents-to-lambda"
      source: "process-bedrock-agents"
      target: "process-lambda"
      type: "dataFlow"
      data:
        label: "Tool call (action group)"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # Bedrock Agents → Bedrock (LLM inference)
    - id: "edge-agents-to-bedrock"
      source: "process-bedrock-agents"
      target: "actor-bedrock"
      type: "dataFlow"
      data:
        label: "LLM inference request"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]

    # Bedrock → Bedrock Agents (completion)
    - id: "edge-bedrock-to-agents"
      source: "actor-bedrock"
      target: "process-bedrock-agents"
      type: "dataFlow"
      data:
        label: "Model completion"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]

    # Bedrock Agents → Knowledge Bases (retrieval)
    - id: "edge-agents-to-kb"
      source: "process-bedrock-agents"
      target: "process-knowledge-bases"
      type: "dataFlow"
      data:
        label: "Knowledge retrieval"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # Knowledge Bases → Bedrock Agents (context)
    - id: "edge-kb-to-agents"
      source: "process-knowledge-bases"
      target: "process-bedrock-agents"
      type: "dataFlow"
      data:
        label: "Retrieved context"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # Knowledge Bases → OpenSearch (vector search)
    - id: "edge-kb-to-opensearch"
      source: "process-knowledge-bases"
      target: "datastore-opensearch"
      type: "dataFlow"
      data:
        label: "Vector similarity search"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]

    # OpenSearch → Knowledge Bases (results)
    - id: "edge-opensearch-to-kb"
      source: "datastore-opensearch"
      target: "process-knowledge-bases"
      type: "dataFlow"
      data:
        label: "Matching documents"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]

    # S3 → Knowledge Bases (document ingestion)
    - id: "edge-s3-to-kb"
      source: "datastore-s3"
      target: "process-knowledge-bases"
      type: "dataFlow"
      data:
        label: "Document ingestion"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # Lambda → DynamoDB (session)
    - id: "edge-lambda-to-dynamodb"
      source: "process-lambda"
      target: "datastore-dynamodb"
      type: "dataFlow"
      data:
        label: "Session read/write"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]

    # Lambda → CloudWatch (audit)
    - id: "edge-lambda-to-cloudwatch"
      source: "process-lambda"
      target: "process-cloudwatch"
      type: "dataFlow"
      data:
        label: "Audit logs and traces"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # SageMaker → Bedrock (evaluation)
    - id: "edge-sagemaker-to-bedrock"
      source: "process-sagemaker"
      target: "actor-bedrock"
      type: "dataFlow"
      data:
        label: "Model evaluation"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]

    # SageMaker → S3 (training data)
    - id: "edge-sagemaker-to-s3"
      source: "process-sagemaker"
      target: "datastore-s3"
      type: "dataFlow"
      data:
        label: "Training data read"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]
