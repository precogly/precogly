template:
  slug: aws-event-driven-pipeline
  name: "Event-Driven Pipeline"
  description: "Event-driven architecture using EventBridge as the central bus, with Lambda handlers, SNS fan-out, SQS buffering, and Step Functions orchestration"
  category: dataPipeline
  diagram_type: level1

canvas_data:
  nodes:
    # ---- External Actors ----
    - id: "actor-event-source"
      type: "systemActor"
      position: { x: 60, y: 280 }
      data:
        label: "Event Source"
        systemType: "service"
        description: "External system emitting events"

    # ---- System Scope ----
    - id: "scope-aws"
      type: "systemScope"
      position: { x: 270, y: 30 }
      style: { width: 1100, height: 780 }
      data:
        label: "AWS Cloud"

    # ---- Trust Zones ----
    - id: "tz-ingestion"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 30, y: 45 }
      style: { width: 280, height: 350 }
      data:
        label: "Event Ingestion"
        zoneType: "trust"
        trustLevel: 50

    - id: "tz-processing"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 340, y: 45 }
      style: { width: 500, height: 350 }
      data:
        label: "Processing Tier"
        zoneType: "trust"
        trustLevel: 50

    - id: "tz-data"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 340, y: 425 }
      style: { width: 500, height: 310 }
      data:
        label: "Data Tier"
        zoneType: "trust"
        trustLevel: 75

    - id: "tz-observability"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 30, y: 425 }
      style: { width: 280, height: 310 }
      data:
        label: "Observability"
        zoneType: "trust"
        trustLevel: 50

    # ---- Processes: Event Ingestion ----
    - id: "process-eventbridge"
      type: "process"
      parentId: "tz-ingestion"
      position: { x: 55, y: 40 }
      style: { width: 170, height: 70 }
      data:
        label: "EventBridge"
        component_ref: "eventbridge"
        technology: "Amazon EventBridge"
        description: "Central event bus with rule-based routing"

    - id: "process-sns"
      type: "process"
      parentId: "tz-ingestion"
      position: { x: 55, y: 170 }
      style: { width: 170, height: 70 }
      data:
        label: "SNS"
        component_ref: "sns"
        technology: "Amazon SNS"
        description: "Pub/sub fan-out to multiple subscribers"

    # ---- Processes: Processing Tier ----
    - id: "process-step-functions"
      type: "process"
      parentId: "tz-processing"
      position: { x: 50, y: 40 }
      style: { width: 170, height: 70 }
      data:
        label: "Step Functions"
        component_ref: "step-functions"
        technology: "AWS Step Functions"
        description: "Multi-step workflow orchestration"

    - id: "process-lambda"
      type: "process"
      parentId: "tz-processing"
      position: { x: 280, y: 40 }
      style: { width: 170, height: 70 }
      data:
        label: "Lambda"
        component_ref: "lambda"
        technology: "AWS Lambda"
        description: "Event processing handlers"

    - id: "datastore-sqs"
      type: "datastore"
      parentId: "tz-processing"
      position: { x: 160, y: 170 }
      style: { width: 170, height: 90 }
      data:
        label: "SQS Queue"
        component_ref: "sqs"
        technology: "Amazon SQS"
        description: "Message buffering between stages"
        dataSensitivity: "internal"

    # ---- Data Stores: Data Tier ----
    - id: "datastore-dynamodb"
      type: "datastore"
      parentId: "tz-data"
      position: { x: 50, y: 80 }
      style: { width: 170, height: 90 }
      data:
        label: "DynamoDB"
        component_ref: "dynamodb"
        technology: "Amazon DynamoDB"
        description: "Event processing state and results"
        dataSensitivity: "confidential"

    - id: "datastore-s3"
      type: "datastore"
      parentId: "tz-data"
      position: { x: 280, y: 80 }
      style: { width: 170, height: 90 }
      data:
        label: "S3 Bucket"
        component_ref: "s3"
        technology: "Amazon S3"
        description: "Output artifacts and event archives"
        dataSensitivity: "confidential"

    # ---- Processes: Observability ----
    - id: "process-cloudwatch"
      type: "process"
      parentId: "tz-observability"
      position: { x: 55, y: 100 }
      style: { width: 170, height: 70 }
      data:
        label: "CloudWatch"
        component_ref: "cloudwatch"
        technology: "Amazon CloudWatch"
        description: "Centralized logs, metrics, and alarms"

  edges:
    # Event Source → EventBridge
    - id: "edge-source-to-eventbridge"
      source: "actor-event-source"
      target: "process-eventbridge"
      type: "dataFlow"
      data:
        label: "Inbound events"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]

    # EventBridge → Lambda (direct invocation)
    - id: "edge-eventbridge-to-lambda"
      source: "process-eventbridge"
      target: "process-lambda"
      type: "dataFlow"
      data:
        label: "Rule-matched event"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # EventBridge → Step Functions
    - id: "edge-eventbridge-to-step-functions"
      source: "process-eventbridge"
      target: "process-step-functions"
      type: "dataFlow"
      data:
        label: "Workflow trigger"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # EventBridge → SNS (fan-out)
    - id: "edge-eventbridge-to-sns"
      source: "process-eventbridge"
      target: "process-sns"
      type: "dataFlow"
      data:
        label: "Fan-out event"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # SNS → SQS (buffering)
    - id: "edge-sns-to-sqs"
      source: "process-sns"
      target: "datastore-sqs"
      type: "dataFlow"
      data:
        label: "Buffered delivery"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # SQS → Lambda (poll-based)
    - id: "edge-sqs-to-lambda"
      source: "datastore-sqs"
      target: "process-lambda"
      type: "dataFlow"
      data:
        label: "Message batch"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # Step Functions → Lambda (task execution)
    - id: "edge-step-functions-to-lambda"
      source: "process-step-functions"
      target: "process-lambda"
      type: "dataFlow"
      data:
        label: "Step task invocation"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # Lambda → DynamoDB
    - id: "edge-lambda-to-dynamodb"
      source: "process-lambda"
      target: "datastore-dynamodb"
      type: "dataFlow"
      data:
        label: "State read/write"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]

    # Lambda → S3 (output)
    - id: "edge-lambda-to-s3"
      source: "process-lambda"
      target: "datastore-s3"
      type: "dataFlow"
      data:
        label: "Output artifacts"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]

    # Lambda → CloudWatch (logs)
    - id: "edge-lambda-to-cloudwatch"
      source: "process-lambda"
      target: "process-cloudwatch"
      type: "dataFlow"
      data:
        label: "Logs and metrics"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # Step Functions → CloudWatch
    - id: "edge-step-functions-to-cloudwatch"
      source: "process-step-functions"
      target: "process-cloudwatch"
      type: "dataFlow"
      data:
        label: "Execution history"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # EventBridge → CloudWatch
    - id: "edge-eventbridge-to-cloudwatch"
      source: "process-eventbridge"
      target: "process-cloudwatch"
      type: "dataFlow"
      data:
        label: "Event metrics"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]
