template:
  slug: aws-three-tier-web-app
  name: "Three-Tier Web Application"
  description: "Classic three-tier architecture with load balancer, auto-scaled compute, and relational database in a VPC"
  category: webApplication
  diagram_type: level1

canvas_data:
  nodes:
    # ---- External Actors ----
    - id: "actor-user"
      type: "humanActor"
      position: { x: 60, y: 310 }
      data:
        label: "User"
        actorType: "user"
        description: "End user accessing the web application"

    # ---- System Scope ----
    - id: "scope-aws"
      type: "systemScope"
      position: { x: 270, y: 30 }
      style: { width: 1100, height: 780 }
      data:
        label: "AWS Cloud"

    # ---- Trust Zones ----
    - id: "tz-public-edge"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 30, y: 45 }
      style: { width: 280, height: 350 }
      data:
        label: "Public Edge"
        zoneType: "trust"
        trustLevel: 0

    - id: "tz-dmz"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 340, y: 45 }
      style: { width: 280, height: 300 }
      data:
        label: "Public Subnet"
        zoneType: "trust"
        trustLevel: 25

    - id: "tz-app"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 650, y: 45 }
      style: { width: 280, height: 300 }
      data:
        label: "Private Subnet: App Tier"
        zoneType: "trust"
        trustLevel: 50

    - id: "tz-data"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 340, y: 375 }
      style: { width: 590, height: 360 }
      data:
        label: "Private Subnet: Data Tier"
        zoneType: "trust"
        trustLevel: 75

    - id: "tz-mgmt"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 30, y: 430 }
      style: { width: 280, height: 300 }
      data:
        label: "Management"
        zoneType: "trust"
        trustLevel: 75

    # ---- Processes: Public Edge ----
    - id: "process-cloudfront"
      type: "process"
      parentId: "tz-public-edge"
      position: { x: 60, y: 40 }
      style: { width: 160, height: 70 }
      data:
        label: "CloudFront"
        component_ref: "cloudfront"
        technology: "Amazon CloudFront"
        description: "CDN for static content and API acceleration"

    - id: "process-waf"
      type: "process"
      parentId: "tz-public-edge"
      position: { x: 60, y: 160 }
      style: { width: 160, height: 70 }
      data:
        label: "AWS WAF"
        component_ref: "waf"
        technology: "AWS WAF"
        description: "Edge-level request filtering"

    # ---- Processes: DMZ ----
    - id: "process-elb"
      type: "process"
      parentId: "tz-dmz"
      position: { x: 60, y: 100 }
      style: { width: 160, height: 70 }
      data:
        label: "ALB"
        component_ref: "elb"
        technology: "Elastic Load Balancing"
        description: "Application Load Balancer distributing traffic"

    # ---- Processes: App Tier ----
    - id: "process-ec2"
      type: "process"
      parentId: "tz-app"
      position: { x: 60, y: 100 }
      style: { width: 160, height: 70 }
      data:
        label: "EC2 (ASG)"
        component_ref: "ec2"
        technology: "Amazon EC2"
        description: "Auto Scaling Group of application servers"

    # ---- Processes: Management ----
    - id: "process-iam"
      type: "process"
      parentId: "tz-mgmt"
      position: { x: 60, y: 40 }
      style: { width: 160, height: 70 }
      data:
        label: "IAM"
        component_ref: "iam"
        technology: "AWS IAM"
        description: "Identity and access management"

    - id: "process-cloudtrail"
      type: "process"
      parentId: "tz-mgmt"
      position: { x: 60, y: 160 }
      style: { width: 160, height: 70 }
      data:
        label: "CloudTrail"
        component_ref: "cloudtrail"
        technology: "AWS CloudTrail"
        description: "API activity audit logging"

    # ---- Data Stores: Data Tier ----
    - id: "datastore-rds"
      type: "datastore"
      parentId: "tz-data"
      position: { x: 50, y: 80 }
      style: { width: 170, height: 90 }
      data:
        label: "RDS / Aurora"
        component_ref: "rds"
        technology: "Amazon RDS"
        description: "Relational database (Multi-AZ)"
        dataSensitivity: "confidential"

    - id: "datastore-s3"
      type: "datastore"
      parentId: "tz-data"
      position: { x: 300, y: 80 }
      style: { width: 170, height: 90 }
      data:
        label: "S3 Bucket"
        component_ref: "s3"
        technology: "Amazon S3"
        description: "Static assets and backups"
        dataSensitivity: "confidential"

  edges:
    # User → CloudFront
    - id: "edge-user-to-cloudfront"
      source: "actor-user"
      target: "process-cloudfront"
      type: "dataFlow"
      data:
        label: "HTTPS request"
        protocol: "HTTPS"
        encrypted: true

    # CloudFront → WAF
    - id: "edge-cloudfront-to-waf"
      source: "process-cloudfront"
      target: "process-waf"
      type: "dataFlow"
      data:
        label: "Forwarded request"
        protocol: "HTTPS"
        encrypted: true

    # WAF → ELB
    - id: "edge-waf-to-elb"
      source: "process-waf"
      target: "process-elb"
      type: "dataFlow"
      data:
        label: "Filtered request"
        protocol: "HTTPS"
        encrypted: true

    # ELB → EC2
    - id: "edge-elb-to-ec2"
      source: "process-elb"
      target: "process-ec2"
      type: "dataFlow"
      data:
        label: "Load-balanced request"
        protocol: "HTTP"
        encrypted: false

    # EC2 → ELB (response)
    - id: "edge-ec2-to-elb"
      source: "process-ec2"
      target: "process-elb"
      type: "dataFlow"
      data:
        label: "Application response"
        protocol: "HTTP"
        encrypted: false

    # EC2 → RDS
    - id: "edge-ec2-to-rds"
      source: "process-ec2"
      target: "datastore-rds"
      type: "dataFlow"
      data:
        label: "SQL queries"
        protocol: "SQL"
        encrypted: true
        authentication: ["unspecified"]

    # EC2 → S3
    - id: "edge-ec2-to-s3"
      source: "process-ec2"
      target: "datastore-s3"
      type: "dataFlow"
      data:
        label: "Static asset read/write"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]

    # S3 → CloudFront (static delivery)
    - id: "edge-s3-to-cloudfront"
      source: "datastore-s3"
      target: "process-cloudfront"
      type: "dataFlow"
      data:
        label: "Static asset delivery"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # CloudFront → User (response)
    - id: "edge-cloudfront-to-user"
      source: "process-cloudfront"
      target: "actor-user"
      type: "dataFlow"
      data:
        label: "HTTPS response"
        protocol: "HTTPS"
        encrypted: true

    # EC2 → IAM (role assumption)
    - id: "edge-ec2-to-iam"
      source: "process-ec2"
      target: "process-iam"
      type: "dataFlow"
      data:
        label: "Instance profile credentials"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # CloudTrail audit logging
    - id: "edge-ec2-to-cloudtrail"
      source: "process-ec2"
      target: "process-cloudtrail"
      type: "dataFlow"
      data:
        label: "API call audit"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]
