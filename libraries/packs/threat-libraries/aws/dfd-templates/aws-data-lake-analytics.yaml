template:
  slug: aws-data-lake-analytics
  name: "Data Lake and Analytics"
  description: "Modern data analytics architecture with S3 data lake, ETL processing, Redshift warehouse, and encrypted storage"
  category: dataPipeline
  diagram_type: level1

canvas_data:
  nodes:
    # ---- External Actors ----
    - id: "actor-data-source"
      type: "systemActor"
      position: { x: 60, y: 180 }
      data:
        label: "External Data Source"
        systemType: "service"
        description: "Upstream data feeds and event producers"

    - id: "actor-analyst"
      type: "humanActor"
      position: { x: 1220, y: 480 }
      data:
        label: "Analyst"
        actorType: "user"
        description: "Data analyst running queries and reports"

    # ---- System Scope ----
    - id: "scope-aws"
      type: "systemScope"
      position: { x: 270, y: 30 }
      style: { width: 920, height: 740 }
      data:
        label: "AWS Cloud"

    # ---- Trust Zones ----
    - id: "tz-ingestion"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 30, y: 45 }
      style: { width: 250, height: 280 }
      data:
        label: "Data Ingestion"
        zoneType: "trust"
        trustLevel: 50

    - id: "tz-lake"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 310, y: 45 }
      style: { width: 280, height: 280 }
      data:
        label: "Data Lake"
        zoneType: "trust"
        trustLevel: 50

    - id: "tz-processing"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 310, y: 355 }
      style: { width: 280, height: 340 }
      data:
        label: "Processing"
        zoneType: "trust"
        trustLevel: 75

    - id: "tz-analytics"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 620, y: 355 }
      style: { width: 270, height: 340 }
      data:
        label: "Analytics"
        zoneType: "trust"
        trustLevel: 75

    - id: "tz-security"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 620, y: 45 }
      style: { width: 270, height: 280 }
      data:
        label: "Security"
        zoneType: "trust"
        trustLevel: 75

    # ---- Processes: Ingestion ----
    - id: "process-eventbridge"
      type: "process"
      parentId: "tz-ingestion"
      position: { x: 45, y: 85 }
      style: { width: 160, height: 70 }
      data:
        label: "EventBridge"
        component_ref: "eventbridge"
        technology: "Amazon EventBridge"
        description: "Event ingestion from external data sources"

    # ---- Data Stores: Data Lake ----
    - id: "datastore-s3-raw"
      type: "datastore"
      parentId: "tz-lake"
      position: { x: 55, y: 40 }
      style: { width: 170, height: 90 }
      data:
        label: "S3 Raw Zone"
        component_ref: "s3"
        technology: "Amazon S3"
        description: "Raw ingested data landing zone"
        dataSensitivity: "confidential"

    - id: "datastore-s3-processed"
      type: "datastore"
      parentId: "tz-lake"
      position: { x: 55, y: 160 }
      style: { width: 170, height: 90 }
      data:
        label: "S3 Processed Zone"
        component_ref: "s3"
        technology: "Amazon S3"
        description: "Cleaned and transformed data"
        dataSensitivity: "confidential"

    # ---- Processes: Processing ----
    - id: "process-lambda-etl"
      type: "process"
      parentId: "tz-processing"
      position: { x: 60, y: 120 }
      style: { width: 160, height: 70 }
      data:
        label: "Lambda (ETL)"
        component_ref: "lambda"
        technology: "AWS Lambda"
        description: "Extract, transform, load processing"

    # ---- Data Stores: Analytics ----
    - id: "datastore-redshift"
      type: "datastore"
      parentId: "tz-analytics"
      position: { x: 50, y: 120 }
      style: { width: 170, height: 90 }
      data:
        label: "Redshift"
        component_ref: "redshift"
        technology: "Amazon Redshift"
        description: "Data warehouse for analytics queries"
        dataSensitivity: "confidential"

    # ---- Processes: Security ----
    - id: "process-kms"
      type: "process"
      parentId: "tz-security"
      position: { x: 55, y: 40 }
      style: { width: 160, height: 70 }
      data:
        label: "KMS"
        component_ref: "kms"
        technology: "AWS KMS"
        description: "Encryption keys for data at rest"

    - id: "process-iam"
      type: "process"
      parentId: "tz-security"
      position: { x: 55, y: 160 }
      style: { width: 160, height: 70 }
      data:
        label: "IAM"
        component_ref: "iam"
        technology: "AWS IAM"
        description: "Access control for data lake resources"

  edges:
    # External Data Source → EventBridge
    - id: "edge-source-to-eventbridge"
      source: "actor-data-source"
      target: "process-eventbridge"
      type: "dataFlow"
      data:
        label: "Data events"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]

    # EventBridge → Lambda (ETL trigger)
    - id: "edge-eventbridge-to-lambda"
      source: "process-eventbridge"
      target: "process-lambda-etl"
      type: "dataFlow"
      data:
        label: "Event trigger"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # EventBridge → S3 Raw (direct delivery)
    - id: "edge-eventbridge-to-s3-raw"
      source: "process-eventbridge"
      target: "datastore-s3-raw"
      type: "dataFlow"
      data:
        label: "Raw data delivery"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # S3 Raw → Lambda (ETL read)
    - id: "edge-s3-raw-to-lambda"
      source: "datastore-s3-raw"
      target: "process-lambda-etl"
      type: "dataFlow"
      data:
        label: "Read raw data"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]

    # Lambda → S3 Processed (ETL output)
    - id: "edge-lambda-to-s3-processed"
      source: "process-lambda-etl"
      target: "datastore-s3-processed"
      type: "dataFlow"
      data:
        label: "Write transformed data"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]

    # S3 Processed → Redshift (load)
    - id: "edge-s3-processed-to-redshift"
      source: "datastore-s3-processed"
      target: "datastore-redshift"
      type: "dataFlow"
      data:
        label: "Data load (COPY)"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # Analyst → Redshift (queries)
    - id: "edge-analyst-to-redshift"
      source: "actor-analyst"
      target: "datastore-redshift"
      type: "dataFlow"
      data:
        label: "Analytics queries"
        protocol: "SQL"
        encrypted: true
        authentication: ["unspecified"]

    # Redshift → Analyst (results)
    - id: "edge-redshift-to-analyst"
      source: "datastore-redshift"
      target: "actor-analyst"
      type: "dataFlow"
      data:
        label: "Query results"
        protocol: "SQL"
        encrypted: true
        authentication: ["unspecified"]

    # KMS → S3 Raw (encryption)
    - id: "edge-kms-to-s3-raw"
      source: "process-kms"
      target: "datastore-s3-raw"
      type: "dataFlow"
      data:
        label: "Encryption at rest"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # KMS → S3 Processed (encryption)
    - id: "edge-kms-to-s3-processed"
      source: "process-kms"
      target: "datastore-s3-processed"
      type: "dataFlow"
      data:
        label: "Encryption at rest"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # KMS → Redshift (encryption)
    - id: "edge-kms-to-redshift"
      source: "process-kms"
      target: "datastore-redshift"
      type: "dataFlow"
      data:
        label: "Encryption at rest"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]
