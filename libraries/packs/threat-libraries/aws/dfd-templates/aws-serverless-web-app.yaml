template:
  slug: aws-serverless-web-app
  name: "Serverless Web Application"
  description: "Serverless web application with API Gateway, Lambda, DynamoDB, S3, and Cognito authentication"
  category: webApplication
  diagram_type: level1

canvas_data:
  nodes:
    # ---- External Actors ----
    - id: "actor-user"
      type: "humanActor"
      position: { x: 60, y: 310 }
      data:
        label: "User"
        actorType: "user"
        description: "End user accessing the web application"

    # ---- System Scope ----
    - id: "scope-aws"
      type: "systemScope"
      position: { x: 270, y: 30 }
      style: { width: 980, height: 710 }
      data:
        label: "AWS Cloud"

    # ---- Trust Zones ----
    - id: "tz-public-edge"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 30, y: 45 }
      style: { width: 280, height: 620 }
      data:
        label: "Public Edge"
        zoneType: "trust"
        trustLevel: 0

    - id: "tz-app"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 340, y: 45 }
      style: { width: 280, height: 300 }
      data:
        label: "Application Tier"
        zoneType: "trust"
        trustLevel: 50

    - id: "tz-data"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 340, y: 375 }
      style: { width: 610, height: 290 }
      data:
        label: "Data Tier"
        zoneType: "trust"
        trustLevel: 75

    # ---- Processes: Public Edge ----
    - id: "process-cloudfront"
      type: "process"
      parentId: "tz-public-edge"
      position: { x: 60, y: 30 }
      style: { width: 160, height: 70 }
      data:
        label: "CloudFront"
        component_ref: "cloudfront"
        technology: "Amazon CloudFront"
        description: "CDN for static assets and API distribution"

    - id: "process-waf"
      type: "process"
      parentId: "tz-public-edge"
      position: { x: 60, y: 140 }
      style: { width: 160, height: 70 }
      data:
        label: "AWS WAF"
        component_ref: "waf"
        technology: "AWS WAF"
        description: "Web application firewall filtering requests"

    - id: "process-apigw"
      type: "process"
      parentId: "tz-public-edge"
      position: { x: 60, y: 250 }
      style: { width: 160, height: 70 }
      data:
        label: "API Gateway"
        component_ref: "api-gateway"
        technology: "Amazon API Gateway"
        description: "REST API with Cognito authorizer"

    - id: "process-cognito"
      type: "process"
      parentId: "tz-public-edge"
      position: { x: 60, y: 390 }
      style: { width: 160, height: 70 }
      data:
        label: "Cognito"
        component_ref: "cognito"
        technology: "Amazon Cognito"
        description: "User authentication and token issuance"

    # ---- Processes: Application Tier ----
    - id: "process-lambda"
      type: "process"
      parentId: "tz-app"
      position: { x: 60, y: 100 }
      style: { width: 160, height: 70 }
      data:
        label: "Lambda"
        component_ref: "lambda"
        technology: "AWS Lambda"
        description: "Application business logic"

    # ---- Data Stores: Data Tier ----
    - id: "datastore-dynamodb"
      type: "datastore"
      parentId: "tz-data"
      position: { x: 50, y: 80 }
      style: { width: 170, height: 90 }
      data:
        label: "DynamoDB"
        component_ref: "dynamodb"
        technology: "Amazon DynamoDB"
        description: "Application data storage"
        dataSensitivity: "confidential"

    - id: "datastore-s3"
      type: "datastore"
      parentId: "tz-data"
      position: { x: 300, y: 80 }
      style: { width: 170, height: 90 }
      data:
        label: "S3 Bucket"
        component_ref: "s3"
        technology: "Amazon S3"
        description: "Static assets and file storage"
        dataSensitivity: "confidential"

  edges:
    # User → CloudFront
    - id: "edge-user-to-cloudfront"
      source: "actor-user"
      target: "process-cloudfront"
      type: "dataFlow"
      data:
        label: "HTTPS request"
        protocol: "HTTPS"
        encrypted: true

    # CloudFront → WAF
    - id: "edge-cloudfront-to-waf"
      source: "process-cloudfront"
      target: "process-waf"
      type: "dataFlow"
      data:
        label: "Forwarded request"
        protocol: "HTTPS"
        encrypted: true

    # WAF → API Gateway
    - id: "edge-waf-to-apigw"
      source: "process-waf"
      target: "process-apigw"
      type: "dataFlow"
      data:
        label: "Filtered request"
        protocol: "HTTPS"
        encrypted: true

    # API Gateway → Cognito (auth check)
    - id: "edge-apigw-to-cognito"
      source: "process-apigw"
      target: "process-cognito"
      type: "dataFlow"
      data:
        label: "Token validation"
        protocol: "HTTPS"
        encrypted: true

    # Cognito → API Gateway (auth result)
    - id: "edge-cognito-to-apigw"
      source: "process-cognito"
      target: "process-apigw"
      type: "dataFlow"
      data:
        label: "Auth result"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["jwt"]

    # User → Cognito (login)
    - id: "edge-user-to-cognito"
      source: "actor-user"
      target: "process-cognito"
      type: "dataFlow"
      data:
        label: "Login / sign-up"
        protocol: "HTTPS"
        encrypted: true

    # API Gateway → Lambda
    - id: "edge-apigw-to-lambda"
      source: "process-apigw"
      target: "process-lambda"
      type: "dataFlow"
      data:
        label: "Authorized request"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # Lambda → API Gateway (response)
    - id: "edge-lambda-to-apigw"
      source: "process-lambda"
      target: "process-apigw"
      type: "dataFlow"
      data:
        label: "API response"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # Lambda → DynamoDB
    - id: "edge-lambda-to-dynamodb"
      source: "process-lambda"
      target: "datastore-dynamodb"
      type: "dataFlow"
      data:
        label: "Read/write data"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]

    # Lambda → S3
    - id: "edge-lambda-to-s3"
      source: "process-lambda"
      target: "datastore-s3"
      type: "dataFlow"
      data:
        label: "File read/write"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]

    # S3 → CloudFront (static assets)
    - id: "edge-s3-to-cloudfront"
      source: "datastore-s3"
      target: "process-cloudfront"
      type: "dataFlow"
      data:
        label: "Static asset delivery"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # CloudFront → User (response)
    - id: "edge-cloudfront-to-user"
      source: "process-cloudfront"
      target: "actor-user"
      type: "dataFlow"
      data:
        label: "HTTPS response"
        protocol: "HTTPS"
        encrypted: true
