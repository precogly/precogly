template:
  slug: aws-security-baseline
  name: "Multi-Account Security Baseline (AWS SRA)"
  description: "Multi-account security architecture based on the AWS Security Reference Architecture (SRA), with centralized logging, GuardDuty, Security Hub, and Config across organization accounts"
  category: cloudInfrastructure
  diagram_type: level1

canvas_data:
  nodes:
    # ---- External Actors ----
    - id: "actor-security-admin"
      type: "humanActor"
      position: { x: 60, y: 160 }
      data:
        label: "Security Admin"
        actorType: "admin"
        description: "Security team member managing the organization"

    # ---- System Scope ----
    - id: "scope-aws"
      type: "systemScope"
      position: { x: 270, y: 30 }
      style: { width: 1100, height: 780 }
      data:
        label: "AWS Organization"

    # ---- Trust Zones (modeled as account boundaries) ----
    - id: "tz-management"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 30, y: 45 }
      style: { width: 300, height: 310 }
      data:
        label: "Management Account"
        zoneType: "trust"
        trustLevel: 75

    - id: "tz-log-archive"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 360, y: 45 }
      style: { width: 340, height: 310 }
      data:
        label: "Log Archive Account"
        zoneType: "trust"
        trustLevel: 75

    - id: "tz-security-tooling"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 30, y: 385 }
      style: { width: 670, height: 350 }
      data:
        label: "Security Tooling Account"
        zoneType: "trust"
        trustLevel: 50

    - id: "tz-application"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 730, y: 45 }
      style: { width: 340, height: 690 }
      data:
        label: "Application Account"
        zoneType: "trust"
        trustLevel: 50

    # ---- Processes: Management Account ----
    - id: "process-iam"
      type: "process"
      parentId: "tz-management"
      position: { x: 65, y: 40 }
      style: { width: 170, height: 70 }
      data:
        label: "IAM (Org Root)"
        component_ref: "iam"
        technology: "AWS IAM"
        description: "Organization root, SCPs, and cross-account roles"

    - id: "process-kms"
      type: "process"
      parentId: "tz-management"
      position: { x: 65, y: 160 }
      style: { width: 170, height: 70 }
      data:
        label: "KMS"
        component_ref: "kms"
        technology: "AWS KMS"
        description: "Organization-wide encryption key management"

    # ---- Processes: Log Archive Account ----
    - id: "process-cloudtrail"
      type: "process"
      parentId: "tz-log-archive"
      position: { x: 85, y: 40 }
      style: { width: 170, height: 70 }
      data:
        label: "CloudTrail (Org)"
        component_ref: "cloudtrail"
        technology: "AWS CloudTrail"
        description: "Organization-wide API audit trail"

    - id: "datastore-s3-logs"
      type: "datastore"
      parentId: "tz-log-archive"
      position: { x: 85, y: 160 }
      style: { width: 170, height: 90 }
      data:
        label: "Log Bucket"
        component_ref: "s3"
        technology: "Amazon S3"
        description: "Centralized log storage with retention policies"
        dataSensitivity: "confidential"

    # ---- Processes: Security Tooling Account ----
    - id: "process-guardduty"
      type: "process"
      parentId: "tz-security-tooling"
      position: { x: 50, y: 50 }
      style: { width: 170, height: 70 }
      data:
        label: "GuardDuty"
        component_ref: "guardduty"
        technology: "Amazon GuardDuty"
        description: "Delegated admin for threat detection"

    - id: "process-security-hub"
      type: "process"
      parentId: "tz-security-tooling"
      position: { x: 270, y: 50 }
      style: { width: 170, height: 70 }
      data:
        label: "Security Hub"
        component_ref: "security-hub"
        technology: "AWS Security Hub"
        description: "Centralized security findings aggregation"

    - id: "process-config"
      type: "process"
      parentId: "tz-security-tooling"
      position: { x: 50, y: 190 }
      style: { width: 170, height: 70 }
      data:
        label: "AWS Config"
        component_ref: "config"
        technology: "AWS Config"
        description: "Configuration compliance evaluation"

    - id: "process-sns"
      type: "process"
      parentId: "tz-security-tooling"
      position: { x: 270, y: 190 }
      style: { width: 170, height: 70 }
      data:
        label: "SNS"
        component_ref: "sns"
        technology: "Amazon SNS"
        description: "Security alert notifications"

    # ---- Processes: Application Account ----
    - id: "process-workload"
      type: "process"
      parentId: "tz-application"
      position: { x: 85, y: 120 }
      style: { width: 170, height: 70 }
      data:
        label: "Workload Services"
        component_ref: "ec2"
        technology: "Amazon EC2"
        description: "Application workloads generating API activity"

    - id: "process-app-cloudtrail"
      type: "process"
      parentId: "tz-application"
      position: { x: 85, y: 280 }
      style: { width: 170, height: 70 }
      data:
        label: "CloudTrail (Local)"
        component_ref: "cloudtrail"
        technology: "AWS CloudTrail"
        description: "Account-level API audit trail"

    - id: "process-app-config"
      type: "process"
      parentId: "tz-application"
      position: { x: 85, y: 440 }
      style: { width: 170, height: 70 }
      data:
        label: "Config (Local)"
        component_ref: "config"
        technology: "AWS Config"
        description: "Account-level configuration recording"

  edges:
    # Security Admin → IAM
    - id: "edge-admin-to-iam"
      source: "actor-security-admin"
      target: "process-iam"
      type: "dataFlow"
      data:
        label: "Org management"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]

    # IAM → Workload (SCPs, role assumption)
    - id: "edge-iam-to-workload"
      source: "process-iam"
      target: "process-workload"
      type: "dataFlow"
      data:
        label: "SCPs and role assumption"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # Workload → App CloudTrail
    - id: "edge-workload-to-app-cloudtrail"
      source: "process-workload"
      target: "process-app-cloudtrail"
      type: "dataFlow"
      data:
        label: "API call logging"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # App CloudTrail → S3 Log Bucket (centralized)
    - id: "edge-app-cloudtrail-to-s3-logs"
      source: "process-app-cloudtrail"
      target: "datastore-s3-logs"
      type: "dataFlow"
      data:
        label: "Log delivery"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # Org CloudTrail → S3 Log Bucket
    - id: "edge-cloudtrail-to-s3-logs"
      source: "process-cloudtrail"
      target: "datastore-s3-logs"
      type: "dataFlow"
      data:
        label: "Org trail log storage"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # KMS → S3 Log Bucket (encryption)
    - id: "edge-kms-to-s3-logs"
      source: "process-kms"
      target: "datastore-s3-logs"
      type: "dataFlow"
      data:
        label: "Log encryption keys"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # GuardDuty → Security Hub
    - id: "edge-guardduty-to-security-hub"
      source: "process-guardduty"
      target: "process-security-hub"
      type: "dataFlow"
      data:
        label: "Threat findings"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # Config → Security Hub
    - id: "edge-config-to-security-hub"
      source: "process-config"
      target: "process-security-hub"
      type: "dataFlow"
      data:
        label: "Compliance findings"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # App Config → Config (delegated)
    - id: "edge-app-config-to-config"
      source: "process-app-config"
      target: "process-config"
      type: "dataFlow"
      data:
        label: "Configuration snapshots"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # Security Hub → SNS (alerts)
    - id: "edge-security-hub-to-sns"
      source: "process-security-hub"
      target: "process-sns"
      type: "dataFlow"
      data:
        label: "Alert notifications"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # SNS → Security Admin
    - id: "edge-sns-to-admin"
      source: "process-sns"
      target: "actor-security-admin"
      type: "dataFlow"
      data:
        label: "Email/SMS alerts"
        protocol: "HTTPS"
        encrypted: true

    # Security Admin → Security Hub (review)
    - id: "edge-admin-to-security-hub"
      source: "actor-security-admin"
      target: "process-security-hub"
      type: "dataFlow"
      data:
        label: "Review findings"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]

    # Workload → GuardDuty (monitoring)
    - id: "edge-workload-to-guardduty"
      source: "process-workload"
      target: "process-guardduty"
      type: "dataFlow"
      data:
        label: "VPC flow logs, DNS logs"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]
