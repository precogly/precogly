template:
  slug: aws-containerized-microservices
  name: "Containerized Microservices"
  description: "Containerized microservices on ECS/Fargate within a VPC, fronted by an ALB, with ECR for image storage and ElastiCache for caching"
  category: microservices
  diagram_type: level1

canvas_data:
  nodes:
    # ---- External Actors ----
    - id: "actor-user"
      type: "humanActor"
      position: { x: 60, y: 280 }
      data:
        label: "User"
        actorType: "user"
        description: "End user accessing the application"

    # ---- System Scope ----
    - id: "scope-aws"
      type: "systemScope"
      position: { x: 270, y: 30 }
      style: { width: 1100, height: 830 }
      data:
        label: "AWS Cloud"

    # ---- Trust Zones ----
    - id: "tz-public-edge"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 30, y: 45 }
      style: { width: 250, height: 280 }
      data:
        label: "Public Edge"
        zoneType: "trust"
        trustLevel: 0

    - id: "tz-dmz"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 310, y: 45 }
      style: { width: 250, height: 280 }
      data:
        label: "Public Subnet"
        zoneType: "trust"
        trustLevel: 25

    - id: "tz-app"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 590, y: 45 }
      style: { width: 480, height: 280 }
      data:
        label: "Private Subnet: App Tier"
        zoneType: "trust"
        trustLevel: 50

    - id: "tz-data"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 310, y: 355 }
      style: { width: 500, height: 260 }
      data:
        label: "Private Subnet: Data Tier"
        zoneType: "trust"
        trustLevel: 75

    - id: "tz-mgmt"
      type: "trustZone"
      parentId: "scope-aws"
      position: { x: 30, y: 355 }
      style: { width: 250, height: 430 }
      data:
        label: "Management"
        zoneType: "trust"
        trustLevel: 75

    # ---- Processes: Public Edge ----
    - id: "process-waf"
      type: "process"
      parentId: "tz-public-edge"
      position: { x: 45, y: 85 }
      style: { width: 160, height: 70 }
      data:
        label: "AWS WAF"
        component_ref: "waf"
        technology: "AWS WAF"
        description: "Web application firewall"

    # ---- Processes: DMZ ----
    - id: "process-elb"
      type: "process"
      parentId: "tz-dmz"
      position: { x: 45, y: 85 }
      style: { width: 160, height: 70 }
      data:
        label: "ALB"
        component_ref: "elb"
        technology: "Elastic Load Balancing"
        description: "Application Load Balancer with path-based routing"

    # ---- Processes: App Tier ----
    - id: "process-ecs-service-a"
      type: "process"
      parentId: "tz-app"
      position: { x: 40, y: 40 }
      style: { width: 160, height: 70 }
      data:
        label: "ECS Service A"
        component_ref: "ecs"
        technology: "Amazon ECS"
        description: "Primary microservice on Fargate"

    - id: "process-ecs-service-b"
      type: "process"
      parentId: "tz-app"
      position: { x: 260, y: 40 }
      style: { width: 160, height: 70 }
      data:
        label: "ECS Service B"
        component_ref: "ecs"
        technology: "Amazon ECS"
        description: "Secondary microservice on Fargate"

    # ---- Processes: Management ----
    - id: "process-ecr"
      type: "process"
      parentId: "tz-mgmt"
      position: { x: 45, y: 40 }
      style: { width: 160, height: 70 }
      data:
        label: "ECR"
        component_ref: "ecr"
        technology: "Amazon ECR"
        description: "Container image registry"

    - id: "process-secrets-manager"
      type: "process"
      parentId: "tz-mgmt"
      position: { x: 45, y: 150 }
      style: { width: 160, height: 70 }
      data:
        label: "Secrets Manager"
        component_ref: "secrets-manager"
        technology: "AWS Secrets Manager"
        description: "Credential and secret storage"

    - id: "process-cloudwatch"
      type: "process"
      parentId: "tz-mgmt"
      position: { x: 45, y: 260 }
      style: { width: 160, height: 70 }
      data:
        label: "CloudWatch"
        component_ref: "cloudwatch"
        technology: "Amazon CloudWatch"
        description: "Logs, metrics, and alarms"

    # ---- Data Stores: Data Tier ----
    - id: "datastore-rds"
      type: "datastore"
      parentId: "tz-data"
      position: { x: 50, y: 70 }
      style: { width: 170, height: 90 }
      data:
        label: "RDS / Aurora"
        component_ref: "rds"
        technology: "Amazon RDS"
        description: "Relational database (Multi-AZ)"
        dataSensitivity: "confidential"

    - id: "datastore-elasticache"
      type: "datastore"
      parentId: "tz-data"
      position: { x: 280, y: 70 }
      style: { width: 170, height: 90 }
      data:
        label: "ElastiCache"
        component_ref: "elasticache"
        technology: "Amazon ElastiCache"
        description: "Redis cache for sessions and data"
        dataSensitivity: "confidential"

  edges:
    # User → WAF
    - id: "edge-user-to-waf"
      source: "actor-user"
      target: "process-waf"
      type: "dataFlow"
      data:
        label: "HTTPS request"
        protocol: "HTTPS"
        encrypted: true

    # WAF → ALB
    - id: "edge-waf-to-elb"
      source: "process-waf"
      target: "process-elb"
      type: "dataFlow"
      data:
        label: "Filtered request"
        protocol: "HTTPS"
        encrypted: true

    # ALB → ECS Service A
    - id: "edge-elb-to-ecs-a"
      source: "process-elb"
      target: "process-ecs-service-a"
      type: "dataFlow"
      data:
        label: "Routed request"
        protocol: "HTTP"
        encrypted: false

    # ALB → ECS Service B
    - id: "edge-elb-to-ecs-b"
      source: "process-elb"
      target: "process-ecs-service-b"
      type: "dataFlow"
      data:
        label: "Routed request"
        protocol: "HTTP"
        encrypted: false

    # ECS Service A → ECS Service B (internal)
    - id: "edge-ecs-a-to-ecs-b"
      source: "process-ecs-service-a"
      target: "process-ecs-service-b"
      type: "dataFlow"
      data:
        label: "Internal service call"
        protocol: "HTTP"
        encrypted: false
        authentication: ["unspecified"]

    # ECS Service A → RDS
    - id: "edge-ecs-a-to-rds"
      source: "process-ecs-service-a"
      target: "datastore-rds"
      type: "dataFlow"
      data:
        label: "SQL queries"
        protocol: "SQL"
        encrypted: true
        authentication: ["unspecified"]

    # ECS Service B → RDS
    - id: "edge-ecs-b-to-rds"
      source: "process-ecs-service-b"
      target: "datastore-rds"
      type: "dataFlow"
      data:
        label: "SQL queries"
        protocol: "SQL"
        encrypted: true
        authentication: ["unspecified"]

    # ECS Service A → ElastiCache
    - id: "edge-ecs-a-to-elasticache"
      source: "process-ecs-service-a"
      target: "datastore-elasticache"
      type: "dataFlow"
      data:
        label: "Session/cache read/write"
        protocol: "TCP"
        encrypted: true
        authentication: ["unspecified"]

    # ECR → ECS (image pull)
    - id: "edge-ecr-to-ecs-a"
      source: "process-ecr"
      target: "process-ecs-service-a"
      type: "dataFlow"
      data:
        label: "Container image pull"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]

    - id: "edge-ecr-to-ecs-b"
      source: "process-ecr"
      target: "process-ecs-service-b"
      type: "dataFlow"
      data:
        label: "Container image pull"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]

    # ECS → Secrets Manager
    - id: "edge-ecs-a-to-secrets"
      source: "process-ecs-service-a"
      target: "process-secrets-manager"
      type: "dataFlow"
      data:
        label: "Credential retrieval"
        protocol: "HTTPS"
        encrypted: true
        authentication: ["hmac"]

    # ECS → CloudWatch (logs)
    - id: "edge-ecs-a-to-cloudwatch"
      source: "process-ecs-service-a"
      target: "process-cloudwatch"
      type: "dataFlow"
      data:
        label: "Logs and metrics"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    - id: "edge-ecs-b-to-cloudwatch"
      source: "process-ecs-service-b"
      target: "process-cloudwatch"
      type: "dataFlow"
      data:
        label: "Logs and metrics"
        protocol: "AWS Internal"
        encrypted: true
        authentication: ["hmac"]

    # ALB → User (response)
    - id: "edge-elb-to-user"
      source: "process-elb"
      target: "actor-user"
      type: "dataFlow"
      data:
        label: "HTTPS response"
        protocol: "HTTPS"
        encrypted: true
