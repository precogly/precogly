components:
  # Storage
  - id: s3
    name: Amazon S3
    category: datastore
    type: Object Storage
    provider: aws
    icon: icons/s3.svg
    description: |
      Amazon Simple Storage Service (S3) provides scalable object storage for data backup,
      archival, and analytics. Supports versioning, lifecycle policies, and cross-region replication.

  # Compute
  - id: lambda
    name: AWS Lambda
    category: process
    type: Serverless Function
    provider: aws
    icon: icons/lambda.svg
    description: |
      AWS Lambda lets you run code without provisioning servers. Supports multiple runtimes
      (Python, Node.js, Java, etc.) with automatic scaling and pay-per-execution pricing.

  # API
  - id: api-gateway
    name: Amazon API Gateway
    category: process
    type: API Management
    provider: aws
    icon: icons/api-gateway.svg
    description: |
      Amazon API Gateway is a managed service for creating, publishing, and securing REST,
      HTTP, and WebSocket APIs. Supports throttling, caching, and authorization.

  # Database
  - id: dynamodb
    name: Amazon DynamoDB
    category: datastore
    type: NoSQL Database
    provider: aws
    icon: icons/dynamodb.svg
    description: |
      Amazon DynamoDB is a fully managed NoSQL database with single-digit millisecond latency.
      Supports key-value and document data models with automatic scaling.

  # Messaging
  - id: sqs
    name: Amazon SQS
    category: process
    type: Message Queue
    provider: aws
    icon: icons/sqs.svg
    description: |
      Amazon Simple Queue Service (SQS) is a fully managed message queuing service
      for decoupling and scaling microservices, distributed systems, and serverless apps.

  # AI / ML
  - id: bedrock
    name: Amazon Bedrock
    category: external_system_actor
    type: AI Model Service
    provider: aws
    icon: icons/bedrock.svg
    description: |
      Amazon Bedrock is a fully managed service for building generative AI applications
      with foundation models from Anthropic, Meta, Mistral, and others. Supports text
      generation, embeddings, image generation, and model customization with Guardrails
      for responsible AI.

  # Search / Vector Store
  - id: opensearch-serverless
    name: Amazon OpenSearch Serverless
    category: datastore
    type: Vector Database
    provider: aws
    icon: icons/opensearch-serverless.svg
    description: |
      Amazon OpenSearch Serverless provides serverless search and vector database
      capabilities. Used as a knowledge base for RAG (Retrieval-Augmented Generation)
      pipelines, storing vector embeddings alongside source documents for semantic search.

  # Identity
  - id: cognito
    name: Amazon Cognito
    category: external_system_actor
    type: Identity Provider
    provider: aws
    icon: icons/cognito.svg
    description: |
      Amazon Cognito provides authentication, authorization, and user management for
      web and mobile apps. Supports user pools, identity pools, OAuth 2.0/OIDC,
      MFA, and adaptive authentication.

  # Security
  - id: waf
    name: AWS WAF
    category: process
    type: Web Application Firewall
    provider: aws
    icon: icons/waf.svg
    description: |
      AWS WAF is a web application firewall that protects against common web exploits
      and bots. Supports managed rules, custom rules, rate limiting, and IP reputation
      lists. Integrates with API Gateway, CloudFront, and ALB.

  # Monitoring
  - id: cloudwatch
    name: Amazon CloudWatch
    category: external_system_actor
    type: Monitoring Service
    provider: aws
    icon: icons/cloudwatch.svg
    description: |
      Amazon CloudWatch provides monitoring and observability for AWS resources and
      applications. Collects metrics, logs, and traces. Supports alarms, dashboards,
      anomaly detection, and automated actions.

  # ============================================================================
  # Batch 1: Foundational Infrastructure
  # ============================================================================

  # Identity
  - id: iam
    name: AWS IAM
    category: process
    type: Identity and Access Management
    provider: aws
    icon: icons/iam.svg
    description: |
      AWS Identity and Access Management (IAM) controls access to AWS services
      and resources. Manages users, groups, roles, and policies that define
      permissions across the AWS account.

  # Encryption
  - id: kms
    name: AWS KMS
    category: process
    type: Key Management Service
    provider: aws
    icon: icons/kms.svg
    description: |
      AWS Key Management Service (KMS) creates and manages cryptographic keys
      used to encrypt data across AWS services. Supports automatic key rotation,
      key policies, and grants for fine-grained access control.

  # Networking
  - id: vpc
    name: Amazon VPC
    category: process
    type: Virtual Network
    provider: aws
    icon: icons/vpc.svg
    description: |
      Amazon Virtual Private Cloud (VPC) provides logically isolated network
      environments. Includes subnets, route tables, security groups, NACLs,
      flow logs, and VPC endpoints for private connectivity to AWS services.

  # Compute
  - id: ec2
    name: Amazon EC2
    category: process
    type: Virtual Machine
    provider: aws
    icon: icons/ec2.svg
    description: |
      Amazon Elastic Compute Cloud (EC2) provides resizable virtual servers.
      Includes instance metadata service (IMDS), instance profiles for IAM
      role assignment, EBS volumes for storage, and security group associations.

  # Load Balancing
  - id: elb
    name: Elastic Load Balancing
    category: process
    type: Load Balancer
    provider: aws
    icon: icons/elb.svg
    description: |
      Elastic Load Balancing distributes incoming traffic across multiple targets
      including EC2 instances, containers, and Lambda functions. Supports Application
      Load Balancers (HTTP/HTTPS), Network Load Balancers (TCP/TLS), and Gateway
      Load Balancers.

  # Database
  - id: rds
    name: Amazon RDS
    category: datastore
    type: Relational Database
    provider: aws
    icon: icons/rds.svg
    description: |
      Amazon Relational Database Service (RDS) and Amazon Aurora provide managed relational
      databases supporting MySQL, PostgreSQL, MariaDB, Oracle, and SQL Server. Aurora offers
      MySQL and PostgreSQL compatibility with enhanced performance and availability. Supports
      Multi-AZ deployments, automated backups, encryption, and IAM authentication.

  # Audit
  - id: cloudtrail
    name: AWS CloudTrail
    category: process
    type: Audit Logging Service
    provider: aws
    icon: icons/cloudtrail.svg
    description: |
      AWS CloudTrail records API calls and account activity across AWS services, delivering
      log files to S3 and optionally to CloudWatch Logs. Provides event history for governance,
      compliance, operational auditing, and security investigation. Supports multi-region
      trails, log file validation, and organization-level trails.

  # ============================================================================
  # Batch 2: Containers, Secrets, Edge, DNS
  # ============================================================================

  # Container Orchestration
  - id: ecs
    name: Amazon ECS
    category: process
    type: Container Orchestration
    provider: aws
    icon: icons/ecs.svg
    description: |
      Amazon Elastic Container Service (ECS) is a fully managed container orchestration
      service supporting both Fargate (serverless) and EC2 launch types. Manages task
      definitions, services, and clusters for running Docker containers at scale.

  - id: eks
    name: Amazon EKS
    category: process
    type: Kubernetes Service
    provider: aws
    icon: icons/eks.svg
    description: |
      Amazon Elastic Kubernetes Service (EKS) is a managed Kubernetes control plane
      that runs across multiple availability zones. Supports managed node groups,
      Fargate profiles, and integrates with AWS IAM for authentication and RBAC
      for authorization.

  # Container Registry
  - id: ecr
    name: Amazon ECR
    category: datastore
    type: Container Registry
    provider: aws
    icon: icons/ecr.svg
    description: |
      Amazon Elastic Container Registry (ECR) is a managed Docker container image
      registry. Supports image scanning for vulnerabilities, immutable tags, lifecycle
      policies, cross-account and cross-region replication, and encryption at rest.

  # Secrets Management
  - id: secrets-manager
    name: AWS Secrets Manager
    category: datastore
    type: Secrets Management
    provider: aws
    icon: icons/secrets-manager.svg
    description: |
      AWS Secrets Manager stores, rotates, and manages access to database credentials,
      API keys, and other secrets. Supports automatic rotation via Lambda functions,
      fine-grained IAM and resource-based policies, encryption with KMS, and cross-account
      secret sharing. Integrates with RDS, Redshift, and DocumentDB for native rotation.

  # Content Delivery
  - id: cloudfront
    name: Amazon CloudFront
    category: process
    type: Content Delivery Network
    provider: aws
    icon: icons/cloudfront.svg
    description: |
      Amazon CloudFront is a global content delivery network (CDN) that accelerates
      delivery of web content, APIs, and video streams. Supports HTTPS enforcement,
      origin access control, field-level encryption, AWS WAF integration, and geo-restriction.
      Distributes traffic across edge locations to reduce latency and absorb DDoS attacks.

  # DNS
  - id: route53
    name: Amazon Route 53
    category: process
    type: DNS Service
    provider: aws
    icon: icons/route53.svg
    description: |
      Amazon Route 53 is a scalable DNS web service providing domain registration,
      DNS routing, and health checking. Supports public and private hosted zones,
      DNSSEC signing, query logging to CloudWatch Logs, alias records for AWS resources,
      and traffic routing policies (weighted, geolocation, latency, failover).

  # ==========================================================================
  # Batch 3: DevOps, Detection, Data, AI Expansion
  # ==========================================================================

  # Integration and Events
  - id: sns
    name: Amazon SNS
    category: process
    type: Notification Service
    provider: aws
    icon: icons/sns.svg
    description: |
      Amazon Simple Notification Service provides pub/sub messaging for
      application-to-application and application-to-person communication.

  - id: eventbridge
    name: Amazon EventBridge
    category: process
    type: Event Bus
    provider: aws
    icon: icons/eventbridge.svg
    description: |
      Amazon EventBridge is a serverless event bus for routing events between
      AWS services, SaaS applications, and custom applications.

  - id: step-functions
    name: AWS Step Functions
    category: process
    type: Workflow Orchestration
    provider: aws
    icon: icons/step-functions.svg
    description: |
      AWS Step Functions orchestrates multi-step workflows using state machines,
      coordinating Lambda functions and other AWS services.

  - id: appsync
    name: AppSync
    category: process
    type: GraphQL API
    provider: aws
    icon: icons/appsync.svg
    description: |
      AWS AppSync is a managed GraphQL and pub/sub API service that simplifies
      application development with real-time data synchronization.

  - id: acm
    name: ACM
    category: process
    type: Certificate Management
    provider: aws
    icon: icons/acm.svg
    description: |
      AWS Certificate Manager provisions, manages, and deploys TLS certificates
      for use with AWS services and internal connected resources.

  - id: ebs
    name: EBS
    category: datastore
    type: Block Storage
    provider: aws
    icon: icons/ebs.svg
    description: |
      Amazon Elastic Block Store provides persistent block storage volumes for
      EC2 instances with snapshot and encryption capabilities.

  # DevOps and Management
  - id: cloudformation
    name: AWS CloudFormation
    category: process
    type: Infrastructure as Code
    provider: aws
    icon: icons/cloudformation.svg
    description: |
      AWS CloudFormation provisions and manages AWS resources through declarative templates.
      Supports stack sets for multi-account deployment and drift detection.

  - id: codepipeline
    name: AWS CodePipeline
    category: process
    type: CI/CD Pipeline
    provider: aws
    icon: icons/codepipeline.svg
    description: |
      AWS CodePipeline orchestrates build, test, and deploy workflows.
      CodeBuild provides managed build environments for compiling source and running tests.

  - id: elastic-beanstalk
    name: AWS Elastic Beanstalk
    category: process
    type: Managed Application Platform
    provider: aws
    icon: icons/elastic-beanstalk.svg
    description: |
      AWS Elastic Beanstalk deploys and manages web applications on managed EC2, ECS,
      or Docker environments with built-in load balancing, scaling, and monitoring.

  - id: ssm
    name: AWS Systems Manager
    category: process
    type: Operations Management
    provider: aws
    icon: icons/ssm.svg
    description: |
      AWS Systems Manager provides operational tools including Session Manager for
      remote access, Parameter Store for configuration, and Run Command for automation.

  # Detection and Compliance
  - id: guardduty
    name: Amazon GuardDuty
    category: process
    type: Threat Detection
    provider: aws
    icon: icons/guardduty.svg
    description: |
      Amazon GuardDuty is a managed threat detection service that continuously monitors
      AWS accounts and workloads for malicious activity using ML and threat intelligence.

  - id: config
    name: AWS Config
    category: process
    type: Configuration Compliance
    provider: aws
    icon: icons/config.svg
    description: |
      AWS Config continuously records resource configurations and evaluates them against
      desired settings using managed and custom rules for compliance auditing.

  # Data and Analytics
  - id: elasticache
    name: Amazon ElastiCache
    category: datastore
    type: In-Memory Cache
    provider: aws
    icon: icons/elasticache.svg
    description: |
      Managed in-memory data store (Redis, Memcached) for caching, session management,
      and real-time analytics.

  - id: redshift
    name: Amazon Redshift
    category: datastore
    type: Data Warehouse
    provider: aws
    icon: icons/redshift.svg
    description: |
      Managed data warehouse for petabyte-scale analytics with columnar storage and
      massively parallel processing.

  - id: security-hub
    name: AWS Security Hub
    category: process
    type: Security Aggregator
    provider: aws
    icon: icons/security-hub.svg
    description: |
      Centralized security findings aggregation and compliance posture management
      across AWS accounts and services.

  # AI Expansion
  - id: sagemaker
    name: Amazon SageMaker
    category: process
    type: ML Platform
    provider: aws
    icon: icons/sagemaker.svg
    description: |
      Managed machine learning platform for building, training, and deploying ML models
      with notebook instances and endpoints.

  - id: bedrock-agents
    name: Amazon Bedrock Agents
    category: process
    type: AI Agent Platform
    provider: aws
    icon: icons/bedrock-agents.svg
    description: |
      Autonomous AI agents that use foundation models to reason and invoke action groups
      to complete tasks.

  - id: bedrock-knowledge-bases
    name: Amazon Bedrock Knowledge Bases
    category: datastore
    type: RAG Storage
    provider: aws
    icon: icons/bedrock-knowledge-bases.svg
    description: |
      Managed RAG service that connects foundation models to data sources for
      retrieval-augmented generation.
