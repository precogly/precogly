template:
  slug: gcp-cloud-run
  name: "GCP Cloud Run API"
  description: "Containerized API with Cloud Run, Firestore, and Cloud Storage"
  category: api
  diagram_type: level1

canvas_data:
  nodes:
    # External actor (outside all boundaries)
    - id: "actor-client"
      type: "humanActor"
      position: { x: 50, y: 200 }
      data:
        label: "Client"
        actorType: "external"
        description: "Web or mobile application"

    # System boundary - GCP Cloud Run System
    - id: "sb-gcp"
      type: "systemScope"
      position: { x: 180, y: 50 }
      style: { width: 720, height: 450 }
      data:
        label: "GCP Cloud Run API"
        owner: "Platform Team"
        classification: "Production"

    # Trust boundary - GCP VPC (inside sb-gcp)
    - id: "tb-gcp"
      type: "trustZone"
      parentId: "sb-gcp"
      position: { x: 30, y: 60 }
      style: { width: 650, height: 360 }
      data:
        label: "GCP VPC"
        zoneType: "trust"
        trustLevel: 75
        technology: "Google VPC"

    # GCP Services (nested inside tb-gcp)
    - id: "process-lb"
      type: "process"
      parentId: "tb-gcp"
      position: { x: 50, y: 80 }
      data:
        label: "Cloud Load Balancing"
        technology: "GCP Cloud Load Balancing"
        description: "Global load balancer with SSL termination"

    - id: "process-iap"
      type: "process"
      parentId: "tb-gcp"
      position: { x: 50, y: 200 }
      data:
        label: "Identity-Aware Proxy"
        technology: "GCP IAP"
        description: "Context-aware access control"

    - id: "process-cloudrun"
      type: "process"
      parentId: "tb-gcp"
      position: { x: 250, y: 80 }
      data:
        label: "Cloud Run"
        technology: "GCP Cloud Run"
        description: "Serverless containerized application"

    - id: "datastore-firestore"
      type: "datastore"
      parentId: "tb-gcp"
      position: { x: 450, y: 80 }
      data:
        label: "Firestore"
        technology: "GCP Firestore"
        description: "NoSQL document database"
        dataSensitivity: "confidential"

    - id: "datastore-gcs"
      type: "datastore"
      parentId: "tb-gcp"
      position: { x: 450, y: 200 }
      data:
        label: "Cloud Storage"
        technology: "GCP Cloud Storage"
        description: "Object storage for files and assets"

  edges:
    - id: "edge-1"
      source: "actor-client"
      target: "process-lb"
      type: "dataFlow"
      data:
        label: "HTTPS Requests"
        protocol: "HTTPS"
        encrypted: true

    - id: "edge-2"
      source: "process-lb"
      target: "process-iap"
      type: "dataFlow"
      data:
        label: "Auth Check"
        protocol: "HTTPS"
        encrypted: true

    - id: "edge-3"
      source: "process-lb"
      target: "process-cloudrun"
      type: "dataFlow"
      data:
        label: "Forward Request"
        protocol: "HTTPS"
        encrypted: true

    - id: "edge-4"
      source: "process-cloudrun"
      target: "datastore-firestore"
      type: "dataFlow"
      data:
        label: "Read/Write Data"
        protocol: "gRPC"
        encrypted: true

    - id: "edge-5"
      source: "process-cloudrun"
      target: "datastore-gcs"
      type: "dataFlow"
      data:
        label: "Store Files"
        protocol: "HTTPS"
        encrypted: true
