pack:
  schema_version: 1
  slug: demo-asvs
  name: "Demo: OWASP ASVS subset"
  version: 1.0.0
  pack_type: compliance
  author: Precogly
  description: >-
    A subset of OWASP ASVS 4.0.3 (44 of its 278 requirements) for trying Precogly, not for real compliance work.
    The full standard is in precogly/library-packs and can be imported from the Libraries page.
    Adapted from the OWASP Application Security Verification Standard 4.0.3, Copyright 2008-2021 The OWASP Foundation,
    licensed under CC BY-SA 3.0. Changes: a subset of the requirements, under a different pack and framework name.
    This adapted text stays under CC BY-SA 3.0.
  tags:
  - demo
  - compliance
  - asvs
  - owasp
frameworks:
- slug: demo-asvs-4
  name: "Demo: OWASP ASVS subset"
  version: 4.0.3
  issuer: OWASP Foundation
  description: >-
    A subset of OWASP ASVS 4.0.3 (44 of its 278 requirements) for trying Precogly, not for real compliance work.
    The full standard is in precogly/library-packs.
  requirements:
  - section_code: V1.1.2
    description: >-
      Verify the use of threat modeling for every design change or sprint planning to identify threats, plan for countermeasures,
      facilitate appropriate risk responses, and guide security testing.
  - section_code: V1.4.1
    description: >-
      Verify that trusted enforcement points, such as access control gateways, servers, and serverless functions, enforce
      access controls. Never enforce access controls on the client.
  - section_code: V1.6.1
    description: >-
      Verify that there is an explicit policy for management of cryptographic keys and that a cryptographic key lifecycle
      follows a key management standard such as NIST SP 800-57.
  - section_code: V1.6.2
    description: >-
      Verify that consumers of cryptographic services protect key material and other secrets by using key vaults or API based
      alternatives.
  - section_code: V1.6.3
    description: >-
      Verify that all keys and passwords are replaceable and are part of a well-defined process to re-encrypt sensitive data.
  - section_code: V1.9.1
    description: >-
      Verify the application encrypts communications between components, particularly when these components are in different
      containers, systems, sites, or cloud providers. (C3)
  - section_code: V1.14.1
    description: >-
      Verify the segregation of components of differing trust levels through well-defined security controls, firewall rules,
      API gateways, reverse proxies, cloud-based security groups, or similar mechanisms.
  - section_code: V2.1.1
    description: >-
      Verify that user set passwords are at least 12 characters in length (after multiple spaces are combined). (C6)
  - section_code: V2.1.7
    description: >-
      Verify that passwords submitted during account registration, login, and password change are checked against a set of
      breached passwords either locally (such as the top 1,000 or 10,000 most common passwords which match the system's password
      policy) or using an external API. If using an API a zero knowledge proof or other mechanism should be used to ensure
      that the plain text password is not sent or used in verifying the breach status of the password. If the password is
      breached, the application must require the user to set a new non-breached password. (C6)
  - section_code: V2.1.9
    description: >-
      Verify that there are no password composition rules limiting the type of characters permitted. There should be no requirement
      for upper or lower case or numbers or special characters. (C6)
  - section_code: V2.2.1
    description: >-
      Verify that anti-automation controls are effective at mitigating breached credential testing, brute force, and account
      lockout attacks. Such controls include blocking the most common breached passwords, soft lockouts, rate limiting, CAPTCHA,
      ever increasing delays between attempts, IP address restrictions, or risk-based restrictions such as location, first
      login on a device, recent attempts to unlock the account, or similar. Verify that no more than 100 failed attempts per
      hour is possible on a single account.
  - section_code: V2.5.4
    description: Verify shared or default accounts are not present (e.g. "root", "admin", or "sa").
  - section_code: V2.8.1
    description: Verify that time-based OTPs have a defined lifetime before expiring.
  - section_code: V2.10.1
    description: >-
      Verify that intra-service secrets do not rely on unchanging credentials such as passwords, API keys or shared accounts
      with privileged access.
  - section_code: V2.10.4
    description: >-
      Verify passwords, integrations with databases and third-party systems, seeds and internal secrets, and API keys are
      managed securely and not included in the source code or stored within source code repositories. Such storage SHOULD
      resist offline attacks. The use of a secure software key store (L1), hardware TPM, or an HSM (L3) is recommended for
      password storage.
  - section_code: V4.1.1
    description: >-
      Verify that the application enforces access control rules on a trusted service layer, especially if client-side access
      control is present and could be bypassed.
  - section_code: V4.1.3
    description: >-
      Verify that the principle of least privilege exists - users should only be able to access functions, data files, URLs,
      controllers, services, and other resources, for which they possess specific authorization. This implies protection against
      spoofing and elevation of privilege. (C7)
  - section_code: V4.2.1
    description: >-
      Verify that sensitive data and APIs are protected against Insecure Direct Object Reference (IDOR) attacks targeting
      creation, reading, updating and deletion of records, such as creating or updating someone else's record, viewing everyone's
      records, or deleting all records.
  - section_code: V4.3.1
    description: >-
      Verify administrative interfaces use appropriate multi-factor authentication to prevent unauthorized use.
  - section_code: V5.1.3
    description: >-
      Verify that all input (HTML form fields, REST requests, URL parameters, HTTP headers, cookies, batch files, RSS feeds,
      etc) is validated using positive validation (allow lists). (C5)
  - section_code: V5.1.4
    description: >-
      Verify that structured data is strongly typed and validated against a defined schema including allowed characters, length
      and pattern (e.g. credit card numbers, e-mail addresses, telephone numbers, or validating that two related fields are
      reasonable, such as checking that suburb and zip/postcode match). (C5)
  - section_code: V5.3.4
    description: >-
      Verify that data selection or database queries (e.g. SQL, HQL, ORM, NoSQL) use parameterized queries, ORMs, entity frameworks,
      or are otherwise protected from database injection attacks. (C3)
  - section_code: V5.5.3
    description: >-
      Verify that deserialization of untrusted data is avoided or is protected in both custom code and third-party libraries
      (such as JSON, XML and YAML parsers).
  - section_code: V6.1.1
    description: >-
      Verify that regulated private data is stored encrypted while at rest, such as Personally Identifiable Information (PII),
      sensitive personal information, or data assessed likely to be subject to EU's GDPR.
  - section_code: V6.2.1
    description: >-
      Verify that all cryptographic modules fail securely, and errors are handled in a way that does not enable Padding Oracle
      attacks.
  - section_code: V6.2.4
    description: >-
      Verify that random number, encryption or hashing algorithms, key lengths, rounds, ciphers or modes, can be reconfigured,
      upgraded, or swapped at any time, to protect against cryptographic breaks. (C8)
  - section_code: V6.4.1
    description: >-
      Verify that a secrets management solution such as a key vault is used to securely create, store, control access to and
      destroy secrets. (C8)
  - section_code: V6.4.2
    description: >-
      Verify that key material is not exposed to the application but instead uses an isolated security module like a vault
      for cryptographic operations. (C8)
  - section_code: V7.1.1
    description: >-
      Verify that the application does not log credentials or payment details. Session tokens should only be stored in logs
      in an irreversible, hashed form. (C9, C10)
  - section_code: V7.1.3
    description: >-
      Verify that the application logs security relevant events including successful and failed authentication events, access
      control failures, deserialization failures and input validation failures. (C5, C7)
  - section_code: V7.2.1
    description: >-
      Verify that all authentication decisions are logged, without storing sensitive session tokens or passwords. This should
      include requests with relevant metadata needed for security investigations.
  - section_code: V7.2.2
    description: >-
      Verify that all access control decisions can be logged and all failed decisions are logged. This should include requests
      with relevant metadata needed for security investigations.
  - section_code: V8.1.1
    description: >-
      Verify the application protects sensitive data from being cached in server components such as load balancers and application
      caches.
  - section_code: V8.1.5
    description: >-
      Verify that regular backups of important data are performed and that test restoration of data is performed.
  - section_code: V8.3.4
    description: >-
      Verify that all sensitive data created and processed by the application has been identified, and ensure that a policy
      is in place on how to deal with sensitive data. (C8)
  - section_code: V9.1.1
    description: >-
      Verify that TLS is used for all client connectivity, and does not fall back to insecure or unencrypted communications.
      (C8)
  - section_code: V9.1.2
    description: >-
      Verify using up to date TLS testing tools that only strong cipher suites are enabled, with the strongest cipher suites
      set as preferred.
  - section_code: V9.2.2
    description: >-
      Verify that encrypted communications such as TLS is used for all inbound and outbound connections, including for management
      ports, monitoring, authentication, API, or web service calls, database, cloud, serverless, mainframe, external, and
      partner connections. The server must not fall back to insecure or unencrypted protocols.
  - section_code: V11.1.1
    description: >-
      Verify that the application will only process business logic flows for the same user in sequential step order and without
      skipping steps.
  - section_code: V11.1.4
    description: >-
      Verify that the application has anti-automation controls to protect against excessive calls such as mass data exfiltration,
      business logic requests, file uploads or denial of service attacks.
  - section_code: V13.1.3
    description: Verify API URLs do not expose sensitive information, such as the API key, session tokens etc.
  - section_code: V13.2.2
    description: Verify that JSON schema validation is in place and verified before accepting input.
  - section_code: V14.1.1
    description: >-
      Verify that the application build and deployment processes are performed in a secure and repeatable way, such as CI
      / CD automation, automated configuration management, and automated deployment scripts.
  - section_code: V14.2.1
    description: >-
      Verify that all components are up to date, preferably using a dependency checker during build or compile time. (C2)
