pack:
  schema_version: 1
  slug: owasp-aisvs
  name: OWASP AISVS 1.0
  version: 1.0.0
  pack_type: compliance
  author: Precogly
  description: 'OWASP Artificial Intelligence Security Verification Standard (AISVS) v1.0 compliance framework.

    191 testable requirements across 12 chapters covering training data integrity, input validation,

    model lifecycle management, infrastructure security, access control, supply chain security,

    output control, vector database security, agentic/orchestration security, MCP security,

    adversarial robustness, and monitoring/logging. Three verification levels (L1 baseline,

    L2 standard, L3 advanced) aligned with OWASP ASVS levels.

    '
  tags:
  - compliance
  - security
  - ai
  - ml
  - llm
  - agentic
  - mcp
  - rag
  - aisvs
  - verification
  - owasp
frameworks:
- slug: owasp-aisvs-1-0
  name: OWASP AISVS
  version: '1.0'
  issuer: OWASP Foundation
  description: Artificial Intelligence Security Verification Standard
  requirements:
  - section_code: 1.1.1
    description: Verify that training data includes only features, attributes, and fields required for the model's stated
      purpose.
  - section_code: 1.1.2
    description: Verify that an up-to-date inventory is kept of every training-data source, including its origin, responsible
      party, license, collection method, intended use constraints, and processing history.
  - section_code: 1.1.3
    description: Verify that data integrity is provided when training data is stored and transferred.
  - section_code: 1.1.4
    description: Verify that integrity monitoring is applied to guard against unauthorized modifications or corruption of
      training data.
  - section_code: 1.1.5
    description: Verify that datasets are watermarked so their use can be attributed and any unauthorized use detected.
  - section_code: 1.2.1
    description: Verify that labeling platforms enforce access controls that restrict who can create, modify, or approve annotations.
  - section_code: 1.2.2
    description: Verify that cryptographic integrity is applied to labeling artifacts.
  - section_code: 1.2.3
    description: Verify that sensitive information in labels is redacted, anonymized, or encrypted before being used in any
      labeling artifact.
  - section_code: 1.3.1
    description: Verify that training and fine-tuning pipelines implement poisoning detection techniques to identify potential
      data poisoning or unintentional corruption in training data.
  - section_code: 1.3.2
    description: Verify that automatically generated labels are subject to confidence thresholds and consistency checks to
      detect misleading or low-confidence labels.
  - section_code: 1.3.3
    description: Verify that models used in security-relevant decisions are evaluated for bias patterns.
  - section_code: 1.3.4
    description: Verify that disallowed content is detected and removed before training.
  - section_code: 1.3.5
    description: Verify that defenses against clean-label poisoning attacks are implemented.
  - section_code: 2.1.1
    description: Verify that input normalization is applied before tokenization or embedding.
  - section_code: 2.1.2
    description: Verify that encoding and representation smuggling in inputs is detected and mitigated. Approved mitigations
      include canonicalization, strict schema validation, policy-based rejection, or explicit marking.
  - section_code: 2.1.3
    description: Verify that all inputs that could steer model behavior are treated as untrusted and screened by a prompt
      injection detection ruleset or classifier, with flagged inputs blocked.
  - section_code: 2.1.4
    description: Verify that input length controls prevent content from exceeding the context window. The controls must reject
      inputs that exceed token limits rather than truncating them.
  - section_code: 2.1.5
    description: Verify that the system implements a character set restriction for all inputs. The restriction must use an
      allow-list approach that permits only characters that are explicitly required.
  - section_code: 2.1.6
    description: Verify that the system enforces an instruction hierarchy in which system and developer messages override
      user instructions and other untrusted inputs, even after user instructions have been processed.
  - section_code: 2.1.7
    description: Verify that reserved special tokens are encoded as literal characters and cannot be injected into the model
      context.
  - section_code: 2.1.8
    description: Verify that the system can detect many-shot jailbreaking patterns.
  - section_code: 2.2.1
    description: Verify that every prompt is scored by a content classifier for violence, self-harm, hate, and sexual content
      against configurable thresholds. Prompts that exceed those thresholds are rejected or sanitized before reaching the
      model context.
  - section_code: 2.2.2
    description: Verify that prompt content classification is evaluated for unsupported languages.
  - section_code: 2.2.3
    description: Verify that non-text inputs (image/video/audio) are checked for adversarial perturbations, steganographic
      payloads, hidden or embedded content, or known attack patterns.
  - section_code: 2.2.4
    description: Verify that coordinated attacks spanning multiple input types (e.g., steganographic payloads in images combined
      with prompt injection in text) are detected and blocked.
  - section_code: 3.1.1
    description: Verify that a model registry maintains an inventory of all deployed model artifacts and their origin.
  - section_code: 3.1.2
    description: Verify that all model artifacts (weights, configurations, tokenizers, base models, fine-tunes, adapters,
      and safety/policy models) are cryptographically signed by authorized entities.
  - section_code: 3.1.3
    description: Verify that model cryptographic signatures are verified at deployment admission and on load.
  - section_code: 3.2.1
    description: Verify that models undergo automated input validation testing, safety evaluation testing, and output sanitization
      testing before deployment.
  - section_code: 3.2.2
    description: Verify that models subjected to post-training quantization are re-evaluated against the same safety and alignment
      test suite on the compressed artifact before deployment.
  - section_code: 3.2.3
    description: Verify that provider model, version, or routing changes trigger security re-evaluation before continued use.
  - section_code: 3.3.1
    description: Verify that production deployments implement rollout mechanisms with automated rollback triggers.
  - section_code: 3.3.2
    description: Verify that rollback capabilities restore the complete model state.
  - section_code: 3.3.3
    description: Verify that model versions running in parallel use isolated runtime state so that AI-specific shared resources
      are not shared across deployments.
  - section_code: 3.4.1
    description: Verify that AI-specific runtime components are not shared across environment boundaries (e.g., development,
      staging, production).
  - section_code: 3.4.2
    description: Verify that model training and fine-tuning environments are isolated from production environments.
  - section_code: 3.5.1
    description: Verify that models used in RLHF fine-tuning are versioned and integrity-verified before use in a training
      run.
  - section_code: 3.5.2
    description: Verify that RLHF training stages include automated detection of reward hacking or reward model over-optimization.
  - section_code: 3.5.3
    description: Verify that in multi-stage fine-tuning pipelines, each stage's output is integrity-verified before it is
      consumed by the next stage.
  - section_code: 3.5.4
    description: Verify that fine-tuning checkpoints are registered as distinct artifacts.
  - section_code: 4.1.1
    description: Verify that AI models execute in isolated sandboxes.
  - section_code: 4.1.2
    description: Verify that model artifact loading enforces an explicit allow-list of serialization formats that do not permit
      arbitrary code execution during deserialization.
  - section_code: 4.1.3
    description: Verify that workload attestation is performed before model loading to provide proof that the execution environment
      has not been tampered with.
  - section_code: 4.1.4
    description: Verify that confidential inference services protect model weights during runtime through isolated execution
      environments.
  - section_code: 4.2.1
    description: Verify that AI accelerator (GPU) firmware is version-pinned, signed, and attested at boot.
  - section_code: 4.2.2
    description: Verify that execution within a trusted execution environment (TEE) provides hardware-enforced isolation,
      memory encryption, and integrity protection.
  - section_code: 4.2.3
    description: Verify that AI accelerator (GPU) integrity is validated using hardware-based attestation mechanisms before
      each workload executes.
  - section_code: 4.2.4
    description: Verify that accelerator (GPU) memory is isolated between workloads through partitioning mechanisms with memory
      sanitization between jobs.
  - section_code: 4.2.5
    description: Verify that accelerator interconnects are restricted to approved topologies and authenticated endpoints.
  - section_code: 4.3.1
    description: Verify that edge AI devices authenticate to central infrastructure using strong authentication mechanisms.
  - section_code: 4.3.2
    description: Verify that models deployed to edge or mobile devices are cryptographically signed during packaging, and
      that the on-device runtime validates these signatures or checksums before loading or inference.
  - section_code: 4.3.3
    description: Verify that inference runtimes enforce process, memory, and file access isolation.
  - section_code: 4.3.4
    description: Verify that model weights and sensitive parameters stored locally are encrypted using hardware-backed key
      stores or secure enclaves.
  - section_code: 4.3.5
    description: Verify that models packaged within mobile, IoT, or embedded applications are encrypted at rest, and decrypted
      only inside a trusted runtime or secure enclave, preventing direct extraction from the app package or filesystem.
  - section_code: 5.1.1
    description: Verify that high-risk AI operations (model deployment, weight export, training data access, production configuration
      changes) require step-up authentication.
  - section_code: 5.1.2
    description: Verify that AI agents in federated or multi-system deployments authenticate using short-lived, minimal-scoped,
      cryptographically signed tokens.
  - section_code: 5.2.1
    description: Verify that every AI resource (datasets, endpoints, vector collections, embedding indices, compute instances)
      enforces access controls with explicit allow-lists and default-deny policies.
  - section_code: 5.2.2
    description: Verify that retrieval pipelines (e.g., RAG queries, embedding lookups) enforce the end-user's authorization
      context at each retrieval and assembly stage, rather than relying solely on the service account's permissions.
  - section_code: 5.2.3
    description: Verify that sensitive data is retrieved via retrieval pipelines (e.g., RAG queries, embedding lookups) to
      prevent permanent storage in models.
  - section_code: 5.2.4
    description: Verify that post-inference filtering mechanisms prevent responses from including data that the requester
      is not authorized to receive.
  - section_code: 5.2.5
    description: Verify that the policy decision point for agent authorization is isolated from the agent's execution environment.
  - section_code: 5.2.6
    description: Verify that privileged access to model weights, training pipelines, and production AI configuration is granted
      just in time, with a defined maximum session duration and automatic expiry. Zero Standing Privilege (ZSP) to these resources
      is encouraged.
  - section_code: 5.2.7
    description: Verify that data classification labels propagate to downstream resources (embeddings, prompt caches, model
      outputs).
  - section_code: 5.3.1
    description: Verify that shared model serving infrastructure prevents one tenant's fine-tuning, inference, or embedding
      operations from influencing or observing another tenant's operations.
  - section_code: 5.3.2
    description: Verify that one tenant cannot influence or observe another tenant's operations through shared compute resources.
      Satisfying this requirement typically requires hardware partitioning, confidential computing, or dedicated per-tenant
      compute allocation.
  - section_code: 6.1.1
    description: Verify that models are scanned for malicious code before import.
  - section_code: 6.1.2
    description: Verify that model weights, datasets, and fine-tuning adapters are downloaded only from approved sources.
  - section_code: 6.1.3
    description: Verify that every third-party model artifact can be integrity-verified.
  - section_code: 6.1.4
    description: Verify that models pass a behavioral acceptance test suite before being promoted to any non-development environment.
  - section_code: 6.2.1
    description: Verify that every model artifact publishes a version-controlled, machine-readable AI BOM listing datasets,
      weights, licenses, and data-origin statements.
  - section_code: 6.2.2
    description: Verify that AI BOMs are cryptographically signed before deployment.
  - section_code: 6.2.3
    description: Verify that AI BOM completeness checks fail the build if any component metadata is missing.
  - section_code: 7.1.1
    description: Verify that the application validates all model outputs against a defined schema and rejects any output that
      does not match.
  - section_code: 7.1.2
    description: Verify that model-generated output is bounded by length limits and termination controls.
  - section_code: 7.2.1
    description: Verify that the system assesses the reliability of generated answers using a confidence estimation method.
  - section_code: 7.2.2
    description: Verify that the application automatically blocks answers or switches to a fallback message if the confidence
      score drops below a defined threshold.
  - section_code: 7.2.3
    description: Verify that for responses classified as high-risk by policy, the system performs an additional verification
      step.
  - section_code: 7.3.1
    description: Verify that automated classifiers scan every response and block content that matches defined harmful content
      categories.
  - section_code: 7.3.2
    description: Verify that output filters detect and block responses that disclose system prompt content or backend data.
  - section_code: 7.3.3
    description: Verify that model-generated output is prevented from triggering outbound requests.
  - section_code: 7.3.4
    description: Verify that model outputs are checked for hidden, encoded, or misleading content created through homoglyphs,
      formatting, metadata, or structured fields.
  - section_code: 7.4.1
    description: Verify that responses generated using retrieval-augmented generation (RAG) include attribution to the source
      documents.
  - section_code: 7.4.2
    description: Verify that RAG attributions are derived from retrieval metadata and are not generated by the model, so provenance
      cannot be fabricated.
  - section_code: 7.4.3
    description: Verify that claims in a RAG response can be traced to the retrieved chunk.
  - section_code: 7.4.4
    description: Verify that generated media is watermarked to prove it was AI-generated.
  - section_code: 8.1.1
    description: Verify that vector identifiers and namespaces enforce uniqueness per tenant and prevent cross-tenant collisions.
  - section_code: 8.1.2
    description: Verify that document metadata tags are immutable after the initial write.
  - section_code: 8.1.3
    description: Verify that retrieval operations enforce scope constraints.
  - section_code: 8.2.1
    description: Verify that sensitive fields are detected before embedding and are masked, tokenized, or dropped.
  - section_code: 8.2.2
    description: Verify that vectors that fall outside normal clustering patterns are flagged and quarantined before entering
      production indices.
  - section_code: 8.2.3
    description: Verify that agent outputs and tool outputs are not automatically written to trusted agent memory without
      explicit source validation.
  - section_code: 8.2.4
    description: Verify that content crafted to manipulate retrieval results is detected and rejected or quarantined before
      vectorization.
  - section_code: 8.2.5
    description: Verify that new content written to memory is checked for contradictions with what is already stored and that
      conflicts trigger alerts.
  - section_code: 8.3.1
    description: Verify that expired vectors are excluded from retrieval results.
  - section_code: 8.3.2
    description: Verify that memory can be reset.
  - section_code: 8.3.3
    description: Verify that quarantined content is retained but excluded from all retrieval results.
  - section_code: 9.1.1
    description: Verify that per-tool quotas and timeouts (e.g., CPU, memory, disk, egress, and execution time) are enforced.
  - section_code: 9.1.2
    description: Verify that per-execution budgets (e.g., max recursion depth, token use, and monetary spend) are configured
      and enforced by the runtime.
  - section_code: 9.1.3
    description: Verify that a swarm-level kill-switch exists that can halt all active agent instances.
  - section_code: 9.2.1
    description: Verify that the agent runtime blocks execution of privileged, high-impact, or irreversible actions until
      explicit human approval is received and verified.
  - section_code: 9.2.2
    description: Verify that approval requests display canonicalized and complete action parameters, such as diffs, commands,
      recipients, amounts, resources, and scopes, without truncation or unsafe transformation.
  - section_code: 9.2.3
    description: Verify that each high-impact action has a trusted reversibility classification, such as read-only, reversible,
      externally reversible, or irreversible.
  - section_code: 9.2.4
    description: Verify that the agent runtime enforces reversibility classifications by blocking, requiring approval, or
      restricting actions based on their impact and ability to be reversed.
  - section_code: 9.2.5
    description: Verify that any self-modification capability (e.g., prompt rewriting, tool-list changes, parameter updates)
      is restricted by enforceable boundaries.
  - section_code: 9.2.6
    description: Verify that agentic systems include an AI-augmented review of planned high-risk actions before execution
      that adds to, and does not replace, the deterministic policy gate.
  - section_code: 9.2.7
    description: Verify that the AI-augmented review mechanism is protected against manipulation by adversarial inputs, and
      cannot be overridden or bypassed through prompt injection.
  - section_code: 9.2.8
    description: Verify that approvals are cryptographically bound to action parameters, requester identity, execution context,
      and a unique single-use nonce.
  - section_code: 9.2.9
    description: Verify that cryptographic key material or credentials used to issue approvals are isolated from the agent
      runtime.
  - section_code: 9.2.10
    description: Verify that approval gates for multi-step or multi-agent action chains enforce the highest-impact reversibility
      classification present anywhere in the chain.
  - section_code: 9.3.1
    description: Verify that each tool/plugin executes in a least-privilege sandbox or is otherwise isolated from model operations.
  - section_code: 9.3.2
    description: Verify that tool outputs are validated against schemas.
  - section_code: 9.3.3
    description: Verify that tool manifests declare required privileges, resource limits, and output validation requirements.
  - section_code: 9.3.4
    description: Verify that the runtime enforces the privileges, resource limits, and output-validation requirements declared
      in tool manifests.
  - section_code: 9.3.5
    description: Verify that components processing untrusted data are isolated from tool-calling capabilities, ensuring that
      compromised data processing cannot trigger unauthorized tool invocations.
  - section_code: 9.3.6
    description: Verify that there is architectural separation between processing of untrusted tool outputs and agent operations.
  - section_code: 9.3.7
    description: Verify that external resources named in model output are verified against an approved allow-list or registry
      before the agent installs or invokes them.
  - section_code: 9.3.8
    description: Verify that policy violations trigger automated tool containment.
  - section_code: 9.4.1
    description: Verify that each agent instance has a unique cryptographic identity and authenticates as a first-class principal
      to downstream systems.
  - section_code: 9.4.2
    description: Verify that agent-initiated actions are cryptographically bound to each step of the execution chain for non-repudiation.
  - section_code: 9.4.3
    description: Verify that agent identity credentials rotate on a defined schedule.
  - section_code: 9.4.4
    description: Verify that agent state persisted between invocations is integrity-protected.
  - section_code: 9.5.1
    description: Verify that agent actions are authorized against fine-grained policies enforced by the runtime that restrict
      which tools an agent may invoke, and which parameter values it may supply.
  - section_code: 9.5.2
    description: Verify that when an agent acts on a user's behalf, the runtime propagates an integrity-protected, scope-limited
      token that carries the user's authorization context and is enforced at every downstream call.
  - section_code: 9.5.3
    description: Verify that all access control decisions are enforced by application logic or a policy engine, never by the
      AI model itself.
  - section_code: 9.5.4
    description: Verify that secrets and credentials required by an agent at runtime are not exposed within the model's observable
      context, including the context window, system prompts, or tool call parameters.
  - section_code: 9.5.5
    description: Verify that inter-agent task delegation is restricted by an explicit authorization policy.
  - section_code: 9.5.6
    description: Verify that long-running agent sessions re-evaluate current backend authorization policy on every privileged
      action.
  - section_code: 9.6.1
    description: Verify that a manual kill-switch mechanism exists to immediately halt AI model inference and outputs.
  - section_code: 9.6.2
    description: Verify that when a human-approval gate is not satisfied within the defined approval time, the system blocks
      the pending action.
  - section_code: 9.6.3
    description: Verify that kill-switch commands are implemented through an out-of-band channel that is isolated from the
      agent runtime.
  - section_code: 10.1.1
    description: Verify that MCP components are obtained only from trusted sources and cryptographically verified.
  - section_code: 10.1.2
    description: Verify that only allow-listed MCP servers are permitted.
  - section_code: 10.1.3
    description: Verify that locally launched MCP servers run in a least-privilege sandbox with restricted file system, network,
      and system access.
  - section_code: 10.2.1
    description: Verify that MCP servers validate access tokens for each request and do not rely on transport security alone.
  - section_code: 10.2.2
    description: Verify that MCP servers validate the presented access token's issuer, audience, expiration, and scope claims
      in accordance with OAuth 2.1.
  - section_code: 10.2.3
    description: Verify that MCP servers acting as OAuth 2.1 resource servers do not store or persist access tokens or user
      credentials.
  - section_code: 10.2.4
    description: Verify that MCP tools/list returns only tools permitted by resource owners' authorized scopes.
  - section_code: 10.2.5
    description: Verify that MCP servers enforce access control on every tool invocation, validating that the user's access
      token authorizes both the requested tool and the specific argument values supplied.
  - section_code: 10.2.6
    description: Verify that MCP servers ensure all session artifacts are removed when a session terminates.
  - section_code: 10.2.7
    description: Verify that MCP servers do not pass through access tokens received from clients to downstream APIs.
  - section_code: 10.3.1
    description: Verify that authenticated, encrypted streamable HTTP is used for MCP transport for remote services.
  - section_code: 10.3.2
    description: Verify that stdio transport is permitted only in controlled local environments.
  - section_code: 10.3.3
    description: Verify that MCP servers validate both the Origin header and the Host header independently on all HTTP-based
      transports to prevent DNS rebinding attacks.
  - section_code: 10.3.4
    description: Verify that MCP clients enforce a minimum acceptable protocol version and reject initialize responses that
      propose a version below that minimum.
  - section_code: 10.3.5
    description: Verify that access tokens between the MCP client and server are sender-constrained using mTLS or DPoP.
  - section_code: 10.4.1
    description: Verify that MCP tools/list and tools/call responses are validated against their declared schemas before being
      injected into the model context.
  - section_code: 10.4.2
    description: Verify that MCP tools/list and tools/call responses are screened for indirect prompt injection before being
      injected into the model context.
  - section_code: 10.4.3
    description: Verify that MCP servers reject unrecognized or oversized parameters in function calls.
  - section_code: 10.4.4
    description: Verify that all MCP servers enforce strict schema validation.
  - section_code: 10.4.5
    description: Verify that all MCP transports enforce maximum payload size limits.
  - section_code: 10.4.6
    description: Verify that MCP servers sign tool responses with a unique nonce and timestamp so MCP clients can detect replay
      attempts.
  - section_code: 10.4.7
    description: Verify that MCP clients present users with explicit consent dialogue and cancellation options upon installation
      of a local MCP server.
  - section_code: 10.4.8
    description: Verify that MCP clients maintain a snapshot of tool definitions and that any change to a tool definition
      triggers re-approval before the modified tool can be invoked.
  - section_code: 11.1.1
    description: Verify that the model has undergone alignment and safety training or fine-tuning to prevent the model from
      generating disallowed content categories.
  - section_code: 11.1.2
    description: Verify that a version-controlled alignment test suite is run on every model update or release.
  - section_code: 11.1.3
    description: Verify that models are evaluated against known adversarial attack techniques relevant to their modality.
  - section_code: 11.1.4
    description: Verify that models are hardened against adversarial inputs.
  - section_code: 11.1.5
    description: Verify that an automated evaluator measures harmful-content rate and flags regressions beyond a defined threshold.
  - section_code: 11.2.1
    description: Verify that model-inferred sensitive attributes are not directly returned in outputs.
  - section_code: 11.2.2
    description: Verify that inference endpoints enforce per-principal and global rate limits sized to the extraction threat
      model, and not solely as a generic API throttle.
  - section_code: 11.2.3
    description: Verify that model outputs are calibrated to reduce overconfident predictions.
  - section_code: 11.2.4
    description: Verify that training on sensitive datasets employs differentially-private optimization.
  - section_code: 11.2.5
    description: Verify that membership-inference attack simulations demonstrate that attack accuracy does not exceed random
      guessing on evaluated data.
  - section_code: 11.3.1
    description: Verify that query-pattern analysis feeds an extraction-attempt detector.
  - section_code: 11.3.2
    description: Verify that raw model outputs are not directly exposed beyond the application backend, and that externally
      visible responses are calibrated to the extraction risk level.
  - section_code: 11.3.3
    description: Verify that model watermarking or fingerprinting techniques are applied so that unauthorized copies can be
      identified.
  - section_code: 11.3.4
    description: Verify that detection of suspected extraction triggers response measures.
  - section_code: 11.4.1
    description: Verify that inputs from external or untrusted sources pass through anomaly detection before model inference.
  - section_code: 11.4.2
    description: Verify that inputs flagged as anomalous trigger gating actions.
  - section_code: 11.4.3
    description: Verify that the safety violation feedback pipeline includes poisoning detection and human review gates to
      prevent adversarial manipulation of the improvement mechanism.
  - section_code: 12.1.1
    description: Verify that AI interactions are logged with session context and AI-specific telemetry.
  - section_code: 12.1.2
    description: Verify that safety filtering and policy decisions are logged with sufficient detail to support audit, debugging,
      and forensic analysis of content moderation systems.
  - section_code: 12.1.3
    description: Verify that log entries for AI inference events follow a structured, interoperable schema that includes at
      least the model identifier, token usage (input and output), provider name, and operation type.
  - section_code: 12.1.4
    description: Verify that RAG pipeline retrieval events are logged, including the query, documents retrieved, and knowledge
      source.
  - section_code: 12.2.1
    description: Verify that the system detects and alerts on known jailbreak patterns, prompt injection attempts, and adversarial
      inputs.
  - section_code: 12.2.2
    description: Verify that behavioral anomaly detection identifies unusual conversation patterns, excessive retry attempts,
      or probing behaviors.
  - section_code: 12.2.3
    description: Verify that custom rules detect AI-specific threat patterns for coordinated jailbreak attempts, prompt injection,
      and system prompt extraction attempts.
  - section_code: 12.2.4
    description: Verify that extraction-alert events include offending query metadata to support investigation.
  - section_code: 12.2.5
    description: Verify that token usage is tracked at granular attribution levels including per user, per session, per feature
      endpoint, and per team or workspace.
  - section_code: 12.2.6
    description: Verify that LLM API traffic is monitored for covert-channel indicators and communication signatures to identify
      malware and command-and-control (C2) activity.
  - section_code: 12.3.1
    description: Verify that data drift detection monitors input distribution changes that may impact model performance, using
      statistically validated methods matched to the input data type (e.g., KS test or PSI for tabular numeric features, embedding-distance
      metrics for text or image).
  - section_code: 12.3.2
    description: Verify that hallucination detection monitors identify and flag model outputs that contain factually incorrect,
      inconsistent, or fabricated information.
  - section_code: 12.3.3
    description: Verify that hallucination rates are tracked as continuous time-series metrics to enable trend analysis and
      detection of sustained model degradation.
  - section_code: 12.3.4
    description: Verify that unexplained behavioral shifts are distinguished from gradual, expected operational drift.
  - section_code: 12.4.1
    description: Verify that autonomous action triggers include proactive behavior-pattern analysis, security evaluation,
      and threat-landscape assessment.
  - section_code: 12.4.2
    description: Verify that audit logs capture security-critical proactive actions, including approver identity, timestamp,
      action parameters, and decision outcomes.
  - section_code: 12.4.3
    description: Verify that kill-switch activations and override commands are logged.
  - section_code: 12.5.1
    description: Verify that dataset lineage records each dataset and its components, including all transformations, augmentations,
      and merges.
  - section_code: 12.5.2
    description: Verify that all labeling activities are recorded in logs.
  - section_code: 12.5.3
    description: Verify that all model changes generate immutable audit records.
  - section_code: 12.5.4
    description: Verify that every ingested document is tagged at write time with source, writer identity, and timestamp.
- slug: owasp-aisvs-1-0-l1
  name: OWASP AISVS L1 (Baseline)
  version: '1.0'
  issuer: OWASP Foundation
  description: AISVS verification level 1 requirements
  requirements:
  - section_code: 1.1.1
    description: Verify that training data includes only features, attributes, and fields required for the model's stated
      purpose.
  - section_code: 1.2.1
    description: Verify that labeling platforms enforce access controls that restrict who can create, modify, or approve annotations.
  - section_code: 2.1.1
    description: Verify that input normalization is applied before tokenization or embedding.
  - section_code: 2.1.2
    description: Verify that encoding and representation smuggling in inputs is detected and mitigated. Approved mitigations
      include canonicalization, strict schema validation, policy-based rejection, or explicit marking.
  - section_code: 2.1.3
    description: Verify that all inputs that could steer model behavior are treated as untrusted and screened by a prompt
      injection detection ruleset or classifier, with flagged inputs blocked.
  - section_code: 2.1.4
    description: Verify that input length controls prevent content from exceeding the context window. The controls must reject
      inputs that exceed token limits rather than truncating them.
  - section_code: 2.1.5
    description: Verify that the system implements a character set restriction for all inputs. The restriction must use an
      allow-list approach that permits only characters that are explicitly required.
  - section_code: 2.2.1
    description: Verify that every prompt is scored by a content classifier for violence, self-harm, hate, and sexual content
      against configurable thresholds. Prompts that exceed those thresholds are rejected or sanitized before reaching the
      model context.
  - section_code: 2.2.2
    description: Verify that prompt content classification is evaluated for unsupported languages.
  - section_code: 3.1.1
    description: Verify that a model registry maintains an inventory of all deployed model artifacts and their origin.
  - section_code: 3.2.1
    description: Verify that models undergo automated input validation testing, safety evaluation testing, and output sanitization
      testing before deployment.
  - section_code: 3.4.1
    description: Verify that AI-specific runtime components are not shared across environment boundaries (e.g., development,
      staging, production).
  - section_code: 4.1.1
    description: Verify that AI models execute in isolated sandboxes.
  - section_code: 4.1.2
    description: Verify that model artifact loading enforces an explicit allow-list of serialization formats that do not permit
      arbitrary code execution during deserialization.
  - section_code: 4.3.1
    description: Verify that edge AI devices authenticate to central infrastructure using strong authentication mechanisms.
  - section_code: 6.1.1
    description: Verify that models are scanned for malicious code before import.
  - section_code: 6.1.2
    description: Verify that model weights, datasets, and fine-tuning adapters are downloaded only from approved sources.
  - section_code: 6.2.1
    description: Verify that every model artifact publishes a version-controlled, machine-readable AI BOM listing datasets,
      weights, licenses, and data-origin statements.
  - section_code: 7.1.1
    description: Verify that the application validates all model outputs against a defined schema and rejects any output that
      does not match.
  - section_code: 7.1.2
    description: Verify that model-generated output is bounded by length limits and termination controls.
  - section_code: 7.3.1
    description: Verify that automated classifiers scan every response and block content that matches defined harmful content
      categories.
  - section_code: 7.4.1
    description: Verify that responses generated using retrieval-augmented generation (RAG) include attribution to the source
      documents.
  - section_code: 7.4.2
    description: Verify that RAG attributions are derived from retrieval metadata and are not generated by the model, so provenance
      cannot be fabricated.
  - section_code: 8.1.1
    description: Verify that vector identifiers and namespaces enforce uniqueness per tenant and prevent cross-tenant collisions.
  - section_code: 8.2.1
    description: Verify that sensitive fields are detected before embedding and are masked, tokenized, or dropped.
  - section_code: 9.1.1
    description: Verify that per-tool quotas and timeouts (e.g., CPU, memory, disk, egress, and execution time) are enforced.
  - section_code: 9.1.2
    description: Verify that per-execution budgets (e.g., max recursion depth, token use, and monetary spend) are configured
      and enforced by the runtime.
  - section_code: 9.2.1
    description: Verify that the agent runtime blocks execution of privileged, high-impact, or irreversible actions until
      explicit human approval is received and verified.
  - section_code: 9.3.1
    description: Verify that each tool/plugin executes in a least-privilege sandbox or is otherwise isolated from model operations.
  - section_code: 9.3.2
    description: Verify that tool outputs are validated against schemas.
  - section_code: 9.6.1
    description: Verify that a manual kill-switch mechanism exists to immediately halt AI model inference and outputs.
  - section_code: 10.1.1
    description: Verify that MCP components are obtained only from trusted sources and cryptographically verified.
  - section_code: 10.2.1
    description: Verify that MCP servers validate access tokens for each request and do not rely on transport security alone.
  - section_code: 10.2.2
    description: Verify that MCP servers validate the presented access token's issuer, audience, expiration, and scope claims
      in accordance with OAuth 2.1.
  - section_code: 10.2.3
    description: Verify that MCP servers acting as OAuth 2.1 resource servers do not store or persist access tokens or user
      credentials.
  - section_code: 10.3.1
    description: Verify that authenticated, encrypted streamable HTTP is used for MCP transport for remote services.
  - section_code: 10.3.2
    description: Verify that stdio transport is permitted only in controlled local environments.
  - section_code: 10.4.1
    description: Verify that MCP tools/list and tools/call responses are validated against their declared schemas before being
      injected into the model context.
  - section_code: 10.4.2
    description: Verify that MCP tools/list and tools/call responses are screened for indirect prompt injection before being
      injected into the model context.
  - section_code: 10.4.3
    description: Verify that MCP servers reject unrecognized or oversized parameters in function calls.
  - section_code: 11.1.1
    description: Verify that the model has undergone alignment and safety training or fine-tuning to prevent the model from
      generating disallowed content categories.
  - section_code: 11.1.2
    description: Verify that a version-controlled alignment test suite is run on every model update or release.
  - section_code: 11.1.3
    description: Verify that models are evaluated against known adversarial attack techniques relevant to their modality.
  - section_code: 11.2.1
    description: Verify that model-inferred sensitive attributes are not directly returned in outputs.
  - section_code: 11.2.2
    description: Verify that inference endpoints enforce per-principal and global rate limits sized to the extraction threat
      model, and not solely as a generic API throttle.
  - section_code: 11.3.1
    description: Verify that query-pattern analysis feeds an extraction-attempt detector.
  - section_code: 12.1.1
    description: Verify that AI interactions are logged with session context and AI-specific telemetry.
  - section_code: 12.2.1
    description: Verify that the system detects and alerts on known jailbreak patterns, prompt injection attempts, and adversarial
      inputs.
  - section_code: 12.3.1
    description: Verify that data drift detection monitors input distribution changes that may impact model performance, using
      statistically validated methods matched to the input data type (e.g., KS test or PSI for tabular numeric features, embedding-distance
      metrics for text or image).
  - section_code: 12.5.1
    description: Verify that dataset lineage records each dataset and its components, including all transformations, augmentations,
      and merges.
  - section_code: 12.5.2
    description: Verify that all labeling activities are recorded in logs.
- slug: owasp-aisvs-1-0-l2
  name: OWASP AISVS L2 (Standard)
  version: '1.0'
  issuer: OWASP Foundation
  description: AISVS verification level 2 requirements
  requirements:
  - section_code: 1.1.2
    description: Verify that an up-to-date inventory is kept of every training-data source, including its origin, responsible
      party, license, collection method, intended use constraints, and processing history.
  - section_code: 1.1.3
    description: Verify that data integrity is provided when training data is stored and transferred.
  - section_code: 1.1.4
    description: Verify that integrity monitoring is applied to guard against unauthorized modifications or corruption of
      training data.
  - section_code: 1.2.2
    description: Verify that cryptographic integrity is applied to labeling artifacts.
  - section_code: 1.2.3
    description: Verify that sensitive information in labels is redacted, anonymized, or encrypted before being used in any
      labeling artifact.
  - section_code: 1.3.1
    description: Verify that training and fine-tuning pipelines implement poisoning detection techniques to identify potential
      data poisoning or unintentional corruption in training data.
  - section_code: 1.3.2
    description: Verify that automatically generated labels are subject to confidence thresholds and consistency checks to
      detect misleading or low-confidence labels.
  - section_code: 1.3.3
    description: Verify that models used in security-relevant decisions are evaluated for bias patterns.
  - section_code: 1.3.4
    description: Verify that disallowed content is detected and removed before training.
  - section_code: 2.1.6
    description: Verify that the system enforces an instruction hierarchy in which system and developer messages override
      user instructions and other untrusted inputs, even after user instructions have been processed.
  - section_code: 2.1.7
    description: Verify that reserved special tokens are encoded as literal characters and cannot be injected into the model
      context.
  - section_code: 2.2.3
    description: Verify that non-text inputs (image/video/audio) are checked for adversarial perturbations, steganographic
      payloads, hidden or embedded content, or known attack patterns.
  - section_code: 3.1.2
    description: Verify that all model artifacts (weights, configurations, tokenizers, base models, fine-tunes, adapters,
      and safety/policy models) are cryptographically signed by authorized entities.
  - section_code: 3.1.3
    description: Verify that model cryptographic signatures are verified at deployment admission and on load.
  - section_code: 3.2.2
    description: Verify that models subjected to post-training quantization are re-evaluated against the same safety and alignment
      test suite on the compressed artifact before deployment.
  - section_code: 3.3.1
    description: Verify that production deployments implement rollout mechanisms with automated rollback triggers.
  - section_code: 3.3.2
    description: Verify that rollback capabilities restore the complete model state.
  - section_code: 3.3.3
    description: Verify that model versions running in parallel use isolated runtime state so that AI-specific shared resources
      are not shared across deployments.
  - section_code: 3.4.2
    description: Verify that model training and fine-tuning environments are isolated from production environments.
  - section_code: 3.5.1
    description: Verify that models used in RLHF fine-tuning are versioned and integrity-verified before use in a training
      run.
  - section_code: 4.2.1
    description: Verify that AI accelerator (GPU) firmware is version-pinned, signed, and attested at boot.
  - section_code: 4.3.2
    description: Verify that models deployed to edge or mobile devices are cryptographically signed during packaging, and
      that the on-device runtime validates these signatures or checksums before loading or inference.
  - section_code: 5.2.1
    description: Verify that every AI resource (datasets, endpoints, vector collections, embedding indices, compute instances)
      enforces access controls with explicit allow-lists and default-deny policies.
  - section_code: 5.2.2
    description: Verify that retrieval pipelines (e.g., RAG queries, embedding lookups) enforce the end-user's authorization
      context at each retrieval and assembly stage, rather than relying solely on the service account's permissions.
  - section_code: 5.2.3
    description: Verify that sensitive data is retrieved via retrieval pipelines (e.g., RAG queries, embedding lookups) to
      prevent permanent storage in models.
  - section_code: 5.2.4
    description: Verify that post-inference filtering mechanisms prevent responses from including data that the requester
      is not authorized to receive.
  - section_code: 5.2.5
    description: Verify that the policy decision point for agent authorization is isolated from the agent's execution environment.
  - section_code: 5.3.1
    description: Verify that shared model serving infrastructure prevents one tenant's fine-tuning, inference, or embedding
      operations from influencing or observing another tenant's operations.
  - section_code: 6.1.3
    description: Verify that every third-party model artifact can be integrity-verified.
  - section_code: 6.1.4
    description: Verify that models pass a behavioral acceptance test suite before being promoted to any non-development environment.
  - section_code: 6.2.2
    description: Verify that AI BOMs are cryptographically signed before deployment.
  - section_code: 6.2.3
    description: Verify that AI BOM completeness checks fail the build if any component metadata is missing.
  - section_code: 7.2.1
    description: Verify that the system assesses the reliability of generated answers using a confidence estimation method.
  - section_code: 7.2.2
    description: Verify that the application automatically blocks answers or switches to a fallback message if the confidence
      score drops below a defined threshold.
  - section_code: 7.3.2
    description: Verify that output filters detect and block responses that disclose system prompt content or backend data.
  - section_code: 7.3.3
    description: Verify that model-generated output is prevented from triggering outbound requests.
  - section_code: 7.4.3
    description: Verify that claims in a RAG response can be traced to the retrieved chunk.
  - section_code: 8.1.2
    description: Verify that document metadata tags are immutable after the initial write.
  - section_code: 8.1.3
    description: Verify that retrieval operations enforce scope constraints.
  - section_code: 8.2.2
    description: Verify that vectors that fall outside normal clustering patterns are flagged and quarantined before entering
      production indices.
  - section_code: 8.2.3
    description: Verify that agent outputs and tool outputs are not automatically written to trusted agent memory without
      explicit source validation.
  - section_code: 8.3.1
    description: Verify that expired vectors are excluded from retrieval results.
  - section_code: 8.3.2
    description: Verify that memory can be reset.
  - section_code: 9.1.3
    description: Verify that a swarm-level kill-switch exists that can halt all active agent instances.
  - section_code: 9.2.2
    description: Verify that approval requests display canonicalized and complete action parameters, such as diffs, commands,
      recipients, amounts, resources, and scopes, without truncation or unsafe transformation.
  - section_code: 9.2.3
    description: Verify that each high-impact action has a trusted reversibility classification, such as read-only, reversible,
      externally reversible, or irreversible.
  - section_code: 9.2.4
    description: Verify that the agent runtime enforces reversibility classifications by blocking, requiring approval, or
      restricting actions based on their impact and ability to be reversed.
  - section_code: 9.2.5
    description: Verify that any self-modification capability (e.g., prompt rewriting, tool-list changes, parameter updates)
      is restricted by enforceable boundaries.
  - section_code: 9.2.6
    description: Verify that agentic systems include an AI-augmented review of planned high-risk actions before execution
      that adds to, and does not replace, the deterministic policy gate.
  - section_code: 9.2.7
    description: Verify that the AI-augmented review mechanism is protected against manipulation by adversarial inputs, and
      cannot be overridden or bypassed through prompt injection.
  - section_code: 9.3.3
    description: Verify that tool manifests declare required privileges, resource limits, and output validation requirements.
  - section_code: 9.3.4
    description: Verify that the runtime enforces the privileges, resource limits, and output-validation requirements declared
      in tool manifests.
  - section_code: 9.3.5
    description: Verify that components processing untrusted data are isolated from tool-calling capabilities, ensuring that
      compromised data processing cannot trigger unauthorized tool invocations.
  - section_code: 9.3.6
    description: Verify that there is architectural separation between processing of untrusted tool outputs and agent operations.
  - section_code: 9.3.7
    description: Verify that external resources named in model output are verified against an approved allow-list or registry
      before the agent installs or invokes them.
  - section_code: 9.4.1
    description: Verify that each agent instance has a unique cryptographic identity and authenticates as a first-class principal
      to downstream systems.
  - section_code: 9.4.2
    description: Verify that agent-initiated actions are cryptographically bound to each step of the execution chain for non-repudiation.
  - section_code: 9.5.1
    description: Verify that agent actions are authorized against fine-grained policies enforced by the runtime that restrict
      which tools an agent may invoke, and which parameter values it may supply.
  - section_code: 9.5.2
    description: Verify that when an agent acts on a user's behalf, the runtime propagates an integrity-protected, scope-limited
      token that carries the user's authorization context and is enforced at every downstream call.
  - section_code: 9.5.3
    description: Verify that all access control decisions are enforced by application logic or a policy engine, never by the
      AI model itself.
  - section_code: 9.5.4
    description: Verify that secrets and credentials required by an agent at runtime are not exposed within the model's observable
      context, including the context window, system prompts, or tool call parameters.
  - section_code: 9.5.5
    description: Verify that inter-agent task delegation is restricted by an explicit authorization policy.
  - section_code: 9.6.2
    description: Verify that when a human-approval gate is not satisfied within the defined approval time, the system blocks
      the pending action.
  - section_code: 10.1.2
    description: Verify that only allow-listed MCP servers are permitted.
  - section_code: 10.1.3
    description: Verify that locally launched MCP servers run in a least-privilege sandbox with restricted file system, network,
      and system access.
  - section_code: 10.2.4
    description: Verify that MCP tools/list returns only tools permitted by resource owners' authorized scopes.
  - section_code: 10.2.5
    description: Verify that MCP servers enforce access control on every tool invocation, validating that the user's access
      token authorizes both the requested tool and the specific argument values supplied.
  - section_code: 10.2.6
    description: Verify that MCP servers ensure all session artifacts are removed when a session terminates.
  - section_code: 10.2.7
    description: Verify that MCP servers do not pass through access tokens received from clients to downstream APIs.
  - section_code: 10.3.3
    description: Verify that MCP servers validate both the Origin header and the Host header independently on all HTTP-based
      transports to prevent DNS rebinding attacks.
  - section_code: 10.3.4
    description: Verify that MCP clients enforce a minimum acceptable protocol version and reject initialize responses that
      propose a version below that minimum.
  - section_code: 10.4.4
    description: Verify that all MCP servers enforce strict schema validation.
  - section_code: 10.4.5
    description: Verify that all MCP transports enforce maximum payload size limits.
  - section_code: 10.4.6
    description: Verify that MCP servers sign tool responses with a unique nonce and timestamp so MCP clients can detect replay
      attempts.
  - section_code: 10.4.7
    description: Verify that MCP clients present users with explicit consent dialogue and cancellation options upon installation
      of a local MCP server.
  - section_code: 11.1.4
    description: Verify that models are hardened against adversarial inputs.
  - section_code: 11.2.3
    description: Verify that model outputs are calibrated to reduce overconfident predictions.
  - section_code: 11.2.4
    description: Verify that training on sensitive datasets employs differentially-private optimization.
  - section_code: 11.3.2
    description: Verify that raw model outputs are not directly exposed beyond the application backend, and that externally
      visible responses are calibrated to the extraction risk level.
  - section_code: 11.4.1
    description: Verify that inputs from external or untrusted sources pass through anomaly detection before model inference.
  - section_code: 11.4.2
    description: Verify that inputs flagged as anomalous trigger gating actions.
  - section_code: 12.1.2
    description: Verify that safety filtering and policy decisions are logged with sufficient detail to support audit, debugging,
      and forensic analysis of content moderation systems.
  - section_code: 12.1.3
    description: Verify that log entries for AI inference events follow a structured, interoperable schema that includes at
      least the model identifier, token usage (input and output), provider name, and operation type.
  - section_code: 12.1.4
    description: Verify that RAG pipeline retrieval events are logged, including the query, documents retrieved, and knowledge
      source.
  - section_code: 12.2.2
    description: Verify that behavioral anomaly detection identifies unusual conversation patterns, excessive retry attempts,
      or probing behaviors.
  - section_code: 12.2.3
    description: Verify that custom rules detect AI-specific threat patterns for coordinated jailbreak attempts, prompt injection,
      and system prompt extraction attempts.
  - section_code: 12.2.4
    description: Verify that extraction-alert events include offending query metadata to support investigation.
  - section_code: 12.2.5
    description: Verify that token usage is tracked at granular attribution levels including per user, per session, per feature
      endpoint, and per team or workspace.
  - section_code: 12.3.2
    description: Verify that hallucination detection monitors identify and flag model outputs that contain factually incorrect,
      inconsistent, or fabricated information.
  - section_code: 12.3.3
    description: Verify that hallucination rates are tracked as continuous time-series metrics to enable trend analysis and
      detection of sustained model degradation.
  - section_code: 12.4.1
    description: Verify that autonomous action triggers include proactive behavior-pattern analysis, security evaluation,
      and threat-landscape assessment.
  - section_code: 12.4.2
    description: Verify that audit logs capture security-critical proactive actions, including approver identity, timestamp,
      action parameters, and decision outcomes.
  - section_code: 12.4.3
    description: Verify that kill-switch activations and override commands are logged.
  - section_code: 12.5.3
    description: Verify that all model changes generate immutable audit records.
  - section_code: 12.5.4
    description: Verify that every ingested document is tagged at write time with source, writer identity, and timestamp.
- slug: owasp-aisvs-1-0-l3
  name: OWASP AISVS L3 (Advanced)
  version: '1.0'
  issuer: OWASP Foundation
  description: AISVS verification level 3 requirements
  requirements:
  - section_code: 1.1.5
    description: Verify that datasets are watermarked so their use can be attributed and any unauthorized use detected.
  - section_code: 1.3.5
    description: Verify that defenses against clean-label poisoning attacks are implemented.
  - section_code: 2.1.8
    description: Verify that the system can detect many-shot jailbreaking patterns.
  - section_code: 2.2.4
    description: Verify that coordinated attacks spanning multiple input types (e.g., steganographic payloads in images combined
      with prompt injection in text) are detected and blocked.
  - section_code: 3.2.3
    description: Verify that provider model, version, or routing changes trigger security re-evaluation before continued use.
  - section_code: 3.5.2
    description: Verify that RLHF training stages include automated detection of reward hacking or reward model over-optimization.
  - section_code: 3.5.3
    description: Verify that in multi-stage fine-tuning pipelines, each stage's output is integrity-verified before it is
      consumed by the next stage.
  - section_code: 3.5.4
    description: Verify that fine-tuning checkpoints are registered as distinct artifacts.
  - section_code: 4.1.3
    description: Verify that workload attestation is performed before model loading to provide proof that the execution environment
      has not been tampered with.
  - section_code: 4.1.4
    description: Verify that confidential inference services protect model weights during runtime through isolated execution
      environments.
  - section_code: 4.2.2
    description: Verify that execution within a trusted execution environment (TEE) provides hardware-enforced isolation,
      memory encryption, and integrity protection.
  - section_code: 4.2.3
    description: Verify that AI accelerator (GPU) integrity is validated using hardware-based attestation mechanisms before
      each workload executes.
  - section_code: 4.2.4
    description: Verify that accelerator (GPU) memory is isolated between workloads through partitioning mechanisms with memory
      sanitization between jobs.
  - section_code: 4.2.5
    description: Verify that accelerator interconnects are restricted to approved topologies and authenticated endpoints.
  - section_code: 4.3.3
    description: Verify that inference runtimes enforce process, memory, and file access isolation.
  - section_code: 4.3.4
    description: Verify that model weights and sensitive parameters stored locally are encrypted using hardware-backed key
      stores or secure enclaves.
  - section_code: 4.3.5
    description: Verify that models packaged within mobile, IoT, or embedded applications are encrypted at rest, and decrypted
      only inside a trusted runtime or secure enclave, preventing direct extraction from the app package or filesystem.
  - section_code: 5.1.1
    description: Verify that high-risk AI operations (model deployment, weight export, training data access, production configuration
      changes) require step-up authentication.
  - section_code: 5.1.2
    description: Verify that AI agents in federated or multi-system deployments authenticate using short-lived, minimal-scoped,
      cryptographically signed tokens.
  - section_code: 5.2.6
    description: Verify that privileged access to model weights, training pipelines, and production AI configuration is granted
      just in time, with a defined maximum session duration and automatic expiry. Zero Standing Privilege (ZSP) to these resources
      is encouraged.
  - section_code: 5.2.7
    description: Verify that data classification labels propagate to downstream resources (embeddings, prompt caches, model
      outputs).
  - section_code: 5.3.2
    description: Verify that one tenant cannot influence or observe another tenant's operations through shared compute resources.
      Satisfying this requirement typically requires hardware partitioning, confidential computing, or dedicated per-tenant
      compute allocation.
  - section_code: 7.2.3
    description: Verify that for responses classified as high-risk by policy, the system performs an additional verification
      step.
  - section_code: 7.3.4
    description: Verify that model outputs are checked for hidden, encoded, or misleading content created through homoglyphs,
      formatting, metadata, or structured fields.
  - section_code: 7.4.4
    description: Verify that generated media is watermarked to prove it was AI-generated.
  - section_code: 8.2.4
    description: Verify that content crafted to manipulate retrieval results is detected and rejected or quarantined before
      vectorization.
  - section_code: 8.2.5
    description: Verify that new content written to memory is checked for contradictions with what is already stored and that
      conflicts trigger alerts.
  - section_code: 8.3.3
    description: Verify that quarantined content is retained but excluded from all retrieval results.
  - section_code: 9.2.8
    description: Verify that approvals are cryptographically bound to action parameters, requester identity, execution context,
      and a unique single-use nonce.
  - section_code: 9.2.9
    description: Verify that cryptographic key material or credentials used to issue approvals are isolated from the agent
      runtime.
  - section_code: 9.2.10
    description: Verify that approval gates for multi-step or multi-agent action chains enforce the highest-impact reversibility
      classification present anywhere in the chain.
  - section_code: 9.3.8
    description: Verify that policy violations trigger automated tool containment.
  - section_code: 9.4.3
    description: Verify that agent identity credentials rotate on a defined schedule.
  - section_code: 9.4.4
    description: Verify that agent state persisted between invocations is integrity-protected.
  - section_code: 9.5.6
    description: Verify that long-running agent sessions re-evaluate current backend authorization policy on every privileged
      action.
  - section_code: 9.6.3
    description: Verify that kill-switch commands are implemented through an out-of-band channel that is isolated from the
      agent runtime.
  - section_code: 10.3.5
    description: Verify that access tokens between the MCP client and server are sender-constrained using mTLS or DPoP.
  - section_code: 10.4.8
    description: Verify that MCP clients maintain a snapshot of tool definitions and that any change to a tool definition
      triggers re-approval before the modified tool can be invoked.
  - section_code: 11.1.5
    description: Verify that an automated evaluator measures harmful-content rate and flags regressions beyond a defined threshold.
  - section_code: 11.2.5
    description: Verify that membership-inference attack simulations demonstrate that attack accuracy does not exceed random
      guessing on evaluated data.
  - section_code: 11.3.3
    description: Verify that model watermarking or fingerprinting techniques are applied so that unauthorized copies can be
      identified.
  - section_code: 11.3.4
    description: Verify that detection of suspected extraction triggers response measures.
  - section_code: 11.4.3
    description: Verify that the safety violation feedback pipeline includes poisoning detection and human review gates to
      prevent adversarial manipulation of the improvement mechanism.
  - section_code: 12.2.6
    description: Verify that LLM API traffic is monitored for covert-channel indicators and communication signatures to identify
      malware and command-and-control (C2) activity.
  - section_code: 12.3.4
    description: Verify that unexplained behavioral shifts are distinguished from gradual, expected operational drift.
