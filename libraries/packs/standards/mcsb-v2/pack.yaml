    description: 'Logging and threat detection: Enable threat detection capabilities'
  - section_code: LT-2
    description: 'Logging and threat detection: Enable threat detection for identity and access management'
  - section_code: LT-3
    description: 'Logging and threat detection: Enable logging for security investigation'
  - section_code: LT-4
    description: 'Logging and threat detection: Enable network logging for security investigation'
