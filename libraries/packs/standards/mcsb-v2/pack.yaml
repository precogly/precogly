    description: 'Network security: Establish network segmentation boundaries'
  - section_code: NS-2
    description: 'Network security: Secure cloud native services with network controls'
  - section_code: NS-3
    description: 'Network security: Deploy firewall at the edge of enterprise network'
  - section_code: NS-4
    description: 'Network security: Deploy intrusion detection/intrusion prevention systems (IDS/IPS)'
  - section_code: NS-5
    description: 'Network security: Deploy DDoS protection'
  - section_code: NS-6
    description: 'Network security: Deploy web application firewall'
  - section_code: NS-7
    description: 'Network security: Manage network security centrally and effectively'
  - section_code: NS-8
    description: 'Network security: Detect and disable insecure services and protocols'
  - section_code: NS-9
    description: 'Network security: Connect on-premises or cloud network privately'
  - section_code: NS-10
    description: 'Network security: Ensure Domain Name System (DNS) security'
  - section_code: PV-1
    description: 'Posture and vulnerability management: Define and establish secure configurations'
  - section_code: PV-2
    description: 'Posture and vulnerability management: Audit and enforce secure configurations'
  - section_code: PV-3
    description: 'Posture and vulnerability management: Define and establish secure configurations for compute resources'
  - section_code: PV-4
    description: 'Posture and vulnerability management: Audit and enforce secure configurations for compute resources'
  - section_code: PV-5
    description: 'Posture and vulnerability management: Perform vulnerability assessments'
  - section_code: PV-6
    description: 'Posture and vulnerability management: Rapidly and automatically remediate vulnerabilities'
  - section_code: PV-7
    description: 'Posture and vulnerability management: Conduct regular red team operations'
  - section_code: PA-1
    description: 'Privileged access: Separate and limit highly privileged/administrative users'
  - section_code: PA-2
    description: 'Privileged access: Avoid standing access for user accounts and permissions'
  - section_code: PA-3
