  - section_code: IR-2
    description: 'Incident response: Preparation - setup incident notification'
  - section_code: IR-3
    description: 'Incident response: Detection and analysis - create incidents based on high-quality alerts'
  - section_code: IR-4
    description: 'Incident response: Detection and analysis - investigate an incident'
  - section_code: IR-5
    description: 'Incident response: Detection and analysis - prioritize incidents'
  - section_code: IR-6
    description: 'Incident response: Containment, eradication and recovery - automate the incident handling'
  - section_code: IR-7
    description: 'Incident response: Post-incident activity - conduct lessons learned and retain evidence'
