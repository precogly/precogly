pack:
  schema_version: 1
  slug: mcsb-v2
  name: Microsoft Cloud Security Benchmark v2
  version: 1.0.0
  pack_type: compliance
  author: Precogly
  description: 'Microsoft cloud security benchmark v2 (preview): 81 security controls across network security, identity management,
    privileged access, data protection, asset management, logging and threat detection, incident response, posture and vulnerability
    management, endpoint security, backup and recovery, DevOps security and AI security. Control titles taken from Microsoft
    Learn.'
  tags:
  - compliance
  - security
  - cloud
  - microsoft
  - azure
frameworks:
- slug: mcsb-v2
  name: Microsoft cloud security benchmark
  version: 2 (preview)
  issuer: Microsoft
  description: Microsoft cloud security benchmark v2 control set. Each requirement is one control; the benchmark maps controls
    to NIST SP 800-53 Rev. 5, CIS Controls, ISO 27001, PCI DSS and SOC 2.
  requirements:
  - section_code: AI-1
    description: 'AI security: Ensure use of approved models'
  - section_code: AI-2
    description: 'AI security: Implement multi-layered content filtering'
  - section_code: AI-3
    description: 'AI security: Adopt safety meta-prompts'
  - section_code: AI-4
    description: 'AI security: Apply least privilege for agent functions'
  - section_code: AI-5
    description: 'AI security: Ensure human-in-the-loop'
  - section_code: AI-6
    description: 'AI security: Establish monitoring and detection'
  - section_code: AI-7
    description: 'AI security: Perform continuous AI Red Teaming'
  - section_code: AM-1
    description: 'Asset management: Track asset inventory and their risks'
  - section_code: AM-2
    description: 'Asset management: Use only approved services'
  - section_code: AM-3
    description: 'Asset management: Ensure security of asset lifecycle management'
  - section_code: AM-4
    description: 'Asset management: Limit access to asset management'
  - section_code: AM-5
    description: 'Asset management: Use only approved applications in virtual machine'
  - section_code: BR-1
    description: 'Backup and recovery: Ensure regular automated backups'
  - section_code: BR-2
    description: 'Backup and recovery: Protect backup and recovery data'
  - section_code: BR-3
    description: 'Backup and recovery: Monitor backups'
  - section_code: BR-4
    description: 'Backup and recovery: Regularly test backup'
  - section_code: DP-1
    description: 'Data protection: Discover, classify, and label sensitive data'
  - section_code: DP-2
    description: 'Data protection: Monitor anomalies and threats targeting sensitive data'
  - section_code: DP-3
    description: 'Data protection: Encrypt sensitive data in transit'
  - section_code: DP-4
    description: 'Data protection: Enable data at rest encryption by default'
  - section_code: DP-5
    description: 'Data protection: Use customer-managed key option in data at rest encryption when required'
  - section_code: DP-6
    description: 'Data protection: Use a secure key management process'
  - section_code: DP-7
    description: 'Data protection: Use a secure certificate management process'
  - section_code: DP-8
    description: 'Data protection: Ensure security of key and certificate repository'
  - section_code: DS-1
    description: 'DevOps security: Conduct threat modeling'
  - section_code: DS-2
    description: 'DevOps security: Secure the software supply chain'
  - section_code: DS-3
    description: 'DevOps security: Secure the DevOps infrastructure'
  - section_code: DS-4
    description: 'DevOps security: Integrate Static Application Security Testing (SAST)'
  - section_code: DS-5
    description: 'DevOps security: Integrate Dynamic Application Security Testing (DAST)'
  - section_code: DS-6
    description: 'DevOps security: Secure the workload lifecycle'
  - section_code: DS-7
    description: 'DevOps security: Implement DevOps logging and monitoring'
  - section_code: ES-1
    description: 'Endpoint security: Use Endpoint Detection and Response (EDR)'
  - section_code: ES-2
    description: 'Endpoint security: Use modern anti-malware software'
  - section_code: ES-3
    description: 'Endpoint security: Ensure anti-malware software and signatures are updated'
  - section_code: IM-1
    description: 'Identity management: Centralize identity and authentication while ensuring isolation'
  - section_code: IM-2
    description: 'Identity management: Protect identity and authentication systems'
  - section_code: IM-3
    description: 'Identity management: Manage application identities securely and automatically'
  - section_code: IM-4
    description: 'Identity management: Authenticate server and services'
  - section_code: IM-5
    description: 'Identity management: Use single sign-on (SSO) for application access'
  - section_code: IM-6
    description: 'Identity management: Use strong authentication controls'
  - section_code: IM-7
