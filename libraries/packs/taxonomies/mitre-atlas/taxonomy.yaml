    title: Steal Web Session Cookie
    reference_url: "https://atlas.mitre.org/techniques/AML.T0113"
  - external_id: AML.T0114
    title: AI Service Web Interface
    reference_url: "https://atlas.mitre.org/techniques/AML.T0114"
