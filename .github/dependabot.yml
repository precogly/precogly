version: 2

# Security updates are a repository setting and are already on, so an advisory
# opens a PR whether or not an ecosystem is listed here, and regardless of
# open-pull-requests-limit. This file adds currency and groups those security
# PRs for npm and uv.
#
# To keep the PR list short, every entry:
# - ignores major versions. Majors are migrations, done by hand when chosen.
#   The ignore only affects version updates, so a security fix that needs a
#   major still opens a PR.
# - waits 21 days after a release before proposing it (cooldown). Cooldown
#   does not apply to security updates, which open as soon as an advisory lands.
#
# commit-message repeats per entry because dependabot.yml v2 has no top-level
# defaults. prefix + include:scope gives "chore(deps): bump x from 1 to 2" —
# the convention CONTRIBUTING.md sets, and it keeps release-please from
# treating a dependency bump as a release.
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 21
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      # One PR for all security fixes instead of one per package.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
  # Directory is where pyproject.toml and uv.lock live. That is the repository
  # root since `backend` and `mcp` became one uv workspace: a workspace has a
  # single lock, and dependabot follows the lock. Pointing this at /backend
  # instead finds a pyproject with no lock beside it and updates nothing.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 21
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      uv-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 21
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker-compose-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "docker"
    directories:
      - "/frontend"
      - "/backend/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 21
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 21
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 21
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      pre-commit-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"
