name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # --from-ref resolves against the base branch, which a shallow clone
          # does not fetch.
          fetch-depth: 0
      # Pinned to an exact release: setup-uv stopped publishing floating major
      # tags after v7, so @v10 does not resolve.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.9.13'
      # uvx builds an ephemeral environment, so there is no interpreter to set
      # up. The range matches the dev group in backend/pyproject.toml, so a
      # pre-commit release cannot change the merge gate on an unrelated PR.
      - run: |
          uvx --from 'pre-commit>=4.0,<5.0' pre-commit run \
            --from-ref origin/${{ github.base_ref }} \
            --to-ref HEAD \
            --show-diff-on-failure

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker compose up -d db
      - run: docker compose run --rm backend python -m pytest

  # The MCP package's own gates. Separate from `backend` because these tests
  # import no Django — they run the tools against a stub reader — and because
  # mypy is strict here and unconfigured on the backend side. Ruff is not run
  # here: `lint` already covers the whole tree.
  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.9.13'
      # From inside the member, uv installs that member's dependencies only, not
      # the whole workspace — Django and psycopg never enter this job.
      - run: uv run mypy src
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: cd frontend && npm ci
      - run: cd frontend && npx tsc -b
      - run: cd frontend && npx vitest run

  # Browser tests against the compose stack. The backend container migrates and
  # seeds on start, so the signed-in project (frontend/e2e/global-setup.ts) can
  # log in with the demo account; the guest project needs only the frontend.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: docker compose up -d --build db backend frontend
      - run: cd frontend && npm ci
      - run: cd frontend && npx playwright install --with-deps chromium
      # global-setup waits for both services, up to three minutes.
      - run: cd frontend && npx playwright test
      - if: failure()
        run: docker compose logs backend frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results
          if-no-files-found: ignore

  # Django's deployment checklist, run against the production settings module.
  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Every deployment finding is a WARNING and the check framework only fails
      # on ERROR, so use --fail-level. --tag security drops drf_spectacular's schema warnings.
      # --no-deps skips the database: the security checks read settings only.
      #
      # SECRET_KEY and ALLOWED_HOSTS come from the environment in a deployment,
      # so with no values here the run fails on security.W009 and W020. A
      # throwaway key satisfies W009's length and entropy test without a real one
      # living in CI. This buys a regression guard on the settings module
      # but does not protect against a weak SECRET_KEY on a running deployment.
      - run: |
          docker compose run --rm --no-deps \
            -e DJANGO_SETTINGS_MODULE=config.settings.production \
            -e SECRET_KEY="$(openssl rand -base64 48)" \
            -e ALLOWED_HOSTS=precogly.example.com \
            backend python manage.py check --deploy --tag security --fail-level WARNING
