name: Deploy Documentation

# Only runs when docs-related files change on main
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'

# Allow only one deployment at a time
concurrency:
  group: docs-deploy
  cancel-in-progress: true

# Need write access to push to gh-pages branch
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 2. Build and deploy to gh-pages branch
      #
      # mkdocs-material is the whole dependency set: mkdocs.yml declares no
      # `plugins:`, and its `pymdownx.*` extensions ship with the theme.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.9.13'
      - run: uvx --from 'mkdocs-material>=9.5,<10.0' mkdocs gh-deploy --force
