name: Deploy Documentation

# Only runs when docs-related files change on main
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'

# Allow only one deployment at a time
concurrency:
  group: docs-deploy
  cancel-in-progress: true

# Need write access to push to gh-pages branch
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repo
      - uses: actions/checkout@v7

      # 2. Build and deploy to gh-pages branch
      #
      # mkdocs-material is the whole dependency set: mkdocs.yml declares no
      # `plugins:`, and its `pymdownx.*` extensions ship with the theme.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.9.13'
      - run: uvx --from 'mkdocs-material>=9.5,<10.0' mkdocs gh-deploy --force
