# Hooks run from the repository root, so every path here is repo-root-relative.
# Ruff finds its settings by walking up from each file, which means `backend/`
# and `mcp/` are each linted under their own `[tool.ruff]` — the two differ, and
# neither is repo-wide.
#
# Keep `rev` in step with the ruff version in `uv.lock`, or a commit can pass
# under `uv run ruff` and fail here under a different rule set. One workspace
# means one resolved ruff, so both members move together.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      # Lint first so the formatter's output is what actually lands in the commit.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # The hook scans staged content only; the Security workflow scans the PR's
  # commits. That split is deliberate — this one has to be fast enough that
  # nobody disables it, and CI is where the authoritative scan belongs.
  #
  # Keep `rev` in step with GITLEAKS_VERSION in
  # `.github/workflows/security.yml`, or a commit can pass locally under one
  # rule set and fail in CI under another.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

# Django regenerates migrations in its own style, so formatting them would
# rewrite every new one on the commit that creates it. `backend/pyproject.toml`
# excludes them too, but that only takes effect for runs whose working
# directory is `backend/` — see the note beside `force-exclude` there.
exclude: |
  (?x)^(
    backend/.*/migrations/.*
  )$
