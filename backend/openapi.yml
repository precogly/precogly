          type: string
          nullable: true
          description: Copied from ComponentLibrary.category on creation
          maxLength: 30
        kind:
          description: |-
            CycloneDX asset type; copied from the library, editable; blank derives from the category

            * `actor` - actor
            * `agent` - agent
            * `api` - api
            * `broker` - broker
            * `cache` - cache
            * `component` - component
            * `container` - container
            * `data` - data
            * `data-store` - data-store
            * `device` - device
            * `endpoint` - endpoint
            * `function` - function
            * `gateway` - gateway
            * `infrastructure` - infrastructure
            * `interface` - interface
            * `model` - model
            * `module` - module
            * `network` - network
            * `process` - process
            * `queue` - queue
            * `resource` - resource
            * `service` - service
            * `stream` - stream
            * `subsystem` - subsystem
            * `system` - system
            * `tool` - tool
          oneOf:
          - $ref: '#/components/schemas/KindEnum'
          - $ref: '#/components/schemas/BlankEnum'
        effective_kind:
          type: string
          readOnly: true
        actor_type:
          type: string
          maxLength: 20
        data_store_type:
          type: string
          maxLength: 20
        data_sensitivity_level:
          type: string
          maxLength: 20
        orgsystem:
          type: integer
          nullable: true
          description: The inventory system a system or subsystem asset stands for
        component_library:
          type: integer
          nullable: true
          description: Null means orphaned/custom component (library item was removed)
        component_library_name:
          type: string
          readOnly: true
        zone:
          type: integer
          nullable: true
        source_integration:
          type: integer
          nullable: true
        blueprint:
          type: integer
          description: The structural model this component belongs to
        threat_model:
          type: integer
          readOnly: true
        parent_component:
          type: integer
          nullable: true
        format_metadata:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - blueprint
      - component_library_name
      - created_at
      - effective_kind
      - format_metadata
      - id
      - name
      - threat_model
      - updated_at
