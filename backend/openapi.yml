  /api/threats/:
    get:
      operationId: threats_list
      description: |-
        One endpoint for every scenario, whatever it targets.

        Filters: ``threat_model``, ``blueprint``, ``component``, ``flow``, ``zone``,
        ``boundary`` (through the targets), ``threat_library``, ``status``,
        ``triage_status``, ``number``, ``whole_system``. ``search`` matches the name,
        and ``T7`` or ``7`` matches the number.
      parameters:
      - in: query
        name: number
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: rating__level
        schema:
          type: string
          enum:
          - critical
          - high
          - info
          - low
          - medium
        description: |-
          * `info` - Info
          * `low` - Low
          * `medium` - Medium
          * `high` - High
          * `critical` - Critical
      - in: query
        name: status
        schema:
          type: string
          enum:
          - addressable
          - exposed
          - mitigated
        description: |-
          * `exposed` - Exposed
          * `addressable` - Addressable
          * `mitigated` - Mitigated
      - in: query
        name: threat_library
        schema:
          type: integer
      - in: query
        name: threat_model
        schema:
          type: integer
      - in: query
        name: triage_status
        schema:
          type: string
          enum:
          - accept
          - delegate
          - eliminate
          - mitigate
          - open
        description: |-
          * `open` - Open
          * `accept` - Accept
          * `mitigate` - Mitigate
          * `delegate` - Delegate
          * `eliminate` - Eliminate
      - in: query
        name: whole_system
        schema:
          type: boolean
      tags:
      - threats
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInstanceThreatList'
          description: ''
