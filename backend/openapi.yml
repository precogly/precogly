        id:
          type: integer
          readOnly: true
        organization:
          type: integer
        name:
          type: string
          description: Operator-facing label, e.g. 'Local LM Studio' or 'Team OpenAI'.
          maxLength: 255
        provider_type:
          $ref: '#/components/schemas/ProviderTypeEnum'
        base_url:
          type: string
          format: uri
          description: OpenAI-style root exposing /chat/completions, e.g. http://localhost:1234/v1.
          maxLength: 200
        model:
          type: string
          description: Model name/identifier the endpoint expects.
          maxLength: 255
        request_timeout:
