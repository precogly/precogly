  /api/boundaries/:
    get:
      operationId: boundaries_list
      description: ViewSet for Boundary CRUD operations.
      parameters:
      - in: query
        name: boundary_type
        schema:
          type: string
          enum:
          - data
          - functional
          - network
          - organizational
          - physical
          - process
          - trust
        description: |-
          CycloneDX boundary type

          * `data` - data
          * `functional` - functional
          * `network` - network
          * `organizational` - organizational
          * `physical` - physical
          * `process` - process
          * `trust` - trust
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: zone_a
        schema:
          type: integer
      - in: query
        name: zone_b
        schema:
          type: integer
      tags:
      - boundaries
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBoundaryList'
          description: ''
    post:
      operationId: boundaries_create
      description: ViewSet for Boundary CRUD operations.
      tags:
      - boundaries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Boundary'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Boundary'
          multipart/form-data:
            schema:
