    InstanceCountermeasure:
      type: object
      description: |-
        Serializer for InstanceCountermeasure.

        ``targets`` (``[{type, id}]`` on write) say where the control applies and
        never change a threat's status; ``implemented_by`` lists the components
        that implement it; ``implemented_by_party`` names a provider as text.
      properties:
        id:
          type: integer
          readOnly: true
        threat_model:
          type: integer
        countermeasure_library:
          type: integer
          nullable: true
          description: Null means orphaned/custom countermeasure (library item was
            removed)
        countermeasure_name:
          type: string
          writeOnly: true
        countermeasure_name_display:
          type: string
          readOnly: true
        countermeasure_description:
          type: string
          writeOnly: true
        control_functions:
          type: array
          items:
            type: string
          writeOnly: true
        control_functions_display:
          type: string
          readOnly: true
        control_nature:
          type: string
          writeOnly: true
        control_nature_display:
          type: string
          readOnly: true
        effectiveness:
          type: number
          format: double
          maximum: 1.0
          minimum: 0.0
          nullable: true
          description: User-assessed control effectiveness (0.0-1.0). Null = not yet
            assessed.
        status:
          $ref: '#/components/schemas/InstanceCountermeasureStatusEnum'
        priority:
          type: string
          maxLength: 10
        due_date:
          type: string
          format: date
          nullable: true
          description: Target completion date
        external_ticket_url:
          description: Link to Jira/GitHub/etc. ticket
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        verified_by:
          type: integer
          nullable: true
        verified_by_email:
          type: string
          format: email
          readOnly: true
        evidence_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        waiver_reason:
          type: string
        required_for_release:
          type: boolean
        assigned_owner:
          type: integer
          nullable: true
        assigned_owner_email:
          type: string
          format: email
          readOnly: true
        format_metadata:
          readOnly: true
        threat_links:
          type: array
          items:
            $ref: '#/components/schemas/CountermeasureThreatLink'
          readOnly: true
        threat_id:
          type: integer
          writeOnly: true
        auto_generated:
          type: boolean
          readOnly: true
          description: Set by library generation, cleared on the first user edit
        number:
          type: integer
          readOnly: true
          description: Unique within the threat model, assigned once, never reused
            (C3 is 3)
        display_number:
          type: string
          readOnly: true
        days_overdue:
          type: integer
          nullable: true
          description: |-
            Days past ``due_date`` for a control that is not yet in effect, else None.

            From PR #559: a POA&M scheduled completion date and the due date are
            the same thing under different vocabulary, so one field serves both.
          readOnly: true
        targets:
          type: string
        implemented_by:
          type: array
          items:
            type: integer
        implemented_by_party:
          type: string
          description: The provider that implements the control, as text (until a
            party model exists)
          maxLength: 255
        source:
          type: string
          description: 'Where the control came from: a compliance tool, a pentest,
            a vendor list'
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assigned_owner_email
      - auto_generated
      - control_functions_display
      - control_nature_display
      - countermeasure_name_display
      - created_at
      - days_overdue
      - display_number
