        ``threat_count`` is the number of threats citing the persona (plan J10).
      properties:
        id:
          type: integer
          readOnly: true
        threat_model:
          type: integer
          readOnly: true
        symbolic_name:
          type: string
          description: Machine-readable identifier, e.g., 'malicious-insider'
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 255
        description:
          type: string
        is_person:
          type: boolean
        malicious_intent:
          type: boolean
        skill_level:
          type: string
          maxLength: 100
        motivation:
          type: string
        resources:
          type: string
        objectives:
          type: string
        format_metadata:
          readOnly: true
          description: Extra fields from JSON for round-trip fidelity
        threat_count:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - format_metadata
      - id
      - name
      - symbolic_name
      - threat_count
      - threat_model
      - updated_at
    ThreatSource:
      type: object
      description: Read-only serializer for ThreatSource reference data.
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - description
      - id
      - name
      - slug
      - updated_at
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenVerify:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
      required:
      - token
    TopicEnum:
      enum:
      - availability
      - business
      - compliance
      - operational
      - performance
      - security
      - technical
      type: string
      description: |-
        * `availability` - availability
        * `business` - business
        * `compliance` - compliance
        * `operational` - operational
        * `performance` - performance
        * `security` - security
        * `technical` - technical
    TriageStatusEnum:
      enum:
      - open
      - accept
      - mitigate
      - delegate
      - eliminate
      type: string
      description: |-
        * `open` - Open
        * `accept` - Accept
        * `mitigate` - Mitigate
        * `delegate` - Delegate
        * `eliminate` - Eliminate
    UseCase:
      type: object
      description: |-
        A use case of the model, with its optional links.

        ``component_ids``, ``flow_ids`` and ``business_objective_ids`` replace the
        links they name; ``[]`` clears, an omitted field leaves the links alone.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        flow_data:
          description: 'Structured use case data: preconditions, postconditions, success_criteria,
            main_flow, alternative_flows, exceptions, notes'
        display_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        component_ids:
          type: array
          items:
            type: integer
          writeOnly: true
        flow_ids:
          type: array
          items:
            type: integer
          writeOnly: true
        business_objective_ids:
          type: array
          items:
            type: integer
          writeOnly: true
        abuse_case_count:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - abuse_case_count
      - created_at
      - id
      - name
      - updated_at
    UserDetails:
      type: object
      description: User model w/o password
      properties:
        pk:
          type: integer
          readOnly: true
          title: ID
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - email
      - pk
      - username
    ValidityEnum:
      enum:
      - unverified
      - verified
      - invalid
      - unknown
      type: string
      description: |-
        * `unverified` - Unverified
        * `verified` - Verified
        * `invalid` - Invalid
        * `unknown` - Unknown
    VerificationTest:
      type: object
      description: Serializer for VerificationTest.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        method:
          $ref: '#/components/schemas/MethodEnum'
        last_run_at:
          type: string
          format: date-time
          nullable: true
        passed:
          type: boolean
        evidence:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - method
      - name
      - updated_at
    VerifyEmail:
      type: object
      properties:
        key:
          type: string
          writeOnly: true
      required:
      - key
    Zone:
      type: object
      description: Serializer for Zone model.
      properties:
        id:
          type: integer
          readOnly: true
        blueprint:
          type: integer
        name:
          type: string
          maxLength: 255
        zone_type:
          allOf:
          - $ref: '#/components/schemas/ZoneTypeEnum'
          description: |-
            CycloneDX zone type

            * `availability` - availability
            * `compliance` - compliance
            * `data` - data
            * `deployment` - deployment
            * `functional` - functional
            * `geographic` - geographic
            * `logical` - logical
            * `network` - network
            * `organizational` - organizational
            * `physical` - physical
            * `process` - process
            * `tenant` - tenant
            * `trust` - trust
        trust_level:
          type: integer
          maximum: 100
          minimum: 0
          nullable: true
          description: 0-100 scale, null when not set
        description:
          type: string
        format_metadata:
          readOnly: true
        parent:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - blueprint
      - created_at
      - format_metadata
      - id
      - name
      - updated_at
    ZoneTypeEnum:
      enum:
      - availability
      - compliance
      - data
      - deployment
      - functional
      - geographic
      - logical
      - network
      - organizational
      - physical
      - process
      - tenant
      - trust
      type: string
      description: |-
        * `availability` - availability
        * `compliance` - compliance
        * `data` - data
        * `deployment` - deployment
        * `functional` - functional
        * `geographic` - geographic
        * `logical` - logical
        * `network` - network
        * `organizational` - organizational
        * `physical` - physical
        * `process` - process
        * `tenant` - tenant
        * `trust` - trust
