openapi: 3.0.3
info:
  title: Precogly API
  version: 0.4.0
  description: Threat Modeling Platform API
paths:
  /api/ai-providers/:
    get:
      operationId: ai_providers_list
      description: CRUD for per-tenant AI provider configs, plus a connection probe.
      parameters:
      - in: query
        name: enabled
        schema:
          type: boolean
      - in: query
        name: is_default
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: organization
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - ai-providers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAIProviderConfigList'
          description: ''
    post:
      operationId: ai_providers_create
      description: CRUD for per-tenant AI provider configs, plus a connection probe.
      tags:
      - ai-providers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIProviderConfig'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIProviderConfig'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIProviderConfig'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProviderConfig'
          description: ''
  /api/ai-providers/{id}/:
    get:
      operationId: ai_providers_retrieve
      description: CRUD for per-tenant AI provider configs, plus a connection probe.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ai provider config.
        required: true
      tags:
      - ai-providers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProviderConfig'
          description: ''
    put:
      operationId: ai_providers_update
      description: CRUD for per-tenant AI provider configs, plus a connection probe.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ai provider config.
        required: true
      tags:
      - ai-providers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIProviderConfig'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIProviderConfig'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIProviderConfig'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProviderConfig'
          description: ''
    patch:
      operationId: ai_providers_partial_update
      description: CRUD for per-tenant AI provider configs, plus a connection probe.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ai provider config.
        required: true
      tags:
      - ai-providers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAIProviderConfig'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAIProviderConfig'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAIProviderConfig'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProviderConfig'
          description: ''
    delete:
      operationId: ai_providers_destroy
      description: CRUD for per-tenant AI provider configs, plus a connection probe.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ai provider config.
        required: true
      tags:
      - ai-providers
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/ai-providers/{id}/test-connection/:
    post:
      operationId: ai_providers_test_connection_create
      description: |-
        Probe the saved endpoint server-side and report reachability.

        Returns HTTP 200 with ``{ok, detail}`` even when the provider is
        unreachable or misconfigured: a failed probe is an expected, inline-
        displayable outcome ("connection refused — is the server running?"), not
        a server error. The stored key stays on the server throughout.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ai provider config.
        required: true
      tags:
      - ai-providers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIProviderConfig'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIProviderConfig'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIProviderConfig'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProviderConfig'
          description: ''
  /api/ai-usage/summary/:
    get:
      operationId: ai_usage_summary_retrieve
      description: |-
        Aggregated AI token/cost usage for one organization.

        Backs the admin "your org spent $X on AI" report. Returns period totals plus
        the breakdowns the page shows (by feature, model, user) and a fixed 12-month
        trend. It is read-only aggregation over :class:`AIUsageRecord` — the heavy
        lifting is ``SUM``/``GROUP BY`` in Postgres, not application code.

        Scope is one organization the caller belongs to, named by an ``organization``
        query param (users can belong to several, so it can't be inferred). A
        ``window`` query param selects the period; it defaults to ``this_month``.
      tags:
      - ai-usage
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Check the credentials and return the REST Token
        if the credentials are valid and authenticated.
        Calls Django Auth login method to register User ID
        in Django session framework

        Accept the following POST parameters: username, password
        Return the REST Framework Token Object's key.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWT'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Calls Django logout method and delete the Token object
        assigned to the current User object.

        Accepts/Returns nothing.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /api/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: |-
        Calls Django Auth SetPasswordForm save method.

        Accepts the following POST parameters: new_password1, new_password2
        Returns the success/fail message.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /api/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      description: |-
        Calls Django Auth PasswordResetForm save method.

        Accepts the following POST parameters: email
