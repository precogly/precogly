services:
  db:
    image: postgres:18-alpine
    container_name: precogly-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-precogly}
      POSTGRES_USER: ${POSTGRES_USER:-precogly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-precogly_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-precogly} -d ${POSTGRES_DB:-precogly}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
    container_name: precogly-backend
    volumes:
      - ./backend:/app
      - ./libraries:/libraries
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-precogly}:${POSTGRES_PASSWORD:-precogly_dev_password}@db:5432/${POSTGRES_DB:-precogly}
      DJANGO_SETTINGS_MODULE: config.settings.development
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,backend
    depends_on:
      db:
        condition: service_healthy

  # Dev-only forwarder so the backend container can reach a model server
  # (e.g. LM Studio) running on the host via plain http://localhost:1234.
  # It shares the backend's network namespace, so its listen on :1234 IS
  # the backend's loopback, and forwards to the host. This keeps stored
  # provider base URLs portable (http://localhost:1234/v1) instead of
  # baking in the Docker-only host.docker.internal hostname.
  lmstudio-proxy:
    image: alpine/socat
    container_name: precogly-lmstudio-proxy
    network_mode: "service:backend"
    command: TCP-LISTEN:1234,fork,reuseaddr TCP:host.docker.internal:1234
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: precogly-frontend
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "5173:5173"
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
