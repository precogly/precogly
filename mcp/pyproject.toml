[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "precogly-mcp"
version = "0.1.0"
description = "MCP server for Precogly threat modeling"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Alvin Kuruvilla", email = "alvineasokuruvilla@gmail.com" },
]
dependencies = [
    "httpx2>=2.9.1",
    "mcp[cli]==2.1.*",
    "pydantic>=2.13.4",
]

[project.scripts]
precogly-mcp = "precogly_mcp.server:main"

[dependency-groups]
# The workspace resolves one version of each of these for both members, so the
# ranges shared with `backend/pyproject.toml` are written identically there. They
# cannot disagree — a narrower range on either side moves both — but a wider one
# here reads as though the two run different tools.
#
# Keep the ruff range in step with `rev` in ../.pre-commit-config.yaml.
dev = [
    "pytest>=9.1.1,<10.0",
    "pytest-cov>=5.0,<6.0",
    "hypothesis>=6",
    "syrupy>=4",
    "ruff>=0.16.3,<0.17",
    "mypy>=2.3.1,<3.0",
    "pip-audit>=2.7",
    "pre-commit>=4.0,<5.0",
    "anyio>=4.14.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/precogly_mcp"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "PTH",      # flake8-use-pathlib (prefer pathlib.Path)
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["precogly_mcp"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true
